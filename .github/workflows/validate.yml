name: Validate YAML Data

on:
  push:
    branches: [ main, develop, 'data-fill/**' ]
    paths:
      - 'data/**/*.yaml'
      - 'schemas/**/*.json'
      - 'scripts/validate.py'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'data/**/*.yaml'
      - 'schemas/**/*.json'
      - 'scripts/validate.py'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml jsonschema click rich

    - name: Validate YAML against JSON Schema
      run: |
        echo "Validating YAML files against JSON Schema..."
        python scripts/validate.py --directory data --check-duplicates

    - name: Validation failed
      if: failure()
      run: |
        echo "YAML validation failed."
        echo "Run locally: python scripts/validate.py --directory data --check-duplicates"
        exit 1
