name: Build Database and Create Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Validate YAML files
      run: |
        python scripts/validate.py --directory data
        
    - name: Build SQLite database
      run: |
        python scripts/build-sqlite.py --clean
        
    - name: Verify database integrity
      run: |
        sqlite3 evdb.db "PRAGMA integrity_check;"
        sqlite3 evdb.db "SELECT COUNT(*) FROM manufacturers;"
        sqlite3 evdb.db "SELECT COUNT(*) FROM vehicle_variants;"
        
    - name: Generate database statistics
      id: stats
      run: |
        # Collect statistics
        MANUFACTURERS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM manufacturers;')
        MODELS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM vehicle_models;')
        VARIANTS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM vehicle_variants;')
        MARKETS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM market_availability;')
        DB_SIZE=$(du -h evdb.db | cut -f1)
        
        # Output for GitHub Actions
        echo "manufacturers=$MANUFACTURERS" >> $GITHUB_OUTPUT
        echo "models=$MODELS" >> $GITHUB_OUTPUT
        echo "variants=$VARIANTS" >> $GITHUB_OUTPUT
        echo "markets=$MARKETS" >> $GITHUB_OUTPUT
        echo "db_size=$DB_SIZE" >> $GITHUB_OUTPUT
        
        # Summary for job
        echo "## Database Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Manufacturers | $MANUFACTURERS |" >> $GITHUB_STEP_SUMMARY
        echo "| Vehicle Models | $MODELS |" >> $GITHUB_STEP_SUMMARY
        echo "| Vehicle Variants | $VARIANTS |" >> $GITHUB_STEP_SUMMARY
        echo "| Market Availability | $MARKETS |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Database size: $DB_SIZE" >> $GITHUB_STEP_SUMMARY
        
    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << EOF
        # EVDB Database Release
        
        **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Commit:** ${{ github.sha }}
        
        ## Database Statistics
        
        | Category | Count |
        |----------|-------|
        | Manufacturers | ${{ steps.stats.outputs.manufacturers }} |
        | Vehicle Models | ${{ steps.stats.outputs.models }} |
        | Vehicle Variants | ${{ steps.stats.outputs.variants }} |
        | Market Availability | ${{ steps.stats.outputs.markets }} |
        
        **Database Size:** ${{ steps.stats.outputs.db_size }}
        
        ## Download
        
        Download \`evdb.db\` from the assets below to use the database locally with:
        - **Datasette:** \`datasette evdb.db --metadata metadata.json\`
        - **Python:** \`sqlite3\` library
        - **Any SQLite client**
        
        ## Usage
        
        \`\`\`bash
        # Download the database
        wget https://github.com/gaia-charge/evdb/releases/latest/download/evdb.db
        
        # Query with sqlite3
        sqlite3 evdb.db "SELECT * FROM vehicle_variants LIMIT 10;"
        
        # Or use Datasette
        datasette evdb.db
        \`\`\`
        
        ## Documentation
        
        - [API Documentation](https://github.com/gaia-charge/evdb/blob/main/API_DOCS.md)
        - [Contributing Guide](https://github.com/gaia-charge/evdb/blob/main/CONTRIBUTING.md)
        - [FAQ](https://github.com/gaia-charge/evdb/blob/main/FAQ.md)
        EOF
        
    - name: Generate timestamp
      id: timestamp
      run: |
        echo "date=$(date -u +'%Y.%m.%d')" >> $GITHUB_OUTPUT
        echo "time=$(date -u +'%H:%M')" >> $GITHUB_OUTPUT
        echo "tag=$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.timestamp.outputs.tag }}
        name: ${{ steps.timestamp.outputs.date }} ${{ steps.timestamp.outputs.time }}
        body_path: release_notes.md
        files: evdb.db
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
