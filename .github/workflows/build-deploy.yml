name: Build Database and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml jsonschema click rich

    - name: Validate YAML files
      run: python scripts/validate.py --directory data --check-duplicates

    - name: Build SQLite database
      run: python scripts/build-sqlite.py --clean

    - name: Verify database integrity
      run: |
        sqlite3 evdb.db "PRAGMA integrity_check;"
        sqlite3 evdb.db "PRAGMA foreign_key_check;"
        sqlite3 evdb.db "SELECT COUNT(*) FROM manufacturers;"
        sqlite3 evdb.db "SELECT COUNT(*) FROM vehicle_variants;"

    - name: Generate static API files
      run: python scripts/generate-api.py evdb.db _site

    - name: Generate database statistics
      id: stats
      run: |
        MANUFACTURERS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM manufacturers;')
        MODELS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM vehicle_models;')
        VARIANTS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM vehicle_variants;')
        MARKETS=$(sqlite3 evdb.db 'SELECT COUNT(*) FROM market_availability;')
        DB_SIZE=$(du -h evdb.db | cut -f1)

        echo "manufacturers=$MANUFACTURERS" >> $GITHUB_OUTPUT
        echo "models=$MODELS" >> $GITHUB_OUTPUT
        echo "variants=$VARIANTS" >> $GITHUB_OUTPUT
        echo "markets=$MARKETS" >> $GITHUB_OUTPUT
        echo "db_size=$DB_SIZE" >> $GITHUB_OUTPUT

        echo "## Database Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Manufacturers | $MANUFACTURERS |" >> $GITHUB_STEP_SUMMARY
        echo "| Vehicle Models | $MODELS |" >> $GITHUB_STEP_SUMMARY
        echo "| Vehicle Variants | $VARIANTS |" >> $GITHUB_STEP_SUMMARY
        echo "| Market Availability | $MARKETS |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Database size: $DB_SIZE" >> $GITHUB_STEP_SUMMARY

    - name: Upload database artifact
      uses: actions/upload-artifact@v4
      with:
        name: evdb
        path: evdb.db
        retention-days: 7

    - name: Upload API artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Generate release notes
      run: |
        cat > release_notes.md << EOF
        # EVDB Database Release

        **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Commit:** ${{ github.sha }}

        ## Database Statistics

        | Category | Count |
        |----------|-------|
        | Manufacturers | ${{ steps.stats.outputs.manufacturers }} |
        | Vehicle Models | ${{ steps.stats.outputs.models }} |
        | Vehicle Variants | ${{ steps.stats.outputs.variants }} |
        | Market Availability | ${{ steps.stats.outputs.markets }} |

        **Database Size:** ${{ steps.stats.outputs.db_size }}

        ## Download

        Download \`evdb.db\` from the assets below to use the database locally with:
        - **Datasette:** \`datasette evdb.db --metadata metadata.json\`
        - **Python:** \`sqlite3\` library
        - **Any SQLite client**

        ## Documentation

        - [API Documentation](https://github.com/gaia-charge/evdb/blob/main/API_DOCS.md)
        - [Contributing Guide](https://github.com/gaia-charge/evdb/blob/main/CONTRIBUTING.md)
        EOF

    - name: Upload release notes artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release_notes.md
        retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download database artifact
      uses: actions/download-artifact@v4
      with:
        name: evdb

    - name: Download release notes artifact
      uses: actions/download-artifact@v4
      with:
        name: release-notes

    - name: Generate timestamp
      id: timestamp
      run: |
        echo "date=$(date -u +'%Y.%m.%d')" >> $GITHUB_OUTPUT
        echo "time=$(date -u +'%H:%M')" >> $GITHUB_OUTPUT
        echo "tag=$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.timestamp.outputs.tag }}
        name: ${{ steps.timestamp.outputs.date }} ${{ steps.timestamp.outputs.time }}
        body_path: release_notes.md
        files: evdb.db
        draft: false
        prerelease: false
        generate_release_notes: false

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
