name: Build Database and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Validate YAML files
      run: |
        python scripts/validate.py --directory data
        
    - name: Build SQLite database
      run: |
        python scripts/build-sqlite.py
        
    - name: Verify database integrity
      run: |
        sqlite3 evdb.db "PRAGMA integrity_check;"
        sqlite3 evdb.db "SELECT COUNT(*) FROM manufacturers;"
        sqlite3 evdb.db "SELECT COUNT(*) FROM vehicle_variants;"
        
    - name: Upload database artifact
      uses: actions/upload-artifact@v4
      with:
        name: evdb-database
        path: evdb.db
        retention-days: 90
        
    - name: Generate database statistics
      run: |
        echo "## Database Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Manufacturers | $(sqlite3 evdb.db 'SELECT COUNT(*) FROM manufacturers;') |" >> $GITHUB_STEP_SUMMARY
        echo "| Vehicle Models | $(sqlite3 evdb.db 'SELECT COUNT(*) FROM vehicle_models;') |" >> $GITHUB_STEP_SUMMARY
        echo "| Vehicle Variants | $(sqlite3 evdb.db 'SELECT COUNT(*) FROM vehicle_variants;') |" >> $GITHUB_STEP_SUMMARY
        echo "| Market Availability | $(sqlite3 evdb.db 'SELECT COUNT(*) FROM market_availability;') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Database size: $(du -h evdb.db | cut -f1)" >> $GITHUB_STEP_SUMMARY

