skipped:
  - model: audi-q8-e-tron
    reason: "Partial: no official Q8 e-tron price list with a Technische-Daten table is still published. Production ended 2025, audi.at moved the car to 'Vorgaengermodelle' (no /preisliste page in the sitemap), audi.com/de/publikationen/preislisten/...-modelljahr-2024-1243 now 404s, and the audi.at technische-daten pages render their tables from a JS API so a saved HTML file is an empty shell. The Audi Ireland MY24 'Q8 e-tron Product Guide' on media.audi.com downloads fine but contains only prices and equipment, no technical table. As a result charging.charging_speed_kmh and bidirectional.v2l remain uncovered for all six Q8 variants, and no eTD exists for the SQ8 / SQ8 Sportback or the Q8 Sportback 55."
  - model: audi-e-tron-gt
    reason: "Partial: the queue lists no variants for this model, only the model-level gaps (seats, production_status), both of which are now covered. No separate eTD sheet was located for the base e-tron GT quattro or S e-tron GT - audi.com's /technical-data listing pages are per-model-id and the e-tron GT id could not be resolved; the RS performance eTD carries the same body/seat data."
