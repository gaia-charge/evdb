notes: >-
  Brand-wide findings for Suzuki (single model, e Vitara):
  (1) auto.suzuki.de was rebuilt on Next.js and the old Plone-style download URLs
  (/beratung-kauf/beratung-kauf/<model>-preisliste.pdf and .../view) now 403 or
  404 - there is no downloadable German e Vitara Preisliste PDF on suzuki.de any
  more. The official Suzuki Austria web kiosk (webkiosk.suzuki.at) is the working
  substitute and publishes the full 'Preise, Ausstattung und Technische Daten'
  PDF, which is what was fetched here.
  (2) No single Suzuki document covers everything, which is why this model has
  three: the Austrian PDF has seats / motors / torque / dimensions but no charge
  times, the German page has the 10-80% DC time and drive types but no seats, and
  the UK page has the heat pump. All three were confirmed before saving.
  (3) SEATS = 5 ('Sitzplaetze 5', Austrian price list).
  (4) DC charge time is published on the 10-80% basis (ca. 45 min), which matches
  charging.time_10_to_80_min directly. Nothing supports
  charging.time_0_to_80_min or charging.charging_speed_kmh.
  (5) bidirectional.v2l is NOT stated in any of the three official sources - the
  Austrian price list's LADEN block lists only the AC Type 2 and DC CCS2 inlets.
  That queue gap stays open.
