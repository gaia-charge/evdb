notes: "bidirectional.v2l is a gap on every MINI queue variant and no official MINI/BMW Group document covers it: neither the mini.de price lists nor the PressClub 'Technische Daten' sheets have a V2L / bidirektionales Laden row. Treat as 'not offered' only if the project allows absence-of-row as evidence; otherwise it stays open. All charging rows in these documents are the exact target windows (10-80 % DC, 0-100 % AC)."
