    notes: "Opel Germany 'NEUER ASTRA 5-Tuerer und Sports Tourer', Preislistendatum 23. Maerz 2026 - the facelift list, carries the 58-kWh Astra Electric that matches the queue's GS 58 kWh MY2026 variant. Verified in the text layer: Batteriekapazitaet netto (brutto) 55 (58), Antrieb Frontantrieb, 115 kW (156 PS), Drehmoment 270 Nm, 0-100 9,3 s (5-Tuerer) / 9,5 s (Sports Tourer), WLTP kombiniert 432-454 km, WLTP innerstaedtisch 544-580 km, Verbrauch 15,5-15,3 kWh/100 km, Laenge 4.374 / Radstand 2.675 (5-Tuerer), max. Ladeleistung AC 11 / DC 100 kW. IMPORTANT: the DC charge time row is '20% bis 80%' (ca. 32 Min.), NOT 10-80 and NOT 0-80 - map it to charging.time_20_to_80_min only. Heat pump appears as equipment: 'Waermepumpe (nur in Verb. mit Electric)'; V2L appears as 'Vehicle-To-Load Vorbereitung (nur in Verb. mit Electric)' - i.e. preparation, full V2L needs an extra part, so treat v2l as option/prepared rather than plain true. No Sitzplaetze row anywhere in Opel price lists."
