notes: >-
  Brand-wide findings for Opel (all five models):
  (1) opel.de is behind Akamai and rejects a bare curl with 'Access Denied';
  it serves fine with a full browser header set (Accept, Accept-Language,
  Sec-Fetch-*, sec-ch-ua, Referer). The dl helper used for these downloads sends
  those headers.
  (2) The stable alias URLs /content/dam/opel/germany/tools/preislisten/<model>-preisliste.pdf
  always resolve to the current list and are the right thing to re-fetch later;
  dated per-model paths under /fahrzeuge/<model>/downloads/ are removed once
  superseded (both 2024 Corsa Electric and 2024/2025 Mokka Electric lists now 404).
  (3) NO Opel price list states a seat count ('Sitzplaetze' does not appear in any
  of them). The only seat evidence found is the Frontera's optional 7-Sitzer-Paket
  plus the Stellantis press release; seats for Astra, Corsa, Mokka and Grandland
  remain uncovered by official documents in this store.
  (4) Every Opel DC charge-time row is stated for 20%-80%, never 10-80% or 0-80%.
  Extraction must use charging.time_20_to_80_min; the queue's
  charging.time_10_to_80_min / time_0_to_80_min gaps cannot be closed from Opel
  price lists.
  (5) charging.charging_speed_kmh is not published by Opel in any form.
