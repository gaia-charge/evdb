    notes: >-
      Official Jaguar UK "I-PACE TECHNICAL SPECIFICATION OCTOBER 2023" WLTP insert - the best
      model-year match for the MY2024 queue variant. Provenance re-established on 2026-08-14:
      re-downloaded from this URL and shasum matches the stored file byte-for-byte
      (5c8fed2220ff093e8074483db55f1f50d4183245, 23937194 bytes).
      Verified in the text layer: 'Maximum Power PS (kW) 400 (294)'; 'Maximum Torque (Nm) 696';
      'Battery (kWh) 90' + 'Battery capacity Total (Usable) kW 84.7'; 'Driveline AWD';
      'Acceleration (secs) 0-60 mph (0-100 km/h) 4.5 (4.8)'; WLTP range/consumption rows for
      Low/Medium/High/Extra High/Combined phases ('Combined 254-292 (408-470)' km,
      'Combined 35.4-40.6 (22.0-25.2)' kWh/100 km); dimensions 4,682 mm length / 2,990 mm wheelbase.
      CAVEAT on charging: Jaguar publishes NO 10-80% or 0-80% DC window anywhere in this document.
      The 'CHARGING TIMES*' table is expressed as range-added-per-time instead, which is what
      charging.charging_speed_kmh should be taken from: 'DC Charger 50kW miles (km) 39 (63) per
      15 mins of charge', 'DC Charger 100kW miles (km) 78 (127) per 15 mins of charge',
      'Home Charger / Wall box 7kW (hours) 12.75 to 100%', 'Wall box 11kW 8.58 to 100%'.
      CAVEAT on city range: there is no row labelled 'City'. The WLTP 'Low' phase range row reads
      '331-384 (533-618)' km; treat that as the WLTP-Low phase figure, NOT as a published
      city-range number, if it is used for range.wltp_city_km at all.
      Fields NOT present at all: seat count (only loadspace 'Rear seats upright/forward' rows),
      heat pump, V2L.
