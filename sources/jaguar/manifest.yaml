notes: >-
  All three I-PACE files were already on disk from an interrupted earlier run with no manifest.
  Provenance for every one of them was re-established on 2026-08-14 by locating the official
  URL and re-downloading to a temp path: all three shasums match byte-for-byte, so nothing was
  deleted. The datasheet URL was not directly indexed by search; it was derived from the
  sibling Jaguar E-PACE October-2023 WLTP insert URL pattern
  (.../uk/wltp/Jaguar-E-PACE-TD-Insert-1X5402450000GBEN01P.pdf -> I-PACE 1X5902450000GBEN01P)
  and then confirmed by exact shasum match, which is stronger evidence than a search hit.
  BRAND-LEVEL GAP CAVEAT - these five queue fields are simply not published by Jaguar for the
  I-PACE in any official document found: charging.time_10_to_80_min, charging.time_0_to_80_min,
  features.heat_pump, bidirectional.v2l, range.wltp_city_km, and the model-level seats count.
  Jaguar's charging disclosure format is range-added-per-time, not a state-of-charge window.
  The live official spec page (https://www.jaguar.com/en-gb/jdx/jaguar-range/i-pace/specifications/index.html,
  reached via a 301 from the jaguar.co.uk path) was checked on 2026-08-14 and was NOT saved:
  it now renders "We're sorry the information on this page is currently unavailable" and shows
  only range/0-60/CO2/7 kW AC hours, i.e. strictly less than the datasheet already on disk.
  The I-PACE was discontinued at the end of 2024, so no newer official material is being issued.
