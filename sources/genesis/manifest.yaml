    notes: "Official Genesis Motor Deutschland price list 'GENESIS GV60' (MY26, linked from genesis.com/de/de/service-and-ownership/service/pricelists). Full technical section: drivetrain named per trim as 'RWD Single Motor' (Basis/Premium) and 'AWD Dual Motor' (Sport, Sport Plus) — direct evidence for performance.drive_type and performance.motors; Max. Drehmoment 350 / 605 / 700 Nm; Art der Batterie Li-ion, Batteriekapazität 84 kWh; Anz. der Türen / Sitze 4/5; Länge/Breite/Höhe 4545/1890/1580 mm; Radstand 2900 mm; Ladezeiten 'DC Schnelladen (10% › 80%)' 18 Minuten an einer 350 kW Ladesäule and 81 Minuten an 50 kW; 'Wärmepumpe' listed as standard in the E-Technologie equipment block; 'Vehicle-to-Load-Paket' with V2L plug inside and outside as an option. Note the queue's 'Advanced' trim is not in this MY26 list (line-up is Basis/Premium, Sport, Sport Plus) — the vehicle-level rows (seats, dimensions, heat pump, V2L, charge times) still apply."
