    fetched_at: "2026-08-14"
    notes: "Official Jeep Austria price list 'JEEP AVENGER Spezifikationen & Preise', listed on https://www.jeep.at/preislisten-broschueren. The only official Avenger document found that publishes a 10-80 % DC figure. Verified in text layer: 'Ladedauer DC Gleichstrom 100 kW-Schnellladestation (20-80% / 10-80%) 27min/30min'; 'Anzahl Sitzplaetze 5'; 'Laenge (mm) 4.084'; 'Radstand (mm) 2.562'; 'Drehmoment, max. Elektromotor (Nm) 260'; 'Leistung, max. Elektromotor (kW / PS) 115 / 156' with no rear-motor entry for the electric version (the 4xe column shows '2x21' / 'Vorne : 55 Hintere : 88', so motor count and layout are unambiguous); 'Batterie Typ / Batteriekapazitaet (kWh, gesamt / nutzbar) Lithium-Ionen / 54 / 51'; 'On-Board Charger (kW) 11, dreiphasig'; 'Antriebssystem FWD'; 'Beschleunigung 0-100 km/h (s) 9,0'; 'Stromverbrauch EC, AC gewichtet (kWh/100km) WLTP 15,5-16,0'; 'Rein elektrische Reichweite kombiniert (km) WLTP 386-400'; 'Rein elektrische Reichweite Stadtzyklus (km) WLTP 562-601'; 'Waermepumpe (BBV + C6U)' as a per-trim option row; '11kW Onboard-Charger, dreiphasig & V2L-Funktionsvorbereitung' as a per-trim equipment row. CAVEATS: (a) despite the MY25 filename the cover reads 'Spezifikationen & Preise Modelljahr 2026. Gueltig ab 05/2026' - the queue variants are MY2024/2025, so check spec drift on extraction; (b) the primary Jeep charge window is 20-80 % (27 min) and 10-80 % (30 min) is only the second half of that combined row - do not confuse them; (c) the V2L row says 'V2L-Funktionsvorbereitung' (V2L *preparation*), i.e. capability provisioning, not a shipped V2L outlet; (d) heat pump is an option code, not standard on all trims; (e) jeep.at rejects curl with a browser User-Agent (HTTP 403) and serves the PDF only to a UA-less request."
