    fetched_at: "2026-08-14"
    notes: "Official Jeep Germany price list 'JEEP AVENGER Spezifikationen und Preise MJ2026', listed on https://www.jeep.de/preislisten-broschueren - the German-market counterpart of price-list.pdf, kept because it names the cell supplier and states drive type in words. Verified in text layer: 'Antriebssystem Frontantrieb / Frontantrieb / Allradantrieb / Frontantrieb'; 'Max. Leistung E-Motor (kW (PS)) 115 (156)' with 'Max. Leistung E-Motor (kW (PS)) (Heck)' showing '-' for the electric version (single front motor); 'Max. Drehmoment (Nm / U/min) 260 / 500 - 4060'; 'Batteriekapazitaet brutto / netto, CATL (kWh) 54 / 51'; 'Ladezeit 1,8 kW, Steckdose, einphasig (0-100 %) 26h 25'''; 'Ladezeit 11 kW, Mode 3 (0-100 %) 5h 45'''; 'Ladezeit 100 kW, Gleichstrom (20-80 %) 27'''; 'Beschleunigung 0-100 km/h (Sek.) 9,0'; 'Elektrische Reichweite ausserstaedtisch nach WLTP (km) 400 - 386'; 'Elektrische Reichweite innerstaedtisch nach WLTP (km) 585 - 562'; 'Stromverbrauch kombiniert (kWh/100 km)'; 'Laenge (mm) 4084'; 'Radstand (mm) 2562'; 'Waermepumpe BBV' option row. CAVEATS: (a) MJ2026 content against MY2024/2025 queue variants; (b) this German list gives ONLY the 20-80 % DC window (27 min) - it has no 10-80 % and no 0-80 % figure; (c) no seat-count row in this list (use the Austrian ones); (d) no V2L row; (e) same UA-less curl requirement as jeep.at."
