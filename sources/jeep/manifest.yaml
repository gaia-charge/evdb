    fetched_at: "2026-08-14"
    notes: "Official Jeep Austria price list 'JEEP Avenger Modelljahr 2023, Datenstand 23.05.2023' - the oldest still-hosted Avenger list, kept because it is the closest model year to the queue's 2024 variants and because it is the only source found with a 0-80 % DC figure and per-trim consumption including an explicit Altitude column. Verified in text layer, ELEKTROANTRIEB table: 'Motorisierung BEV 54 kWh 156 PS'; 'Version Avenger / Longitude / Altitude / Summit'; 'Anzahl der Sitzplaetze 5'; 'Laenge (mm) 4.084'; 'Radstand (mm) 2.562'; 'Leistung, max. (kW/PS) 115/156'; 'Drehmoment, max. (Nm) 260'; 'Beschleunigung (0-100 km/h in Sek.) 9,0'; 'Batterie Typ Lithium-Ionen'; 'Batteriekapazitaet (kWh) 54'; 'Netto-Batteriekapazitaet (kWh) 51'; 'On-Board Charger (kW) 11, dreiphasig'; 'Ladedauer DC Gleichstrom 100 kW-Schnellladestation (0-80%) 34min'; 'Stromverbrauch ECAC gewichtet, kombiniert (kWh/100km) WLTP 15,5 / 15,4-15,6 / 15,6-15,9 / 15,6-15,7'; 'elektrische Reichweite, kombiniert (km) WLTP 400 / 396-400 / 390-395 / 394-395'; 'elektrische Reichweite, Stadtzyklus (km) WLTP 578 / 574-579 / 553-573 / 569-572'. Also carries the charge-rate prose 'Fuer eine Fahrstrecke von 30 Kilometern genuegen zum Beispiel drei Minuten Ladezeit, in 24 Minuten ist die Batterie von 20 auf 80 Prozent geladen' - that 30 km / 3 min figure is the raw material for charging.charging_speed_kmh but is prose, not a published kmh row, so it is deliberately NOT listed in fields_present. CAVEATS: (a) MY2023 document; the DC window here is 0-80 % (34 min) and the prose window is 20-80 % (24 min), and note the 24 min prose contradicts the 27 min MJ2026 row - Jeep has revised the figure, so prefer the newest list per model year; (b) no Waermepumpe row, no V2L row, no drive-type row in this list; (c) UA-less curl required."
