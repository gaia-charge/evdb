notes: >-
  IMPORTANT SOURCING LIMITATION FOR THIS BRAND. Tesla's own site is the only
  place that publishes the missing fields (DC charge time 10-80%, charging
  speed, total torque, heat pump per variant, V2L, WLTP city range, seats,
  platform), and every tesla.com path is behind Akamai bot protection that
  returns HTTP 403 "Access Denied" to curl and to WebFetch alike. Verified 403
  on: /de_de/model3, /de_de/modely, /de_de/models, /de_de/modelx,
  /de_de/model3/design, /de_at/modely, /de_de/support/meet-your-tesla/model-y,
  /ownersmanual/model3/de_de/GUID-F617DA3E-11C1-4FBA-98A7-A9C3828E3536.html,
  /ownersmanual/*/de_de/Owners_Manual.pdf and service.tesla.com. Loading
  https://www.tesla.com/de_de/modely in a real browser rendered a blank
  bot-challenge page; no attempt was made to defeat the challenge. The path
  /de_de/model3/specs now returns 404 - Tesla folded specs into the model
  pages. digitalassets.tesla.com IS reachable, so the Emergency Response
  Guides above are the only official Tesla documents that could be retrieved;
  they cover motor layout, drive type, seating and (Model 3 only) heat pump,
  and nothing else on the target list. Probed and not found on that host:
  Model_*_Owners_Manual*.pdf, Model_*_Quick_Guide*.pdf, Model_*_Spec_Sheet.pdf,
  Model_*_Brochure_de.pdf, Model_*_Fleet_Brochure.pdf. The remaining Tesla gaps
  need either a manual browser session or a non-official source, so they are
  left unfilled rather than sourced from an aggregator.
