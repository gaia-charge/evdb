      - performance.drive_type
      - features.heat_pump
    notes: >-
      Official Tesla Emergency Response Guide (Model 3, version 001), hosted on
      Tesla's own asset host digitalassets.tesla.com. Documents front and rear
      drive units ("Vehicles without a front drive unit are Single Motor" /
      "Dual Motor"), which establishes motor count and drive type, and has a
      dedicated "Heat Pump" section. It is NOT a spec sheet: no charge times,
      no torque figures, no WLTP data, no dimensions table.
