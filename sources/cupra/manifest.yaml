      - dimensions.wheelbase_mm
    notes: >-
      Official CUPRA Germany price list, "Stand: 02. Juni 2026". Downloaded via
      cupraofficial.de, which 301-redirects to the same asset on cupra.com;
      file verified byte-identical (sha256 a1573dfc..., 1782975 bytes) to the
      URL recorded here. TECHNISCHE DATEN table lists Antriebsart (Heckantrieb),
      Motor-Bauart, Max. Leistung, Max. Drehmoment, Batterietyp (Lithium-Ionen),
      Batteriekapazität brutto/netto kWh, Nennspannung, 0-100 km/h, WLTP
      consumption and dimensions; equipment lists give max. AC-Ladeleistung
      11 kW and max. DC-Ladeleistung 105 kW / 183 kW, plus a Wärmepumpe line.
      Covers the three current motorisations 140 kW/58 kWh, 170 kW/79 kWh and
      240 kW/79 kWh; there is no seat-count row and no DC 10-80% charge time,
      no V2L, and no explicit motor-count field.
