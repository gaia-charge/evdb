notes: >-
  Brand-wide findings for Ford (all four models):
  (1) ford.de and ford.at serve their DAM PDFs to a normal browser-header curl
  without any Akamai block; the per-model 'pricelist' / 'brochures-pricelists'
  pages expose the PDF paths directly in the served HTML, so they are easy to
  re-discover later.
  (2) Ford is the one brand in this batch that publishes DC charge time as
  exactly 10-80%, which is the field the queue asks for
  (charging.time_10_to_80_min). Nothing in the Ford documents supports
  charging.time_0_to_80_min or charging.charging_speed_kmh.
  (3) performance.motors is not stated as a number; it has to be read off the
  torque row - a single figure means one motor, a 'Vorderachse X / Hinterachse Y'
  split means two - together with Antriebsart (Heckantrieb / Frontantrieb /
  Allradantrieb).
  (4) SEATS: only the Puma Gen-E datasheet has a 'Sitzkapazitaet' row (5).
  The Explorer, Capri and Mustang Mach-E datasheets and price lists give
  1./2. Sitzreihe interior dimensions but never an explicit seat count, so the
  seats gap stays open for those three models within the 3-document budget.
  (5) Heat pump differs per model and is NOT a platform constant: paid option on
  Explorer (1.050 EUR) and Capri (1.100 EUR), standard on Mustang Mach-E,
  absent from the Puma Gen-E list. V2L on Explorer/Capri is a 2,3 kW 230 V
  socket inside the Fahrerassistenz-Paket while V2H is standard.
