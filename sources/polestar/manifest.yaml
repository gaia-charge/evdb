    notes: "Official Polestar Global Media Newsroom release ID 781, 'Polestar 5 performance Grand Tourer officially revealed', dated 2025-09-08. Saved as text (spec-page.md convention) with the source URL in the file header because media.polestar.com is a client-rendered SPA - plain curl and text-extraction fetches both return only the 4,290-byte app shell with no article body, so the text was read out of the rendered DOM. THIS IS THE ONLY DOCUMENT THAT FILLS THE TWO POLESTAR 5 HOLES the datasheet leaves: seats - 'luxury 4+1 seating arrangement', 'Designed primarily as a four-seater ... Raising the armrest creates a fifth seating position ... turns the performance GT into a practical five-seater' (so seats = 5, with the middle rear position an occasional seat); and production_status - 'Polestar 5 performance Grand Tourer on sale now', 'Available to order now', 'Orders commence online from 8 September 2025 in all initial launch markets'. ALSO fills battery.net_kwh for the 5, which the datasheet omits: 'the 112 kWh lithium-ion NMC battery (106 kWh usable) from SK On'. WHY covers_models LISTS ALL FOUR: the 'About Polestar' boilerplate is the official brand statement of line-up status as of 2025-09-08 - 'Polestar has four models in its line-up: Polestar 2, Polestar 3, Polestar 4, and Polestar 5. Planned models include the Polestar 4 new variant (to be introduced in the last quarter of 2026), Polestar 2 successor (to be launched early in 2027), Polestar 7 compact SUV (to be introduced in 2028) and the Polestar 6 roadster' - i.e. all four queue models were in production/on sale, and the Polestar 2 is explicitly flagged as having a successor arriving early 2027. Use it as the production_status source for polestar-2/3/4 as well; the file lives under polestar-5/ because that is the model the release is about. IMPORTANT CAVEAT: these are LAUNCH figures and note 2 says 'Official energy consumption and range certification data is pending' - the WLTP numbers here (670/565 km, 17.6-18.3 / 20.9 kWh/100 km) are SUPERSEDED by the homologated figures in polestar-5/datasheet.pdf and the German spec page (678/558 km, 17.8-18.3 / 21.2 kWh/100 km). Prefer the datasheet for WLTP; use this release only for seats, production status, net kWh and cell supplier. Still NO heat pump and NO V2L statement anywhere in the release."
