# No model was skipped outright - all four have 2-3 official documents on disk.
# The entries below record the queue fields that NO official Polestar source
# publishes, so an extractor does not keep re-hunting for them.
unfillable_from_official_sources:
  - field: charging.time_0_to_80_min
    models: [polestar-2, polestar-3, polestar-4, polestar-5]
    reason: "Polestar only ever quotes the DC 10-80% window. Both the polestar.com spec pages and all four press datasheets label the row 'Charging time (DC, 10-80%)' / 'DC-Ladedauer 10-80 %'. The only 0-100% figures given are AC. Do not convert - record 10_to_80 and leave 0_to_80 empty."
  - field: charging.charging_speed_kmh
    models: [polestar-2, polestar-3, polestar-4, polestar-5]
    reason: "Never published in any form. Polestar gives peak DC kW (180/200/205/250/350 kW depending on model and model year) and the 10-80% minute count, never a km/h charging rate."
  - field: range.wltp_city_km
    models: [polestar-2, polestar-3, polestar-4, polestar-5]
    reason: "Polestar publishes combined WLTP range and combined WLTP consumption only. No city/urban WLTP column exists on the German spec pages or in any of the four press datasheets - unlike e.g. Kia/Hyundai price lists, there is no 'Innenstadt' row to extract."
  - field: bidirectional.v2l
    models: [polestar-2, polestar-3, polestar-4, polestar-5]
    reason: "No vehicle-to-load / bidirectional / V2L capability is documented anywhere. All eight primary documents were searched case-insensitively for 'vehicle-to', 'bidirection', 'v2l', 'discharg', 'power-out', 'external power' and 'socket' - zero hits in every one. Treat as not-offered rather than unknown, but note the absence of a positive statement either way."
  - field: features.heat_pump
    models: [polestar-5]
    reason: "Specific to the 5: neither the German spec page nor the official 17-page press datasheet nor the reveal press release contains the word 'pump' / 'Waermepumpe'. The datasheet's Climate pack section lists only heated front/rear seats, heated steering wheel and heated wiper blades. By contrast the 2 (Optional), 3 (Not available on Single motor, Included on Dual) and 4 (Included) are all documented explicitly."
resolved_notes:
  - "seats: 5 for all four models. Sources - 'Seating configuration 5 seats' (polestar-2/datasheet.pdf), 'Seating configuration 5-seat' (polestar-3/datasheet.pdf and polestar-4/datasheet.pdf), and for the 5 the reveal release's 'luxury 4+1 seating arrangement ... turns the performance GT into a practical five-seater' (polestar-5/press-release.md)."
  - "production_status: covered for all four models by the 'About Polestar' boilerplate in polestar-5/press-release.md (2025-09-08): all four in the line-up, with a Polestar 2 successor flagged for early 2027 and a new Polestar 4 variant for Q4 2026."

