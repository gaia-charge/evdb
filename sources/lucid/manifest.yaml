notes: >
  No document found on any official Lucid channel states a DC 10-80 % charge time,
  a heat pump, or V2L for either model: Lucid's own spec sheets quote
  "time to charge 200 miles" instead of a 10-80 % window, and neither the German
  model pages nor the IR releases mention a Wärmepumpe or vehicle-to-load feature.
  Those gap fields therefore remain unsourced rather than filled from a non-official site.
  Lucid publishes no equivalent per-trim technical-spec PDF for Gravity
  (lucid-gravity-*-technical-specs-2025.pdf returns 404), so Gravity relies on the
  model pages plus the IR release.
