notes: >
  The EH7 has almost no official European documentation. hongqi.be and hongqi.nl both
  301-redirect to Hedin Automotive (the official Benelux importer), whose Hongqi model
  listing carries only the E-HS9 - there is no EH7 page or price list there. No official
  source found states a heat pump, V2L, WLTP consumption (kWh/100 km) or WLTP city range
  for this model, so those gap fields remain unsourced.
