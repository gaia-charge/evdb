skipped:
  - model: maserati-granturismo-folgore
    reason: >-
      Partially covered, not fully. features.heat_pump, bidirectional.v2l and
      charging.time_10_to_80_min remain unfilled after four independent attempts and no further
      official document exists to fetch. maserati.com is unreachable for automated fetching -
      it returns HTTP 403 to WebFetch and to curl with a browser UA, and HTTP 404 to UA-less curl,
      on every model path tried (/int/en/models/granturismo/folgore, /int/en/models/grecale,
      /de/de/modelle/grecale/folgore), so the brand's own configurator/spec pages could not be
      saved at all. On the press portal, "The New Maserati GranTurismo" (us-en) and "New Maserati
      GranTurismo, GranCabrio and Grecale" (em-en) were both read and add nothing - neither
      mentions a heat pump or V2L, and neither gives a 10-80% window.
      Maserati's press portal lists a downloadable press kit for the model but exposes no direct
      asset URL to fetch.
  - model: maserati-grecale-folgore
    reason: >-
      Partially covered, not fully. features.heat_pump, bidirectional.v2l,
      charging.time_10_to_80_min and the model-level seats count remain unfilled after five
      attempts. Read and rejected as adding nothing: "Maserati Grecale Folgore Model Year 2026"
