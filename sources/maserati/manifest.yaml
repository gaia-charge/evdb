      Maserati has re-homologated the car since the queue's 2025 variant - do not mix figures
      across model years.
notes: >-
  Both pre-existing Maserati files were left by an interrupted earlier run with no manifest. Both
  were already self-attributing (each carries its official source URL on its first line, plus a
  note that the site 403s curl), and both were verified on 2026-08-14 by re-fetching that URL and
  comparing figures - every value matched, so nothing was deleted. unattributed_deleted = 0.
  These are text fetches (.md), not HTML/PDF, because media.stellantis.com refuses curl; that is
  the documented fallback in the fetch procedure and the file headers say so explicitly.
  BRAND-LEVEL GAP CAVEAT: Maserati publishes no heat-pump or V2L information for either Folgore
  model in any reachable official source, and states its DC charging as a 20-80% window rather
  than the 10-80% the queue expects. No official Maserati price list PDF (Preisliste / listino
  prezzi) is published for any EU market or importer as far as searching could establish; every
  hit for one was an aggregator and was therefore not used.
  No V2L claim should be inferred for these cars from the absence of evidence either way.
