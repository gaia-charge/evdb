notes: >-
  Brand-level caveats for Lancia.
  (1) Lancia has exactly one BEV in the queue (Ypsilon Electric) and no brand press portal of its
  own - everything official lives on media.stellantis.com, which is the allowed Stellantis portal.
  lancia.it/lancia.nl model pages carry no downloadable technical table, so the market price lists
  and the Belgian product guide ARE the official datasheets here.
  (2) media.stellantis.com serves these PDFs to a UA-less curl and answers 403 to a browser
  User-Agent - the reverse of the usual pattern. Fetch with plain `curl -sSL --compressed` and no
  -A flag.
  (3) THE 10-80% FIELD IS UNFILLABLE from official Lancia sources. Stellantis publishes a 20-80% DC
  window (24 minutes at 100 kW) plus 0-100% times, and nothing else; the complete charge-time matrix
  in datasheet.pdf shows there is no 10-80% or 0-80% row to find. The nearest thing to a charge-speed
  figure is marketing prose: 100 km of range in under 10 minutes.
  (4) BATTERY CAPACITY CHANGED ON PAPER between model years for the same car: MY24 documents say
  51 kWh gross / 48 net, MY25 documents say 54 kWh gross / 51 net. The queue variant is
  "54 kWh" MY2025, so the MY25 price lists are authoritative for it; do not average or mix.
  (5) Heat pump is a trim- and market-dependent option (code Y8P, EUR 550), standard only on the top
  Dutch electric trim. V2L is standard on the MY25 electric trims, bundled with the 11 kW on-board
  charger, with no published output rating. Neither is a flat model-level yes/no.
  (6) performance.motors and production_status are not published as data by Lancia in any document
  found; both would have to be inferred (single front motor; on sale as of the 23 May 2025 listino).
  (7) No pre-existing files - the sources/lancia directory did not exist before this run, so nothing
  was deleted (unattributed_deleted = 0).
