    notes: >-
      "NUOVA LANCIA YPSILON Listino del 23 Maggio 2025" - the Italian home-market price list
      (Serie 1) from Stellantis' media portal, 8 pages. Kept as the third document because it is the
      home-market MY25 confirmation of the Dutch figures and the only one that dates the line-up.
      Verified: the electric versions are listed as '54 kWh / 156 cv / 115 kw' with 'Euro 6e-bis'
      across the YPSILON, LX and Edizione Limitata trims; 'Ciclo urbano' (city) range per trim
      588-586 km and 578 km; combined kWh/100 km column; 'Ricarica fast charge 100 kW' as standard
      equipment on every electric trim; option 'Y8P Pompa di calore' priced EUR 450,82 + VAT /
      EUR 550,00 and marked O (optional) on the electric trims.
      Note the heat-pump mismatch against the Dutch list, which is a market-equipment difference and
      not an error: in Italy the heat pump is optional on the electric trims, in the Netherlands it
      is standard on the higher one. Record heat_pump per market/trim or leave it as "available".
      production_status is only implicit - a current official price list dated 23 May 2025 with
      orderable SINCOM codes (429.1S2.1, 429.1U2.1) is evidence the model was in production and on
      sale at that date; no document states a production status in words.
      CAVEAT: the earlier Italian listino of 30 April 2024
      (https://www.media.stellantis.com/uploads/it/model-pricelist/listino_nuovalanciaypsilon_30042024-663dfe69496fc.pdf)
      quotes the same car as '51 kWh' with 545/534/532 km city range - it was checked and NOT kept,
      because it describes the pre-update MY24 car and would collide with the MY2025 queue variant.
      Italian language. No seats, torque, 0-100, drive-type or charge-time rows.
