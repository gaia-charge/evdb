    fetched_at: "2026-08-14"
    notes: >-
      "New YPSILON Product Guide 05/2024" - official bilingual (FR/NL) Lancia Belgium product guide
      on Stellantis' media portal, created 24 May 2024. 14 pages with the deepest technical table of
      the three documents.
      THIS IS THE SEATS SOURCE: 'Nombre de places / Aantal zitplaatsen ... 5' for both powertrains -
      the only official Lancia document found with a numeric seat row.
      Also verified: 'Roues motrices / Aangedreven wielen: roues avant / voorwielen' (front-wheel
      drive); 'Architecture/Architectuur ... BEV' with 'Voltage (V) 400'; 'Puissance maximale en kW
      (hp) 115 (156)'; 'Couple maximal (Nm) 260'; 'Type de batterie / Type batterij Lithium - ion';
      'Type de port de charge CCS 2'; 'AC on-board-charger 7,4 kW (S) / 11 kW (O)'; 'Boîte de
      vitesses / Versnellingsbak Auto 1speed' with 'Nombre de rapports 1'; option code 'Y8P
      Warmtepomp / Pompe à chaleur' shown per trim as - / O / - / O / - / S.
      It also has the complete charge-time matrix, which is the clearest proof of what Stellantis
      does and does not publish: rows exist for 0-100% and 20-80% and 20-100% at AC 2,3 / 7,4 /
      11 kW and DC 100 kW ('20 - 80% (DC 100 kW) 00:24', '0 - 100% (DC 100 kW) 01:13'). There is NO
      10-80% row and NO 0-80% row.
      CAVEATS: (1) this is MODEL YEAR 2024 and it declares the battery as 'Capacité brute /
      Capacité nette (kWh) 51 / 48' - the MY2025 price list declares the same pack as 54 / 51. Both
      are official; the MY25 figure is the one to use for a 2025 variant, and the discrepancy is
      exactly the "optimized battery ... enhanced chemistry" the MY25 press release refers to.
      (2) MY24 gives the 11 kW on-board charger as an option, whereas MY25 makes it standard with
      V2L - do not carry MY24 charger/V2L equipment over to the 2025 variant.
      (3) performance.motors is NOT stated as a number here or anywhere else; a single ELECTROMOTEUR
      block plus front-wheel drive and a 1-speed gearbox implies one motor, but that is an inference,
      so it is deliberately not listed in fields_present.
