    notes: >-
      "Lancia Ypsilon Prijslijst 8 april 2025" - the official Lancia Netherlands consumer price list
      for MODEL YEAR 2025, published on Stellantis' own media portal. 22 pages; the "TECHNISCHE DATA"
      section carries the full table for the "100% Electric" column next to the Hybrid one. This is
      the best single match for the queue's 54 kWh MY2025 variant.
      Verified in the text layer: 'Aandrijving ... Voorwielen' (front-wheel drive); 'Max. koppel in
      Nm elektromotor 260'; 'Max. vermogen in kW (pk) elektromotor 115 (156)'; 'Acceleratie 0-100
      km/u (sec.) 8,2'; 'Accucapaciteit in kWh - bruto / netto ... 54 kWh / 51 kWh'; 'Max. WLTP range
      elektrisch gecombineerd (km) 421 - 426'; 'Max. WLTP range elektrisch in stadsverkeer (km)
      579 - 588'; 'Electriciteitsverbruik gecombineerd (kWh/100 km) 14,3 - 14,6'; 'Max. AC
      laadvermogen in kW 11'; 'Max. DC laadvermogen in kW 100'; 'Lengte (mm) 4080'; 'Wielbasis (mm)
      2545'; 'Topsnelheid (km/u) volledig elektrisch 150'; 'Gewicht accu's in kg 340'.
      Heat pump: 'Warmtepomp' appears twice - as standard on the higher trim ("S (enkel Electric)",
      i.e. standard but only on the Electric powertrain) and as paid option code Y8P at EUR 550 on
      the lower trim. So heat_pump is TRIM-DEPENDENT, not a flat model property.
      V2L: '11 kW boordlader met Vehicle to Load functionaliteit (V2L)' listed as standard equipment
      on both Electric trims - Lancia bundles V2L with the 11 kW on-board charger. No output rating
      (W or A) is published anywhere in the document.
      charging_speed_kmh comes from marketing prose, not a spec row: "Een actieradius tot 426 km en
      tot 100 km met een oplaadtijd van minder dan 10 minuten" (100 km of range in under 10 minutes).
      CAVEAT - THE CHARGE WINDOW IS NOT 10-80%: the only DC row is 'Laden van 20% - 80% DC snelladen
      (100 kW) in uren ... 24 minuten'. The AC rows are 0-100% (2,3 kW = 24 h 21 min, 11 kW = 5 h
      4 min). Lancia/Stellantis publish NO 10-80% and NO 0-80% figure for this car, so
      charging.time_10_to_80_min and charging.time_0_to_80_min cannot be filled from official
      sources - only a 20-80% value can, and it must be labelled as such.
      Dutch language. No seat-count row (see datasheet.pdf for that).
  - file: lancia-ypsilon/datasheet.pdf
    url: https://www.media.stellantis.com/uploads/be/attachment//202405_lancia_y_my24-665582ce3a081.pdf
    type: datasheet
