notes: >-
  Brand-level caveats for smart, and what was done to the files inherited from the interrupted
  earlier run.
  (1) smart publishes NO price list ("Preisliste") PDF on any of its European sites. The official
  substitutes, and what this store therefore holds for every model, are the model "Technische Daten"
  web page (full per-line table, saved as HTML) plus the "Line Uebersicht" equipment PDF from
  de.smart.com's own document store - between them they cover every queued field except V2L on
  #1/#3 and motor counts.
  (2 - the big gap) HEAT PUMP is published only in the Line Uebersicht PDFs, per line, and it is a
  trim feature rather than a model feature: #1 Pulse/Premium/BRABUS only; #3 Premium/Keith Haring/
  BRABUS only; #5 Pulse/Premium/Summit/BRABUS only. The queue's smart-1-pro-plus-*, smart-3-pro-2025
  and smart-5-pro-2025 variants are explicitly NOT listed as having one.
  (3) V2L is published for the #5 only ("V2L Faehigkeit" on all six lines; the press release
  describes it as a 230 V outlet in the charging port, no kW rating anywhere). For the #1 and #3
  smart publishes nothing - treat as not-published, not as false.
  (4) performance.motors is never given as a number. Only 'Antrieb' RWD/AWD ('Antriebsstrangtyp'
  reads "BEV"), plus prose "dual-motor all-wheel drive" for #5 AWD lines. Single-motor for RWD lines
  is an inference, not a published fact.
  (5) Every DC charge figure is labelled "10~80%" and lives in a per-charger-class column (150 kW
  and 400 kW), so record which column a value came from. No 0-80% figure is published anywhere, so
  charging.time_0_to_80_min stays unfillable from official smart sources.
  (6) Battery capacity is published as gross/net in a single cell ("49/47", "66/62", "76/74,4",
  "100/94"); the Line Uebersicht PDFs round to the gross figure ("49 kWh Batterie").
  (7) The de.smart.com pages track the current/incoming model year - the #5 table even has a
  "Pro (2027)" column - while the queue holds MY2024/2025 variants. Spec drift is real and visible
  (e.g. #1 BRABUS torque 543 Nm now vs 584 Nm at UK launch; #3 wheelbase 2750/2785 mm), so extraction
  must pin a model year.
  (8) production_status is not a field any of these documents states; all queued models are on sale
  on de.smart.com at the time of fetch, which is context, not a citable spec row.
  (9) FILE PROVENANCE: eight files predated this run with no manifest. All eight were attributed on
  2026-08-14 - the three newsroom PDFs by exact shasum match on re-download, the five newsroom HTML
  pages by re-download diffing to nothing but the Rails CSRF token and a spam-honeypot CSS class.
  NONE were deleted for being unattributable (unattributed_deleted = 0). Four were then pruned as
  exact duplicates carrying no unique fact, to keep the store within the 3-document budget:
  smart-1/press-kit.pdf, smart-3/press-kit.pdf and smart-5/press-kit.pdf were the newsroom
  "download as PDF" exports of newsroom pages already saved here as HTML (text compared
  sentence-by-sentence; identical, and the #5 PDF's text layer is actually lossy - it drops fi/ffi
  ligatures, printing "ef ciency" and " ve"), and smart-3/spec-page-2.html was a Mallorca press-drive
  release whose only figures ("under 30 minutes" 10-80%, 5.8-3.7 s, 315 kW) are all stated more
  precisely on the German spec page. Their URLs were:
  https://d21buns5ku92am.cloudfront.net/70301/pdf/campaigns/901-the-new-smart-1-uk-specification-and-pricing-revealed.pdf
  (sha256 f6053ef775c7476afd5e6d3003dfd688929a8613ee9ba28bedc9bf0ef03d6f85),
  https://d21buns5ku92am.cloudfront.net/70297/pdf/campaigns/921-european-premiere-of-smart-3-and-world-premiere-of-25th-anniversary-edition.pdf
  (sha256 5191c007fbba5f3e8366a9ae97ac9d17c1dbd8dd414e0ffbbe107784c5d4462e),
  https://d21buns5ku92am.cloudfront.net/70297/pdf/campaigns/789-the-most-spacious-versatile-and-technologically-advanced-smart-redefines-its-segment.pdf
  (sha256 9f07525fad2bdf7ac6a281e5cc922ccabe1eb3bad9dd1b83d9e81e81cf8c617f) and
