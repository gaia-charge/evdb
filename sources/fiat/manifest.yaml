notes: >-
  Brand-wide findings for Fiat (all three models):
  (1) fiat.de and fiat.at model pages are client-rendered SPAs and expose no PDF
  links in the served HTML, but the Fiat Austria hub
  https://www.fiat.at/kaufberatung/preislisten-broschuren DOES list every current
  /content/dam/fiat2023/at/pricelist/... PDF path in plain HTML - that is the
  reliable discovery route for this brand. Both domains serve the PDFs to a
  browser-header curl without an Akamai block.
  (2) The Austrian 'Preise, Ausstattungen, Technische Daten' lists are much richer
  than the German 'Preise und Ausstattungen' lists: only the Austrian ones carry
  the Anzahl-der-Sitzplaetze row and the full Ladedauer table. Where both exist,
  the German one is closer to the queue's model year and the Austrian one closes
  the field gaps.
  (3) NO V2L / Vehicle-to-Load row appears in ANY Fiat document fetched here
  (500e, 600e, Grande Panda, German and Austrian). The queue's bidirectional.v2l
  gap cannot be closed from Fiat price lists - it needs a press-kit source or
  must stay null.
  (4) Waermepumpe appears only for the 600e (option code BBV). It is absent from
  every 500e and Grande Panda list.
  (5) Charge-time bases differ within the brand: the 500e is quoted 0-to-80% SOC,
  the 600e and Grande Panda 20-to-80% SOC. Nothing is quoted 10-80%, so the
  queue's charging.time_10_to_80_min gap cannot be closed from these documents.
  (6) SEATS: 500e = 4 (explicitly 'Anzahl der Sitzplaetze 4'), 600e = 5,
  Grande Panda = 5.
