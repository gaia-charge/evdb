    notes: >
      Official "Lynk & Co 02 Press Kit" PDF, linked as the media asset of the 11 Oct 2024
      launch release on the Lynk & Co newsroom. Carries a full Core/More technical
      specification table: motor type "Electric Motor, synchronous, mounted on the rear axle"
      (single motor), Powertrain RWD, torque 343 Nm, 200 kW, 0-100 km/h 5.5 s, top speed
      180 km/h; battery type NCM, 66 kWh, 400 V; AC 11 kW (Core) / 22 kW (More),
      DC 150 kW, rapid charging approx. 30 min from 10 % to 80 %; range combined
      435 km (Core) / 445 km (More) and urban 563 km / 592 km; consumption 176 Wh/km /
      171 Wh/km combined and 136 / 129 Wh/km urban; length 4460 mm, width (folded mirrors)
      1845 mm, height 1573 mm, wheelbase 2755 mm. Heat pump is named as a More-only
      feature ("the More version has a greater range due to the active grille shutter and
      heat pump"). Large file (32 MB) because of the embedded press photography.
