documents:
  - file: mitsubishi-eclipse-cross-ev/spec-page.html
    url: https://www.mitsubishi-motors.de/eclipse-cross/technik
    type: spec_page
    covers_models: [mitsubishi-eclipse-cross-ev]
    covers_variants: [mitsubishi-eclipse-cross-ev-87kwh-2026]
    fields_present:
      - performance.motors
      - performance.total_torque_nm
      - efficiency.wltp_kwh_per_100km
    notes: >-
      Official Mitsubishi Germany (MMD Automobile GmbH) technology page for the
      new fully-electric Eclipse Cross. Confirmed text: "Der elektrisch erregte
      Synchronmotor (EESM) liefert kraftvolle 160 kW (218 PS) und ein
      Drehmoment von 300 Nm" - a single EESM motor with a one-speed gearbox -
      and "je nach Bedarf mit 11 kW oder optional 22 kW AC-Ladeleistung. An
      Schnellladestationen mit bis zu 150 kW", plus WLTP consumption
      16,7-17,1 kWh/100 km. Real server-rendered HTML (about 11.8k chars of
      text), not a JS shell. No DC 10-80% time, no heat pump, no V2L, no
      dimensions and no seat count on this page.
  - file: mitsubishi-eclipse-cross-ev/spec-page-2.html
    url: https://www.mitsubishi-motors.de/eclipse-cross/varianten-preise
    type: spec_page
    covers_models: [mitsubishi-eclipse-cross-ev]
    covers_variants: [mitsubishi-eclipse-cross-ev-87kwh-2026]
