    fetched_at: "2026-08-13"
    notes: >-
      Official Lotus press release "Lotus revamps Eletre and Emeya line-up". Provenance
      re-established on 2026-08-14: re-downloaded from this URL, shasum matches byte-for-byte
      (d28173c5da6aced4cb705974d0b2e97e3b7f6837, 244290 bytes).
      Covers BOTH models, which is why the same file is stored in both model directories
      (lotus-eletre/spec-page-2.html and lotus-emeya/spec-page-2.html are byte-identical) -
      that duplication is intentional, not an accident.
      Verified in the text layer: 'Eletre 600: 450 kW (612 bhp) dual-motor, 4WD, 112 kWh battery
      pack, 22kW onboard charger, active air suspension with Continuous Damping Control, 20-inch
      wheels, torque vectoring'; and on charging - 'Thanks to its 800V battery technology with
      Advanced Lotus Hyper Charging it can be charged from 10-80% in around 14 minutes (under
      perfect conditions) using a 400kW DC charger (Eletre: 20 minutes from 10-80% at a 350kW
      DC charger)'.
      CHARGING CAVEAT: two different 10-80% numbers appear here for two different chargers -
      Emeya 14 min @ 400 kW DC, Eletre 20 min @ 350 kW DC. Use the 350 kW figure to stay
      consistent with the press-portal spec tables; the 400 kW figure is a best-case claim.
      This release is also the best available evidence for production_status (it describes the
      current, actively-sold 600/900 line-up).
