notes: >-
  All six pre-existing Lotus HTML files were left on disk by an interrupted earlier run with no
  manifest. Every one was attributed on 2026-08-14 from its own <link rel="canonical"> tag and
  then confirmed by re-download: five match byte-for-byte, and lotus-emeya/spec-page.html differs
  only by server-appended marketing tracking params in two meta tags (diff inspected). Nothing
  was deleted - unattributed_deleted = 0.
  READING THESE FILES: they are Vue/Sitecore server-rendered pages. The technical tables and
  equipment lists are inside the embedded JSON payload with \uXXXX-escaped HTML, so plain
  tag-stripping yields only ~1-3 KB of marketing text and looks like an empty JS shell. Decode
  the unicode escapes first, then parse the <table> / feature-list blocks.
  BRAND-LEVEL GAP CAVEAT - fields Lotus does not publish anywhere official that was reachable:
  bidirectional.v2l (no Lotus source mentions V2L or vehicle-to-load at all for either model),
  range.wltp_city_km (Lotus publishes only WLTP combined), charging.time_0_to_80_min (Lotus
  publishes the 10-80% window instead), and features.heat_pump for the Emeya.
  charging.charging_speed_kmh is not published as such either; the closest is the 400/420 kW peak
  DC power claims.
  No Lotus price list PDF exists for any EU market as far as searching could establish - Lotus
  sells via an online configurator and publishes no downloadable Preisliste, which is why this
  brand is covered by web pages rather than the preferred price-list PDFs.
