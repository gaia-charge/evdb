    notes: >-
      Lotus press-portal model page for the Eletre - the single most valuable Lotus document,
      because it carries a real technical table (not marketing copy). Provenance re-established
      on 2026-08-14: re-downloaded from this URL, shasum matches the stored file byte-for-byte
      (57f7b02dff47d57cfb8eb4f0a361f6da4cbcc9e1, 265134 bytes); the file's own
      <link rel="canonical"> and og:url both point here.
      The table is embedded in the Vue/Sitecore SSR JSON payload (unicode-escaped HTML), so it is
      NOT visible to a naive tag-strip - decode \uXXXX escapes first. Columns are the six trims:
      600 | 600 GT | 600 GT SE | 600 SPORT SE | 900 SPORT | 900 SPORT CARBON. Rows verified:
      'Powertrain configuration: Full time all wheel drive with Lotus ICC intelligent torque
      distribution'; 'Electric motor front/rear: Permanent magnet'; 'Transmission: Single speed
      (front and rear)' except 900 SPORT CARBON 'Single speed (front) and two speed (rear)';
      'Max power (bhp/PS/kW) 603/612/450' (600 trims) and '905/918/675' (900 trims);
      'Max torque (Nm) 710' / '985'; '0-62 mph / 0-100 km/h (secs) 4.5' / '2.95';
      'Battery Capacity (kWh) - Gross 112'; 'Battery Type: Ternary lithium ion battery';
      'Battery Voltage 708'; 'Charging time 10%-80% (350kW DC) 20' minutes;
      'Charging time 10%-80% (22kW AC) 5.8' hours; 'WLTP Combined range (km/miles) 570-600'
      down to '410'.
      MAPPING CAVEAT: the queue variants are 'Base' and 'S', but Lotus has renamed the line-up to
      600/900 trims - map before extracting. No seats, heat pump, V2L or city range here.
      The identical page is also served from the press portal at
      https://media.lotuscars.com/en/models/lotus-eletre-technology-performance-and-luxury-in-a-spacious-and-practical-pure-electric-hyper-suv.html
      (byte-identical, 265134 bytes); the lotuscars.com canonical URL is recorded as the source.
