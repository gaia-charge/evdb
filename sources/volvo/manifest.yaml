caveats:
  - "charging.time_0_to_80_min: Volvo does not publish a 0-80% DC figure anywhere. Every official Volvo source (model spec pages and MY27 price lists) gives DC 10-80% in minutes and AC 0-100% in hours. This gap is unfillable from official sources - leave it empty rather than deriving it."
  - "charging.charging_speed_kmh: Volvo publishes 'Nachgeladene Reichweite bei 10 Minuten DC-Laden, km' (ES90, EX60, EX90 price lists only). That is km recharged in 10 minutes, not km/h; convert explicitly if the schema wants km/h. No such figure exists for EX30, EX30 Cross Country, EC40 or EX40."
  - "battery.chemistry: the only official statement is 'Lithium-Ionen-Hochvoltbatterie' in the price lists. No cell chemistry (NMC/LFP) is published by Volvo for any of these models."
  - "battery.gross_kwh: Volvo labels the figure 'Batterieenergie (nominal)' / 'Speicherkapazität nominal' - decide gross vs net at extraction time; do not assume it is the usable capacity."
  - "dimensions.* and seats: present only on the volvocars.com specifications pages, never in the price lists (which have no Radstand/Länge rows)."
  - "features.heat_pump: only the price lists mention 'Wärmepumpe'. It is an equipment-line item (not a spec-table row), so it is trim-dependent - on the EX30 explicitly 'Nicht in Verbindung mit Motor P3 electric und P5 electric'."
  - "Model-year drift: all price lists are MY27 (ES90 is MY27.5) while many queue variants are MY2024/2025 (EC40, EX30, EX30 Cross Country, EX40) or MY2026/2027 (ES90, EX60). Check drift before writing any value onto an older variant."
  - "The volvocars.com and pricelists.volvocars.com hosts return HTTP 403 to plain curl and to WebFetch; they only answer a full browser header set (User-Agent + Accept + Accept-Language + Sec-Fetch-*). Use that if these documents need re-fetching."
  - "seats for volvo-ex30-cross-country: no official document states it. The CC is the same 5-seat EX30 body (volvo-ex30/spec-page.md: 'Anzahl der Sitze 5'), and the CC dimensions article confirms identical length/wheelbase, but treat the seat count as inferred, not sourced."
  - "production_status: evidenced only indirectly. EC40, EX30 (incl. Cross Country trims), EX40, EX90 and ES90 all have current MY27/MY27.5 German price lists with firm EUR prices = on sale. The EX60 list is headed 'Der neue Volvo EX60' with '1) vorläufige Werte' on the P12 and 'Daten liegen noch nicht vor' for its city range = announced/launching, not yet fully homologated. No document uses the words production status."
