# Platform Architecture Types:
# - dedicated: Purpose-built for EVs only
# - flexible: Supports ICE, PHEV, and BEV on same platform
# - adapted: Modified ICE platform for electric powertrains

# Voltage Architectures:
# - 400V: Standard, supports up to ~150-200kW DC charging
# - 800V: High-voltage, enables 250-350kW+ ultra-fast charging
# - Multi-voltage: Can charge at both 400V and 800V (e.g., E-GMP)

