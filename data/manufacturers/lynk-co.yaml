# Manufacturer: Lynk & Co
id: lynk-co
name: Lynk & Co
official_name: Lynk & Co International AB
country: CN  # China (Geely), HQ in Gothenburg, Sweden
founded: 2016
website: https://www.lynkco.com
parent_company: Geely Auto Group

description: >
  Lynk & Co is a Swedish-Chinese automotive brand co-owned by Geely and Volvo Cars. 
  Founded in 2016 and headquartered in Gothenburg, Sweden, the brand originally offered 
  a subscription-based ownership model. The 02 is the brand's first fully electric model 
  in Europe, built on Geely's SEA platform (shared with Volvo EX30, Zeekr X, Smart #1/#3). 
  Sold direct-to-consumer through online sales and experience stores (Clubs) in major 
  European cities.

ev_platforms:
  - name: SEA
    description: Sustainable Experience Architecture (Geely platform, shared with Volvo EX30, Zeekr X, Smart #1/#3)
    battery_architecture: 400V

sustainability:
  carbon_neutral_target: null
  notes: >
    Benefits from Geely group sustainability initiatives. Uses shared SEA platform 
    for efficient manufacturing.

notes: >
  European presence since 2020 with subscription model (Lynk & Co 01 PHEV). 
  The 02 (launched October 2024) is the first pure BEV. Sales through online 
  platform and physical Clubs in Amsterdam, Gothenburg, Berlin, Barcelona, and more. 
  Also offers the 08 (PHEV SUV, not BEV). Part of Geely group alongside Volvo, 
  Polestar, Zeekr, Lotus, and Smart.

