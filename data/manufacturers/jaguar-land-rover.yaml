description: |
  Jaguar Land Rover Automotive PLC is a British multinational automotive company
  headquartered in Coventry, England. It is a subsidiary of Tata Motors, India's
  largest automotive manufacturer. The company is the parent company of Jaguar
  Cars Limited (Jaguar) and Land Rover, two iconic British car brands. JLR has
  been pioneering electrification with the Jaguar I-PACE (2018), one of the
  first premium electric SUVs, and is transitioning to become an all-electric
  luxury brand by 2025 (Jaguar) and offering electric variants across Land Rover
  lineup.

electrification_strategy: |
  Jaguar will become an all-electric luxury brand from 2025, with a complete
  reimagining of the marque. Land Rover will offer electric variants of all
  models by 2030. JLR is investing £15 billion in electrification and
  sustainability. The I-PACE pioneered JLR's electric journey and won multiple
  awards including 2019 World Car of the Year, European Car of the Year, and
  German Car of the Year.

