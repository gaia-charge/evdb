# Smart Automobile Co., Ltd.
# Germany/China - Joint venture between Mercedes-Benz and Geely Holding
# Founded: 2019 (rebranded as electric-only brand)
# Focus: Compact premium electric vehicles for urban mobility

id: smart
name: Smart Automobile Co., Ltd.
country: DE
parent_company: Mercedes-Benz Group AG & Geely Holding
founded_year: 1994
headquarters_city: Böblingen
headquarters_country: DE
website: https://www.smart.com/

description: >
  Smart is a premium electric vehicle brand originally founded by Mercedes-Benz in 1994 
  to create innovative urban mobility solutions. In 2019, Smart was relaunched as a 
  joint venture between Mercedes-Benz Group AG (50%) and Geely Holding (50%), 
  transforming into an all-electric brand. The new Smart focuses on compact premium 
  electric SUVs and crossovers designed for modern urban lifestyles, combining 
  Mercedes-Benz design DNA with Geely's electric vehicle technology and manufacturing 
  expertise.

ev_focus: true

ev_platforms:
  - name: SEA (Sustainable Experience Architecture)
    type: dedicated_ev
    voltage: 400
    description: >
      Geely's SEA platform shared with Volvo (EX30), Zeekr, and other Geely brands. 
      Modular architecture supports 400V electrical systems with fast DC charging up 
      to 150kW. Provides excellent packaging efficiency for compact vehicles.

electrification_strategy:
  target_year: 2030
  target_percentage: 100
  description: >
    Smart has been 100% electric since 2020 with no plans for ICE vehicles. The brand 
    focuses exclusively on battery electric vehicles for the European and Chinese markets.

sustainability:
  carbon_neutral_target: 2039
  commitments:
    - Carbon-neutral production at China plants by 2028
    - Partnership with Mercedes-Benz for battery recycling
    - Use of sustainable materials in interiors (recycled polyester, vegan leather)
    - Urban mobility focus reduces total emissions vs traditional vehicles

notable_achievements:
  - Original Smart fortwo (1998) pioneered ultra-compact city cars
  - First premium compact EV brand with Mercedes design heritage
  - Smart #1 won multiple design and innovation awards (2023)
  - Fastest-growing premium compact EV brand in Europe (2023)
  - Strategic partnership leverages Mercedes design + Geely EV technology

vehicle_count_active: 2

