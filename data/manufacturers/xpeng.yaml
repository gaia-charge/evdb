parent_company:
description: >
  XPENG (also written XPeng) is a Chinese electric vehicle manufacturer founded in 2014, headquartered in Guangzhou, China. The company focuses on smart electric vehicles with advanced autonomous driving capabilities. XPENG entered the European market in 2024, starting with Norway, the Netherlands, Sweden, Denmark, and Germany. Known for its 800V architecture, fast charging, and advanced ADAS features powered by its proprietary XPILOT system.

ev_platforms:
- name: SEPA 2.0
  description: Smart Electric Platform Architecture 2.0 with 800V SiC technology
  battery_architecture: 800V

sustainability:
  carbon_neutral_target:
  notes: >
    XPENG operates its own manufacturing facilities in Zhaoqing and Guangzhou, China. Uses LFP batteries from CATL for cost efficiency and safety.

notes: >
  XPENG is publicly listed on NYSE and HKEX. The company differentiates through its focus on software and autonomous driving technology. European expansion began in 2024 with the G6 and G9 SUVs. The 2025 facelift G6 features 800V architecture enabling ultra-fast DC charging up to 451kW. Direct sales model in Europe with delivery centers and service partners.

