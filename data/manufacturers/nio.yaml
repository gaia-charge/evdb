sustainability:
  carbon_neutral_target: null
  notes: >
    NIO operates battery swap stations across Europe enabling battery reuse and recycling. 
    Uses sustainable materials in interiors (recycled PET bottle textiles).

notes: >
  NIO is publicly listed on NYSE. The company operates NIO Houses (premium showrooms and 
  community spaces) in major European cities. Battery swap network expanding across Europe 
  with stations in Germany, Netherlands, Norway, Sweden, Denmark, and along major highways. 
  NIO Subscription offers all-inclusive vehicle subscriptions as an alternative to purchase. 
  The Aquila Super Sensing ADAS system with lidar is standard across the range.

