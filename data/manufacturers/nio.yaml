# Manufacturer: NIO
id: nio
name: NIO
official_name: NIO Inc.
country: CN  # China
founded: 2014
website: https://www.nio.com
parent_company: null
description: >
  NIO is a Chinese premium electric vehicle manufacturer founded in 2014 by William Li, 
  headquartered in Shanghai. NIO differentiates through its Battery-as-a-Service (BaaS) 
  ownership model, battery swap network (Power Swap stations enabling 3-5 minute battery 
  exchanges), and premium user community (NIO Houses). European sales began in 2022 with 
  Germany, Netherlands, Norway, Sweden, and Denmark. Models include ET5, ET5 Touring, ET7 
  (sedans), EL6, EL7, EL8 (SUVs). Known for strong performance, comprehensive standard 
  equipment, and innovative ownership models.

ev_platforms:
