id: audi
name: Audi AG
country: DE
founded: 1909
parent_company: Volkswagen Group
headquarters: Ingolstadt, Germany
website: https://www.audi.com

brands:
- Audi

ev_platforms:
- name: MLB evo (adapted ICE platform)
  description: Modified longitudinal platform for e-tron SUV/Sportback (2018-2024)
  voltage: 400V
- name: PPE (Premium Platform Electric)
  description: Dedicated EV platform co-developed with Porsche for 800V architecture (Q6 e-tron, A6 e-tron)
  voltage: 800V
  release_year: 2024
- name: MEB (adapted for Audi)
  description: VW Group MEB platform with Audi-specific tuning (Q4 e-tron)
  voltage: 400V

electrification_strategy:
  commitment: All-electric brand by 2033
  targets:
  - "Stop developing new ICE engines after 2026"
  - "Last new ICE model in 2026"
  - "60% BEV sales by 2027"
  - "100% BEV by 2033"
  investment: Over €18 billion in electrification and digitalization through 2027

sustainability:
  carbon_neutral_target: "Production sites carbon-neutral by 2025, full value chain by 2050"
  initiatives:
  - "Aluminum Closed Loop recycling program"
  - "Green electricity at production sites"
  - "Battery recycling partnerships"
  - "Renewable energy purchases"
technology:
- "Quattro electric AWD (dual motor)"
- "Matrix LED and Digital Matrix LED headlights"
- "MMI touch response dual-screen system"
- "e-tron Charging Service (400,000+ charging points Europe)"
- "Predictive efficiency assistant"
- "Virtual cockpit plus (12.3\" digital instrument cluster)"

notes: |
  Premium brand of Volkswagen Group. Pioneer in electric luxury with e-tron launch in 2018.
  Focus on quattro AWD heritage translated to electric drivetrains.
  PPE platform co-developed with Porsche brings 800V ultra-fast charging to Audi lineup from 2024.

