# Manufacturer: GWM (Great Wall Motor)
id: gwm
name: GWM
official_name: Great Wall Motor Company Limited
country: CN  # China
founded: 1984
website: https://www.gwm-global.com
parent_company:
description: >
  Great Wall Motor (GWM) is one of China's largest automobile manufacturers, headquartered in Baoding,
  Hebei Province. Founded in 1984, GWM initially focused on pickup trucks and SUVs before expanding into
  electric vehicles through its ORA sub-brand (launched 2018). ORA focuses exclusively on battery-electric
  vehicles, targeting the European market with affordable, retro-styled compact cars. The ORA 03 (originally
  "Funky Cat") was the first model launched in Europe in 2023. GWM also operates the WEY premium brand
  (PHEVs, not covered in this database). European operations are managed through GWM Europe GmbH based
  in Munich, Germany.

