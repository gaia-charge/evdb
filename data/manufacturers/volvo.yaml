# Manufacturer: Volvo Cars
id: volvo
name: Volvo Cars
official_name: Volvo Car Corporation
country: SE  # Sweden
founded: 1927
website: https://www.volvocars.com
parent_company: Geely Holding Group
description: >
  Volvo Cars is a Swedish premium automobile manufacturer founded in 1927 and owned by Chinese automotive company Geely Holding since 2010. Known for safety innovation and Scandinavian design, Volvo committed to becoming a fully electric car company by 2030, with all new models launched from 2024 onwards being electric only. The company targets 50% battery electric vehicles in global sales by 2025.

ev_platforms:
  - name: SPA2
    description: Scalable Product Architecture 2 (for larger EVs like EX90, EM90)
    battery_architecture: 400V
  - name: SEA
    description: Sustainable Experience Architecture (Geely platform, for EX30, EX40)
    battery_architecture: 400V

sustainability:
  carbon_neutral_target: 2040
  sustainability_report_url: https://www.volvocars.com/intl/v/sustainability
  notes: >
    Volvo aims for climate neutrality by 2040, with 2.5 million tonnes CO2 reduction target by 2025. All new models electric-only from 2024. Focuses on circular economy, recycled materials, and ethical supply chains. Publishes detailed LCA (lifecycle assessment) reports for all EVs.

notes: >
  Volvo Cars was founded in Gothenburg, Sweden and remains headquartered there despite Chinese ownership since 2010. The company pioneered many automotive safety innovations including the three-point seatbelt (1959). Volvo's electric strategy focuses on premium safety, Scandinavian design, and sustainability. The EX30 (2024) is built on Geely's SEA platform and manufactured in China, representing a new affordable compact EV direction for the brand.

