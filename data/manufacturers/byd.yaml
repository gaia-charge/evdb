notes: >
  BYD is unique among major automakers in that it manufactures its own batteries
  and has fully transitioned to electric and plug-in hybrid vehicles (no pure ICE models).
  The company's Blade Battery uses LFP (lithium iron phosphate) chemistry and has passed
  extreme safety tests including nail penetration without catching fire. BYD's vertical
  integration strategy (batteries, motors, electronics, chips) allows for competitive
  pricing. The company is rapidly expanding globally, particularly in Europe, Southeast Asia,
  and South America. In 2023, BYD overtook Tesla as the world's largest EV seller.

