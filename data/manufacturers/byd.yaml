description: >
  BYD (Build Your Dreams) is a Chinese multinational manufacturer of automobiles,
  batteries, and electronic products. BYD is the world's largest manufacturer of
  electric vehicles and plug-in hybrids, surpassing Tesla in global sales.
  The company manufactures its own batteries, including the innovative Blade Battery
  (LFP chemistry) which prioritizes safety, longevity, and cost-effectiveness.

