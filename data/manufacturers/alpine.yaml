# Manufacturer: Alpine
id: alpine
name: Alpine
official_name: Automobiles Alpine SAS
country: FR  # France
founded: 1955
website: https://www.alpinecars.com
parent_company: Renault Group
description: >
  Alpine is a French sports car manufacturer founded in 1955 by Jean Rédélé, now part of the Renault
  Group. Historically known for lightweight sports cars and rally success, Alpine is transitioning to
  an all-electric performance brand. The A290 electric hot hatch (based on Renault 5) launched in 2024,
  followed by the A390 electric crossover. Alpine also competes in Formula 1 as Alpine F1 Team.

