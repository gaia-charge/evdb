notes: >
  Alpine is being repositioned as Renault's premium electric performance brand. The product roadmap
  includes the A290 (hot hatch, 2024), A390 (crossover, 2025), and a future sports car. Alpine F1
  Team provides motorsport credibility. Built at Renault ElectriCity factory in Douai, France.

