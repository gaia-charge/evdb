description: >
  Genesis is the luxury vehicle division of Hyundai Motor Group, launched in 2015.
  Genesis is transitioning to become an all-electric luxury brand by 2025, offering
  premium electric vehicles built on the E-GMP platform with 800V ultra-fast charging,
  Vehicle-to-Load capability, and sophisticated design. Genesis EVs combine Korean luxury
  with cutting-edge EV technology, competing with established German premium brands.

