notes: >
  Genesis is Hyundai's answer to German luxury brands like Mercedes-Benz, BMW, and Audi.
  All Genesis EVs feature 800V ultra-fast charging (10-80% in ~20 minutes), Vehicle-to-Load
  (V2L) capability for powering external devices, and luxurious interiors with quilted Nappa
  leather. Genesis is unique among luxury brands in committing to become fully electric by 2025.
  The brand emphasizes "Athletic Elegance" design philosophy and offers exceptional warranty coverage.

