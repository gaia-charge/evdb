# Nissan Motor Company, Ltd.
# https://www.nissan.com/

id: nissan
name: Nissan Motor Company, Ltd.
short_name: Nissan
country: JP  # Japan
founded: 1933
headquarters:
  city: Yokohama
  country: JP

description: >
  Nissan is a Japanese multinational automobile manufacturer headquartered in Yokohama, Japan.
  Founded in 1933, Nissan is part of the Renault-Nissan-Mitsubishi Alliance, the world's largest
  automotive alliance. Nissan was an early pioneer in electric mobility with the Nissan LEAF,
  launched in 2010 as the world's first mass-market electric car. The LEAF remains one of the
  best-selling electric vehicles globally with over 650,000 units sold. Nissan's current EV
  strategy focuses on its e-POWER hybrid technology and pure electric models built on dedicated
  EV platforms.

parent_company: Nissan Motor Co., Ltd. (independent, part of Renault-Nissan-Mitsubishi Alliance)

