# Manufacturer: Leapmotor
id: leapmotor
name: Leapmotor
official_name: Zhejiang Leapmotor Technology Co., Ltd.
country: CN  # China
founded: 2015
website: https://www.leapmotor.com
parent_company:
description: >
  Leapmotor is a Chinese electric vehicle manufacturer founded in 2015, headquartered in Hangzhou, China.
  In 2023, Stellantis acquired a 51% stake in Leapmotor International, the joint venture handling global
  (non-China) sales and distribution. This gives Leapmotor access to Stellantis' extensive European dealer
  network and manufacturing facilities. The T03 city car is produced at Stellantis' Tychy plant in Poland.
  European launch began in Q4 2024 with two models: the T03 city car and C10 compact SUV.

