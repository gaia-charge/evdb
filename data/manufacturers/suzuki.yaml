ev_platforms:
  - name: Heartect-e
    description: >
      Suzuki's first dedicated electric vehicle skateboard platform. Developed for subcompact
      and compact electric vehicles with emphasis on structural integrity and low center of
      gravity. Features LFP battery packs from BYD FinDreams and Tata Gotion. Supports FWD
      and AWD (AllGrip-e) configurations. eAxle technology co-developed with Toyota.
    vehicles:
      - Suzuki e Vitara (2025-present)

