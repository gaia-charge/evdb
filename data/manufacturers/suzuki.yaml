id: suzuki
name: Suzuki Motor Corporation
short_name: Suzuki
country: JP
founded: 1909
headquarters:
  city: Hamamatsu
  country: JP

description: >
  Suzuki Motor Corporation is a Japanese multinational corporation specializing in compact
  vehicles and motorcycles. One of the world's largest automobile manufacturers by volume,
  Suzuki is particularly dominant in India through its Maruti Suzuki subsidiary. The company
  has been a late entrant to the BEV market but launched its first mass-produced electric
  vehicle, the e Vitara, in 2025. Developed on the Heartect-e platform in collaboration
  with Toyota, the e Vitara targets the affordable compact electric SUV segment. Suzuki's
  EV strategy focuses on practical, affordable electric vehicles leveraging its strengths
  in small car engineering and its manufacturing base in India.

parent_company: null

