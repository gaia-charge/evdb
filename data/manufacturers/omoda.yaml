# Manufacturer: OMODA (Chery)
id: omoda
name: OMODA
official_name: OMODA & JAECOO (Chery Automobile Co., Ltd.)
country: CN
founded: 2022
website: https://www.omodaauto.eu
parent_company: Chery Automobile
description: >
  OMODA is a brand created by Chery Automobile, one of China's largest independent
  automakers founded in 1997. OMODA was established in 2022 as a youth-oriented
  brand targeting global markets alongside sister brand JAECOO. Chery is one of
  China's most experienced car exporters with presence in over 80 countries.

  OMODA entered the European market in 2024 with the C5 (ICE) and E5 (BEV),
  establishing dealer partnerships across multiple European countries. The brand
  leverages Chery's extensive manufacturing experience (over 25 years) and R&D
  capabilities to offer competitive vehicles with modern technology.

