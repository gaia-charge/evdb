description: >
  Dongfeng Motor Corporation is one of China's largest automotive manufacturers, a state-owned enterprise
  headquartered in Wuhan, Hubei. The company entered the European EV market in 2024 with the affordable
  Nammi Box city car, targeting the budget segment. Dongfeng has partnerships with multiple global OEMs
  including Stellantis, Nissan, and Honda in the Chinese market. The European expansion focuses on
  competitively priced electric vehicles.

