# Notable Facts
notes: "World's 4th largest automaker by production volume (6.2 million vehicles in 2023). Formed from €52 billion merger of PSA Group and Fiat Chrysler Automobiles in 2021. 14 iconic automotive brands under one umbrella with heritage dating back to 1899 (Fiat) and 1896 (Peugeot). Strong position in Europe, North America, and Latin America. Partnership with Foxconn for software-defined vehicles. Joint venture with CATL and Samsung SDI for battery production. First legacy OEM to commit to 100% BEV sales in Europe by 2030. Fiat 500e is Europe's best-selling A-segment electric car."

