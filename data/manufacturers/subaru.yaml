# Subaru Corporation
# https://www.subaru-global.com/

id: subaru
name: Subaru Corporation
short_name: Subaru
country: JP  # Japan
founded: 1953
headquarters:
  city: Tokyo
  country: JP

description: >
  Subaru Corporation is a Japanese multinational corporation and conglomerate primarily involved
  in aerospace, transportation, and automobiles. The automotive division manufactures automobiles
  under the Subaru brand. Subaru is known for its use of the boxer engine layout in most vehicles
  above 1500 cc, all-wheel drive (AWD) on most mid-size and larger vehicles, and the
  WRX performance car. Subaru has a reputation for rugged, reliable vehicles with excellent
  all-weather capabilities. The company has been slower to electrify than some competitors,
  maintaining its focus on AWD performance and utility. The Solterra is Subaru's first pure
  battery-electric vehicle, developed jointly with Toyota as a sister model to the bZ4X,
  and emphasizes Subaru's traditional strengths of AWD capability and safety.

parent_company: Toyota Motor Corporation (20% ownership)

brands:
- Subaru

ev_platforms:
- name: e-Subaru Global Platform (e-TNGA)
  description: >
    Subaru's first dedicated electric vehicle platform, developed jointly with Toyota.
    Based on Toyota's e-TNGA (Electric Toyota New Global Architecture) but tuned specifically
    for Subaru's AWD performance and safety priorities. Features Subaru's Symmetrical AWD
    system adapted for electric motors, X-MODE all-terrain management, and advanced driver
    assistance. Designed for mid-size crossovers with focus on utility, safety, and
    all-weather capability.
  vehicles:
  - Subaru Solterra (2022-present)

notable_models:
  electric:
  - Subaru Solterra (2022-present, compact SUV, first BEV)
  iconic:
  - Subaru Impreza WRX/STI (1992-present, sports sedan)
  - Subaru Outback (1994-present, crossover wagon)
  - Subaru Forester (1997-present, compact SUV)
  - Subaru Crosstrek/XV (2012-present, subcompact crossover)
  - Subaru BRZ (2012-present, sports coupe, co-developed with Toyota 86)

production_sites:
