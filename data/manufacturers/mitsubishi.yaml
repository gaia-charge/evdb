# Manufacturer: Mitsubishi
id: mitsubishi
name: Mitsubishi
official_name: Mitsubishi Motors Corporation
country: JP  # Japan
founded: 1970
website: https://www.mitsubishi-motors.com
parent_company: Renault-Nissan-Mitsubishi Alliance
description: >
  Mitsubishi Motors is a Japanese automotive manufacturer and member of the Renault-Nissan-Mitsubishi
  Alliance. A pioneer in plug-in hybrid technology with the Outlander PHEV, Mitsubishi is now entering
  the pure BEV market in Europe with the Eclipse Cross EV, built on the Alliance's AmpR Medium platform
  (shared with Renault Scenic E-Tech and Nissan Ariya). The Eclipse Cross EV represents Mitsubishi's
  first dedicated BEV for the European market, leveraging Alliance platform sharing to deliver a
  competitive compact SUV with up to 633 km WLTP range.

ev_platforms:
  - name: AmpR Medium (CMF-EV)
    description: Renault-Nissan-Mitsubishi Alliance platform for C/D-segment EVs
    battery_architecture: 400V

sustainability:
  carbon_neutral_target: 2050
  notes: >
    Mitsubishi targets carbon neutrality by 2050. The Eclipse Cross EV will be manufactured
    in Europe (likely Renault facilities) to avoid import duties.

