ev_strategy: >
  FAW Group is expanding its Hongqi (Red Flag) luxury brand internationally with 
  electric vehicles. The Hongqi EH7 sedan launched in Europe in 2025 as the brand's 
  first European model, positioned as a premium electric sedan competing with the 
  BMW i4, Tesla Model 3, and Mercedes-Benz EQE. FAW is leveraging its experience 
  in the Chinese market where Hongqi has been a top-selling premium EV brand.

