ev_strategy: |
  GM's Ultium platform underpins its electric vehicle strategy across all brands.
  Key technologies include flexible battery architecture (50-200+ kWh), 400V and 800V 
  electrical systems, and wireless battery management. The company targets 1 million 
  EVs annually by 2025 in North America, with European expansion through Cadillac.

