description: |
  General Motors is one of the world's largest automotive manufacturers, headquartered in 
  Detroit, Michigan. The company operates through multiple brands including Cadillac, 
  Chevrolet, GMC, and Buick. GM is investing heavily in electrification through its 
  Ultium platform (BEV3), targeting an all-electric future.

  In Europe, GM re-entered the market in 2024 with the Cadillac brand, offering direct-to-
  consumer sales of electric vehicles starting with the Lyriq SUV in Switzerland, Sweden, 
  France, and Germany. The Cadillac Optiq compact SUV followed in late 2025.

