description: >
  VinFast is a Vietnamese electric vehicle manufacturer founded in 2017 as part of Vingroup,
  Vietnam's largest private conglomerate. VinFast entered the European market in 2023, initially
  in France, Germany, and the Netherlands. The company manufactures vehicles at its Hai Phong
  factory in Vietnam and is building a factory in North Carolina, USA. VinFast offers a range
  of electric SUVs from compact to full-size.

