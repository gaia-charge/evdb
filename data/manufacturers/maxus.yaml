history: |
  MAXUS originated from the British LDV Group, acquired by SAIC Motor in 2010.
  Relaunched as MAXUS brand focusing on commercial and passenger electric vehicles.
  Known primarily for electric vans (eDeliver) in Europe, expanding into passenger SUVs
  with the Euniq 6. The brand leverages SAIC Motor's manufacturing and battery capabilities.

