  notes: |
    Porsche is part of Volkswagen Group but maintains strong independence. The 
    brand is positioned at the pinnacle of VW Group's portfolio alongside Bentley 
    and Lamborghini, focusing on luxury sports cars and SUVs.

    The Taycan represents Porsche's vision for electric performance: no compromise 
    on driving dynamics, build quality, or charging speed. The 800V architecture 
    is a game-changer for fast charging (10-80% in ~23 minutes with 270kW chargers).

    Porsche's motorsports heritage includes 19 overall Le Mans victories and 
    countless racing championships. This DNA flows into their EVs - the Taycan 
    holds the Nürburgring EV lap record.
