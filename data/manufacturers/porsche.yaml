id: porsche
name: Porsche AG
country: DE
founded: 1931
headquarters: Stuttgart, Germany
parent_company: Volkswagen Group
website: https://www.porsche.com

description: |
  Porsche AG is a German luxury and sports car manufacturer based in Stuttgart, 
  founded in 1931 by Ferdinand Porsche. The company is renowned for its iconic 
  911 sports car, engineering excellence, and rich motorsports heritage. Porsche 
  has been majority-owned by Volkswagen Group since 2009, while maintaining its 
  distinct brand identity and operational independence.

  In the electric era, Porsche has emerged as a pioneer with the Taycan, the 
  brand's first fully electric sports car launched in 2019. The Taycan showcases 
  Porsche's commitment to performance electrification with 800V architecture 
  enabling ultra-fast charging, sports car handling dynamics, and trademark 
  Porsche build quality.

ev_platforms:
- name: J1 Platform
  description: |
    800V dedicated EV platform co-developed with Audi (PPE platform shares technology).
    Supports Taycan sedan and Cross Turismo wagon variants.
  voltage: 800
  years_active: 2019-present
  vehicles:
  - Taycan sedan (2019-present)
  - Taycan Cross Turismo (2021-present)
  - Taycan Sport Turismo (2022-present)

- name: PPE Platform
  description: |
    Premium Platform Electric, co-developed with Audi for next-generation 800V EVs.
    Will underpin Macan Electric and future electric Cayenne.
  voltage: 800
  years_active: 2024-present
  vehicles:
  - Macan Electric (2024-present)
  - Future: Electric Cayenne

electrification_strategy:
  target: |
    By 2030, over 80% of Porsche vehicles to be fully electric. Porsche will 
    continue to offer combustion engines where demanded, particularly for 911.

  commitments:
  - "€15 billion investment in electrification and digitalization by 2025"
  - "Carbon-neutral value chain by 2030"
  - "All new vehicles to be electric or hybrid from 2030 onwards"
  - "Taycan first all-electric Porsche sports car (2019)"
  - "Macan Electric launched 2024 (all-electric)"
  - "Next-generation Cayenne to offer EV variant"
  battery_strategy: |
    Porsche partners with Cellforce Group (Porsche subsidiary since 2021) to 
    develop high-performance lithium-ion cells with silicon anodes for improved 
    energy density and fast charging. Target: 800V cells with >350 Wh/kg.

  charging_infrastructure: |
    Porsche co-founded IONITY (with BMW, Mercedes, Ford, Hyundai, VW Group) to 
    build 350kW ultra-fast charging network across Europe. Porsche Charging 
    Service provides access to 400,000+ charging points across Europe with 
    premium IONITY rates.

  sustainability: |
    - Carbon-neutral production at Zuffenhausen plant (Taycan)
    - 100% renewable electricity at German plants
    - Battery recycling partnerships
    - Sustainable materials in interiors (recycled materials, Race-Tex)

notable_achievements:
- "First 800V production EV architecture (Taycan, 2019)"
- "World's fastest charging production EV: 270kW peak (Taycan)"
- "Taycan holds Nürburgring lap record for electric vehicles (7:33.350)"
- "Winner of World Performance Car 2020 (Taycan)"
- "Winner of World Luxury Car 2020 (Taycan)"
- "Over 150,000 Taycan units sold globally by 2023"
- "24 Hours of Le Mans victories: 19 overall wins (most of any manufacturer)"

