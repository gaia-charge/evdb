  Cupra is SEAT's performance-oriented electric sub-brand, launched in 2018.
  Originally SEAT's performance trim level, Cupra became an independent brand
  focusing on sportier, more premium vehicles with emotional design and 
  dynamic driving characteristics. All Cupra models are either plug-in hybrid
  or fully electric.

