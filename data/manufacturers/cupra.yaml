notes: >
  Cupra is SEAT's performance sub-brand launched in 2018, focusing on sportier
  EVs with emotional design. First fully electric model is Born (2021), built on
  VW MEB platform (shared with ID.3). Brand DNA: emotional design, sporty handling,
  premium interior, signature copper accents. Target: younger, performance-oriented
  EV buyers. Production at SEAT's Martorell plant in Spain. Over 570 Cupra dealers
  across Europe (2024). Cupra charging network access via SEAT/VW partnerships.

