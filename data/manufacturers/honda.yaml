# Honda Motor Company, Ltd.
# https://www.honda.com/

id: honda
name: Honda Motor Company, Ltd.
short_name: Honda
country: JP  # Japan
founded: 1948
headquarters:
  city: Tokyo
  country: JP

description: >
  Honda is a Japanese multinational conglomerate manufacturer of automobiles, motorcycles, and
  power equipment. Founded in 1948 by Soichiro Honda, the company is the world's largest
  motorcycle manufacturer and a leading automotive manufacturer globally. Honda has been
  relatively late to pure electric vehicles, focusing initially on hybrid technology with its
  two-motor hybrid system (e:HEV). However, Honda is now accelerating its EV strategy with the
  e:N brand for Europe and China, and a partnership with General Motors for North America.
  Honda aims for 100% electric and fuel cell sales by 2040.

parent_company: Honda Motor Co., Ltd. (independent)

brands:
  - Honda
  - Acura (luxury brand, North America)

ev_platforms:
  - name: e:N Architecture F
    description: >
      Honda's dedicated front-wheel drive electric vehicle platform. Developed specifically
      for compact to mid-size EVs in the European and Chinese markets. Features a flat floor,
      improved packaging, and optimized battery integration. Used for the e:Ny1.
    vehicles:
      - Honda e:Ny1
      - Honda e:NS1 (China)
      - Honda e:NP1 (China)
    
  - name: e:N Architecture W
    description: >
      Honda's dedicated all-wheel drive electric vehicle platform for larger vehicles.
      Used for mid-size to large EVs in China.
    vehicles:
      - Honda e:NS2 (China)
      - Honda e:NP2 (China)
  
  - name: Honda e Platform
    description: >
      Dedicated EV platform for the Honda e city car. Compact rear-wheel drive platform
      optimized for urban mobility. Not shared with other models.
    vehicles:
      - Honda e (Europe only, discontinued 2023)

notable_models:
  electric:
    - Honda e (2020-2023, compact city car, Europe)
    - Honda e:Ny1 (2023-present, compact SUV, Europe)
    - Honda Prologue (2024-present, mid-size SUV, North America, GM Ultium platform)
  hybrid:
    - Honda Civic e:HEV
    - Honda CR-V e:HEV
    - Honda Accord Hybrid
    - Honda Jazz e:HEV
  fuel_cell:
    - Honda Clarity Fuel Cell (discontinued)

production_sites:
  ev_production:
    - location: Dongfeng Honda, Wuhan, China
      models: [Honda e:Ny1, Honda e:NS1]
    - location: GAC Honda, Guangzhou, China
      models: [Honda e:NP1, Honda e:NP2]
    - location: Swindon, UK
      models: [None - plant closed 2021]
    - location: Marysville, USA
      models: [Honda Prologue (uses GM plant)]

