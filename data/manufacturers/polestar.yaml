sustainability:
  commitment: |
    Polestar aims to produce a truly climate-neutral car by 2030. The company publishes 
    lifecycle assessments (LCA) for all its vehicles, showing total carbon footprint 
    transparency from production to end-of-life.
  
  targets:
    - Climate-neutral car by 2030
    - 100% recycled aluminum in future models
    - Blockchain traceability for supply chain
    - Sustainable interior materials (vegan options)

