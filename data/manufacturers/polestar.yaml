description: |
  Polestar is a Swedish automotive brand that specializes in electric performance cars. Originally 
  established as Volvo's performance division in 1996, it was transformed into a standalone electric 
  vehicle brand in 2017 as a joint venture between Volvo Cars and Geely Holding.
  
  Polestar focuses on premium electric vehicles that combine Scandinavian design, cutting-edge 
  technology, and performance. The brand emphasizes sustainability, transparency, and innovation,
  with a direct-to-consumer sales model and a focus on software-driven features.

