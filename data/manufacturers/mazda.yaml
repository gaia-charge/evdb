# Mazda Motor Corporation
# https://www.mazda.com/

id: mazda
name: Mazda Motor Corporation
short_name: Mazda
country: JP  # Japan
founded: 1920
headquarters:
  city: Hiroshima
  country: JP

description: >
  Mazda is a Japanese multinational automotive manufacturer headquartered in Hiroshima, Japan.
  Founded in 1920, Mazda is known for its rotary engine technology (Wankel), the MX-5 Miata
  sports car, and its "Zoom-Zoom" driving philosophy emphasizing driving enjoyment. Mazda has
  been relatively conservative in its approach to electrification, initially focusing on
  efficient Skyactiv combustion engines and mild hybrids. The MX-30 is Mazda's first pure
  electric vehicle for Europe, featuring unique freestyle doors and a focus on sustainability
  with recycled materials. Mazda has a strategic partnership with Toyota for EV development
  and platform sharing.

parent_company: Independent (Toyota owns 5% stake)

brands:
  - Mazda

ev_platforms:
  - name: MX-30 Platform
    description: >
      Purpose-built electric vehicle platform for the MX-30. Based on Mazda's Skyactiv
      Vehicle Architecture but modified for electric propulsion. Features a relatively
      small 35.5 kWh battery optimized for urban driving and minimizing environmental
      impact from production. Platform allows for later R-EV (rotary range extender) variant.
    vehicles:
      - Mazda MX-30 EV
      - Mazda MX-30 R-EV (range extender with rotary engine)

notable_models:
  electric:
    - Mazda MX-30 (2020-present, compact crossover, Europe/Japan)
    - Mazda MX-30 R-EV (2023-present, range extender, Europe/Japan)
  rotary:
    - Mazda RX-7 (1978-2002, sports car, discontinued)
    - Mazda RX-8 (2003-2012, sports car, discontinued)
  iconic:
    - Mazda MX-5/Miata (1989-present, roadster)
    - Mazda CX-5 (2012-present, compact SUV)
    - Mazda3 (2003-present, compact car)

production_sites:
