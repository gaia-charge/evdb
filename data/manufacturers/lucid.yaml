description: |
  Lucid Group is an American automotive company specializing in luxury electric vehicles. 
  Founded in 2007 as Atieva (battery technology company), it was renamed Lucid Motors in 
  2016 and launched its first vehicle, the Lucid Air luxury sedan, in 2021.

  Led by CEO Peter Rawlinson (former Tesla Model S Chief Engineer), Lucid focuses on 
  advanced electric vehicle technology, industry-leading efficiency, and ultra-luxury 
  positioning. The company's Arizona factory (AMP-1) produces the Air sedan, with plans 
  for the Gravity SUV launching in 2025.

  Lucid's proprietary technology includes miniaturized drive units, 900V+ electrical 
  architecture enabling 300kW+ DC fast charging, and exceptional packaging efficiency 
  creating limousine-like interior space in mid-size sedan footprint. The Air holds 
  records for EV efficiency (up to 5.0 mi/kWh EPA) and range (up to 516 miles EPA).

