id: opel
name: Opel Automobile GmbH
country: DE
founded: 1862
parent_company: Stellantis N.V.
website: https://www.opel.com/
ev_focus: true
ev_platforms:
  - cmp  # Common Modular Platform (shared with Peugeot, Citroën, DS)
description: |
  Opel is a German automobile manufacturer and part of Stellantis (formerly PSA Group). 
  Founded in 1862, Opel has been a volume brand in Europe for over 160 years.
  
  Under Stellantis ownership since 2017, Opel is transitioning to become an all-electric 
  brand in Europe by 2028. The company leverages Stellantis' Common Modular Platform (CMP) 
  for its electric vehicles, sharing technology with Peugeot, Citroën, and DS brands.
  
  Opel is known for its "German engineering with democratic pricing" philosophy, offering 
  reliable, practical vehicles at competitive prices. The brand emphasizes value, 
  functionality, and technology accessibility.
  
  Key electric models include Corsa-e, Mokka-e, Astra Electric, and Combo-e (commercial van).
target_markets:
  - DE  # Germany (home market)
  - FR  # France
  - GB  # United Kingdom
  - ES  # Spain
  - IT  # Italy
  - PL  # Poland
  - NL  # Netherlands
notes: |
  - Opel brand sold as Vauxhall in UK (same vehicles, different badge)
  - Part of Stellantis (14 automotive brands including Peugeot, Citroën, Fiat, Jeep)
  - Rüsselsheim headquarters and technical center
  - Eisenach plant produces Opel Grandland (EV production planned)
  - Target: 100% BEV sales in Europe by 2028 (earliest in Stellantis)
  - Opel Corsa-e and Peugeot e-208 are mechanically identical (badge engineering)
  - "Greenovation" strategy: affordable electric mobility for everyone
  - IntelliLux LED matrix headlights technology leader in affordable segment
sources:
