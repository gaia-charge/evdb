# Škoda Auto - Czech Republic (Volkswagen Group)
id: skoda
name: Škoda Auto
country: CZ
founded: 1895
parent_company: Volkswagen Group
website: https://www.skoda-auto.com
description: |
  Škoda Auto is a Czech automobile manufacturer founded in 1895, making it one of the oldest car companies in the world. 
  The company has been part of Volkswagen Group since 1991 and is headquartered in Mladá Boleslav, Czech Republic.
  
  Škoda is known for offering practical, spacious, and value-oriented vehicles with VW Group engineering quality. 
  The brand emphasizes "Simply Clever" features - thoughtful design details that make daily life easier.
  
  In the EV market, Škoda leverages VW's MEB platform to offer competitive electric vehicles with generous interior space 
  and equipment levels at attractive prices. The Enyaq iV was Škoda's first purpose-built electric vehicle (2020).

platforms:
  - name: MEB
    description: Volkswagen Group's Modular Electric Drive platform (shared with VW, Audi, Cupra)
    voltage: 400V
    vehicles:
      - Enyaq iV
      - Enyaq Coupé iV

