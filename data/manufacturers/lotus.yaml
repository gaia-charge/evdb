description: >
  Lotus Cars Limited is a British automotive company known for producing sports cars and racing cars.
  Founded by Colin Chapman in 1948, Lotus has a storied history in motorsport and lightweight performance vehicles.
  Now owned by Chinese automotive group Geely, Lotus has pivoted to electric vehicles with the Eletre SUV (2023)
  and Emeya grand tourer (2024), while maintaining its performance heritage. The brand's philosophy of
  "Simplify, then add lightness" continues to influence its electric vehicle designs.

notable_models:
  - Eletre (electric performance SUV)
  - Emeya (electric GT)
  - Emira (last ICE sports car)
  - Evija (electric hypercar)

