notes: >
  Hyundai Motor Group has emerged as a leader in EV technology with the E-GMP platform,
  which features 800V ultra-fast charging (10-80% in 18 minutes), Vehicle-to-Load (V2L)
  capability, and bidirectional charging readiness. The Ioniq 5, Ioniq 6, and Kia EV6
  have received critical acclaim for their technology, design, and value proposition.
  Genesis is becoming an all-electric luxury brand by 2025.

