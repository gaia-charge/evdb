description: >
  Hyundai Motor Group is a South Korean multinational automotive manufacturer.
  The group has made significant investments in electric vehicles with the E-GMP platform,
  offering competitive range, fast charging (800V architecture), and innovative features
  like Vehicle-to-Load (V2L) capability. The Ioniq sub-brand is dedicated to EVs.

