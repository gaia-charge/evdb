description: >
  TOGG (Türkiye'nin Otomobili Girişim Grubu - Turkey's Automobile Initiative Group)
  is a Turkish automotive manufacturer that produces fully electric vehicles. Founded
  as a joint venture by five major Turkish industrial groups (Anadolu Group, BMC, Kök
  Group, Turkcell, and Zorlu Holding) under the auspices of the Union of Chambers
  and Commodity Exchanges of Turkey (TOBB). TOGG manufactures its vehicles at a
  state-of-the-art factory in Gemlik, Bursa. The T10X SUV was the first model,
  followed by the T10F fastback sedan. TOGG aims to expand into European markets.

