# History & Notable Facts
history: |
  SAIC Motor acquired British brand MG (Morris Garages) in 2007.
  Relaunched MG in Europe with focus on affordable electric vehicles.
  MG4 Electric launched 2022, became Europe's best-selling Chinese EV.

