description: >
  BMW Group is a German multinational manufacturer of luxury vehicles and motorcycles.
  The company's EV lineup includes vehicles under the BMW and Mini brands, with the
  i-series (i3, i4, iX, etc.) representing their dedicated and adapted electric models.
  BMW is transitioning to dedicated EV platforms with the upcoming Neue Klasse architecture.

