notes: >
  BMW has been an early adopter of electric vehicles with the i3 (2013-2022) and i8 plug-in hybrid.
  The current generation uses adapted platforms (CLAR) for vehicles like i4, iX, i5, and i7.
  The company is developing the Neue Klasse platform (launching 2025) as a dedicated EV architecture
  with 800V charging and improved efficiency. BMW targets 50% of sales to be electric by 2030.

