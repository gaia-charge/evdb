notes: |
  Renault Group is a French multinational automobile manufacturer established
  in 1899. The company is a pioneer in European electric mobility with the
  Renault Zoe (launched 2012) being one of Europe's best-selling EVs for years.

  Under the Renaulution strategic plan (2021), the company targets 90% of 
  Renault brand vehicles to be electric by 2030. The CMF-EV platform, shared
  with Alliance partner Nissan, underpins their latest generation of EVs.

  Renault Group is part of the Renault-Nissan-Mitsubishi Alliance, one of the
  world's leading automotive alliances.

