  description: Sustainable Experience Architecture 2 (Geely platform, shared with Volvo EX30, Smart   #1)
  battery_architecture: 400V

sustainability:
  carbon_neutral_target:
  notes: >
    As a new brand, Zeekr benefits from Geely group sustainability initiatives. Uses CATL batteries and Geely's VREMT (Viridi E-Mobility Technology) for motors and batteries.

notes: >
  Zeekr was created by Geely to be a premium EV brand competing with Tesla and European luxury EVs. European launch started in late 2024 with the Zeekr X crossover and Zeekr 001 estate. Direct-to-consumer sales model without traditional dealerships. Design led by Stefan Sielaff (ex-VW Group/Mercedes).

