parent_company: Geely Auto Group
description: >
  Zeekr is a premium electric vehicle brand founded in 2021 as part of Geely Auto Group. Headquartered in Hangzhou, China, Zeekr focuses on performance-oriented battery electric vehicles. The brand entered the European market in late 2024 with direct-to-consumer sales in Sweden, Netherlands, Germany, Belgium, Norway, and France. Zeekr shares Geely's SEA platform with Volvo EX30 and Smart #1.

ev_platforms:
