description: |
  Rolls-Royce Motor Cars is a British luxury automobile manufacturer owned by BMW Group 
  since 2003. The company handcrafts vehicles at its Goodwood, England facility. The Spectre, 
  launched in 2023, is the marque's first fully electric vehicle, built on the Architecture 
  of Luxury platform shared with the Phantom and Cullinan. Rolls-Royce has committed to 
  becoming a fully electric brand by 2030.

website: https://www.rolls-roycemotorcars.com
ev_strategy: |
  Rolls-Royce has committed to becoming fully electric by 2030. The Spectre is the first 
  step, with additional electric models planned across the range. The Architecture of 
  Luxury platform supports both combustion and electric powertrains, enabling gradual 
  transition while maintaining the brand's hallmark ride quality and craftsmanship.

