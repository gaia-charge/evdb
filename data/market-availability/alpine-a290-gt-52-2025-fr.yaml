notes: 'Alpine A290 GT is the entry-level trim with 180 ch (130 kW) motor and 52 kWh battery. WLTP range: 380 km. 0-100 km/h in 7.4s. Top speed 160 km/h. Standard equipment includes 19" Iconic wheels, Michelin Pilot Sport EV tires, heated sport seats, 10.1" infotainment with Alpine Portal, leather Nappa steering wheel, Brembo brakes, adaptive cruise control with Stop & Go, bidirectional charging (11 kW AC, 100 kW DC). Based on Renault 5 platform but with performance-focused tuning and premium equipment. Made in France at Douai plant. Eligible for full €4,000 bonus écologique.'
