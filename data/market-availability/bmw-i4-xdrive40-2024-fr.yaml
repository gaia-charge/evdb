notes: |
  BMW i4 xDrive40 in France faces stiff competition from local brands
  (Peugeot, Renault) at lower price points. Premium positioning limits volume.

  Key France-specific considerations:
  - No bonus écologique (exceeds €47,000 price cap)
  - Prime à la conversion available when scrapping old vehicle
  - Company car buyers benefit from TVS exemption and higher amortization
  - Autoroute speed limit 130 km/h (good for efficiency vs Germany)
  - Strong charging infrastructure along autoroutes (Ionity, TotalEnergies)
  - AWD less critical than in Germany/Poland (milder winters in most regions)

  Competitors in France:
  - Tesla Model 3 LR AWD: €53,990 (cheaper, eligible for some incentives)
  - Peugeot e-3008 Long Range: €46,990 (cheaper, qualifies for bonus)
  - BMW i4 eDrive40: €58,150 (cheaper, more range, RWD sufficient for France)

