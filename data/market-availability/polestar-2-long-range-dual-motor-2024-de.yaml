# Market Notes
notes: |
  Polestar operates a direct-to-consumer model in Germany. Orders placed online at polestar.com, 
  with delivery to home or Polestar Space pickup. Service through Volvo network.

  Polestar Spaces (showrooms) in Berlin, Munich, Hamburg, Cologne, Frankfurt, Stuttgart.

  Umweltbonus ended December 2023, but company car tax benefits (0.25% rule) remain.

  Strong competition from Tesla Model 3 (€49,990), BMW i4 (€56,900), and other premium EVs.

