notes: |
  **Why ë-C4 You! is a Smart Choice:**

  The ë-C4 You! offers distinctive coupe-crossover style at the most accessible price:

  **Value Proposition:**
  - €37,985 base price undercuts Kona Electric by €5,000
  - €6,000 savings vs Shine Plus with same powertrain
  - Can add only the options you need (à la carte approach)
  - Strong residual values (65.4% after 3 years)

  **Citroën Comfort DNA:**
  What sets ë-C4 apart from competitors:
  - Progressive Hydraulic Cushions suspension (unique to Citroën)
  - Advanced Comfort seats with extra 15mm foam padding
  - Softer suspension tuning prioritizes comfort over sport
  - Quiet cabin (20% better sound insulation than C4 petrol)
  - Smooth electric drivetrain amplifies comfort focus

  **Range Reality Check:**
  357km WLTP (305km real-world mixed) is adequate for:
  - German average daily commute: 35-50km (charge 1-2x/week)
  - Weekend trips <250km (no charging needed)
  - Longer trips require one DC stop per 250-280km
  - 100kW DC charging (10-80% in 30 min) makes stops tolerable

  Not ideal for:
  - Daily >150km commutes without workplace charging
  - Regular long-distance travel (consider Kona/Niro with 500km+ range)

  **Company Car Sweet Spot:**
  At 0.25% monthly list price taxation:
  - €94.96/month taxable benefit (€342/year at 30% tax rate)
  - vs €330/month for combustion C4 (€1,188/year at 30%)
  - Saves €846/year despite €5,000 higher list price
  - Over 3-year lease: €2,538 tax savings

  **Configuration Strategy:**
  Most buyers choose You! + Heat Pump + Safety Pack Plus = ~€40-41k total
  This saves €3,000-4,000 vs Shine Plus while covering essentials

  **Sales Reality:**
  You! represents 40% of ë-C4 sales in Germany
  Buyers prioritize value and distinctive design over premium trim
  Heat pump take rate is ~70% (essential for German climate)

  **Competition:**
  ë-C4 You! is unique in offering C-segment coupe-crossover at €37,985
  MG4 is cheaper but smaller (B-segment), sportier (not comfort-focused)
  Kona/Niro offer more range but cost €5k more and lack distinctive design
  Leaf has comparable price but older tech (2017 design, CHAdeMO)

  **Bottom Line:**
  Choose ë-C4 You! if you want:
  - Distinctive coupe-crossover design
  - Citroën's legendary ride comfort
  - C-segment space at accessible price
  - Value over premium trim features

  Skip it if you need:
  - Long-range capability (500km+)
  - Maximum cargo space (380L is tight for C-segment)
  - All features standard (You! requires option additions)
