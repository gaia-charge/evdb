  configuration_advice: |
    **Recommended Configuration (€41,035):**
    - Base You!: €37,985
    - Heat Pump: €750 (essential for German winters, +15-20% winter range)
    - Safety Pack Plus: €950 (ACC, parking camera, blind spot)
    - Visibility Pack: €600 (front sensors, auto-dimming mirror)
    - Metallic Paint: €750

    This setup costs €2,950 less than base Shine Plus (€43,985) while covering essentials.
    Add Comfort Pack (€1,100) if heated seats/steering wheel important.

    **Why not Shine Plus?**
    Shine Plus costs €6,000 more for premium trim and standard features.
    Most buyers prefer You! + essential options (saves €3,000-4,000).
    You! holds value slightly better (65.4% vs 63.2% after 3 years).

    **Range Consideration:**
    305km real-world range means:
    - Perfect for daily commute + weekly charging
    - One DC fast charge stop for 400-500km trips
    - Two stops for 600km+ journeys
    - Consider longer-range competitor if >200km daily driving

