notes: '2025 Cupra Born facelift brings significant improvements: larger 79 kWh battery (580 km WLTP), faster 185 kW DC charging, and refreshed design. Priced at €44,990 - competitive with Tesla Model 3 RWD (€42,990) and Hyundai Ioniq 6 (€46,900). Built in Barcelona, strong brand appeal in Germany. VW Group dealer network provides good service coverage. Heat pump standard for 2025 model year.'
