# Incentives & taxation (Germany 2024)
incentives:
- name: "Company Car Tax Benefit"
  type: tax_credit
  amount: 3360
  currency: EUR
  period: annual
  description: >
    Company car tax rate: 0.25% of gross list price (€45,990 x 0.25% = €115/month).
    Savings vs ICE: €3,360/year (1% rate would be €460/month).
    Applies to vehicles under €70,000 gross list price.
  eligibility: "Company car drivers"
  valid_until: "2030-12-31"

- name: "Kfz-Steuer Exemption"
  type: tax_exemption
  amount: 350
  currency: EUR
  period: annual
  description: "EV exemption from Kfz-Steuer until 2030 (saves ~€350/year vs comparable ICE)"
  eligibility: "All EV owners"
  valid_until: "2030-12-31"

- name: "THG-Quote CO2 Certificate"
  type: grant
  amount: 300
  currency: EUR
  period: annual
  description: >
    THG-Quote (Treibhausgasminderungs-Quote): CO2 certificate trading revenue.
    Sell your EV's CO2 savings certificate (~€250-350/year depending on market).
  eligibility: "All EV owners"
  valid_until:

- name: "KfW Wallbox Subsidy"
  type: subsidy
  amount: 900
  currency: EUR
  period: one_time
  description: >
    KfW 440/441 wallbox subsidy (currently exhausted, check availability).
    Covers up to €900 for home wallbox installation.
  eligibility: "Homeowners, limited availability"
  valid_until:

