notes: |
  The BMW iX xDrive50 2026 model year at €102,900 (+€3,000 vs 2024 model) includes
  significant improvements: larger 109kWh battery (+25km range), faster 210kW DC charging,
  V2G/V2H capability standard, and BMW Operating System 9.5.

  COMPANY CAR TAX WARNING: Price exceeds €70,000 threshold. Company car drivers pay
  1% monthly tax rate (€1,029/month = €12,348/year) instead of the favorable 0.25%
  rate available for EVs under €70k. This results in €9,261/year additional tax cost.
  For many company car users, the BMW iX1 or iX (xDrive40 if available) may be more
  tax-efficient choices.

  New for 2026:
  - V2G and V2H capability (standard) allows using car as home energy storage
  - Improved Highway Assistant with hands-free driving on approved Autobahn sections
  - BMW Operating System 9.5 with enhanced AI and natural language processing
  - Improved aerodynamics reducing consumption from 19.8 to 19.2 kWh/100km
  - New frozen paint options (Individual)

  Key competitive advantages:
  - Excellent 655km WLTP range (25km more than 2024)
  - Most advanced BMW interior technology
  - Class-leading 2,500kg towing capacity
  - V2G capability for energy arbitrage and backup power
  - Strong German brand prestige

  Competition: Mercedes-Benz EQS SUV 450 4MATIC (€108,000, 600km), Audi Q8 e-tron 55
  (€92,000, 582km), Tesla Model X Long Range (€98,000, 560km). The BMW iX offers best
  balance of range, luxury, and technology in the segment.

  Delivery time improved to 12 weeks (from 14 weeks in 2024) due to increased production
  capacity at BMW Dingolfing plant.

