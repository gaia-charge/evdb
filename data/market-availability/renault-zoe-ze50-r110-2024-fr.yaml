notes: |
  Renault Zoe ZE50 R110 in French home market at €32,500 before incentives.
  With Bonus Écologique (€5,000), effective price is just €28,315. With full
  incentives (Bonus + Prime à la Conversion = €7,500), price drops to €25,815.
  
  Historic French city EV - made in Flins, France since 2012. Compact, agile,
  perfect for urban driving. Entry-level R110 motor (109 hp) with 52 kWh battery
  provides 386 km WLTP range. Ideal first EV or city car.
  
  French market advantages:
  - Made in France (Flins plant)
  - Strong incentives (up to €7,500)
  - Fast delivery (8-10 weeks)
  - Proven reliability
  - Strong resale value in France
  - Excellent dealer network

