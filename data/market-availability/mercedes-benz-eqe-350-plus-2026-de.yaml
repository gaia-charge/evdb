notes: |
  The Mercedes-Benz EQE 350+ 2026 model year at €75,900 (+€3,000 vs 2024 model)
  includes significant improvements: larger 94kWh battery (+26km range), faster
  180kW DC charging, rear-axle steering now standard (previously €1,190 option),
  and improved MBUX with enhanced AI voice assistant.

  COMPANY CAR TAX: Price exceeds €70,000 threshold by €5,900. Company car drivers
  pay 1% monthly tax rate (€759/month = €9,108/year) instead of the favorable 0.25%
  rate. This results in €6,831/year additional tax cost. For comparison:
  - BMW i5 eDrive40 (€69,800): 0.25% rate = €2,277/year
  - Mercedes EQE 350+ (€75,900): 1% rate = €9,108/year
  - Difference: €6,831/year higher tax cost

  For many company car users, the BMW i5 eDrive40 may be more tax-efficient despite
  less range (498km vs 665km WLTP).

  New for 2026:
  - Rear-axle steering (up to 10°) now standard - improves turning circle to 10.7m
  - MBUX Hyperscreen standard (was optional Premium Package)
  - Enhanced AI voice assistant with better natural language understanding
  - Improved aerodynamics reducing consumption from 17.1 to 16.3 kWh/100km
  - New MANUFAKTUR color (Emerald Green)

  Key competitive advantages:
  - Excellent 665km WLTP range (26km more than 2024)
  - Industry-leading MBUX Hyperscreen (56-inch panoramic display)
  - Outstanding aerodynamics (0.22 Cd) for efficiency
  - Luxurious interior with executive rear seat options
  - Mercedes-Benz prestige and build quality

  Competition: BMW i5 eDrive40 (€69,800, 498km), Audi A6 e-tron (€74,900, 620km),
  Tesla Model S (€92,990, 634km). The EQE 350+ offers best combination of range,
  efficiency, and luxury in the executive sedan segment under €80k.

  Delivery time: 14 weeks (improved from 16 weeks in 2024) due to increased
  production capacity at Mercedes-Benz Bremen plant.

