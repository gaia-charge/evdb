notes: |
  The Peugeot e-308 GT represents the premium end of the C-segment electric market.
  At €49,085, it offers exceptional value for company car drivers thanks to 0.25% taxation.

  Key advantages over competitors:
  - Premium interior with Alcantara and leather (vs cloth in VW ID.3)
  - Focal Hi-Fi audio system standard (optional/unavailable on rivals)
  - Head-up display standard (€890+ option on VW/Cupra)
  - Better ride quality and refinement than German rivals
  - Still under €70k company car tax threshold

  GT trim adds €4,000 over Allure but delivers:
  - 18" wheels (€950 value)
  - LED Matrix headlights upgrade (~€800 value)
  - Focal audio (€990+ value)
  - Head-up display (GT exclusive)
  - Alcantara/leather interior
  - Heated/massaging seats (with GT Pack)
  - Sport-tuned suspension

  For private buyers without incentives, the €9,000 premium vs ICE GT is steep.
  For company car drivers, the €3,300/year tax savings makes it compelling.

  Competes with: VW ID.3 Pro S, Cupra Born VZ, Renault Megane E-Tech Iconic.
  Differentiator: Most refined and sophisticated interior in the segment.
