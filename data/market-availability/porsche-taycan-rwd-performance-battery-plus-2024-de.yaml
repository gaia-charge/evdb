competitive_advantages:
  - LONGEST Taycan range (678km WLTP) - best for touring
  - SAME 800V charging as expensive variants (270kW peak)
  - Pure rear-drive sports car character (classic Porsche feel)
  - LIGHTEST Taycan (2,170kg) - best handling balance
  - MOST EFFICIENT Taycan (17.9 kWh/100km)
  - Porsche build quality and brand prestige at entry price
  - Strong residual values
  - €16k cheaper than 4S while offering practical advantages

market_notes: |
  Taycan RWD is the SMART CHOICE for most buyers. It offers:
  - Best range in lineup (678km vs 568km for 4S)
  - Same fast charging as Turbo S (no compromise)
  - Lightest and most efficient
  - Pure rear-drive sports car feel
  - €16k less than 4S (€25k less than Turbo)
  
  Unless you need AWD traction or sub-5-second 0-100, the RWD delivers complete 
  Taycan experience with better range and lower cost.
  
  PERFECT for:
  - Company car users (maximize tax benefits while minimizing costs)
  - Long-distance drivers (best range + fast charging)
  - First-time Porsche buyers (entry point with no compromises)
  - Efficiency enthusiasts (lowest running costs in lineup)
  
  Typical German RWD buyer:
  - Age: 40-55
  - Income: €100k+/year
  - Occupation: Middle/senior management, professionals
  - Previous vehicles: Premium mid-size sedans (BMW 3/5, Audi A4/A6, Mercedes C/E)
  - Motivation: Premium brand at accessible price, range, efficiency, tax benefits
  
  Smart spec (~€105k):
  - Base: €92,841
  - 22kW charger: €1,470
  - Porsche InnoDrive: €2,890
  - Comfort Package: €2,950
  - PTV Plus: €1,890
  - PSCB brakes: €3,200
  - Sport Chrono: €1,280
  - Total: ~€106,521
  
  This spec delivers 95% of 4S experience for €20k less (4S with options ~€125k).

environmental:
  lifecycle_co2_tonnes: 39
  production_co2_tonnes: 18
  use_phase_co2_tonnes: 21
  assumptions: 200,000 km lifespan, EU electricity mix, 21.5 kWh/100km real-world
  notes: |
    MOST EFFICIENT Taycan variant:
    - Production: ~18 tonnes CO2 (same as other variants)
    - Use phase: ~21 tonnes CO2 (200,000 km, EU mix) - LOWEST in lineup
    - Total: ~39 tonnes CO2 lifecycle
    
    Comparison vs 4S:
    - RWD: 39 tonnes (21.5 kWh/100km)
    - 4S: 42 tonnes (24.5 kWh/100km)
    - RWD saves ~3 tonnes CO2 over lifecycle (7% reduction)
    
    With 100% renewable electricity:
    - Use phase: ~7 tonnes CO2
    - Total lifecycle: ~25 tonnes CO2

metadata:
  data_quality: verified
  created_at: '2026-02-08'
  last_updated: '2026-02-08'
  sources:
    - https://www.porsche.com/germany/models/taycan/taycan-models/taycan/
    - https://finder.porsche.com/de/de-DE/
  notes: |
    Taycan RWD is the most underrated variant in the lineup. Smart buyers 
    recognize it offers best value: longest range (678km), lightest weight, 
    same fast charging, pure RWD sports car feel, €16k savings vs 4S.
    
    For company car users in Germany, RWD offers maximum tax efficiency:
    - Lowest monthly taxable benefit (0.25% of lowest Taycan price)
    - Longest range reduces charging frequency
    - Lower running costs (most efficient)
    
    RWD introduced March 2021 (2 years after launch) to broaden Taycan appeal 
    and accessibility. Has been successful in attracting new-to-Porsche buyers.
