options_notes: |
  SMART OPTIONS for RWD buyers on budget (~€10-12k):
  - 22kW AC charger (€1,470) - essential for fast home charging
  - Porsche InnoDrive (€2,890) - optimizes range, excellent for touring
  - Comfort Package (€2,950) - daily comfort
  - PTV Plus (€1,890) - handling upgrade
  - PSCB brakes (€3,200) - no brake dust, easier maintenance
  - Sport Chrono (€1,280) - unlocks full 280kW overboost power
  
  Total: ~€13,680 in smart options → ~€106k well-equipped RWD

available_incentives:
  - name: BAFA Umweltbonus (Federal EV subsidy)
    amount: 0
    type: rebate
    eligibility: Not available (ended December 2023)
    valid_until: '2023-12-31'
    notes: |
      BAFA subsidy ended December 17, 2023. RWD was previously eligible (under 
      €65k threshold) and received €4,500 federal + €2,250 manufacturer subsidy 
      (€6,750 total). Not available for current orders.
  - name: Company Car Tax (Dienstwagen-Besteuerung)
    amount: 8400
    type: tax_credit
    eligibility: 0.25% monthly taxation on list price (vs 1% for ICE)
    description: |
      Example: €105,000 well-equipped Taycan RWD
      - Electric: €105k × 0.25% × 12 = €3,150/year taxable benefit
      - ICE equivalent: €105k × 1% × 12 = €12,600/year taxable benefit
      - Tax savings: ~€8,400/year (assuming ~40% marginal tax rate)
      
      EXCELLENT value proposition for company car users!
    valid_until: '2030-12-31'
  - name: Kfz-Steuer (Vehicle Tax) Exemption
    amount: 300
    type: tax_exemption
    eligibility: All BEVs
    valid_until: '2030-12-31'
  - name: THG-Quote
    amount: 300
    type: rebate
    eligibility: All BEV owners
    description: Annual payment for CO2 savings certificate

