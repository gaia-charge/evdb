  pricing_notes: |
    Base price includes:
    - Performance Battery Plus (larger 93.4kWh usable battery)
    - 19" Taycan Aero wheels (standard, optimized for range)
    - Partial leather interior with synthetic inserts
    - 3-zone climate control with heat pump
    - Porsche Communication Management (PCM) 6.0
    - 16.8" curved touchscreen + 12.6" digital instrument cluster
    - Sound Package Plus (10 speakers)
    - LED headlights
    - Porsche Active Suspension Management (PASM) with air suspension
    - Connected services for 3 years
    
    ENTRY-LEVEL PRICING: RWD is the most affordable Taycan, offering best 
    value-for-money with longest range (678km WLTP) and same 800V fast charging 
    as expensive variants.
    
    German pricing includes 19% VAT (MwSt).

