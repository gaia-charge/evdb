notes: >
  The Lotus Eletre represents a bold entry into the premium electric SUV market.
  At €99,900, it positions competitively against BMW iX M60 and significantly
  undercuts Porsche Cayenne Turbo. The combination of 450 kW power, 600 km range,
  350 kW DC charging, and Lotus handling dynamics creates compelling value.
  Limited dealer network is the main concern, but white-glove service compensates.
  0.25% company car tax makes it attractive for business users despite high list price.
  Most buyers opt for Luxury Pack (Meridian audio, massage seats) and rear-wheel
  steering, bringing typical transaction price to €115,000-€120,000. 16-week delivery
  time is acceptable for this segment. LIDAR sensors future-proof for autonomous
  driving. Lotus's first SUV backed by Geely investment provides confidence in
  quality and support despite brand's niche positioning in Germany.
