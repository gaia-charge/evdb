# Market positioning
market_positioning:
  segment: compact_suv
  target_audience: Families, company car drivers, practical EV buyers, SUV enthusiasts
  key_selling_points:
    - Excellent value (€44,990 for 500km range)
    - Spacious 5-seat interior with 552L trunk
    - Unique rotating 15.6" touchscreen
    - LFP Blade Battery (safer, 100% charge capability)
    - Strong warranty (6yr vehicle, 8yr battery)
    - V2L capability (3.3kW)
    - 1000kg towing capacity
    - Elevated SUV driving position
    - Comprehensive standard equipment
    - Heat pump for winter efficiency
  
  considerations:
    - BYD brand still building recognition in Europe
    - Smaller dealer network than VW/Hyundai
    - FWD only (no AWD option yet)
    - No frunk storage
    - 140kW DC charging (vs 175-240kW on some competitors)

# Notes
notes: >
  BYD Seal U Comfort brings competitive pricing (€44,990) to the family SUV 
  segment with solid 500km WLTP range. Directly competes with VW ID.4, Skoda 
  Enyaq iV, and Tesla Model Y on value proposition.
  
  Main advantages: LFP Blade Battery allows worry-free 100% charging, unique 
  rotating touchscreen, comprehensive standard equipment (panoramic roof, 
  heat pump, Level 2 autonomous driving), and strong warranty. Spacious 
  interior with 552L trunk and 1000kg towing capacity make it practical 
  family vehicle.
  
  Company car tax benefit (0.25% rate) saves drivers approximately €4,499 
  annually versus combustion SUV. Total cost of ownership significantly 
  lower than diesel alternatives (€7,633 savings over 3 years vs VW Tiguan).
  
  BYD's expanding dealer network (45 locations) and improving brand 
  recognition in Germany. Residual values strengthening as brand establishes 
  European presence. Good choice for practical families seeking affordable, 
  spacious electric SUV with proven technology.
  
  140kW DC fast charging adequate for most use cases, reaching 10-80% in 
  28 minutes. Real-world range of 420km mixed driving excellent for daily 
  family use. V2L capability enables camping and emergency power supply.

