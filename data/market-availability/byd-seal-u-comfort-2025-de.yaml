# Incentives and subsidies (2025/2026)
incentives:
  - name: Company Car Tax Benefit
    type: tax_exemption
    amount: 4499
    description: Company car tax benefit - 0.25% rate vs 1% for combustion vehicles
    notes: >
      Company car drivers benefit from 0.25% monthly tax rate (vs 1% for 
      combustion vehicles), saving approximately €4,499 annually versus 
      equivalent ICE SUV.
  
  - name: THG-Quote (Greenhouse Gas Reduction Quota)
    type: grant
    amount: 280
    description: Annual CO2 certificate trading income
    notes: >
      Tradeable emission certificates provide annual income of approximately 
      €250-300 in 2026 (varies by market price).
  
  - name: Road Tax Exemption
    type: tax_exemption
    amount: 340
    description: Electric vehicles exempt from German road tax until 2030
    valid_until: "2030-12-31"

# Company car taxation
company_car:
  taxable_benefit_calculation: gross_list_price_x_0.25_percent
  monthly_taxable_benefit_eur: 112.48  # €44,990 × 0.25%
  annual_taxable_benefit_eur: 1350  # €112.48 × 12
  comparable_ice_benefit_eur: 5849  # VW Tiguan 2.0 TDI €48,740 × 1% = €487.40/mo
  annual_tax_savings_eur: 4499  # Savings vs equivalent ICE SUV
  notes: >
    The BYD Seal U qualifies for the advantageous 0.25% company car tax rate 
    (vehicles under €70,000 with minimum 80km electric range). This results 
    in annual taxable benefit of only €1,350 compared to €5,849 for 
    equivalent combustion SUV (VW Tiguan 2.0 TDI), saving company car 
    drivers approximately €4,499 annually in reduced tax payments.

