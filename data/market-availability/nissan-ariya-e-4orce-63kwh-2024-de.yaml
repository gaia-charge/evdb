# Market-Specific Details
availability_status: available
available_from: "2023-03-01"
delivery_time_weeks: 16
notes: |-
  AWD variant of Nissan Ariya with 63 kWh battery and e-4ORCE dual-motor
  system. Offers better performance and all-weather traction compared to
  FWD variant.
  The Nissan Ariya e-4ORCE 63 kWh brings dual-motor AWD to the more
  affordable 63 kWh battery option. German pricing at €55,900 makes it
  competitive with other AWD electric crossovers. Popular with buyers
  seeking all-weather capability without the premium of the 87 kWh battery.
  The e-4ORCE system provides excellent traction and dynamic handling.
  Delivery times typically 12-16 weeks.

