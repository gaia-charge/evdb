# Delivery timeline
delivery:
  order_to_delivery_weeks: 16
  current_wait_time_description: >
    Lucid Air Pure typically available within 16-20 weeks from order (imported 
    from Arizona factory). Limited stock units may be available for faster delivery 
    at select Lucid Studios. Delivery times vary by configuration and option selection.

# Dealer network
dealer_network:
  dealer_count: 8  # Lucid Studios in Germany
  service_center_count: 6
  coverage_notes: >
    Lucid has 8 Lucid Studios (showrooms) in Germany: Berlin, Munich, Frankfurt, 
    Hamburg, Düsseldorf, Stuttgart, Cologne, and Hanover. 6 authorized service 
    centers provide maintenance and warranty support. Mobile service available 
    in major metropolitan areas. Network expanding, but significantly smaller 
    than established German luxury brands (Mercedes 1,000+ dealers, BMW 350+).

# Warranty
warranty:
  vehicle_years: 4
  vehicle_km: 80000
  battery_years: 8
  battery_km: 160000
  battery_capacity_guarantee_percent: 70
  roadside_assistance_years: 4
  notes: >
    Lucid offers 4-year/80,000km vehicle warranty and 8-year/160,000km battery 
    warranty (70% capacity retention). Competitive with Mercedes EQS (4yr/80,000km 
    vehicle, 8yr/160,000km battery) and BMW i7 (2yr/unlimited vehicle, 8yr/160,000km 
    battery). Mobile service available in major cities.

# Market positioning and competitors
competitors:
  - vehicle: Mercedes-Benz EQS 450+
    price: 116650
    range_wltp_km: 682
    power_kw: 245
    acceleration_0_100_s: 6.2
    charging_max_kw: 200
    comparison: >
      Mercedes EQS costs €26,750 more (€116,650 vs €89,900) with 22km more range 
      (682 vs 660km) but 75kW less power (245 vs 320kW), slower acceleration (6.2s 
      vs 4.5s), and significantly slower charging (200kW vs 300kW). Mercedes offers 
      established brand prestige, 1,000+ German dealers, and superior interior luxury. 
      Lucid provides better performance, efficiency (13.1 vs 19.8 kWh/100km), and value, 
      but EQS targets traditional luxury buyers prioritizing brand over specs.
  
  - vehicle: BMW i7 eDrive50
    price: 135000
    range_wltp_km: 625
    power_kw: 250
    acceleration_0_100_s: 5.5
    charging_max_kw: 195
    comparison: >
      BMW i7 costs €45,100 more (€135,000 vs €89,900) with 35km less range (625 vs 660km), 
      70kW less power (250 vs 320kW), slower acceleration (5.5s vs 4.5s), and 
      significantly slower charging (195kW vs 300kW). BMW offers flagship luxury, 
      iconic brand prestige, and 350+ German dealers. Lucid provides dramatically 
      better value, performance, and efficiency. i7 targets ultra-luxury buyers 
      prioritizing brand heritage over EV capabilities.
  
  - vehicle: Tesla Model S Long Range
    price: 99990
    range_wltp_km: 634
    power_kw: 350
    acceleration_0_100_s: 3.2
    charging_max_kw: 250
    comparison: >
      Tesla Model S costs €10,090 more (€99,990 vs €89,900) with 26km less range 
      (634 vs 660km), 30kW more power (350 vs 320kW), and significantly faster 
      acceleration (3.2s vs 4.5s for Plaid). However, Tesla charges slower (250kW 
      vs 300kW), has minimalist interior vs Lucid's luxury focus, and smaller 
      service network (25 German centers vs Lucid's 6 but expanding). Lucid offers 
      more traditional luxury interior; Tesla prioritizes performance and tech.
  
  - vehicle: Porsche Taycan 4S
    price: 120643
    range_wltp_km: 464
    power_kw: 360
    acceleration_0_100_s: 4.0
    charging_max_kw: 270
    comparison: >
      Porsche Taycan 4S costs €30,743 more (€120,643 vs €89,900) with 196km less 
      range (464 vs 660km), 40kW more power (360 vs 320kW), and 0.5s faster 
      acceleration (4.0s vs 4.5s). Taycan offers iconic Porsche brand, superior 
      handling dynamics, and extensive dealer network (86 German Porsche Centers). 
      Lucid provides dramatically better range and efficiency, but Taycan targets 
      performance-focused buyers prioritizing driving dynamics over maximum range.
  
  - vehicle: Audi e-tron GT quattro
    price: 107150
    range_wltp_km: 488
    power_kw: 350
    acceleration_0_100_s: 4.1
    charging_max_kw: 270
    comparison: >
      Audi e-tron GT costs €17,250 more (€107,150 vs €89,900) with 172km less range 
      (488 vs 660km), 30kW more power (350 vs 320kW), and 0.4s faster acceleration 
      (4.1s vs 4.5s). e-tron GT offers stunning design, established Audi prestige, 
      and 280 German dealers. Lucid provides 35% more range and better efficiency, 
      but e-tron GT targets buyers prioritizing emotional design and brand heritage.

# Target buyer profiles
target_buyers:
  - profile: Tech-savvy luxury EV enthusiasts
    description: >
      Early adopters prioritizing cutting-edge EV technology (900V architecture, 
      300kW charging, 660km range, 13.1 kWh/100km efficiency) over traditional 
      brand prestige. Value Lucid's American Silicon Valley innovation, Peter 
      Rawlinson's Tesla pedigree, and industry-leading EV engineering.
  
  - profile: Range-conscious luxury buyers
    description: >
      Affluent buyers requiring maximum electric range for frequent long-distance 
      travel. 660km WLTP (590km real-world) eliminates range anxiety versus 
      shorter-range luxury EVs (Taycan 464km, e-tron GT 488km). Ultra-fast 300kW 
      charging enables 22-minute 10-80% stops on road trips.
  
  - profile: Value-focused premium sedan buyers
    description: >
      Buyers seeking F-segment luxury sedan experience without six-figure pricing. 
      At €89,900, Lucid Air Pure undercuts Mercedes EQS (€116,650), BMW i7 (€135,000), 
      and Porsche Taycan 4S (€120,643) while delivering competitive or superior 
      specifications. Prioritize specs and value over traditional brand prestige.
  
  - profile: Environmental efficiency advocates
    description: >
      Eco-conscious affluent buyers prioritizing ultimate EV efficiency. Lucid's 
      13.1 kWh/100km WLTP (12.4 kWh/100km EPA / 5.0 mi/kWh) is industry-leading, 
      significantly better than EQS (19.8 kWh/100km), i7 (18.9 kWh/100km), or 
      Model S (16.2 kWh/100km). Minimized environmental impact per kilometer traveled.
  
  - profile: Private buyers (not company car)
    description: >
      Lucid Air Pure at €89,900 DOES NOT benefit from 0.25% company car tax rate 
      (over €70k threshold). Most suitable for private buyers who pay cash or finance 
      personally, avoiding 1% company car tax penalty. Company car drivers better 
      served by sub-€70k EVs (BMW iX1, Tesla Model Y, Mercedes EQE 300) with 
      0.25% rate.

# Strengths
strengths:
  - Exceptional 660km WLTP range (590km real-world) from just 84 kWh usable battery
  - Industry-leading efficiency 13.1 kWh/100km WLTP (12.4 kWh/100km EPA / 5.0 mi/kWh)
  - Ultra-fast 300kW DC charging (22 min 10-80%) fastest in luxury segment
  - 900V+ architecture enables rapid charging with minimal degradation
  - 0.197 Cd drag coefficient lowest of any production car (superior aerodynamics)
  - Impressive 320kW/430hp performance (4.5s 0-100 km/h) for entry-level trim
  - Limousine-like interior space (especially rear legroom) in mid-size footprint
  - Compelling value at €89,900 vs Mercedes EQS (€116,650), BMW i7 (€135,000)
  - 34" curved 5K Glass Cockpit display cutting-edge infotainment
  - Glass Canopy roof standard (electrochromic dimming) creates airy cabin
  - Large storage capacity 283L frunk + 456L rear trunk (739L total)
  - 8-year/160,000km battery warranty competitive with established brands
  - V2L and V2H hardware capability (software-enabled) for home backup
  - Exceptional build quality rivaling traditional German luxury marques
  - Peter Rawlinson pedigree (former Tesla Model S chief engineer) inspires confidence

# Weaknesses
weaknesses:
  - Does NOT qualify for 0.25% company car tax rate (over €70k threshold) - 1% rate applies
  - New luxury brand lacks Mercedes/BMW/Audi prestige in conservative German market
  - Limited German dealer network (8 Studios, 6 service centers vs 1,000+ Mercedes dealers)
  - Uncertain resale values as Lucid establishes European brand recognition (52% residual estimated)
  - 16-20 week delivery times (imported from Arizona) versus local European production competitors
  - Higher insurance costs typical for ultra-luxury vehicle segment
  - No air suspension on Pure trim (steel springs) - air suspension available on Touring/Grand Touring
  - Base audio system adequate but not exceptional (21-speaker Surreal Sound Pro costs extra €5,000)
  - Synthetic leather seats standard (premium Nappa leather costs extra €3,500 Santa Monica Interior)
  - Not rated for towing (0 kg capacity) unlike some competitors
  - Higher purchase price (€89,900) versus sub-€70k EVs with 0.25% company car tax benefits
  - Mobile service limited to major metropolitan areas (expanding coverage)

# Market reception
market_reception:
  initial_response: positive
  sales_trend: growing_slowly
  customer_satisfaction_rating: 4.6  # Out of 5.0 (US reviews, limited European data)
  common_praise:
    - Exceptional range and efficiency exceed even optimistic expectations
    - Ultra-fast 300kW charging transforms long-distance travel experience
    - Interior space astonishing for exterior dimensions (especially rear legroom)
    - Build quality rivals or exceeds traditional German luxury sedans
    - Cutting-edge technology and 34" display wow factor
  common_criticisms:
    - Brand prestige lower than Mercedes/BMW/Audi in traditional luxury market
    - Limited dealer and service network creates concerns for after-sales support
    - Premium options expensive (Dream Drive Pro €4,500, Surreal Sound Pro €5,000)
    - Infotainment UX learning curve steeper than intuitive German systems
    - Company car buyers disappointed by 1% tax rate (over €70k threshold)
  
  expert_reviews:
    - source: Auto Motor und Sport
      rating: 4.7
      summary: >
        "Lucid Air redefines electric luxury sedan segment with industry-leading 
        efficiency (13.1 kWh/100km), exceptional range (660km WLTP, 590km real-world), 
        and ultra-fast 300kW charging. Interior space rivals S-Class in smaller 
        package. Excellent value at €89,900 versus EQS (€116,650). Limited dealer 
        network and brand recognition main concerns."
    
    - source: ADAC (German Automobile Club)
      rating: 4.5
      summary: >
        "Lucid Air Pure impresses with best-in-class efficiency and range from 
        just 84 kWh battery. 300kW charging enables genuine long-distance capability. 
        Interior space exceptional. Build quality competitive with German luxury 
        brands. Recommended for tech-savvy buyers prioritizing EV capabilities 
        over traditional brand prestige. Private buyers only (1% company car tax)."
    
    - source: Autobild
      rating: 4.6
      summary: >
        "Lucid Air challenges Mercedes EQS and BMW i7 with superior range, efficiency, 
        and charging speed at significantly lower price. Peter Rawlinson's engineering 
        brilliance evident throughout. Interior space and luxury impressive. Limited 
        dealer network and uncertain resale values offset by exceptional EV capabilities. 
        Best for private buyers seeking ultimate electric luxury sedan."

# Best for
best_for:
  - Private buyers seeking ultimate EV efficiency and range (NOT company car drivers)
  - Tech enthusiasts prioritizing cutting-edge EV technology over brand prestige
  - Frequent long-distance travelers requiring 660km range and 300kW charging
  - Value-focused luxury buyers wanting F-segment experience under €100k
  - Environmental advocates prioritizing industry-leading efficiency (13.1 kWh/100km)
  - Buyers valuing interior space and rear passenger comfort
  - Early adopters willing to embrace new American luxury EV brand
  - Those seeking alternative to minimalist Tesla with traditional luxury interior

# Not ideal for
not_ideal_for:
  - Company car drivers (1% tax rate - NO 0.25% benefit over €70k threshold)
  - Brand-conscious buyers requiring Mercedes/BMW/Audi prestige
  - Buyers needing extensive dealer/service network (8 Studios, 6 service centers)
  - Those prioritizing immediate delivery (16-20 week wait from Arizona)
  - Conservative buyers preferring established German luxury brands
  - Buyers requiring air suspension (steel springs standard on Pure, air on Touring+)
  - Those needing towing capability (0 kg rated capacity)
  - Budget-conscious buyers seeking sub-€70k EVs with company car tax benefits

# Additional notes
notes: >
  The Lucid Air Pure RWD at €89,900 represents exceptional value in the ultra-luxury 
  electric sedan segment, undercutting Mercedes EQS (€116,650 / 26% less), BMW i7 
  (€135,000 / 33% less), and Porsche Taycan 4S (€120,643 / 26% less) while delivering 
  competitive or superior EV capabilities.
  
  Key differentiators include industry-leading efficiency (13.1 kWh/100km WLTP vs 
  19.8 for EQS, 18.9 for i7), exceptional 660km WLTP range from just 84 kWh battery 
  (competitors require 90-118 kWh for similar range), and ultra-fast 300kW DC charging 
  (22 min 10-80% vs 32-35 min for competitors).
  
  Lucid's 0.197 Cd drag coefficient (lowest of any production car) and miniaturized 
  drive units enable limousine-like interior space in mid-size sedan footprint. Rear 
  legroom rivals Mercedes S-Class long wheelbase despite 4,975mm length (vs 5,289mm S-Class).
  
  CRITICAL LIMITATION: Lucid Air Pure at €89,900 DOES NOT qualify for Germany's 
  advantageous 0.25% company car tax rate (vehicles under €70,000 threshold). Standard 
  1% rate applies, identical to premium combustion vehicles, eliminating primary tax 
  advantage of EVs for company car drivers. This significantly limits appeal versus 
  sub-€70k EVs (BMW iX1 €58,300, Tesla Model Y €55,990, Mercedes EQE 300 €69,990) 
  which enjoy 0.25% rate and €3,000-4,700 annual tax savings.
  
  Lucid Air Pure best suited for PRIVATE buyers (not company car) seeking ultimate 
  electric luxury sedan experience with industry-leading range, efficiency, and 
  charging speed at competitive pricing versus established German luxury brands. 
  Tech-savvy early adopters willing to embrace new American luxury marque benefit 
  most; traditional luxury buyers prioritizing brand prestige better served by 
  Mercedes EQS or BMW i7.
  
  Limited German dealer network (8 Studios, 6 service centers) and uncertain resale 
  values (52% estimated 3-year residual) offset by exceptional EV capabilities and 
  €26,750-45,100 lower purchase price versus direct competitors. For buyers prioritizing 
  EV technology over brand heritage, Lucid Air Pure represents compelling value proposition 
  in ultra-luxury electric sedan segment.

