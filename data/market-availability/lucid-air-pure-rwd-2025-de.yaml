# Incentives and subsidies
incentives:
  - name: No Federal EV Incentive
    type: subsidy
    amount: 0
    description: German federal EV incentive (Umweltbonus) ended December 2023
    notes: >
      Lucid Air Pure at €89,900 exceeds €70,000 threshold for advantageous 
      0.25% company car tax rate. Standard 1% rate applies, same as premium 
      combustion vehicles. Monthly taxable benefit €899 vs €225 if under €70k. 
      German federal EV incentive (Umweltbonus) ended December 2023.

# Company car taxation
company_car:
  taxable_benefit_calculation: gross_list_price_x_1_percent
  monthly_taxable_benefit_eur: 899  # €89,900 × 1%
  annual_taxable_benefit_eur: 10788  # €899 × 12
  comparable_ice_benefit_eur: 10788  # Same 1% rate as combustion
  annual_tax_savings_eur: 0  # No savings vs combustion in same price range
  notes: >
    The Lucid Air Pure at €89,900 DOES NOT qualify for the advantageous 0.25% 
    company car tax rate (vehicles under €70,000 threshold). Standard 1% rate 
    applies, identical to premium combustion vehicles. This significantly 
    impacts company car appeal versus sub-€70k EVs (BMW iX1, Tesla Model Y, 
    Mercedes EQE 300) which enjoy 0.25% rate.
    
    Private buyers benefit from zero fuel costs and lower maintenance, but 
    company car drivers see no tax advantage versus Mercedes S 500 (€112,000), 
    BMW 740i (€109,000), or Audi A8 60 TFSI (€108,000) at 1% rate.

# Total Cost of Ownership (3-year calculation)
tco_analysis:
  period_months: 36
  annual_mileage_km: 20000  # Higher mileage luxury sedan buyers
  total_mileage_km: 60000
  
  purchase_cost: 91850
  
  energy_costs:
    home_charging_kwh: 0.35  # €/kWh average Germany
    public_charging_kwh: 0.55  # €/kWh average
    home_charging_percent: 70  # Higher home charging for luxury buyers
    public_charging_percent: 30
    total_energy_cost_3yr: 4194  # 60,000km ÷ 7.04km/kWh × (0.7×€0.35 + 0.3×€0.55)
  
  maintenance_costs:
    annual_service_cost: 400  # Lucid service more expensive than mass-market EVs
    total_maintenance_3yr: 1200
    notes: Lucid service intervals 12 months/20,000km, higher than mass-market EVs
  
  insurance_annual: 1400  # Higher insurance for ultra-luxury vehicle
  insurance_3yr: 4200
  
  depreciation:
    residual_value_percent: 52  # 52% after 3 years (luxury EV depreciation high, new brand)
    residual_value_eur: 47762
    depreciation_3yr: 44088
  
  total_cost_3yr: 53682
  cost_per_km: 0.89
  
  comparable_ice_costs:
    vehicle: Mercedes-Benz S 500
    purchase_price: 112000
    fuel_cost_3yr: 12960  # 60,000km @ 9.0L/100km × €2.40/L (premium fuel)
    maintenance_3yr: 3600  # Higher maintenance for combustion
    insurance_3yr: 4800  # Similar luxury vehicle
    depreciation_3yr: 55440  # 50.5% residual (€56,560)
    total_cost_3yr: 76800
    cost_per_km: 1.28
  
  savings_vs_ice: 23118  # €76,800 - €53,682
  
  notes: >
    Lucid Air Pure offers substantial savings versus ultra-luxury combustion sedans 
    despite €89,900 purchase price. Over 3 years, total ownership costs are 
    approximately €23,118 lower than Mercedes S 500 (€112,000 purchase price). 
    Energy costs are 68% lower (€4,194 vs €12,960), and maintenance is 67% lower 
    (€1,200 vs €3,600).
    
    However, depreciation is significant concern for new luxury EV brand. Estimated 
    52% residual after 3 years (€47,762) versus 50.5% for Mercedes S-Class. Lucid's 
    brand recognition building in Europe, but resale values uncertain versus 
    established German luxury marques.
    
    Main advantage over sub-€70k EVs is superior range (660km vs 400-500km), 
    ultra-fast charging (300kW vs 150-250kW), and exceptional interior space/luxury. 
    Trade-off is loss of 0.25% company car tax benefit.

