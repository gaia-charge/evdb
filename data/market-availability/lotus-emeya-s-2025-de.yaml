notes: >
  The Emeya S delivers hyper-car performance (0-100 in 2.78s) at €128,950 -
  significantly undercutting Porsche Taycan Turbo S (€197,000). With 630 kW
  (857 hp), it's one of the fastest 4-door sedans in the world. Rear-wheel
  steering, Meridian Signature audio, carbon fiber trim, and Track Mode come
  standard. Despite immense power, maintains 595 km WLTP range. Exceptional
  value proposition for performance enthusiasts. Most buyers add Carbon Pack
  and carbon ceramic brakes for track capability.
