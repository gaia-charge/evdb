    - "https://ev-database.org/car/1699/Audi-SQ6-e-tron"
  notes: "2024 German market pricing for Audi SQ6 e-tron performance flagship. Base price at €93,900 (+€16,000 vs quattro) positions it as premium performance SUV. Exceptional acceleration (4.3s 0-100 km/h) with 380 kW (517 hp) while maintaining 598 km range. 800V ultra-fast charging (270 kW peak, 10-80% in 21 minutes) same as other Q6 variants. Competes with BMW iX M60 (€120,000) and Mercedes-AMG EQE 53 SUV (€109,000) but undercuts them significantly. Company car drivers save €8,448/year with 0.25% tax rate. Most popular configuration is 'SQ6 plus' (~€113k) with Premium Plus Package. Buyers choosing SQ6 want maximum performance without stepping up to more expensive luxury performance EVs. Standard adaptive air suspension sport, progressive steering, and launch control make it track-capable SUV. Optional ceramic brakes and predictive active suspension available for enthusiasts."
