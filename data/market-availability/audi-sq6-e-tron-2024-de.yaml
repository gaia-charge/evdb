value_proposition: |
  The Audi SQ6 e-tron represents excellent value in the performance electric SUV segment.
  At €93,900, it undercuts the BMW iX M60 by €26,100 while offering competitive performance
  (4.3s vs 3.8s 0-100 km/h) and better range (598km vs 566km WLTP).
  
  Compared to the Mercedes-AMG EQE 53 SUV (€107,000), the SQ6 saves €13,100 while
  delivering comparable acceleration and significantly better range (+138km).
  
  The SQ6 e-tron combines Audi's S-performance heritage with electric efficiency:
  - 360 kW (489 hp) dual-motor AWD with launch control
  - 4.3 seconds 0-100 km/h (supercar-quick)
  - 598 km WLTP range (impressive for performance SUV)
  - 800V architecture with 270 kW ultra-fast charging (10-80% in 21 minutes)
  - Standard Bang & Olufsen sound, AR head-up display, sport air suspension
  
  For company car drivers, the 0.5% tax rate (vehicles over €70k) still provides
  €5,628 annual savings vs ICE equivalent SQ7 TDI.
  
  Perfect for buyers seeking maximum performance without compromising practicality,
  range, or charging speed.

