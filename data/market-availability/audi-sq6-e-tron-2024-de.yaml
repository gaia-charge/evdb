  notes: "2024 German market pricing for Audi SQ6 e-tron performance flagship. Base price at €93,900 (+€16,000 vs quattro, +€22,700 vs RWD) positions it as premium performance SUV with outstanding value vs BMW iX M60 (€120,000) and Mercedes-AMG EQE 53 SUV (€107,000). Delivers 360 kW (489 hp), 4.3s 0-100 km/h while maintaining 598 km WLTP range. 800V PPE platform enables 270 kW ultra-fast charging. Standard equipment includes Bang & Olufsen sound, AR HUD, sport air suspension, S-design wheels, red brake calipers. Most popular configuration is Sport Plus (~€106k) with Carbon Package and performance options. Target buyers: performance enthusiasts seeking electric acceleration with premium features and practical range."
