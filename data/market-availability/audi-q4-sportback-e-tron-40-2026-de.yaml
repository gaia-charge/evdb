# Market Notes
notes: |
  Audi Q4 Sportback 40 e-tron 2026 combines sporty coupe-SUV styling with exceptional
  efficiency. The sloping roofline creates superior aerodynamics (Cd 0.26) providing
  up to 20km additional range over the standard Q4 (610km vs 590km WLTP).

  Available through Audi dealership network across Germany. Order online via audi.de
  or at any Audi center. Delivery time currently 11 weeks.

  2026 updates include:
  - Larger 85kWh battery (80kWh usable) vs 82kWh total in 2024
  - More powerful motor (210kW vs 150kW in 2024) with better acceleration
  - Improved DC charging to 150kW peak
  - Enhanced MMI with AI features
  - Heat pump now standard
  - New Aurora Violet color (looks stunning on Sportback design)

  Key competitors in Germany:
  - Tesla Model Y RWD (€44,990) - cheaper, less premium, less style
  - BMW iX1 (no coupe variant available)
  - Mercedes-Benz EQA (no coupe variant available)
  - Volkswagen ID.5 (€54,000) - sister model, less premium, similar coupe styling

  The Sportback offers unique combination of style and efficiency not matched by 
  competitors. The €1,500 premium over standard Q4 40 is excellent value for:
  - Superior aerodynamics (20km additional range)
  - Sportier coupe-SUV appearance
  - 15L additional trunk space (535L vs 520L)
  - Lower roofline for sportier stance

  Popular with design-conscious buyers and company car drivers who want style without
  sacrificing efficiency or practicality. The Sportback maintains all Q4 practicality
  (5 seats, good cargo space) while adding coupe aesthetics.

  Company car benefit: Base price of €56,400 keeps most configurations under €70,000
  threshold for 0.25% taxation. The €1,500 premium over standard Q4 costs only €45/year
  extra in company car tax - excellent value for the added style and range.

  Winter range typically 445-475km in real-world conditions (-20°C), still class-leading
  thanks to superior aerodynamics and improved heat pump efficiency.

