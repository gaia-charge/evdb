notes: >
  The Mercedes-Benz EQE SUV 500 4MATIC is the performance variant offering 
  impressive 4.9-second 0-100 km/h acceleration in a luxury SUV package. At 
  €91,000, it undercuts the BMW iX M60 (€120,300) by nearly €30,000 while 
  delivering similar performance.
  
  Key performance highlights:
  - 408 hp / 300 kW dual motors
  - 4.9s 0-100 km/h (sub-5 second SUV)
  - 858 Nm torque (instant electric acceleration)
  - Sport-tuned AIRMATIC air suspension
  - AMG Dynamic Plus Package available
  
  Performance vs efficiency trade-off:
  - Reduced range (479 km vs 590 km for 350+)
  - Higher consumption (23.4 kWh/100km WLTP, up to 26+ real-world)
  - Energy label C (vs B for 350 variants)
  - But: still far more efficient than comparable ICE performance SUVs
  
  Competitive positioning:
  - €30,000 cheaper than BMW iX M60 (similar performance)
  - €16,000 more than Audi Q8 e-tron SQ8 (more powerful, 4.5s 0-100)
  - Significantly faster than Tesla Model X Long Range (6.5s 0-100)
  
  Popular configuration: EQE SUV 500 4MATIC with Premium Package, MBUX Hyperscreen, 
  AMG Line, AMG Dynamic Plus, and 22" wheels comes to approximately €113,000. 
  Most popular for buyers wanting performance without stepping up to AMG EQE 53 
  (€134,000+).
  
  Target buyer: Performance enthusiasts who want impressive acceleration and 
  handling dynamics in a practical luxury SUV, accepting shorter range trade-off.

