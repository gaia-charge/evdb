# Notes
notes: |
  The Audi Q8 e-tron 50 quattro at €77,900 is the entry-level AWD variant in the Q8 e-tron range,
  positioned between the discontinued 55 quattro and the new Sportback variants.
  
  IMPORTANT COMPANY CAR TAX: At €77,900, this vehicle EXCEEDS the €70,000 threshold for
  the favorable 0.25% company car tax rate. Company car drivers will pay:
  - 1% monthly rate: €779/month taxable benefit
  - Annual tax burden: ~€9,348/year (vs. ~€2,337 if under €70k)
  - This is a significant disadvantage for company car buyers in Germany
  
  The Q8 55 quattro at €82,900 is only €5,000 more but offers significantly better value:
  - Larger 106 kWh battery (vs 89 kWh) = +17 kWh
  - 491 km WLTP range (vs 468 km) = +23 km
  - Same 340 kW/462 hp powertrain
  - Same charging speeds (170 kW DC)
  
  Key competitive positioning:
  - Positioned against BMW iX xDrive40 (€77,300) and Mercedes EQE SUV 350+ (€75,200)
  - Offers quattro AWD at competitive pricing
  - Strong Audi brand appeal in premium SUV segment
  - Good 491km WLTP range for daily driving
  
  Popular in Germany for:
  - Audi brand loyalty and prestige
  - Quattro all-wheel drive heritage
  - Conservative styling appeals to business buyers
  - Well-equipped as standard (Virtual Cockpit, LED lights, leather)
  
  Recommended upgrades:
  - S line exterior (€3,500) - enhances resale value
  - Technology Package Plus (€4,200) - AR head-up display is excellent
  - Adaptive air suspension (€2,400) - improves ride comfort significantly
  
  Note: The Q8 e-tron line will be discontinued in 2024/2025, being replaced by the new
  Q6 e-tron and Q8 e-tron successors. Current inventory may include production run-out
  incentives. Check with dealers for current availability and potential discounts.

