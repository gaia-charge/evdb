# Notes
notes: |
  The Volvo EX90 Twin Motor Performance at €86,500 is Volvo's flagship electric SUV,
  positioned in the premium 7-seat luxury segment.

  IMPORTANT: Price exceeds €70,000 company car tax threshold. Company car drivers pay
  1% monthly tax rate (€865/month) instead of the favorable 0.25% rate available for
  EVs under €70k. This results in €7,980/year additional tax cost. However, for
  executives and families needing 7 seats, the EX90 offers compelling value vs
  competitors like Mercedes EQS SUV (€115,900) and BMW iX (€99,900+).

  Key competitive advantages:
  - Best-in-segment LiDAR technology (Luminar) for future autonomous driving
  - Only premium 7-seat EV with full bi-directional charging (V2H, V2G)
  - Scandinavian design with sustainable materials (Nordico, FSC wood)
  - 600km WLTP range with 111 kWh battery
  - Air suspension standard (optional on many competitors)
  - Bowers & Wilkins 25-speaker audio system available
  - 250kW fast charging (10-80% in 30 minutes)

  Compared to competitors:
  - €29,400 less than Mercedes EQS SUV 450+ (€115,900)
  - €13,400 less than BMW iX xDrive50 (€99,900)
  - Similar price to Audi Q8 e-tron 55 (€90,000) but with 7 seats

  The EX90 is particularly appealing to:
  - Families needing 7 seats and premium features
  - Tech enthusiasts interested in LiDAR autonomous driving development
  - Sustainability-conscious buyers (Nordico textile, FSC wood, recycled materials)
  - Early adopters of bi-directional charging for home energy backup

  16-week delivery time reflects strong initial demand for Volvo's flagship EV.
  Ultra Pack (€5,500) is highly recommended for the incredible Bowers & Wilkins
  audio system and upgraded interior materials. 7-seat configuration (€1,200)
  is essential for families - the EX90's main value proposition vs 5-seat competitors.

  Volvo's 8-year/160,000km battery warranty provides peace of mind. Google built-in
  infotainment system (standard) offers excellent user experience with native Google
  Maps, Assistant, and Play Store apps. OTA updates will enable future features
  including enhanced autonomous driving capabilities.

