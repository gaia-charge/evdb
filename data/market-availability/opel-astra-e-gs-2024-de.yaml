sales_notes: |
  Astra won 2023 European Car of the Year, first Opel to win since 2016.
  GS trim is premium flagship with IntelliLux Pixel Matrix LED as signature feature.
  Strong company car appeal due to 0.25% taxation and comprehensive premium equipment.
  Built at Rüsselsheim adds "Made in Germany" prestige for domestic market.
  IntelliLux technology is Opel's competitive advantage vs Peugeot/Citroën siblings.

notes: |
  The Opel Astra Electric GS at €47,990 is the premium flagship of the 2023 European 
  Car of the Year lineup:

  **Key Premium Features (vs Edition +€3,000):**
  - IntelliLux LED Pixel Matrix headlights STANDARD (€1,200 option on Edition)
  - 10" head-up display STANDARD
  - 360-degree camera system STANDARD
  - Sport body kit and two-tone black roof STANDARD
  - 18" bi-color alloy wheels (vs 17")
  - AGR-certified sport seats with enhanced bolsters
  - Premium 8-speaker audio (vs 6 speakers)
  - Heated seats and steering wheel STANDARD
  - Wireless phone charging STANDARD

  **Total equipment value vs Edition: ~€3,500 for +€3,000**

  **IntelliLux LED Pixel Matrix (Opel Exclusive):**
  - 84 individual LED elements
  - Glare-free high beam (masks oncoming traffic)
  - Dynamic cornering and bend lighting
  - Best lighting technology in C-segment
  - Not available on any competitor at this price

  **vs Peugeot e-308 GT (€51,990):**
  - €4,000 cheaper, mechanically identical
  - Same EMP2 platform, battery, motor, performance
  - IntelliLux Pixel Matrix standard (not available on e-308)
  - More conservative, professional design
  - Built in Germany vs France
  - Stronger brand recognition in German market

  **vs BMW i4 eDrive35 (€52,000):**
  - €4,000 cheaper
  - 85% of i4's features and performance
  - Better value proposition for company car drivers
  - Heat pump standard (€1,200 option on i4)
  - Same 0.25% company car tax rate

  **Best for:**
  - Company car drivers prioritizing premium tech at competitive price
  - Drivers who want IntelliLux Pixel Matrix LED technology
  - Buyers seeking German build quality and prestige
  - Families needing towing capability (1000kg)
  - Those who prefer conventional controls over touchscreen-heavy interfaces

  **Considerations:**
  - 54kWh battery smaller than some competitors (VW ID.3 Pro: 77kWh)
  - 100kW DC charging adequate but slower than premium rivals
  - 18" wheels reduce range by ~2km vs Edition (416km vs 418km)
  - No Sports Tourer (wagon) variant yet
  - Still under €70k company car threshold (0.25% tax)

  **Delivery:** 12-16 weeks from Rüsselsheim plant

  **Verdict:** Best value premium C-segment EV for German market. IntelliLux Pixel Matrix 
  technology alone justifies the €3,000 premium over Edition, and remaining equipment 
  adds €500 additional value. Company car drivers save €4,319/year vs ICE equivalent.

