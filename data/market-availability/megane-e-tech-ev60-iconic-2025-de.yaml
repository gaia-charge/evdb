  notes: "Top-spec Megane E-Tech Iconic with 60 kWh battery and 218 hp. At €48,990 base price, the Iconic trim includes everything: Matrix LED headlights, Harman Kardon audio, hands-free parking, head-up display, and premium Alcantara/recycled fabric interior. Longest WLTP range in the lineup at 470 km with real-world range of 400 km. Company car drivers save €4,410/year with 0.25% tax rate. Perfect for buyers wanting the complete Megane E-Tech experience with all premium features and maximum range. 20-inch wheels come standard. Ideal for those who want award-winning design, cutting-edge tech, and premium materials in a compact crossover package."
