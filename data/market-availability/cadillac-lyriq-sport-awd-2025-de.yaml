  calculation: |
    0.5% monthly rate for EVs priced over €70,000:
    
    Monthly taxable benefit: €83,000 × 0.5% = €415/month
    Annual taxable benefit: €4,980/year
    Income tax (42% bracket): ~€2,092/year
    Social contributions (~20%): ~€996/year
    Total annual cost to employee: ~€3,088/year
    
    Excellent company car value. Much lower taxation than comparable
    combustion luxury SUVs (1% rate on similar price = €9,960/year taxable).
  notes: |
    Qualifies for advantageous 0.5% company car tax rate.
    Strong value proposition for Dienstwagen (company car) market.

