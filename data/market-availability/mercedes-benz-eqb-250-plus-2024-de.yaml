notes: |
  Mercedes-Benz EQB 250+ at €56,990 is the most affordable EQB variant and offers
  the best range (474km WLTP) thanks to FWD efficiency. It's the only premium
  compact SUV offering optional 7-seat configuration.
  
  KEY ADVANTAGE: Qualifies for 0.25% company car tax (under €70,000 threshold)
  - Monthly taxable benefit: €142.48 (vs €569.90 if 1% rate)
  - Annual tax savings: ~€4,275/year for typical company car driver
  
  Popular configuration:
  - AMG Line (€4,760) - sporty look, 20-inch wheels
  - Third row seats (€1,785) - essential for 7-seater families
  - Premium Package (€2,975) - larger screens, navigation, Burmester audio
  - Driver Assistance Package Plus (€2,380) - advanced ADAS
  - Total: €68,890 (still under €70k threshold!)
  
  Competitive positioning:
  - BMW iX1 xDrive30: Similar price (€55,000) but only 5 seats, AWD standard
  - Audi Q4 e-tron 45 quattro: €53,900, larger, AWD, better value but less premium
  - Tesla Model Y RWD: €44,890, more range, better tech, but less premium interior
  
  Strengths:
  - Only premium 7-seat compact EV available
  - Mercedes brand prestige and build quality
  - Best EQB range: 474km WLTP
  - Standard heat pump
  - MBUX infotainment
  - Company car tax advantage
  
  Weaknesses:
  - Modest 100kW DC charging (slower than competitors)
  - Third row very cramped (kids only)
  - Small trunk with 7 seats (190L)
  - FWD only (no quattro)
  - Higher base price than competitors
  
  Typical delivery: 10 weeks (good availability, production in Hungary)

