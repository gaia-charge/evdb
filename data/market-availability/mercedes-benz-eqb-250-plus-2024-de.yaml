  notes: >
    Mercedes-Benz EQB 250+ at €56,990 is the entry FWD variant with the largest battery.
    This positions it as a premium family SUV with optional 7-seat configuration.
    Significantly more affordable than the 4MATIC variants while offering best range (474km WLTP).
    Direct competitors: BMW iX1 xDrive30 (€55,000), Audi Q4 e-tron 45 quattro (€53,900).
    The EQB 250+ qualifies for favorable company car tax (0.25% rate) as price is under €70,000.

