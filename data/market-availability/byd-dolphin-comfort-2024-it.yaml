market_notes: >
  The BYD Dolphin Comfort is the mid-range trim of the Dolphin lineup in Italy.
  Features 150 kW (204 hp) motor, 60.4 kWh Blade Battery, 427 km WLTP range (559 km city).
  0-100 km/h in 7.0 seconds, 160 km/h top speed, 110 kW DC fast charging (30-80% in 26 min),
  11 kW 3-phase AC charging (0-100% in 6.2 hours). Standard equipment includes 12.8" rotating
  touchscreen, 5" LCD instrument cluster, Apple CarPlay/Android Auto, panoramic glass roof,
  heated front seats, 8-speaker audio system, 360° camera, comprehensive ADAS suite,
  and 364-1,310L cargo capacity. Sits between Active trim (€29,990, 44.9 kWh, 340 km) and
  Design trim (€35,990, bicolor paint, wireless charging, V2L). With 2024 government incentives
  and trade-in, effective price can drop to €24,790-22,540 depending on ISEE level and Euro standard
  of trade-in vehicle.

