notes: The 2025 Volvo EX30 saw a significant price reduction in Germany, dropping from €43,900 to €36,590 for the Extended Range Single Motor. This positions it much more competitively against the VW ID.3, Cupra Born, and MG4. European production in Ghent, Belgium also means shorter delivery times and avoidance of EU tariffs on Chinese-built EVs. The EX30 remains one of the most popular compact EVs in Europe thanks to its efficiency, Scandinavian design, and comprehensive safety features.
