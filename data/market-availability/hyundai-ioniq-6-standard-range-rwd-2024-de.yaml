# Market Comparison
market_comparison:
  competitors:
  - model: "Tesla Model 3 RWD"
    price: 40990
    price_difference: -2910    # Ioniq 6 is €2,910 MORE expensive
    comparison: >
      Tesla is €2,910 cheaper but Ioniq 6 has better build quality, more premium
      interior, V2L capability, 18-min charging (vs 27 min), better aerodynamics
      (Cd 0.21 vs 0.219), and more standard features. Ioniq 6: 446km vs Tesla: 420km.

  - model: "Polestar 2 Standard Range"
    price: 45900
    price_difference: -2000    # Ioniq 6 is €2,000 cheaper
    comparison: >
      Similar price but Ioniq 6 is €2,000 cheaper with slightly better range
      (446 vs 442km), much faster charging (18 vs 35 min 10-80%), better
      aerodynamics (Cd 0.21 vs 0.28), and V2L capability. Polestar has more
      sporty handling, Ioniq 6 prioritizes efficiency.

  - model: "BMW i4 eDrive35"
    price: 52900
    price_difference: -9000    # Ioniq 6 is €9,000 cheaper!
    comparison: >
      Ioniq 6 is €9,000 cheaper with similar range (446 vs 483km), faster
      charging (18 vs 31 min), better efficiency (13.9 vs 16.3 kWh/100km),
      and more tech features. BMW offers premium badge and rear-wheel drive
      dynamics. Ioniq 6 is better value.

  - model: "Hyundai Ioniq 6 Long Range RWD"
    price: 55500
    price_difference: -11600    # Standard Range is €11,600 cheaper
    comparison: >
      Long Range adds 168km WLTP (614 vs 446km), 17kW more power (168 vs 151kW),
      1.1s faster 0-100 (7.4 vs 8.5s), but costs €11,600 more. Standard Range
      offers 73% of Long Range capacity (53 vs 74kWh) for 79% of the price -
      excellent value for daily driving (<300km/day). Same 18-min charging!

  market_position: >
    The Ioniq 6 Standard Range sits in the competitive €40-50k mid-size EV sedan
    segment. It's priced between Tesla Model 3 RWD (€40,990) and Polestar 2
    Standard (€45,900), but offers unique advantages: world-class aerodynamics
    (Cd 0.21), 800V fast charging (18 min), V2L capability, and World Car of the
    Year 2023 winner status. The €43,900 price point maximizes German company car
    tax benefits (0.25% rate under €70k) while delivering premium features and
    exceptional efficiency. Perfect for value-conscious buyers who prioritize
    efficiency over maximum range.

