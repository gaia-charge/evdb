# Pricing
pricing:
  base_price: 43900  # Entry-level Ioniq 6, ~€12k cheaper than Long Range RWD
  destination_fee: 1200
  registration_fee: 50  # Lower than most (Hyundai dealer service)
  on_the_road_price: 45150  # All-inclusive
  effective_price_after_incentives: 45150  # No federal incentive in 2024 (ended 2023)
  price_notes: >
    At €43,900, the Ioniq 6 Standard Range is the most affordable way to own
    the World Car of the Year 2023. It's €11,600 cheaper than the Long Range RWD
    (€55,500) while maintaining the same world-class aerodynamics (Cd 0.21) and
    800V fast charging (18 minutes 10-80%). The 446km WLTP range is excellent for
    a 53kWh battery, showcasing Hyundai's efficiency engineering.

