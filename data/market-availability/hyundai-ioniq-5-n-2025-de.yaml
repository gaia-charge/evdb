# Notes
notes: |
  The Ioniq 5 N launched in Germany in mid-2024 and has been extremely well-received
  by the automotive press and enthusiast community. Starting at €74,900, it competes
  with the Tesla Model 3 Performance, BMW i4 M50, and Porsche Taycan base model.

  Unique selling points include the N e-shift simulated gear changes (a controversial
  but beloved feature), N Active Sound+ for an engaging driving experience, and
  N Drift Optimizer for controlled oversteer. The 478 kW boost power (650 PS) and
  3.4-second 0-100 km/h time make it one of the fastest production Hyundais ever.

  Note: At €74,900, it exceeds the €70,000 threshold for the 0.25% company car
  tax benefit, so the 0.5% rate applies. This makes it slightly less attractive
  for company car drivers compared to the standard Ioniq 5 Long Range AWD.

  Delivery times have stabilized at around 16 weeks. Strong demand continues,
  particularly in Performance Blue color.

