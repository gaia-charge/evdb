  Excellent value for sporty styling with minimal practicality compromise.
  
  Company car buyers benefit from 0.25% tax rate (BEVs under €70,000) vs 1% for combustion vehicles - 
  annual tax savings of approximately €2,000 for 40% tax bracket employees.
  
  2024 facelift includes improved ME3 software with ChatGPT-powered Laura assistant, 135kW DC fast 
  charging (upgrade from 125kW), and enhanced efficiency.

