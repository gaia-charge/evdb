company_car_tax:
  list_price: 95900
  tax_base: 95900
  tax_rate_percent: 0.5
  monthly_tax_1_percent: 479
  monthly_tax_0_5_percent: 240
  annual_tax_savings_vs_ice: 2874
  notes: |
    Price exceeds €70,000 threshold → 0.5% company car tax rate (not 0.25%).
    Despite 0.5% rate, still saves €2,874 annually vs equivalent ICE (1% rate).
    Example: Employee with 30km commute pays €348/month tax (0.5% + 0.03% × 30 × €95,900).
    ICE equivalent (e.g., Audi SQ7 TDI): €587/month tax (1% + 0.03% × 30 × €99,000).
    Tax savings: €239/month = €2,868/year.
  calculation_example: |
    Base: €95,900 × 0.5% = €480/month
    Commute: 30km × 0.03% × €95,900 = €863/month
    Total: €1,343/month gross benefit = ~€480 net tax (at 35% rate)

