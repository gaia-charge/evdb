metadata:
  created_at: "2024-02-09"
  data_quality: verified
  notes: |
    Performance flagship SUV with 370kW (503hp) and 4.5s 0-100 km/h.
    Traditional SUV body offers 569L trunk (41L more than Sportback) for maximum practicality.
    Still achieves respectable 480km WLTP range despite S-performance focus.
    €24,100 cheaper than BMW iX M60 (€120,000), €11,100 cheaper than Mercedes-AMG EQE 53 SUV.
    Best value proposition in performance luxury electric SUV segment.
    Popular with existing Audi S-loyalists transitioning to electric who need cargo space.
    Ideal for: Performance enthusiasts who want practicality, efficiency, and electric speed.
    Trade-off: 14km less range than Sportback (480km vs 494km) but superior cargo space.
    569L trunk expands to 1,725L with seats folded (70L more than Sportback's 1,655L).
  updated_at: "2024-02-09"
  sources:
  - https://www.audi.de/de/brand/de/neuwagen/q8-e-tron.html
