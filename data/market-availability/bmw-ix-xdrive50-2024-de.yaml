# Notes
notes: |
  The BMW iX xDrive50 at €99,900 is positioned in the premium luxury electric SUV segment.
  
  IMPORTANT: Price exceeds €70,000 company car tax threshold. Company car drivers pay
  1% monthly tax rate (€999/month) instead of the favorable 0.25% rate available for
  EVs under €70k. This results in €8,988/year additional tax cost.
  
  Key competitive advantages:
  - Class-leading 630km WLTP range
  - Most advanced interior technology (iDrive 8, curved display)
  - Optional Bowers & Wilkins Diamond audio (best-in-class)
  - Class-leading 2,500kg towing capacity
  - Strong German brand prestige
  
  Popular in Germany due to BMW brand loyalty and excellent range. The 14-week delivery
  time is reasonable for the premium segment.

