competitors:
- model: Hyundai Ioniq 5 Long Range AWD
  base_price_usd: 48500
  comparison: 'Sister vehicle on same E-GMP platform. $200 cheaper ($48,500 vs $48,700). Ioniq 5 has more interior space (3-meter wheelbase vs 2.9m EV6), flat floor. EV6 has sportier styling, lower drag coefficient (Cd 0.28 vs 0.29). Identical powertrain, battery, charging (both 800V, 18-minute 10-80%). Choose Ioniq 5 for space/utility, EV6 for style/sportiness.

    '
- model: Tesla Model Y Long Range AWD
  base_price_usd: 47990
  comparison: '$710 cheaper ($47,990 vs $48,700). Tesla: 330 miles range (+48 miles vs EV6''s 282), 250 kW charging (+10 kW). EV6: Faster 0-60 (5.2s vs 4.8s for Model Y), better build quality, V2L capability. EV6: 800V charging advantage (18 min vs 27 min Tesla), Electrify America free. Choose Tesla for range/Supercharger network, EV6 for awards/styling/faster charging.

    '
- model: Ford Mustang Mach-E Extended Range AWD
  base_price_usd: 56295
  comparison: '$7,595 more expensive ($56,295 vs $48,700). Mach-E: 270 miles range (-12 miles vs EV6''s 282), slower charging (150 kW vs 240 kW). EV6: Much faster 0-60 (5.2s vs 5.8s), better value, 800V advantage. Mach-E: V2H capability (9.6 kW home backup), traditional dealer network. Choose Mach-E for V2H/American brand, EV6 for value/performance/charging speed.

    '
- model: Volkswagen ID.4 Pro AWD
  base_price_usd: 48995
  comparison: '$295 more expensive ($48,995 vs $48,700). ID.4: 275 miles range (-7 miles vs EV6), slower charging (170 kW vs 240 kW). EV6: Faster 0-60 (5.2s vs 6.9s), better styling, 800V ultra-fast charging. ID.4: More traditional SUV design, larger cargo (543L vs 520L). Choose ID.4 for practicality/VW brand, EV6 for performance/awards/charging speed.

    '
- model: BMW iX xDrive40
  base_price_usd: 87250
  comparison: '$38,550 more expensive ($87,250 vs $48,700) - luxury segment. BMW: Larger vehicle, more range (324 miles vs 282), luxury features. EV6: Superior value, faster charging (240 kW vs 195 kW), similar acceleration. Choose BMW for luxury/prestige, EV6 for value/performance/practicality.

    '
