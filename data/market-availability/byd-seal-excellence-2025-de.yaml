# Notes
notes: |
  BYD Seal Excellence AWD 2025 delivers supercar-level performance (3.8s 0-100 km/h,
  530 hp) at a competitive price point, now with improved efficiency and charging.

  2025 Model Year Improvements:
  - Better battery thermal management for improved cold-weather performance
  - Enhanced charging curve (25 min 30-80% vs 26 min in 2024)
  - Improved efficiency: 17.1 kWh/100km (vs 17.3 in 2024)
  - Updated infotainment system with improved UI
  - Price reduction: €51,990 (vs €52,990 in 2024)

  Dual-motor all-wheel-drive with 390 kW (530 hp) and 670 Nm torque.
  82.5 kWh Blade Battery (LFP chemistry) provides exceptional safety and longevity.
  530 km WLTP range with impressive efficiency despite AWD performance.
  Premium standard equipment: Nappa leather, Dynaudio sound, head-up display, DiPilot.
  8-year/200,000 km battery warranty with 3000+ charge cycle durability.

  Excellent all-weather capability with AWD traction control.
  Qualifies for 0.25% company car tax benefit (under €70k threshold).
  Lower total cost of ownership than comparable German premium EVs.
  Faster delivery times in 2025 (4 weeks vs 6 weeks in 2024).

  Popular Configuration: Seal Excellence with metallic paint + brown leather = €53,780

  Company Car Calculation (Germany):
  - Gross list price: €51,990
  - Monthly tax base: €51,990 × 0.25% = €129.98 (vs. €519.90 for ICE)
  - Annual tax savings vs. ICE: ~€4,679

