  notes: "2024 German market pricing for Audi Q6 e-tron quattro AWD. Base price at €77,900 (+€6,700 vs RWD) positions it as premium mid-size SUV. Excellent performance (5.9s 0-100 km/h) while maintaining 625 km range. 800V ultra-fast charging (270 kW peak, 10-80% in 21 minutes) same as RWD. Competes with BMW iX xDrive40 (€77,300) and Mercedes EQE SUV 350 4MATIC (€81,000). Company car drivers save €7,008/year with 0.25% tax rate. Most popular configuration is 'advanced' trim (~€92k) with Premium Plus Package. Buyers choosing quattro want AWD traction (winter/off-road) and better acceleration without sacrificing much range (-16km vs RWD)."
