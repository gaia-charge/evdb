  gross_list_price: 46900
  tax_rate_percent: 0.25
  monthly_taxable_benefit: 117.25
  notes: |
    For company car drivers with €50,000 gross salary:
    - Monthly benefit: €117.25
    - Tax (30% rate): €35.18/month (€422/year)
    - Social security (20%): €23.45/month (€281/year)
    - Total annual cost to employee: ~€703

    Compared to 1% rule for combustion engines (€469/month = €5,628/year), this represents 
    massive savings for BEV company car drivers.

# Market Notes
notes: |
  Polestar 2 Single Motor 2025 is the refreshed entry-level variant with updated design.
  Direct-to-consumer sales model via polestar.com with home delivery or Polestar Space pickup.

  Polestar Spaces in major German cities: Berlin, Munich, Hamburg, Cologne, Frankfurt, Stuttgart.
  Service network through Volvo dealerships across Germany.

  2025 facelift brings updated exterior with new front/rear design, revised interior with 
  physical climate controls (customer feedback), and improved Google Automotive Services.

  Key competitors:
  - Tesla Model 3 RWD (€42,990) - cheaper, but less premium interior
  - BMW i4 eDrive35 (€54,900) - more expensive, traditional brand
  - Genesis Electrified G80 (€84,000) - much more expensive

  Strong value proposition at €46,900 with premium Scandinavian design and Google integration.

  Popular with company car drivers due to 0.25% taxation benefit. Typical monthly benefit 
  of €117 results in only ~€700/year tax cost vs €5,600/year for equivalent combustion car.

