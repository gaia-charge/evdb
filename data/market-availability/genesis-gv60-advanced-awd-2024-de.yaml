notes: |
  Genesis GV60 Advanced AWD is the smart entry point to Genesis electric luxury.
  At €57,990, it's €8,000 less than Sport Plus while maintaining 95% of the experience.
  Standard Face Connect, Crystal Sphere shift dial, and Highway Driving Assist 2
  showcase Genesis innovation. 800V architecture with 18-minute charging matches
  Sport Plus. 490 km WLTP range adequate for most users. Company car drivers save
  €5,219/year in taxes versus ICE equivalent. Well-positioned against BMW iX1
  (€3,510 more, slower charging) and Audi Q4 50 quattro (same price, slower charging).
  Only sacrifices Bang & Olufsen audio and massage seats versus Sport Plus - reasonable
  trade-off for €8,000 savings. Strong value proposition for luxury EV buyers.

