notes: 'Cupra Born 58kWh (€40,990) is the entry-level Born offering excellent value. Shares MEB platform and 58kWh battery with VW ID.3 Pure Performance but €1,075 cheaper while offering sportier design and Cupra brand image. 424 km WLTP range is sufficient for most users. 150kW motor provides solid performance (7.3s 0-100). 120kW DC charging is adequate. Key advantage over VW: younger brand image, sportier design, copper accents. Positioned well against premium competition like Volvo EX30 while undercutting VW. Target buyers: those wanting Cupra style without paying for the larger battery. Good company car choice with 0.25% tax rate.'
