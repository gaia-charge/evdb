notes: |
  **Extreme vs Essential - Worth €2,500 More?**
  
  YES, if you:
  - Drive in mixed traffic (65hp makes merging safer)
  - Want cruise control (highway comfort)
  - Need rear camera (tight parking)
  - Prefer automatic climate control
  - Use Spring as primary vehicle
  
  NO, if you:
  - Only drive in city (45hp adequate for low speeds)
  - Tight budget (€14,400 vs €16,900)
  - Use as second car
  - Rarely use highway
  
  **Real-World Feedback (Germany):**
  Most reviewers recommend Extreme because:
  1. 45hp feels dangerously slow on Autobahn on-ramps
  2. 65hp still modest but more confidence-inspiring
  3. Cruise control essential for longer drives
  4. Rear camera helpful in tight German parking spaces
  5. €2,500 premium reasonable for daily-use improvements
  
  **Market Position:**
  At €16,900 (after subsidy), the Spring Extreme competes with:
  - Used Renault Zoe ZE50: €15,000-18,000, better range/features
  - Used VW e-Up!: €12,000-15,000, similar size but shorter range
  - Used Nissan Leaf (40kWh): €18,000-22,000, larger with more range
  
  For new car buyers prioritizing warranty and latest safety features, Spring Extreme 
  offers unbeatable value. For used market buyers, consider Zoe ZE50 for better range 
  and features at similar price.

