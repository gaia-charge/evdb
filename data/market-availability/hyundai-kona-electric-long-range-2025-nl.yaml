notes: 2025 Hyundai Kona Electric Long Range available in the Netherlands at €39,995. The 64.8 kWh (65.4 kWh usable) battery provides up to 510 km WLTP range. Standard features include 12.3" dual panoramic displays, wireless Apple CarPlay/Android Auto, heat pump, V2L capability, and BOSE premium audio system. Built in Czech Republic (Nošovice). Well-positioned in the Dutch market at about €5,000 less than the German price. Competes with VW ID.3 Pro S, Kia EV3 Long Range, and MG4 Long Range.
