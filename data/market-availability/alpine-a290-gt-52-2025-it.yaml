notes: The Alpine A290 GT features a 180 CV (160 kW) electric motor with 170 Nm torque, 52 kWh battery providing up to 380 km range (WLTP), 0-100 km/h in 7.4s, 160 km/h top speed. Built on CMF-B EV platform with Torque Vectoring technology, aggressive design with X-shaped lights, sport seats, digital cockpit with R-Link infotainment, Apple CarPlay and Android Auto. 326L trunk capacity (300L with subwoofer), 1,100L with rear seats folded.
