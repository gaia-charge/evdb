notes: >
  OMODA E5 at €34,990 is one of the most affordable compact electric SUVs in
  Germany with 430 km WLTP range. Undercuts VW ID.4 by over €12,000 and Hyundai
  Kona Electric by €7,000 while offering similar equipment levels.

  Excellent company car proposition with monthly taxable benefit of only €87.48.
  7-year/150,000 km vehicle warranty is among the best in the segment.

  Main consideration is brand recognition — OMODA/Chery is new to Germany and
  dealer network is still developing. However, competitive pricing and generous
  warranty help offset brand uncertainty.

