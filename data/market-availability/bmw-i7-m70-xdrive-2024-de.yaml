# Market-Specific Details
availability_status: available
available_from: "2023-09-01"
delivery_time_weeks: 18
notes: |-
  BMW's performance electric flagship sedan with M-tuned dual motors delivering
  660 hp and supercar acceleration. Built on CLAR WE platform at BMW's
  Dingolfing factory in Germany. Target audience: performance-oriented luxury
  executives seeking ultimate electric flagship with M Performance DNA.
  The BMW i7 M70 xDrive is BMW's most powerful electric flagship, offering
  supercar performance (0-100 km/h in 3.7 seconds, 660 hp) in a luxury sedan
  package. Competes directly with Mercedes-AMG EQS 53 4MATIC+ (€148,000,
  658 hp) and Porsche Taycan Turbo (€161,000, 680 hp). The M70 offers
  compelling value at €170,000 with more interior space than Taycan and
  sportier dynamics than EQS. Standard equipment includes M Sport Package Pro,
  Bowers & Wilkins Diamond audio, Executive Drive Pro air suspension, and
  all flagship technology features. Popular with performance-oriented business
  users who value both luxury and dynamics. Subject to 0.5% company car tax
  rate (vehicles over €70,000). Typical delivery 14-18 weeks depending on
  configuration. Production at BMW Dingolfing plant in Bavaria.

# Pricing
pricing:
  base_price: 170000
  price_including_vat: 170000
  vat_rate_percent: 19
  notes: |
    German list price €170,000 for i7 M70 xDrive with dual motors (660 hp),
    AWD, and 101.7 kWh battery. Positioned against Mercedes-AMG EQS 53 4MATIC+
    and Porsche Taycan Turbo. €35,000 premium over eDrive50 for M Performance
    hardware, dual motors, and additional standard equipment.

