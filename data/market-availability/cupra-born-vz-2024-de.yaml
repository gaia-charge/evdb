notes: 'Cupra Born VZ (€51,990) is the performance flagship with 240kW motor and 5.7s 0-100 km/h. "VZ" (Veloz = Fast in Spanish) positions as hot hatch alternative to Golf GTI but fully electric. Undercuts VW ID.3 GTX by €1,475 despite more power (240kW vs 210kW). Key advantages: aggressive styling, copper VZ badges, 20mm lower sport suspension, progressive steering, 200 km/h top speed (vs 160). Performance focus sacrifices some range (511 km vs 548 km standard 77kWh) but still excellent for class. Competes with BMW i4 eDrive40 (€6,910 cheaper), Tesla Model 3 (less premium but cheaper), and Hyundai Ioniq 5 N (much more expensive). Target: enthusiasts wanting genuine performance EV under €60k. Still qualifies for 0.25% company car tax rate (under €70k threshold). Fast delivery (10 weeks). Performance brakes, sport seats, and VZ-exclusive design elements included as standard. Tech Package Plus standard on VZ saves €1,990 vs adding separately. Best value performance EV in MEB platform lineup.'
