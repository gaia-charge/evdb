# Market-Specific Details
availability_status: available
available_from: "2024-10-01"
delivery_time_weeks: 8
notes: |-
  Performance AWD variant of ID.5 with 340 hp dual-motor setup. Built at
  VW's Zwickau factory in Germany. Targets buyers seeking sportier performance
  and all-weather capability in a coupe SUV.
  The ID.5 GTX offers compelling value in the German market with strong
  performance (340 hp, 6.3s 0-100 km/h), good range (480 km WLTP), and
  competitive pricing at €63,000 base. Company car taxation at 0.25%
  makes it attractive for business users. Short delivery times (8 weeks)
  and good dealer network support. Competes well against Audi Q4 Sportback
  e-tron 50 quattro (€62,500), BMW iX1 xDrive30 (€58,500), and Tesla
  Model Y Long Range AWD (€55,990). The GTX branding and coupe styling
  appeal to performance-oriented buyers seeking a practical family EV.

  Most popular configurations include IQ.DRIVE Max and Comfort packages
  (total around €70,000). GTX Performance Package popular with enthusiasts
  seeking maximum handling capability.

# Pricing
pricing:
