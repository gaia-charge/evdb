  notes: "2024 German market pricing for BMW i4 M50. Base price at €74,900 positions it as a performance alternative to Tesla Model 3 Performance (€56,990) and Mercedes-AMG EQE 43 4MATIC (€82,000). Dual-motor AWD with 544hp delivers 0-100 km/h in 3.9s while maintaining 510 km WLTP range (430 km real-world). Features IconicSounds Electric by Hans Zimmer, M Sport suspension, and comprehensive standard equipment. Company car drivers save €4,488/year with 0.5% tax rate (above €70k threshold). Most popular configuration is with Premium Package (~€87k). Competes directly with Audi e-tron GT (€105k+) and Porsche Taycan 4S (€120k+) but at lower price point."
