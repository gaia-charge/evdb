  created_at: "2026-02-08"
  notes: |
    MG4 XPower is the performance bargain of the German EV market.
    435hp / 600Nm dual-motor AWD for under €43k is unprecedented.
    0-100 km/h in 3.8s matches €70k+ BMW M cars and Tesla Model 3 Performance.
    Enhanced cooling allows sustained track use without derating.
    Sport-tuned suspension lowered 10mm, stiffer than standard MG4.
    Orange brake calipers, sport seats with Alcantara, and orange stitching.
    Track Mode optimizes power delivery and regen for circuit driving.
    Real competitor to Cupra Born VZ (€51k), Polestar 2 (€55k).
    With Umweltbonus (€3,000), effective price is €39,490 (ends Dec 2024).
    Nürburgring lap time of 8:23 impressive for FWD-based platform.
    Insurance costs higher (Typklasse 26) but still reasonable vs competitors.
    Growing enthusiast community in Germany organizing track days.
  updated_at: "2026-02-08"
notes: "['Fastest affordable performance EV in Germany under €50k', '435hp / 600Nm rivals €70k+ performance cars', '0-100 km/h in 3.8s - supercar territory', '7-year/175,000km battery warranty', 'Enhanced cooling for track use', 'Orange brake calipers and sport interior standard', 'Available at 120+ MG dealers across Germany', 'Direct import from China - no local assembly']"
