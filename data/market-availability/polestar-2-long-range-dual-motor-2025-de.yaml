# Market Notes
notes: |
  Polestar 2 Long Range Dual Motor 2025 is the performance variant with AWD.
  Popular with enthusiast drivers who want both range and performance.

  The Performance Pack is a popular option adding Öhlins adjustable dampers, 
  Brembo front brakes (4-piston), 20-inch forged wheels, and gold seatbelts/valve caps.

  Key competitors:
  - Tesla Model 3 Long Range AWD (€49,990) - cheaper, similar performance
  - BMW i4 M50 (€69,900) - more expensive, more powerful
  - Hyundai Ioniq 6 LR AWD (€53,900) - similar price, more range

