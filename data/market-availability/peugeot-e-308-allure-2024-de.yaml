notes: |
  The Peugeot e-308 Allure represents solid value in the C-segment electric market.
  At €45,085, it's positioned between VW ID.3 Pro (€43,000) and Cupra Born 58kWh (€41,000),
  offering more sophisticated interior design and better ride quality.
  
  Key selling points for German market:
  - Qualifies for 0.25% company car taxation (under €70k threshold)
  - Excellent ride comfort and refinement
  - Premium i-Cockpit HD interior design
  - Comprehensive standard equipment on Allure trim
  - French quality and attention to interior detail
  
  With federal incentives expired, private buyers face €9,000 premium vs ICE equivalent.
  Company car drivers still benefit from massive tax savings (€2,964/year).
  
  Typical delivery time is 12 weeks, with production at Mulhouse, France.
