sales_notes: |
  Astra won 2023 European Car of the Year, first Opel to win since 2016 Astra-K.
  Electric variant launched mid-2023, accounts for growing share of Astra sales.
  Strong company car appeal due to 0.25% taxation and comprehensive equipment.
  Built at Rüsselsheim adds "Made in Germany" appeal for domestic market.

notes: |
  The Opel Astra Electric Edition at €44,990 represents exceptional value in the 
  C-segment EV market:

  **Key Advantages:**
  - 2023 European Car of the Year in electric form
  - Heat pump STANDARD (reduces winter range loss by ~15%)
  - Dual 10" Pure Panel displays standard
  - Adaptive cruise control standard
  - 1000kg towing capacity (rare in segment)
  - Made in Germany at historic Rüsselsheim plant
  - 850+ dealer network (largest in Germany)
  - Company car tax benefit: 0.25% = €112/month (saves €4,049/year vs ICE)

  **vs Volkswagen ID.3 Pro (€42,990):**
  - +€2,000 but includes heat pump (€1,200 option on ID.3)
  - Better interior quality and ergonomics
  - More conventional controls (physical buttons)
  - 1000kg towing vs 0kg (ID.3 can't tow)
  - Longer warranty (8yr/160k vs 8yr/160k battery, same)

  **vs Peugeot e-308 (€47,490):**
  - €2,500 cheaper, mechanically identical
  - Same EMP2 platform, battery, motor, performance
  - Opel has stronger brand recognition in Germany
  - More conservative, practical design
  - Built in Germany vs France

  **Best for:**
  - Company car drivers (0.25% tax, comprehensive equipment)
  - Families needing towing capability
  - Value-conscious buyers prioritizing German quality
  - Drivers who prefer conventional controls over touchscreen-heavy interfaces

  **Considerations:**
  - 54kWh battery smaller than some competitors (VW ID.3: 77kWh)
  - 100kW DC charging adequate but slower than premium rivals
  - 352L trunk smaller than ICE Astra (370L) but competitive for EV
  - No Sports Tourer (wagon) variant yet

  **Delivery:** 12-16 weeks from Rüsselsheim plant

