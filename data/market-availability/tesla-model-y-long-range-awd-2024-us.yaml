notes: |
  Best-selling EV in America for 2023 with 375,000+ units sold.
  Model Y outsold all other EVs combined in many US states.
  Built at Fremont, California (original) and Gigafactory Texas (newer).
  Texas-built vehicles use 4680 battery cells (structural pack).
  California-built vehicles use 2170 battery cells (traditional pack).
  Both achieve similar range/performance, but 4680 pack is lighter.

  Popular in California (30% of US sales) due to generous state incentives.
  Tesla Supercharger network is largest advantage over competitors.
  Average Supercharger session: 15-25 minutes for 200+ miles of range.
  Mobile app allows remote climate control, lock/unlock, summon.

  Insurance costs higher than average ($2,400/year vs $1,600 for ICE SUV).
  Maintenance minimal: brake pads last 100,000+ miles (regen braking).
  Tire replacement more frequent due to instant torque and vehicle weight.

  Federal tax credit available at point of sale (instant discount at delivery).
  Best value: Base Long Range AWD ($47,990 - $7,500 = $40,490 effective).
  California buyers: $47,990 - $7,500 federal - $2,000 CVRP = $38,490!
  Oregon buyers: $47,990 - $7,500 federal - $7,500 OR = $32,990!

  Recommended for buyers who prioritize:
  - Range efficiency and low operating costs
  - Fast charging infrastructure access
  - Latest technology and OTA updates
  - Minimal maintenance
  - Strong safety ratings (IIHS Top Safety Pick+, NHTSA 5-star)

