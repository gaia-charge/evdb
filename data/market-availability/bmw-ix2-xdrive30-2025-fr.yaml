# Market Notes
notes: |
  BMW iX2 xDrive30 2025 available in France as the AWD variant of the electric SUV coupé.

  Base price of €59,150 excludes options. The xDrive30 features dual electric motors
  producing 230 kW (313 CV) with 0-100 km/h in 5.6 seconds.

  Battery capacity: 64.8 kWh usable (66.4 kWh gross)
  WLTP range: 417-449 km depending on configuration
  DC fast charging: up to 130 kW (10-80% in ~25 minutes)

  Price excludes the French ecological bonus (bonus écologique) as the base price exceeds
  the €47,000 threshold for 2024-2025.

  M Sport finishes available with additional cost (19" or 20" wheels, sport suspension,
  Alcantara upholstery).

