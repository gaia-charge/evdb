market_notes: |
  The Audi RS e-tron GT is positioned as Germany's answer to the Porsche Taycan Turbo S,
  offering comparable performance at €15-20k lower price while maintaining Audi's luxury
  and refinement standards.
  
  Key selling points for German market:
  1. Built in Germany (Stuttgart-Zuffenhausen)
  2. 800V architecture = fastest charging (270kW, 22.5 min 5-80%)
  3. 475kW (646hp) with launch control - supercar performance
  4. More practical than Taycan (better rear seats, more cargo)
  5. Better value than Taycan Turbo S (€15-20k less expensive)
  
  Target customer: Successful professionals and executives wanting:
  - Supercar performance (0-100 in 3.3s)
  - Daily usability and comfort
  - Prestige of Audi brand
  - German engineering and build quality
  
  Competitors in German market:
  - Porsche Taycan Turbo S: €186,336 (€35k more, slightly faster but less practical)
  - BMW i7 xDrive60: €139,900 (€10k less, more luxurious but slower)
  - Mercedes EQS 53 4MATIC+: €157,829 (€8k more, similar performance, different character)
  - Tesla Model S Plaid: €117,990 (€32k less, faster but less refined)
  
  Best value proposition:
  - 90% of Taycan Turbo S performance at 80% of the price
  - More practical for daily use than Taycan
  - Audi brand prestige and dealer network
  - Company car tax benefit: 0.25% rate saves €10,800/year
  
  Popular configurations typically include:
  - Technology Package Plus (€8,900) - HUD, night vision, 360° cameras
  - Dynamic Package (€7,900) - rear steering, ceramic brakes, sport suspension
  - Sound Package (€6,900) - Bang & Olufsen 3D
  - Ceramic brakes option (€10,900) - essential for track use
  
  Total typical configuration: €180,000-200,000

