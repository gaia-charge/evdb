notes: >
  The Lotus Emeya represents Lotus's entry into the electric grand tourer segment.
  At €96,950, it undercuts Porsche Taycan 4S significantly while offering comparable
  performance (0-100 in 4.15s vs 4.0s) and superior range (610 km vs 430 km).
  The remarkable 0.21 drag coefficient makes it one of the most aerodynamic production
  cars ever made. The 4-seat configuration with individual sport seats creates an
  intimate, driver-focused cockpit. 800V architecture enables 350 kW DC charging
  (10-80% in 18 minutes). Limited dealer network is compensated by premium service.
  0.25% company car tax makes it attractive for business users. Most buyers opt for
  Luxury Pack (premium materials, massage seats) and rear-wheel steering, bringing
  typical transaction price to €120,000-€125,000. 12-week delivery time is excellent
  for this segment. The Emeya combines Lotus racing heritage with grand touring
  refinement - a genuine hyper-GT at a relatively accessible price point.
