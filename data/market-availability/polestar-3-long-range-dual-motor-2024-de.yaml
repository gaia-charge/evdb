# Market Notes
notes: |
  Polestar 3 is Polestar's first SUV, competing with BMW iX (from €82,500), Audi Q8 e-tron 
  (from €77,900), and Mercedes EQS SUV (from €115,900). Positioned as premium alternative 
  with Scandinavian design and advanced technology.
  
  Direct-to-consumer model through polestar.com. Polestar Spaces in major German cities 
  for test drives. Service through Volvo network.
  
  Standard features include air suspension, LiDAR sensors (with Pilot Pack), Google 
  Automotive Services, heat pump, and advanced safety systems.
  
  Company car tax benefit (0.25% rule) makes it attractive for business users. Base price 
  €83,900 results in €210/month taxable benefit vs €839/month for fossil fuel equivalent.
  
  Strong competition from established German luxury brands, but Polestar offers distinctive 
  design, sustainability focus, and competitive pricing.

