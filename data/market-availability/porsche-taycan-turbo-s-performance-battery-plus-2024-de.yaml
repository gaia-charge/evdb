# Incentives and taxation
incentives:
  - name: "Kfz-Steuer (Vehicle Tax) Exemption"
    type: tax_exemption
    amount: 560
    description: "Electric vehicles exempt from vehicle tax until 2030"
    eligibility: "All electric vehicles"
    valid_until: "2030-12-31"
    notes: "After 2030: 50% of standard tax rate applies. Based on vehicle weight: 2,295 kg. Estimated annual savings vs equivalent ICE"
  
  - name: "Company Car Tax Rate"
    type: tax_exemption
    amount: 0
    description: "Reduced BIK rate for luxury electric vehicles €60k+"
    eligibility: "List price €60,000+, purchased after 2019"
    valid_until: "2030-12-31"
    notes: "0.25% rate applies. Gross list price: €207,574. Monthly benefit: 0.25% × €207,574 = €518.94. ICE equivalent: 1.0% × €207,574 = €2,075.74. Savings: €1,556.80/month or €18,681.60/year. For 40% tax bracket employee: saves €7,472/year in taxes"
  
  - name: "THG-Quote (Greenhouse Gas Reduction Quota)"
    type: grant
    amount: 300
    description: "Annual payment for CO2 certificate trading"
    eligibility: "All electric vehicle owners"
    valid_until: "2030-12-31"
    notes: "Paid annually by THG quota traders. Amount varies by market demand (€250-400 in 2024). Simple online registration process. Average payout: €300-350/year"

  - name: "Umweltbonus (Federal EV Subsidy)"
    type: subsidy
    amount: 0
    description: "Not eligible - exceeds €65,000 price cap"
    eligibility: "Vehicles with net list price up to €65,000"
    notes: "Taycan Turbo S exceeds €65,000 limit. Net price: €174,432 (before 19% VAT). No federal or manufacturer subsidy available"

