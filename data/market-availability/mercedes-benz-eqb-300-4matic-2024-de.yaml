notes: |
  Mercedes-Benz EQB 300 4MATIC at €60,590 adds quattro-style AWD to the EQB lineup.
  The 4MATIC system uses a rear motor for AWD capability, improving winter traction
  and handling dynamics at the cost of slightly reduced efficiency (423km vs 474km WLTP).
  
  KEY ADVANTAGE: Still qualifies for 0.25% company car tax (under €70,000 threshold)
  - Monthly taxable benefit: €151.48 (vs €605.90 if 1% rate)
  - Annual tax savings: ~€4,545/year for typical company car driver
  
  4MATIC vs FWD 250+ comparison:
  - Price: €60,590 vs €56,990 (+€3,600, +6.3%)
  - Power: 168kW/228hp vs 140kW/190hp (+28kW, +20%)
  - Acceleration: 8.0s vs 9.0s 0-100 km/h (-1.0s, 11% faster)
  - Range: 423km vs 474km WLTP (-51km, -10.8%)
  - Drive: AWD vs FWD (better winter traction)
  
  Is 4MATIC worth €3,600?
  - YES if: You live in snowy/mountainous regions, value AWD security, want better acceleration
  - NO if: You maximize range, mainly city driving, don't need AWD
  
  Popular configuration:
  - AMG Line (€4,760) - sporty look, 20-inch wheels
  - Third row seats (€1,785) - for 7-seater families
  - Premium Package (€2,975) - essential tech upgrades
  - Total: €70,110 (EXCEEDS €70k threshold by €110!)
  
  WARNING: Adding popular packages pushes price over €70,000, losing company car tax benefit!
  - Consider: Skip AMG Line OR choose 250+ FWD instead
  
  Competitive positioning:
  - BMW iX1 xDrive30: €55,000, AWD standard, similar range (440km), better value
  - Audi Q4 e-tron 45 quattro: €53,900, larger, AWD, better value, more space
  - Mercedes EQB 250+: €56,990, FWD, longer range (474km), save €3,600
  
  Strengths:
  - 4MATIC AWD for winter/traction
  - 228hp adequate performance
  - 7-seat option (unique in segment)
  - Mercedes brand and build quality
  - Company car tax advantage (if under €70k configured)
  
  Weaknesses:
  - Modest 100kW DC charging
  - Range penalty vs FWD (-51km)
  - Easy to configure over €70k threshold
  - €3,600 premium for AWD vs FWD
  
  Recommendation:
  - Choose 300 4MATIC if: Winter driving, need AWD, mountainous regions
  - Choose 250+ FWD if: Maximizing range, city driving, saving money
  
  Typical delivery: 10 weeks (good availability)

