notes: The Citroën ë-C3 is France's domestically-produced entry-level electric vehicle, manufactured in Slovakia. Features Citroën's signature Advanced Comfort suspension and seats, raised driving position, and urban SUV-inspired design. With 44 kWh battery providing 320 km WLTP range, it targets urban and periurban mobility. Standard equipment includes LED lighting and 10-inch touchscreen.
