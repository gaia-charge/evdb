  notes: "Rebranded from XC40 Recharge in 2024, now part of Volvo's EX (electric crossover) lineup. Single motor RWD variant offers best efficiency and range (475 km WLTP). Google built-in (Maps, Assistant, Play Store) standard - excellent infotainment integration. Real-world range: 410 km mixed (86% of WLTP) - practical for daily use and road trips. 150 kW DC charging: 10-80% in 32 min. Swedish safety heritage: City Safety collision avoidance, Pilot Assist adaptive cruise standard. Compact SUV practicality: 414L cargo (behind rear seats), 1,328L with seats folded. Towing: 1,500kg braked - excellent for small trailers. Company car value: under €70k = 0.25% tax rate saves €4,770/year. Built in Belgium (Ghent factory) - high quality, sustainable production. Competes with Tesla Model Y RWD (€49k), BMW iX1 xDrive30 (€54k), Audi Q4 40 e-tron (€53k). Typical price: €55-58k with popular options. Premium compact SUV with Scandinavian design, Google integration, and strong safety credentials."
  updated_at: "2026-02-08"
