notes: |
  BYD Seal Design offers Tesla Model 3 level performance at a competitive price.
  82.5 kWh Blade Battery (LFP chemistry) provides exceptional safety and longevity.
  Impressive 570 km WLTP range with 0.219 drag coefficient (best-in-class aerodynamics).
  Rear-wheel-drive layout for sporty handling characteristics.
  Comprehensive standard equipment including heat pump, panoramic roof, and V2L capability.
  8-year/200,000 km battery warranty with 3000+ charge cycle durability.
  Relatively short delivery times compared to German premium competitors.
  Qualifies for 0.25% company car tax benefit (under €70k threshold).

