notes: |-
  VW's electric hot hatch - the GTX brings performance credentials to the
  ID.3 lineup with 286 hp, 200 km/h top speed, and 601 km range.
  The ID.3 GTX is positioned as VW's electric hot hatch for the German
  market, priced attractively at €46,335. It undercuts competitors like
  the Cupra Born VZ and offers more range than most rivals. Company car
  tax at 0.25% makes it compelling for business users at only €115.84/month
  taxable benefit. The performance credentials (5.9s 0-100, 200 km/h)
  combined with 601 km range make it a practical daily driver with sporty
  character. Popular configurations with Tech and Comfort packages bring
  the price to around €49,500.

