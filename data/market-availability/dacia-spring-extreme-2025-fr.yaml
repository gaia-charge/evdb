notes: The Dacia Spring Extreme is the top specification of Europe's most affordable electric city car. Features include 15-inch alloy wheels, V2L bidirectional charging, YouClip accessory system, and six color options. With 225 km WLTP combined range and up to 315 km urban range, it's optimized for city use. The Extreme trim adds copper-colored wheel design elements.
