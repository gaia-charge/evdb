sales_notes: |
  Opel Corsa (all versions) consistently in top 10 best-selling cars in Germany.
  Corsa-e accounts for ~30% of total Corsa sales (2024 estimate).
  Edition trim is popular entry point for EV buyers and company car drivers.

notes: |
  The Opel Corsa-e Edition at €33,990 offers excellent entry-level value:
  
  **Key Advantages:**
  - Lowest-priced Corsa-e trim (€3,000 less than GS Line)
  - Same battery, motor, range as all Corsa-e variants
  - 16" wheels improve efficiency slightly (357km WLTP)
  - Company car tax benefit: 0.25% = €85/month (saves €3,059/year vs ICE)
  - Strong Opel dealer network (850+ locations)
  - Fast 8-week delivery from Zaragoza, Spain
  - Mechanically identical to Peugeot e-208 Allure (€3,000 cheaper)
  
  **vs Corsa-e GS Line:**
  - €3,000 cheaper (€33,990 vs €36,990)
  - Halogen headlights vs LED (upgrade available)
  - Manual climate vs automatic (upgrade available)
  - 7.0" touchscreen vs 10.0" (upgrade available)
  - 16" steel wheels vs 17" alloys (upgrade available)
  - Same battery, motor, charging, performance
  
  **Best for:**
  - Entry-level EV buyers on a budget
  - Company car drivers minimizing benefit-in-kind tax
  - City driving and short commutes
  - German brand loyalty at affordable price
  - Base trim with option to upgrade features à la carte
  
  **Considerations:**
  - Smallest trunk in segment (309L)
  - No towing capability
  - Base trim has fewer standard features (upgradable)
  - 4-star Euro NCAP (vs 5-star for newer competitors)
  
  **Upgrade Path:**
  For €34,980 base + typical upgrades:
  - LED headlights: +€690
  - Automatic climate: +€390
  - 16" alloys: +€590
  - Total: ~€36,650 (still cheaper than GS Line with more flexibility)

