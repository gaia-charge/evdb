notes: |
  VW's flagship electric sedan with 86 kWh battery enters 2026 model year
  with software updates and V2L capability. Built at VW's Emden factory in
  Germany. Reduced delivery time due to improved production efficiency.
  Targets business users and long-distance drivers requiring maximum range.

# Pricing
pricing:
  base_price: 63690
  price_including_vat: 63690
  vat_rate_percent: 19
  notes: |
    Base price for ID.7 Pro S 2026 with 86 kWh battery and 210 kW motor.
    €5,000 premium over Pro variant for larger battery and longer range.
    Price increase of €1,585 (+2.6%) from 2024 Pro S reflects mid-cycle
    updates including V2L, 200kW charging, and ID. Software 5.0.
    Positioned as VW's longest-range EV, competing with BMW i5 eDrive40
    (€73k) and Mercedes EQE 350+ (€77k). Still under €70k company car
    tax threshold, making it attractive for business users.

