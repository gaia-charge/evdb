# Market-Specific Notes
market_notes: |
  The ID.7 Pro S 2026 is VW's longest-range electric vehicle, achieving
  709 km WLTP range (605 km real-world) with the 86 kWh battery. This
  makes it ideal for traveling sales representatives, executives, and
  anyone who regularly drives 400-500 km per day. Mid-cycle update adds
  V2L capability, ID. Software 5.0 with ChatGPT integration, 200kW peak
  charging (up from 175kW), and improved charging curve management.
  
  At €63,690, it's still under the €70k company car tax threshold
  (0.25% vs 0.5%), making it excellent value for business users compared
  to BMW i5 eDrive40 (€73k, 582 km) or Mercedes EQE 350+ (€77k, 590 km).
  
  Popular options: IQ.DRIVE Max (€2,760), AR HUD (€1,530), 22kW charging
  (€710), ergoActive seats (€1,940). Typical configured price: €72-75k,
  but base model under €70k keeps company car tax low.
  
  Strong VW dealer network (690+ locations) and brand reputation make it
  a safe choice for fleet buyers. 12-week delivery time improved from
  16 weeks in 2024. Best-in-class aerodynamics (Cd 0.23) and efficient
  powertrain deliver real-world range that matches or exceeds rivals
  despite smaller battery than some competitors.

