notes: |
  ⭐ BEST VALUE MODEL Y - Base RWD is the volume seller (50%+ of Model Y sales in Germany)!

  Why RWD is so popular:
  1. **Price**: €44,990 vs €52,990 Long Range AWD (€8,000 savings, -15%)
  2. **Company car tax**: 0.25% rate (under €70k threshold) saves €1,620/year vs ICE ⭐
  3. **Range adequate**: 455 km WLTP (400 km real-world) sufficient for 95% of daily needs
  4. **Fast delivery**: 2-3 weeks (vs 3-4 weeks Long Range due to higher production volume)
  5. **Lower insurance**: Group 24 vs 25 Long Range (~€100-150/year savings)
  6. **LFP battery advantages**: 
     - 100% charging recommended (no degradation concern at full charge)
     - Longer lifespan (more charge cycles)
     - Safer chemistry (less thermal runaway risk)
     - Lower cost (CATL mass production)

  Trade-offs vs Long Range AWD:
  - Less range: -110 km WLTP (-19%), but still 400 km real-world
  - Slower acceleration: 6.9s vs 5.0s 0-100 km/h (+38%), but still quick for SUV
  - Lower DC charging peak: 170 kW vs 250 kW (-32%), but still fast (27 min 10-80%)
  - No AWD: RWD only (adequate for most European conditions, not for mountains)

  Perfect for:
  - **Company car drivers**: Under €70k = 0.25% tax rate = massive savings ⭐
  - **Daily commuters**: 400 km real-world range sufficient for daily use
  - **City drivers**: LFP excels in city (545 km city range!)
  - **Budget-conscious buyers**: €8,000 savings vs Long Range AWD
  - **Second car families**: Daily driver with occasional road trips

  Not ideal for:
  - **Long-distance tourers**: 345 km highway range requires more charging stops
  - **Mountain regions**: RWD less capable than AWD in snow/ice
  - **Cold climates**: LFP loses ~25% range in winter (-5°C), NCA only ~15%
  - **Towing heavy loads**: RWD less stable than AWD when towing 1,600 kg

  Built at Gigafactory Berlin-Brandenburg, Germany (Grünheide).
  Made in Germany - fastest delivery times in Europe (2-3 weeks).
  Direct-to-consumer sales model via tesla.com (no dealerships).
  25 Tesla Service Centers across Germany.
  160 Supercharger locations in Germany (1,600+ charging stalls).
  8-year/160,000 km battery and drive unit warranty (LFP).
  4-year/80,000 km basic vehicle warranty.
  Over-the-air software updates add new features regularly.

  Operating costs (annual estimate for 15,000 km/year):
  - Electricity (€0.30/kWh home): €788
  - Public charging (20% at €0.45/kWh): +€118
  - Insurance (Group 24): €1,800
  - Service/maintenance: €200
  - Tires (every 3 years): €300
  - **Total: €3,206/year** or **€0.21/km** ⭐

  vs ICE equivalent (BMW X3 sDrive20i):
  - Fuel (€1.70/L, 7.5 L/100km): €1,913
  - Insurance: €2,000
  - Service/maintenance: €800
  - Tax (Kfz-Steuer): €180
  - Tires: €300
  - **Total: €5,193/year** or **€0.35/km**
  - **Savings with Model Y RWD: €1,987/year** (€166/month) ⭐

