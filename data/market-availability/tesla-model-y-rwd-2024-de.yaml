notes_company_car: |
  ⭐ EXCELLENT COMPANY CAR VALUE - Under €70k threshold qualifies for 0.25% rate!

  Annual tax savings vs ICE equivalent:
  - ICE (1.0% rate): €2,160/year tax (40% bracket)
  - EV RWD (0.25% rate): €540/year tax (40% bracket)
  - **Savings: €1,620/year** (€135/month) ⭐

  Plus additional benefits:
  - Kfz-Steuer exemption: €420/year (€35/month)
  - THG-Quote income: €350/year (€29/month)
  - **Total annual benefits: €2,390** (€199/month) ⭐

  Net effective cost for employee (40% tax bracket):
  - Monthly benefit tax: €45
  - Minus THG-Quote: -€29
  - Minus road tax savings: -€35
  - **Net monthly cost: -€19** (NEGATIVE! Saves money!) ⭐

  This makes Model Y RWD essentially FREE for German company car drivers!

  vs Long Range AWD at €52,990 (still under €70k):
  - RWD saves €8,000 upfront
  - RWD saves €20/month in benefit-in-kind taxes
  - RWD adequate for 95% of company driving needs
  - Both qualify for 0.25% rate (massive advantage)

