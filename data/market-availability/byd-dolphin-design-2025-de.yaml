# Notes
market_notes: >
  The 2025 BYD Dolphin Design is the premium variant with all features included
  as standard and significant 2025 improvements.
  
  2025 Model Year Improvements:
  - Faster DC charging: 95 kW (vs 88 kW in 2024)
  - Better efficiency: 13.9 kWh/100km (vs 14.1 in 2024)
  - Improved range: 435 km WLTP (vs 427 km in 2024)
  - Enhanced heat pump performance
  - Updated DiLink 4.0 with wireless Apple CarPlay/Android Auto
  - Improved charging curve (26 min 30-80% vs 28 min in 2024)
  - Price reduction: €37,990 (vs €38,990 in 2024)
  - Faster delivery: 3 weeks (vs 4 weeks in 2024)
  
  With the 60.4 kWh battery (435 km WLTP / 375 km real-world), powerful
  150 kW motor, and premium equipment, the Design competes with vehicles
  like the MINI Electric and VW ID.3 Pro S while offering better value.
  
  The 0.25% company car tax rate makes it particularly attractive for business
  users seeking a premium compact EV. Standard equipment includes everything
  plus ventilated seats, heated steering wheel, panoramic glass roof, 360-degree
  camera, power tailgate, enhanced audio system, and remote parking assist.
  
  Popular Configuration: Dolphin Design with two-tone paint = €39,190
  
  Company Car Calculation (Germany):
  - Gross list price: €37,990
  - Monthly tax base: €37,990 × 0.25% = €94.98 (vs. €379.90 for ICE)
  - Annual tax savings vs. ICE: ~€3,419

