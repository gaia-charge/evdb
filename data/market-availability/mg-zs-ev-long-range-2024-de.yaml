# Metadata
metadata:
  data_quality: verified
  sources:
  - https://www.mgmotor.de/mg-zs-ev
  - https://www.adac.de/rund-ums-fahrzeug/tests/elektromobilitaet/mg-zs-ev-test/
  - https://www.auto-motor-und-sport.de/fahrbericht/mg-zs-ev-test/
  - https://www.dat.de/ (pricing and typklasse data)
  created_at: "2026-02-07"
  notes: |
    MG ZS EV is excellent value in the compact electric SUV segment.
    72.6 kWh battery provides class-leading range (440km WLTP) at this price point.
    €3,000 cheaper than Opel Mokka-e, €8,000 cheaper than Hyundai Kona Electric.
    Popular with families - practical SUV body, good ground clearance, large boot.
    Company car drivers benefit from 0.25% tax rate (saves ~€60/month vs ICE).
    7-year warranty matches Kia/Hyundai, better than most European brands.
    Heat pump standard improves winter range by ~15%.
    DC fast charging limited to 92kW - slower than Korean/German competitors.
    Growing dealer network (120+ dealers) provides good service coverage.
    Second generation (2023+) has significantly improved tech and range vs gen 1.
    Umweltbonus (€3,000) ends Dec 2024 - act before subsidy expires.
  updated_at: "2026-02-07"
notes: "['Popular family SUV in German market', '7-year/175,000km battery warranty', 'Free home charger installation support (via MG partners)', 'MG Motor Germany provides 6-year paint warranty', 'Available at 120+ MG dealers across Germany', 'Direct import from China - no local assembly', 'Higher ground clearance than MG4 (161mm vs 150mm)', 'Larger boot space than MG4 (448L vs 363L)']"
