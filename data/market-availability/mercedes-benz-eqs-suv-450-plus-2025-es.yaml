notes: |
  Mercedes-Benz EQS SUV 450+ is the luxury electric SUV with rear-wheel drive
  and extended range. Prices include 21% IVA. Single motor with 360 CV (265 kW),
  0-100 km/h in 6.7 seconds. 118 kWh battery (108.4 kWh usable) with up to
  650 km WLTP range. 200 kW DC fast charging. Premium interior with MBUX
  infotainment, Burmester 3D sound system, air suspension, and 7-seat option.
  Competes with BMW iX xDrive50, Audi e-tron Q8, and Tesla Model X.

