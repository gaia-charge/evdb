# Market Notes
notes: |
  BMW i4 eDrive35 Sport 2025 available in Italy as the entry-level variant of the i4 range.

  Motor: Single rear electric motor
  Power: 286 CV (210 kW)
  Battery: 80.7 kWh (gross)
  WLTP range: 428 km
  DC fast charging: up to 200 kW
  0-100 km/h: ~6 seconds (estimated)
  Top speed: 190 km/h (estimated)

  2025 model year improvements include:
  - Silicon carbide (SiC) semiconductors reducing consumption by 4.5%
  - Autonomy increased by up to 22 km vs 2024 model
  - Updated iDrive 8.5 infotainment system
  - New exterior colors: Cape York Green metallic and Vegas Red metallic
  - Revised kidney grille design

  Standard equipment in Sport trim includes Bi-LED headlights, 3D LED rear lights,
  airbags (front, side, second row), pedestrian acoustic warning, BMW Intelligent
  Emergency Call.

  Battery warranty: 8 years / 160,000 km

