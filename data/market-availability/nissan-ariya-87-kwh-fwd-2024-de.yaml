# Market-Specific Details
availability_status: available
available_from: "2023-01-01"
delivery_time_weeks: 14
notes: |-
  Long-range FWD variant of Nissan's electric crossover. Best range in
  Ariya lineup with 520 km WLTP. Built on CMF-EV platform shared with Renault.
  The Nissan Ariya 87 kWh FWD offers the best range in the Ariya lineup
  at 520 km WLTP. German pricing starts at €56,000, positioned between
  the 63 kWh FWD and 87 kWh AWD variants. Strong value for buyers seeking
  long-range capability without AWD performance. Popular with business users
  due to favorable company car taxation. Typical delivery time 10-14 weeks.
  Competes directly with VW ID.4 Pro (€52k) and Hyundai Ioniq 5 Long Range
  RWD (€52k).

