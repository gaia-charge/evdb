# Market-Specific Details
availability_status: available
available_from: "2024-03-01"
delivery_time_weeks: 12
notes: |-
  2024 facelift model with improved software, faster charging (170kW),
  and more physical buttons. Built at VW's carbon-neutral Zwickau
  factory in Germany.
  The ID.3 Pro S is one of Germany's best-selling electric cars. Popular
  as a Golf replacement for families and company car users. The 2024
  facelift addressed earlier software criticism with improved UI and
  more physical buttons. 12-week delivery time (shorter than most EVs)
  thanks to local production in Zwickau, Germany. Strong residual values
  and widespread dealer network make it a safe choice.

