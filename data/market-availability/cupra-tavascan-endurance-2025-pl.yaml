notes: "CUPRA Tavascan Endurance offers compelling value at 238,800 PLN as a spacious electric SUV coupé with 550 km WLTP range. Rear-wheel drive single-motor configuration balances performance and efficiency.\nBuilt on Volkswagen's proven MEB platform, sharing technology with VW ID.5 and Skoda Enyaq iV Coupé, but with sportier CUPRA styling and dynamics. The Endurance trim provides excellent equipment level as standard, including augmented reality HUD, Matrix LEDs, and premium interior.\nWith \"Mój elektryk\" subsidy (27,000 PLN), net price drops to ~211,800 PLN, making it competitive with Tesla Model Y RWD and premium mid-size electric SUVs. Strong CUPRA brand momentum in Poland through Volkswagen Group dealership network.\nManufactured in China at VW's Anhui plant. Real-world range expected around 450 km in mixed conditions. 135 kW DC fast charging provides 10-80% in approximately 35 minutes."
