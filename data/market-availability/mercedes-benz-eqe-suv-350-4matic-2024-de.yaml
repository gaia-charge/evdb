notes: >
  The Mercedes-Benz EQE SUV 350 4MATIC adds all-wheel drive for €4,000 over the  RWD 350+ variant. Most popular variant due to balanced performance (6.0s 0-100  km/h), improved traction, and reasonable 547km WLTP range.

  Key advantages over RWD 350+:
  - All-wheel drive traction (excellent for winter/adverse conditions)
  - Faster acceleration (6.0s vs 6.6s 0-100 km/h)
  - Higher torque (765 Nm vs 565 Nm)
  - Better handling dynamics with torque vectoring

  Trade-offs vs RWD:
  - Slightly reduced range (547 km vs 590 km WLTP)
  - Higher consumption (20.5 vs 19.4 kWh/100km WLTP)
  - Increased weight (+120 kg)

  Popular configuration: EQE SUV 350 4MATIC with Premium Package, MBUX Hyperscreen,  and AMG Line comes to approximately €103,000. Most popular choice for German  buyers wanting balance of efficiency, performance, and all-weather capability.

