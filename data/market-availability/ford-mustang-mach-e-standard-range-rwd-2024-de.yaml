notes: |
  The Mustang Mach-E Standard Range RWD is the most affordable entry into the 
  Mach-E lineup in Germany, starting at €49,990. Ideal for customers who 
  primarily drive shorter distances and don't need AWD. 440 km WLTP range is 
  sufficient for most daily use. As a company car, benefits from 0.25% taxation 
  (under €70k gross list price). V2H/V2G capability requires Ford Charge Station 
  Pro (80A). BlueCruise hands-free driving available on German autobahns with 
  Technology Package.

