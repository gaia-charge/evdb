notes: The BYD Han EV at €46,900 is remarkable value for a near-5-meter luxury sedan. It  undercuts the BMW i4 and Mercedes EQE significantly while offering generous standard  equipment including Nappa leather, rotating display, and V2L. The Blade Battery (LFP)  provides excellent longevity. Main weakness is DC charging speed (120 kW max) compared  to competitors. Qualifies for 0.25% company car tax rate.
