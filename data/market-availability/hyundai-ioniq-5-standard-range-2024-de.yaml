# Notes
notes: |
  The Hyundai Ioniq 5 Standard Range is the entry-level variant of the Ioniq 5 lineup, 
  positioned at €46,900 in Germany. It offers excellent value with 58 kWh battery, 
  384 km WLTP range, and 125 kW (170 hp) single rear motor RWD configuration. 
  
  Key advantages:
  - Still benefits from E-GMP 800V architecture (220 kW DC charging, 10-80% in 18 min)
  - V2L capability standard (power external devices up to 3.6 kW)
  - Highway Driving Assist 2 (Level 2 autonomous) standard
  - Heat pump standard in European market
  - Excellent company car tax benefits (0.25% rule, €47/month at 40% bracket)
  - 5-year warranty with 8-year battery guarantee
  
  Compared to Long Range AWD (€54,900):
  - €8,000 cheaper (-15%)
  - Single motor vs dual motor (-100 kW)
  - 384 km vs 481 km WLTP range (-97 km, -20%)
  - Still fast charging capability (800V architecture maintained)
  - Lighter weight (1,890 kg vs 2,020 kg)
  
  Popular configurations:
  - Base: €48,080 (35% of buyers, best value)
  - Innovation Pack: €52,180 (40%, most popular, adds premium features)
  - Premium: €55,070 (15%, fully loaded)
  
  Main competitors:
  - VW ID.4 Pure (€44,565, 52 kWh, 343 km) - cheaper but less range
  - Tesla Model Y RWD (€44,990, 60 kWh, 455 km) - similar price, more range
  - Kia EV6 Standard (€47,990, 58 kWh, 394 km) - similar specs, platform sibling
  - Nissan Ariya 63 kWh (€47,490, 63 kWh, 403 km) - similar segment
  
  Target buyers:
  - Budget-conscious EV buyers wanting Ioniq 5 design
  - Company car drivers (excellent 0.25% tax benefits)
  - Urban/suburban drivers (384 km adequate for daily use)
  - Those prioritizing fast charging over long range
  - Hyundai/Kia brand loyalists

