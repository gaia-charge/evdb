# Notes
notes: |
  BYD Seal Design RWD offers an excellent balance of performance, efficiency, and range
  at a competitive price point, directly competing with Tesla Model 3 RWD
  and Polestar 2 Long Range Single Motor.
  
  Rear-wheel drive with 230 kW (313 hp) and 360 Nm torque.
  82.5 kWh Blade Battery (LFP chemistry) provides exceptional safety and longevity.
  570 km WLTP range with excellent efficiency.
  Premium standard equipment: Leather seats, Dynaudio 12-speaker audio system,
  head-up display (HUD), Apple CarPlay/Android Auto, heat pump, 360° camera,
  adaptive cruise control (ACC), electric panoramic sunroof.
  0-100 km/h in 5.9 seconds.
  
  Official distributor in Italy: Autotorino.
  
  Pricing includes all standard equipment and ready-to-drive delivery (excluding IPT road tax).
  Metallic paint adds €1,100.
  
  Popular Configuration: Seal Design RWD with metallic paint = €47,000

