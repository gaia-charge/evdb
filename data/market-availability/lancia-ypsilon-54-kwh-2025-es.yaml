notes: |
  Lancia Ypsilon Elettrica represents the new era of Italian elegance in electric form.
  Built on Stellantis eCMP2 platform, shares technology with Peugeot e-208, Opel Corsa-e.
  Features iconic Lancia design elements: the calice grille with LED signature,
  Stratos-inspired taillights, and refined Italian interior materials.
  54 kWh battery provides 425 km WLTP range, 100 kW DC fast charging (20-80% in 24 min).
  S.A.L.A. system (Sound, Air, Light, Amplification) offers customizable digital experience.
  First Lancia dealership in Spain opened in Barcelona July 2024.
  Includes up to 8,500 EUR in combined incentives (AUTO+, CAE, IRPF deduction).

