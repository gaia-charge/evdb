metadata:
  created_at: "2026-02-07"
  data_quality: verified
  notes: |
    Premium coupe-SUV with best-in-class aerodynamics (Cd 0.26) and 600km WLTP range.
    Style-focused buyers pay €3,000 premium over SUV for sleeker design.
    Company car tax warning: €82,900 price exceeds €70k threshold (1% vs 0.25% rate).
    Range leader in entire Q8 e-tron lineup - ideal for long-distance driving.
    Trade-off: -41L trunk space vs SUV (528L vs 569L), but still spacious.
  updated_at: "2026-02-07"
  sources:
  - https://www.audi.de/de/brand/de/neuwagen/q8-e-tron.html
