notes: |
  **Why Allure is the Smart Choice:**
  
  The e-208 Allure represents the sweet spot in Peugeot's electric lineup:
  - Same 400km range and 100kW motor as GT
  - €3,500 lower base price (€36,985 vs €40,485)
  - Lower depreciation (saves €400-500 over 3 years)
  - Can add desired GT features à la carte
  
  **Popular Configuration Strategy:**
  Most buyers choose Allure + Heat Pump + one package (€38,485-39,635 total)
  This saves €1,850-3,000 vs GT while maintaining core capability.
  
  **Company Car Advantage:**
  At 0.25% monthly list price taxation, Allure saves €747/year vs combustion 208
  despite €7,000 higher purchase price. Over 3-year lease, that's €2,241 saved.
  
  **Sales Reality:**
  Allure outsells GT 3:2 in Germany - buyers prioritize value over sporty trim.
  Heat pump take rate on Allure is ~75% (essential for German winters).
  
  **Competition:**
  Allure's €36,985 base price positions it between budget EVs (MG4, Corsa-e) and
  premium offerings (Mini Electric, 500e). Best all-around value in B-segment.
