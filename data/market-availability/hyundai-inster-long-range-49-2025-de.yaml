notes: |
  The Hyundai INSTER Long Range 49 kWh at €26,400 is the sweet spot of the range:

  **Key Advantages:**
  - Segment-leading 370 km WLTP range for a city car
  - 85 kW motor provides adequate performance (10.6s 0-100)
  - V2L preparation standard (Trend trim)
  - Heated seats standard
  - DC fast charging 10-80% in 30 minutes
  - 5-year unlimited km warranty
  - Excellent efficiency: 14.9 kWh/100km
  - Cross variant adds adventure styling

  **Considerations:**
  - Interior quality uses hard plastics
  - Small boot (280-351L)
  - No rear heated seats
  - Not rated for towing
  - 150 km/h top speed limits Autobahn cruising

  **Best for:**
  - Daily commuters wanting maximum range per euro
  - Small families as primary or second car
  - Cross variant perfect for outdoor enthusiasts
  - Company car fleets (low running costs)

