notes: At €18,900, the Leapmotor T03 is one of only two BEVs under €20,000 in Germany (alongside the Dacia Spring at ~€16,900). The T03 is significantly better equipped than the Spring, with panoramic roof, larger touchscreen, and more ADAS features as standard. Produced in Poland, avoiding EU tariffs on Chinese-imported EVs. Ideal as an affordable urban commuter. The very low DC charging speed (48 kW) limits its suitability for long trips. Qualifies for 0.25% company car tax rate.
