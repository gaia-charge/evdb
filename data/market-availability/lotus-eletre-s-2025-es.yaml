notes: |
  Lotus Eletre S (marketed as "Sport" in Spain) is the high-performance
  variant with 675 kW (918 CV) dual motors and AWD. Prices include 21% IVA.
  Acceleration 0-100 km/h in 2.9 seconds, top speed 265 km/h. 109 kWh battery
  with 490 km WLTP range. 350 kW DC fast charging. Carbon ceramic brakes,
  rear-wheel steering, active air suspension with torque vectoring. Meridian
  3D audio with 2160W and 23 speakers. One of the fastest production SUVs
  in the world. Competes with Porsche Cayenne Turbo S E-Hybrid and BMW iX M60.

