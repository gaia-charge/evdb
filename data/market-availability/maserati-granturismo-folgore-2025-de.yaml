  pricing_notes: |
    Base price includes comprehensive flagship specification:
    - 92.5 kWh battery (usable) with 800V architecture
    - 560 kW (761 hp) triple electric motors with intelligent AWD
    - 270 kW DC fast charging (10-80% in ~20 min)
    - Carbon ceramic brakes standard
    - Adaptive air suspension
    - 14-way power sport seats (Nappa leather & Alcantara)
    - Sonus faber High Premium Sound System (19 speakers, 860W)
    - Maserati Intelligent Assistant (MIA) multimedia system
    - Three high-resolution displays (12.3" + 12.3" + 8.8")
    - 360° camera system
    - Carbon fiber interior trim
    - LED Matrix headlights
    - 2-zone climate control with heat pump
    - Highway Assist (Level 2)
    - 20" staggered wheels

    German pricing includes 19% VAT. Extensive Fuoriserie customization available.

