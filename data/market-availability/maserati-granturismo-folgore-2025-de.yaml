notes: "The Maserati GranTurismo Folgore is a halo car for the Folgore electric lineup:\n\n- SUPERCAR acceleration: 2.7s 0-100 km/h (triple motor, 761 hp)\n- ULTRA-FAST charging: 270 kW (fastest in Maserati lineup)\n- ICONIC GT design: Classic proportions with electric innovation\n- 325 km/h top speed - among the fastest production EVs\n- EXCLUSIVE: Very limited production volumes\n\nAt €198,500, it competes with the Porsche Taycan Turbo GT (€218,000) while\noffering distinctive Italian character. The triple-motor torque vectoring\nprovides unique driving dynamics not found in dual-motor competitors.\n\nTarget buyers: Collectors, performance enthusiasts, Italian car devotees,\ncompany car drivers seeking maximum tax advantage on a supercar-performance GT."
