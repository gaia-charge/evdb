company_car_tax:
  rate_percent: 0.5
  calculation_basis: list_price
  calculation: |
    Vehicles priced over €70,000 qualify for 0.5% monthly taxation.

    Example calculation (base €198,500):
    - Monthly taxable benefit: €198,500 × 0.5% = €993/month
    - Annual taxable benefit: €11,910/year
    - Income tax on benefit (42% bracket): ~€5,002/year
    - Social contributions (~20%): ~€2,382/year
    - Total annual cost to employee: ~€7,384/year

    Comparison to combustion GranTurismo Trofeo (1% rate at €185,000):
    - Annual taxable benefit: €22,200/year
    - Tax + social (62%): ~€13,764/year
    - Annual savings with Folgore EV: ~€6,380/year

    Significant tax advantage makes the Folgore compelling for company car drivers.

  notes: |
    GranTurismo Folgore qualifies for advantageous 0.5% company car tax rate.
    Substantial savings vs combustion GranTurismo variants.

