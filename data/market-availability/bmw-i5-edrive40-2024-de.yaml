# Notes
notes: |
  The BMW i5 eDrive40 is BMW's new executive electric sedan for 2024, built on the
  latest G60 platform. It replaces the previous generation 5-series and offers improved
  efficiency, range, and interior space compared to the i4. 
  
  Key advantages over i4 eDrive40:
  - Larger, more spacious executive sedan (E-segment vs D-segment)
  - Better standard equipment (LED matrix lights, Harman Kardon, heat pump all standard)
  - Improved efficiency (15.9 vs 16.1 kWh/100km WLTP)
  - More rear legroom and trunk space (490L vs 470L)
  - Latest BMW OS 8.5 (vs OS 8 in i4)
  - Better aerodynamics (Cd 0.23 vs 0.24)
  
  Company car positioning:
  The i5 is ideally positioned as a premium company car with the 0.25% tax benefit.
  At €69,900, it saves €6,288/year vs an ICE equivalent (1% rate). Most buyers
  configure with M Sport Package Pro and Driving Assistant Professional, bringing
  total price to ~€77,000-88,000. Popular with management and executives.
  
  Competition:
  - Mercedes-Benz EQE 300 (€71,328): Similar price, but Mercedes brand prestige
  - Audi e-tron GT quattro (€105,500): Much more expensive, sportier positioning
  - Tesla Model S (€96,990): More range but less premium interior
  - Genesis Electrified G80 (€77,450): Korean luxury alternative
  
  Delivery time: 14 weeks (built-to-order at Dingolfing). Popular configurations
  may have shorter wait times due to pre-allocated production slots.

