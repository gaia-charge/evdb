notes: The GWM ORA 07 Performance AWD at €49,990 undercuts the Tesla Model 3 Performance significantly while offering 401 PS and 4.3s 0-100 km/h. The main trade-off is the slower 90 kW DC charging and shorter 295 km WLTP range compared to competitors. The frameless doors, low Cd of 0.236, and premium equipment make it an attractive performance EV proposition. 5-year warranty adds confidence. Qualifies for 0.25% company car tax rate.
