# Market-Specific Notes
market_notes: |
  The ID.7 Pro 2026 is VW's flagship electric sedan, targeting the premium
  business car segment dominated by BMW 5 Series and Mercedes E-Class.
  With 628 km WLTP range and Cd 0.23 aerodynamics, it's one of the most
  efficient large sedans available. Mid-cycle update adds V2L capability,
  ID. Software 5.0 with ChatGPT integration, and improved charging management.
  Popular with company car users who benefit from 0.25% tax rate (under €70k).
  Strong dealer network and VW brand reputation make it a safe choice for
  fleet buyers. 12-week delivery time improved from 16 weeks in 2024.

