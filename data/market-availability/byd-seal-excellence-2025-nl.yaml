  - 520 km WLTP range
  - Premium standard equipment: Nappa leather, Dynaudio sound, head-up display
  - 8-year/200,000 km battery warranty
  - Fast charging: 26 min 30-80%

  Excellent all-weather capability with AWD traction control.
  Lower total cost of ownership than comparable German premium EVs.

