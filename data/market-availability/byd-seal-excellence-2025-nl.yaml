  BYD Seal Excellence AWD 2025 delivers supercar-level performance (3.8s 0-100 km/h,
  530 pk) at a competitive price point in the Netherlands.

  2025 Model Year:
  - Dual-motor all-wheel-drive with 390 kW (530 pk) and 670 Nm torque
