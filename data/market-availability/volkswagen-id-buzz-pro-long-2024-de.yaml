# German EV Incentives and Tax Benefits (2024)
incentives:
  - name: BAFA Umweltbonus (Environmental Bonus)
    type: rebate
    amount: 0
    currency: EUR
    eligibility: "Ended December 2023"
    notes: |
      The German federal EV subsidy program (BAFA Umweltbonus) ended on
      December 17, 2023. No federal purchase incentives available in 2024.
  
  - name: Company Car Tax Reduction
    type: tax_credit
    amount: 5268
    currency: EUR
    eligibility: "All electric vehicles under €70,000 gross list price"
    notes: |
      ID.Buzz Pro Long (€58,490 base) qualifies for 0.25% monthly taxation
      (vs 1% for ICE vehicles). Saves ~€5,268/year for company car drivers
      compared to equivalent ICE van.
      
      Calculation: €58,490 × 0.25% = €146/month tax (vs €585/month at 1%)
      Annual savings: (€585 - €146) × 12 = €5,268/year tax reduction
  
  - name: Kfz-Steuer Exemption (Vehicle Tax)
    type: tax_exemption
    amount: 350
    currency: EUR
    eligibility: "All battery electric vehicles registered by 2030"
    notes: |
      Complete exemption from annual German vehicle tax (Kfz-Steuer)
      until December 31, 2030. Typical ICE van would cost ~€300-400/year.
  
  - name: THG-Quote (CO2 Certificate Trading)
    type: rebate
    amount: 300
    currency: EUR
    eligibility: "All registered BEV owners in Germany"
    notes: |
      EV owners can sell their annual CO2 savings certificate via various
      platforms. Typical payout: €250-350/year depending on market rates.
      Can be claimed annually by the vehicle owner.
  
  - name: Regional/City Incentives
    type: discount
    amount: 0
    currency: EUR
    eligibility: "Varies by city/region"
    notes: |
      Some German cities offer additional benefits:
      - Free or reduced parking fees in some cities
      - Access to bus lanes in select cities
      - Reduced toll fees on some roads
      - Check with local municipality for specific benefits

