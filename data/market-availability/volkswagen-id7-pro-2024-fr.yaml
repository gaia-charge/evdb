notes: |-
  VW ID.7 Pro available in France since October 2023. Built at Emden, Germany.
  L'ID.7 Pro est la berline électrique phare de VW, ciblant le segment
  premium business. Avec 621 km d'autonomie WLTP et un Cx de 0.23,
  c'est l'une des grandes berlines les plus efficientes. Non éligible
  au bonus écologique (prix > €47,000), mais exonérée de TVS pour
  les entreprises.

