notes: |
  Jeep Avenger Altitude represents the best-selling trim in Germany (~45% of orders).

  Key considerations:

  ✅ PROS:
  - Most popular trim with excellent equipment balance
  - Dual-zone climate and heated seats standard (€880 value vs Longitude)
  - Wireless charging and 18" wheels included
  - Strong company car proposition (0.25% tax rate)
  - Well-equipped for the price
  - 2023 European Car of the Year winner

  ⚠️ CONS:
  - Exceeds €40,000 net threshold - NO federal incentive (€4,500 lost)
  - €2,490 more than Longitude (which DOES qualify for incentive)
  - Slightly reduced range vs 17" wheels (7km less)
  - No heat pump (impacts winter range)

  💡 RECOMMENDATION:
  For PRIVATE BUYERS: Consider Longitude trim (€39,990) which qualifies for €4,500
  federal incentive. Add desired Altitude features individually if needed.

  For COMPANY CAR DRIVERS: Altitude is excellent choice. 0.25% tax rate saves
  €3,921/year vs ICE, recovering the €2,490 premium over Longitude in 8 months.
  Federal incentive not available regardless of trim.

  BEST VALUE CONFIG: Altitude Base (€43,570) + Advanced Driver Assistance (€1,490)
  + Heated Steering Wheel (€290) = €45,350 total. Perfect daily driver with
  comprehensive safety tech and comfort features.
