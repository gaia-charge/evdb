      annual_savings: 3921
    notes: |
      0.25% company car tax rate for pure electric vehicles.

      Calculation (0.25% rate):
      €43,570 × 0.25% × 12 months = €1,307 per year

      Monthly benefit in kind: €109 (compared to €435 for ICE equivalent)

      For company car drivers, Altitude is excellent value despite missing
      federal incentive. Tax savings of €3,921/year over PHEV equivalent
      recover the higher purchase price vs Longitude in ~6 months.

