notes: |
  2024 German market pricing for Mazda MX-30. Base price at €35,990 (Prime-Line)
  makes it one of the more affordable EVs, but the 200 km WLTP range significantly
  limits its appeal. Best suited as a second car or for urban buyers with home
  charging who rarely drive long distances. The unique freestyle doors, cork
  interior, and premium materials create a distinctive ownership experience.
  Company car drivers save €3,240/year with 0.25% tax rate. Most popular
  configuration is Prime-Line with metallic paint (~€38k). The MX-30 appeals to
  design-conscious buyers who prioritize sustainability (small battery = lower
  production emissions) over maximum range. Strong competition from Mini Cooper
  Electric (250km range, similar price) and Smart #1 (440km range, slightly more
  expensive). Mazda's dealer network and reputation for reliability are key
  selling points.

