market_notes: >
  The BYD Sealion 7 Comfort RWD is the entry-level trim of the Sealion 7 lineup in France.
  Features 230 kW (313 hp) RWD motor, 82.5 kWh Blade Battery, 482 km WLTP range (630 km city).
  0-100 km/h in 6.7 seconds, 215 km/h top speed, 150 kW DC fast charging (10-80% in 32 min).
  Standard equipment includes 19" wheels, Continental tires, dual wishbone front suspension,
  multi-link rear, panoramic roof, 15.6" rotating touchscreen, Dynaudio 12-speaker audio,
  360° camera, comprehensive ADAS suite, 58L frunk, and 520-1,789L cargo capacity.
  Financing available from €549/month (LLD 49 months).
  Sits below Design AWD (€51,990) and Excellence AWD (€56,490) trims.

