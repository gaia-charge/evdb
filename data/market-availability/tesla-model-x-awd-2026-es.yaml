notes: Tesla Model X is sold directly through tesla.com/es_ES and Tesla stores in Madrid, Barcelona, Málaga, Valencia, and Bilbao. No dealer markups. At €117,490, far above MOVES III cap — no purchase subsidies apply. However, IEDMT exemption saves €14,000-€17,000 vs equivalent ICE luxury SUV (which would pay 12-14.75% registration tax). Short delivery times (4 weeks) due to established supply chain. Supercharger network well developed across Spain with 50+ locations.
