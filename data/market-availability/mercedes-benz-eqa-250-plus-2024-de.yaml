    Pricing and availability for Germany as of February 2026.
    All prices include 19% German VAT (Mehrwertsteuer).
    
    The EQA 250+ replaced the original EQA 250 in 2023 with a larger 66.5kWh battery
    (vs 60.0kWh), adding +86km range (426 vs 340km WLTP).
    
    Mercedes-Benz Germany offers online purchase via Mercedes me Store with:
    - Home delivery (€295 fee, includes registration)
    - Trade-in valuation
    - Financing and leasing options
    - 14-day return policy
    
    Current lead times:
    - Electric Art (18" wheels): 12 weeks
    - AMG Line (19" wheels): 14 weeks
    - Custom MANUFAKTUR paint: +4 weeks
    
    Most popular configuration:
    - AMG Line (€57,969)
    - Premium Plus Package (€6,190)
    - Comfort Package (€1,890)
    - Total: ~€67,139 (typical buyer spec)
    
    Residual values (3-year, 50,000km):
    - 52-55% of purchase price
    - Higher than non-premium brands (better resale)
    - Lower than ICE Mercedes (EV depreciation uncertainty)

