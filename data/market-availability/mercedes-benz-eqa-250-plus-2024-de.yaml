# Market context
market_context:
  competitors:
    - model: "BMW iX1 xDrive30"
      price: 54200
      range_wltp: 439
      charging_max: 130
      notes: "Similar price, slightly more range, faster charging, AWD standard"
    
    - model: "Audi Q4 e-tron 40"
      price: 49500
      range_wltp: 488
      charging_max: 125
      notes: "€4,899 cheaper, significantly more range, similar charging"
    
    - model: "Volvo XC40 Recharge Single Motor"
      price: 48050
      range_wltp: 460
      charging_max: 150
      notes: "€6,349 cheaper, more range, faster charging"
    
    - model: "Tesla Model Y RWD"
      price: 44990
      range_wltp: 455
      charging_max: 170
      notes: "€9,409 cheaper, similar range, much faster charging, larger"
    
    - model: "Mercedes-Benz EQB 250+"
      price: 60845
      range_wltp: 423
      charging_max: 100
      notes: "€6,446 more, 7 seats, similar range/charging, larger body"
  
  market_position: |
    The Mercedes-Benz EQA 250+ is positioned as Mercedes' entry-level electric SUV,
    targeting urban families who value premium brand prestige and build quality.
    
    At €54,399, it's priced €4,899 more than Audi Q4 40, €6,349 more than Volvo XC40,
    and €9,409 more than Tesla Model Y - all offering more range and faster charging.
    
    The EQA's value proposition:
    - Premium Mercedes brand prestige (three-pointed star)
    - Proven MFA2 platform (shared with GLA - over 500,000 sold)
    - Excellent dealer network (650+ in Germany)
    - Superior build quality and interior materials
    - MBUX infotainment (best in class for user experience)
    - Strong resale value (Mercedes brand holds value well)
    
    Best for:
    - Company car drivers (€3,996/year tax savings vs ICE)
    - Urban/suburban driving (426km range adequate, rarely use DC charging)
    - Mercedes loyalists (upgrading from GLA/B-Class)
    - Premium brand preference (willing to pay for three-pointed star)
    - Families needing compact luxury crossover (5 seats, 340L trunk)
    
    Not ideal for:
    - Budget-conscious buyers (€9,409 more than Model Y for less range/charging)
    - Maximum range priority (426km vs 488km Q4, 460km XC40)
    - Frequent highway driving (100kW DC charging, 32-min 10-80%)
    - Maximum cargo space (340L vs 854L Model Y, 405L Q4)
    
    Popular configurations:
    - Base "Electric Art": €54,399 (well-equipped, best value)
    - AMG Line: €60,929 (+€6,530 with Premium Plus, sport styling)
    - Fully loaded: ~€68,000 (AMG + Premium Plus + options)
    
    Typical buyer profile:
    - Age 35-55, urban/suburban
    - Company car driver (0.25% tax benefit)
    - Values premium brand + dealer network
    - 80% charging at home (11kW wallbox)
    - 15,000km/year average driving

