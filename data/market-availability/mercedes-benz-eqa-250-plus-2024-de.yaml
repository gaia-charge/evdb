# Incentives and subsidies (2024)
incentives:
  - name: "BAFA Umweltbonus (Federal EV Grant)"
    type: grant
    amount: 0
    notes: "Ended December 17, 2023 (budget exhausted). Was €4,500 for <€65k EVs until Dec 2023."
    valid_until: null
  
  - name: "Company Car Tax Benefit"
    type: tax_credit
    amount: 3996  # Annual savings vs 1% ICE rate
    notes: "0.25% of gross list price per month (vs 1% for ICE). For €54,399 vehicle: 0.25% = €136/month = €1,632/year vs 1% ICE GLA (€46,850) = €469/month = €5,628/year. Annual savings: €3,996."
    calculation: "€54,399 × 0.25% = €136/month. ICE GLA: €46,850 × 1% = €469/month. Difference: €3,996/year"
    eligibility: "Company car drivers only"
  
  - name: "Kfz-Steuer exemption"
    type: tax_exemption
    amount: 280  # Annual road tax savings
    notes: "Electric vehicles exempt from German road tax until 2030. Comparable ICE GLA would pay ~€280/year."
    valid_until: "2030-12-31"
  
  - name: "THG-Quote (CO2 Certificate Trading)"
    type: grant
    amount: 300  # Annual income
    notes: "EV owners can sell CO2 certificates for ~€300-350/year via providers like THG, ADAC, Geld für eAuto, eQuota."

