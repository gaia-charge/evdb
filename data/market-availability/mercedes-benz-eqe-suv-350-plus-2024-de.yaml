notes: >
  The Mercedes-Benz EQE SUV 350+ is the entry-level variant of the mid-size 
  luxury electric SUV, competing with BMW iX xDrive40, Audi Q8 e-tron 50, and 
  Tesla Model X. At €77,000, it offers excellent value with rear-wheel drive 
  efficiency and 590km WLTP range.
  
  Key competitive factors:
  - Excellent 590km WLTP range (best efficiency in EQE SUV lineup)
  - Superior aerodynamics (Cd 0.26) for an SUV
  - Spacious 520L cargo capacity (1675L seats down)
  - Optional Level 3 DRIVE PILOT autonomy (Germany only)
  - Luxurious Mercedes-Benz interior with optional MBUX Hyperscreen
  - 1800kg towing capacity (excellent for SUV class)
  - 10-year/250,000km battery warranty
  
  RWD advantage: The 350+ offers the best efficiency and longest range in the 
  EQE SUV lineup thanks to single-motor rear-wheel drive configuration.
  
  Tax consideration: €77,000 list price exceeds €70,000 threshold for 0.25% 
  company car tax, resulting in standard 1% rate. Still competitive for luxury 
  SUV segment.
  
  Popular configuration: EQE SUV 350+ with Premium Package, MBUX Hyperscreen, 
  and AMG Line comes to approximately €99,000, providing comprehensive luxury 
  SUV experience.

