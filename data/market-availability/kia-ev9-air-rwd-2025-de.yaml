notes: |
  The Kia EV9 Air RWD 2025 at €63,190 is priced under the critical €70,000
  company car tax threshold in Germany. This means company car drivers benefit
  from the favorable 0.25% monthly tax rate (€158/month) instead of the 1%
  rate for vehicles over €70,000. This makes it extremely attractive for
  Dienstwagen (company car) users.

  Excellent value proposition as the most affordable 3-row electric SUV in
  the premium segment. Key competitor pricing:
  - Volvo EX90 (€86,500) - €23,310 more
  - Tesla Model X (€98,990) - €35,800 more
  - Mercedes EQS SUV (€114,641) - €51,451 more
  
  12-week delivery time. 7-year Kia warranty standard.

