  notes: "EC40 is the coupe version of EX40 with superior aerodynamics (Cd 0.30 vs 0.33). Single motor RWD variant offers best efficiency and range (530 km WLTP - 55km more than EX40 Single Motor!). Google built-in standard. Real-world range: 450 km mixed (85% of WLTP) - excellent for long-distance travel. 150 kW DC charging: 10-80% in 32 min. Swedish safety heritage: City Safety collision avoidance, Pilot Assist adaptive cruise standard. Coupe SUV practicality: 413L cargo (behind rear seats), slightly less than EX40 but sportier roofline. Towing: 1,500kg braked. Company car value: under €70k = 0.25% tax rate saves ~€5,000/year. Built in Belgium (Ghent factory). Competes with Tesla Model Y RWD (€49k), BMW iX1 xDrive30 (€54k), Mercedes EQA 250+ (€56k). Best aerodynamics in compact electric SUV segment. Typical price: €58-62k with popular options. Premium coupe SUV with Scandinavian design, exceptional efficiency, and strong range."
  updated_at: "2026-02-08"
