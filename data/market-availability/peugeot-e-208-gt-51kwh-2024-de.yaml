notes: |
  **Market Positioning in Germany:**
  
  The Peugeot e-208 GT at €39,990 (€41,080 on-the-road) is positioned as a premium compact EV:
  
  **vs Direct Competitors:**
  - **Opel Corsa-e (€36,990)**: Identical mechanically, €3k cheaper, less distinctive design
  - **Mini Cooper Electric (€39,990)**: Same price, less range (305km), more premium brand
  - **Fiat 500e Icon (€34,990)**: €5k cheaper, smaller, less practical, retro charm
  - **MG4 Extended Range (€35,990)**: €4k cheaper, more range (435km), larger, less premium
  - **Renault Megane E-Tech (€42,990)**: €3k more, much more range (470km), larger C-segment
  
  **Key Selling Points:**
  - Award-winning design (European Car of the Year 2020)
  - Unique 3D i-Cockpit with holographic instrument display
  - Premium interior materials (Alcantara/TEP with Lime Yellow stitching)
  - Fast 8-week delivery (Slovakian production close to Germany)
  - 400km WLTP range sufficient for daily use
  - Strong Stellantis dealer network (850+ locations)
  
  **Company Car Benefits:**
  With 0.25% monthly taxation (€100/month vs €1,200 for ICE equivalent), the e-208 GT saves
  company car drivers €13,200 per year in taxes. This makes the higher purchase price very
  attractive for business use.
  
  **Weaknesses:**
  - Slower DC fast charging (100kW) vs MG4 (135kW) or Hyundai Ioniq 5 (230kW)
  - Smallest trunk in segment (309L) due to battery placement
  - No towing capability
  - No bidirectional charging (V2L/V2H/V2G)
  - Platform shares components with ICE variant (not dedicated EV platform)
  
  **2023 Facelift Improvements:**
  - Battery: 50kWh → 51kWh (+2%)
  - Range: 385km → 400km WLTP (+3.9%)
  - Efficiency: 16.5 → 15.9 kWh/100km (-3.6%)
  - Updated infotainment UI
  - Improved heat pump efficiency
  
  **Target Buyer:**
  Urban/suburban drivers seeking a stylish, premium compact EV for daily commuting and
  weekend trips. The 400km range and fast charging make it suitable for occasional longer
  journeys. Strong choice for company car drivers due to 0.25% tax benefit.
