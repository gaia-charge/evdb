# Notes
notes: |
  Renault Megane E-Tech EV60 Techno, la version la plus populaire en France.
  Excellent équilibre entre autonomie (450 km WLTP, 370 km réel), performances,
  et équipements. Pompe à chaleur et chargeur 22kW AC de série.
  Prix attractif avec bonus écologique (€5,000) et prime à la conversion (€2,500).
  Fabriqué en France à Douai (Renault ElectriCity). Autonomie suffisante pour
  la plupart des trajets quotidiens et déplacements occasionnels longue distance.

