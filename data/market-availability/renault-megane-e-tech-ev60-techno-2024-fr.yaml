# Notes
notes: |
  Renault Megane E-Tech EV60 Techno est la variante la plus populaire en France,
  avec une autonomie de 450 km WLTP et une recharge 22kW AC. Produite à l'usine
  ElectriCity de Douai, la livraison est rapide (6 semaines). Éligible au bonus
  écologique de 5000€ et à la prime à la conversion jusqu'à 2500€.
  Le véhicule a été élu Voiture de l'Année 2023 en Europe.

