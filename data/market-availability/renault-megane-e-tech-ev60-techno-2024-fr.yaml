# Notes
notes: |
  Renault Megane E-Tech EV60 Techno - version intermédiaire offrant
  un excellent équilibre entre autonomie, performances et équipements.
  Avec 450 km d'autonomie WLTP (380 km en conditions réelles) et un
  moteur de 218 ch, elle gère sereinement les trajets quotidiens et
  les escapades weekend. Recharge AC 22kW et DC 130kW pour une
  flexibilité maximale. Équipements premium incluant sièges cuir
  synthétique chauffants, climatisation bizone, régulateur adaptatif,
  et système audio Arkamys premium. Élue Voiture de l'Année 2023 en
  Europe. Éligible au bonus écologique français et à la prime à la
  conversion. Délai de livraison actuellement 8 semaines. Fabriquée
  en France à l'usine ElectriCity de Douai.

