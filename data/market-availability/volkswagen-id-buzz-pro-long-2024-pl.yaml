notes: |
  VW ID.Buzz Pro Long is gaining popularity in Poland as a family-oriented
  electric MPV. The iconic retro design appeals to a broad audience.

  Key Poland-specific considerations:
  - Base configuration may qualify for Mój elektryk (PLN 27,000) subsidy
  - Very attractive for business fleets (full VAT recovery)
  - Practical for Polish families (7-seater option available)
  - VW has extensive dealer/service network across Poland
  - Charging: 77 kWh battery provides ~450km WLTP range, practical for intercity travel

  Competitors in Poland:
  - No direct EV MPV competitors at this price point
  - Mercedes EQV (~PLN 350,000+) is significantly more expensive
  - Kia EV9 RWD (~PLN 279,900) is a 3-row SUV alternative

