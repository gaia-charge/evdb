# Market-Specific Details
availability_status: available
available_from: "2023-01-01"
delivery_time_weeks: 12
notes: |-
  All-wheel drive variant of Škoda's popular electric SUV. With 265 hp dual
  motors and 82 kWh battery, it offers excellent performance and traction.
  Popular in regions with harsh winter weather.
  The Škoda Enyaq iV 80x is extremely popular in Germany, offering excellent
  value vs competitors. At €53,900, it's €7,845 cheaper than VW ID.4 GTX
  despite sharing platform and similar specs. Popular with families and
  business users. AWD provides confidence in winter conditions. Typical
  delivery 10-12 weeks. Best-selling electric SUV in its price range.
  Most buyers configure with Travel Assist and Canton sound system.

