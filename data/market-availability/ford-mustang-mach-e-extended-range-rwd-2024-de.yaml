notes: |
  The Mustang Mach-E Extended Range RWD is the longest-range variant in the 
  lineup, achieving up to 600 km WLTP range. Ideal for customers who prioritize 
  range and efficiency over AWD capability. Priced at €56,990, it sits between 
  the Standard Range RWD and Extended Range AWD. As a company car, benefits 
  from 0.25% taxation (under €70k gross list price). Extremely popular with 
  long-distance drivers and company car users. V2H/V2G capability requires 
  Ford Charge Station Pro (80A). BlueCruise hands-free driving available on 
  German autobahns with Technology Package. Premium trim includes heated seats 
  and steering wheel as standard.

