# Company Car Taxation
company_car_taxation:
  gross_list_price: 59900
  tax_rate_percent: 0.25
  monthly_taxable_benefit: 149.75
  notes: |
    For company car drivers with €60,000 gross salary:
    - Monthly benefit: €149.75
    - Tax (35% rate): €52.41/month (€629/year)
    - Social security (20%): €29.95/month (€359/year)
    - Total annual cost to employee: ~€988
    
    Compared to equivalent ICE Audi Q5 (€60,000 @ 1% = €600/month = €7,200/year tax cost),
    BEV saves company car driver approximately €6,212 per year.
    
    Note: Fully loaded configurations above €70,000 fall under 0.5% rule instead (double the taxation).

# Market Notes
notes: |
  Audi Q4 50 e-tron quattro 2026 is the new mid-range AWD variant filling the gap between
  the Q4 40 (RWD) and Q4 45 quattro. Introduced for 2026 model year with improved battery
  and charging performance.
  
  Available through Audi dealership network across Germany. Order online via audi.de
  or at any Audi center. Delivery time currently 12 weeks (shorter than 2024-2025).
  
  2026 updates include:
  - Larger 85kWh battery (82kWh usable) vs 82kWh total in 2024
  - Improved DC charging to 170kW peak
  - Enhanced MMI with AI features
  - Matrix LED headlights standard on 50 quattro
  - New Aurora Violet color option
  
  Key competitors in Germany:
  - Tesla Model Y Long Range AWD (€54,990) - cheaper, less premium
  - BMW iX1 xDrive30 (€56,500) - smaller, similar price
  - Mercedes-Benz EQB 350 4MATIC (€64,000) - more expensive
  - Volkswagen ID.5 Pro 4MOTION (€57,000) - sister model, less premium
  
  Q4 50 quattro offers best value in the Q4 range with excellent balance of range,
  performance, space, and premium features. Popular with families and company car drivers.
  
  Company car benefit: Base configuration stays under €70,000 threshold for 0.25% taxation,
  making it very attractive for company car drivers. Fully loaded S line versions exceed 
  €70,000 and fall under 0.5% rule (still better than 1% for ICE).
  
  Winter range typically 400-430km in real-world conditions (-20°C) thanks to improved
  heat pump efficiency in 2026 model year.

