notes: The BYD Seal U Design is the top trim of the Seal U lineup in France. Features 160 kW (218 hp) motor, 87 kWh Blade Battery, 500 km WLTP range. 0-100 km/h in 9.6 seconds, 140 kW DC fast charging (30-80% in 29 min), 11 kW AC charging. Standard equipment includes 15.4" rotating touchscreen, Apple CarPlay/Android Auto, ambient lighting, spacious family-friendly interior with 522L trunk (1,440L with seats folded), optional tow hitch (1,100 kg capacity), heat pump, and comprehensive safety systems. Financing available from €519/month (LLD 49 months). Sits above Comfort trim (€42,890, 71.8 kWh, 420 km range).
