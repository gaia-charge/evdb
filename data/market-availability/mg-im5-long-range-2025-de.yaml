    The MG IM5 at €36,990 is a game-changer for the E-segment:
    - 710km WLTP range (more than any competitor under €50k)
    - 800V architecture with 369kW DC charging
    - 5-star Euro NCAP safety rating
    - 7-year warranty
    
    Competitive context:
    - Tesla Model 3 Long Range: ~€44,990 (less range)
    - BYD Seal Excellence AWD: ~€47,990 (less range)
    - Hyundai Ioniq 6 Long Range: ~€47,990 (similar range)
    - Polestar 2 Long Range: ~€48,990 (less range)
    
    The IM5 offers near-flagship specs at mainstream pricing.
