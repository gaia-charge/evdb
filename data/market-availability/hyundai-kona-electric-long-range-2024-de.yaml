  value_proposition: >
    Hyundai Kona Electric Long Range is positioned as an affordable entry into Hyundai's
    electric SUV lineup. Excellent value proposition at €42,990 with 514km WLTP range,
    advanced safety features, and Hyundai's industry-leading 8-year/160,000km battery warranty.
    More affordable than Ioniq 5 (€49,900) while offering similar technology. Popular choice
    for company car drivers (0.25% tax rate saves €3,869 annually vs ICE). Strong residual
    values expected based on Hyundai's reputation. Ideal for buyers seeking practical
    electric SUV without premium price tag.

# Notes
notes: |
  Hyundai Kona Electric is one of the best-selling compact electric SUVs in Germany.
  Second-generation model (2024) offers significantly improved range and charging vs
  first generation. Excellent build quality and Hyundai's reputation for reliability.
  400V architecture (not 800V like Ioniq 5) means slower DC fast charging (102kW max).
  Heat pump standard on Long Range variant improves winter range. V2L capability allows
  using vehicle as power source (3.6kW). Ideal for urban families and first-time EV buyers.
  Strong residual values (~55% after 3 years). Popular in company car segment due to
  0.25% tax rate and practical size. Delivery times shorter than Ioniq 5.

