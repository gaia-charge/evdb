# Notes
notes: |
  2025 VW ID.4 Pro 4MOTION offers AWD capability with 250 kW (340 hp) total power,
  improved performance (6.2s 0-100 km/h), updated styling, improved ID.Software 4.0,
  faster DC charging (up to 175 kW), and bidirectional charging (V2L) capability.
  Premium over RWD Pro is €5,000. Manufactured in Zwickau, Germany.
  Qualifies for 0.25% company car tax benefit (under €70k).

