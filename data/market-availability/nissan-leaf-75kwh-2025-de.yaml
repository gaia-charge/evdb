notes: The Extended Range 75 kWh variant offers an impressive 622 km WLTP range, making it one of the longest-range cars in its class. The 160 kW motor provides strong performance, and the heat pump is included as standard. At €42,990, it competes directly with the Renault Scenic E-Tech EV87 and offers significantly more range than the VW ID.3 Pro S. The 0.25% company car tax rate and road tax exemption make it very competitive for business users.
