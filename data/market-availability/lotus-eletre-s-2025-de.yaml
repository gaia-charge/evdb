notes: >
  The Lotus Eletre S is one of the fastest production SUVs in the world with
  675 kW (918 hp) and 2.95s 0-100 km/h acceleration. At €139,900, it significantly
  undercuts the Porsche Taycan Turbo S (€190,000) while offering SUV practicality.
  The combination of supercar performance, 490 km range, 350 kW DC charging,
  carbon ceramic brakes, rear-wheel steering, and torque vectoring creates a
  compelling package for performance enthusiasts. Standard equipment includes
  Meridian 3D audio (2160W, 23 speakers), carbon fiber trim throughout, and
  track recorder. The R Package (€15,000) adds lightweight wheels, sport bucket
  seats, roll cage, and track telemetry for serious track use. 20-24 week delivery
  reflects limited production and high demand. Despite the high price, 0.25%
  company car tax makes it attractive for business users seeking ultimate performance
  with BEV efficiency. Competes with Porsche Cayenne Turbo S E-Hybrid but offers
  pure BEV experience with better tax treatment. Limited dealer network offset by
  VIP concierge service. Strong resale value expected given Lotus's heritage and
  limited production numbers. Track day experiences included with purchase add
  value for performance-oriented buyers.
