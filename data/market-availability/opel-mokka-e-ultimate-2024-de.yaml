notes: |
  The Opel Mokka-e Ultimate at €39,990 offers premium features at competitive pricing:

  **Key Advantages:**
  - IntelliLux LED Matrix headlights (standard on Ultimate)
  - 12" digital instrument cluster
  - Leather seats, panoramic sunroof
  - €1,500-2,500 cheaper than Peugeot e-2008 GT
  - Distinctive "Vizor" design
  - Company car tax benefit: 0.25% = €100/month

  **vs Peugeot e-2008:**
  - €1,500 cheaper than e-2008 GT
  - Same CMP platform, battery, motor
  - Modern Opel design vs traditional Peugeot SUV styling
  - Smaller trunk (310L vs 405L)

  **Best for:**
  - Buyers wanting premium features at accessible pricing
  - Company car drivers (0.25% tax advantage)
  - Modern design enthusiasts

