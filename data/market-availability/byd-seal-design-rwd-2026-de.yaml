  comparable_ice_costs:
    vehicle: BMW 330i
    purchase_price: 52500
    fuel_cost_3yr: 7740  # 45,000km @ 6.5L/100km × €1.92/L (2026 price)
    maintenance_3yr: 2280  # Higher maintenance for combustion
