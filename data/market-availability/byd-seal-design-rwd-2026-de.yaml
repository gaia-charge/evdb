# Incentives and subsidies (2026)
incentives:
  - name: Company Car Tax Benefit
    type: tax_exemption
    amount: 4849
    description: Company car tax benefit - 0.25% rate vs 1% for combustion vehicles
    notes: >
      Company car drivers benefit significantly from 0.25% monthly tax rate 
      (vs 1% for combustion vehicles), saving approximately €4,849 annually 
      with the 2026 model pricing. This remains the main financial incentive 
      for EVs in Germany.
  
  - name: THG-Quote (Greenhouse Gas Reduction Quota)
    type: grant
    amount: 270
    description: Annual CO2 certificate trading income
    notes: >
      Tradeable emission certificates provide annual income of approximately 
      €250-290 in 2026 (market prices have stabilized).
  
  - name: Road Tax Exemption
    type: tax_exemption
    amount: 320
    description: Electric vehicles exempt from German road tax until 2030
    valid_until: "2030-12-31"
  
  - name: V2G Grid Services Incentive
    type: grant
    amount: 150
    description: Participation in V2G programs can earn €100-200 annually
    notes: >
      New for 2026 - BYD Seal with V2G capability can participate in grid 
      stabilization programs earning additional income. Available through 
      select energy providers.

# Company car taxation
company_car:
  taxable_benefit_calculation: gross_list_price_x_0.25_percent
  monthly_taxable_benefit_eur: 121.23  # €48,490 × 0.25%
  annual_taxable_benefit_eur: 1455  # €121.23 × 12
  comparable_ice_benefit_eur: 6300  # BMW 330i €52,500 × 1% = €525/mo (2026 pricing)
  annual_tax_savings_eur: 4845  # Savings vs equivalent ICE sedan
  notes: >
    The BYD Seal qualifies for the advantageous 0.25% company car tax rate 
    (vehicles under €70,000 with minimum 80km electric range). This results 
    in annual taxable benefit of only €1,455 compared to €6,300 for 
    equivalent combustion sedan (BMW 330i), saving company car drivers 
    approximately €4,845 annually in reduced tax payments.

