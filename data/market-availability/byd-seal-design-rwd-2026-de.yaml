# Market positioning
market_positioning:
  segment: premium_midsize_sedan
  target_audience: Company car drivers, tech-savvy professionals, Tesla alternative seekers, V2G early adopters
  key_selling_points:
    - Excellent value proposition (€48,490 for 590km range)
    - Class-leading 0.219 drag coefficient
    - Unique rotating 15.6" touchscreen with DiLink 5.0
    - LFP Blade Battery (safer chemistry, 100% charge capability)
    - Strong warranty (6yr vehicle, 8yr battery)
    - V2L, V2H, and V2G capability (new for 2026)
    - Enhanced Level 2+ driver assistance with lane change assist
    - Traffic light recognition (new for 2026)
    - 5G connectivity (upgraded from 4G)
    - HEPA air filtration (upgraded for 2026)
    - Improved efficiency (590km WLTP vs 580km in 2025)
    - 4K surround view cameras
  
  considerations:
    - BYD brand still building recognition in Europe
    - V2H/V2G requires additional hardware investment
    - Smaller dealer network than established brands
    - No frunk storage

# Notes
notes: >
  2026 BYD Seal Design RWD offers exceptional value in premium sedan segment 
  with €48,490 starting price for 590km range. Significantly enhanced for 2026 
  with V2H/V2G capability, 5G connectivity, enhanced Level 2+ driver assistance 
  with supervised lane change assist, traffic light recognition, 4K cameras, 
  HEPA filtration, and improved efficiency.
  
  Main competitor to Tesla Model 3 RWD but with more luxury features and 
  advanced technology. Company car tax benefit (0.25% rate) saves drivers 
  approximately €4,845 annually, making it extremely attractive for German 
  company car market.
  
  LFP Blade Battery chemistry allows worry-free 100% charging without 
  degradation concerns. V2L capability (3.3kW) enables use as mobile power 
  source. New V2H and V2G capability allows home backup and grid services, 
  potentially earning €150/year through V2G programs. Class-leading 
  aerodynamics (0.219 Cd) contributes to excellent range and efficiency.
  
  BYD's expanding dealer network (52 locations in Germany, up from 45) and 
  strong 6-year warranty provide confidence. Residual values continue improving 
  as brand establishes European presence (62% after 3 years). Total cost of 
  ownership significantly lower than comparable combustion sedans (€10,685 
  savings over 3 years vs BMW 330i).
  
  2026 updates make it a technology leader with 5G connectivity, enhanced 
  Level 2+ driver assistance approaching Level 3 capabilities (supervised 
  lane changes), and bidirectional charging for future-proof energy management. 
  Recommended for company car drivers, families, and anyone seeking cutting-edge 
  EV technology at competitive price.

