# Notes
notes: |
  BMW i4 xDrive40 launched January 2024 alongside eDrive40 and M50 refresh.

  Key Germany-specific considerations:
  - Winter tire requirement (October-April) adds ~€1,200 for proper winter wheels/tires
  - Autobahn unlimited speed capability (electronically limited to 190 km/h)
  - 0.25% company car tax is primary sales driver (vs 1% for ICE)
  - Strong BMW brand preference in southern Germany (Bavaria especially)

  German EV incentive (Umweltbonus) phases out during 2024:
  - Until June 2024: €4,500 for BEVs under €65k
  - July-December 2024: €3,000 for BEVs under €45k (xDrive40 excluded)
  - 2025+: No federal incentive

  Advice for buyers:
  - If primarily highway driving → consider eDrive40 (better efficiency, €5k savings)
  - If winter mountain driving → xDrive40 justified for safety
  - If want performance → step up to M50 (only €12.9k more, huge power increase)
  - If budget-focused → eDrive40 adequate for 95% of driving scenarios

