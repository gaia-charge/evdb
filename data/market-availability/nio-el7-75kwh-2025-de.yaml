notes: The NIO EL7 75 kWh at €59,900 (or €47,900 + €169/month BaaS) is a premium mid-size  SUV with exceptional performance (3.9s 0-100). Battery-as-a-Service (BaaS) lowers  entry price and enables battery upgrades. NIO Power Swap enables ~5 min battery  exchanges. Competes with BMW iX xDrive40, Mercedes EQE SUV, and Audi Q8 e-tron.  Qualifies for 0.25% company car tax rate.
