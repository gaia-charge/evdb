notes: >
  The all-new 2024 Mini Cooper Electric E represents Mini's third generation of EVs and
  first on a dedicated platform. At €36,900 base price, it's positioned as a premium
  compact urban EV competing with Fiat 500e and Honda e.
  
  Key advantages:
  - 402km WLTP range is class-leading for compact segment
  - 95kW DC fast charging (10-80% in 30 minutes) is adequate
  - 160kW (218hp) provides spirited performance with classic Mini handling
  - Extensive customization options appeal to brand enthusiasts
  - 8-year battery warranty matches industry leaders
  
  German market specifics:
  - No federal EV subsidy (BAFA Umweltbonus ended December 2023)
  - Company car tax benefit: 0.25% monthly (saves €3,300/year vs ICE)
  - Road tax exemption until 2030
  - THG-Quote generates ~€300/year passive income
  
  10-week delivery time is competitive. Made in Oxford, UK with zero import duties post-Brexit
  trade agreement. Mini Charging network provides access to 500,000+ charging points.
  
  Strong brand loyalty means Mini owners often buy another Mini. The EV version maintains
  the fun-to-drive character while adding zero emissions and lower running costs.

