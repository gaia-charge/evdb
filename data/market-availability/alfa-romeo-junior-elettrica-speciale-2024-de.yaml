notes: >
  The Alfa Romeo Junior Elettrica Speciale represents excellent value in the German
  electric compact SUV segment. At €39,990 (€35,490 after federal incentive), it
  undercuts premium German competition by €15,000-20,000 while delivering comparable
  range (410km WLTP), comprehensive standard equipment, and distinctive Italian design.
  The 0.25% company car tax rate makes it particularly attractive for fleet buyers.
  Most buyers opt for the "Speciale Plus" configuration (€42,590) adding panoramic
  roof, premium audio, and advanced driver assistance. Real-world range of 340km
  mixed driving is adequate for most German use cases (average daily commute 30-50km).
