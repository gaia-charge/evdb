notes: The GLC Electric is one of Mercedes' most important EV launches. The ICE GLC is their best-selling SUV globally, and this electric successor targets the heart of the premium SUV market. Expected Q4 2026 in Germany. At ~€72,900, it sits just above the €70,000 company car threshold. Built on EA-M platform (not MMA like CLA), offering 800V, 330 kW DC charging, AIRMATIC air suspension, and 2,400 kg towing. Strong competitor to BMW iX3, Audi Q6, and Volvo EX90.
