notes: |
  The Citroën ë-C4 positions itself as the comfort champion in the C-segment electric crossover market.
  While range (357km) and charging speed (100kW) are modest compared to newer competitors, the ë-C4's
  signature Advanced Comfort Seats and Progressive Hydraulic Cushions suspension deliver exceptional
  ride quality that justifies its positioning for buyers prioritizing comfort over specifications.

  Best value proposition: Company car drivers benefit from 0.25% tax rate (saves €3,600/year vs ICE),
  making the total cost of ownership very competitive despite the €39,990 base price.

  Recommendation: Add heat pump option (€890) for winter driving, essential for maintaining range in
  cold weather. The Premium Pack (€2,990) offers good value for buyers wanting full equipment.
