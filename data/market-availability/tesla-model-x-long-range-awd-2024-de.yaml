notes: |
  Tesla Model X Long Range AWD is Tesla's flagship luxury SUV offering distinctive
  Falcon Wing rear doors, 7-seat configuration, and access to the extensive Tesla
  Supercharger network. Built in Fremont, California.

  At €100k+, Model X competes in the luxury SUV segment against BMW iX, Mercedes EQS SUV,
  and Audi e-tron. While expensive, it offers unique features (Falcon Wing doors, 17\"
  landscape screen, 22-speaker audio) and the best charging network in Europe.

  Direct-to-consumer sales model via tesla.com (no dealerships). 25 Tesla Service Centers
  across Germany provide maintenance and repairs. Over-the-air software updates add new
  features regularly.

  8-year/240,000 km battery and drive unit warranty. 4-year/80,000 km basic vehicle warranty.

