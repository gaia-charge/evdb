# German Market Incentives (2024)
incentives:
- name: "BAFA Umweltbonus (Federal EV Subsidy)"
  amount: 0
  type: grant
  description: "Federal EV incentive ended December 17, 2023. Model X was never eligible (exceeded €65k price cap)."
  valid_from: "2023-01-01"
  valid_until: "2023-12-17"
  source_url: https://www.bafa.de/umweltbonus

- name: "Company Car Tax Benefit"
  amount: 0
  type: tax_exemption
  description: >
    Electric company cars over €70,000 taxed at 0.5% of gross list price per month
    (vs. 1% for ICE vehicles). Model X qualifies for 0.5% rate.
    Monthly taxable benefit: €99,990 × 0.5% = €499.95/month = €5,999/year
    Still saves ~€4,000/year in taxes vs. comparable ICE luxury SUV.
  formula: "Gross list price × 0.5% × 12 months"
  tax_rate: "0.5%"
  monthly_benefit: 499.95
  annual_benefit: 5999

- name: "Kfz-Steuer (Vehicle Tax) Exemption"
  amount: 0
  type: tax_exemption
  description: "Zero vehicle tax until December 31, 2030"
  valid_until: "2030-12-31"
  annual_savings: 400    # Typical ICE SUV tax
- name: "THG-Quote (Greenhouse Gas Quota)"
  amount: 350
  type: subsidy
  description: >
    Sell your CO2 savings certificate annually. Typical payout: €350-450/year for larger battery.
    Register via platforms like eQuota, Geld für eAuto, etc.
  recurrence: annual

