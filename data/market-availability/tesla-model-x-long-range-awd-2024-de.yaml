# Market Positioning
market_positioning:
  segment: "Luxury Electric SUV"
  target_buyers:
  - "Large families needing 7 seats with premium features"
  - "Tech enthusiasts wanting cutting-edge EV technology"
  - "Company car drivers (0.5% tax rate acceptable for luxury)"
  - "Tesla brand loyalists upgrading from Model S/X"
  - "Falcon Wing door fans (unique design element)"
  - "Long-distance travelers needing Supercharger access"
  key_strengths:
  - "Falcon Wing rear doors (unique to Model X)"
  - "530+ km real-world range adequate for long trips"
  - "250kW Supercharger network most reliable in Europe"
  - "7-seat configuration standard (6-seat optional)"
  - "Best-in-class infotainment (17\" landscape screen)"
  - "Premium audio system (22 speakers)"
  - "Over-the-air updates add features regularly"
  - "8-year/240,000 km battery warranty"
  - "Strong resale value (~70% after 3 years)"
  key_weaknesses:
