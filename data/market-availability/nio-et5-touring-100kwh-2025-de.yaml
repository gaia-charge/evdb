# Pricing (Germany, 2025 model year)
pricing:
  base_price: 59900
  price_including_vat: 59900
  vat_rate_percent: 19
  on_road_price: 61050
  destination_charge: 950
  registration_fee: 200

# BaaS pricing
baas_pricing:
  purchase_price_without_battery: 38900
  battery_subscription_monthly_100kwh: 289
  notes: >
    BaaS purchase price same as 75 kWh variant (€38,900). The 100 kWh battery
    subscription is €289/month. BaaS customers can swap between battery sizes
    at NIO Power Swap stations.

