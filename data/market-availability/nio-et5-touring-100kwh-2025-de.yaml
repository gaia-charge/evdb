notes: >
  NIO ET5 Touring 100 kWh at €59,900 (or €38,900 + €289/month BaaS) offers
  580 km WLTP range in a premium wagon package. The 100 kWh battery makes it
  viable for long-distance touring with real-world range of approximately
  490 km. Battery swap capability means a full charge equivalent in just
  5 minutes at Power Swap stations.

