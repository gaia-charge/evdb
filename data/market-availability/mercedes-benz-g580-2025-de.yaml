notes: |
  The 2025 Mercedes-Benz G 580 with EQ Technology starts at €142,619 in Germany.

  **Company Car Tax Benefit (2025):**
  - 0.25% monthly: €142,619 × 0.25% = €357/month
  - ICE equivalent 1%: €142,619 × 1% = €1,426/month
  - **Annual savings: €12,833** (€38,499 over 3-year lease)
  - This makes the electric G-Class very attractive as a company car

  **Key Market Facts:**
  - Edition One (€192,619) sold out immediately
  - 20-week delivery time due to high demand
  - Strong demand from company car buyers due to tax benefits
  - Mercedes-Benz expects G 580 to account for ~30% of G-Class sales

  The electric G-Class is one of the most anticipated EVs of 2024-2025.
  Despite the high price and poor efficiency, the unique G-TURN feature
  and iconic design have driven strong demand.

