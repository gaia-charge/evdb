# Tesla Model 3 RWD - France Market (2025)
id: tesla-model-3-rwd-2025-fr
variant_id: tesla-model-3-rwd-2025
market: FR
currency: EUR
availability_status: available
available_from: "2024-01-15"

pricing:
  base_price: 42990
  price_including_vat: 42990
  vat_rate_percent: 20
  destination_charge: 1100
  total_price_estimate: 44090

incentives:
  - name: "Bonus écologique"
    type: grant
    amount: 4000
    description: >
      Government ecological bonus for BEV purchases. Amount depends on
      vehicle price and buyer income. Standard bonus €4,000 for vehicles
      under €47,000.
    conditions:
      - Battery electric vehicle
      - Vehicle price under €47,000
      - Environmental score requirement (produced in Europe or equivalent)
    valid_from: "2025-01-01"
    valid_until: "2025-12-31"
    notes: >
      Tesla Model 3 Highland (made in China) may not qualify for full bonus
      due to environmental score. Check government website for current eligibility.

  - name: "Prime à la conversion"
    type: grant
    amount: 1500
    description: >
      Additional bonus when scrapping an old vehicle (Crit'Air 3 or worse).
      Up to €1,500 for standard income households.
    conditions:
      - Scrapping eligible old vehicle
      - Income-dependent amount

market_specific:
  standard_equipment:
    - Autopilot (Traffic-Aware Cruise Control, Autosteer)
    - Heat pump climate control
    - 15.4" center touchscreen
    - 8.0" rear display
    - Glass roof
    - Heated front seats
    - Ventilated front seats
    - Wireless charging pad
    - LED headlights
    - Sentry Mode and Dashcam

  available_colors:
