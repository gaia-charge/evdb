  notes: >
    Genesis Electrified G80 typically available within 10-14 weeks from order to delivery.
    Factory in Ulsan, South Korea ships to European distribution center in Bremerhaven
    (8-10 weeks transit + customs). Custom orders add 2-4 weeks for production slot.
    Genesis dealer network: 45 locations in Germany with dedicated Studio showrooms.

competitors:
- model: Mercedes-Benz EQE 350+
  price: 79400
  battery_kwh: 90.6
  power_kw: 215
  range_wltp_km: 590
  acceleration_0_100_s: 6.4
  comparison: >
    Mercedes EQE 350+ priced €4,600 less (€79,400 vs €84,000) with impressive 70km
    more range (590km vs 520km WLTP). However, Electrified G80 delivers superior
    performance (272 kW/370 hp vs 215 kW/292 hp, 4.9s vs 6.4s 0-100) and more
    traditional executive sedan proportions with spacious rear legroom. EQE offers
    400V architecture with 170 kW charging (32 min 10-80%, similar to G80's 34 min).
    G80 provides more luxurious standard equipment (Lexicon 21-speaker vs 6-speaker,
    multi-chamber air suspension standard vs optional €2,400). Both qualify for 0.5%
    company car tax rate. G80 targets buyers valuing traditional executive sedan
    presence and superior performance, EQE appeals to Mercedes brand loyalists
    prioritizing range and MBUX technology.

- model: BMW i5 eDrive40
  price: 72000
  battery_kwh: 81.2
  power_kw: 250
  range_wltp_km: 582
  acceleration_0_100_s: 5.7
  comparison: >
    BMW i5 eDrive40 positioned €12,000 cheaper (€72,000 vs €84,000) with excellent
    value and 62km more range (582km vs 520km WLTP). i5 RWD configuration delivers
    respectable 250 kW (340 hp), though G80 AWD offers 22 kW more power and all-weather
    capability. i5 benefits from 400V with 205 kW charging (30 min 10-80%, faster than
    G80's 34 min). G80 provides more luxurious interior (Lexicon 21-speaker vs optional
    audio upgrade, multi-chamber air suspension standard vs extra €2,700). Both qualify
    for 0.5% company car tax (i5 under €70k would be 0.25% if optioned conservatively).
    i5 excellent choice for buyers prioritizing BMW driving dynamics and efficiency,
    G80 suits those seeking traditional executive sedan luxury with Genesis's distinctive
    Korean design.

- model: Audi A6 e-tron (2026)
  price: 77000
  battery_kwh: 94.9
  power_kw: 270
  range_wltp_km: 720
  acceleration_0_100_s: 5.4
  comparison: >
    Audi A6 e-tron (arriving 2026) positioned €7,000 less (€77,000 estimated vs €84,000)
    with revolutionary 200km more range (720km vs 520km WLTP) thanks to PPE platform
    and exceptional aerodynamics (Cd 0.21). A6 e-tron features 800V architecture with
    270 kW charging (10-80% in 21 minutes, significantly faster than G80's 34 min).
    Similar performance (270 kW both, 5.4s vs 4.9s 0-100). When A6 e-tron arrives,
    it will challenge G80 with superior technology, but G80 currently available with
    immediate delivery. G80 offers more traditional executive sedan presence and proven
    reliability, A6 e-tron represents next-generation EV technology.

- model: Tesla Model S Dual Motor
  price: 99990
  battery_kwh: 100.0
  power_kw: 493
  range_wltp_km: 634
  acceleration_0_100_s: 3.2
  comparison: >
    Tesla Model S Dual Motor positioned €15,990 more expensive (€99,990 vs €84,000)
    with extraordinary 114km more range (634km vs 520km WLTP) and supercar acceleration
    (3.2s vs 4.9s 0-100). Model S features yoke steering wheel, massive 17" horizontal
    touchscreen, and access to extensive Supercharger network. However, G80 delivers
    traditional executive sedan luxury (physical buttons, Nappa leather quilted seats,
    Lexicon audio) versus Model S's minimalist tech-focused interior. G80 significantly
    better value at €84k, Model S targets buyers seeking maximum performance and range.
    Both qualify for 0.5% company car tax (over €70k threshold).

- model: Polestar 2 Long Range Dual Motor
  price: 54900
  battery_kwh: 78.0
  power_kw: 310
  range_wltp_km: 480
  acceleration_0_100_s: 4.5
  comparison: >
    Polestar 2 LR Dual Motor positioned €29,100 cheaper (€54,900 vs €84,000) with
    impressive performance (310 kW, 4.5s 0-100, 0.4s faster than G80) and respectable
    480km WLTP range (40km less than G80). However, G80 positioned in E-segment
    executive sedan class with significantly more luxurious interior (Nappa leather
    quilted seats vs vegan WeaveTech, Lexicon 21-speaker vs Harman Kardon 13-speaker,
    multi-chamber air suspension vs monotube dampers), larger dimensions (4995mm vs
    4606mm), and traditional executive sedan presence. Polestar 2 qualifies for 0.25%
    company car tax (under €70k), while G80 subject to 0.5% rate. Polestar 2 excellent
    choice for performance-focused buyers on budget, G80 suits traditional executive
    buyers seeking flagship luxury sedan with electric powertrain.

market_analysis:
  segment: Executive Electric Sedan (E-segment)
  positioning: >
    Genesis Electrified G80 positioned as Genesis' flagship electric sedan competing
    against Mercedes EQE and BMW i5 in executive E-segment. Differentiated by traditional
    executive sedan proportions, luxurious standard equipment, and Genesis's distinctive
    Korean design language. Represents transition of Genesis's core G80 combustion sedan
    to electric mobility while maintaining the craftsmanship and luxury that defines
    the brand. Priced competitively at €84,000 versus €79-90k German rivals.

  target_demographics:
  - C-suite executives seeking electric flagship sedan
  - Company car drivers prioritizing executive presence
  - Genesis brand loyalists wanting electric alternative
  - Buyers seeking alternative to German executive sedans
  - Chauffeur-driven buyers prioritizing rear passenger comfort
  - Business professionals with long-distance travel needs

  strengths:
  - Traditional executive sedan proportions with spacious rear legroom (1010mm)
  - Luxurious Nappa leather interior with comprehensive standard equipment
  - Lexicon 21-speaker premium audio system
  - Multi-chamber air suspension delivers executive ride quality
  - Face Connect biometric authentication
  - Competitive pricing vs German rivals (€84k vs €79-90k)
  - Strong company car proposition (0.5% tax rate)
  - 5-year/100,000km warranty with 8-year/160,000km battery coverage
  - Vehicle-to-Load capability (3.6 kW)
  - Respectable 520 km WLTP range suitable for business travel

  weaknesses:
  - Limited Genesis dealer network in Germany (45 locations)
  - Genesis brand less recognized vs Mercedes/BMW/Audi
  - 400V architecture slower charging than 800V rivals
  - Adapted combustion platform less efficient than dedicated EV architecture
  - Resale value uncertainty for relatively new brand
  - Subject to 0.5% company car tax rate (vehicles over €70k)

  recommendations:
  - Excellent choice for traditional executive buyers seeking electric alternative
  - Strong company car proposition with €7,560/year tax savings
  - Ideal for chauffeur-driven use with spacious rear passenger comfort
  - Consider Mercedes EQE if prioritizing range (70km more) and brand recognition
  - Consider BMW i5 if prioritizing driving dynamics and dealer network
  - Popular Premium Executive configuration (€91,150) adds 20" wheels and packages
  - Test drive comparing to EQE and i5 recommended

notes: >
  Genesis Electrified G80 represents Genesis's flagship electric sedan, adapting the
  combustion G80 with dual-motor electric powertrain while maintaining traditional
  executive sedan proportions and luxury. 400V architecture with 175 kW DC charging
  delivers 10-80% in 34 minutes, adequate for executive sedan use though slower than
  800V rivals. Spacious rear legroom (1010mm) and multi-chamber air suspension create
  exceptional rear passenger comfort for chauffeur-driven buyers. Lexicon 21-speaker
  premium audio system (surpassing Bang & Olufsen) delivers concert hall acoustics.
  Face Connect facial recognition personalizes settings upon driver entry. Battery
  preconditioning when navigating to charger ensures optimal charging speeds. Real-world
  highway consumption ~24 kWh/100km at 130 km/h allows ~360km between charging stops.
  Winter range drops ~20% to 350km. Most buyers opt for Premium Executive configuration
  (€91,150) adding 20-inch wheels and luxury packages. Strong company car choice
  qualifying for 0.5% monthly tax rate (vehicles over €70k), saving €7,560/year vs
  combustion equivalent. Genesis dealer network expanding (45 locations, targeting 60
  by 2025) with dedicated Studio boutique showrooms. 5-year/100,000km warranty and
  8-year/160,000km battery coverage among best in segment. Resale values uncertain
  given Genesis's limited European track record. Overall, Electrified G80 delivers
  compelling proposition for traditional executive buyers seeking electric flagship
  sedan with Genesis's distinctive Korean luxury and comprehensive standard equipment.

