  fast_charging_recommendations: >
    Electrified G80 features 400V architecture with 175 kW peak DC charging (10-80%
    in 34 minutes). While not as fast as 800V rivals (GV60: 18 min, EQE: 32 min),
    charging speed adequate for executive sedan use with business travel patterns.
    Battery preconditioning when navigating to charger ensures optimal charging speeds.
    EnBW Mobility+ (€5.99/month, €0.55/kWh) provides excellent value across 300,000+
    European charging points. Real-world highway consumption ~24 kWh/100km at 130 km/h
    allows ~360km between charging stops. Winter range reduces to ~350km total.

