notes: The Zeekr X Privilege AWD is the performance flagship of the X range in Germany. At €49,990 it offers 422hp dual-motor AWD with 3.8s 0-100 km/h — exceptional performance for the price. Comes with premium Nappa leather, 20-inch wheels, heated/ventilated seats as standard. Competes with much more expensive performance EVs while offering comprehensive standard equipment.
