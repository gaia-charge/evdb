  pricing_notes: |
    Base price includes:
    - Performance Battery Plus (larger 93.4kWh usable battery)
    - 21" Taycan Turbo wheels (standard on Turbo)
    - Extended leather interior
    - 3-zone climate control with heat pump
    - Porsche Communication Management (PCM) 6.0
    - 16.8" curved touchscreen + 12.6" digital instrument cluster
    - BOSE Surround Sound (14 speakers)
    - Porsche InnoDrive (adaptive cruise with range optimization)
    - LED-Matrix headlights with PDLS Plus
    - Porsche Active Suspension Management (PASM) with air suspension
    - Sport Chrono Package (standard on Turbo)
    - Porsche Torque Vectoring Plus (PTV Plus) - standard on Turbo
    - Porsche Ceramic Composite Brake (PCCB) - standard on Turbo
    - Connected services for 3 years

    German pricing includes 19% VAT (MwSt). Porsche uses transparent pricing 
    with detailed configurator online. Build-to-order model allows extensive 
    customization.

