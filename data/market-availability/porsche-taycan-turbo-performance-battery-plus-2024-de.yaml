available_incentives:
- name: BAFA Umweltbonus (Federal EV subsidy)
  amount: 0
  type: rebate
  eligibility: Not available (ended December 2023, price exceeds threshold)
  valid_until: '2023-12-31'
- name: Company Car Tax (Dienstwagen-Besteuerung)
  amount: 14400
  type: tax_credit
  eligibility: 0.25% monthly taxation on list price (vs 1% for ICE)
  description: |
    Example: €150,000 Taycan Turbo (with options)
    - Electric: €150k × 0.25% × 12 = €4,500/year taxable benefit
    - ICE equivalent: €150k × 1% × 12 = €18,000/year taxable benefit
    - Tax savings: ~€14,400/year (assuming ~40% marginal tax rate)
  valid_until: '2030-12-31'
- name: Kfz-Steuer (Vehicle Tax) Exemption
  amount: 400
  type: tax_exemption
  eligibility: All BEVs
  valid_until: '2030-12-31'
- name: THG-Quote
  amount: 300
  type: rebate
  eligibility: All BEV owners
  description: Annual payment for CO2 savings certificate

