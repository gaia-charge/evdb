notes: |
  Entry-level Hyundai Kona Electric variant with 48.6 kWh battery delivering 377km WLTP range (310km real-world).
  €4,000 cheaper than Long Range sibling (€38,990 vs €42,990) while maintaining same powertrain (115kW/156hp FWD).
  Built on E-GMP platform with 400V architecture, 102kW DC fast charging (10-80% in 31 minutes).
  Standard heat pump improves winter efficiency by ~15%, reducing winter range loss to 245km.
  Comprehensive standard equipment includes dual 12.3" panoramic displays, Highway Driving Assist 2, heated seats/steering wheel, V2L capability (3.6kW).
  0.25% company car tax rate saves €3,509/year vs ICE equivalent Kona 1.6T.
  TCO analysis shows €7,770 savings over 3 years vs ICE equivalent (€0.41/km vs €0.59/km).
  Competes with VW ID.3 Pure (€39,995, 11km more range), MG4 Standard Range (€29,990, €9k cheaper but less refined), Nissan Leaf 40kWh (€34,990, CHAdeMO charging).
  Target buyers: first-time EV buyers, urban families, company car drivers, budget-conscious buyers who don't need Long Range's 514km.
  Best for daily commuting under 80km round trip, urban/suburban driving with home charging.
  Not recommended for frequent long-distance travelers, rural buyers without home charging, or maximum range seekers.
  8-year/160,000km battery warranty standard, Hyundai's extensive dealer network (650+ in Germany).
  Delivery time 12 weeks, good availability by order.

