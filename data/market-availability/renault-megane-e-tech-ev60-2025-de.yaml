# Notes
notes: |
  Renault Megane E-Tech EV60 Techno is the best-selling variant, offering excellent 
  value with 450 km WLTP range (380 km real-world) and comprehensive equipment. 
  Winner of 2023 European Car of the Year. The 160 kW motor provides spirited performance 
  (7.4s 0-100 km/h), while the 22 kW AC onboard charger enables convenient overnight 
  charging. Standard 360-degree camera, adaptive cruise control, and hands-free parking 
  make it a technological standout in its class. V2G capability available for bidirectional 
  charging in select markets. Delivery times slightly longer than EV40 due to high demand.

