market_positioning:
  competitors:
  - Mini Cooper Electric E (€36,900 - same powertrain, 3-door hatchback)
  - Fiat 600e (€38,490 - similar size crossover)
  - Opel Mokka Electric (€38,475 - practical crossover)
  - Peugeot e-2008 (€39,350 - similar segment)
  target_audience: Urban drivers wanting more practicality than Cooper Electric without stepping up to Countryman
  unique_selling_points:
  - Five-door crossover with 300L boot (vs 211L Cooper Electric)
  - Same fun-to-drive Mini character
  - Competitive pricing in B-segment crossover market
  - Circular OLED display and premium Mini interior

notes: >
  The Aceman E at €37,500 offers a compelling middle ground between the Cooper Electric
  and Countryman. Same 54.2kWh battery and 160kW motor as the Cooper Electric E, but
  with five doors and significantly more cargo space (300L vs 211L). Produced in China
  which may be a consideration for some buyers, but quality and warranty are standard
  BMW Group levels.

