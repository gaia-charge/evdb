notes: >
  The Mercedes-Benz EQE 350+ is positioned as a premium luxury electric sedan  competing with Tesla Model S, BMW i4, and Porsche Taycan. At €72,900, it sits  in the upper mid-range of the luxury EV market.

  Key competitive factors:
  - Excellent 639km WLTP range (best-in-class efficiency)
  - Best-in-class aerodynamics (Cd 0.22)
  - Optional Level 3 DRIVE PILOT autonomy (Germany only, world first)
  - Luxurious Mercedes-Benz interior with optional MBUX Hyperscreen
  - Made in Germany (Bremen plant)
  - 10-year/250,000km battery warranty

  Tax disadvantage: The €72,900 list price exceeds the €70,000 threshold for  the favorable 0.25% company car tax rate, resulting in the standard 1% rate.  This makes it less attractive than the BMW i4 eDrive40 (€56,900) for company  car buyers. However, the EQE offers significantly more range, luxury, and  advanced features.

  Popular configuration: EQE 350+ with Premium Package, MBUX Hyperscreen, and  AMG Line Exterior comes to approximately €93,000, providing a comprehensive  luxury EV experience.

