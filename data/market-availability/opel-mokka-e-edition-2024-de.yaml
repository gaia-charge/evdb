sales_notes: |
  Opel Mokka (all versions) is a popular compact SUV in Germany.
  Mokka-e accounts for ~25% of total Mokka sales (2024 estimate).
  Edition trim is popular entry point for electric crossover buyers.

notes: |
  The Opel Mokka-e Edition at €36,990 offers excellent electric SUV value:

  **Key Advantages:**
  - Lowest-priced Mokka-e trim (€3,000 less than Ultimate)
  - Same battery, motor, range as all Mokka-e variants
  - 16" wheels improve efficiency slightly (340km WLTP)
  - SUV styling with raised driving position
  - 350L trunk (competitive for compact SUV)
  - 1,200kg towing capacity (modest but useful)
  - Company car tax benefit: 0.25% = €92/month (saves €3,328/year vs ICE)
  - Strong Opel dealer network (850+ locations)
  - Fast 8-week delivery from Zaragoza, Spain
  - Mechanically identical to Peugeot e-2008 Allure (€3,000 cheaper)

  **vs Mokka-e Ultimate:**
  - €3,000 cheaper (€36,990 vs €39,990)
  - Halogen headlights vs LED (upgrade available)
  - Manual climate vs automatic (upgrade available)
  - 7.0" touchscreen vs 10.0" (upgrade available)
  - 16" steel wheels vs 18" alloys (upgrade available)
  - Same battery, motor, charging, performance

  **vs Peugeot e-2008 Allure:**
  - €3,000 cheaper (€36,990 vs €39,990)
  - Same CMP platform, battery, motor, performance
  - More conservative design vs sportier e-2008
  - Simpler interior with more physical buttons
  - Built at same Zaragoza plant

  **Best for:**
  - Entry-level electric SUV buyers on a budget
  - Company car drivers minimizing benefit-in-kind tax
  - Families needing SUV practicality and styling
  - German brand loyalty at affordable price
  - Base trim with option to upgrade features à la carte

  **Considerations:**
  - Modest 340km WLTP range (adequate for city/commute, less for long trips)
  - 100kW DC charging adequate but slower than some competitors
  - Base trim has fewer standard features (upgradable)
  - 4-star Euro NCAP (vs 5-star for newer competitors)

  **Upgrade Path:**
  For €37,980 base + typical upgrades:
  - LED headlights: +€790
  - Automatic climate: +€490
  - 16" alloys: +€690
  - Total: ~€39,950 (similar to Ultimate with more flexibility)

