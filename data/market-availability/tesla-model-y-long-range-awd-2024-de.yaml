  Tesla Model Y Long Range AWD built in Berlin offers the fastest
  delivery times in Europe (2-4 weeks). Made in Germany qualification.
  
  2024 "Juniper" refresh includes:
  - Ventilated front seats
  - Ambient lighting
  - Improved suspension
  - Better soundproofing
  - Refreshed exterior design
  - ~5% efficiency improvement
  
  Order online at tesla.com/de/modely
  Test drives available at Tesla Stores in major German cities.
  
  Residual values remain strong (typically 60-70% after 3 years).

