# Incentives & Tax Benefits (Germany 2024)
incentives:
  - name: BAFA Umweltbonus
    type: rebate
    amount: 0
    description: |
      German EV subsidy ended December 17, 2023.
      Previously provided €4,500 for vehicles under €65,000.
    valid_until: "2023-12-17"
    
  - name: Company Car Tax Benefit
    type: tax_credit
    amount: 0
    description: |
      Electric company cars taxed at 0.25% of gross list price per month
      (vs 1.0% for combustion vehicles).
      Applies if vehicle costs under €70,000 gross.
      Model Y Long Range qualifies.
    
  - name: Kfz-Steuer Exemption
    type: tax_exemption
    amount: 0
    description: |
      Battery electric vehicles exempt from vehicle tax until 2030.
      Worth ~€150-250/year for comparable ICE vehicle.
    valid_until: "2030-12-31"
    
  - name: THG-Quote (Greenhouse Gas Quota)
    type: subsidy
    amount: 300
    description: |
      Sell your vehicle's CO2 savings to fuel companies.
      Annual payment of €250-400 per year (varies by provider).
      Multiple providers: Elektrovorteil, ADAC, etc.

