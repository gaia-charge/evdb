notes: |
  ⭐ 2025 MODEL YEAR - IMPROVED RANGE AND EFFICIENCY

  Key improvements over 2024:
  - Range: 475 km WLTP (up from 455 km, +4.4% improvement)
  - Efficiency: 15.6 kWh/100km (down from 16.1 kWh/100km, +3.1% improvement)
  - DC charging: 175 kW peak (up from 170 kW)
  - Real-world range: 415 km mixed (up from 400 km)
  - 12V battery: Li-ion standard (better reliability vs lead-acid)

  Why RWD remains the volume seller:
  1. €44,990 price point (maintained from 2024)
  2. Under €70k threshold for 0.25% company car tax rate
  3. 475 km WLTP range now more competitive
  4. LFP battery: 100% charging OK, longer lifespan
  5. Fast delivery: 2 weeks (Gigafactory Berlin)

  Built at Gigafactory Berlin-Brandenburg, Germany.
  Access to 180+ Supercharger locations in Germany (1,800+ stalls).
  27 Tesla Service Centers across Germany (expanded network).

