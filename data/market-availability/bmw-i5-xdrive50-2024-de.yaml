# Notes
notes: |
  The BMW i5 xDrive50 is BMW's premium AWD electric sedan variant, positioned between
  the efficient eDrive40 and the performance-focused M60. With 503 hp from dual
  synchronous motors, it delivers supercar-like 4.5s 0-100 km/h acceleration while
  maintaining respectable 516km WLTP range.
  
  Key advantages over eDrive40:
  - BMW xDrive intelligent AWD system (140kW front + 230kW rear motors)
  - Significantly more power (503 hp vs 340 hp, +163 hp / +48%)
  - Much faster acceleration (4.5s vs 6.0s, -1.5s / -25%)
  - Better traction in winter/wet conditions
  - Adaptive M suspension standard (€2,400 option on eDrive40)
  - 19" M wheels standard (€1,400 option on eDrive40)
  - Enhanced standard equipment
  
  Trade-offs:
  - 66km less WLTP range (516km vs 582km, -11%)
  - Higher consumption (17.9 vs 15.9 kWh/100km, +12.6%)
  - 100kg heavier (2,330kg vs 2,230kg)
  - €14,000 more expensive (€83,900 vs €69,900)
  - 0.5% company car tax rate vs 0.25% (price over €70k threshold)
  
  Company car positioning:
  Despite the higher 0.5% tax rate, the xDrive50 remains attractive for executives
  who need AWD capability. At €83,900, monthly tax is €420 vs €839 for ICE equivalent
  (annual savings €5,028). Most buyers configure with M Sport Package Pro, Technology
  Package Pro, and Executive Package, bringing total price to €95,000-110,000.
  
  Target buyers:
  - Winter region drivers (Alps, Scandinavia) requiring AWD safety
  - Performance-oriented executives who want sport sedan dynamics
  - Buyers who don't need M60's extreme performance/price (€118,000)
  - Company car drivers maximizing 0.5% tax benefit
  - Those prioritizing acceleration over maximum range
  
  Competition:
  - BMW i5 M60 xDrive (€118,000): +34hp, faster (3.8s), but €34k more expensive
  - Mercedes-AMG EQE 43 4MATIC (€89,900): 476hp, similar positioning, €6k more
  - Audi A6 e-tron quattro (€77,000, 2026): Platform rival, likely similar specs
  - Tesla Model S Dual Motor (€99,990): More range (634km), faster (3.2s), less premium interior
  
  Real-world performance:
  - Range: ~435km mixed driving, 350km highway (130 km/h), 300km winter
  - Charging: 10-80% in 30 minutes at 150kW+ DC stations
  - Acceleration: Validated 4.5s 0-100 km/h (BMW conservative, often faster in practice)
  - xDrive torque split: Rear-biased (typical 40:60 split, dynamic up to 0:100 or 100:0)
  
  Delivery time: 16 weeks (built-to-order at Dingolfing). Slightly longer than eDrive40
  due to dual-motor complexity. Popular configurations may have pre-allocated slots.
  
  Value proposition:
  The xDrive50 strikes an excellent balance between the efficient eDrive40 and extreme
  M60. For €14k more than eDrive40, you get 163 more horsepower, AWD capability, and
  sport sedan performance. Compared to M60, you save €34k while sacrificing only 98hp
  and 0.7s 0-100 time. Most buyers find xDrive50's 4.5s acceleration more than adequate.

