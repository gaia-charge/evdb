notes: The BYD Sealion 7 Excellence AWD is the flagship trim of the Sealion 7 lineup in NL. Features 390 kW (530 pk) dual-motor AWD, 91.3 kWh battery, 502 km WLTP range (615 km city). 0-100 km/h in 4.5 seconds, 215 km/h top speed, 230 kW DC fast charging (10-80% in 24 min). Premium features include Nappa leather interior, head-up display, 20" wheels, red brake calipers, Dynaudio audio system with 12 speakers, 360° camera, and comprehensive ADAS suite. Sits above Design AWD (€53,690) and Comfort RWD (€50,690) trims.
