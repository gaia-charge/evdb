# Notes
notes: |
  Renault Megane E-Tech EV40 is the entry-level variant, ideal for urban
  and suburban driving. With 300 km WLTP range and efficient 130 hp motor,
  it offers excellent value in the compact EV segment. Winner of 2023
  European Car of the Year. Standard equipment includes innovative OpenR
  cockpit with Google built-in, heat pump for all-season efficiency, and
  comprehensive safety features. Delivery times currently 12 weeks.
  Qualifies for German environmental bonus and 0.25% company car taxation
  (under €60,000 threshold). Manufactured in France at ElectriCity Douai plant.

