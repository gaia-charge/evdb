notes: |
  **Market Positioning in Germany:**
  
  The Renault Megane E-Tech EV40 at €38,490 (€39,480 on-the-road) is positioned as an 
  affordable C-segment electric crossover:
  
  **vs Direct Competitors:**
  - **VW ID.3 Pure (58 kWh, €39,995)**: Similar price, 50% more range (426km), less distinctive
  - **MG4 Standard Range (51 kWh, €31,990)**: €6,500 cheaper, more range (350km), less premium
  - **Cupra Born 58 kWh (€38,990)**: Similar price/range, sportier image
  - **Peugeot e-208 GT (51 kWh, €39,990)**: Same price, B-segment (smaller), similar range
  
  **Key Selling Points:**
  - 2023 European Car of the Year winner
  - Striking design with distinctive LED signature
  - OpenR Link with Google built-in (Android Automotive OS)
  - Best-in-class trunk space (440L)
  - Made in France (Douai ElectriCity hub)
  - Fast 6-week delivery
  - 300km range sufficient for daily commuting
  
  **Company Car Benefits:**
  With 0.25% monthly taxation (€96/month vs €385 for ICE equivalent), the Megane E-Tech EV40
  saves company car drivers €3,468/year. Over 3-year lease: €10,404 savings.
  
  **Target Buyer:**
  - Urban/suburban commuters with home charging
  - Budget-conscious EV buyers seeking premium design
  - Company car drivers maximizing tax benefits
  - Second car for households
  - Drivers covering <100km daily
  
  **Weaknesses:**
  - Limited range (300km) for highway travel
  - Slower DC charging (85kW) vs competition
  - 7.4kW AC charging slower than 11kW competitors
  - No OTA battery upgrades (hardware limited)
  
  **Upgrade Path:**
  - For €5,000 more: EV60 Techno with 450km range, 218 HP, 22kW AC, 130kW DC
  - Most buyers choose EV60 variants (85% of sales)
  
  **Best Use Case:**
  Perfect for urban drivers with predictable <80km daily commutes and regular home/work
  charging access. Not ideal for primary car if frequent long-distance travel is required.
