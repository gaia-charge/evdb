# Notes
notes: |
  The Renault Megane E-Tech EV40 is the entry-level variant designed for urban
  and suburban use. With 300 km WLTP range (270 km real-world), it's suitable
  for daily commuting and weekend trips. The smaller battery makes it lighter
  and more affordable. Germany no longer offers the Umweltbonus federal subsidy
  (ended December 2023), but company car tax benefits remain attractive at 0.25%.
  
  Delivery times are relatively short (12 weeks) compared to other EVs.
  The Megane E-Tech is produced at Renault's ElectriCity facility in Douai, France.
  
  Popular configuration includes the Comfort Package for heat pump and heated
  seats, essential for German winters. The Tech Package adds advanced driver
  assistance features.

