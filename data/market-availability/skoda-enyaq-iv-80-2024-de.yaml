  value_proposition: |
    Exceptional value in compact electric SUV segment:
    - €3,000-5,000 cheaper than VW ID.4/Audi Q4 with similar/better specs
    - Class-leading interior space (best rear legroom, 585L boot)
    - 10 years connectivity services included (VW charges extra)
    - Generous standard equipment
    - Simply Clever practical features (umbrella, ice scraper, etc.)
    - 2024 facelift: ChatGPT-powered Laura assistant (industry-first)
    - Strong residual values (Škoda reliability + VW Group engineering)
    - 850 dealers nationwide (excellent service network)

notes: |
  2024 facelift brings significantly improved software (ME3 vs ME2). 135kW DC charging upgraded from 125kW in 2023 models (+8%).
  Range improved from 558km to 570km WLTP in 2024. More physical buttons vs full-touch (customer feedback addressed).
  Laura AI assistant powered by ChatGPT (unique in segment). Typically €3,000-5,000 cheaper than equivalent VW ID.4 Pro.
  Best value in VW Group MEB platform family. Consistently Germany's 3rd-4th best-selling electric SUV (after Model Y, ID.4).
  10-year connectivity services included (vs VW's paid subscription). Company car tax benefit saves employees ~€3,670/year vs equivalent ICE.
  Built in Czech Republic with lower labor costs = better value. Shares 70% of parts with ID.4/Q4 = proven reliability + lower repair costs.
