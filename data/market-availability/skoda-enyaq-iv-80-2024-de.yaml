market_position:
  competitors:
    - vehicle: "Volkswagen ID.4 Pro"
      price: 46565
      advantage: "Enyaq: €2,425 cheaper, more space (585L vs 543L boot), more equipment"
    
    - vehicle: "Audi Q4 e-tron 50"
      price: 52900
      advantage: "Enyaq: €3,910 cheaper, similar specs, more practical interior"
    
    - vehicle: "Tesla Model Y Long Range"
      price: 52990
      advantage: "Enyaq: €4,000 cheaper, better build quality, more space inside"
    
    - vehicle: "Hyundai Ioniq 5 Long Range"
      price: 51450
