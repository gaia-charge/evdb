# Market Notes
notes: |
  Audi Q8 55 e-tron quattro 2024 available in Netherlands with 115 kWh battery pack standard.
  
  Starting from July 2024, all Q8 e-tron models in Netherlands come standard with the larger
  115 kWh battery (previously optional), providing up to 556 km range (Sportback) or 534 km
  (SUV) in WLTP cycle.
  
  Base price of €78,990 is for the Advanced edition, nearly identical to the previous Q8 50
  e-tron pricing, offering significantly more range for the same cost.
  
  Available as SUV and Sportback body styles. S edition starts at €82,990. Sportback versions
  add €4,000 to base price.

