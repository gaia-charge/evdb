notes: '- Entry-level EV3 variant offering excellent value at €38,990 - 410km WLTP range sufficient for daily urban/suburban use - €3,000 savings vs Long Range for buyers prioritizing price over range - Standard heat pump crucial for German winter efficiency - Competitive with Hyundai Kona Electric (€39,990), VW ID.3 Pure (€39,995) - Still includes V2L capability despite being base variant - Strong dealer network and 7-year warranty remain key selling points - Ideal for first-time EV buyers or second family car - Company car tax benefit (0.25%) makes it very attractive for fleet use'
