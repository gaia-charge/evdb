value_proposition: >
  Audi Q6 Sportback e-tron RWD delivers exceptional 641km WLTP range (540km real-world) in premium
  coupe SUV package. Built on advanced PPE platform with 800V architecture, it achieves 270kW peak
  DC charging enabling cross-country travel with 21-minute charging stops.
  
  At €68,900 base price (€64,400 after €4,500 federal incentive), it undercuts BMW iX xDrive40 by
  €19,100 while offering superior range (+216km) and faster charging (270kW vs 195kW). Standard
  equipment is comprehensive with air suspension, heat pump, matrix LED headlights, Sonos 20-speaker
  sound system, and bi-directional charging capability.
  
  The Sportback sacrifices 58L trunk capacity vs SUV sibling (511L vs 569L) but maintains identical
  641km WLTP range thanks to improved aerodynamics (Cd 0.26 vs 0.28). Real-world efficiency of 19.5
  kWh/100km makes it one of the most efficient premium electric SUVs available.
  
  Company car drivers benefit significantly from 0.25% tax rate (under €70k threshold) saving €4,635
  annually vs ICE equivalent Audi Q5. The RWD powertrain delivers engaging rear-biased driving
  dynamics with adequate 252hp power for daily use, though quattro AWD variant (+€7,000) recommended
  for frequent winter mountain driving.
  
  Most popular configuration adds Comfort Package Plus (€3,500 heated/ventilated/massage seats,
  Valcona leather), Technology Package (€2,900 AR HUD/enhanced 360° camera), and 22kW AC charger
  (€900) bringing total to ~€78k well-equipped. Fully-loaded spec reaches ~€90k with Bang & Olufsen
  sound (€5,000), virtual mirrors (€2,200), and 22" wheels (€2,400).
  
  Target buyers: efficiency-focused premium buyers seeking maximum range in coupe SUV, company car
  drivers maximizing tax benefits, long-distance travelers, Audi brand loyalists wanting latest PPE
  technology, early adopters seeking 800V ultra-fast charging capability.
  
  Best for: daily commuting with occasional long trips (540km real-world range adequate), highway
  cruising (450km at 130 km/h), premium coupe SUV with practicality (511L trunk + 2,400kg towing),
  company car use (0.25% tax saves €4,635/year), those prioritizing efficiency and charging speed.
  
  Not ideal for: maximum cargo needs (Q6 SUV offers 58L more trunk), winter driving in Alps without
  quattro (RWD limits traction), budget-conscious buyers (Tesla Model Y LR €13,910 cheaper), buyers
  needing absolute fastest charging (Hyundai/Kia 800V platform slightly faster in practice).

