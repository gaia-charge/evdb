market_notes: >
  The Leapmotor C10 BEV at €36,400 significantly undercuts the VW ID.4 (from ~€40,000) and Tesla Model Y
  (from ~€45,000). The interior quality is praised as well above its price class. Main weakness is the
  very low DC charging speed of 84.4 kW — far below the 100-170+ kW offered by competitors. Best suited
  for buyers who primarily charge at home/work and do limited long-distance travel. Qualifies for 0.25%
  company car tax rate as base price is under €70,000 threshold.

