# Strengths & Weaknesses
strengths:
  - Most affordable EV9 variant (€16k savings vs AWD)
  - Excellent 505 km WLTP range (420 km real-world adequate for daily use)
  - Class-leading third-row space and practicality
  - 7-year/150,000 km comprehensive warranty (industry-best)
  - Standard heat pump and V2L capability (3.6 kW)
  - Efficient single-motor RWD drivetrain (15.1 kWh/100km WLTP)
  - Adequate performance for large SUV (9.4s 0-100 km/h)
  - Comprehensive safety features (5-star Euro NCAP)
  - Highway Driving Assist 2 and 360° cameras standard
  - Strong residual values expected (~55% after 3 years)

weaknesses:
  - 1.6 seconds slower acceleration than AWD (9.4s vs 7.8s)
  - 400V architecture limits DC charging to 210 kW (vs 240 kW AWD)
  - 58 km less WLTP range than Long Range AWD
  - Lower towing capacity (1,600 kg vs 1,900 kg AWD)
  - Base Earth trim has basic 6-speaker audio
  - No ventilated seats on Earth trim
  - RWD only (no AWD for winter/off-road capability)
  - Base price exceeds €70k (0.5% company car tax rate, not 0.25%)

# Use Case Recommendations
best_for:
  - Daily family commuting (420 km real-world range adequate)
  - Urban and suburban families (efficient city driving)
  - Weekend road trips (210 kW DC charging enables travel)
  - Carpooling and large family transport (7 seats)
  - Buyers prioritizing value and efficiency over performance
  - Home charging users (lower running costs)
  - Those wanting premium 7-seater without extreme price

not_ideal_for:
  - Winter regions requiring AWD (consider Long Range AWD instead)
  - Buyers needing maximum towing capacity (1,600 kg limit)
  - Performance enthusiasts (9.4s 0-100 adequate but not sporty)
  - Company car drivers near €70k threshold (0.5% tax rate applies)
  - Regular long-distance highway driving at high speeds (range penalty)
  - Those requiring fastest possible charging (210 kW vs 240-270 kW rivals)

