# Additional Notes
notes: |
  First major 7-seat electric SUV under €75,000.
  Standard Range uses 400V architecture (not 800V like AWD).
  Earth trim extremely well-equipped for base model.
  210 kW DC charging still respectable (24 min 10-80%).
  Best value proposition in EV9 lineup for most buyers.
  Ideal for families prioritizing space and efficiency over speed.
  Consider Long Range AWD if you need winter capability or performance.
  Strong residual values expected due to Kia warranty and limited competition.
  Made in USA (Hyundai Motor Manufacturing Georgia).

