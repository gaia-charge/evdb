# Incentives and subsidies (2025/2026)
incentives:
  - name: Company Car Tax Benefit
    type: tax_exemption
    amount: 4800
    description: Company car tax benefit - 0.25% rate vs 1% for combustion vehicles
    notes: >
      Company car drivers benefit from 0.25% monthly tax rate (vs 1% for
      combustion vehicles), saving approximately €4,800 annually versus
      equivalent ICE SUV.

  - name: THG-Quote (Greenhouse Gas Reduction Quota)
    type: grant
    amount: 280
    description: Annual CO2 certificate trading income

  - name: Road Tax Exemption
    type: tax_exemption
    amount: 340
    description: Electric vehicles exempt from German road tax until 2030
    valid_until: "2030-12-31"

# Company car taxation
company_car:
  taxable_benefit_calculation: gross_list_price_x_0.25_percent
  monthly_taxable_benefit_eur: 119.98  # €47,990 × 0.25%
  annual_taxable_benefit_eur: 1440  # €119.98 × 12
  comparable_ice_benefit_eur: 6240  # Comparable ICE SUV €52,000 × 1% = €520/mo
  annual_tax_savings_eur: 4800
  notes: >
    The BYD Seal U Design qualifies for the advantageous 0.25% company car tax rate
    (vehicles under €70,000). Annual taxable benefit of only €1,440 compared to
    €6,240 for an equivalent combustion SUV.

