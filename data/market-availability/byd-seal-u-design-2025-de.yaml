# Notes
notes: >
  BYD Seal U Design offers exceptional value at €47,990 with class-leading 620 km
  WLTP range from the 87 kWh LFP Blade Battery. Only €3,000 more than the Comfort
  trim but adds 120 km range, ventilated seats, head-up display, and Harman Kardon
  audio. Represents one of the best range-per-euro propositions in the compact SUV
  segment. Company car tax benefit (0.25% rate) saves ~€4,800 annually vs ICE.

