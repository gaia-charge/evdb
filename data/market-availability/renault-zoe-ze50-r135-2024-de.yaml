    period: annual
    valid_until: "2030-12-31"
    description: "Road tax exemption for BEVs until 2030 (saves ~€350/year)"
    
  - type: tax_exemption
    name: "Company Car Tax Benefit"
    amount: 3024
    currency: EUR
    period: annual
    description: |
      0.25% company car tax rate vs 1% for ICE vehicles.
      
      Calculation for €33,990 list price:
      - EV rate (0.25%): €85/month = €1,020/year
      - ICE rate (1%): €340/month = €4,080/year
      - Annual saving: €3,060/year
      
      Significant benefit for company car drivers, making Zoe very attractive vs 
      equivalent ICE Clio (~€22,000). Over 3-year lease: €9,180 tax savings.
    notes: "Below €70,000 threshold, qualifies for 0.25% rate"
    
  - type: subsidy
    name: "THG-Quote (CO2 Certificate Trading)"
    amount: 250
    currency: EUR
    period: annual
    description: |
      THG-Quote (Treibhausgasminderungsquote) allows EV owners to sell their annual 
      CO2 savings to fuel companies. 2024 rates: €250-350/year depending on provider.
      
      Popular providers: Geld für eAuto, THG-Quote.de, ADAC e-Charge
    notes: "Annual benefit, can be claimed every year"
    
  - type: rebate
    name: "BAFA Umweltbonus (Ended)"
    amount: 0
    currency: EUR
    description: |
      German federal EV purchase incentive ended December 2023.
      
      Historical rates (2020-2023):
      - Under €40k: €6,750 government + €2,250 manufacturer = €9,000 total
      - 2023 reduction: €4,500 government only
      - Dec 2023: Ended
      
      Used Zoes may still have incentive applied if purchased before 2024.
    valid_from: "2020-07-01"
    valid_until: "2023-12-31"
    notes: "No longer available for new purchases"

incentives_notes: |
  **Total Annual Benefits (2024):**
  - Company car tax savings: €3,060/year (vs ICE)
  - Road tax exemption: €350/year
  - THG-Quote: €250/year
  - **Total: €3,660/year in ongoing savings**
  
  Over 3-year ownership: €10,980 in tax benefits alone.
  
  **BAFA Incentive Ended:**
  The €9,000 Umweltbonus purchase incentive ended December 2023. This significantly 
  impacts Zoe's value proposition vs 2023. However, ongoing tax benefits remain strong 
  for company car drivers.
  
  **Charging Costs:**
  - Home charging: ~€0.30/kWh = €5.25 per 100km (vs €8-10 for ICE)
  - Public AC charging: ~€0.45/kWh = €7.87 per 100km
  - DC fast charging: ~€0.65/kWh = €11.37 per 100km (IONITY €0.79/kWh)
  
  Annual fuel savings (15,000km): ~€900-1,200 vs equivalent ICE (Clio 1.0 TCe).

