  **Battery Leasing (Historical):**
  Zoe pioneered battery leasing in Europe (2012-2020) where customers bought the car 
  but leased the battery separately (€59-119/month depending on mileage). This reduced 
  purchase price by ~€8,000 but added ongoing costs.
  
  Battery leasing discontinued for new purchases in most markets but existing contracts 
  continue. Used Zoes commonly have leased batteries - important consideration for 
  secondhand buyers.

