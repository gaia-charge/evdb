  **Competitive Positioning:**
  - €2,000 cheaper than Peugeot e-208 (€36,990)
  - €3,000 cheaper than Opel Corsa-e (€36,990)
  - €5,990 cheaper than Mini Electric (€39,990)
  - €2,000 more expensive than MG4 Standard Range (€31,990)
  
  Battery leasing discontinued for new purchases but remains common on used market.

