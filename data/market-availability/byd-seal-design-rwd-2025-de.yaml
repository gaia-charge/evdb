# Market positioning
market_positioning:
  segment: premium_midsize_sedan
  target_audience: Company car drivers, tech-savvy professionals, Tesla alternative seekers
  key_selling_points:
    - Excellent value proposition (€47,990 for 580km range)
    - Class-leading 0.219 drag coefficient
    - Unique rotating 15.6" touchscreen
    - LFP Blade Battery (safer chemistry, 100% charge capability)
    - Strong warranty (6yr vehicle, 8yr battery)
    - V2L capability for camping/emergencies
    - Enhanced 2025 features (automatic parking, highway assist)
    - Improved efficiency (580km WLTP vs 570km in 2024)
  
  considerations:
    - BYD brand still building recognition in Europe
    - Resale values not yet established long-term
    - Smaller dealer network than established brands
    - No frunk storage

# Notes
notes: >
  2025 BYD Seal Design RWD offers exceptional value in premium sedan segment 
  with €47,990 starting price for 580km range. Enhanced for 2025 with automatic 
  parking, improved highway assist Level 2, and better efficiency.
  
  Main competitor to Tesla Model 3 RWD but with more luxury features and 
  slightly higher price. Company car tax benefit (0.25% rate) saves drivers 
  approximately €4,789 annually, making it extremely attractive for German 
  company car market.
  
  LFP Blade Battery chemistry allows worry-free 100% charging without 
  degradation concerns. V2L capability (3.3kW) enables use as mobile power 
  source. Class-leading aerodynamics (0.219 Cd) contributes to excellent 
  range and efficiency.
  
  BYD's expanding dealer network (45 locations in Germany) and strong 
  6-year warranty provide confidence. Residual values improving as brand 
  establishes European presence. Total cost of ownership significantly 
  lower than comparable combustion sedans (€9,082 savings over 3 years 
  vs BMW 330i).
  
  2025 updates make it even more competitive with enhanced safety and 
  convenience features. Recommended for company car drivers, families, 
  and anyone seeking premium EV at competitive price.

