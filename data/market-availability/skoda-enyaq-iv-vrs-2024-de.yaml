  notes: "2024 German market pricing for Škoda Enyaq iV vRS. Performance flagship at €58,990 base price. Dual motor AWD with 220kW (299hp), 0-100 km/h in 6.5 seconds, 513 km WLTP range. Excellent value proposition: significantly cheaper than Audi SQ4 e-tron (€76k+) while offering similar performance. Comprehensive standard equipment including Canton sound, LED Matrix lights, panoramic roof. Company car drivers under €70k list price benefit from 0.25% tax rate, saving €5,316/year vs ICE. Most popular configuration is 'vRS Comfort' (~€66k) with Comfort and Assistance Max packages. Performance enthusiasts often spec vRS Plus Package for adaptive chassis and rear-axle steering. Fastest Škoda EV available."
