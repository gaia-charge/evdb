market_notes: >
  The BYD Sealion 7 Excellence AWD is the flagship trim of the Sealion 7 lineup in Italy.
  Features 390 kW (530 hp) dual-motor AWD, 91.3 kWh Blade Battery, 502 km WLTP range (615 km city).
  0-100 km/h in 4.5 seconds, 215 km/h top speed, 230 kW DC fast charging (10-80% in 24 min),
  11 kW 3-phase AC charging. Premium features include Nappa leather interior, head-up display,
  20" wheels, 15.6" rotating touchscreen, Dynaudio 12-speaker audio system, 360° camera,
  comprehensive ADAS suite with Level 2 autonomous driving, ventilated/heated seats with electric
  adjustment and memory, panoramic roof, retractable door handles, and 520-1,789L cargo capacity
  (plus 58L frunk). V2L capability (3.3 kW) for powering external devices.
  Sits above Comfort RWD trim (€47,400, 82.5 kWh, 482 km range, 313 hp).

