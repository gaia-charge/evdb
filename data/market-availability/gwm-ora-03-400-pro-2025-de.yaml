notes: The GWM ORA 03 400 Pro at €44,990 list price offers 420 km WLTP range with the larger 63 kWh battery. Dealer discounts bring actual transaction prices significantly lower. The 400 Pro adds massage function, enhanced interior, and 18-inch wheels over the base 300. Same slow 67 kW DC charging limitation applies. Qualifies for 0.25% company car tax rate as price is under €70,000 threshold.
