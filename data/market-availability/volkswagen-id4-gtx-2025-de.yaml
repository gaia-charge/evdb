market_notes: |
  The ID.4 GTX is one of VW's strongest offerings in the German market,
  combining the practicality of their best-selling electric SUV with
  performance AWD credentials. At €52,295, it's priced competitively
  against the Tesla Model Y Long Range AWD (€55,990) while offering a
  more premium interior feel and German build quality. Company car tax at
  0.25% (€130.74/month) makes it compelling for business use. The tow bar
  option (1000 kg) adds versatility. Popular spec with Comfort and Tech
  packages brings total to around €56,000. Strong residual values and
  short delivery times (8 weeks) support the business case.

