notes: The Audi Q6 e-tron quattro Business is the first Audi on the new PPE platform (Premium Platform Electric). Features dual motor AWD with 285 kW/387 CV, 535 Nm torque, 0-100 km/h in 5.9s, 94.9 kWh net battery capacity, 540-625 km range (WLTP), 270 kW DC fast charging (10-80% in 21 min, 250 km range in 10 min), 800V architecture. Revolutionary Audi digital stage with curved OLED display (11.9" instruments + 14.5" central screen), 18" wheels, tri-zone climate, heated front seats, LED headlights, Side assist, smartphone interface, Virtual cockpit plus.
