notes: |
  **Market Positioning in Germany:**
  
  The Renault Megane E-Tech EV60 Techno at €42,990 (€43,980 on-the-road) is positioned as
  a premium C-segment EV with award-winning design and technology.
  
  **vs Direct Competitors:**
  - **VW ID.3 Pro (58kWh)** (€41,155): €1,835 cheaper, similar range (425km), less tech, German build
  - **Cupra Born 58kWh** (€41,000): €1,990 cheaper, sportier styling, less range (424km)
  - **MG4 Extended Range 64kWh** (€35,990): €7,000 cheaper, similar range (435km), Chinese build
  - **Peugeot e-2008 GT 54kWh** (€43,000): Similar price, smaller SUV, less range (406km)
  - **Nissan Ariya 63kWh** (€50,000): €7,010 more, larger SUV, same platform, more space
  - **Hyundai Ioniq 5 58kWh** (€46,900): €3,910 more, faster charging (800V), retro design
  
  **Key Selling Points:**
  - **Award-Winning**: European Car of the Year 2023, World Car Design 2023
  - **Technology**: Google Built-In (best-in-class infotainment), OTA updates, 12" OLED display
  - **Efficiency**: 15.8 kWh/100km WLTP, 17.9 real-world (heat pump standard)
  - **Charging**: 130kW DC fast charging, class-leading 22kW AC charging
  - **Design**: Coupe-crossover styling, L-shaped OLED cluster, premium recycled interior
  - **French Build**: Made in France at carbon-neutral ElectriCity hub
  - **Fast Delivery**: 6-week delivery time (vs 12+ weeks for German brands)
  
  **Company Car Benefits:**
  With 0.25% monthly taxation (€107.48/month vs €429.90 for ICE equivalent), the Megane E-Tech
  saves company car drivers €14,256 per year in taxes. Combined with €350/year THG-Quote and
  zero road tax, the total annual savings vs ICE is ~€15,000.
  
  This makes the €42,990 Megane E-Tech effectively cost €27,990 over 3 years for company car
  drivers - an incredible value proposition.
  
  **Strengths:**
  - Best-in-class infotainment (Google Automotive Services)
  - Award-winning design (European Car of the Year 2023)
  - Excellent real-world range (375km ADAC test)
  - Fast 22kW AC charging (full charge in 3.5 hours)
  - Strong DC fast charging (130kW, 10-80% in 32 minutes)
  - Competitive pricing for C-segment
  - Heat pump standard for efficient winter operation
  - 360° camera standard on Techno trim
  - Fast 6-week delivery
  
  **Weaknesses:**
  - No all-wheel drive option (FWD only)
  - No V2L/V2H/V2G bidirectional charging
  - Renault brand perceived as less premium than VW/Hyundai
  - No 800V architecture (vs Hyundai/Kia)
  - Smaller trunk (440L) than ID.3 (385L) or Ariya (466L)
  - Google integration requires internet connection for full features
  
  **Real-World Performance:**
  ADAC EcoTest results (mixed city/highway/autobahn):
  - Summer range: 375km (83% of WLTP 450km)
  - Winter range: 300km (67% of WLTP) - excellent heat pump performance
  - Consumption: 17.9 kWh/100km (vs 15.8 WLTP, +13%)
  - Highway 120km/h: 340km range, 20.5 kWh/100km
  - City: 480km range, 14.8 kWh/100km
  
  **Charging Economics:**
  - Home charging (€0.30/kWh): €5.10 per 100km
  - Public AC (€0.45/kWh): €7.65 per 100km
  - DC fast charging (IONITY subscription €0.35/kWh): €5.95 per 100km
  - DC fast charging (pay-as-you-go €0.79/kWh): €13.43 per 100km
  
  vs ICE equivalent (8L/100km, €1.90/L diesel): €15.20 per 100km
  
  **Target Buyer:**
  - **Urban/suburban drivers** seeking a stylish, tech-forward C-segment EV
  - **Company car drivers** maximizing 0.25% tax benefit (saves €14,256/year)
  - **Tech enthusiasts** valuing Google integration and OTA updates
  - **Design-conscious buyers** attracted to European Car of the Year winner
  - **Range-anxious** buyers needing 375km real-world range for daily + weekend trips
  - **Fast-charging** users appreciating 130kW DC + 22kW AC charging
  
  **Ideal Use Cases:**
  - Daily commuting: 50-100km/day (charge once per week on home wallbox)
  - Weekend trips: 200-300km (one charging stop if needed)
  - Road trips: 600km+ (two 30-minute charging stops)
  - Company car: Maximize tax savings (€322/month vs ICE)
  
  **Not Ideal For:**
  - Buyers needing AWD for winter/mountain driving
  - Buyers wanting V2L for camping/power tools
  - Buyers preferring German brands (VW, Audi, BMW)
  - Buyers towing heavy trailers (900kg max)
  - Buyers in areas with poor LTE/5G coverage (Google requires internet)
