# Notes
notes: |
  Renault Megane E-Tech EV60 Techno is the volume seller and winner of 2023 European Car of the Year.
  This trim includes premium features like heat pump, Harman Kardon sound system, and 22kW AC charging.
  German EV incentives ended December 2023, so no federal subsidy available.
  Company car tax benefit (0.25%) applies for electric vehicles under €70,000.
  Delivery times around 10 weeks due to high demand.
  Popular configuration: Rafale Grey metallic with 19" wheels (~€44,150 total).

