notes: |
  **Market Positioning in Germany:**
  
  The Renault Megane E-Tech EV60 Techno at €42,990 (€43,980 on-the-road) is the sweet spot
  in the Megane lineup and accounts for 60% of sales:
  
  **vs Direct Competitors:**
  - **VW ID.3 Pro Performance (77 kWh, €44,995)**: Similar price, more range (557km), less distinctive
  - **Cupra Born 77 kWh (€44,990)**: Nearly identical price/range, sportier image
  - **Hyundai Ioniq 5 Long Range RWD (€48,650)**: €5,700 more, faster charging (800V), larger
  - **Tesla Model 3 RWD (€42,990)**: Same price, more range (513km), less premium interior
  - **MG4 Extended Range (€35,990)**: €7,000 cheaper, similar range (435km), less premium
  
  **Key Selling Points:**
  - **2023 European Car of the Year** - prestigious award
  - **Comprehensive standard equipment** - ACC, blind spot, heated steering wheel
  - **OpenR Link with Google built-in** - best infotainment in class
  - **22kW AC charging** - full charge overnight on 3-phase
  - **130kW DC fast charging** - competitive road trip capability
  - **218 HP / 7.4s 0-100** - brisk performance for daily driving
  - **450km WLTP range** - suitable for all driving patterns
  - **440L trunk** - best-in-class practicality
  - **Black roof two-tone design** - distinctive appearance
  
  **Company Car Excellence:**
  The Techno is THE company car choice in Germany:
  - 0.25% monthly tax: €107/month vs €430 for equivalent ICE
  - Annual savings: €3,876 in taxes
  - 3-year lease savings: €11,628
  - Plus fuel savings: ~€2,000/year vs diesel
  - Total 3-year savings: €17,628 vs comparable Golf diesel
  
  **What Makes Techno Special:**
  vs EV40 (+€4,500):
  - 150km more range (450km vs 300km)
  - 88 HP more power (218 vs 130)
  - 22kW AC charging (vs 7.4kW)
  - 130kW DC charging (vs 85kW)
  - Adaptive cruise control
  - Blind spot monitoring
  - Heated steering wheel
  - Electric driver seat
  - Premium recycled microfiber upholstery
  - Black roof (two-tone)
  
  vs Iconic (-€3,000):
  - Same battery, range, and performance
  - Saves €3,000 for:
    - LED headlights vs Matrix LED (-€1,490)
    - Rear camera vs 360° (-€890)
    - Arkamys audio vs Harman Kardon (-€950)
    - No panoramic roof (-€1,200)
    - No massage seats
    - 18" wheels vs 20"
  - Total savings: €4,530 in features for €3,000 less
  
  **Target Buyer:**
  - **Company car drivers** (40% of Techno sales) - maximizing tax benefits
  - **Families** seeking practical EV for all needs
  - **Tech enthusiasts** who value Google integration
  - **Eco-conscious buyers** attracted to recycled materials
  - **Design-focused buyers** who want something different from VW/Tesla
  
  **Real-World Use Case:**
  - Daily commute: 50-100km (charge once a week at home)
  - Weekend trips: 200-300km round trip (no charging needed)
  - Occasional long trips: 130kW DC charging makes 500+ km feasible with one stop
  - Winter range: ~360km (20% reduction) still covers most needs
  
  **Best Options:**
  - **Matrix LED headlights (€1,490)**: Worthwhile safety upgrade for night driving
  - **360° camera (€890)**: Helpful for tight parking
  - **Harman Kardon audio (€950)**: Transforms entertainment experience
  - **Panoramic roof (€1,200)**: Enhances cabin ambiance
  
  Or: Pay €3,000 and get Iconic with all features for net €520 savings!
  
  **Sales Success:**
  - 60% of all Megane E-Tech sales in Germany
  - Outsells VW ID.3 in many regions
  - Strong appeal to company car market
  - High customer satisfaction scores
  
  **Why Buyers Choose Techno:**
  1. "Looks amazing, drives great, has everything I need"
  2. "Company car tax savings made it a no-brainer"
  3. "Google integration is fantastic"
  4. "Range is perfect for my lifestyle"
  5. "Feels more premium than VW ID.3"
  
  **Perfect For:**
  Daily driving + weekend trips + occasional long-distance travel. The Techno is the
  "do-everything EV" that doesn't compromise on range, features, or style.
