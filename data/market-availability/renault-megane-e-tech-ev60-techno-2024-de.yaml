# Notes
notes: |
  Renault Megane E-Tech EV60 Techno is the mid-range variant offering
  excellent balance of range, performance, and features. With 450 km WLTP
  (380 km real-world) and 218 hp motor, it handles daily commutes and
  weekend trips confidently. 22kW AC charging and 130kW DC fast charging
  provide flexibility. Premium features include synthetic leather heated
  seats, dual-zone climate, adaptive cruise control, and Arkamys premium
  audio system. Winner of 2023 European Car of the Year. Qualifies for
  German environmental bonus and 0.25% company car taxation. Delivery
  times currently 12 weeks. Manufactured in France at ElectriCity Douai plant.

