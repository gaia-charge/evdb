    Price positioning between base EV60 Equilibre (€40,000) and top EV60 Iconic (€46,000).

incentives:
  - name: Federal EV Subsidy (Ended)
    type: subsidy
    amount: 0
    description: >
      German federal EV incentive (€4,500 for vehicles under €40k, €3,000 for €40-65k)
      ended December 31, 2023. No longer available for new purchases.
    valid_from: null
    valid_until: "2023-12-31"
  
  - name: Company Car Tax Benefit
    type: tax_exemption
    amount: 3870  # Annual savings vs ICE
    description: >
      Electric vehicles with list price under €70,000 qualify for 0.25% monthly tax rate
      (vs 1.0% for combustion vehicles). Based on €43,000 list price, saves €3,870/year
      vs ICE equivalent. Massive benefit for company car drivers.
    conditions:
      - List price under €70,000
      - Pure battery-electric vehicle (BEV)
      - Used for business purposes
  
  - name: Vehicle Tax Exemption
    type: tax_exemption
    amount: 0
    description: >
      EVs exempt from German vehicle tax (Kfz-Steuer) for 10 years from first registration.
      Saves approx €150-200/year vs ICE equivalent.
    valid_from: "2024-01-01"
    valid_until: "2030-12-31"

