# Notes
notes: |
  The Renault Megane E-Tech EV60 Techno is the most popular variant, offering
  excellent value with 450 km WLTP range (380 km real-world) and comprehensive
  standard equipment. Key features include heat pump, 22 kW AC charging, 130 kW
  DC fast charging, and bidirectional charging (V2G/V2H) capability.
  
  The Techno trim includes as standard:
  - 12-inch OpenR multimedia system with Google built-in
  - 12-inch digital instrument cluster
  - 360° camera system
  - Adaptive cruise control with Lane Centering Assist
  - Heat pump for improved winter efficiency
  - Dual-zone climate control
  - Bidirectional charging capability (V2G/V2H)
  
  Company car tax benefits are excellent at 0.25% (vs. 1% for ICE vehicles).
  For a €43,900 vehicle, monthly taxable benefit is only €109.75.
  
  Delivery times are slightly longer (14 weeks) due to high demand for this variant.
  The Megane E-Tech is assembled at Renault's ElectriCity facility in Douai, France,
  with batteries from LG Energy Solution.
  
  Popular add-ons include the Tech Package (Harman Kardon audio, HUD, parking assist)
  and Winter Package (heated windshield, heated rear seats).

