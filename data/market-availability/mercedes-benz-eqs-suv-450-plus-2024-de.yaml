  notes: "2024 German market pricing for Mercedes-Benz EQS SUV 450+. Base price at €115,900 positions it as Mercedes' electric flagship SUV competing with BMW iX xDrive50 (€105,000), Audi Q8 e-tron 55 quattro (€90,000), and Tesla Model X Long Range (€105,000). Offers 660 km WLTP range (550 km real-world) from 118 kWh battery. Rear-axle steering (10°) provides 11.9m turning circle despite 5.1m length. Standard equipment includes AIRMATIC air suspension, Burmester 4D audio, AR HUD, and massage front seats. MBUX Hyperscreen (€8,925) is signature option. Executive Rear Seat Package (€11,305) targets chauffeur-driven buyers. Optional 7-seat configuration unique in luxury EV SUV segment. Built in USA (Tuscaloosa). Company car drivers save €6,948/year with 0.5% tax rate. Most popular configuration with MBUX Hyperscreen and key options ~€140k."
  updated_at: "2026-02-08"
