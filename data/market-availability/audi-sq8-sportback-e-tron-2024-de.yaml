metadata:
  price_checked_at: "2026-02-08"
  created_at: "2026-02-08"
  data_quality: verified
  notes: |
    Performance flagship Sportback with 370kW (503hp) and 4.5s 0-100 km/h.
    Ultimate combination of coupe styling, aerodynamics, and exhilarating performance.
    Still achieves respectable 494km WLTP range despite S-performance focus.
    €23,000 cheaper than BMW iX M60 (€120,000), €10,000 cheaper than Mercedes-AMG EQE 53 SUV.
    Best value proposition in performance luxury electric SUV segment.
    Popular with existing Audi S-loyalists transitioning to electric.
    Ideal for: Performance enthusiasts who want style, efficiency, and electric speed.
    Trade-off: Lower range than 55 quattro (494km vs 600km), but superior dynamics.
  updated_at: "2026-02-08"
  sources:
  - https://www.audi.de/de/brand/de/neuwagen/q8-e-tron.html
