company_car_tax:
  list_price: 96900
  tax_base: 96900
  tax_rate_percent: 0.5
  monthly_tax_1_percent: 485
  monthly_tax_0_5_percent: 242
  annual_tax_savings_vs_ice: 2910
  notes: |
    Price exceeds €70,000 threshold → 0.5% company car tax rate (not 0.25%).
    Despite 0.5% rate, still saves €2,910 annually vs equivalent ICE (1% rate).
    Example: Employee with 30km commute pays €351/month tax (0.5% + 0.03% × 30 × €96,900).
    ICE equivalent (e.g., Audi SQ7 TDI): €594/month tax (1% + 0.03% × 30 × €99,000).
    Tax savings: €243/month = €2,916/year.
  calculation_example: |
    Base: €96,900 × 0.5% = €485/month
    Commute: 30km × 0.03% × €96,900 = €871/month
    Total: €1,356/month gross benefit = ~€485 net tax (at 35% rate)

