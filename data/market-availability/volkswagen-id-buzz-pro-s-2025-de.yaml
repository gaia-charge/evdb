# Incentives (Germany 2025)
incentives:
  - name: "BAFA Umweltbonus"
    type: grant
    amount: 0
    notes: "Federal EV subsidy ended December 2023. No replacement as of 2025."

  - name: "Company Car Tax Benefit (0.25%)"
    type: tax_credit
    amount: 4200
    notes: |
      0.25% of gross list price per month (vs 1% for ICE).
      €62,990 × 0.25% = €157/month BIK.
      Comparable ICE VW T7 Multivan (€55,000) × 1% = €550/month.
      Annual saving: ~€4,200 in reduced income tax.
    eligibility: "Company car drivers only, vehicle price ≤€70,000 gross list"

  - name: "Kfz-Steuer exemption"
    type: tax_exemption
    amount: 300
    notes: "EVs exempt from road tax until 2030. Comparable ICE Multivan ~€300/year."
    valid_until: "2030-12-31"

  - name: "THG-Quote"
    type: grant
    amount: 280
    notes: "CO2 certificate trading income ~€280/year via providers."

