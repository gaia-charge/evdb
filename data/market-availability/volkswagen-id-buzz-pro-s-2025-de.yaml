# Market-Specific Details
availability_status: available
available_from: "2025-03-01"
delivery_time_weeks: 12
notes: |
  The 2025 ID.Buzz Pro S is the new top-spec RWD variant with 86 kWh battery.
  Replaces Pro Long as the flagship single-motor option.
  Includes premium equipment as standard (HK audio, HUD, heated everything).

# Pricing
pricing:
  base_price: 62990
  price_including_vat: 62990
  vat_rate_percent: 19
  notes: |
    Base price for 2025 ID.Buzz Pro S with 86 kWh battery, RWD, 5-seater.
    ~€4,500 more than 2024 Pro Long, justified by larger battery and more standard equipment.
    6-seater configuration adds €890. 7-seater adds €1,290.

