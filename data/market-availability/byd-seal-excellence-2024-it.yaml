# Notes
notes: |
  BYD Seal Excellence AWD delivers supercar-level performance (3.8s 0-100 km/h, 530 hp)
  at a mid-range price point, competing directly with Tesla Model 3 Performance
  and BMW i4 M50.
  
  Dual-motor all-wheel-drive with 390 kW (530 hp) and 670 Nm torque.
  82.5 kWh Blade Battery (LFP chemistry) provides exceptional safety and longevity.
  520 km WLTP range with impressive efficiency despite AWD performance.
  Premium standard equipment: Leather seats, Dynaudio 12-speaker audio system,
  head-up display (HUD), Apple CarPlay/Android Auto, heat pump, 360° camera,
  adaptive cruise control (ACC).
  
  Official distributor in Italy: Autotorino.
  
  Pricing includes all standard equipment and ready-to-drive delivery.
  Metallic paint adds €1,100.
  
  Popular Configuration: Seal Excellence with metallic paint = €51,790

