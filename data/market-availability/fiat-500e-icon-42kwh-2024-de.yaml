notes: "- Italian design icon reimagined as electric city car\n- Perfect for narrow German city streets and tight parking\n- Popular as second car or fashion statement\n- Strong brand heritage appeals to style-conscious buyers\n- Made in Turin, Italy (Mirafiori plant)\n- Cabrio (convertible) version very popular in Germany (+€3,500)\n- Criticized by ADAC for safety features not being standard (AEB requires pack)\n- Heat pump standard improves winter efficiency\n- 320km WLTP range adequate for urban use, struggles on long highway trips\n- Company car tax benefit (0.25%) makes it attractive despite premium price\n- Free city center access in some German cities (environmental zones)"
