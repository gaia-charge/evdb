notes: "The BMW i4 eDrive40 2025 is the mid-range version with 340 CV (250 kW) rear-wheel drive. Features 80.7 kWh battery with up to 590 km WLTP range and 200 kW fast charging capability.\n2025 model year includes improved SiC (silicon carbide) semiconductor technology for 4.5% better efficiency, iDrive 8.5 infotainment system, and new color options including Cape York Green metallic and Vegas Red metallic.\nCompetes with Tesla Model 3 Long Range, Audi e-tron GT, and Genesis Electrified G80 in the Italian premium electric sedan market."
