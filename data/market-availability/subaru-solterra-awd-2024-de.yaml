  notes: "Priced €5,490 higher than Toyota bZ4X (€57,490 vs €52,000) but includes more standard equipment: StarDrive panoramic roof with solar coating, Harman Kardon audio, heated seats/steering wheel, power driver seat, 360° camera, and premium synthetic leather interior. Unique Solterra styling and Subaru's EyeSight safety system. AWD-only matches Subaru brand identity. Competes with VW ID.4 AWD (€51,000), Hyundai Ioniq 5 AWD (€51,000). Main limitation: only 6.6kW AC charging. Popular with Subaru loyalists who value AWD capability and safety. Company car drivers save €5,172/year with 0.25% tax rate."
