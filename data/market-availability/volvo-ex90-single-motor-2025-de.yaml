notes: |
  The Volvo EX90 Single Motor at €79,990 is the entry point to the EX90 range
  in Germany. Exceeds the €70,000 company car threshold, so 1% monthly taxation
  applies (€800/month taxable benefit).

  Key advantages vs Twin Motor:
  - €6,510 lower starting price
  - More efficient (19.5 vs 21.5 kWh/100km)
  - 200 kg lighter
  - Adequate performance for family SUV use (7.8s 0-100)

  Same LiDAR safety tech, bidirectional charging, and premium features.
  Ideal for buyers prioritizing value and efficiency over AWD performance.

  Competes with: BMW iX xDrive40 (€77,300), Mercedes EQE SUV 350+ (€83,594),
  Tesla Model X Long Range (€89,990).

