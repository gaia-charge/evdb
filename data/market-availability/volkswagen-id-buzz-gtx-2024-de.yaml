notes: |
  VW ID.Buzz GTX represents the performance flagship of Volkswagen's retro-inspired electric van lineup.
  Launched in March 2024, the GTX variant targets performance-oriented families and enthusiasts who want
  sports car acceleration (6.5s 0-100 km/h) combined with practical MPV versatility.
  
  In Germany, the ID.Buzz GTX competes in the premium electric van segment where buyers expect strong
  performance, all-weather capability, and family practicality. The €65,122 base price positions it
  €11,000 above the RWD Pro Long variant, with the premium justified by dual-motor AWD, 100kW more
  power (250kW vs 150kW), and GTX-specific performance enhancements.
  
  Company car tax benefit (0.25% rate) saves €4,279/year vs combustion equivalent, making the GTX
  attractive for fleet buyers despite higher list price. Real-world 370km mixed range adequate for
  typical German family use (weekend trips, school runs, commuting) with 200kW DC fast charging
  enabling 28-minute 10-80% charging on longer journeys.
  
  Most popular configuration: GTX Family (7-seater) at €70,232 adds 7-seat layout, Winter Package,
  Tow Package, and metallic paint. This represents the sweet spot between base GTX and fully-loaded
  GTX Max, offering essential family features without excessive cost.
  
  Target buyers: Performance-oriented families (40% of buyers), winter region residents needing AWD
  safety (30%), VW GTX brand enthusiasts (20%), company car drivers (10%). Typical buyer: 35-50 years
  old, family with 2-3 children, tech-savvy, values performance and practicality equally.
  
  AWD capability crucial for buyers in Bavaria, Alps, and northern regions where winter conditions
  demand superior traction. GTX's intelligent AWD system with torque vectoring provides both
  performance benefits (faster acceleration, better cornering) and safety advantages (all-weather
  stability, towing confidence).
  
  Main competition from Mercedes EQV (more luxurious, €6k more), VW ID.Buzz Pro Long RWD (€11k cheaper,
  21km more range but less power/no AWD), Opel/Citroën/Peugeot electric MPVs (€10-12k cheaper but
  significantly less power and no AWD). GTX's unique selling proposition: fastest electric van with
  AWD at accessible price point.
  
  Annual sales estimate: 800-1,200 units in Germany (15-20% of total ID.Buzz sales). GTX variant
  particularly popular in southern Germany (Bavaria, Baden-Württemberg) where winter conditions and
  enthusiast culture align with GTX positioning.
  
  Residual value: ~55-58% after 3 years (€43,500-45,000) due to strong VW brand, GTX desirability,
  and limited electric van competition. Higher than commercial electric vans (45-50%) but lower than
  premium SUVs (60-65%).

