# Company Car Tax Calculation (Germany-specific)
company_car_tax:
  gross_list_price: 103500
  tax_rate_percent: 0.5
  calculation_method: "0.5% of gross list price per month"
  monthly_benefit: 518  # 103500 * 0.005
  notes: |
    The Taycan RWD exceeds €70,000 threshold, so 0.5% rate applies instead of 
    0.25% rate for EVs under €70k. Still significantly better than 1% rate for 
    combustion vehicles. Annual taxable benefit: €6,216 (vs €12,420 for ICE).

