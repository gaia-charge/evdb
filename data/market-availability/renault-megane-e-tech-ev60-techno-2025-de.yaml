# Market Notes
notes: |
  Renault Megane E-Tech EV60 Techno 2025 is the most popular variant with excellent
  balance of range (450 km WLTP, 380 km real-world), performance, and equipment.
  
  Available through Renault dealership network across Germany. Order online via renault.de
  or at any Renault partner. Delivery time currently 8 weeks.
  
  Techno trim adds over EV40:
  - Larger 60 kWh battery (450 km vs 300 km range)
  - More powerful motor (160 kW vs 96 kW)
  - 22 kW three-phase AC charging (vs 7.4 kW)
  - 130 kW DC fast charging (vs 85 kW)
  - Adaptive cruise control with stop & go
  - Lane centering assist
  - 360-degree camera
  - Wireless smartphone charging
  - Premium textile/synthetic leather interior
  - 18-inch alloy wheels (vs basic wheels)
  
  Key competitors in Germany:
  - VW ID.3 Pro Performance (77 kWh, €47,000) - more expensive, more range
  - Cupra Born 58 kWh (425 km, €43,000) - similar price, similar range
  - Nissan Ariya 63 kWh (450 km, €50,000) - more expensive
  - Peugeot e-2008 GT (54 kWh, €43,000) - similar price, less range
  
  Megane E-Tech Techno offers best-in-class infotainment (Google built-in), distinctive
  French design, and excellent real-world efficiency. The 22 kW AC charging is a standout
  feature - full charge in 3 hours at compatible three-phase chargers (common in Germany).
  
  Real-world range:
  - Summer (20°C, mixed): 380 km
  - Winter (-5°C, heater): 300 km
  - Highway (120 km/h, 20°C): 330 km
  
  130 kW DC charging allows 10-80% in 30 minutes, making road trips practical with
  strategic charging stops.
  
  Ideal for:
  - Company car drivers seeking good range and premium features
  - Families needing versatile electric vehicle
  - Tech enthusiasts who value Google built-in infotainment
  - Drivers who want distinctive design vs German competitors
  
  Popular optional features:
  - Solarbay panoramic roof (€1,100) - signature Megane feature
  - Harman Kardon sound (€800) - excellent audio quality
  - Advanced driver assistance (€1,500) - Level 2 autonomy
  
  Most customers add at least Solarbay roof and Harman Kardon, bringing typical
  transaction price to €48,000-50,000 (still well under €70k company car threshold).

