# Notes
market_notes: >
  The Renault Megane E-Tech Electric EV60 Techno is the premium offering
  in the award-winning Megane E-Tech range. With the larger 60 kWh battery,
  it delivers 450 km WLTP range (385 km real-world) and more powerful
  160 kW (218 hp) motor for dynamic performance (7.4s 0-100 km/h).
  
  The Techno trim elevates the package with premium features including
  20-inch diamond-cut wheels, Harman Kardon 9-speaker audio system, heated
  seats and steering wheel, leather/TEP upholstery, and the full suite of
  advanced driver assistance systems including Highway Companion (lane
  centering and adaptive cruise control).
  
  A key advantage is the 130 kW Optimax Charge DC fast charging capability,
  enabling 15-80% charging in just 30 minutes - perfect for longer journeys.
  The 22 kW AC onboard charger (three-phase) is another standout feature,
  allowing full charges in just 3 hours from a 22 kW wallbox or public
  charger.
  
  At €46,500, it represents excellent value compared to competitors like
  the Volkswagen ID.3 Pro S Performance (€49,000+) and Cupra Born e-Boost
  (€48,000+). The 0.25% company car tax rate keeps monthly taxation low at
  just €97 (1% of €11,625).
  
  Current delivery time is approximately 8 weeks. The federal environmental
  bonus of €3,000 reduces the effective price to €43,500, making this the
  best-value premium compact EV on the German market.

