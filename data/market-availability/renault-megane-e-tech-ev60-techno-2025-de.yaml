  configuration_advice: |
    **Recommended Configuration (€45,100):**
    - Base Techno: €42,900
    - Vision Pack: €900 (Matrix LED worth it for safety)
    - 3-phase 22kW AC Charger: €500 (essential for faster home charging)
    - Metallic Paint: €800
    
    This setup provides all essential features at €45,100 total.
    Skip Comfort Pack unless you really want massage seats.
    22kW charger reduces home charging from 9h to 3.5h (very worthwhile).
    
    **Why Techno over Equilibre (base)?**
    Techno adds heat pump, 360° camera, Level 2 ADAS, heated seats for €4,000.
    In Germany, heat pump alone saves €500-800/year in winter electricity costs.
    ROI achieved in ~3-4 years just from heat pump + resale value.
    
    **Why Techno over Iconic (top)?**
    Iconic costs €6,000 more (€48,900) for Alcantara seats, Matrix LED, and 20" wheels.
    Better value to add Vision Pack (€900) to Techno = Matrix LED + €5,100 saved.
    Most Iconic features available as Techno options.

