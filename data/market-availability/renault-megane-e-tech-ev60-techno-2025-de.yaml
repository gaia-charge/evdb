  notes: |
    For company car drivers with €60,000 gross salary:
    - Monthly benefit: €108.75
    - Tax (35% rate): €38.06/month (€457/year)
    - Social security (20%): €21.75/month (€261/year)
    - Total annual cost to employee: ~€718
    
    Compared to equivalent ICE compact SUV (€45,000 @ 1% = €450/month = €5,400/year tax cost),
    BEV saves company car driver approximately €4,682 per year.
    
    Even fully loaded configurations stay well under €70,000 threshold, maintaining
    0.25% taxation benefit. This makes EV60 Techno extremely attractive for company
    car drivers seeking premium features without luxury brand pricing.

# Market Notes
notes: |
  Renault Megane E-Tech EV60 Techno 2025 is the sweet spot in the Megane lineup -
  perfect balance of range (450km WLTP, 370km real-world), performance (218 HP),
  and value pricing under €45,000.
  
  Techno trim adds significant equipment over base EV40:
  - 60 kWh battery (450km WLTP vs 300km)
  - More powerful motor (218 HP vs 130 HP, 7.4s 0-100 vs 10.5s)
  - 22kW three-phase AC charging (vs 7.4kW single-phase)
  - 130kW DC charging (vs 85kW)
  - 18-inch alloy wheels (vs EV40)
  - Rear privacy glass
  - Wireless phone charging
  - Enhanced ambient lighting
  - Upgraded upholstery
  
  Available through Renault dealership network across Germany. Order online via renault.de
  or at any Renault dealer. Delivery time currently 10 weeks due to high demand.
  
  2025 model year brings refined software, improved Google Assistant integration,
  and enhanced charging curve optimization.
  
  Key competitors in Germany:
  - Volkswagen ID.3 Pro Performance (€44,995) - similar price, less premium
  - Volkswagen ID.4 Pro (€48,000) - larger, more expensive
  - Cupra Born (€43,000) - sportier, same MEB platform as ID.3
  - BMW i4 eDrive35 (€54,000) - more expensive, luxury brand
  - MG4 Electric Extended Range (€37,000) - cheaper, Chinese brand
  
  Megane EV60 Techno offers European Car of the Year quality, cutting-edge Google
  built-in tech, and excellent real-world range at highly competitive pricing.
  
  Popular choice for:
  - Company car drivers (0.25% taxation = huge savings)
  - Families needing versatile all-rounder
  - Long commuters (370km real-world range)
  - Tech enthusiasts (Google built-in is best-in-class)
  - Private buyers seeking premium without luxury pricing
  
  Real-world range scenarios:
  - Urban driving: 420-450km
  - Mixed driving: 350-380km
  - Highway 120 km/h: 320-350km
  - Winter (0-10°C): 280-320km
  
  Charging performance:
  - DC 10-80%: 32 minutes (130kW peak)
  - AC 0-100%: 3 hours (22kW)
  - Home wallbox overnight: convenient for daily use
  
  22kW AC charging is huge advantage over many competitors (VW ID.3/ID.4 only 11kW).
  Means full charge in 3 hours from public AC chargers or home three-phase wallbox.
  
  130kW DC charging provides comfortable long-distance capability with quick stops.
  
  Most popular Megane variant in Germany - excellent value proposition combining
  range, performance, tech, and company car benefits.

