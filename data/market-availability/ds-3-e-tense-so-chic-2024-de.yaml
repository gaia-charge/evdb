notes: |
  **Market Positioning in Germany:**

  The DS 3 E-Tense So Chic at €44,990 (€46,180 on-the-road) is positioned as a premium 
  alternative to mainstream B-segment electric crossovers. It competes on French luxury, 
  distinctive design, and premium materials rather than practicality or value.

  **vs Direct Competitors:**
  - **Peugeot e-2008 Allure (€39,490)**: €5,500 cheaper, same platform, more practical (405L vs 350L trunk), but less premium
  - **Opel Mokka-e Ultimate (€38,990)**: €6,000 cheaper, same platform, sportier, but less luxurious
  - **MINI Cooper Electric (€38,500-€44,000)**: Main competitor for premium compact EV, British style vs French luxury
  - **Audi Q4 e-tron 40 (€52,990)**: €8,000 more, larger C-SUV, more space/range, but less distinctive
  - **BMW iX1 eDrive20 (€50,000)**: €5,000 more, larger, more practical, but less characterful

  **Key Selling Points:**
  - French premium design philosophy ("Only the best is good enough")
  - Nappa leather with DS watch strap quilting (signature detail)
  - Retractable door handles and flush aerodynamic design
  - DS IRIS voice assistant with natural language processing
  - More powerful 115kW motor (vs 100kW in e-2008/Mokka-e)
  - Premium brand exclusivity (35 DS Stores vs 850+ Peugeot dealers)
  - 3-year warranty vs 2-year on Peugeot/Opel

  **Company Car Benefits:**
  With 0.25% monthly taxation (€112/month vs ~€1,350 for premium ICE equivalent), 
  the DS 3 E-Tense saves company car drivers ~€14,900 per year in taxes.

  Particularly attractive for executives and professionals who want a distinctive, 
  premium compact EV without the size and expense of an Audi Q4 e-tron or BMW iX1.

  **So Chic Trim Advantages:**
  - Nappa leather with watch strap quilting (cloth on Bastille)
  - 18" Davos alloy wheels (17" on Bastille)
  - DS IRIS SYSTEM with 10.3" HD touchscreen (standard across range)
  - Retractable door handles (standard across range)
  - Panoramic glass roof (not on Bastille)
  - Wireless charging (not on Bastille)
  - Extended head-up display available (not on Bastille)

  **Recommended Options:**
  - Extended Head-Up Display (€890) - Premium convenience
  - Focal Electra Premium Audio (€1,490) - French audio excellence
  - Performance Line Plus Package (€3,590) - Ultimate technology
  - Two-tone roof (€895) - Enhances distinctive styling
  - Total with options: €53,055

  **Target Buyer:**
  Style-conscious professionals, executives, and creative individuals who value distinctive 
  French design and premium craftsmanship over mainstream German engineering. The DS 3 
  E-Tense appeals to those who see their car as an expression of personality and taste,
  not just transportation.

  **DS Brand Experience:**
  Buying a DS is different from buying Peugeot/Opel. DS Stores offer personalized service,
  48-hour extended test drives, white-glove home delivery, and DS Valet Service for 
  maintenance. It's a premium brand experience similar to Volvo or Lexus, not a volume brand.

  The DS 3 E-Tense is for buyers who want something different, distinctive, and premium
  without the size/expense of German premium SUVs or the ubiquity of Tesla Model Y.
