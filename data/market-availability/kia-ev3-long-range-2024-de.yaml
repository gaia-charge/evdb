    The 0.25% rule (vs. 1.0% for combustion engines) results in ~75% lower
    monthly taxation. For a driver in 30% tax bracket, this saves approximately
    €315/month compared to equivalent ICE vehicle. Below €60,000 threshold
    ensures 0.25% rate (not 0.5%).

