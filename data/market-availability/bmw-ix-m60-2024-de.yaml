# Notes
notes: |
  The BMW iX M60 xDrive at €135,300 is the performance flagship of the BMW iX range.
  Positioned as a true M performance electric SUV with 619hp and 3.8s 0-100 km/h.
  
  COMPANY CAR TAX: Significantly exceeds €70,000 threshold
  - Monthly taxable amount: 1% of €135,300 = €1,353/month
  - Annual company car tax burden: €16,236/year (vs. €3,382 if under €70k)
  - This makes it extremely expensive for company car drivers
  
  Key competitive advantages over xDrive50:
  - M Sport equipment standard (€5,000 value)
  - 619hp vs 523hp (+96hp, 18% more power)
  - 3.8s 0-100 vs 4.6s (-0.8s, significantly faster)
  - 22kW AC charging standard (€900 value)
  - Sport-tuned adaptive air suspension
  - M Sport differential for better handling
  - Blue M brake calipers
  
  Primary competitors:
  - Mercedes-Benz EQS SUV 580 4MATIC (544hp, €141,000)
  - Audi Q8 e-tron SQ8 (503hp, ~€130,000)
  - Porsche Cayenne E-Hybrid Turbo S (680hp, ~€160,000 - PHEV)
  
  Popular options in Germany:
  - Executive Lounge seating (€3,900) - almost mandatory in this segment
  - Bowers & Wilkins Diamond audio (€7,500) - best-in-class sound
  - Sky Lounge panoramic roof (€2,000) - unique BMW feature
  
  The M60's performance positioning appeals to driving enthusiasts who want
  sports car acceleration in a luxury SUV package. The 566km WLTP range remains
  excellent despite the high performance, thanks to the 111.5 kWh battery.
  
  16-week delivery time reflects strong demand and limited production allocation
  for the top M performance variant.

