market_insights:
  target_buyers:
    - Families needing more range than 40kWh Leaf but on budget
    - Long-time Leaf enthusiasts upgrading from first-generation
    - Company car drivers benefiting from 0.25% tax rate
    - Buyers prioritizing proven reliability over cutting-edge technology
    - Those with home charging where CHAdeMO limitation less critical
    - Nissan brand loyalists familiar with e-Pedal/V2G ecosystem
  
  strengths:
    - 385km WLTP range adequate for daily use and weekend trips (115km more than 40kWh base)
    - More powerful 160kW (217hp) motor delivers engaging 6.9s 0-100 km/h performance
    - Proven reliability - 650,000+ LEAFs sold globally since 2010
    - Extensive dealer network - 650+ Nissan dealers in Germany
    - V2G/V2H bidirectional charging capability (unique in mainstream segment)
    - Comfortable e-Pedal one-pedal driving reduces brake wear
    - 8-year/160,000km battery warranty
    - Tekna trim well-equipped as standard (ProPILOT, 360° camera, Bose audio, leather)
    - Real-world 320km mixed range adequate for most use cases
    - Company car tax benefit (0.25% rate) saves €1,969/year vs ICE equivalent
  
  weaknesses:
    - CHAdeMO charging only (vs CCS2 standard) limits to ~10% of German DC fast chargers
    - Passive air cooling (no active thermal management) can lead to faster degradation in hot climates
    - Only 6.6kW AC charging (single-phase) vs 11kW competitors (three-phase)
    - 100kW DC fast charging slower than modern 150-250kW competitors
    - No heat pump (28% winter range loss vs 15% with heat pump)
    - 385km WLTP range lower than newer rivals (VW ID.3 Pro 557km, Kona Electric Long Range 514km)
    - Older 2018 platform lacks OTA updates and advanced connectivity
    - Tekna-only for e+ means higher entry price (€43,990 vs €34,990 for 40kWh base)
    - Passive battery cooling limits fast charging consistency (power reduction when warm)
  
  best_for:
    - Daily commuting up to 120km round trip
    - Urban/suburban driving with overnight home charging
    - Families needing proven electric vehicle with good range
    - Company car use (€1,969/year tax savings vs ICE)
    - Buyers wanting V2G/V2H home backup capability
    - Those prioritizing reliability over cutting-edge technology
  
  not_ideal_for:
    - Frequent long-distance travel (CHAdeMO fast charging network limited)
    - Hot climates (passive cooling accelerates degradation)
    - Buyers needing fastest charging (100kW slower than 150-250kW rivals)
    - Maximum range seekers (385km WLTP vs 500-600km rivals)
    - Those wanting latest tech (no OTA updates, older infotainment)

