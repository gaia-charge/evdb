notes: |
  Nissan Leaf e+ 62kWh represents the longer-range evolution of the world's best-selling electric vehicle.
  Launched in 2019 as response to longer-range competitors, the e+ variant adds 115km WLTP range over
  the 40kWh base model while delivering significantly more power (160kW vs 110kW).
  
  In Germany, the e+ competes in the €44,000 mid-range EV segment where buyers expect 400-500km range
  and modern features. While the Leaf's CHAdeMO charging and passive cooling are dated compared to
  newer CCS2 rivals with active thermal management, the proven reliability and extensive dealer network
  remain compelling for risk-averse buyers.
  
  Company car tax benefit (0.25% rate) saves €1,969/year vs combustion equivalent, making the e+ 
  attractive for fleet buyers despite higher list price. Real-world 320km mixed range adequate for
  typical German commute (30-50km/day) with weekend trip capability.
  
  Most popular in Tekna trim (only trim for e+ in Germany) which includes comprehensive equipment:
  ProPILOT Assist, 360° camera, Bose audio, leather seats, LED headlights. Common options add
  ProPILOT Park (€800), Winter Comfort (€400), 18" wheels (€600) for €46,880 total.
  
  Target buyers: Families upgrading from first-generation Leaf or 40kWh variant, company car drivers,
  those prioritizing proven reliability over cutting-edge specs, buyers with home charging where
  CHAdeMO limitation less critical, Nissan brand loyalists.
  
  Main competition from VW ID.3 Pro (€4k cheaper, 172km more range), Hyundai Kona Electric Long Range
  (€1k cheaper, 129km more range), Kia Niro EV (same price, 75km more range). Leaf's advantage lies
  in proven track record (14 years in market), extensive dealer network (650+ in Germany), and
  V2G/V2H bidirectional charging capability.
  
  Annual sales in Germany: ~1,500-2,000 units (down from 5,000+ before 2023 due to increased
  competition). e+ accounts for ~35% of Leaf sales. Typical buyer: 45-55 years old, family with
  children, company car or private owner, environmentally conscious, values proven reliability.
  
  CHAdeMO charging limitation significant in Germany where CCS2 dominates (90%+ of DC fast chargers).
  Major highways have CCS2 coverage but CHAdeMO availability limited to older stations and some
  Nissan dealers. For daily use with home charging, limitation less critical, but long-distance
  travel planning required.
  
  Residual value: ~52-55% after 3 years (€27,000-28,000) due to strong Leaf brand recognition and
  proven reliability. Higher than Chinese competitors (MG4 ~45%) but lower than premium German rivals
  (VW ID.3 ~58%).

