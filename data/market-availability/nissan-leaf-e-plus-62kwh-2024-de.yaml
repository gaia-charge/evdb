market_position:
  segment: Mainstream C-segment electric hatchback
  competitors:
    - Renault Zoe ZE50 (€33,990) - €10k cheaper, CHAdeMO also limited
    - Volkswagen ID.3 Pro (€46,565) - €2,575 more, CCS charging, more range
    - Peugeot e-208 GT (€39,990) - €4k cheaper, CCS charging, similar range
    - Kia Soul EV (€41,990) - €2k cheaper, CCS charging, 7yr warranty
    - MG4 Extended Range (€35,990) - €8k cheaper, CCS charging, similar range
  
  positioning: >
    The LEAF e+ at €43,990 is positioned as a proven, reliable EV with strong dealer support.
    Main selling points are: proven track record (650,000+ sold), V2G capability, ProPILOT,
    comfortable e-Pedal driving, and extensive Nissan dealer network (650+ in Germany).
    
    Main weaknesses vs competitors: CHAdeMO charging limits fast charging network access,
    passive battery cooling (faster degradation), only 6.6kW AC charging, older platform.
    
    Best for: Urban/suburban driving with home charging. Company car drivers (0.25% tax benefit).
    Not ideal for: Frequent long-distance travel (CHAdeMO network limited).

