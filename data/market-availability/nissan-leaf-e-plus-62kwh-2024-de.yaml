    notes: "Standard Nissan warranty. Shorter than Hyundai/Kia (5-7 years)."
  
  battery:
    years: 8
    km: 160000
    capacity_guarantee_percent: 70
    notes: >
      Battery warranty guarantees 70% capacity (41.3kWh usable) after 8 years/160,000km.
      However, LEAF's passive cooling means faster degradation than liquid-cooled batteries.
      Real-world reports: 4-5% loss/year in hot climates, 2-3% in moderate climates.
      After 8 years, expect 75-85% capacity depending on climate and charging habits.
  
