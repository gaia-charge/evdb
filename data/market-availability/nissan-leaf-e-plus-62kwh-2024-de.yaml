chademO_limitation:
  issue: "Limited CHAdeMO fast charging network in Germany"
  details: >
    The LEAF uses CHAdeMO DC fast charging, which is becoming obsolete in Europe.
    CCS (Combined Charging System) is the European standard, used by VW, BMW, Tesla, etc.
    
    CHAdeMO charger availability in Germany (2024):
    - Total DC fast chargers: ~20,000+
    - CCS chargers: ~19,000 (95% of network)
    - CHAdeMO chargers: ~2,000 (10% of network, declining)
    - Many new charging stations install CCS only
    
    IONITY (350kW ultra-fast network): CCS ONLY, NO CHAdeMO
    Fastned: Mostly CCS, limited CHAdeMO
    EnBW: CCS primary, CHAdeMO at select locations
    Shell Recharge: Limited CHAdeMO coverage
    
    This significantly limits LEAF's long-distance travel vs CCS competitors.
    Urban charging (AC) not affected, but highway trips require planning.

  workaround: >
    Use apps like Chargemap, PlugShare to filter for CHAdeMO chargers.
    Consider home/workplace charging as primary. AC charging (6.6kW) widely available.

