# Notes
notes: |
  The Hyundai Ioniq 6 Long Range RWD represents exceptional value in the premium
  sedan segment. At €50,990, it undercuts Tesla Model 3 Long Range (€46,990) by
  €4,000 but offers comparable range (614 vs 629km) and faster charging (18 vs 25
  minutes 10-80%) thanks to 800V E-GMP architecture.

  Company car drivers benefit massively: 0.25% tax rate = €127/month vs €510 for
  ICE equivalent (1% rule), saving €4,589/year. Popular Select trim configurations
  (€55,990 base + ~€10k options) total ~€68,000 fully equipped.

  The Ioniq 6's exceptional aerodynamics (Cd 0.21, best in production) and efficiency
  (13.9 kWh/100km) make it ideal for long-distance driving. The unique retro-futuristic
  'Electrified Streamliner' design and Parametric Pixel lighting create a distinctive,
  eye-catching appearance.

  Key advantages:
  - 18-min 10-80% charging (800V) vs 25-30 min for 400V competitors
  - 614km WLTP range, class-leading efficiency
  - 5-year warranty (vs Tesla's 4, BMW's 2)
  - V2L 3.6kW output (power external devices)
  - Strong standard ADAS (Highway Driving Assist 2)

  Trade-offs vs Tesla Model 3:
  - €4,000 more expensive
  - 15km less range (614 vs 629km)
  - No frunk, less cargo space (401L vs 561L)
  - Tighter rear headroom (fastback design)
  + Faster charging (18 vs 25 min)
  + Better build quality, more premium interior
  + 650 dealer network vs Tesla's 25 service centers

  Best for: Efficiency-focused buyers, long-distance drivers, company car users,
  design enthusiasts wanting something unique.

