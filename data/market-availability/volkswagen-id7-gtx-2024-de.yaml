# Market-Specific Notes
market_notes: |
  The ID.7 GTX is VW's performance flagship sedan. With 340 hp dual-motor
  AWD, it accelerates 0-100 km/h in 5.4 seconds while maintaining 595 km
  WLTP range. At €68,155, it barely qualifies for the 0.25% company car
  tax rate (cutoff is €70k with typical options). Comprehensive standard
  equipment includes AR HUD, climate comfort seats, matrix LED headlights,
  and full ADAS suite - competitors like BMW i5 M60 (€98k) cost €30k more.
  Popular with performance-oriented company car drivers who want both
  speed and efficiency. 20-week delivery time reflects strong demand.

