notes: |
  BMW i5 Touring M60 xDrive 2025 is the performance estate variant.
  €3,000 premium over the sedan M60. 570L boot (1,700L seats down).
  NOT eligible for German federal EV incentives (price above €65,000).
  Qualifies for 0.25% company car tax benefit. One of very few
  high-performance electric estates available. The Touring body adds
  practical estate versatility to the M60's 601 hp performance.

