market_notes: >
  2025 Kona Electric Long Range at €43,400 in Germany. Solid mid-range
  proposition with 514 km WLTP range and excellent efficiency. 8-week
  delivery is among the fastest in segment. Built in Czech Republic
  (Nošovice) reducing logistics costs. Hyundai's growing German dealer
  network (500+ points) provides good coverage. Heat pump standard.
  V2L capability increasingly valued. BOSE audio standard on Long Range.
  Competes directly with Kia EV3 (more range/V2G but slightly pricier)
  and VW ID.3 Pro S (more power, less equipment).

