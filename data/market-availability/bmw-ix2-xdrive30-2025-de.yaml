notes: 'BMW iX2 xDrive30 at €56,500 is positioned as a premium compact electric coupe-SUV. More expensive than the iX1 (~€1,500 premium for coupe styling) but offers more distinctive looks. Key strengths: German build quality, BMW brand prestige, excellent iDrive OS9, sporty handling. Under €70k for 0.25% company car tax benefit. Competes well in the premium compact segment. Main weakness: lower range (449 km) compared to MEB-based competitors.'
