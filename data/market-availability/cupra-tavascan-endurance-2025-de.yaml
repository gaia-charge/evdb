notes: "Cupra Tavascan Endurance at €51,990 positions as a premium compact electric SUV coupe. It's more expensive than the VW ID.5 it shares a platform with, justified by sportier design and Cupra brand positioning. 550 km WLTP range is excellent for the segment. Key selling point: distinctive coupe-SUV styling that differentiates from boxy competitors. Good company car with 0.25% BIK. Made in China, which may concern some buyers."
