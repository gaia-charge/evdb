# Notes
notes: |
  The Taycan GTS Sport Turismo is one of the most desirable configurations in the
  Porsche EV lineup. The 2025 model year brought a comprehensive update with larger
  battery (105 kWh), faster charging (320 kW peak), and improved range (504 km WLTP).

  Starting at €131,400 in Germany, it is a premium proposition but offers the
  combination of genuine sports car performance (515 kW boost, 3.7s 0-100), the
  GTS driving experience (sport-tuned everything), and practical Sport Turismo
  versatility (405L trunk, 1,212L with seats folded).

  Build times are approximately 20 weeks. The Porsche Exclusive Manufaktur program
  offers extensive customization options at additional cost.

  The 0.5% company car tax rate applies (price exceeds €70,000), providing a
  monthly taxable value of €657 - competitive given the vehicle's list price.

