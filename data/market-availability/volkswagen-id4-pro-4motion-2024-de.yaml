# Notes
notes: |
  Volkswagen ID.4 Pro 4Motion adds AWD capability with dual motors (210 kW total).
  Front motor is 80 kW AC induction, rear is 150 kW permanent magnet.
  Slightly lower range (497 km WLTP) vs RWD (520 km) due to added weight and second motor.
  Popular choice for buyers in mountainous regions or wanting better winter traction.

  AWD premium: €3,225 over RWD Pro variant (€51,790 vs €48,565).
  Acceleration: 0-100 km/h in 6.7s (vs 8.5s RWD) - much sportier!
  Weight: +115 kg vs RWD (2,239 kg vs 2,124 kg).

  Built in Zwickau, Germany on MEB platform (shared production line with RWD).
  No BAFA Umweltbonus available (program ended December 2023).

  Company car drivers save €1,812/year with 0.25% tax rate vs 1% ICE rate.
  Additional THG-Quote earnings: ~€350/year from CO2 certificate sales.
  Total annual savings: ~€2,520/year (company car tax + road tax + THG-Quote).

  Popular with:
  - Company car drivers (0.25% tax rate saves €1,812/year)
  - Families wanting AWD traction for winter/mountains
  - Outdoor enthusiasts needing towing capability (1,200 kg with towing package)
  - Performance-oriented buyers (6.7s 0-100 km/h vs 8.5s RWD)

