  - Kia EV6 GT-Line AWD (€54,990 - larger, faster charging)
  - Volvo EX40 (€48,950 - similar concept, Volvo safety focus)
  target_audience: Performance-oriented families wanting AWD capability and sporty driving
  unique_selling_points:
  - 313hp dual motor AWD in a compact SUV
  - 5.6s 0-100km/h - genuinely quick
  - 22kW AC charging standard (faster than most competitors)
  - Mini character with all-weather confidence
  - Made in Germany

notes: >
  The SE ALL4 at €49,500 is the performance pick of the Countryman Electric range.
  The 22kW AC charger is a standout feature - full charge in 3.5 hours on a suitable
  wallbox vs 6.5 hours for the E variant. Combined 313hp and AWD make it genuinely
  fun to drive while maintaining family practicality. Good company car choice under
  €70,000 threshold for 0.25% BIK taxation.

