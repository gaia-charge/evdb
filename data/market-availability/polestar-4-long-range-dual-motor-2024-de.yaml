    - Revolutionary no-rear-window design with HD camera system
    - Supercar-like 3.8s 0-100 km/h acceleration with 544 hp
    - Excellent 590 km WLTP range despite AWD performance
    - 15.4" portrait touchscreen - largest in premium SUV segment
    - Harman Kardon premium audio standard
    - Dual-chamber air suspension standard
    - Well below €70k threshold for 0.25% company car tax
    - Android Automotive OS with Google built-in
    - Near-perfect 50/50 weight distribution
    - Polestar brand cachet and Scandinavian design
  
  weaknesses:
    - 400V architecture, not 800V (slower charging vs Audi Q6/Porsche Macan)
    - Limited dealer network (Polestar Spaces in major cities only)
    - No rear window may concern some buyers (camera system excellent but different)
    - Higher insurance costs than mass-market EVs
    - Chinese production (though high quality)
    - No V2L/V2H capability
  
  ideal_for:
    - Daily commute up to 150km round trip (excellent range buffer)
    - Long-distance travel (590km range, 200kW DC charging)
    - Performance driving enthusiasts (3.8s acceleration, adaptive dampers)
    - Company car use (0.25% tax rate saves €4-5k annually)
    - Urban luxury transport (distinctive design, premium materials)
    - Weekend getaways (1500kg towing, large trunk)
  
  not_ideal_for:
    - Budget-conscious buyers (premium pricing)
    - Maximum range seekers (Tesla Model Y LR 140km more range)
    - Ultra-fast charging priority (Audi Q6 800V faster)
    - Traditional design preference (no rear window unconventional)
    - Remote areas without charging infrastructure

