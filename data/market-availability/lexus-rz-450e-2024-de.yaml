  notes: "First Lexus BEV. Premium positioning above German competitors at €74,900. Distinctive yoke steering option (One Motion Grip €2,500) unique in segment. 0.5% company car tax (above €70k threshold). Excellent interior quality with Takumi craftsmanship. DIRECT4 AWD system provides precise handling. More powerful than Toyota bZ4X (313hp vs 218hp). Competes with Q4 e-tron, iX1, EQA but positioned as more exclusive alternative. 11kW AC charging (vs bZ4X's 6.6kW)."
