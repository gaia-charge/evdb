  comparable_ice_benefit_eur: 6119  # BMW 330i €50,990 × 1% = €509.92/mo
  annual_tax_savings_eur: 4709  # Savings vs equivalent ICE sedan
  notes: >
    The BYD Seal qualifies for the advantageous 0.25% company car tax rate 
    (vehicles under €70,000 with minimum 60km electric range). This results 
    in annual taxable benefit of only €1,410 compared to €6,119 for 
    equivalent combustion sedan (BMW 330i), saving company car drivers 
    approximately €4,709 annually in reduced tax payments.

