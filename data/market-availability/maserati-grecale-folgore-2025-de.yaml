  pricing_notes: |
    Base price includes comprehensive luxury specification:
    - 105kWh battery (usable capacity)
    - 410kW (557hp) dual motors with intelligent AWD
    - 800V architecture with 150kW DC fast charging
    - Adaptive air suspension with five driving modes
    - 12-way power adjustable sport seats with memory (Nappa leather)
    - Sonus faber Premium Sound System (21 speakers, 1195W)
    - Maserati Intelligent Assistant (MIA) multimedia system
    - Three high-resolution displays (12.3" + 12.3" + 8.8")
    - 360° camera system
    - Panoramic glass roof with electrochromic shading
    - LED Matrix headlights
    - 3-zone climate control with heat pump
    - Highway Assist (Level 2 autonomous driving)
    - 20" Anteo wheels (staggered)
    - Premium Nappa leather interior with Alcantara
    - Carbon fiber interior accents
    - Wireless phone charging
    - Connected services for 3 years
    
    Premium Italian luxury positioning above German competitors.
    German pricing includes 19% VAT. Extensive customization available.

