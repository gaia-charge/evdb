market_notes: |
  The Maserati Grecale Folgore occupies a unique position in the luxury electric 
  SUV market:
  
  - DISTINCTIVE Italian design: Stands out from German competition
  - STRONG performance: 4.1s 0-100 km/h (410kW / 557hp)
  - EXCEPTIONAL audio: Sonus faber 21-speaker system (1195W)
  - PREMIUM craftsmanship: Nappa leather, Alcantara, carbon fiber
  - 800V architecture: 150kW fast charging
  - SOLID range: 501km WLTP (105kWh battery)
  
  At €112,500, the Grecale Folgore commands a premium over German rivals like
  Porsche Macan 4S (€95,550) and Audi SQ6 e-tron (€96,900). The premium reflects
  Italian luxury positioning, exclusive brand appeal, and distinctive character.
  
  Target buyers: Italian car enthusiasts, design-conscious buyers seeking 
  alternatives to German brands, luxury SUV buyers who value craftsmanship and
  character over pure efficiency, company car drivers in premium segment.
  
  Strengths:
  - Stunning Italian design language
  - Premium interior materials and build quality
  - Exceptional Sonus faber audio system
  - Distinctive brand character and exclusivity
  - Strong performance credentials
  
  Considerations:
  - Premium pricing vs German competitors
  - Slower charging (150kW vs 270kW in Porsche)
  - Slightly lower range than Audi/Porsche
  - Less extensive dealer network than VW Group brands
  
  Best value: Sportivo configuration (€131,400) adds key performance options
  without excessive luxury add-ons. For buyers prioritizing comfort, Gran Lusso
  (€132,200) offers comprehensive luxury specification.
  
  The Grecale Folgore appeals to buyers who view their vehicle as an expression
  of personal style and appreciate Italian automotive art. It's not the most
  efficient or practical choice, but it offers something the Germans don't:
  passion and character wrapped in electric performance.

