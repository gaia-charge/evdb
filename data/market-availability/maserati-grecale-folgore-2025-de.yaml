company_car_tax:
  rate_percent: 0.5
  calculation_basis: list_price
  calculation: |
    Vehicles priced over €70,000 qualify for 0.5% monthly taxation.
    
    Example calculation (base €112,500):
    - Monthly taxable benefit: €112,500 × 0.5% = €563/month
    - Annual taxable benefit: €6,756/year
    - Income tax on benefit (42% bracket): ~€2,838/year
    - Social contributions (~20%): ~€1,351/year
    - Total annual cost to employee: ~€4,189/year
    
    Comparison to combustion Maserati Grecale GT (1% rate at €68,000):
    - Annual taxable benefit: €8,160/year
    - Tax + social (62%): ~€5,059/year
    - Annual savings with Folgore EV: €870/year
    
    Grecale Folgore qualifies for advantageous 0.5% company car tax rate,
    offsetting higher purchase price vs combustion variants.
  
  notes: |
    Grecale Folgore qualifies for 0.5% company car tax rate.
    Private home charging reimbursable tax-free (€0.30/kWh or monthly flat rate).
    Total cost of ownership competitive despite premium positioning.

