notes: |
  BMW i5 M60 xDrive 2025 is the performance flagship of the i5 lineup.
  NOT eligible for German federal EV incentives (price above €65,000).
  Qualifies for 0.25% company car tax benefit, saving €8,724/year vs ICE.
  The 2025 model receives minor software updates including improved
  M-specific traction control. Most buyers add Executive Package only,
  as M Sport features are already standard.

