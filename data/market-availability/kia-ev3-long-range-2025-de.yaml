notes: 2025 model year with €500 price increase over 2024. Still excellent value at €42,490 for 605km WLTP range. Kia's 7-year warranty and strong dealer network make it a safe choice. V2L/V2G capability growing in importance with German energy market developments. Good availability with 10-week delivery.
