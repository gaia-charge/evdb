notes: |
  **Market Positioning in Germany:**

  The Renault Megane E-Tech EV40 at €38,000 (€38,990 on-the-road) is the entry-level
  option, perfect for urban driving and daily commuting.

  **vs Direct Competitors:**
  - **VW ID.3 Pure (€38,995)**: Similar price, 340 km range, more VW dealer network
  - **Cupra Born 45 (€36,990)**: €1,000 cheaper, similar range (340 km), sportier
  - **Hyundai Kona Electric 39kWh (€40,000)**: €2,000 more, 305 km range, more SUV-like
  - **MG4 Standard Range (€32,000)**: €6,000 cheaper, 350 km range, less premium

  **Key Selling Points:**
  - 2023 European Car of the Year
  - Google Automotive Services built-in
  - Excellent design and build quality
  - 300 km WLTP range suitable for daily use
  - Spacious interior (440L trunk)
  - Advanced tech (12" screens, Google integration)

  **Company Car Benefits:**
  With 0.25% monthly taxation (€95/month), the Megane E-Tech EV40 saves company car
  drivers ~€12,700 per year in taxes compared to ICE equivalent.

  **Target Buyer:**
  Urban professionals and small families who primarily drive in the city and suburbs,
  with occasional longer trips. The EV40 offers the Megane E-Tech experience at the
  lowest entry price, with all the key technology and design features.
