# Market Notes
notes: |
  Renault Megane E-Tech EV40 2025 is the entry-level variant, optimized for urban and
  suburban use with 300 km WLTP range. Winner of 2023 European Car of the Year award.
  
  Available through Renault dealership network across Germany. Order online via renault.de
  or at any Renault partner. Delivery time currently 8 weeks (improved from 12-16 weeks
  in 2023-2024).
  
  Key features even in base EV40 trim:
  - 12" vertical OpenR Link touchscreen with Google built-in
  - 12.3" digital instrument cluster
  - Heat pump (standard on all Megane E-Tech variants)
  - LED headlights
  - Multi-Sense driving modes
  - Emergency braking with pedestrian detection
  - Lane keeping assist
  - Driver attention warning
  
  Key competitors in Germany:
  - VW ID.3 Pure (58 kWh, €42,000) - more expensive, more range
  - Cupra Born 45 kWh (340 km, €38,000) - similar price and range
  - Nissan Leaf (40 kWh, €36,000) - cheaper but older design
  - Opel Astra Electric (54 kWh, €45,000) - more expensive
  
  Megane E-Tech offers standout design, excellent infotainment (Google built-in is
  superior to VW's system), and French styling. The vertical touchscreen is polarizing
  but very functional once you get used to it.
  
  Real-world range:
  - Summer (20°C, mixed): 260 km
  - Winter (-5°C, heater): 200 km
  - Highway (120 km/h, 20°C): 230 km
  
  85 kW DC charging allows 10-80% in 30 minutes. 7.4 kW AC charging means overnight
  charging at home or work is practical.
  
  Ideal for:
  - First-time EV buyers with predictable urban driving
  - Second car for families
  - Company car drivers seeking affordable electric mobility
  - Urban dwellers with access to home/work charging

