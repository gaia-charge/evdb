  notes: "Entry-level variant of European Car of the Year 2023 winner. Perfect for urban commuters and buyers with shorter daily distances. At €38,990 base price, it's one of the most affordable ways to get European Car of the Year technology. 300km WLTP range is sufficient for city/suburban use. Lighter weight (1,470kg) makes it nimble and efficient. Company car drivers save €3,509/year with 0.25% tax rate. Consider upgrading to 22kW AC charging (€650) and heat pump (€750) for better usability. Best value proposition for urban EV buyers who don't need long-range capability."
