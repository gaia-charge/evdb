# Incentives and subsidies (2025/2026)
incentives:
  - name: Company Car Tax Benefit
    type: tax_exemption
    amount: 3890
    description: Company car tax benefit - 0.25% rate vs 1% for combustion vehicles
    notes: >
      Company car drivers benefit from 0.25% monthly tax rate 
      (vs 1% for combustion vehicles), saving approximately €3,890 annually 
      compared to equivalent combustion vehicle. This is the primary 
      financial incentive for EVs in Germany in 2026.
  
  - name: THG-Quote (Greenhouse Gas Reduction Quota)
    type: grant
    amount: 280
    description: Annual CO2 certificate trading income
    notes: >
      Tradeable emission certificates provide annual income of approximately 
      €250-300 in 2026 (varies by market price).
  
  - name: Road Tax Exemption
    type: tax_exemption
    amount: 280
    description: Electric vehicles exempt from German road tax until 2030
    valid_until: "2030-12-31"

# Company car taxation
company_car:
  taxable_benefit_calculation: gross_list_price_x_0.25_percent
  monthly_taxable_benefit_eur: 97.25  # €38,900 × 0.25%
  annual_taxable_benefit_eur: 1167  # €97.25 × 12
  comparable_ice_benefit_eur: 5106  # VW Golf 1.5 TSI €42,550 × 1% = €425.50/mo (2026 pricing)
  annual_tax_savings_eur: 3939  # Savings vs equivalent ICE hatchback
  notes: >
    The Renault Megane E-Tech EV40 qualifies for the advantageous 0.25% company 
    car tax rate (vehicles under €70,000 with minimum 80km electric range). This 
    results in annual taxable benefit of only €1,167 compared to €5,106 for 
    equivalent combustion hatchback (VW Golf 1.5 TSI), saving company car drivers 
    approximately €3,939 annually in reduced tax payments.

# Total Cost of Ownership (3-year calculation, 2026 costs)
tco_analysis:
  period_months: 36
  annual_mileage_km: 12000
  total_mileage_km: 36000
  
  purchase_cost: 39850
  
  energy_costs:
    home_charging_kwh: 0.36  # €/kWh average Germany 2026
    public_charging_kwh: 0.58  # €/kWh average
    home_charging_percent: 85
    public_charging_percent: 15
    total_energy_cost_3yr: 2176  # 36,000km @ 15.7kWh/100km × (0.85×€0.36 + 0.15×€0.58)
  
  maintenance_costs:
    annual_service_cost: 250
    total_maintenance_3yr: 750
    notes: Electric vehicles require minimal maintenance (no oil changes, fewer brake services)
  
  insurance_annual: 720
  insurance_3yr: 2160
  
  depreciation:
    residual_value_percent: 58  # 58% after 3 years (Renault EV residuals stable in 2026)
    residual_value_eur: 23113
    depreciation_3yr: 16737
  
  total_cost_3yr: 21823
  cost_per_km: 0.61
  
  comparable_ice_costs:
    vehicle: VW Golf 1.5 TSI
    purchase_price: 42550
    fuel_cost_3yr: 5032  # 36,000km @ 5.8L/100km × €1.90/L (2026 price)
    maintenance_3yr: 1650  # Higher maintenance for combustion
    insurance_3yr: 2400  # Slightly higher
    depreciation_3yr: 18671  # 56% residual (€23,828)
    total_cost_3yr: 27753
    cost_per_km: 0.77
  
  savings_vs_ice: 5930  # €27,753 - €21,823
  
  notes: >
    Renault Megane E-Tech EV40 offers substantial savings versus compact combustion 
    hatchbacks. Over 3 years, total ownership costs are approximately €5,930 lower 
    than comparable VW Golf with similar equipment. Energy costs are significantly 
    lower (€2,176 vs €5,032), and maintenance is minimal due to electric drivetrain 
    simplicity. 
    
    Lower purchase price than EV60 variants makes EV40 particularly attractive for 
    urban commuters who can charge at home. 300km WLTP range (real-world ~255km) is 
    sufficient for most daily use cases, and 85kW DC fast charging provides quick 
    top-ups when needed.

