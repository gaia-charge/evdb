# Notes
notes: |
  Renault Megane E-Tech EV40 is the affordable entry into the award-winning Megane E-Tech 
  family. Winner of 2023 European Car of the Year. The 40 kWh battery provides sufficient 
  range for urban and suburban use (260 km real-world). Standard equipment includes the 
  impressive OpenR infotainment system with Google built-in and heat pump for efficient 
  winter performance. Delivery times are moderate due to strong demand. Eligible for 
  German EV incentives.

