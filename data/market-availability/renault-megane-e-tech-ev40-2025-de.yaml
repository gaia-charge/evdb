  notes: |
    Pricing verified from Renault Germany configurator for 2025 model year. The EV40
    is positioned as accessible entry into premium compact EV segment.
    
    Delivery times improved to 8 weeks thanks to high production capacity at Renault's
    ElectriCity plant in Douai, France.
    
    Despite being entry variant, standard equipment is comprehensive. Main differences
    vs EV60 variants are smaller battery (40kWh vs 60kWh), less powerful motor
    (130 HP vs 218 HP), and single-phase 7.4kW AC charging (vs three-phase 22kW).
