dealer_network:
  total_dealers: 3000
  certified_ev_dealers: 2800
  notes: |
    Ford has one of the largest dealer networks in the US with ~3,000 dealerships. 
    As of 2024, ~2,800 are certified for EV sales with trained technicians and 
    DC fast chargers on-site. Ford's traditional dealer advantage vs Tesla's 
    limited service centers. Most dealers offer home delivery and online ordering 
    through FordPass. Certified EV dealers required to invest $500k-1M in training, 
    tools, and charging infrastructure.

