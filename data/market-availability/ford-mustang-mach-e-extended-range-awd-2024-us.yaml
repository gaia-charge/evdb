  notes: |
    Battery warranty covers 70% capacity retention over 8 years/100k miles. 
    Ford extended battery warranty from original 100k miles after early complaints. 
    Roadside assistance includes towing to nearest Ford dealer or charging station. 
    FordPass Rewards members get additional benefits.

notes: |
  The Mustang Mach-E is Ford's flagship electric vehicle and one of the best-selling 
  EVs in America (3rd behind Tesla Model Y and Model 3 in 2023). Extended Range AWD 
  Premium is the most popular configuration, offering excellent 270-mile EPA range, 
  spirited performance (0-60 in 4.8s), and practical 5-seat SUV layout. 
  
  Competitive pricing at $56,295 before incentives, which can stack to $15,000+ 
  savings (federal $7,500 + state rebates). Ford's traditional dealer network 
  advantage provides service accessibility vs Tesla. BlueCruise hands-free driving 
  competes with Tesla Autopilot and GM Super Cruise. V2H capability enables home 
  backup power during outages (9.6 kW discharge).
  
  2024 saw major improvement: Ford gained access to Tesla Supercharger network 
  (17,000+ stalls) via free NACS adapter, doubling available fast charging 
  options. This addresses previous charging network concerns. Built in Mexico, 
  Mach-E qualifies for full IRA federal tax credit.
  
  Popular in California (30% of US sales) due to generous state rebates ($7,500 
  CVRP) stacking with federal credit for $15,000 total savings. Real-world 
  range typically 250-270 miles mixed driving, 300+ miles in mild weather. 
  Winter range drops to ~200 miles in cold climates (heat pump not standard 
  until 2025 model year).
  
  Key competitors: Tesla Model Y ($47,490), Hyundai Ioniq 5 ($43,975), 
  Volkswagen ID.4 ($38,995), Chevrolet Blazer EV ($48,800). Mach-E trades 
  lower efficiency (78 MPGe EPA vs Model Y 122 MPGe) for better build quality, 
  dealer network, and Mustang heritage styling.

