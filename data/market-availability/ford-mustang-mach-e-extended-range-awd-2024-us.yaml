      Inflation Reduction Act. Requirements: MSRP under $80,000 (✓), final assembly 
      in North America (✓ Mexico plant), battery components 50%+ North America (✓), 
      critical minerals 40%+ US/FTA (✓). Income limits: $150k single, $300k joint. 
      Point-of-sale instant discount as of 2024.
    valid_from: "2023-01-01"
    valid_until: "2032-12-31"
    conditions:
      - "Built at Cuautitlán Assembly Plant, Mexico - qualifies"
      - "Income limits: $150k single, $300k joint"
      - "Instant discount at dealer (point-of-sale)"
  
