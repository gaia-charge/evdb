# Notes
notes: |
  Renault Megane E-Tech EV60 Iconic, la version premium avec tous les équipements
  de série. Meilleure autonomie de la gamme (470 km WLTP, 385 km réel).
  Parfait pour les acheteurs qui souhaitent l'ensemble complet sans ajouter d'options.
  Inclut système audio Harman Kardon, toit panoramique, cuir Nappa, phares Matrix LED,
  et toutes les aides à la conduite. Fabriqué en France à Douai.
  Prix attractif avec bonus écologique (€5,000) et prime à la conversion (€2,500).
  Version prestigieuse, populaire auprès des cadres et entreprises.

