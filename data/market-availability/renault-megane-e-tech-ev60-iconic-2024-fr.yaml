# Notes
notes: |
  Renault Megane E-Tech EV60 Iconic - version haut de gamme avec
  équipements premium et technologies avancées. Avec 470 km d'autonomie
  WLTP (390 km en conditions réelles), elle offre une excellente
  autonomie pour tous les scénarios. Équipements premium incluant
  sièges Alcantara/cuir avec chauffage, ventilation et massage;
  affichage tête haute; phares LED Matrix; jantes 20 pouces; audio
  premium Harman Kardon; et toit panoramique Solarbay électrochrome.
  Highway & Traffic Jam Assist (ProPilot) pour conduite semi-autonome.
  Suite de sécurité complète avec caméra 360°. Élue Voiture de
  l'Année 2023 en Europe. Éligible au bonus écologique français
  (montant réduit car prix >€47,000) et à la prime à la conversion.
  Délai de livraison actuellement 10 semaines. Fabriquée en France
  à l'usine ElectriCity de Douai.

