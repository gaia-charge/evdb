notes: |
  BMW iX xDrive50 premium electric SUV available in Poland.
  538km WLTP range with 105.2 kWh battery (111.5 kWh gross).
  AWD with dual motors delivering 523 HP (385 kW) and 765 Nm torque.
  Impressive 4.6s 0-100 km/h acceleration and 200 km/h top speed.
  
  195 kW DC fast charging capability (10-80% in ~35 minutes).
  11 kW AC charging standard (optional 22 kW available).
  
  Prices include 23% VAT. Eligible for "Mój elektryk" subsidy
  up to 27,000 PLN, reducing effective price to 471,000 PLN.
  
  5-star Euro NCAP safety rating (2021). Spacious 5-seater SUV
  with premium interior and BMW's curved panoramic display.
  
  Competes with Mercedes EQE SUV, Audi Q8 e-tron, and Tesla Model X
  in Polish premium electric SUV market.

