  notes: "2024 German market pricing for Audi Q6 e-tron RWD. Base price at €71,200 positions it between Q4 e-tron quattro (€58,990) and Q8 e-tron 55 (€87,500). Excellent value considering 641 km range, 800V ultra-fast charging (270 kW peak, 10-80% in 21 minutes), and standard features (panoramic glass roof, 360° camera, adaptive air suspension). Competes directly with BMW iX3 (€69,000) and Mercedes EQE SUV 350+ (€77,000). Company car drivers save €6,408/year with 0.25% tax rate. Most popular configuration is 'advanced' trim (~€85k) with Premium Plus Package."
