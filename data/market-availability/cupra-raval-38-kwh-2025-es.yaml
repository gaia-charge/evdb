notes: CUPRA Raval 38 kWh is manufactured in Martorell, Barcelona — making it a Spanish-built EV. As a national product, it benefits from strong dealer network (CUPRA/SEAT concesionarios) across Spain. Starting at €24,990, it's one of the most affordable BEVs in Spain. With Plan MOVES III subsidies, effective price can drop to €17,990 (with scrapping) or €20,490 (without). Directly competes with Renault 5 E-Tech and Citroën ë-C3 in the Spanish market.
