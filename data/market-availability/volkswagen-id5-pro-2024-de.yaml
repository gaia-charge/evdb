# Market-Specific Details
availability_status: available
available_from: "2022-03-01"
delivery_time_weeks: 12
notes: |-
  Coupe SUV variant of ID.4 with sportier styling. Built at VW's Zwickau
  factory in Germany. Targets buyers seeking sporty alternative to practical ID.4.
  The ID.5 Pro is positioned as the sportier alternative to ID.4, with
  coupe SUV styling and improved aerodynamics. German pricing starts at
  €52,000. Popular with business users due to favorable company car taxation.
  Typical delivery time 8-12 weeks. Most buyers add IQ.DRIVE Max and DCC
  adaptive dampers.

