notes: The BYD Seal Excellence AWD delivers supercar-level performance with 390 kW (530 hp)  and 670 Nm torque, accelerating from 0-100 km/h in just 3.8 seconds. Equipped with  the 82.5 kWh Blade Battery (LFP chemistry), it offers 520 km WLTP range. Premium  features include Nappa leather seats, Dynaudio 12-speaker audio system, head-up display,  warmtepomp, and V2L capability. The dual-motor AWD system provides excellent traction  in all weather conditions.
