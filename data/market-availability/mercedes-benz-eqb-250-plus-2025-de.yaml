notes: |
  Mercedes-Benz EQB 250+ 2025 at €57,990 is the most affordable EQB variant and offers
  the best range (474km WLTP) thanks to FWD efficiency. It's the only premium
  compact SUV offering optional 7-seat configuration.
  
  2025 MODEL YEAR UPDATES:
  - Updated MBUX infotainment with 11.9-inch touchscreen (vs 10.25-inch)
  - Wireless smartphone charging now standard (was optional)
  - Enhanced voice control
  - Minor interior trim refinements
  - Price increase: €1,000 (€56,990 → €57,990)
  
  KEY ADVANTAGE: Qualifies for 0.25% company car tax (under €70,000 threshold)
  - Monthly taxable benefit: €144.98 (vs €579.90 if 1% rate)
  - Annual tax savings: ~€4,350/year for typical company car driver
  
  Popular configuration:
  - AMG Line (€4,950) - sporty look, 20-inch wheels
  - Third row seats (€1,850) - essential for 7-seater families
  - Premium Package (€3,100) - enhanced infotainment, navigation, Burmester audio
  - Driver Assistance Package Plus (€2,480) - advanced ADAS
  - Total: €70,370 (just over €70k threshold, but marginal)
  
  Competitive positioning:
  - BMW iX1 xDrive30: Similar price (€56,500) but only 5 seats, AWD standard
  - Audi Q4 e-tron 45 quattro: €54,900, larger, AWD, better value but less premium
  - Tesla Model Y RWD: €44,990, more range, better tech, but less premium interior
  - Volkswagen ID.4 Pro: €47,995, good value, less premium
  
  Strengths:
  - Only premium 7-seat compact EV available
  - Mercedes brand prestige and build quality
  - Best EQB range: 474km WLTP
  - Standard heat pump
  - Updated MBUX infotainment (2025)
  - Wireless charging now standard
  - Company car tax advantage
  
  Weaknesses:
  - Modest 100kW DC charging (slower than competitors)
  - Third row very cramped (kids only)
  - Small trunk with 7 seats (190L)
  - FWD only (no quattro)
  - Higher base price than competitors
  - Price increase for 2025 MY
  
  Typical delivery: 8 weeks (improved availability vs 2024, production in Hungary)

