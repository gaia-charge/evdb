notes: |
  The Opel Frontera Electric at €28,990 offers excellent value:

  **Key Advantages:**
  - One of the cheapest electric SUVs in Germany
  - Spacious interior (460L boot, 1,600L seats down)
  - Low company car tax: €72/month
  - Practical boxy design maximizes space
  - Innovative Intelli-Seat for long-journey comfort
  - Strong Opel dealer network (850+ in Germany)
  - Future 7-seater version announced

  **Considerations:**
  - AC charging limited to 7.4 kW (no 11 kW 3-phase)
  - 83 kW motor is modest (12.1s 0-100 km/h)
  - No heat pump available
  - Standard range of 305 km may be tight for longer trips

  **Best for:**
  - Budget-conscious EV buyers
  - Families needing cargo space
  - Company car drivers
  - Urban and suburban driving

