notes: "The BYD Atto 2 is a compact electric SUV with 177 hp (130 kW), 45.1 kWh LFP battery, and 312 km WLTP range. Competes with Peugeot e-2008 and Kia EV3. Features include electric front seats, panoramic roof, navigation, adaptive cruise control. Two trims available: Active (€29,990) and Boost (€31,990). Not eligible for the French bonus écologique (built in China); may become eligible if production moves to BYD's Hungarian plant."
