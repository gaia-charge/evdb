# Market-Specific Details
availability_status: available
available_from: "2023-10-01"
delivery_time_weeks: 16
notes: |-
  VW's flagship electric sedan launched October 2023. Built at VW's
  Emden factory in Germany. Targets business users and long-distance
  drivers with exceptional aerodynamics and range.
  The ID.7 Pro is VW's flagship electric sedan, targeting the premium
  business car segment dominated by BMW 5 Series and Mercedes E-Class.
  With 621 km WLTP range and Cd 0.23 aerodynamics, it's one of the most
  efficient large sedans available. Popular with company car users who
  benefit from 0.25% tax rate (under €70k). Strong dealer network and
  VW brand reputation make it a safe choice for fleet buyers. 16-week
  delivery time typical for German-built premium EVs.

