notes: |
  The 2025 Mercedes-Benz EQS 450+ receives a modest price increase to €116,950 (up 2% from €114,641 in 2024).
  
  **2025 Updates:**
  - Base price: €116,950 (up €2,309 from 2024)
  - Improved delivery time: 14 weeks (down from 16 weeks)
  - Enhanced MBUX voice recognition
  - Updated ADAS software
  - Slightly improved WLTP range: 785km (up from 782km)
  
  **Company Car Tax Benefit (2025):**
  - 0.25% monthly rate: €116,950 × 0.25% = €292/month
  - ICE equivalent 1% rate: €116,950 × 1% = €1,170/month
  - **Annual savings: €10,524** (€31,572 over 3-year lease)
  
  **Popular Configurations:**
  - Base (€116,950): Rare
  - Well-equipped (~€139,000): MBUX Hyperscreen, AMG Line, 22kW charger, comfort packages
  - Chauffeur spec (~€163,000): Executive Rear Seat, Burmester 3D, E-Active Body Control
  
  The EQS 450+ remains the flagship electric luxury sedan with 785km WLTP range and world-class
  aerodynamics (Cd 0.20). Competition from BMW i7 and updated Porsche Taycan continues to intensify.

