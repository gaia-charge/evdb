notes: Mercedes-Benz CLA 200 electric is the entry point to the new MMA-platform Mercedes lineup. Expected to be a strong seller in Spain's premium segment. With MB.OS and an estimated 600+ km WLTP range from its LFP battery, it offers strong value. Available through the Mercedes-Benz dealer network across Spain. The CLA 200 may exceed the MOVES III price cap for full subsidies — buyers should verify eligibility at launch. Competes with BMW i4 eDrive35 and Audi A6 e-tron in Spain.
