notes: 'BYD Seal U Design is the premium trim with 87 kWh LFP Blade Battery and 160 kW (218 CV) motor. WLTP range: 500-620 km. 0-100 km/h in 9.6-9.9s. Top speed 160 km/h. Design trim includes: 15" rotating touchscreen, ventilated front seats, head-up display, Harman Kardon premium audio, 19" alloy wheels, panoramic glass roof, L2 autonomous driving assistance, 360° camera, wireless Apple CarPlay/Android Auto, 11 kW AC charging (3-phase), 140 kW DC fast charging. Trunk: 552-1,440 liters. Weight: 2,070 kg. Towing capacity: 1,000 kg (braked). 8-year/250,000 km battery warranty with LFP chemistry for worry-free daily 100% charging. Made in China. Eligible for company car tax benefits in Italy (0.25% list price for BEVs).'
