notes: "The Lyriq-V offers genuine supercar performance (3.3s 0-100) in a luxury SUV\nat a competitive price point. At ~€109k, it's cheaper than BMW iX M60 while\ndelivering comparable or superior performance with a larger battery.\n\nFirst electric Cadillac V-Series model - extends performance brand heritage\ninto the electric era. Appeals to buyers wanting American performance character\nwith electric efficiency."
