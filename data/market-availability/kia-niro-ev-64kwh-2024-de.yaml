  value_proposition: >
    Kia Niro EV offers excellent value as a practical family electric SUV at €43,990.
    With 460km WLTP range, comprehensive safety features, and Kia's industry-leading
    7-year/150,000km warranty, it's positioned as a more traditional alternative to the
    sportier EV6. Popular choice for buyers seeking proven EV technology in conventional
    SUV packaging. Company car drivers benefit from 0.25% tax rate (saves €3,939/year
    vs ICE). Slightly more expensive than sister model Kona Electric but offers distinctive
    Kia design and features. Strong residual values expected based on Kia's reputation.
    Ideal for families prioritizing practicality over cutting-edge performance.

# Notes
notes: |
  Kia Niro EV is Kia's mainstream electric SUV, positioned between the smaller EV3 and
  sportier EV6. Second-generation model (2022+) offers significantly improved range,
  design, and technology compared to first generation. 400V architecture (not 800V like
  EV6) means slower DC fast charging (85kW max vs 240kW on EV6). Heat pump available
  as option (essential for German winters). V2L capability allows using vehicle as
  power source (3.6kW). Distinctive design with flush door handles and Star Map LED
  signature. Popular choice for families seeking practical electric SUV without premium
  price tag. More conventional styling than EV6 appeals to traditional buyers. Strong
  residual values expected (~54% after 3 years). Popular in company car segment due to
  0.25% tax rate. Longer delivery times than EV6 due to high demand.

