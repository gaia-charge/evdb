# Market Notes
notes: |
  Hyundai Kona Electric Standard Range 2025 is the affordable entry to the lineup.
  48.4 kWh LFP battery is lower range but more durable and can be charged to 100% daily.
  
  Available through Hyundai dealership network across Germany.
  
  Key competitors:
  - VW ID.3 Pro (€36,900) - similar price, more range (426 km WLTP)
  - MG4 Standard Range (€28,990) - much cheaper, similar range
  - Dacia Spring (€22,750) - much cheaper, less range/features
  - Opel Corsa Electric (€36,990) - similar price, less range
  
  Strong value with V2L, heat pump, and full ADAS suite as standard.

