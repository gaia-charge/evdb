  notes: >
    2024 Kia EV6 GT German market data with comprehensive pricing, incentives, and buyer insights.

    Key highlights:
    - €64,990 base price (+€11,000 vs Long Range AWD) for 576 hp performance
    - Company car benefit: 0.25% taxation saves €5,849/year vs 1.0% ICE rate
    - Total annual benefits: €6,589 (company car tax + Kfz-Steuer + THG-Quote)
    - GT Signature (Cyber Gray Matte + Solar Roof) is most popular config at €68,365 (45%)
    - 14-week delivery (faster than Long Range due to higher margins, prioritized production)
    - Insurance group 28 (higher than group 25 Long Range, +€300-400/year premiums)
    - Real-world consumption: 23.0 kWh/100km (higher due to performance capability and 21" wheels)
    - Popular among performance enthusiasts cross-shopping Tesla Model 3 Performance, BMW i4 M50
    - 3.5s 0-100 km/h makes it one of the quickest EVs under €70k (beats Tesla Model 3 Performance 3.1s slightly, but much cheaper than Porsche Taycan 4S)
    - 80% of GT buyers opt for matte colors (Cyber Gray or Moonscape Gray) for €1,195 premium
    - GT-exclusive Yellow-Green color is rare (10% of sales) but has collector appeal
    - Company car drivers pay near-zero net monthly cost (€3.32/mo after tax benefits!)
    - Performance positioning: cheaper than Porsche Taycan 4S (€116k), faster than BMW i4 M50 (4.7s), similar to Tesla Model 3 Performance (€56k)

