notes: |
  **Market Positioning in Germany:**

  The Peugeot e-2008 Allure at €39,490 (€40,580 on-the-road) is the sweet spot in the 
  B-SUV segment - better equipped than base Active without GT's premium pricing.

  **vs Direct Competitors:**
  - **Opel Mokka-e Ultimate (€38,990)**: €500 cheaper, but 310L trunk vs 405L e-2008
  - **Jeep Avenger (€40,000)**: Similar price, unique styling, 380L trunk
  - **Nissan Ariya 63kWh (€50,000)**: €10k more, larger C-SUV, more space/range
  - **MG ZS EV (€36,000)**: €3,500 cheaper, larger, less premium feel
  - **Kia Niro EV (€43,000)**: €3,500 more, larger, better range (460km)

  **Key Selling Points:**
  - Best-in-class trunk space (405L) for CMP platform B-SUVs
  - Excellent value for equipment (10" screen, 3D i-Cockpit, LED lights, 17" alloys)
  - 406km WLTP range suitable for daily use and occasional trips
  - Well-equipped mid-range trim (€4,000 less than GT)
  - Strong Stellantis dealer network (850+ locations)
  - Practical SUV seating position and visibility

  **Company Car Benefits:**
  With 0.25% monthly taxation (€99/month vs ~€1,150 for ICE equivalent), the e-2008 
  Allure saves company car drivers ~€12,600 per year in taxes.

  **Allure Trim Advantages:**
  - 10" touchscreen (7" on Active)
  - 3D i-Cockpit digital display (analog on Active)
  - 17" alloy wheels (16" steel on Active)
  - LED headlights (halogen on Active)
  - Automatic climate control (manual on Active)
  - Roof rails (not on Active)
  - TEP/cloth upholstery (basic cloth on Active)

  **Recommended Options:**
  - Drive Assist Package (€1,290) - Adaptive cruise essential for highway driving
  - Winter Package (€590) - Heated seats/wheel very useful
  - Park Assist Package (€890) - Automatic parking helpful in cities
  - Total with options: €42,950

  **Target Buyer:**
  Practical-minded families and professionals seeking a well-equipped, spacious electric 
  B-SUV for daily commuting, school runs, and weekend trips. The 405L trunk and raised 
  seating position make it ideal for young families who need practicality without the 
  size/cost of a larger C-SUV like Nissan Ariya or Kia EV6.
