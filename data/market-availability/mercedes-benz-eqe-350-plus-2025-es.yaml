market_notes: |
  The Mercedes EQE 350+ 2025 replaces the EQE 350 with a larger 96 kWh battery
  (up from 89 kWh), providing improved 689 km WLTP range (up to 778 km in urban use).
  Rear-wheel drive with 292 CV, 0-100 km/h in 6.5 seconds. DC charging at 170 kW
  allows 10-80% in 32 minutes. Competes strongly against BMW i5 and Audi A6 e-tron
  in the executive electric sedan segment in Spain.

