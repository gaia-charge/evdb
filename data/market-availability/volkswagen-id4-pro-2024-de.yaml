# Notes
notes: |
  Volkswagen ID.4 is the best-selling electric SUV in Germany (2023).
  Pro trim offers excellent balance of range and pricing.
  Built in Zwickau, Germany (shorter delivery times for domestic market).
  Eligible for German EV incentives until end of 2024.
  Additional trade-in bonus available for old vehicles until mid-2024.
  All-wheel drive GTX variant also available at higher price point.

