notes: "The BYD Dolphin Design is the premium variant with all features included as standard. Highlights include ventilated seats, panoramic glass roof, 360-degree camera system, enhanced audio with subwoofer, and the most comprehensive driver assistance package in the segment.\nWith the 60.4 kWh battery (427 km WLTP / 365 km real-world), powerful 150 kW motor, and premium equipment, the Design competes with vehicles like the MINI Electric and VW ID.3 Pro S. The 0.25% company car tax rate makes it particularly attractive for business users seeking a premium compact EV.\nStandard equipment includes everything from the Comfort trim plus: - Ventilated front seats - Heated steering wheel - Panoramic glass roof - 360-degree camera - Power tailgate - Enhanced audio system - Multi-color ambient lighting - Remote parking assist"
