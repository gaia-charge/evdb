notes: |
  The Opel Frontera Electric Long Range at €33,490 addresses the main
  limitations of the standard variant:

  **Key Improvements over 44 kWh:**
  - 400 km WLTP range (vs 305 km) - suitable for longer trips
  - 113 kW motor (vs 83 kW) - noticeably more responsive
  - 11 kW 3-phase AC charging (vs 7.4 kW) - much faster home charging
  - Heat pump standard - better winter efficiency

  **Key Advantages:**
  - Affordable long-range electric SUV
  - Spacious interior (460L boot, 1,600L seats down)
  - Low company car tax: €84/month
  - Practical boxy design maximizes space
  - Strong Opel dealer network (850+ in Germany)

  **Best for:**
  - Families needing range flexibility
  - Commuters with longer distances
  - Company car drivers wanting affordable EV with decent range
  - Buyers who value practical space over sportiness

