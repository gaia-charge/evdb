# Market Context & Insights
metadata:
  data_quality: verified
  data_source: manufacturer
  created_at: "2026-02-07"
  last_verified_at: "2026-02-07"
  notes: |
    Pricing and incentives as of February 2026. US production at HMGMA Georgia plant
    started October 2024, enabling full $7,500 IRA tax credit eligibility. Free Electrify
    America charging for 2 years (unlimited 30-min sessions). NACS adapter program for
    Tesla Supercharger access launched Q2 2024. EPA range: 303 miles. 800V ultra-fast
    charging: 10-80% in 18 minutes at 350kW stations. Vehicle-to-Load (V2L) standard.
  sources:
  - https://www.hyundai.com/us/en/vehicles/ioniq-5/specs
  - https://www.fueleconomy.gov/feg/Find.do?action=sbs&id=44903
  - https://www.caranddriver.com/hyundai/ioniq-5
  - https://www.motortrend.com/reviews/2023-hyundai-ioniq-5-first-test-review/
notes: "**Market Position:**\nThe Hyundai Ioniq 5 Long Range AWD is one of the most awarded and popular electric crossovers in the United States, competing directly with Tesla Model Y, Ford Mustang Mach-E, and Kia EV6 (sister vehicle). At $48,500 before incentives, it offers exceptional value with cutting-edge technology.\n\n**Key Selling Points:**\n\n1. **800V Ultra-Fast Charging** 🚀\n   - Industry-leading 800V E-GMP platform (shared with Genesis GV60, Kia EV6)\n   - 238 kW (350 kW capable) DC fast charging\n   - **10-80% in just 18 minutes** at Electrify America 350kW stations\n   - 2x faster than most competitors (400V architecture charges at ~50-150kW)\n   - Real-world: Add 200+ miles in 18 minutes\n\n2. **Awards & Recognition** 🏆\n   - 2022 World Car of the Year\n   - 2023 North American Utility Vehicle of the Year\n   - 2022 MotorTrend Car of the Year\n   - 2022 Car and Driver 10Best\n   - 2023 Kelley Blue Book Best Buy Award\n   - Over 35 major automotive awards worldwide\n\n3. **Built in USA - Full IRA Tax Credit** 🇺🇸\n   - Manufactured at Hyundai Motor Group Metaplant America (HMGMA) in Bryan County, Georgia\n   - Production started October 2024 ($7.6 billion investment, 8,500 jobs)\n   - Qualifies for **full $7,500 federal IRA tax credit** (instant point-of-sale discount)\n   - Earlier Korea-built models (pre-Oct 2024) may only qualify for partial credit\n   - Battery partnership with SK On (US battery production)\n\n4. **Incredible Incentive Stacking** 💰\n   - Federal credit: $7,500 (instant discount)\n   - Oregon income-qualified: +$7,500 = **$15,000 total savings!**\n   - Colorado: +$5,000 = **$12,500 total**\n   - Massachusetts: +$3,500 = **$11,000 total**\n   - New York: +$2,000 = **$9,500 total**\n   - New Jersey: +$4,000 = **$11,500 total** (SE trim only)\n   - Washington: +$4,500 sales tax exemption = **$12,000 total**\n   - **Best-case scenario**: $48,500 - $15,000 (OR) = **$33,500 effective price!**\n\n5. **Electrify America Free Charging** ⚡\n   - 2 years unlimited 30-minute DC fast charging sessions\n   - Access to 850+ EA stations with 350kW ultra-fast chargers\n   - Estimated value: $1,200 over 2 years\n   - Covers ~60 kWh per session (enough for 10-80% charge)\n   - No subscription fees, no per-kWh costs for 2 years\n\n6. **Tesla Supercharger Access** 🔌\n   - Free NACS adapter program (launched 2024)\n   - Unlocks 17,000+ Tesla Supercharger stalls\n   - Requires software update (v23+) and adapter installation\n   - Doubles available DC fast charging options\n   - EA + Tesla = 24,000+ fast charging stalls accessible\n\n7. **Vehicle-to-Load (V2L) Capability** 🏕️\n   - Standard 3.6 kW output (120V outlets in cabin + exterior port)\n   - Power camping equipment, power tools, tailgating appliances\n   - Emergency backup for home essentials during power outages\n   - Can power electric grill, TV, mini fridge, air compressor simultaneously\n   - Unique feature vs Tesla Model Y (no V2L)\n\n8. **E-GMP Platform Advantages** 🏗️\n   - Dedicated EV platform (not adapted from ICE)\n   - 3-meter wheelbase = exceptional interior space and flat floor\n   - Battery under floor = low center of gravity, excellent handling\n   - 800V architecture = faster charging, lighter wiring, better efficiency\n   - Shared with Genesis GV60, Kia EV6, EV9 (proven reliability)\n\n**Competitive Positioning:**\n\nvs **Tesla Model Y Long Range AWD ($47,990)**:\n- $510 more expensive before incentives\n- Similar range: 303 mi EPA (Ioniq 5) vs 330 mi EPA (Model Y)\n- **Ioniq 5 charges 2x faster**: 18 min 10-80% vs 27 min (250 kW Tesla)\n- Ioniq 5 has V2L, Tesla doesn't\n- Tesla has larger Supercharger network (17,000 stalls)\n- Ioniq 5 has better build quality, physical buttons, dealer network\n- **After incentives**: Ioniq 5 = $41,000 (federal), Model Y = $40,490\n\nvs **Ford Mustang Mach-E Extended Range AWD ($56,295)**:\n- $7,795 cheaper before incentives\n- Better range: 303 mi EPA (Ioniq 5) vs 270 mi EPA (Mach-E)\n- **Much faster charging**: 18 min 10-80% vs 38 min (150 kW Ford)\n- Mach-E has V2H home backup, Ioniq 5 only has V2L\n\
  - Mach-E has traditional dealer network (2,800 EV dealers)\n- **After incentives**: Ioniq 5 = $41,000, Mach-E = $48,795 (better value!)\n\nvs **Kia EV6 Long Range AWD ($48,700)**:\n- $200 cheaper (sister vehicle, same E-GMP platform)\n- Identical range: 303 mi EPA (same battery, motors, platform)\n- Identical charging: 18 min 10-80% (same 800V architecture)\n- EV6 has sportier styling, Ioniq 5 has retro-futuristic design\n- Ioniq 5 has more interior space (3m wheelbase advantage)\n- **After incentives**: Both = $41,000-41,200 (essentially tied)\n\nvs **BMW iX1 xDrive30 ($54,200 EUR ≈ $59,000 USD)**:\n- $10,500 cheaper before incentives\n- Better range: 303 mi EPA vs ~273 mi EPA (439 km WLTP)\n- **Much faster charging**: 18 min 10-80% vs 29 min (130 kW BMW)\n- BMW has premium brand prestige, better dealer network\n- Ioniq 5 better value, faster charging, more range\n\nvs **Volkswagen ID.4 Pro AWD ($48,995)**:\n- $495 cheaper before incentives\n- Better range: 303 mi EPA vs 275 mi EPA (ID.4)\n- **Faster charging**: 18 min 10-80% vs 38 min (170 kW VW)\n- ID.4 built in USA (Chattanooga TN), qualifies for full $7,500\n- Ioniq 5 has more interior space, better tech, V2L\n- **After incentives**: Ioniq 5 = $41,000, ID.4 = $41,495\n\n**Real-World Performance:**\n\nRange (EPA 303 miles / 487 km):\n- Mixed driving: **290 miles real-world** (470 km, 96% EPA efficiency)\n- Highway @75 mph: **260 miles** (418 km, 86% efficiency)\n- Cold weather @20°F: **210 miles** (338 km, 69% efficiency, 31% loss)\n- City driving: **340 miles** (547 km, 112% EPA, excellent regen braking)\n\nConsumption:\n- EPA rated: 20.8 kWh/100 km (76 MPGe combined)\n- Real-world mixed: **21.5 kWh/100 km** (72 MPGe, very good)\n- Highway @75 mph: **25.2 kWh/100 km** (62 MPGe)\n- City: **18.5 kWh/100 km** (84 MPGe, regen braking helps)\n\nCharging Performance:\n- **Electrify America 350kW**: 10-80% in 18 minutes (238 kW peak)\n- Electrify America 150kW: 10-80% in 26 minutes (150 kW limited by station)\n- Tesla Supercharger 250kW: 10-80% in 22 minutes (limited to ~180 kW via NACS adapter)\n- Home L2 (11 kW): 0-100% in 7.4 hours (overnight charging)\n- Home L2 (7.2 kW): 0-100% in 11 hours\n\n**Popular Configurations & Pricing:**\n\n1. **Base Family - SE Long Range AWD** ($46,000)\n   - Best value, still well-equipped\n   - 303 mi EPA range, 19\" wheels\n   - Highway Driving Assist (HDA) Level 2 ADAS\n   - 12.3\" dual displays, wireless CarPlay/Android Auto\n   - Heat pump, V2L, all safety features\n   - After federal credit: **$38,500**\n   - After federal + CO: **$33,500**\n\n2. **Popular Mid-Level - SEL Long Range AWD** ($48,500 + $6,500 packages)\n   - Most popular configuration (60% of sales)\n   - Adds Convenience Package ($3,500): HDA2, AR HUD, 360° camera, digital mirrors\n   - Adds Premium Package ($2,500): panoramic solar roof, Bose audio, ventilated seats\n   - Total: $55,000 configured\n   - After federal credit: **$47,500**\n   - After federal + CO: **$42,500**\n   - After federal + OR (income-qualified): **$40,000**\n\n3. **Fully Loaded - Limited Long Range AWD** ($56,000)\n   - Top trim, everything included\n   - Convenience Package standard: HDA2, AR HUD, 360° camera\n   - Premium Package standard: solar roof, Bose, ventilated/heated seats\n   - Relaxation seats (power recline), 20\" wheels\n   - Total: $59,000 with options\n   - After federal credit: **$51,500**\n   - After federal + OR (income-qualified): **$44,000**\n\n**Incentive Scenarios:**\n\nCalifornia buyer (standard income):\n- SEL configured: $55,000\n- Federal credit: -$7,500\n- **Effective price: $47,500** (14% discount)\n\nColorado buyer:\n- SEL configured: $55,000\n- Federal credit: -$7,500\n- Colorado credit: -$5,000\n- **Effective price: $42,500** (23% discount!)\n\nOregon buyer (income-qualified, <$125k household):\n- SEL configured: $55,000\n- Federal credit: -$7,500\n- Oregon rebate: -$7,500\n- **Effective price: $40,000** (27% discount!!)\n\nMassachusetts buyer:\n- SEL configured: $55,000\n- Federal credit: -$7,500\n- MA rebate: -$3,500\n- **Effective price: $44,000** (20% discount)\n\
  \n**Market Share & Sales:**\n- 33,650 units sold in US (2023)\n- 6th best-selling EV in America (after Tesla Model Y/3/X, Ford Mach-E, Chevy Bolt)\n- Market share: ~3.2% of US EV market\n- Popular in California (25% of sales), strong in tech-forward states (WA, CO, OR, MA, NJ)\n- Average sale price: $52,500 (most buy SEL trim with packages)\n\n**Dealer Network & Support:**\n- 820+ Hyundai dealers in US (300+ certified EV dealers with DC fast chargers)\n- Strong service network (much larger than Tesla's ~195 service centers)\n- 10-year/100,000-mile powertrain warranty (best in industry!)\n- 8-year/100,000-mile battery warranty with 70% capacity guarantee\n- 5-year/60,000-mile comprehensive warranty\n- 3-year/36,000-mile complimentary maintenance (oil changes N/A, but tire rotations, inspections)\n- Bluelink connected services (remote climate, charging control, vehicle location)\n\n**Best For:**\n- Buyers prioritizing ultra-fast charging (800V architecture, 18-min 10-80%)\n- Award-winning design enthusiasts (retro-futuristic styling)\n- Tech-forward buyers (AR HUD, digital mirrors, HDA2, V2L)\n- Value seekers with excellent incentive stacking ($15,000 total in OR!)\n- Families needing spacious crossover (3m wheelbase = exceptional interior space)\n- Outdoor enthusiasts using V2L for camping/tailgating\n- Home charging primary, road trips occasional (303 mi range + 18-min charging)\n\n**Not Ideal For:**\n- Maximum range priority (303 mi decent but not class-leading vs 330 mi Model Y)\n- Extreme cold climate frequent driving (31% winter range loss without heat pump upgrade)\n- Buyers wanting largest cargo space (854L Model Y vs ~530L Ioniq 5)\n- Tesla Supercharger-dependent buyers (NACS adapter works but not native integration)\n- Minimal dealer interaction preference (Tesla OTA updates vs dealer service visits)\n\n**Insurance & Operating Costs:**\n- Insurance: ~$2,200/year average (moderate for EV, higher than ICE)\n- Charging cost (home, $0.13/kWh): ~$1,100/year for 12,000 miles\n- Charging cost (public DC, $0.43/kWh): ~$3,400/year (2 years free with EA!)\n- Maintenance: Minimal (tire rotations, cabin filters, brake fluid every 3 years)\n- No oil changes, transmission service, spark plugs, exhaust repairs\n- Brake pads last 100,000+ miles (regenerative braking)\n- Annual cost savings vs $35k ICE SUV: ~$2,200/year (fuel + maintenance)\n\n**Delivery & Availability:**\n- US production (Georgia) started October 2024\n- 8-week delivery for in-stock colors (White, Black, Cyber Grey)\n- 10-12 weeks for custom orders (matte colors, specific packages)\n- Dealer inventory improving (was 16+ weeks in 2023, now 8 weeks)\n- No dealer markups (MSRP pricing enforced by Hyundai)\n\n**Software & Updates:**\n- Over-the-air (OTA) software updates supported\n- Infotainment updates: Yes (AAOS-based system)\n- Powertrain/battery updates: No (requires dealer visit)\n- Recent updates: improved charging efficiency, HDA2 enhancements, NACS adapter support\n- Bluelink app: remote climate, charging control, vehicle location, valet mode\n\n**Resale Value:**\n- 3-year retention: ~55-60% (moderate for EVs)\n- Strong demand in used market ($38k-42k for 2022-2023 models with 20k miles)\n- Awards boost resale confidence (NAUT Winner, WCOTY)\n- US production improves value perception (IRA tax credit eligibility)\n\nThe Hyundai Ioniq 5 Long Range AWD offers exceptional value at $48,500 before incentives. With industry-leading 800V ultra-fast charging (18-min 10-80%), award-winning design, and incredible incentive stacking (up to $15,000 in Oregon!), it's one of the best electric crossovers for American buyers. The combination of US production (full IRA credit), 2 years free Electrify America charging, V2L capability, and spacious E-GMP platform makes it a compelling alternative to Tesla Model Y at competitive pricing."
