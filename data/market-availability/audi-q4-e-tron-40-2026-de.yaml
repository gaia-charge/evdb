# Company Car Taxation
company_car_taxation:
  gross_list_price: 54900
  tax_rate_percent: 0.25
  monthly_taxable_benefit: 137.25
  notes: |
    For company car drivers with €60,000 gross salary:
    - Monthly benefit: €137.25
    - Tax (35% rate): €48.04/month (€576/year)
    - Social security (20%): €27.45/month (€329/year)
    - Total annual cost to employee: ~€905
    
    Compared to equivalent ICE Audi Q5 (€60,000 @ 1% = €600/month = €7,200/year tax cost),
    BEV saves company car driver approximately €6,295 per year.
    
    The Q4 40 e-tron is extremely attractive for company car drivers due to low base
    price keeping most configurations under €70,000 threshold (0.25% vs 0.5% taxation).

# Market Notes
notes: |
  Audi Q4 40 e-tron 2026 is the entry-level RWD variant offering exceptional range
  and efficiency. With the improved 85kWh battery and 590km WLTP range, it's the
  most efficient Q4 variant.
  
  Available through Audi dealership network across Germany. Order online via audi.de
  or at any Audi center. Delivery time currently 10 weeks (shortest in Q4 range).
  
  2026 updates include:
  - Larger 85kWh battery (80kWh usable) vs 82kWh total in 2024
  - More powerful motor (210kW vs 150kW in 2024) with better acceleration
  - Improved DC charging to 150kW peak
  - Enhanced MMI with AI features
  - Heat pump now standard
  - New Aurora Violet color option
  
  Key competitors in Germany:
  - Tesla Model Y RWD (€44,990) - cheaper, less premium, shorter range
  - BMW iX1 sDrive20 (€52,500) - smaller, similar price
  - Mercedes-Benz EQA 250 (€58,000) - more expensive, shorter range
  - Volkswagen ID.5 Pro (€52,000) - sister model, less premium, similar range
  
  Q4 40 e-tron offers best balance of range, premium quality, and value in the
  compact premium SUV segment. Best-selling Q4 variant in most European markets.
  
  Company car benefit: With base price of €54,900, almost all configurations stay
  under €70,000 threshold for 0.25% taxation, making it one of the most attractive
  premium EVs for company car drivers in Germany.
  
  Winter range typically 430-460km in real-world conditions (-20°C) thanks to 
  improved heat pump efficiency in 2026 model year.

