notes: |
  The Mustang Mach-E GT is Ford's high-performance electric SUV, delivering 
  487 hp and 3.7-second 0-100 km/h acceleration. Priced at €74,990, it competes 
  with Tesla Model Y Performance, BMW iX xDrive50, and Audi Q8 e-tron SQ8. 
  Standard equipment includes MagneRide adaptive suspension, Brembo brakes, 
  B&O audio, panoramic roof, and premium leather sport seats. As a company car, 
  taxed at 0.5% (above €70k threshold), but still favorable vs. ICE. V2H/V2G 
  capability requires Ford Charge Station Pro (80A). BlueCruise hands-free 
  driving available on German autobahns. GT Performance Package adds track mode 
  with data logging. Popular with driving enthusiasts who want electric 
  performance without compromising practicality.

