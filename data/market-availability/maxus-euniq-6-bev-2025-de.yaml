notes: The MAXUS Euniq 6 at €53,491 is relatively expensive for its specifications compared to competitors like the VW ID.4 (from ~€40,000) or Tesla Model Y (from ~€45,000), which offer better range and faster charging. However, the Euniq 6 compensates with very generous standard equipment (leather, panoramic roof, 360° camera all included) and a spacious 754-liter trunk. Main weakness is the low 75 kW DC charging speed. Best suited for buyers who prioritize space and equipment over charging speed and range. Qualifies for 0.25% company car tax rate.
