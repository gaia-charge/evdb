notes: |
  Tesla Model S 2025 features a significant price reduction to €94,990 (down from €99,990 in 2024)
  to better compete with Mercedes EQS, Porsche Taycan, and BMW i7. This makes it the most
  affordable flagship electric sedan with supercar performance (3.2s 0-100 km/h).

  2025 Updates:
  - Base price reduced by €5,000 to €94,990
  - Enhanced cabin noise insulation
  - Updated Autopilot software (2025.x firmware)
  - Improved delivery times (6 weeks vs 8 weeks in 2024)
  - Slightly improved efficiency and range

  Advantages vs competition:
  - €22,000 cheaper than Mercedes EQS 450+ (€116,950)
  - €24,000 cheaper than Porsche Taycan 4S (€118,737)
  - Much faster acceleration: 3.2s vs EQS 6.2s, Taycan 4.0s
  - Best Supercharger network access
  - Direct sales, no dealer markup

  Subject to 0.5% company car tax rate (vehicles over €70,000). No longer
  eligible for Umweltbonus. Premium Connectivity subscription required for
  full feature access after first year.

  Company car benefit: €237/month (vs €287/month for EQS, saving €600/year in tax benefit value)

