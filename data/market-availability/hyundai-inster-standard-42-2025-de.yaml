notes: |
  The Hyundai INSTER Standard 42 kWh at €23,900 is one of the best-value EVs in Germany:

  **Key Advantages:**
  - Sub-€24,000 starting price
  - 327 km WLTP range - sufficient for daily city use
  - DC fast charging 10-80% in 30 minutes
  - Comprehensive ADAS (SmartSense)
  - 5-year warranty with unlimited km
  - Award-winning (Goldenes Lenkrad 2025)
  - Excellent efficiency: 14.3 kWh/100km

  **Considerations:**
  - 71 kW motor is modest (11.7s 0-100)
  - Hard plastics in interior
  - No heated seats on base Select trim
  - Small boot (238-351L)
  - Not rated for towing

  **Best for:**
  - City/suburban commuters
  - First-time EV buyers on a budget
  - Company car drivers (€60/month tax)
  - Second car for families

