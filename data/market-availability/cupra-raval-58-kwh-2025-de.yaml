market_notes: >
  CUPRA Raval 58 kWh offers 440 km WLTP range at €29,990 — strong value
  in the affordable long-range EV segment. Competes with Renault 5 E-Tech
  Techno 52 (€27,900), Mini Cooper SE (€32,900), and VW ID.2 (when available).
  Includes 360-degree camera and auto-parking as standard. VZ Sport Package
  adds proper sporty character. Expected to be the sweet spot variant for
  buyers wanting range and style. Strong CUPRA brand momentum in Germany.

