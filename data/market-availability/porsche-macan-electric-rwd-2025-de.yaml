    At €69,850, the Macan Electric RWD qualifies for the favorable 0.25%  monthly company car tax rate (vs 1% for vehicles over €70,000). Monthly  taxable benefit: only €174.63/month. This is a massive tax advantage —  a comparable Porsche Macan 4S (€84,400) would cost €844/month taxable  benefit at 1%. Porsche deliberately priced this under the threshold.
