notes: |
  The 2025 Volvo EX90 Twin Motor at €86,500 continues as the AWD flagship.
  Same price as 2024 Twin Motor Performance. Above €70k company car threshold
  (1% taxation = €865/month taxable benefit).
  
  2025 updates: Marginally improved range (610 km WLTP vs 600), refined
  software, comfort-tuned acceleration. Full LiDAR, bidirectional charging,
  air suspension all standard.
  
  Competes with: Mercedes EQS SUV 450+ (€115,900), BMW iX xDrive50 (€99,900),
  Audi Q8 e-tron 55 (€90,000). Significantly undercuts Mercedes and BMW.

