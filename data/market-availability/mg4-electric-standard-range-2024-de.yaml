  last_updated: "2024-02-08"
  notes: |
    MG4 Standard Range is the most affordable new EV in Germany under €30k.
    350km WLTP range sufficient for daily commuting and urban use.
    Single-phase AC charging (6.6kW) adequate for overnight home charging.
    DC charging at 87kW takes ~38 min (10-80%) - decent for battery size.
    Heat pump optional (€900) but highly recommended for winter efficiency.
    Best choice for budget-conscious buyers or second family car.
    With Umweltbonus (€3,000), effective price is €26,990 (ends Dec 2024).
    7-year/175,000km warranty provides peace of mind.
