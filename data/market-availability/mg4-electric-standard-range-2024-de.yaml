# Metadata
metadata:
  data_quality: verified
  sources:
    - https://www.mgmotor.de/mg4-electric
    - https://www.adac.de/rund-ums-fahrzeug/tests/elektromobilitaet/mg4-test/
    - https://www.auto-motor-und-sport.de/fahrbericht/mg4-test/
  created_at: "2024-02-08"
  last_updated: "2024-02-08"
  notes: |
    MG4 Standard Range is exceptional value at €29,990 - €10,000 less than VW ID.3.
    Rear-wheel drive provides engaging handling uncommon in affordable EVs.
    350km WLTP range (310km real-world) adequate for daily commuting.
    Standard heat pump improves winter range by ~15% vs competitors.
    Company car drivers save €2,430/year vs ICE (0.25% vs 1% tax rate).
    Perfect first EV for budget-conscious buyers or urban second car.
    Growing MG dealer network (120+ in Germany) provides good service coverage.
    Umweltbonus subsidy ended Dec 2023 - no federal incentive available.
    Strong alternative to used Tesla Model 3 or new VW ID.3.
