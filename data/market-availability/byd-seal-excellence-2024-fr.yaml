# Notes
notes: |
  BYD Seal Excellence AWD delivers supercar-level performance (3.8s 0-100 km/h, 530 hp)
  at a mid-range price point, competing directly with Tesla Model 3 Performance
  and BMW i4 M50.
  
  Dual-motor all-wheel-drive with 390 kW (530 hp) and 670 Nm torque.
  82.5 kWh Blade Battery (LFP chemistry) provides exceptional safety and longevity.
  570 km WLTP range (France specification).
  Premium standard equipment: Nappa leather, head-up display (HUD), Apple CarPlay/Android Auto,
  adaptive cruise control (ACC), heat pump.
  8-year/200,000 km battery warranty with 3000+ charge cycle durability.
  
  Excellent all-weather capability with AWD traction control.
  Lower total cost of ownership than comparable premium EVs.
  
  Available financing: LLD from €559/month (49 months, 10,000 km/year, no deposit).

