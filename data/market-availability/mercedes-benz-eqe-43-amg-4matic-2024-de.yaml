notes: >
  The Mercedes-AMG EQE 43 4MATIC is the performance variant of the EQE sedan,  offering dual-motor AWD with 476 hp and 4.2-second 0-100 km/h acceleration.  At €96,900, it represents a €24,000 (+33%) premium over the EQE 350+ base  model but provides significantly more power (350 kW vs 215 kW, +63%) and  AMG-specific features.

  Key competitive factors:
  - Exceptional performance: 0-100 km/h in 4.2 seconds (vs 6.4s base model)
  - AMG 4MATIC+ all-wheel drive with variable torque distribution
  - AMG RIDE CONTROL+ air suspension with adaptive damping (standard)
  - Rear-axle steering standard (up to 10°, optional €3,570 on base)
  - AMG Sound Experience with 3 sound modes
  - Optional AMG Dynamic Plus: 240 km/h top speed, Race mode, drift mode
  - Made in Germany (Bremen plant, AMG components from Affalterbach)
  - 10-year/250,000km battery warranty
  - 529 km WLTP range (vs 639 km base, -17% due to performance focus)

  Competitive positioning:
  - vs BMW i4 M50 (€74,900): AMG is €22,000 more (+29%), but has 85 kW more 
    power (350 vs 265 kW, +32%), rear-axle steering standard, longer range (529 
    vs 490 km WLTP), and Mercedes luxury
  - vs Porsche Taycan 4S (€116,000): AMG is €19,100 cheaper (-16%), similar 
    performance (4.2s vs 4.0s), better range (529 vs 431 km), but Porsche has 
    800V ultra-fast charging and brand prestige
  - vs Tesla Model S (€92,990): AMG is €3,910 more (+4%), Tesla has more power 
    (493 vs 476 hp) and range (634 vs 529 km), but AMG has Mercedes luxury, 
    better build quality, and dealer network

  Tax disadvantage for company cars:
  The €96,900 price significantly exceeds the €70,000 company car tax threshold,  resulting in standard 1% monthly benefit rate (€969/month) instead of favorable  0.25% rate. This costs company car drivers €3,488/year in extra taxes compared  to qualifying EVs under €70k. This makes the BMW i4 M50 (€74,900, also exceeds  €70k) and especially vehicles under €70k much more attractive for company  buyers despite lower performance.

  Popular configurations:
  - **AMG Signature**: €109,500 (Obsidian Black + AMG Night Package + Premium 
    Plus + 22kW charger + Parking Package, 35% of buyers)
  - **AMG Performance**: €122,780 (Selenite Grey + AMG Dynamic Plus + Carbon 
    Fiber + Night Package + Premium Plus + MBUX Hyperscreen + 21" wheels, 25% 
    of buyers)
  - **AMG Ultimate**: €131,705 (MANUFAKTUR Alpine Grey Magno + all packages 
    including Ceramic Brakes + Burmester 4D + DRIVE PILOT, 10% of buyers)

  Target buyer: Performance enthusiasts who want AMG driving dynamics with electric  efficiency, track-day capability with daily usability, Mercedes luxury with  zero emissions. Typical buyer is private, not company car (due to tax penalty),  aged 40-55, values performance and technology.

  Real-world ownership:
  - Range: 460 km mixed driving (529 km WLTP, 87% efficiency)
  - Highway: 380 km @ 130 km/h (72% efficiency, higher speeds)
  - Winter: 350 km @ 0°C with heat pump (66% efficiency)
  - Spirited AMG driving: 300-320 km (57-60% efficiency)
  - Consumption: 24.5 kWh/100km mixed, up to 30 kWh/100km spirited
  - Insurance: Group 29, approximately €2,800/year comprehensive
  - Annual costs: €8,900 (€2,800 insurance + €1,200 electricity @ €0.35/kWh 
    for 20,000 km + €900 service + €4,000 depreciation annual share)

