incentives:
- type: subsidy
  name: BAFA Umweltbonus
  amount: 0
  eligibility: "All BEVs"
  notes: "German federal EV subsidy ended December 2023"
- type: tax_credit
  name: Company Car Tax Benefit
  amount: 0
  eligibility: "BEVs up to €70,000 list price"
  notes: >
    The AMG EQE 43 base price (€96,900) significantly exceeds the €70,000  threshold, so the 0.25% rate does NOT apply. Standard 1% rate applies.

    Monthly benefit calculation (1% rate):
    - Gross list price: €96,900
    - Monthly benefit: €96,900 × 1% = €969/month
    - Annual taxable benefit: €11,628
    - Tax liability (40% bracket): €4,651/year

    If hypothetically under €70k threshold (0.25% rate):
    - Monthly benefit would be: €242.25/month (€2,907/year)
    - Tax liability (40% bracket): €1,163/year
    - Savings difference: €3,488/year

    The €70k threshold penalty costs company car drivers €3,488/year in extra  taxes compared to qualifying EVs. This makes the BMW i4 M50 (€74,900) and  Polestar 2 more attractive for company buyers despite being less powerful.

- type: tax_exemption
  name: Kfz-Steuer Exemption
  amount: 600
  eligibility: "All BEVs until 2030"
  notes: >
    Complete exemption from German vehicle tax until December 31, 2030.  Estimated annual savings of €600 for a luxury performance sedan of this class.

- type: rebate
  name: THG-Quote (GHG Quota Trading)
  amount: 300
  eligibility: "All BEV owners in Germany"
  notes: >
    BEV owners can sell their CO2 savings annually. Typical payout €250-350/year  depending on market rates. Can be claimed through third-party providers like  ADAC e-Charge or Geld für eAuto.

