market_notes: >
  The BYD Atto 3 Extended Range is sold in France as the "Comfort" trim (base) and "Design" trim (€40,990).
  Both trims feature the 60.5 kWh Blade Battery with 420 km WLTP range, 150 kW (204 hp) motor,
  0-100 km/h in 7.3 seconds, 160 km/h top speed. Standard equipment includes 11 kW 3-phase AC charging,
  88 kW DC fast charging, panoramic sunroof, 12.8" or 15.6" rotating touchscreen (depending on trim),
  Apple CarPlay/Android Auto, heated front seats, and 8-speaker audio system.
  Financing available from €379/month (LLD 49 months).

