notes: Entry-level MG4 at under €29,000 makes it one of the most affordable EVs in Germany. LFP battery offers excellent longevity. Only 6.6 kW AC charging is a drawback. 7-year/150,000 km warranty is class-leading. Short delivery times due to good availability. Very competitive with Dacia Spring, Citroën ë-C3, and Fiat 500e.
