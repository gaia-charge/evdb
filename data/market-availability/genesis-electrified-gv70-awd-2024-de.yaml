metadata:
  created_at: "2024-02-08"
  data_quality: verified
  notes: |
    Genesis Electrified GV70 offers exceptional value in premium EV segment.
    €74,900 includes equipment that costs €10,000+ extra on German rivals.
    800V ultra-fast charging (18 min 10-80%) beats most German competition.
    Industry-leading warranty (5yr/100k vehicle, 10yr/160k battery).
    Genesis agency model means transparent pricing - no dealer markup.
    Company car: just above €70k threshold, so 1% rate applies (not 0.25%).
    Competes strongly with EQE SUV, iX3, Q4 e-tron on value proposition.
  updated_at: "2024-02-08"
  sources:
  - https://www.genesis.com/de/de/genesis-electrified-gv70.html
