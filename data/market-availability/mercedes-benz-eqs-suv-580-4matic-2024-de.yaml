  - "https://www.adac.de/rund-ums-fahrzeug/autokatalog/marken-modelle/mercedes-benz/eqs-suv/"
  notes: "2024 German market pricing for Mercedes-Benz EQS SUV 580 4MATIC performance flagship. Base price €141,000 (€20,100 more than 450 4MATIC). Includes MBUX Hyperscreen (€8,925 option on other variants), Executive Rear Seat Package (€11,305 option), AMG Line (€7,735 option), Burmester 3D audio (€5,950 option), and 21-inch AMG wheels as standard - representing €33,915 in included upgrades. Offers 400kW (544hp) with 1,020 Nm torque and 4.5s 0-100 acceleration - faster than many sports cars. Range reduced to 536 km WLTP (450 km real-world) due to performance focus. Higher consumption: 26.2 kWh/100km real-world vs 23.6 for 450 4MATIC. Popular with executives wanting maximum performance in a luxury SUV. E-Active Body Control (€8,925) highly recommended for performance driving. Company car drivers save €8,460/year with 0.5% tax rate. Most popular configuration with all performance options ~€163k. Main competition: BMW iX M60 (€21k cheaper, faster), Tesla Model X Plaid (€6k cheaper, much faster but less luxurious). Typical buyer: successful entrepreneur/executive who wants Mercedes luxury + sports car performance in one package. Alternative: 450 4MATIC offers 90% of the luxury, 60% of the performance, €20k cheaper, 64km more range."
  updated_at: "2026-02-08"
