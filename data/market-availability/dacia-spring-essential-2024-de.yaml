notes: |
  **Germany-Specific Notes:**
  
  The Dacia Spring is extremely popular in Germany due to:
  1. BAFA subsidy brings price to €14,400 (cheapest new EV)
  2. Low company car tax (0.25% rule = €47/month benefit-in-kind)
  3. No road tax for EVs (€0/year vs €150-300 for ICE)
  4. Low insurance due to affordable replacement cost
  5. Urban parking advantages in many cities
  
  **Best Use Cases:**
  - City commuters (Berlin, Munich, Hamburg, Cologne)
  - Second household vehicle
  - Young drivers (affordable insurance)
  - Retirees (low running costs)
  - Delivery/courier services (urban logistics)
  
  **Not Recommended For:**
  - Autobahn long-distance (limited range, 125km/h top speed)
  - Cold climate regions without home charging
  - Single vehicle households
  - Families needing 5+ seats regularly
  
  **Comparison:**
  - vs Fiat 500e: Spring €14,400, 500e ~€25,000 (after subsidy)
  - vs Used Renault Zoe: Similar price, but Zoe offers more range/features
  - vs MG4: MG4 Standard Range €24,000 (after subsidy), but 350km range

