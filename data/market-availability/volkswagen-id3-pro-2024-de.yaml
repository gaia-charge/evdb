# Market-Specific Details
availability_status: available
available_from: "2024-01-01"
delivery_time_weeks: 6
notes: |
  2024 model with improved efficiency (13.6 vs 14.0 kWh/100km) and faster charging
  (170kW vs 150kW). Most popular ID.3 variant (~65% of sales). Heat pump now standard.
  Built at VW's carbon-neutral Zwickau factory. Pro offers 76% of Pro S range at 74% of price.

# Pricing
pricing:
  base_price: 43990
  price_including_vat: 43990
  vat_rate_percent: 19
  notes: |
    Base price for ID.3 Pro with 58 kWh battery and 125 kW motor.
    €2,575 cheaper than Pro S (€46,565) with 76% of the range.
    Best value in ID.3 lineup for most buyers.

