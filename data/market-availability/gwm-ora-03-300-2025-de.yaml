market_notes: >
  The GWM ORA 03 300 at €38,990 list price competes with the VW ID.3 and MG4 Electric. However, large
  dealer discounts (avg €12,772 per carwow) bring real transaction prices down to around €27,000-€30,000,
  making it extremely competitive. Main drawbacks are the small 228-liter trunk and slow 67 kW DC charging.
  Insurance classification is favorable: Haftpflicht 17, Teilkasko 21, Vollkasko 19. The 5-year warranty
  and comprehensive standard equipment are strong selling points. Qualifies for 0.25% company car tax.

