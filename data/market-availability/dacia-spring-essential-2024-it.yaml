market_notes: >
  Dacia Spring is Italy's most affordable electric car at €17,900. The 2024 facelift brings improved design,
  better safety features (6 airbags vs 2 previously), and new 10" touchscreen. Expression trim (Essential) includes:
  LED daytime running lights, manual climate control, 10" touchscreen with smartphone mirroring, 6 airbags,
  automatic emergency braking, lane keeping assist, traffic sign recognition, rear parking sensors. 
  Urban-focused city car with 220km WLTP range and 45 CV (33 kW) motor. Popular for city driving in Rome, Milan, and Turin.
  Free ZTL access in historic city centers.

