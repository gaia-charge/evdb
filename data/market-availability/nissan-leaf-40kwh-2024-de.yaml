market_position:
  segment: Entry-level mainstream C-segment electric hatchback
  competitors:
  - Renault Zoe ZE40 (€31,990) - €3k cheaper, CHAdeMO also limited, similar range
  - Peugeot e-208 Allure (€36,985) - Similar price, CCS charging, 43km more range (357km)
  - Opel Corsa-e Edition (€34,990) - Same price, CCS charging, platform sibling to e-208
  - MG4 Standard Range (€31,990) - €3k cheaper, CCS charging, similar range (350km)
  - Fiat 500e 42kWh Icon (€37,990) - Similar price, CCS, smaller/cuter but less practical
  - Volkswagen ID.3 Pure (€38,995) - €4k more, CCS charging, 84km more range (384km)

  positioning: >
    The LEAF 40kWh at €34,990 (Acenta) is the most affordable LEAF variant, targeting
    cost-conscious buyers prioritizing proven reliability over maximum range/tech.

    Main selling points: Lowest-priced LEAF, proven track record (650,000+ sold globally),
    extensive Nissan dealer network (650+ in Germany), adequate 270km WLTP range for
    urban/suburban daily commuting, V2G/V2H capability, comfortable e-Pedal one-pedal driving,
    8-year/160,000km battery warranty.

    Main weaknesses: CHAdeMO charging limits fast charging network access (10% of DC chargers),
    passive battery cooling (faster degradation than liquid-cooled rivals), only 50kW DC charging
    (vs 100-150kW competitors), only 6.6kW AC charging (vs 11kW competitors), no heat pump
    (28% winter range loss), modest 270km WLTP range (vs 350-500km competitors).

    Best for: Urban/suburban daily commuting (30-100km/day), home charging as primary,
    buyers prioritizing proven reliability and dealer network over latest tech, company car
    drivers benefiting from 0.25% tax rate (€3,149/year savings), budget-conscious EV buyers.

    Not ideal for: Frequent long-distance travel (limited range + CHAdeMO network),
    hot climates (passive cooling = faster battery degradation), buyers needing fast
    AC/DC charging, maximum range/efficiency seekers.

