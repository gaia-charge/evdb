- "Home charging users (CHAdeMO limitation less critical)"
- "LEAF loyalists (familiar with e-Pedal, V2G, ecosystem)"
- "Budget-conscious families wanting C-segment practicality"

best_for:
- Daily commuting up to 100km round trip (270km WLTP, 230km real-world)
- Urban and suburban driving (excellent 340km city range WLTP)
- Home charging as primary (6.6kW overnight = full charge)
- Buyers wanting proven EV with 14-year track record (launched 2010)
- Company car use (0.25% tax benefit saves €3,149/year vs ICE)
- Buyers with access to workplace AC charging (6.6kW = full charge during workday)

not_ideal_for:
- Frequent long-distance driving (270km WLTP, 230km real-world insufficient)
- CHAdeMO-limited fast charging network (only 10% of German DC chargers)
- Hot climate regions (passive cooling, faster battery degradation)
- Buyers needing fast AC charging (only 6.6kW vs 11kW competitors)
- Maximum technology/efficiency seekers (older 2017 platform)
- IONITY users (CCS-only network, LEAF incompatible)
- Frequent DC fast charging (passive cooling limits sustained charging speed)

