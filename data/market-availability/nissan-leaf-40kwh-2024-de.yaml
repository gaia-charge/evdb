chademO_limitation:
  issue: "Limited CHAdeMO fast charging network in Germany"
  details: >
    The LEAF uses CHAdeMO DC fast charging, which is becoming obsolete in Europe.
    CCS (Combined Charging System) is the European standard, used by VW, BMW, Tesla, etc.

    CHAdeMO charger availability in Germany (2024):
    - Total DC fast chargers: ~20,000+
    - CCS chargers: ~19,000 (95% of network)
    - CHAdeMO chargers: ~2,000 (10% of network, declining)
    - Many new charging stations install CCS only

    IONITY (350kW ultra-fast network): CCS ONLY, NO CHAdeMO
    Fastned: Mostly CCS, limited CHAdeMO
    EnBW: CCS primary, CHAdeMO at select locations
    Shell Recharge: Limited CHAdeMO coverage

    Combined with LEAF 40kWh's modest 270km WLTP range, this significantly limits
    long-distance travel. Plan routes carefully. Urban charging (AC) not affected.

  workaround: >
    Use apps like Chargemap, PlugShare to filter for CHAdeMO chargers.
    Prioritize home/workplace charging (6.6kW AC). With 270km range, most daily
    driving covered by overnight home charging. Road trips require careful planning.

warranty:
  vehicle:
    years: 3
    km: 100000
    notes: "Standard Nissan warranty. Shorter than Hyundai/Kia (5-7 years)."
  battery:
    years: 8
    km: 160000
    capacity_guarantee_percent: 70
    notes: >
      Battery warranty guarantees 70% capacity (25.9kWh usable, 189km WLTP) after 8 years/160,000km.
      However, LEAF's passive cooling means faster degradation than liquid-cooled batteries.
      Real-world reports: 4-5% loss/year in hot climates, 2-3% in moderate climates.
      After 8 years, expect 75-85% capacity (204-230km range) depending on climate and charging habits.
      40kWh variant degrades slightly slower than 62kWh due to less battery stress.

  roadside_assistance:
    years: 3
    coverage: EU-wide
    notes: "Nissan Assistance included for warranty period. Covers breakdowns, towing."

