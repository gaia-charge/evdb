notes: The Volvo EX30 Cross Country launched in Germany in late 2025, adding a rugged outdoor-styled option to the popular EX30 lineup. At €52,900, it commands a premium over the standard EX30 Twin Motor (€49,900) for its raised suspension, protective cladding, and Cross Country styling. The EX30 Cross Country appeals to customers wanting the compact EX30's urban practicality with extra all-weather confidence. Now also built in Ghent, Belgium to avoid EU import tariffs on Chinese-made EVs.
