# Notes
market_notes: >
  The Renault Megane E-Tech Electric EV40 Equilibre is the entry point into
  the award-winning Megane E-Tech range. Winner of the 2023 European Car of
  the Year, it offers 300 km WLTP range (255 km real-world) from the 40 kWh
  battery, making it ideal for daily commuting and urban driving.
  
  Standard equipment is impressively comprehensive for the price point,
  including the 12-inch touchscreen with Google built-in, panoramic glass
  roof, heat pump, and advanced driver assistance systems. The 85 kW DC
  fast charging capability allows 15-80% charging in just 30 minutes.
  
  At €41,000, it undercuts the Volkswagen ID.3 Pro while offering superior
  design and technology. The 0.25% company car tax rate makes it attractive
  for business users, with a monthly tax base of just €85 (1% of €10,250).
  
  Current delivery time is approximately 8 weeks. The federal environmental
  bonus of €3,000 reduces the effective price to €38,000.

