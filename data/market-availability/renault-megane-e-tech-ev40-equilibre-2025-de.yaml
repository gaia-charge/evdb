notes: |
  **The EV40 Value Proposition:**
  
  The Megane E-Tech EV40 offers European Car of the Year technology
  at an accessible €37,900 price point. However, the value calculation
  is nuanced:
  
  **Strengths:**
  - Same award-winning design and OpenR infotainment as EV60
  - €5,000 initial savings vs EV60 Techno
  - Perfect for urban use (255 km real-world range)
  - Lighter = better city efficiency
  - Lower depreciation and insurance costs
  
  **The €5,000 Premium Question:**
  After adding essential options (heat pump, 22kW charger, paint),
  EV40 costs ~€40,200. EV60 Techno base is €42,900 - only €2,700 more
  for 170 km extra range and 88 more hp.
  
  **Sales Reality:**
  Only 20% of Megane E-Tech buyers choose EV40. Most pay the €5k
  premium for EV60's peace of mind and flexibility.
  
  **Best Use Case:**
  EV40 is PERFECT for:
  - Dedicated city car (second vehicle)
  - Urban professionals with &lt;30 km commute
  - Workplace charging available
  - Budget-capped at €40-41k
  
  **Think Twice If:**
  - You need occasional long trips (&gt;200 km)
  - No reliable workplace/home charging
  - Want flexibility for future needs
  - Can stretch budget €2-3k more
  
  **Company Car Math:**
  At 0.25% taxation, EV40 saves €685/year vs ICE Megane.
  Over 3-year lease: €2,055 tax savings + €4,491 fuel savings = €6,546 total.
  This offsets €9,400 higher purchase price, making TCO favorable.
  
  **Bottom Line:**
  EV40 is a smart choice for the RIGHT buyer (city-only, home charging).
  For everyone else, EV60's €5k premium buys significant peace of mind
  and flexibility. Test drive both and honestly assess your range needs.
