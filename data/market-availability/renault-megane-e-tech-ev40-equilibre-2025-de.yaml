  configuration_advice: |
    **Critical Decision: EV40 vs EV60?**
    
    **Choose EV40 IF:**
    - Daily driving &lt;50 km (range = non-issue)
    - Reliable workplace/home charging
    - Want to save €5,000 vs EV60
    - Premium tech more important than range
    - Budget max €42-43k with options
    
    **Choose EV60 IF:**
    - Any road trips or weekend drives
    - Daily driving 50-100+ km
    - Want peace of mind with range
    - Value long-term flexibility
    - Can afford €5k premium
    
    **Recommended EV40 Configuration (€40,200):**
    - Base EV40 Equilibre: €37,900
    - Heat Pump: €1,000 (ESSENTIAL for Germany)
    - 22kW AC Charger: €500 (faster home charging)
    - Metallic Paint: €800
    
    Total: €40,200 - gets you usable year-round city EV
    
    **Optional Upgrades:**
    - Vision Pack (€900) - adds 360° camera, very useful for city
    - Comfort Pack (€1,200) - heated seats/steering for winter comfort
    
    **Reality Check:**
    With heat pump + essential options (€40-42k), you're only €1-3k below
    EV60 Techno base (€42,900) which offers:
    - 170 km more range (470 vs 300 km WLTP)
    - 88 more hp (218 vs 130 hp)
    - Heat pump included
    - Better equipment standard
    
    **Bottom Line:**
    EV40 makes sense ONLY if:
    1. You truly don't need &gt;300km range (city-only use)
    2. You're budget-capped at €40-41k
    3. You prioritize saving money over range anxiety
    
    Otherwise, EV60 Techno is better value for €2-5k more.

