# Market positioning
market_positioning:
  segment: large_sedan
  target_audience: Design-conscious buyers, Mazda enthusiasts, premium sedan seekers
  key_selling_points:
    - Mazda Kodo design (distinctive styling)
    - Premium interior quality (Nappa leather standard)
    - Rear-wheel drive dynamics
    - 5-star Euro NCAP (93% adult, 93% child)
    - Extensive dealer network (450+ in Germany)
    - V2L capability
    - Practical liftback with 1,074L max cargo
    - Heat pump standard
    - 70L frunk

  considerations:
    - 93kW DC fast charging slower than competitors
    - Built on Changan platform (not Mazda-developed)
    - New to electric market (less proven EV track record)
    - No AWD option available
    - 400V architecture (vs 800V in Hyundai/Kia)

notes: >
  The Mazda 6e enters the competitive German D-segment EV market at €46,990.
  Strong value proposition with premium standard equipment including Nappa leather,
  360° camera, and comprehensive ADAS. The Kodo design and Mazda build quality
  differentiate it from mainstream competitors.

  Main weakness is the 93kW DC charging speed, significantly behind 800V
  competitors (Hyundai Ioniq 6: 240kW, BMW i4: 205kW). This makes it better
  suited for daily commuting with home charging rather than frequent long-distance
  travel.

  Mazda's extensive German dealer network (450+ locations) provides excellent
  service accessibility, a major advantage over Chinese and newer EV brands.
  Company car tax benefit makes it attractive for business users at €1,410
  annual taxable benefit vs €5,640 for equivalent ICE sedan.

