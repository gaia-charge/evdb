notes: "CUPRA Raval 58 kWh is positioned as an affordable sporty electric hatchback for the Polish market. At 111,800 PLN, it competes with other compact EVs like Renault 5 E-Tech and upcoming VW ID.2. The 440 km WLTP range and 175 kW DC fast charging make it practical for both city and highway use.\nWith \"Mój elektryk\" subsidy (27,000 PLN), net price drops to approximately 84,800 PLN, making it highly competitive in the affordable EV segment. Strong CUPRA brand presence in Poland through Volkswagen Group dealership network ensures good service accessibility.\nThe sporty character and youthful design appeal to younger buyers entering the EV market. Made in Spain (Martorell plant) on VW Group's MEB+ platform, sharing technology with upcoming VW ID.2 and Skoda Epiq."
