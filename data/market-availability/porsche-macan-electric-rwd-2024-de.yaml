company_car_tax:
  rate_percent: 0.5
  calculation_basis: list_price
  calculation: |
    Vehicles priced over €70,000 qualify for 0.5% monthly taxation (vs 1% for ICE).
    
    Example calculation (base €80,450):
    - Monthly taxable benefit: €80,450 × 0.5% = €402/month
    - Annual taxable benefit: €4,824/year
    - Income tax on benefit (42% bracket): ~€2,026/year
    - Social contributions (~20%): ~€965/year
    - Total annual cost to employee: ~€2,991/year
    
    Comparison to combustion equivalent (Porsche Macan S at 1%):
    - Monthly taxable benefit: €72,000 × 1% = €720/month
    - Annual taxable benefit: €8,640/year
    - Tax + social (62% total): ~€5,357/year
    - Annual savings with EV: €2,366/year
  
  notes: |
    Macan Electric qualifies for reduced 0.5% company car tax rate (above €70k).
    Significant savings vs combustion models (1% rate). Private charging at home 
    can be reimbursed tax-free (€0.30/kWh for battery charging or monthly flat 
    rate calculation).

