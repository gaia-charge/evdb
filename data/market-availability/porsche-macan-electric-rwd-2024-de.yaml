pricing:
  base_price: 80450
  destination_charge: 0
  total_msrp: 80450
  pricing_notes: |
    Base price includes:
    - 100kWh battery (95kWh usable)
    - 240kW (326hp) rear motor with RWD
    - 800V architecture with 270kW DC fast charging
    - Two-chamber air suspension with PASM
    - 19" Macan wheels (standard)
    - Partial leather interior
    - 3-zone climate control with heat pump
    - Porsche Communication Management (PCM) 6.1
    - 12.6" curved digital instrument cluster + 10.9" central touchscreen
    - Sound Package Plus (10 speakers)
    - LED headlights with dynamic lighting
    - Adaptive cruise control with Stop & Go
    - Lane Keeping Assist with Lane Change Assist
    - 8-way power adjustable front seats
    - Power liftgate
    - Connected services for 3 years
    
    German pricing includes 19% VAT. Porsche uses transparent build-to-order 
    model with extensive customization options through online configurator.

