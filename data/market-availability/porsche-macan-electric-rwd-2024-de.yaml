market_notes: |
  The Macan Electric RWD is Porsche's most accessible electric SUV, combining:
  - Sports car DNA with SUV practicality
  - 613km WLTP range (excellent for road trips)
  - 270kW ultra-fast charging (21 minutes 10-80%)
  - Premium Porsche quality and driving dynamics
  - 2,000kg towing capacity
  
  Positioned at €80,450, it's significantly more expensive than mainstream premium 
  EVs (Audi Q6, BMW iX) but offers authentic Porsche character and the coveted 
  Porsche badge. Strong residual values expected due to brand prestige.
  
  Target buyers: Porsche enthusiasts seeking electric SUV, families needing 
  practicality with sports car performance, company car drivers wanting reduced 
  0.5% tax rate.
  
  Best value: Comfort Plus configuration (€91,420) includes essential comfort and 
  tech upgrades for €11k over base price.

