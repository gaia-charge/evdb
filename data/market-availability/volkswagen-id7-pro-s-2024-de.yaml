# Market-Specific Notes
market_notes: |
  The ID.7 Pro S with 700 km WLTP range is the ultimate long-distance
  electric sedan from VW. Popular with Autobahn drivers and sales reps
  who need maximum range. At €62,155, it still qualifies for the 0.25%
  company car tax rate (under €70k), making it financially attractive
  for business users. Outsells Pro variant 2:1 in Germany due to range
  advantage. Real-world highway range of ~600 km makes it viable for
  Berlin-Munich trips without charging stops.

