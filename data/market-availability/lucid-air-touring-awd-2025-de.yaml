# Market positioning
competitors:
  - vehicle: Mercedes-Benz EQS 580 4MATIC
    price: 150300
    range_wltp_km: 677
    power_kw: 385
    comparison: >
      Mercedes EQS 580 costs €23,400 more with similar range but less power 
      and slower charging. Lucid Touring offers better performance and value.

# Strengths (enhanced over Pure)
strengths:
  - Exceptional 730km WLTP range (650km real-world) from 92 kWh battery
  - Powerful 518kW/696hp dual-motor AWD (3.4s 0-100 km/h)
  - Dream Drive Pro ADAS standard (€4,500 value vs optional on Pure)
  - Surreal Sound Pro 21-speaker audio standard (€5,000 value vs optional on Pure)
  - Premium Nappa leather with massaging seats standard
  - Enhanced luxury equipment versus Pure trim
  - Still exceptional efficiency 12.5 kWh/100km despite larger battery
  - Compelling value versus Mercedes EQS 580 and BMW i7 xDrive60

# Best for
best_for:
  - Private buyers seeking ultimate EV range and luxury without six-figure pricing
  - Tech enthusiasts wanting Dream Drive Pro and premium audio standard
  - Frequent long-distance travelers requiring 730km range
  - Buyers valuing comprehensive luxury equipment and AWD performance
  - Those seeking best balance of range, performance, and luxury in Lucid lineup

notes: >
  The Lucid Air Touring AWD at €126,900 represents the sweet spot in Lucid's 
  lineup, offering 730km WLTP range, 518kW/696hp AWD performance, and comprehensive 
  luxury equipment including Dream Drive Pro ADAS and Surreal Sound Pro audio 
  (both standard, totaling €9,500 in options on Pure trim).
  
  Compared to Pure RWD (€89,900), the Touring adds €37,000 for: larger 92kWh 
  battery (+70km range), dual-motor AWD (+266hp), Dream Drive Pro standard, 
  Surreal Sound Pro standard, premium Nappa leather with massaging seats, and 
  20" wheels. This represents excellent value for buyers seeking maximum luxury.
  
  NOT suitable for company car drivers due to 1% tax rate (over €70k threshold). 
  Best for private buyers wanting the ultimate electric luxury sedan experience 
  at competitive pricing versus Mercedes EQS 580 (€150,300) and BMW i7 xDrive60 
  (€155,000+).

