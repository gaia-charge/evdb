notes: The Volvo EX30 launched in Germany in Q1 2024 and quickly became one of the most popular compact  electric SUVs. At €43,900, it's Volvo's most affordable EV and competes with Tesla Model Y,  Volkswagen ID.4, and Ford Mustang Mach-E while being significantly more affordable. The Extended  Range Single Motor variant is the best-seller, offering 476km WLTP range and strong performance  (272hp, 5.3s 0-100). German market also offers Twin Motor Performance variant (€49,900, 315kW,  3.6s 0-100). The EX30 won 2nd place in European Car of the Year 2024 and is praised for  Scandinavian design, safety features, and sustainability (lowest lifecycle CO2 of any Volvo).
