notes: |
  Tesla Model S Plaid is one of the fastest production sedans in the world,
  featuring tri-motor AWD with torque vectoring. The Plaid includes carbon
  ceramic brakes standard, Track Mode with drift mode, and upgraded thermal
  management with three radiators for sustained high-performance driving.

  0-100 km/h in 2.1 seconds makes it faster than most supercars. Carbon fiber
  interior trim is standard. Subject to 0.5% company car tax rate. No longer
  eligible for Umweltbonus.

  21" Arachnid wheels are standard; 19" wheels available with €4,500 credit.
  Premium Connectivity subscription required for full feature access after
  first year.

