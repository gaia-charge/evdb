notes: |
  The Mercedes-AMG EQS 53 4MATIC+ at €148,023 is AMG's first fully electric sedan and the performance
  flagship of the EQS lineup. It delivers 484 kW (658 hp) and 880 Nm torque, achieving 3.4s 0-100 km/h
  acceleration while maintaining Mercedes luxury.
  
  **Pricing Context:**
  - Base: €148,023 (+€33,382 vs 450+)
  - Performance config: ~€170,000 (AMG Dynamic Plus, E-Active Body Control)
  - Fully loaded: €195,000+ (all AMG packages, carbon fiber, DRIVE PILOT)
  
  **Key Advantages:**
  - 3.4s 0-100 km/h (fastest luxury sedan, faster than S63 AMG V8)
  - 484 kW (658 hp) base, 503 kW (680 hp) with AMG Dynamic Plus
  - 880 Nm torque (950 Nm with Dynamic Plus) - exceptional
  - AMG RIDE CONTROL+ air suspension with adaptive damping
  - AMG Track Pace with lap timing, telemetry, drift mode
  - MBUX Hyperscreen standard (€8,330 option on 450+)
  - Burmester 3D audio standard (€5,950 option on 450+)
  - 22kW AC charging standard (€1,190 option on 450+)
  - 10-year/250,000km battery warranty
  
  **Key Weaknesses:**
  - Only 586km WLTP range (490km real-world) vs 450+ 782km (650km real-world)
  - Higher consumption: 20.4 kWh/100km WLTP (22.0 real-world) vs 450+ 15.6 kWh/100km
  - Very heavy: 2,655kg (+175kg vs 450+)
  - Price >€70k means 0.5% company car tax (not 0.25%) - still saves €8,872/year vs ICE
  - 400V architecture: only 207kW DC charging (vs Taycan Turbo S 270kW)
  - No V2G/V2L
  - Limited towing: 750kg (vs iX M60 2,500kg)
  
  **Company Car Tax:**
  - AMG 53 4MATIC+ gross list price: €148,023
  - EXCEEDS €70,000 threshold → 0.5% monthly rate (NOT 0.25%)
  - 0.5% rate: €148,023 × 0.5% = €740/month
  - ICE 1% rate: €148,023 × 1% = €1,480/month
  - **Annual savings: €8,872** (vs ICE, but less than 450+ €10,313 due to 0.5% rate)
  - Over 3-year lease: €26,616 tax savings
  
  **Popular Configurations:**
  - Base (€148,023): Rare, most buyers add AMG Dynamic Plus
  - Performance (~€170,000): Dynamic Plus, E-Active Body Control, Night Package (most popular)
  - Ultimate (~€195,000): All AMG packages, carbon fiber, DRIVE PILOT, Executive Rear Seat
  
  **Competitors:**
  - Porsche Taycan Turbo S (€199,637): Faster (2.8s), 800V charging, lighter, sportier, €50k more
  - BMW i7 M70 xDrive (€169,000): More power (485kW), 3.7s 0-100, more traditional luxury
  - Tesla Model S Plaid (€118,990): Much faster (2.1s), €30k cheaper, less luxurious
  - Lucid Air Sapphire (€249,000): Much faster (1.89s), more range, €100k more
  - Audi e-tron GT RS (€142,400): Sportier, 800V charging, less luxurious, €6k cheaper
  
  The AMG EQS 53 4MATIC+ targets buyers wanting ultimate Mercedes luxury + AMG performance.
  It's the fastest-accelerating Mercedes luxury sedan ever (3.4s vs S63 AMG V8: 3.5s).
  
  **AMG Dynamic Plus Package (€11,900) is highly recommended:**
  - Race Start: 680 hp / 950 Nm for 10 seconds (repeated 0-100 runs)
  - Drift Mode: rear-biased torque for controlled drifts
  - Track Pace: lap timing, telemetry, drift analysis
  - Performance seats with more aggressive bolstering
  
  Real-world consumption: 22.0 kWh/100km (higher with spirited driving).
  Real-world range: 490km mixed (vs 586km WLTP, 451km EPA).
  
  Built at Factory 56, Sindelfingen, Germany (carbon-neutral production).

