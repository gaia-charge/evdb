# Notes
notes: |
  The Renault Megane E-Tech Electric is designed, engineered, and manufactured
  in France (Douai factory), making it eligible for maximum French EV incentives.
  
  The EV60 Optimum Charge variant is the most popular choice in France, offering
  excellent range (450km WLTP) and fast charging (130kW DC) at a competitive price.
  
  France offers some of Europe's most generous EV incentives, with up to €13,500
  in combined bonuses available (bonus écologique + conversion premium + regional
  bonuses) for qualifying buyers who scrap an old vehicle.
  
  The vehicle's environmental score of 75/100 (published by Renault) ensures
  eligibility for full French EV incentives. This score is based on lifecycle
  analysis including manufacturing, battery production, and end-of-life recycling.
  
  French market has shortest delivery times (8 weeks) due to local production.
  All French vehicles come with 7-year corrosion warranty and 8-year/160,000km
  battery warranty.
  
  Made in France certification: "Origine France Garantie" label awarded.

