# Market positioning
market_positioning:
  segment: compact_suv
  target_audience: Comfort-seeking families, value-oriented EV buyers
  key_selling_points:
    - Outstanding 681 km WLTP range
    - Citroën Advanced Comfort seats and suspension
    - Spacious 565L trunk (1,668L max)
    - Competitive pricing vs segment
    - Made in France (Rennes plant)
    - Heat pump and battery preconditioning standard
    - Long service intervals (24mo/30,000km)
    - 160kW DC fast charging

  considerations:
    - Lower Euro NCAP safety assist score (62%)
    - No V2L capability
    - FWD only (no AWD option)
    - 400V architecture
    - Heavy at 2,246 kg
    - No frunk storage

notes: >
  The Citroën C5 Aircross Long Range brings impressive 681 km WLTP range to
  the German market at €48,490. Comfort-focused alternative to sportier platform
  sibling Peugeot e-3008, with Citroën's trademark Advanced Comfort seats and
  progressive hydraulic suspension.

  Strong value proposition with comprehensive standard equipment. The 97 kWh
  battery provides segment-leading range, making it practical for long-distance
  family travel. 160kW DC fast charging is competitive for a 400V platform.

  Built in France (Rennes), appealing to buyers preferring European manufacturing.
  Citroën's 320+ German dealers provide reasonable service accessibility.

  Company car tax benefit makes it attractive for business use at €1,455 annual
  taxable benefit. Long 24-month service intervals further reduce running costs.

