notes: The 2026 BMW iX3 Neue Klasse is BMW's most significant EV launch yet. Built on the all-new Neue Klasse platform in Debrecen, Hungary. 800V architecture enables 400kW DC charging (10-80% in 21 min). Strategically priced at €69,900 to stay under the €70,000 company car tax threshold. Expected to be one of BMW's best-selling EVs in Germany. 12-week delivery due to high demand and production ramp-up.
