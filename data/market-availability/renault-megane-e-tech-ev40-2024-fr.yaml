# Notes
notes: |
  Renault Megane E-Tech EV40 - version d'entrée de gamme, idéale pour
  la conduite urbaine et périurbaine. Avec 300 km d'autonomie WLTP et
  un moteur efficient de 130 ch, elle offre un excellent rapport
  qualité-prix dans le segment des compactes électriques. Élue
  Voiture de l'Année 2023 en Europe. Équipement de série comprenant
  l'habitacle innovant OpenR avec Google intégré, pompe à chaleur
  pour l'efficacité toutes saisons, et fonctionnalités de sécurité
  complètes. Délai de livraison actuellement 8 semaines. Éligible au
  bonus écologique français et à la prime à la conversion. Fabriquée
  en France à l'usine ElectriCity de Douai.

