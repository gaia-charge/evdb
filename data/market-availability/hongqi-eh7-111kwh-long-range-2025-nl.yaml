notes: The Hongqi EH7 111 kWh Long Range launched in the Netherlands in January 2025 at €58,995. It competes with the Tesla Model 3 Long Range, BMW i4 eDrive40, and Mercedes-Benz EQE 300. With 655 km WLTP range and a drag coefficient of just 0.205, it offers strong long-distance capability. The Netherlands is Hongqi's first European market for the EH7.
