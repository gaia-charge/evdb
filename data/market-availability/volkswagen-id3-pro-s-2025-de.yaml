market_notes: |
  The 2025 ID.3 Pro S is VW's best-selling long-range compact EV in Germany.
  At under €44,000 with 565 km WLTP range, it offers exceptional value.
  Outstanding company car taxation at 0.25% rate. Key selling points:
  Made in Germany, excellent range per euro, practical hatchback design,
  and VW's extensive dealer/service network. Main competitors are Tesla
  Model 3 and Cupra Born (same MEB platform sibling).

