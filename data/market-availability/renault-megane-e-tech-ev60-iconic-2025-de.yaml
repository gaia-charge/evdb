    Outstanding value for company car drivers seeking flagship electric vehicle with
    all premium features included.

# Market Notes
notes: |
  Renault Megane E-Tech EV60 Iconic 2025 is the flagship variant with the best range
  (470 km WLTP, 400 km real-world) and all premium features included as standard.
  
  Available through Renault dealership network across Germany. Order online via renault.de
  or at any Renault partner. Delivery time currently 10 weeks (slightly longer than other
  trims due to additional equipment).
  
  Iconic trim includes EVERYTHING from Techno plus:
  - Solarbay panoramic glass roof with electrochromic dimming (€1,100 value)
  - Harman Kardon premium audio system (€800 value)
  - Highway & Traffic Jam Companion Level 2 autonomy (€1,500 value)
  - Hands-free parking with 360° camera
  - Premium Alcantara interior with heated & ventilated front seats
  - Electric adjustable driver's seat with memory
  - Full LED lighting package with animated indicators
  - Ambient lighting with 8 color options
  - 18-inch exclusive Iconic alloy wheels
  
  Total value of included equipment: ~€3,400 over Techno base
  Price premium over Techno: €3,000
  Net savings: €400 + you get the flagship trim level
  
  Key competitors in Germany:
  - VW ID.3 Pro S (77 kWh, €52,000) - more expensive, similar range
  - Cupra Born VZ (77 kWh, €51,000) - similar price, similar features
  - Nissan Ariya 87 kWh (520 km, €56,000) - more expensive, more range
  - BMW iX1 xDrive30 (64 kWh, €56,500) - more expensive, premium brand
  
  Megane E-Tech Iconic offers best value in its class with all premium features standard.
  The Solarbay roof is a unique feature not available on VW ID.3 or Cupra Born. Google
  built-in infotainment is superior to German competitors' systems.
  
  Real-world range (best in Megane lineup thanks to optimized aero and eco mode):
  - Summer (20°C, mixed, eco mode): 400 km
  - Winter (-5°C, heater, normal mode): 320 km
  - Highway (120 km/h, 20°C, eco mode): 350 km
  
  130 kW DC charging allows 10-80% in 30 minutes. 22 kW AC charging means full charge
  in 3 hours at three-phase chargers.
  
  Ideal for:
  - Company car drivers wanting flagship EV with all features
  - Tech enthusiasts seeking cutting-edge infotainment
  - Design-conscious buyers who value French elegance
  - Families needing premium electric vehicle with good range
  - Anyone who wants the best Megane E-Tech experience
  
  The Iconic represents exceptional value because almost everything is included - there's
  very little left to add as options. Most customers just choose their preferred color
  and wheel size, keeping transaction prices in the €47,000-49,000 range.
  
  Standout features:
  - Solarbay roof: Instant opacity adjustment without physical blind
  - Google built-in: Superior voice control, navigation, and app ecosystem
  - Harman Kardon: Excellent 440W audio system
  - Level 2 autonomy: Highway & Traffic Jam Companion makes long trips effortless
  
  Popular with company car drivers in Germany who want a premium electric vehicle with
  distinctive design and comprehensive features at a price well under the €70k threshold.

