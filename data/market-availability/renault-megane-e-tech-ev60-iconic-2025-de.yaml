notes: >
  The Renault Megane E-Tech EV60 Iconic is the flagship variant, offering premium
  features and maximum efficiency. At €47,900, it competes with entry-level premium
  German EVs (BMW iX1, Mercedes EQA, Audi Q4 e-tron) but undercuts them by €4,000-8,000
  while matching or exceeding their equipment levels. The 470 km WLTP range (390 km
  real-world) is class-leading for compact crossovers, and the 15.2 kWh/100km WLTP
  consumption makes it one of the most efficient EVs in its class.
  
  The Iconic trim includes flagship features as standard: full Nappa leather, heated
  and ventilated seats, panoramic sunroof, Matrix LED headlights, 20" premium wheels,
  Harman Kardon audio, and premium ambient lighting. The only major options are head-up
  display (€800), massage seats (€600), and two-tone roof (€700). The Beige/Black
  leather option (€800) appeals to buyers seeking a lighter, more luxurious cabin.
  
  For company car users, the Iconic represents excellent value: €120/month benefit
  (30% tax = €431/year) for a flagship-equipped EV that competes with vehicles costing
  €55,000-60,000. The maximum range reduces charging anxiety on business trips, and
  the 22 kW AC charger ensures quick overnight charging at hotels. The bidirectional
  V2L/V2G capability future-proofs the vehicle for smart home integration.
  
  The Iconic accounts for approximately 25% of German Megane E-Tech sales, appealing
  to premium buyers, business users, and early adopters seeking the best equipment.
  Buyers choosing Iconic over Techno pay €4,300 premium for: panoramic sunroof, Matrix
  LEDs, full Nappa leather, ventilated seats, 20" wheels, Harman Kardon audio, and
  20 km additional range - representing good value for the flagship experience.
  
  Real-world feedback highlights the Iconic's exceptional build quality, refined ride,
  and premium feel that rivals German competitors. The L-shaped OpenR screen layout
  is polarizing but adds unique character. The 2023 European Car of the Year award
  validates the design and engineering excellence, providing confidence in resale value.
