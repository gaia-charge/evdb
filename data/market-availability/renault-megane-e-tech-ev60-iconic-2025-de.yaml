notes: |
  **Market Positioning in Germany:**

  The Renault Megane E-Tech EV60 Iconic at €48,900 (€49,890 on-the-road) is the
  flagship variant with all features as standard. Positioned as a premium offering
  that stays under the critical €70k company car tax threshold.

  **vs Premium Competitors:**
  - **VW ID.3 GTX (€55,995)**: €7,000 more, AWD, 326 km range, more power but less efficient
  - **Cupra Born VZ (€50,990)**: €2,000 more, 511 km range, sportier, less premium feel
  - **BMW i4 eDrive35 (€58,900)**: €10,000 more, 483 km range, larger sedan, BMW premium
  - **Tesla Model 3 RWD (€42,990)**: €6,000 cheaper, 513 km range, different market segment
  - **Polestar 2 Long Range (€52,900)**: €4,000 more, 635 km range, Scandinavian premium

  **Iconic Standard Features (ALL INCLUDED):**

  **Exterior:**
  - Full LED Matrix headlights with Adaptive Driving Beam
  - 20" aero-optimized diamond-cut alloy wheels
  - Black exterior trim accents
  - Premium paint finishes
  - Flush door handles

  **Interior:**
  - Premium Alcantara and leather upholstery
  - Heated front seats with 3 settings
  - Heated steering wheel
  - Massage front seats
  - Electric adjustable driver seat with memory
  - Ambient lighting with 8 colors
  - Premium materials throughout cabin

  **Technology:**
  - 12" central touchscreen with OpenR Link
  - 12.3" digital instrument cluster
  - 9" full-color head-up display
  - Google built-in (Android Automotive OS)
  - Wireless smartphone charging (15W fast charging)
  - Harman Kardon premium sound system (10 speakers, 440W)
  - 360° parking camera with bird's eye view
  - Hands-free parking

  **Safety & Driver Assistance:**
  - Adaptive cruise control with stop & go
  - Lane keeping assist with lane centering
  - Traffic sign recognition with speed limiter
  - Active emergency braking with pedestrian/cyclist detection
  - Blind spot monitoring
  - Rear cross traffic alert
  - Driver attention monitoring
  - Highway Assist (lane centering on highways)

  **Comfort:**
  - Solarbay panoramic electrochromic glass roof (€1,400 value!)
  - Dual-zone automatic climate control
  - Keyless entry and start
  - Automatic folding mirrors
  - Rain-sensing wipers
  - Auto-dimming rear-view mirror

  **Key Advantages Over Techno (+€5,400):**
  - Solarbay panoramic roof INCLUDED (saves €1,400)
  - 9" head-up display INCLUDED (would be €800 option)
  - Harman Kardon sound system INCLUDED (€800 value)
  - Heated seats & steering wheel INCLUDED (€690 value)
  - Massage front seats INCLUDED (€600 value)
  - 20" aero wheels INCLUDED (€950 value)
  - Premium Alcantara/leather interior INCLUDED (€890 value)
  - Ambient lighting INCLUDED (€400 value)
  - Total value of extras: ~€6,530

  **Actual premium over Techno: Only €5,400 for €6,530 in features!**

  **Company Car Benefits:**
  With 0.25% monthly taxation (€122/month), the Megane E-Tech EV60 Iconic saves
  company car drivers ~€15,000 per year in taxes compared to ICE equivalent.

  **Critical for Company Cars:** At €48,900 base price, the Iconic stays comfortably
  under the €70,000 threshold for the 0.25% tax rate. Even with a two-tone roof
  (€750) and extended Nappa leather (€1,290), the total is €50,940 - still well
  under €70k. This makes it an excellent choice for company car drivers who want
  maximum features while maintaining the tax benefit.

  **Why Choose Iconic:**

  1. **Complete Package:** Everything you could want is standard. No option sheet anxiety.
  2. **Solarbay Roof:** The signature feature that defines the Megane E-Tech experience
  3. **Premium Feel:** Materials, tech, and comfort match cars costing €60k+
  4. **Company Car Sweet Spot:** Maximum equipment under €70k threshold
  5. **Resale Value:** Fully loaded cars typically hold value better
  6. **Daily Luxury:** Massage seats, HUD, premium sound - features you'll use every day

  **Target Buyer:**

  Professionals and enthusiasts who want the complete Megane E-Tech experience without
  compromise. Ideal for company car drivers who can maximize the 0.25% tax benefit
  while enjoying premium features. Also appeals to private buyers who appreciate
  getting a "loaded" car without option upcharges.

  The Iconic represents excellent value: you get €6,530 in features for a €5,400
  premium over Techno. The Solarbay roof alone justifies much of the price difference,
  and it's the definitive feature of the Megane E-Tech.

  **Real-World Owner Feedback:**
  - "The Solarbay roof is amazing - you'll never want a traditional sunroof again"
  - "Iconic is the only way to get the Megane - it's worth every euro"
  - "The HUD is surprisingly useful, especially with Google Maps navigation"
  - "Massage seats are subtle but make long drives much more comfortable"
  - "Harman Kardon system sounds fantastic - better than many luxury cars"
