notes: >
  The Renault Megane E-Tech EV60 Iconic (2025) is the flagship variant offering
  maximum range (470 km WLTP / 385 km real-world) thanks to optimized aerodynamics
  with 20\" aero wheels and refined efficiency. At €46,500, it represents premium
  value against German competition while offering comprehensive luxury equipment
  including leather/alcantara seats, Harman Kardon audio, head-up display, and
  Highway/Traffic Jam Assist (Level 2 autonomy). The Iconic is the only trim with
  heated seats/steering wheel as standard, making it ideal for German winters.
  The 0.25% company car tax makes it attractive for executive fleet buyers seeking
  a premium electric compact. Most buyers opt for the "EV60 Iconic Solarbay"
  configuration (€48,300) adding the innovative tinting-on-demand glass roof.
  The Iconic delivers the full vision of the 2023 European Car of the Year with
  maximum range, luxury features, and advanced technology. Perfect for buyers
  wanting a premium electric compact that can handle long-distance travel while
  maintaining compact urban dimensions. The 218 hp motor provides engaging
  performance and the comprehensive equipment list rivals German premium brands
  at €10,000-15,000 less. 10-week delivery reflects higher demand for this
  premium variant.
