  notes: |
    Pricing verified from Renault Germany configurator for 2025 model year. The Iconic
    represents outstanding value - for only €3,000 more than Techno, you get €3,400+
    worth of premium equipment included as standard.
    
    The flagship trim strategy means customers don't have to navigate complex option
    packages - Iconic includes everything except paint color and wheel size choices.
    
    Excellent choice for company car drivers - base Iconic at €46,000 qualifies for
    0.25% taxation with only ~€800/year total cost to employee, while providing flagship
    features and prestige.
    
    The Solarbay panoramic roof is particularly popular in Germany - allows instant
    adjustment from transparent to opaque without a physical blind, and includes UV
    protection even when transparent.
