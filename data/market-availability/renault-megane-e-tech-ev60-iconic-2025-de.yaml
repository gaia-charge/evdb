    tax benefits.

# Market Notes
notes: |
  Renault Megane E-Tech EV60 Iconic 2025 is the flagship of the Megane lineup,
  offering premium features and refined efficiency with 470km WLTP (385km real-world) range.
  
  Iconic trim is fully loaded as standard:
  - Harman Kardon premium audio (10 speakers)
  - Panoramic glass roof (fixed)
  - 360-degree camera
  - Hands-free parking
  - Alcantara upholstery with recycled materials
  - 20-inch diamond-cut alloy wheels
  - Enhanced ambient lighting (8 colors)
  - Memory driver's seat
  - Rear privacy glass
  - Wireless phone charging
  - LED Pure Vision headlights
  - Traffic sign recognition
  - All driver assistance features
  
  Only meaningful options are Winter Package Plus (€650) and Matrix LED headlights (€1,400).
  Most buyers choose both for ultimate comfort and safety.
  
  Available through Renault dealership network across Germany. Order online via renault.de
  or at any Renault dealer. Delivery time currently 12 weeks due to high demand for
  top-spec variant.
  
  2025 model year brings refined efficiency calibration providing 20km more WLTP range
  than Techno trim despite identical drivetrain. Enhanced Google Assistant integration
  with offline capability and improved OTA update system.
  
  Key competitors in Germany:
  - Volkswagen ID.3 GTX (€52,000) - sportier, less premium interior
  - Volkswagen ID.4 Pro (€48,000) - larger, similar features
  - Cupra Born VZ (€48,000) - sportier, less refined
  - BMW i4 eDrive35 (€54,000) - premium brand but €8k more expensive
  - Mercedes EQA 250+ (€52,000) - premium brand, less range
  - Polestar 2 Long Range (€51,000) - premium Volvo, similar price
  
  Megane EV60 Iconic offers European Car of the Year quality, cutting-edge tech,
  comprehensive equipment, and excellent efficiency at price point below premium brands.
  
  Perfect for:
  - Private buyers seeking fully equipped premium EV without luxury brand pricing
  - Company car drivers wanting maximum features with 0.25% taxation
  - Tech enthusiasts (Google built-in is best-in-class)
  - Design-conscious buyers (French design flair)
  - Families wanting premium all-rounder with excellent range
  
  Real-world range scenarios:
  - Urban driving: 440-470km
  - Mixed driving: 370-390km
  - Highway 120 km/h: 340-360km
  - Winter (0-10°C): 290-330km
  
  Optimized efficiency calibration provides best-in-class consumption for 60kWh variants:
  - WLTP: 15.5 kWh/100km
  - Real-world: 15.6 kWh/100km
  
  Charging performance identical to Techno:
  - DC 10-80%: 32 minutes (130kW peak)
  - AC 0-100%: 3 hours (22kW three-phase)
  
  Harman Kardon sound system is exceptional - rivals BMW/Mercedes premium audio.
  Alcantara interior with recycled materials provides premium feel while demonstrating
  Renault's sustainability commitment.
  
  Panoramic glass roof adds openness and light to cabin. Fixed design (no sunroof)
  maintains structural rigidity and reduces weight.
  
  Build quality and refinement excellent - rivals premium German brands. European design
  flair with practical French functionality. Interior materials and fit/finish impress.
  
  Matrix LED headlights (€1,400 option) highly recommended for night driving safety.
  Adaptive beam pattern automatically adjusts to oncoming traffic and road conditions.
  
  At €46,500 base price, Iconic represents excellent value - fully equipped premium
  compact EV for less than base BMW i4 or Mercedes EQA. Popular among buyers who
  appreciate French design, comprehensive features, and smart value proposition.
  
  Most Iconic buyers are:
  - Upgrading from premium ICE brands (BMW 3/Mercedes C-Class)
  - Seeking fully equipped EV without €60k+ price tag
  - Company car drivers maximizing features within tax benefit
  - Tech-forward professionals appreciating Google integration
  
  Iconic is the "no compromises" Megane - everything you could want in a compact
  premium EV at highly competitive pricing. European Car of the Year 2023 winner
  shows its best in this top specification.

