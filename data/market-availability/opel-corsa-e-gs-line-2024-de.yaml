sales_notes: |
  Opel Corsa (all versions) consistently in top 10 best-selling cars in Germany.
  Corsa-e accounts for ~30% of total Corsa sales (2024 estimate).
  Badge-engineered twin of Peugeot e-208, typically outsells e-208 in Germany due to 
  lower price and stronger Opel brand recognition.

notes: |
  The Opel Corsa-e GS Line at €36,990 offers exceptional value:

  **Key Advantages:**
  - €2,500 cheaper than mechanically identical Peugeot e-208 GT
  - IntelliLux LED Matrix headlights (Opel exclusive, segment-leading)
  - More conservative, practical design vs e-208's sporty styling
  - Simpler interior with more physical buttons
  - Strong Opel dealer network (850+ locations)
  - Fast 8-week delivery from Zaragoza, Spain
  - Company car tax benefit: 0.25% = €92/month (saves €3,328/year vs ICE)

  **vs Peugeot e-208 GT:**
  - €2,500 cheaper (€36,990 vs €39,490)
  - Same CMP platform, battery, motor, performance
  - IntelliLux Matrix LED vs standard LED
  - More conservative design vs sportier e-208
  - Built at same Zaragoza plant

  **Best for:**
  - Value-conscious buyers prioritizing practicality
  - Company car drivers (0.25% tax)
  - German brand loyalty
  - IntelliLux Matrix LED technology

  **Considerations:**
  - Smallest trunk in segment (309L)
  - No towing capability
  - 100kW DC charging adequate but slower than some competitors
  - 4-star Euro NCAP (vs 5-star for newer competitors)

