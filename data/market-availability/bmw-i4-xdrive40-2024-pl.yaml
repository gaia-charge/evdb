notes: |
  BMW i4 xDrive40 is particularly popular in Poland due to harsh winter conditions
  making AWD desirable. Strong BMW brand loyalty in the premium segment.
  
  Key Poland-specific considerations:
  - Winter tires mandatory November-March (additional PLN ~5,000 for winter set)
  - xDrive AWD highly valued for Polish winter conditions
  - Business buyers benefit from full VAT recovery on BEVs
  - Charging infrastructure expanding rapidly, especially along A1, A2, A4 motorways
  - Exceeds Mój elektryk price cap, so individual buyers get no subsidy
  
  Competitors in Poland:
  - Tesla Model 3 LR AWD: PLN 239,900 (cheaper, longer range)
  - Polestar 2 LR Dual Motor: PLN 249,900 (cheaper, similar specs)
  - BMW i4 eDrive40: PLN 256,900 (cheaper, more range, no AWD)

