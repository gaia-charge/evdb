notes: |
  BYD Atto 2 available in Poland from March 2025. Starting price 129,900 PLN for Active trim.
  Includes 23% VAT. FWD with 177 KM (130 kW) motor. 45.1 kWh usable Blade Battery (LFP).
  WLTP range: 312 km (city: 463 km). DC fast charging up to 65 kW.
  AC charging 11 kW (3-phase). V2L capability included (3.3 kW).
  Eligible for NaszEauto subsidy reducing effective price to 99,900 PLN.

