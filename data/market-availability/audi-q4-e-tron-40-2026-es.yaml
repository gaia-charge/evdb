notes: Audi Q4 40 e-tron 2026 is available through Audi Spain dealer network. At €55,900 it exceeds the MOVES III price cap, so no direct purchase subsidy applies. However, it benefits from IEDMT exemption (saving ~€2,500-€5,000 vs equivalent ICE), municipal road tax discounts, and full ZBE access across Spanish cities. The 590 km WLTP range makes it practical for long Spanish highway trips. Popular in Madrid and Barcelona among premium SUV buyers transitioning to electric.
