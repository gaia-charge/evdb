notes: "BMW iX2 eDrive20 at €49,900 is the entry point to the iX2 range. Under €50k makes it more accessible while retaining all premium features. Better range (478 km) than the xDrive30 (449 km) thanks to single motor efficiency. Under €70k for 0.25% company car tax benefit. Attractive for buyers who don't need AWD. Main competitors: Mercedes EQA 250, Audi Q4 e-tron 35."
