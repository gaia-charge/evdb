# Regional Notes
regional_notes:
  - Nissan has strong presence in Germany with 420 dealers
  - Ariya competes with VW ID.4, Ford Mustang Mach-E, Tesla Model Y
  - e-4ORCE AWD system provides excellent winter capability
  - V2H capability unique in segment (requires CHAdeMO adapter)
  - ProPILOT Assist 2.0 is one of most advanced ADAS systems available
  - Nissan pioneered EVs with LEAF (2010), strong EV heritage

target_audience:
  - Families seeking spacious electric SUV
  - Technology enthusiasts (ProPILOT Assist 2.0)
  - Eco-conscious buyers (V2H energy management)
  - Fleet and company car users (tax benefits)
  - Previous LEAF owners upgrading

competitors:
  - Volkswagen ID.4 Pro (€48,565) - cheaper, MEB platform
  - Ford Mustang Mach-E Extended Range AWD (€59,990) - same price, more power
  - Hyundai Ioniq 5 Long Range AWD (€54,900) - cheaper, 800V charging
  - Kia EV6 Long Range AWD (€53,990) - cheaper, sister car to Ioniq 5
  - Tesla Model Y Long Range (€54,990) - similar price, better range

pricing_notes: >
  Positioned as premium mid-size electric SUV. Higher price than Korean competitors (Ioniq 5, EV6)
  due to Japanese production and import costs. ProPILOT Assist 2.0 and V2H capability justify premium.
  e-4ORCE AWD system is competitive advantage. Two-tone paint options are unique in segment.

