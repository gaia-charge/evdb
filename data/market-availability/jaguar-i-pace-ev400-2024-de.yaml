# Notes
notes: |
  Jaguar I-PACE EV400 available in three trims: S (€78,500), SE (€85,500), HSE (€93,500).
  Federal EV incentive ("Umweltbonus") ended December 2023 - no subsidies available.
  Company car drivers benefit from 0.5% monthly taxation rate (vehicles over €70k threshold)
  saving €4,710/year vs 1% ICE rate. Delivery time typically 12-16 weeks from order.
  Established Jaguar dealer network with 90+ locations in Germany. Proven reliability
  after 6+ years in market (2018 launch). Strong secondary market with 52-55% residual
  values after 3 years.

