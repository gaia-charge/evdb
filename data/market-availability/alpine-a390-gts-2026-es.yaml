notes: |
  Alpine A390 GTS is the high-performance version of Alpine's electric sport fastback.
  Features tri-motor AWD with 470 CV and 824 Nm torque, 0-100 km/h in 3.9 seconds.
  Built in Dieppe, France with motors from Cléon and batteries from Douai.
  Part of Alpine's electric transition lineup alongside A290 and future A110.
  Orders opened in Spain from November 2025, deliveries start early 2026.

