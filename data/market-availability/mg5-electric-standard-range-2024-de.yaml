# Metadata
metadata:
  data_quality: verified
  sources:
    - https://www.mgmotor.de/mg5-electric
    - https://www.adac.de/rund-ums-fahrzeug/tests/elektromobilitaet/mg5-electric-test/
    - https://www.auto-motor-und-sport.de/fahrbericht/mg5-electric-test/
  created_at: "2026-02-08"
  last_updated: "2026-02-08"
  notes: |
    Entry-level MG5 offers unbeatable value for electric estate segment.
    320km WLTP range sufficient for most daily urban/suburban use cases.
    479L boot capacity unmatched at this price point.
    LFP battery chemistry provides better thermal stability and longevity.
    7-year/175,000km warranty best in class for budget EVs.
    Popular with fleet buyers, taxi operators, and budget-conscious families.
    Heat pump option highly recommended for German winters.
    Company car tax benefit (0.25%) makes it extremely attractive for business use.
