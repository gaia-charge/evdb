notes: |
  Mercedes-Benz EQB 300 4MATIC 2025 at €61,990 offers all-wheel drive
  for better traction and handling. Ideal for winter conditions or families
  needing AWD capability with optional 7-seat configuration.
  
  2025 MODEL YEAR UPDATES:
  - Updated MBUX infotainment with 11.9-inch touchscreen
  - Wireless smartphone charging now standard
  - Enhanced voice control
  - Minor interior trim refinements
  - Price increase: €1,000 (€60,990 → €61,990)
  
  4MATIC vs 250+ FWD comparison:
  - Price: +€4,000 (€61,990 vs €57,990)
  - Range: -51km (423 vs 474km WLTP)
  - Power: +28kW (168 vs 140kW)
  - 0-100: 8.0s vs 9.0s
  - Consumption: 18.4 vs 16.8 kWh/100km
  - AWD traction advantage
  
  KEY ADVANTAGE: Qualifies for 0.25% company car tax (under €70,000)
  - Monthly taxable benefit: €154.98 (vs €619.90 if 1% rate)
  - Annual tax savings: ~€4,650/year for typical company car driver
  
  Popular configuration:
  - AMG Line (€4,950)
  - Third row seats (€1,850)
  - Driver Assistance Package Plus (€2,480)
  - Total: €71,270 (just over €70k threshold)
  
  Competitive positioning:
  - BMW iX1 xDrive30: €56,500 (cheaper, 5-seat only, similar AWD)
  - Audi Q4 e-tron 45 quattro: €54,900 (better value, 5-seat)
  - Tesla Model Y Long Range AWD: €52,990 (better range/tech)
  - Volkswagen ID.4 Pro 4MOTION: €51,995 (good value)
  
  Strengths:
  - 4MATIC all-wheel drive with torque vectoring
  - Good winter/slippery conditions traction
  - Only premium 7-seat compact AWD EV
  - Mercedes brand prestige
  - Updated infotainment (2025)
  - Off-Road driving mode
  
  Weaknesses:
  - Higher consumption than FWD (18.4 vs 16.8 kWh/100km)
  - Shorter range than FWD (423 vs 474km)
  - €4,000 premium for AWD
  - Still modest 100kW DC charging
  - Third row very cramped
  
  Typical delivery: 8 weeks (good availability, Hungary production)

