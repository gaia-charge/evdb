market_notes: >
  The BYD Atto 2 Standard (sold as "Active" trim in Italy) is BYD's entry-level B-segment SUV.
  Features 130 kW (177 hp) motor, 45.1 kWh Blade Battery (LFP), 312 km WLTP range (463 km city).
  0-100 km/h in 7.9 seconds, 160 km/h top speed, 65 kW DC fast charging (10-80% in 37 min),
  11 kW 3-phase AC charging (0-100% in 5.5 hours). Standard equipment includes e-Platform 3.0,
  Cell-to-Body battery integration, heat pump, 8.8" digital instrument cluster, 10.1" rotating
  touchscreen, wireless Apple CarPlay/Android Auto, "Hi BYD" voice control, panoramic glass roof
  with electric sunshade, and 400L trunk. Upgrade to Boost trim (€31,990) adds 12.8" screen,
  15W wireless charging, and enhanced features. Long Range variant (420 km) coming Q4 2025 at €35,790.
  Promotional 12-month lease available to switch to Long Range when released.

