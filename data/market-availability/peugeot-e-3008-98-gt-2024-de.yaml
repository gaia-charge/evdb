notes: |
  The Peugeot e-3008 98 kWh GT is the flagship compact electric SUV with segment-leading
  700 km WLTP range. At €55,990, it offers exceptional value compared to premium German
  alternatives while delivering more range, more technology, and more style.
  
  Key advantages vs competition:
  - 700 km range beats Tesla Model Y LR (533 km), VW ID.4 GTX (520 km), Audi Q4 50 e-tron quattro (534 km)
  - €12,000 less than Mercedes EQB 350 4MATIC (€68,000)
  - €8,000 less than BMW iX1 xDrive30 (€64,000)
  - Same price as Škoda Enyaq iV 85x but with better tech and design
  - Revolutionary 21" Panoramic i-Cockpit (nothing comparable in segment)
  - ChatGPT integration, FOCAL premium audio, Nappa leather standard
  
  GT trim includes as standard what German competitors charge thousands for:
  - Panoramic glass roof (€1,500 option on ID.4)
  - Adaptive dampers (€990 on Enyaq)
  - Nappa leather and massaging seats (€2,500+ on BMW)
  - FOCAL 10-speaker audio (€800+ on Audi)
  - 360° camera (€600+ on VW)
  - Adaptive cruise with lane centering
  
  With 98 kWh battery and 160kW DC charging, road trips are effortless: 700 km range means
  rare charging stops, and 10-80% in 32 minutes means quick top-ups. The e-3008 GT delivers
  true long-distance electric SUV capability.
  
  Company car sweet spot: At €55,990 base, there's room for €14k in options before hitting
  the €70k threshold. Recommended config with heat pump, 22kW charger, and premium audio
  comes to ~€60k - perfect balance of equipment and tax efficiency.
  
  The e-3008 GT 98kWh represents the pinnacle of French electric SUV engineering: combining
  700 km range, cutting-edge AI-powered tech, premium materials, and sophisticated design
  at a price that undercuts German premium competition by significant margins.
  
  Prime alternative to: Tesla Model Y Long Range, BMW iX1, Mercedes EQB, Audi Q4 e-tron 50
  quattro, Volvo EX40 Twin Motor, Genesis Electrified GV70.
