    The e-3008 98 kWh GT costs €8,000 more than ICE 3008 GT diesel.
    Running costs are nearly identical (BEV slightly higher insurance, ICE higher fuel/maintenance).
    
    For private buyers: Justification is premium features, 700 km range, cutting-edge tech,
    and future-proofing rather than cost savings. Consider it a premium technology purchase.
    
    For company car drivers: Massive savings remain!
    - 0.25% taxation: €140/month (€55,990 base)
    - ICE equivalent: €480/month (1% of €48k)
    - Monthly savings: €340 = €4,080/year
    
    Company car use makes the GT 98kWh economically compelling. The €8k premium is recovered
    in under 2 years through tax benefits alone.

