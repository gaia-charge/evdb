notes: '- Entry-level Smart #1 offering excellent value at €41,990 - Same powertrain as Premium (200kW, 440km WLTP) at €2,000 lower price - Standard heat pump crucial for German winters - Competitive with Mini Cooper Electric (€39,900), Volvo EX30 (€38,900) - Still includes 22kW AC charging and 150kW DC fast charging - Strong value proposition: premium platform at accessible price - Company car tax benefit (0.25%) makes it attractive for fleet buyers - Lower equipment level vs Premium: manual vs power tailgate, no 360 camera standard'
