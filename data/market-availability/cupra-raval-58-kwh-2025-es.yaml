market_notes: >
  CUPRA Raval 58 kWh long-range variant offers 400+ km WLTP range, ideal for
  Spanish highway driving. Built in Martorell, Barcelona. At €29,990, with
  MOVES III subsidy it can drop to €22,990 (with scrapping) or €25,490
  (without). The 58 kWh battery makes it practical for longer trips across
  Spain. Strong CUPRA/SEAT dealer network ensures easy access to service.
  Competes with Renault 5 E-Tech Long Range and VW ID.2 in Spain.

