notes: |
  BYD Seal Excellence top-spec AWD electric sedan in Poland.
  520km WLTP range (600km urban) with 82.5 kWh BYD Blade Battery.
  Dual-motor AWD delivering 530 HP (390 kW) and 670 Nm torque.
  Impressive 3.8s 0-100 km/h acceleration, 180 km/h top speed.

  150 kW DC fast charging (10-80% in ~37 minutes).
  11 kW AC charging standard (optional 22 kW available).

  Prices include 23% VAT. Eligible for "Mój elektryk" subsidy
  up to 27,000 PLN, reducing effective price to 208,900 PLN.

  Premium Chinese electric sedan with BYD's proven Blade Battery
  technology (LFP chemistry). Excellent safety and thermal management.

  Excellence trim includes Nappa leather, head-up display,
  Dynaudio audio, heat pump, and full suite of ADAS features.

  Competes with Tesla Model 3 Long Range, Polestar 2 Long Range,
  and Hyundai Ioniq 6 AWD in Polish mid-premium EV sedan market.

