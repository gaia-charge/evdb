sales_notes: |
  Opel Grandland Electric is the flagship model in Opel's electric SUV lineup.
  Expected to be popular with German company car drivers (0.25% tax rate).
  Built in Germany (Eisenach) - supports local manufacturing and jobs.
  Positioned as practical, spacious family SUV with excellent range.

notes: |
  The Opel Grandland Electric Long Range at €49,990 offers excellent C-SUV value:

  **Key Advantages:**
  - Excellent 580km WLTP range (class-leading efficiency)
  - Fast 160kW DC charging (10-80% in 26 minutes)
  - Spacious interior with 550L trunk (best-in-class cargo)
  - RWD for balanced handling and efficiency
  - Built in Germany (Eisenach) - supports local jobs
  - Google Automotive Services built-in (no phone needed)
  - OTA updates for continuous improvement
  - V2L capability (3.7kW) for camping/emergencies
  - Heat pump standard (excellent winter range)
  - Intelli-Drive 2.0 semi-autonomous driving (Level 2+)
  - Company car tax benefit: 0.25% = €125/month (saves €4,499/year vs ICE)
  - Strong Opel dealer network (850+ locations)
  - 8-year/160,000km battery warranty

  **vs Peugeot e-3008 Long Range (platform sibling):**
  - Same price (€49,990)
  - More range (580km vs 525km) - larger 82 kWh battery
  - More cargo space (550L vs 520L trunk)
  - More conservative design (German practicality vs French flair)
  - Same STLA Medium platform, similar tech
  - Built in Germany vs France

  **vs Volkswagen ID.4 Pro:**
  - €1,000 cheaper (€49,990 vs €50,990)
  - Similar range (580km vs 552km)
  - More cargo space (550L vs 543L)
  - Newer platform (STLA Medium 2024 vs MEB 2020)
  - Google built-in (vs VW's proprietary system)
  - Faster DC charging (160kW vs 135kW)

  **vs Hyundai Ioniq 5 Long Range RWD:**
  - €1,000 cheaper (€49,990 vs €50,990)
  - Similar range (580km vs 570km)
  - More traditional SUV design vs futuristic Ioniq 5
  - 400V architecture vs Ioniq 5's 800V (slower charging)
  - More cargo space with rear seats up (550L vs 527L)

  **Best for:**
  - Families needing spacious SUV with excellent range
  - Company car drivers minimizing benefit-in-kind tax
  - German brand loyalty at competitive pricing
  - Road trip enthusiasts (580km range + 160kW charging)
  - Buyers wanting latest tech (Google built-in, OTA updates)
  - Supporting German manufacturing (built in Eisenach)

  **Considerations:**
  - New model (2024) - limited long-term reliability data
  - 16-week delivery time (high demand, new model)
  - 400V architecture (not 800V like Ioniq 5/EV6)
  - No ultra-fast 350kW charging capability
  - Base trim (Edition) starts at €46,990 with less features

  **Upgrade Path:**
  For €50,980 base + typical upgrades:
  - IntelliLux LED Pixel: +€1,490
  - Head-up display: +€990
  - Denon audio: +€1,290
  - 22kW charger: +€590
  - Total: ~€55,340 (still excellent value for fully loaded C-SUV)

  **Popular Configuration (GS Long Range):**
  - Base: €49,990
  - Metallic paint: +€795
  - 20" wheels: +€990
  - IntelliLux LED: +€1,490
  - Winter Package: +€890
  - Total: €54,155 (well-equipped for under €55k)

