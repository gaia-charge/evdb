notes: |
  **Market Positioning in Germany:**
  
  The Jeep Avenger Electric at €39,990 (€41,080 on-the-road) is priced competitively in the 
  B-SUV segment and brings Jeep's iconic brand to the electric market. As the 2023 European 
  Car of the Year winner, it offers strong credibility and value.
  
  **vs Direct Competitors:**
  - **Peugeot e-2008 Allure (€39,490)**: €500 cheaper, same platform, 405L trunk (vs 355L)
  - **Opel Mokka-e Ultimate (€38,990)**: €1,000 cheaper, same platform, 310L trunk
  - **Hyundai Kona Electric (€42,490)**: €2,500 more, better tech, 395L trunk, 484km range
  - **MG ZS EV Long Range (€36,990)**: €3,000 cheaper, larger, 440km range, less premium
  - **Nissan Ariya 63kWh (€50,990)**: €11,000 more, C-SUV segment, more space/range
  - **Kia Niro EV (€43,490)**: €3,500 more, better range (460km), more space
  
  **Key Selling Points:**
  - **2023 European Car of the Year** - First Jeep to win ECOTY
  - **Iconic Jeep design** - Seven-slot grille (blanked), rugged styling
  - **Excellent safety** - 5-star Euro NCAP with 91% adult protection
  - **Selec-Terrain system** - Enhanced traction for difficult conditions
  - **Well-equipped standard** - 10.25" screen, LED lights, keyless entry
  - **Compact and urban-friendly** - 4.08m long, easy to park
  - **400km WLTP range** - Adequate for daily use and weekend trips
  
  **Company Car Benefits:**
  With 0.25% monthly taxation (€100/month vs ~€1,180 for ICE Renegade), the Avenger 
  saves company car drivers ~€13,000 per year in taxes.
  
  **Package Recommendations:**
  
  **Budget Choice (€39,990 base):**
  - Longitude package included
  - Add Advanced Driver Assistance (€1,490) for safety
  - Total: €41,480 (€42,570 on-the-road)
  
  **Best Value (€42,480 with Altitude):**
  - Altitude Package (€2,490) - 18" wheels, front sensors, privacy glass
  - Advanced Driver Assistance (€1,490) - Essential for highway
  - Total: €43,970 (€45,060 on-the-road)
  
  **Premium Choice (€44,980 with Summit):**
  - Summit Package (€4,990) - Heated seats, sunroof, premium audio
  - Advanced Driver Assistance (€1,490) - Not needed, included in Summit
  - Total: €44,980 (€46,070 on-the-road)
  
  **Target Buyer:**
  
  Urban and suburban professionals who want:
  - Iconic Jeep brand with electric efficiency
  - Rugged styling that stands out from competitors
  - Compact dimensions for city parking
  - 400km range for daily commuting and weekend adventures
  - Good equipment levels without premium pricing
  - Strong safety credentials (ECOTY winner, 5-star Euro NCAP)
  
  The Avenger appeals to buyers who appreciate Jeep's heritage but want a practical,
  efficient electric vehicle for daily use. It's less spacious than competitors (355L 
  trunk vs 405L e-2008), but offers unique styling and the prestige of being 2023 ECOTY.
  
  **Real-World Performance:**
  - City range: ~450km (excellent urban efficiency)
  - Highway range (120 km/h): ~300km
  - Mixed driving: ~340km
  - Consumption: 15.5 kWh/100km average
  - Charging: 10-80% in 29 minutes at 100kW DC
  
  **Why Choose Avenger Over Platform Siblings (e-2008, Mokka-e)?**
  1. **Unique design** - Jeep styling stands out vs generic Stellantis look
  2. **Brand prestige** - Jeep heritage and ECOTY winner status
  3. **Selec-Terrain** - Enhanced traction vs competitors
  4. **Better safety** - 91% adult protection (vs 86% Mokka-e)
  5. **Competitve pricing** - Well-equipped vs €500 more for e-2008
  
  Trade-offs: Smaller trunk (355L vs 405L e-2008), but many buyers prioritize style 
  and brand over maximum cargo space in this segment.
