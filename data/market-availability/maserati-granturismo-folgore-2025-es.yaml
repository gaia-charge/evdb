notes: |
  Maserati GranTurismo Folgore is the all-electric version of the iconic
  gran turismo. Prices include 21% IVA. 100% electric with 760 CV (three
  motors, AWD), 0-100 km/h in 2.7 seconds. 92.5 kWh battery with 450 km
  WLTP range. 270 kW DC fast charging. Premium sound system, luxurious
  Italian interior with Alcantara and leather. Competes with Porsche Taycan
  Turbo S and Audi RS e-tron GT in the luxury electric GT segment.

