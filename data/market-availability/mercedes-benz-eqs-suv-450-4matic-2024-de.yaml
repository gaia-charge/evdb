  notes: "2024 German market pricing for Mercedes-Benz EQS SUV 450 4MATIC. €5,000 premium over RWD 450+ adds all-wheel drive with intelligent 4MATIC system. Base price at €120,900. Offers 600 km WLTP range (500 km real-world) - 60km less than RWD but still excellent. Faster acceleration: 6.0s vs 6.7s (RWD). Enhanced winter and off-road capability. Popular in northern Germany, Bavaria (Alps), and Austria. 4MATIC improves towing stability (1,800kg capacity). Off-Road Package (€3,570) with transparent hood camera and off-road mode popular option. Company car drivers save €7,248/year with 0.5% tax rate. Most popular configuration with MBUX Hyperscreen and key options ~€145k. Competes with BMW iX xDrive50 (€105,000, more sporty) and Audi Q8 e-tron 55 quattro (€90,000, less expensive)."
  updated_at: "2026-02-08"
