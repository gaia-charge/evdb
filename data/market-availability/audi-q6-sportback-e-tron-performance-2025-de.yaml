notes: >
  The Audi Q6 Sportback e-tron Performance at €68,800 in Germany is strategically priced just
  under the €70,000 company car tax threshold, making it extremely attractive for fleet buyers.
  With 656 km WLTP range, 270 kW charging, and comprehensive standard equipment (air suspension,
  heat pump, triple screens, V2L/V2H/V2G), it represents strong value vs BMW iX and Mercedes EQE SUV.
  The Sportback design adds style with a range advantage over the standard Q6 SUV.
