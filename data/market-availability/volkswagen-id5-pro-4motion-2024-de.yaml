# Market-Specific Details
availability_status: available
available_from: "2022-03-01"
delivery_time_weeks: 12
notes: |-
  AWD coupe SUV variant of ID.4 with dual motors and enhanced performance.
  Built at VW's Zwickau factory. Popular choice for winter regions and
  performance-oriented buyers.
  The ID.5 Pro 4MOTION combines sporty coupe SUV styling with all-wheel drive
  capability. German pricing starts at €57,000, positioning it between the
  RWD Pro (€52,000) and GTX performance variant (€63,000). Popular with
  business users and families in mountain/winter regions. The dual-motor
  AWD system provides excellent traction and significantly faster acceleration
  (6.3s vs 7.4s 0-100 km/h) compared to RWD. Most buyers add DCC adaptive
  dampers and IQ.DRIVE Max package. Typical delivery time 10-12 weeks.
  Competes with Tesla Model Y Long Range, Audi Q4 Sportback 50 quattro,
  and BMW iX1 xDrive30 in the premium AWD electric SUV segment.

