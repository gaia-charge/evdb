notes: |
  Tesla Model Y Performance 2025 at €59,490 (+€500 vs 2024).
  Fastest accelerating SUV under €60,000 (0-100 in 3.5 seconds).

  2025 updates:
  - Enhanced Autopilot (v12+ software)
  - Improved battery management
  - Minor interior refinements
  - Latest OTA features

  Performance vs Long Range AWD:
  - Price: +€6,500 (€59,490 vs €52,990)
  - 0-100: 3.5s vs 5.0s (-1.5s!)
  - Top speed: 250 vs 217 km/h
  - Range: 514 vs 533 km (-19km)
  - Wheels: 21" vs 19"
  - Track Mode: Yes vs No
  - Performance brakes with red calipers
  - Lowered suspension
  - Carbon fiber spoiler

  Key advantages:
  - Supercar acceleration (3.5s 0-100!)
  - Track Mode for circuit driving
  - Performance brakes
  - 21" Überturbine wheels
  - Carbon fiber spoiler
  - Lowered suspension
  - Access to 50,000+ Superchargers
  - Made in Germany (Gigafactory Berlin)
  - Over-the-air updates
  - Direct sales, no dealers
  - 0.25% company car tax benefit

  Competition:
  - BMW iX M60: €120,000 (2x price, similar 0-100)
  - Mercedes-Benz EQE 500 4MATIC: €91,000 (slower)
  - Porsche Macan Turbo Electric: €110,000+ (2x price)
  - Polestar 3 Performance: €84,000 (slower, more expensive)

  Best for:
  - Performance enthusiasts
  - Track day fans
  - Those who value acceleration
  - Premium features at reasonable price
  - Company car drivers (0.25% tax)

  Weaknesses:
  - Slightly lower range than LR
  - Higher consumption (21" wheels)
  - No traditional dealer network
  - Third row tight (if added)
  - Ride firmer than LR (lowered suspension)

