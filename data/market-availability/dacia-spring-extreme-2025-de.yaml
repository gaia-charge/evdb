  created_at: "2026-02-10"
  notes: |
    Dacia Spring Extreme 2025 is the top trim at €20,900 - still under €22k on-road.
    Adds the 65hp motor (vs 45hp), automatic climate, cruise control, reversing camera,
    alloy wheels, leather steering wheel over the Expression. The motor upgrade alone
    makes city driving much more pleasant. At just €2,000 over Expression, the Extreme
    represents excellent value. THG-Quote of €300/year is ~1.4% of purchase price annually.
  updated_at: "2026-02-10"
