notes: |
  The Mustang Mach-E Extended Range AWD is Ford's mainstream electric SUV 
  offering in Germany. Popular for its Mustang-inspired design, strong performance, 
  and good range. V2H/V2G capability requires Ford Charge Station Pro (80A). 
  BlueCruise hands-free driving available on German autobahns. The Mach-E 
  competes directly with Tesla Model Y, VW ID.4, and Hyundai Ioniq 5.

