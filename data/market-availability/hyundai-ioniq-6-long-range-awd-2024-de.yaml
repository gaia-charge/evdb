# Notes
notes: |
  The Hyundai Ioniq 6 Long Range AWD adds dual-motor all-wheel drive and exhilarating
  performance to the efficiency champion. At €53,990, it's identically priced to the
  Tesla Model 3 Long Range AWD (€53,990), creating a fascinating head-to-head battle.
  
  **AWD vs RWD Trade-offs:**
  - €3,000 premium over RWD (€50,990)
  - 95 km less range (519 vs 614 km WLTP)
  - 2.3 seconds faster 0-100 (5.1s vs 7.4s) - sports car territory!
  - 18% higher consumption (18.0 vs 15.2 kWh/100km real-world)
  - 96 kg heavier (1,951 vs 1,855 kg)
  + Electronic AWD with intelligent torque distribution
  + Superior winter capability (Snow/Mud mode)
  + Enhanced safety (all-season traction)
  
  **vs Tesla Model 3 Long Range AWD (identical €53,990 price):**
  - Tesla faster: 4.4s vs 5.1s 0-100 km/h
  - Tesla longer range: 629 vs 519 km WLTP (110 km advantage)
  + Ioniq 6 faster charging: 18 vs 25 min 10-80% (800V advantage)
  + Ioniq 6 better build quality, more premium interior
  + Ioniq 6 has 650 dealer network vs Tesla's 25 service centers
  + Ioniq 6 has 5-year warranty vs Tesla's 4 years
  
  **Target Buyers:**
  - Winter region residents (Bavaria, Alps, Scandinavia) needing AWD safety
  - Performance enthusiasts wanting sports car acceleration (5.1s!)
  - Company car drivers maximizing 0.25% tax benefit (saves €4,854/year)
  - Buyers prioritizing traction/safety over maximum range
  - Those who want AWD but can't afford BMW i4 xDrive40 (€8k more expensive)
  
  **Real-World Economics:**
  - €3,000 AWD premium = ~100 tanks of "fuel" (electricity)
  - Company car: 0.25% tax = €135/month vs €540 for ICE (saves €4,854/year)
  - 15,000 km/year home charging: €810 electricity + €1,300 insurance + €350 maintenance = €2,460 total
  - Break-even vs ICE: ~18-24 months for private buyers, immediate for company cars
  
  **Popular Configurations:**
  - Most popular: Select AWD (~€59k base) + Premium Package + Vision Package = ~€65-68k
  - Winter-ready: Style AWD + Winter Comfort + Vision + Sunroof = ~€62k
  - Performance: Vertex AWD fully loaded = ~€79k (sports car acceleration + luxury)
  
  Best for: Buyers who need AWD for winter/safety, want sports car performance (5.1s!),
  prioritize charging speed over maximum range, and value the 800V E-GMP architecture.
  Perfect middle ground between efficient RWD and expensive premium AWD competitors.

