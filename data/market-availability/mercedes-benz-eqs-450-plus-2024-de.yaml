notes: |
  The Mercedes-Benz EQS 450+ is the electric flagship sedan at €114,641 - the most expensive vehicle
  in the EVDB database. It offers uncompromising luxury with the world's most aerodynamic production car
  design (Cd 0.20), enabling 782km WLTP range from a massive 107.8kWh battery.
  
  **Pricing Context:**
  - Base: €114,641 (most expensive in database)
  - Well-equipped: ~€135,000 (MBUX Hyperscreen, AMG Line, key options)
  - Fully loaded: €160,000+ (Executive Rear Seat, E-Active Body Control, all luxury options)
  
  **Key Advantages:**
  - 782km WLTP range (650km real-world) - best in flagship sedan segment
  - World's most aerodynamic production car (Cd 0.20)
  - 10-year/250,000km battery warranty (best-in-class)
  - MBUX Hyperscreen optional (56-inch curved display, €8,330)
  - Rear-axle steering (turning circle 10.9m despite 5.2m length)
  - Ultra-quiet cabin with Acoustic Comfort Package
  - Factory 56 carbon-neutral production
  
  **Key Weaknesses:**
  - 400V architecture: only 200kW DC charging (vs Taycan 270kW, Ioniq 6 233kW)
  - 31-minute 10-80% charging (vs Ioniq 6: 18 min, Taycan: 22 min)
  - No V2G/V2L bidirectional charging
  - 6.2s 0-100 acceleration (leisurely for €115k flagship)
  - Limited towing: 750kg (vs Model S 1,600kg, i7 2,000kg)
  - 16-week delivery time (vs Ioniq 6: 12 weeks)
  
  **Company Car Tax Benefit:**
  - 0.25% monthly rate: €114,641 × 0.25% = €287/month
  - ICE equivalent 1% rate: €114,641 × 1% = €1,146/month
  - **Annual savings: €10,313** (massive benefit for luxury car buyers!)
  - Over 3-year lease: €30,939 tax savings
  
  **Popular Configurations:**
  - Base (€114,641): Rare, most buyers add MBUX Hyperscreen + AMG Line
  - Well-equipped (~€135,000): MBUX Hyperscreen, AMG Line, 22kW charger, Acoustic Comfort, Parking
  - Chauffeur spec (~€158,000): Executive Rear Seat, Burmester 3D, E-Active Body Control, Digital Light
  
  **Competitors:**
  - BMW i7 xDrive60 (€135,700): More traditional luxury, better towing, longer delivery
  - Porsche Taycan 4S (€118,737): Sportier, 800V fast charging, less practical
  - Tesla Model S Long Range (€94,990): €20k cheaper, faster, better software, less luxurious
  - Lucid Air Touring (€95,000): €20k cheaper, more range, faster charging, less brand prestige
  
  The EQS 450+ is for buyers who want the ultimate in Mercedes luxury, comfort, and range,
  and are willing to pay €115k+ (€135k-160k typically configured). The €10,313/year company car tax
  savings make it much more affordable for business users (effective cost ~€104k vs €115k).
  
  Build location: Factory 56, Sindelfingen, Germany (carbon-neutral, fully digital production).
  2022 World Luxury Car of the Year, German Car of the Year 2022.

