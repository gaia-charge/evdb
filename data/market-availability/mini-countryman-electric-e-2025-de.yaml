  notes: >
    Insurance slightly higher than Cooper Electric due to larger vehicle value.
    Maintenance comparable to BMW iX1. Charging costs assume 15,000 km/year
    at home electricity rate of €0.30/kWh.

market_positioning:
  competitors:
    - BMW iX1 eDrive20 (€48,050 - sibling on same platform, more conservative)
    - Volkswagen ID.4 Pro (€41,990 - more space, less premium)
    - Volvo EX30 (€36,590 - smaller, more affordable)
    - Kia EV6 (€46,990 - larger, more range)
  target_audience: Families and active lifestyle buyers seeking a premium compact electric SUV with character
  unique_selling_points:
    - Iconic Mini design on a larger, practical platform
    - Made in Germany (Leipzig plant)
    - 462km WLTP range competitive in segment
    - 130kW DC fast charging
    - 1,200kg towing capacity for active lifestyles
    - BMW Group quality and dealer network

notes: >
  The Mini Countryman E at €44,600 is positioned between the smaller Mini Cooper Electric
  and the sibling BMW iX1. Made in Leipzig, Germany, it offers genuine family practicality
  with 460L boot space while maintaining Mini character. The 130kW DC charging is a
  significant improvement over the Cooper Electric's 95kW. 8-week delivery time reflects
  good local production capacity.

