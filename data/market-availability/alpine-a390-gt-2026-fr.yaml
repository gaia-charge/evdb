notes: The Alpine A390 GT is the first sport fastback from Alpine, featuring 3 electric motors (400 hp), integral transmission with Alpine Active Torque Vectoring (AATV), 89 kWh battery, 555 km WLTP range, 0-100 km/h in 4.8s. Entirely designed and manufactured in France at the Alpine Dieppe factory. Features Devialet audio system, Alcantara and Nappa leather interior, 20" wheels with Michelin Sport EV tires, bidirectional 11 kW charger, 150 kW DC fast charging (15-80% in 29 minutes).
