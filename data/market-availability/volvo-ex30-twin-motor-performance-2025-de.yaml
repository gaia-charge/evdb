notes: The 2025 EX30 Twin Motor Performance dropped to €42,590 from €49,900, making it significantly more accessible. With 422hp and 3.6s 0-100, it's one of the fastest compact SUVs at any price point. The AWD system provides excellent traction and the sport-tuned suspension offers engaging driving dynamics while maintaining Volvo's trademark safety and comfort.
