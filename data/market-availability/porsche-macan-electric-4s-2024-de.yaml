pricing:
  base_price: 95550
  destination_charge: 0
  total_msrp: 95550
  pricing_notes: |
    Base price includes all RWD features PLUS:
    - 100kWh battery (95kWh usable)
    - 330kW (448hp) dual motors with intelligent AWD (360kW overboost)
    - Porsche Traction Management (PTM)
    - 800V architecture with 270kW DC fast charging
    - Two-chamber air suspension with PASM (sportier tuning)
    - 20" Macan 4S wheels (staggered, standard)
    - Sport seats with alcantara/leather
    - GT sports steering wheel (heated)
    - 3-zone climate control with heat pump
    - Porsche Communication Management (PCM) 6.1
    - 12.6" curved digital instrument cluster + 10.9" central touchscreen
    - Sound Package Plus (10 speakers)
    - LED Matrix headlights with PDLS Plus (standard on 4S!)
    - Adaptive cruise control with Stop & Go
    - Lane Keeping Assist with Lane Change Assist
    - 8-way power adjustable sport seats
    - Power liftgate
    - White painted brake calipers (4S badge)
    - Connected services for 3 years

    €15,100 premium over RWD justified by dual motors, AWD, upgraded brakes, 
    LED Matrix lights standard, sport seats, and GT steering wheel.

    German pricing includes 19% VAT. Build-to-order with extensive customization.

