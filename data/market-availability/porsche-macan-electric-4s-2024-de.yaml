  - Porsche Configurator (Germany)
  notes: |
    Pricing and specifications verified against official Porsche Germany website.
    4S is most popular variant, representing approximately 50% of Macan Electric 
    orders in Germany. Delivery times reflect current demand (22 weeks vs 20 for RWD).
  updated_at: '2026-02-08'
notes: "The Macan 4S represents the sweet spot in the Macan Electric lineup:\n- Sports car performance: 4.1s 0-100 km/h\n- AWD security: Porsche Traction Management, all-weather capability\n- Excellent range: 578km WLTP (only 35km less than RWD)\n- Ultra-fast charging: 270kW peak, 21 minutes 10-80%\n- Comprehensive equipment: LED Matrix lights, sport seats, GT steering wheel\n- Reasonable premium: €15k over RWD, €20k under Turbo\n\nAt €95,550, the 4S offers exceptional value vs competitors. BMW iX M60 costs \n€24k more for similar performance. Audi SQ6 e-tron is platform sibling at \nsimilar price but lacks Porsche prestige and driving dynamics.\n\nTarget buyers: Performance enthusiasts who need AWD, Porsche loyalists seeking \nelectric SUV with sports car character, company car drivers maximizing 0.5% \ntax benefit, families wanting practicality without compromising performance.\n\nBest value: Enthusiast configuration (€109,390) adds key performance options \n(PTV Plus, rear-axle steering, upgraded wheels/brakes) for €14k over base.\n\nThe 4S is the most popular Macan Electric variant in Germany, accounting for \n~50% of orders. It strikes perfect balance between performance, practicality, \nand price."
