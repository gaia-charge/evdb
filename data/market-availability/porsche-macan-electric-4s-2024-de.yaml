company_car_tax:
  rate_percent: 0.5
  calculation_basis: list_price
  calculation: |
    Vehicles priced over €70,000 qualify for 0.5% monthly taxation.

    Example calculation (base €95,550):
    - Monthly taxable benefit: €95,550 × 0.5% = €478/month
    - Annual taxable benefit: €5,736/year
    - Income tax on benefit (42% bracket): ~€2,409/year
    - Social contributions (~20%): ~€1,147/year
    - Total annual cost to employee: ~€3,556/year

    Comparison to combustion Macan S (1% rate at €72,000):
    - Annual taxable benefit: €8,640/year
    - Tax + social (62%): ~€5,357/year
    - Annual savings with 4S EV: €1,801/year

    Despite higher list price, Macan 4S Electric saves money vs combustion 
    Macan S thanks to 0.5% EV rate.

  notes: |
    Macan 4S qualifies for advantageous 0.5% company car tax rate.
    Private home charging reimbursable tax-free (€0.30/kWh or monthly flat rate).
    Total cost of ownership significantly lower than combustion equivalent.

