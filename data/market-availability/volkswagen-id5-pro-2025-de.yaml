notes: |-
  2025 model year ID.5 Pro available with updated software and features.
  Built at VW's Zwickau factory. Strong demand in Germany as coupe SUV
  alternative to ID.4.
  The 2025 ID.5 Pro offers strong value in the coupe SUV segment with its
  price reduction to under €50,000. Excellent company car taxation at 0.25%
  rate makes it attractive for business users. Key selling points: Made in
  Germany, good range (530 km WLTP), fast charging (175 kW), and sporty
  coupe styling. Main competitors are Tesla Model Y and Audi Q4 Sportback.

