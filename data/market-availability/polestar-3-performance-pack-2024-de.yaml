# Market Notes
notes: |
  Performance Pack adds €7,000 to base Polestar 3 price (from €83,900 to €90,900), delivering 
  517hp and 4.7s 0-100 km/h acceleration. Competes with BMW iX M60 (€135,300), Mercedes-AMG 
  EQS 53 (€148,023), and Audi SQ6 e-tron (€93,800).

  Excellent value proposition: 517hp Polestar 3 Performance costs €90,900 vs BMW iX M60's 
  €135,300 for similar performance (4.7s vs 3.8s 0-100). Audi SQ6 e-tron offers closer 
  performance at €93,800 but smaller size.

  Performance Pack includes comprehensive upgrades beyond just power: performance brakes 
  (gold calipers), forged 22" wheels, tuned air suspension, sport seats. Lowered by 5mm 
  for improved handling without sacrificing ride comfort.

  Direct-to-consumer ordering through polestar.com. Test drives at Polestar Spaces. 
  Service through Volvo network.

  Company car tax benefit (0.25% rule) makes this high-performance SUV very attractive 
  for business users. Monthly taxable benefit of €227 vs €909 for fossil fuel equivalent.

  Range reduced to 560km WLTP (from 610km on base model) due to increased power and 
  performance calibration, but still competitive for luxury SUV segment.

