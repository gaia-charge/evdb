# Notes
notes: |
  Renault Megane E-Tech EV60 Iconic is the flagship variant with comprehensive premium equipment.
  Standard features include matrix LED headlights, head-up display, 360° camera, heated seats/steering,
  and Alcantara/leather upholstery. The unique Solarbay electrochromic panoramic roof (optional)
  allows electronic tint adjustment without traditional sunshade.
  German EV incentives ended December 2023, so no federal subsidy available.
  Company car tax benefit (0.25%) applies for electric vehicles under €70,000.
  Delivery times around 12 weeks for top trim with custom configurations.
  Popular configuration: Rafale Grey metallic with Solarbay roof (~€49,050 total).

