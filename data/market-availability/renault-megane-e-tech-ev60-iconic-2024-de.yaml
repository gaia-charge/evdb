notes: |
  **Market Positioning in Germany:**
  
  The Renault Megane E-Tech EV60 Iconic at €45,990 (€46,980 on-the-road) is the flagship
  variant showcasing Renault's electric technology and premium aspirations:
  
  **vs Direct Competitors:**
  - **VW ID.3 Pro S (77 kWh, €47,495)**: Similar price, more range (557km), less features
  - **Cupra Born e-Boost (77 kWh, €48,990)**: €3k more, more range (548km), sportier
  - **Tesla Model 3 RWD (€42,990)**: €4k cheaper, more range (513km), minimalist interior
  - **BMW i4 eDrive35 (€53,500)**: €7.5k more, premium badge, similar range
  - **Polestar 2 Long Range (€49,900)**: €3k more, similar range, more premium positioning
  
  **What You Get (Iconic Premium Features):**
  
  **Lighting:**
  - Pure Vision LED Matrix headlights (adaptive, auto high-beam)
  - Worth €1,490 as standalone option on Techno
  
  **Vision:**
  - 360° Around View Monitor (4 cameras, bird's eye view)
  - Worth €890 as standalone option on Techno
  
  **Audio:**
  - Harman Kardon premium audio (10 speakers, 440W amplifier)
  - Worth €950 as standalone option on Techno
  
  **Comfort:**
  - Panoramic glass roof with electric blind (standard)
  - Worth €1,200 as standalone option on Techno
  - Massage function for driver and passenger seats (€600 value)
  - Electric passenger seat with lumbar support (€400 value)
  - Heated rear seats (standard)
  
  **Interior:**
  - Premium Alcantara inserts throughout cabin (€500 value)
  - Enhanced ambient lighting with customization (€300 value)
  
  **Wheels:**
  - 20" Austral diamond-cut alloy wheels with aero covers
  - Actually improves range by ~20km vs Techno's 18" wheels
  
  **Total Feature Value:** €6,240 worth of options for €3,000 premium = €3,240 savings!
  
  **Why Choose Iconic:**
  
  1. **"I want it all"** - Complete feature set without compromise
  2. **Matrix LED safety** - Adaptive headlights are game-changing for night driving
  3. **Premium audio** - Harman Kardon transforms music/podcast experience
  4. **Massage seats** - Relaxing for long drives, unexpected luxury
  5. **360° camera** - Confidence in tight parking situations
  6. **Panoramic roof** - Enhances cabin ambiance and perceived space
  7. **Better value** - €6,240 in features for €3,000 extra (52% discount!)
  
  **Company Car Excellence:**
  For company car drivers, the Iconic is particularly attractive:
  - 0.25% monthly tax: €115/month vs €460 for equivalent ICE
  - Annual savings: €4,140 in taxes
  - €30/month delta vs Techno (€115 vs €107)
  - Premium features essentially cost €360/year in extra tax
  - Worth it for Matrix LED and Harman Kardon alone
  
  **Target Buyer:**
  - **Tech professionals** who want the best technology
  - **Company car drivers** maximizing features while staying under €70k threshold
  - **Audio enthusiasts** who value Harman Kardon premium sound
  - **Safety-conscious buyers** who prioritize Matrix LED headlights
  - **Premium buyers** who want VW/BMW quality without premium brand price
  - **Early adopters** who showcase Renault's electric future
  
  **Real-World Ownership:**
  
  **Range (470km WLTP / 400km real-world):**
  - Daily commute: 100km → charge weekly
  - Weekend trips: 300km → no charging needed
  - Long trips: 130kW DC fast charging, 10-80% in 30 minutes
  - Winter: ~320km (20% reduction) still covers most needs
  
  **Charging:**
  - Home: 22kW AC (0-100% in 3.5 hours overnight)
  - Public: 130kW DC (adds 300km in 25 minutes)
  - IONITY: €0.35/kWh with Passport (€11.99/month)
  - Cost: ~€12 for full charge at home (60kWh × €0.20/kWh)
  
  **Running Costs (vs comparable ICE):**
  - Fuel: €12 vs €70 per 450km (€58 savings)
  - Service: €150/year vs €600/year (€450 savings)
  - Tax: €0 vs €250/year (€250 savings)
  - Insurance: Similar (~€800/year)
  - THG-Quote: -€300/year (selling CO2 certificate)
  - **Annual savings: ~€4,000 vs comparable ICE**
  
  **Who SHOULDN'T Buy Iconic:**
  - Budget-conscious buyers → choose Techno, save €3,000
  - Minimal option users → Techno offers a la carte options
  - Those who don't value audio → Harman Kardon wasted on podcasts-only listeners
  - Rural drivers without street parking → 360° camera not needed
  
  **Perfect Customer:**
  "I'm a software engineer with a company car budget of €50k. I want the latest tech,
  great audio for my Spotify playlists, and all the safety features. The tax benefit
  makes the €46k Iconic cost me €115/month. My old diesel cost €460/month in taxes.
  This is a no-brainer."
  
  **Sales Reality:**
  - 25% of Megane E-Tech sales (vs 60% Techno, 15% EV40)
  - Strong uptake in urban areas (Berlin, Munich, Hamburg)
  - Popular with company car drivers in tech/consulting
  - High satisfaction scores (4.7/5 average)
  
  **The Verdict:**
  The Iconic is objectively the best value in the Megane lineup IF you want/use the
  premium features. €6,240 worth of options for €3,000 extra is a 52% discount.
  
  But if you only care about 2-3 of those features, buy Techno and add them a la carte.
  
  **Recommendation:**
  - Want Matrix LED + 360° camera + Harman Kardon + roof? → Buy Iconic (saves €2,240!)
  - Want only Matrix LED + Harman Kardon? → Buy Techno + options (saves €1,010)
  - Want maximum range for minimum price? → Buy Techno base (best value overall)
  
  **Why Iconic Exists:**
  To showcase Renault's capability to build premium EVs that compete with BMW/Mercedes
  on features, while staying well under the €70k company car tax threshold. It works.
