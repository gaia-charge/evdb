# Notes
notes: |
  The Renault Megane E-Tech EV60 Iconic is the flagship variant with maximum
  equipment and slightly better efficiency (470 km WLTP, 400+ km real-world)
  thanks to aerodynamic 19-inch wheels and optimized heat pump.
  
  The Iconic trim includes everything from Techno PLUS:
  - Harman Kardon premium sound system (10 speakers)
  - Head-up display
  - Panoramic glass roof with electrochrome dimming
  - LED Pure Vision Matrix headlights with auto-leveling
  - Heated & ventilated front seats (vegan leather)
  - Highway & Traffic Jam Companion (Level 2 autonomous driving)
  - Hands-free parking
  - Extended OpenR Link ambient lighting
  - 19-inch aerodynamic wheels
  - Premium vegan leather throughout
  - Bidirectional charging (V2G/V2H)
  
  The Iconic emphasizes sustainable materials with vegan leather (TEP - Techno
  Eco Processed material) replacing traditional leather. The panoramic glass
  roof features electrochrome dimming for privacy and sun protection.
  
  Real-world range can exceed 400 km in optimal conditions with eco-driving.
  The improved aerodynamics (Cd 0.30) and heat pump efficiency make it the
  most efficient Megane E-Tech variant.
  
  Company car tax benefits remain at 0.25% as the vehicle is under €60,000
  gross list price. Monthly taxable benefit is €117.25.
  
  Delivery times are longer (16 weeks) as the Iconic is built-to-order with
  premium features. The vehicle is assembled at Renault's ElectriCity facility
  in Douai, France.
  
  Popular add-ons include the Premium Package (massage seats, extended ambient
  lighting) and Winter Pro Package (heated windshield and rear seats).

