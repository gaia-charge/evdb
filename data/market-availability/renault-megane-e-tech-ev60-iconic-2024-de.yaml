# Notes
notes: |
  Renault Megane E-Tech EV60 Iconic is the flagship trim with maximum range (470 km WLTP) 
  and premium equipment. Best efficiency (15.5 kWh/100km) in the lineup.
  
  Includes over €4,150 worth of premium features standard:
  - Solarbay panoramic sunroof
  - Harman Kardon audio
  - Head-up display
  - 360° camera with hands-free parking
  - Heated seats and steering wheel
  - Full ADAS suite (Highway & Traffic Jam Assist)
  
  Excellent value proposition compared to adding these options separately.
  Premium Alcantara/leather interior with exclusive Iconic stitching.
  
  Eligible for German EV incentives (€4,500) and company car tax benefits (0.25%).
  Popular choice for executives seeking premium features with EV tax advantages.
  
  Longer delivery times (16 weeks) reflect higher demand for top trim.

