# Notes
notes: |
  Renault Megane E-Tech EV60 Iconic is the flagship variant with premium
  equipment and advanced technology. With 470 km WLTP (390 km real-world),
  it offers excellent range for all scenarios. Premium features include
  Alcantara/leather seats with heating, ventilation, and massage; head-up
  display; LED Matrix headlights; 20-inch wheels; Harman Kardon premium
  audio; and Solarbay electrochromic panoramic roof. Highway & Traffic
  Jam Assist (ProPilot) provides semi-autonomous driving. Comprehensive
  safety suite with 360-degree camera. Winner of 2023 European Car of
  the Year. Qualifies for German environmental bonus and 0.25% company
  car taxation (under €60,000 threshold - excellent value for premium
  features). Delivery times currently 14 weeks. Manufactured in France
  at ElectriCity Douai plant.

