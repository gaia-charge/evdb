# Market-Specific Details
availability_status: available
available_from: "2023-04-01"
delivery_time_weeks: 16
notes: |-
  BMW's electric flagship sedan. Built on CLAR WE platform at BMW's
  Dingolfing factory in Germany. Target audience: luxury executive buyers
  seeking traditional sedan format with cutting-edge technology.
  The BMW i7 eDrive50 is positioned as BMW's electric flagship, competing
  with Mercedes-Benz EQS and Audi A8 hybrid. German pricing starts at
  €135,000, making it more expensive than the EQS base model but offering
  traditional sedan format with cutting-edge technology like Theatre Screen
  and Executive Lounge seating. Popular with business users due to favorable
  company car taxation (0.25% monthly). Typical delivery 12-16 weeks.

