notes: |
  Performance model: 0-100 km/h in 3.5 seconds - supercar acceleration!
  Track Mode enables torque vectoring and customizable performance settings.
  Performance Upgrade Package (€6,000 value) included in base price.
  21" Überturbine wheels reduce range by ~50km vs 19" wheels on Long Range.
  Performance Brakes with red calipers for improved stopping power.
  Lowered suspension (-10mm) for better handling and aerodynamics.
  Carbon fiber spoiler improves high-speed stability.
  Built at Gigafactory Berlin-Brandenburg, Germany (Grünheide).
  Made in Germany - fastest delivery times in Europe (2-4 weeks).
  Direct-to-consumer sales model via tesla.com (no dealerships).
  25 Tesla Service Centers across Germany.
  160 Supercharger locations in Germany (1,600+ charging stalls).
  8-year/192,000 km battery and drive unit warranty.
  4-year/80,000 km basic vehicle warranty.
  Over-the-air software updates add new features regularly.
  Faster than Porsche 911 Carrera (0-100 in 4.2s) but seats 5-7!

