notes: '- Kia EV6 was European Car of the Year 2022, providing strong credibility - Long Range RWD most popular variant (60% of EV6 sales in Germany) - Delivery times: 16 weeks (improved from 40+ weeks in 2022-2023) - Strong market presence with 450 dealers nationwide - Popular with company car drivers (0.25% tax rate) - Federal EV subsidy ended December 2023, but company car tax benefit remains - OTA software updates supported (Kia Connect subscription after 7 years) - V2G capability available but requires compatible home charger (€2,000-3,000) - 7-year warranty is best-in-class among European-market EVs - Resale values strong due to warranty and European COTY award'
