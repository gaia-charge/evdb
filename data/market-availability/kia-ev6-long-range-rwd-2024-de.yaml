# Strengths
strengths:
- "Best range in EV6 lineup (528km WLTP, 480km real-world)"
- "Excellent efficiency (16.5 kWh/100km WLTP, A-rated)"
- "800V architecture enables 18-minute 10-80% DC charging"
- "€4,000 cheaper than AWD while offering 22km more range"
- "Comprehensive standard equipment (AR HUD, Meridian audio, V2L)"
- "7-year/150,000km warranty (best in class)"
- "European Car of the Year 2022 credibility"
- "Strong dealer network (450 dealers in Germany)"
- "OTA software updates keep vehicle current"
- "V2G capability for home backup power"

# Weaknesses
weaknesses:
- "No AWD traction for winter/slippery conditions"
- "7.3s 0-100 km/h adequate but not sporty (vs 5.2s AWD)"
- "€50k price point no longer eligible for subsidies (ended Dec 2023)"
- "Rear seat legroom less than some rivals (Tesla Model Y, ID.5)"
- "Kia Connect subscription required after 7 years (€99/year)"
- "20\" wheels reduce range by ~15km (vs standard 19\")"
- "Matte paint option expensive (€1,490) and harder to maintain"

