notes: |
  Mercedes-Benz EQB 350 4MATIC at €64,990 is the performance flagship variant,
  offering 215kW/292hp AWD power and 6.2s 0-100 km/h acceleration. This makes it
  the fastest EQB, targeting buyers who prioritize performance over range.
  
  CRITICAL: LAST VARIANT UNDER €70,000 THRESHOLD (barely!)
  - Base price: €64,990 (€5,010 buffer to €70k)
  - With AMG Line: €69,750 (€250 buffer - still qualifies!)
  - With AMG + Premium: €72,725 (EXCEEDS - loses tax benefit!)
  
  Company car tax positioning:
  - At €64,990: 0.25% monthly = €162.48 taxable benefit
  - If over €70k: 1.0% monthly = €649.90+ taxable benefit
  - Annual savings: ~€4,875/year staying under threshold
  - BE VERY CAREFUL with options!
  
  Performance comparison across EQB range:
  
  | Variant | Power | 0-100s | Range | Price | €/kW |
  |---------|-------|--------|-------|-------|------|
  | 250+ FWD | 140kW | 9.0s | 474km | €56,990 | €407 |
  | 300 4M | 168kW | 8.0s | 423km | €60,590 | €361 |
  | 350 4M | 215kW | 6.2s | 411km | €64,990 | €302 |
  
  Best value: 350 4MATIC (€302/kW) - most power per euro
  
  Is 350 worth €8,000 over 250+?
  - Power: +75kW (+54% more power)
  - Acceleration: -2.8s 0-100 (-31% faster)
  - AWD: 4MATIC vs FWD (much better traction)
  - Range: -63km WLTP (-13.3% less range)
  - Value: Better €/kW ratio than 250+ or 300
  
  YES if:
  - You love fast acceleration and sporty driving
  - You need AWD for winter/mountains
  - €8,000 difference not significant
  - Performance > range priority
  
  NO if:
  - Range anxiety (411km vs 474km is meaningful)
  - Budget conscious (€8k is a lot)
  - Mainly city/commute driving (overkill)
  - Family 7-seater focus (250+ better value)
  
  Recommended configuration (stay under €70k!):
  - Base EQB 350 4MATIC: €64,990
  - AMG Line: +€4,760 = €69,750 (SAFE - under €70k!)
  - Stop there! Don't add more packages.
  - Alternative: Skip AMG, add Premium + Driver Assist
  
  Competitive analysis:
  - BMW iX1 xDrive30: €55,000, 230kW/313hp, 440km, better value
  - Audi Q4 e-tron 45 quattro: €53,900, 220kW/299hp, 520km, MUCH better value
  - Mercedes EQB 350 4MATIC: €64,990, 215kW/292hp, 411km, premium brand
  
  Brutal truth: The EQB 350 4MATIC is expensive for what you get.
  - BMW iX1 is faster, cheaper, more range
  - Audi Q4 is faster, cheaper, MUCH more range
  - Only advantage: Mercedes badge + optional 7 seats
  
  Who buys the 350?
  - Mercedes brand loyalists
  - Families needing 7 seats + performance
  - Company car drivers maxing out under €70k threshold
  - Buyers who prioritize badge over specs
  
  Strengths:
  - Fastest EQB (6.2s 0-100)
  - Still qualifies for 0.25% tax (if careful with options)
  - AWD 4MATIC standard
  - Mercedes brand prestige
  - Optional 7 seats (unique vs competitors)
  
  Weaknesses:
  - Expensive vs competition (€11k more than Audi Q4 45 quattro)
  - Modest 100kW DC charging (competitors: 150-175kW)
  - Shortest range of EQB family (411km)
  - Easy to exceed €70k with options (lose tax benefit)
  - Less space and range than cheaper competitors
  
  Verdict: Buy if brand matters more than value. Otherwise, BMW iX1 or Audi Q4 offer
  better performance and range for less money. The 350's main appeal is Mercedes
  badge + 7-seat option + staying under €70k company car threshold (barely).

