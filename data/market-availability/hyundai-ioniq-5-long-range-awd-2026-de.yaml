# Notes
notes: |
  The 2026 Ioniq 5 Long Range AWD is the most popular variant in Germany, offering
  the ideal balance of range, performance, and features. The 2026 model year brings
  significant improvements including increased battery capacity (82 kWh total, 77 kWh
  usable vs 77.4/72.6 kWh in 2024 models), slightly improved charging speeds (240 kW
  peak), and enhanced thermal management for better year-round performance.

  WLTP range of 498 km makes long-distance travel stress-free, and real-world range
  typically exceeds 400 km in mixed driving. The 800V architecture continues to
  deliver industry-leading charging times (10-80% in 17 minutes at 350kW stations).

  Vehicle-to-Load (V2L) capability (3.6kW) is standard and enables powering external
  devices, camping equipment, or serving as emergency backup power. The E-GMP
  platform's 3-meter wheelbase provides exceptional interior space with a flat floor,
  rivaling larger vehicles.

  Delivery times remain competitive at 14 weeks. Strong residual values and excellent
  reliability make it a popular choice for both private buyers and company car drivers.
  The 0.25% company car tax benefit significantly reduces taxation for business users.

