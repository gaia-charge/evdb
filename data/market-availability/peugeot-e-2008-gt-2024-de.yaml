notes: |
  **Market Positioning in Germany:**
  
  The Peugeot e-2008 GT at €43,490 (€44,580 on-the-road) is the premium offering in 
  Peugeot's B-SUV lineup - adding luxury, technology, and sporty styling over Allure.
  
  **GT Premium Over Allure (€4,000 extra):**
  - 18" bi-tone alloy wheels (vs 17")
  - Alcantara/TEP sport upholstery (vs cloth/TEP)
  - FOCAL Premium audio with 10 speakers (vs 6)
  - Park Assist with 360° camera (vs basic reversing camera)
  - Adaptive cruise control with Stop & Go (standard vs optional)
  - Keyless entry and start (standard vs optional)
  - Heated seats and steering wheel (standard vs optional)
  - GT body kit with black accents
  - Premium navigation with real-time traffic
  - Blind spot monitoring (standard vs optional)
  - Ambient lighting
  - GT badges and aluminum pedals
  
  **vs Competitors:**
  - **Opel Mokka-e Ultimate (€38,990)**: €4,500 cheaper, but smaller trunk (310L vs 405L)
  - **Nissan Ariya 63kWh (€50,000)**: €6,000 more, larger C-SUV, more range (450km)
  - **Jeep Avenger Summit (€44,000)**: Similar price, unique American styling
  - **Kia Niro EV Wave (€43,000)**: Similar price, better range (460km), 7-year warranty
  - **Volkswagen ID.3 Pro (€42,000)**: €1,500 cheaper, hatchback not SUV, more range (550km)
  
  **Key Selling Points:**
  - Best-in-class practicality (405L trunk) with premium equipment
  - Distinctive 3D i-Cockpit design with Alcantara sport interior
  - Comprehensive standard equipment (Park Assist, ACC, heated seats, premium audio)
  - Strong company car value (0.25% tax makes €4k GT premium cost ~€10/month)
  - 406km WLTP range sufficient for most use cases
  - Premium SUV feel at accessible price point
  
  **Company Car Sweet Spot:**
  For company car drivers, the GT's €4,000 premium over Allure costs only:
  - €4,000 × 0.25% = €10/month extra taxable benefit
  - Total tax: €109/month vs €99/month Allure
  
  This makes GT equipment excellent value for business users.
  
  **Recommended Configuration:**
  - Base GT (€43,490)
  - GT Premium Package (€2,490) - FOCAL audio, massage seats, wireless charging
  - GT Vision Package (€1,990) - Matrix LED headlights
  - Panoramic glass roof (€1,200)
  - Ultimate Red metallic (€995)
  - Total: €50,165 (~€51,255 on-the-road)
  
  At this spec, GT offers excellent value vs C-segment competitors like Nissan Ariya 
  (€55k+) while maintaining B-SUV maneuverability and lower running costs.
  
  **Target Buyer:**
  Professionals and families seeking a premium, well-equipped electric B-SUV without 
  stepping up to larger/pricier C-segment models. Ideal for company car drivers where 
  0.25% tax makes premium equipment essentially "free". Strong choice for those 
  prioritizing comfort, technology, and style over maximum range/performance.
