notes: |
  Škoda Enyaq Coupé iV vRS is the performance flagship of the Enyaq lineup, combining 220kW (299hp) 
  dual-motor AWD with the coupé's sporty styling and improved aerodynamics. Delivers thrilling 
  performance with 0-100 km/h in 6.5 seconds while maintaining impressive 528km WLTP range.
  
  Exceptional value: €17,000 cheaper than Audi SQ4 Sportback e-tron (€76,990) while offering 
  comparable performance (6.5s vs 6.3s 0-100 km/h). Includes approximately €8,000 worth of 
  standard equipment vs base Coupé iV 80:
  - Sport suspension (-15mm lower)
  - LED Matrix headlights
  - Canton Sound System (12 speakers, 570W)
  - Travel Assist Level 2 ADAS
  - Area View 360° camera
  - Heated seats front and rear
  - Heated steering wheel
  - vRS sport seats
  - 20-inch Taurus wheels (vRS exclusive)
  
  Company car buyers benefit from 0.25% tax rate (BEVs under €70,000) vs 1% for combustion vehicles - 
  annual tax savings of approximately €2,200 for 40% tax bracket employees.
  
  2024 facelift includes improved ME3 software with ChatGPT-powered Laura assistant, 135kW DC fast 
  charging (upgrade from 125kW), and enhanced efficiency. First vRS electric model from Škoda.

