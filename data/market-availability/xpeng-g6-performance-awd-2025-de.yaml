notes: The XPENG G6 Performance AWD at €51,600 is the flagship with 487 PS dual-motor AWD and 4.1s 0-100 km/h. Unique air suspension for the price. With 510km range and 451kW charging, it undercuts the Tesla Model Y Performance significantly while adding air suspension and V2L. Qualifies for 0.25% company car tax.
