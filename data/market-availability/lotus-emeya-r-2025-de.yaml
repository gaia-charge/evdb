notes: >
  The Emeya R is the ultimate expression of Lotus's electric grand tourer vision.
  With 675 kW (905 hp), it matches hypercars for acceleration (2.78s to 100 km/h)
  while maintaining 580 km range. At €153,950, it significantly undercuts Porsche
  Taycan Turbo S (€197,000) and Lucid Air Sapphire (€249,000). Carbon ceramic brakes,
  carbon fiber body panels, track-tuned suspension, rear-wheel steering, launch control,
  and drift mode come standard. The R represents Lotus's racing heritage in electric
  form - a genuine hyper-GT that can dominate both autobahn and racetrack. Most buyers
  add Carbon Pack Pro for maximum weight reduction and Track Pack for telemetry and
  onboard cameras. VIP delivery experience and track day invitation make ownership
  feel truly exclusive. 16-week delivery time reflects hand-assembled quality.
