notes: 'Ford Capri EV Standard Range RWD is the entry-level variant and only model eligible for 2024 bonus écologique (€4,000). Based on VW MEB platform (shared with Explorer EV, VW ID.5, Skoda Enyaq Coupé). Entry-level trim already well-equipped: 19" alloy wheels, full LED headlights, 14.6" sliding touchscreen, bi-zone climate control, heated front seats and steering wheel, electric 6-way driver seat, reversing camera, adaptive cruise control, lane keeping assist. Built in Cologne, Germany. SUV-coupé design with sportier styling than Explorer EV. Good family car with 572L trunk capacity.'
