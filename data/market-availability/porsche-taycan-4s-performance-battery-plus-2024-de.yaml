environmental:
  lifecycle_co2_tonnes: 42
  production_co2_tonnes: 18
  use_phase_co2_tonnes: 24
  end_of_life_co2_tonnes: 0
  assumptions: 200,000 km lifespan, EU electricity mix (50% renewable), 24.5 kWh/100km real-world
  notes: "Lifecycle CO2 assessment (Porsche published data, 2024):\n- Production (vehicle + battery): ~18 tonnes CO2\n- Use phase (200,000 km, EU mix): ~24 tonnes CO2 (0.12 kg/km)\n- End of life (recycling): ~0 tonnes (battery recycling offsets manufacturing)\n- Total: ~42 tonnes CO2 over 200,000 km lifecycle\n\nComparison vs ICE sports sedan (~200g/km):\n- ICE: ~65 tonnes CO2 over 200,000 km (production + use + end-of-life)\n- Taycan: ~42 tonnes CO2 (35% reduction)\n\nWith 100% renewable electricity:\n- Use phase: ~8 tonnes CO2 (production emissions only)\n- Total lifecycle: ~26 tonnes CO2 (60% reduction vs ICE)\n\nPorsche Zuffenhausen plant:\n- Carbon-neutral production (100% renewable electricity)\n- Biogas heating (carbon-neutral)\n- On-site solar panels\n- Green logistics (rail transport to/from suppliers)\n\nBattery sourcing:\n- LG Energy Solution (South Korea) - responsible sourcing certified\n- Cobalt: Conflict-free, audited supply chain\n- Lithium: Australian and Chilean sources (lower environmental impact)\n\nRecycling: Porsche partners with recycling companies to recover >90% of \nbattery materials. Used Taycan batteries have second-life applications \n(stationary storage) before recycling.\n"
metadata:
  data_quality: verified
  created_at: '2026-02-07'
  sources:
  - https://www.porsche.com/germany/models/taycan/taycan-models/taycan-4s/
  - https://finder.porsche.com/de/de-DE/ (official configurator)
  - https://www.bundesfinanzministerium.de (German tax law)
  - https://www.bafa.de (BAFA subsidy info)
  - Porsche Zentrum Stuttgart (dealer pricing confirmation)
  - Porsche Sustainability Report 2023
  notes: "Pricing and incentive information verified as of February 2024. German EV \nsubsidy (BAFA Umweltbonus) ended December 2023. Company car tax benefits \nremain strong through 2030. THG-Quote pricing varies monthly based on CO2 \ncertificate market rates.\n\nPorsche Taycan 4S is the most popular variant, offering excellent balance \nof performance, range, and value. With Performance Battery Plus, it delivers \n568km WLTP range - sufficient for daily driving and long-distance travel \nwith occasional fast charging stops.\n\nThe 800V architecture is Porsche's key differentiator. No other production \nEV charges faster: 10-80% in ~23 minutes is transformative for road trips. \nThis is the car that makes long-distance EV travel genuinely practical and \nconvenient.\n\nFor German buyers, company car tax benefits are game-changing. A €120k \nTaycan costs the same after-tax monthly benefit as a €30k ICE car (0.25% \nvs 1% taxation rate). This has driven strong Taycan adoption in business \nfleets.\n"
  updated_at: '2026-02-07'
notes: "The Taycan 4S Performance Battery Plus occupies a unique position: luxury electric \nsports sedan with no-compromise performance AND practical daily usability. The \n800V architecture is a game-changer for long-distance travel - you can add \n200km range in ~10 minutes at IONITY 350kW chargers.\n\nIn Germany, the company car tax benefit (0.25% vs 1%) makes the Taycan \nextremely attractive for business use. Monthly taxable benefit on a €120k \nTaycan is only €300/month (~€100 after-tax impact), while an equivalent \n€120k ICE sports sedan would be €1,200/month (~€480 after-tax).\n\nTypical German buyer profile:\n- Age: 45-60\n- Income: €150k+/year\n- Occupation: Executive, entrepreneur, tech professional\n- Previous vehicles: Porsche 911, BMW M3/M5, Mercedes AMG, Audi RS models\n- Motivation: Performance + sustainability, company car tax savings, technology\n\nSales volume: Porsche has delivered 150,000+ Taycans globally since 2019 launch. \nIn Germany, Taycan is the best-selling Porsche model (outselling 911 some months). \nThe 4S variant accounts for ~35-40% of Taycan sales."
