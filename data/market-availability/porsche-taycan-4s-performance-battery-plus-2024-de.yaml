options_notes: "Porsche offers extensive customization through online configurator and Porsche \nExclusive Manufaktur program. Popular option combinations:\n\n\"Comfort Touring\" spec (~€15k options):\n- 22kW AC charger, Comfort Package, Burmester audio, PSCB brakes, HUD, Passenger display\n\n\"Sport Performance\" spec (~€20k options):\n- PTV Plus, PCCB brakes, 21\" RS Spyder wheels, Sport Design Package, rear-axle steering\n\nAverage German Taycan 4S spec: ~€125-135k (€16-26k in options)\n"
available_incentives:
- name: BAFA Umweltbonus (Federal EV subsidy)
  amount: 0
  type: rebate
  eligibility: Not available (ended December 2023)
  valid_until: '2023-12-31'
  notes: "German federal EV subsidy (BAFA Umweltbonus) ended on December 17, 2023 \ndue to budget constraints. Vehicles ordered after this date do NOT receive \nfederal subsidy. Taycan 4S was previously ineligible anyway due to exceeding \n€65,000 price threshold for subsidy eligibility.\n"
- name: Company Car Tax (Dienstwagen-Besteuerung)
  amount: 10800
  type: tax_credit
  eligibility: 0.25% monthly taxation on list price (vs 1% for ICE)
  description: "Electric company cars benefit from 0.25% monthly taxation (vs 1% for ICE).\nCalculation: List price × 0.25% × 12 months = annual taxable benefit\n\nExample: €120,000 Taycan 4S (with options)\n- Electric: €120k × 0.25% × 12 = €3,600/year taxable benefit\n- ICE equivalent: €120k × 1% × 12 = €14,400/year taxable benefit\n- Tax savings: ~€10,800/year (assuming ~40% marginal tax rate)\n\n⚠️ Note: List price threshold of €70,000 was removed in 2023. All BEVs \nnow qualify for 0.25% rate regardless of price (previously only <€60k or \n<€70k vehicles qualified).\n"
  valid_until: '2030-12-31'
  notes: "Significant tax advantage for company car users. The 0.25% rate applies \nuntil end of 2030 (confirmed by German government). This makes expensive \nEVs like Taycan very attractive for company car fleets.\n"
- name: Kfz-Steuer (Vehicle Tax) Exemption
  amount: 350
  type: tax_exemption
  eligibility: All battery electric vehicles
  valid_until: '2030-12-31'
  description: "Battery electric vehicles (BEVs) are exempt from annual vehicle tax \n(Kfz-Steuer) until December 31, 2030. After 2030, a reduced rate will \napply (50% of ICE equivalent, capped at €50/year for weight <3.5t).\n\nSavings for Taycan: ~€300-400/year vs equivalent ICE sports sedan\n"
  notes: Federal tax exemption, applies to all BEVs registered by 2030
- name: THG-Quote (Greenhouse Gas Reduction Quota)
  amount: 300
  type: rebate
  eligibility: All BEV owners
  description: "THG-Quote (Treibhausgasminderungs-Quotenhandel) allows EV owners to sell \ntheir vehicle's CO2 savings certificate to fuel companies. Various platforms \n(emobia, Geld für eAuto, etc.) handle this process.\n\nAverage payout: €250-350/year (varies by market price for CO2 certificates)\nProcess: Submit vehicle registration, receive payment once per year\n"
  valid_until:
  notes: "Easy additional income for EV ownership. Payouts have decreased from €400+ \nin 2022 to €250-350 in 2024 as more EVs enter market. Still worth doing - \ntakes 5 minutes online annually.\n"
