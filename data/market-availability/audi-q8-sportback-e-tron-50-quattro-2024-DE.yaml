company_car:
  gross_list_price: 75900
  tax_rate_percent: 1.0
  monthly_tax_eur: 632.5
  notes: |
    🔴 WARNING: €75,900 price exceeds €70,000 threshold!
    Company car tax rate: 1.0% (over €70k) instead of 0.25% (under €70k).
    Annual company car tax: €7,590 (vs €1,898 if under €70k).
    Extra cost vs under-€70k EV: €5,692 per year (€474/month).

    Comparison to BMW iX1 xDrive30 (€61,500):
    - BMW annual tax: €1,845 (0.25% rate, under €70k)
    - Q8 50 Sportback annual tax: €7,590 (1.0% rate, over €70k)
    - Extra cost for Q8: €5,745/year (€479/month)

    Most company car buyers opt for Q8 50 SUV (€72,900) or step up to 55 Sportback (€82,900)
    since all exceed €70k threshold anyway, or choose BMW iX1/Mercedes EQA to stay under €70k.

