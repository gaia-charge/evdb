market_positioning:
  target_audience: "Style-focused buyers wanting coupe SUV design at lower entry price than 55 Sportback"
  strengths:
  - "Sportback coupe styling with Cd 0.26 aerodynamics"
  - "505km WLTP range (adequate for most use cases)"
  - "Quattro AWD and Audi luxury at lower price point"
  - "€7,000 savings vs 55 Sportback"
  weaknesses:
  - "Exceeds €70k company car threshold by €5,900"
  - "400V architecture limits DC charging to 150kW"
  - "Adaptive air suspension costs extra (€2,400)"
  - "Most buyers step up to 55 Sportback for better range"
  notes: |
    Niche variant - most buyers either choose:
    1) 50 SUV (€72,900) for more cargo space at similar price
    2) 55 Sportback (€82,900) for maximum range in sleek package

    Best for: Buyers who prioritize coupe styling and want lowest entry price,
    don't need maximum range, and aren't company car buyers (tax penalty).

environmental:
  lifecycle_co2_tonnes: 42
  production_co2_tonnes: 19
  use_phase_co2_tonnes: 11
  end_of_life_co2_tonnes: 12
  notes: |
    Based on 200,000km lifecycle with EU electricity mix (300g CO2/kWh).
    Smaller battery (89kWh vs 106kWh) means lower production emissions.
    Better aerodynamics (Cd 0.26) means lower energy consumption than SUV.
    With 100% renewable electricity: ~27 tonnes total (36% reduction).
  calculation_method: "Audi lifecycle assessment methodology"
  source: "https://www.audi.com/en/company/sustainability/product/life-cycle-assessment.html"

production:
  plant: "Audi Brussels, Belgium"
  notes: |
    Built at Audi's carbon-neutral Brussels plant.
    Plant powered by 100% renewable electricity.
    First Audi plant to achieve carbon-neutral production (since 2018).
    Sportback requires additional tooling for unique rear body panels.

metadata:
  created_at: "2026-02-06"
  data_quality: verified
  notes: |
    Entry-level Sportback coupe with improved aerodynamics (Cd 0.26) and 505km WLTP range.
    Niche positioning - caught between cheaper 50 SUV and longer-range 55 Sportback.
    Company car tax warning: €75,900 exceeds €70k threshold (1% vs 0.25% rate).
    Best choice for private buyers who want Sportback styling without paying 55 premium.
    Trade-off: -41L trunk vs SUV (528L vs 569L), but still spacious for coupe SUV.
  updated_at: "2026-02-06"
  sources:
  - https://www.audi.de/de/brand/de/neuwagen/q8-e-tron.html
