  market_position: |
    The CLA 250+ is positioned as Mercedes' new electric sedan for the mainstream premium
    segment. At an estimated ~€49,900 it undercuts the BMW i4 significantly while offering
    superior charging speed (353 kW vs 205 kW) and competitive range.
    
    The 800V architecture and 16-minute 10-80% charging time make it one of the fastest-
    charging sedans on the market. Combined with the new MB.OS and MBUX Superscreen,
    it represents a generational leap from the EQA/EQB.

