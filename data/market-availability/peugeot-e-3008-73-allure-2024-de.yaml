notes: |
  The all-new Peugeot e-3008 73 kWh Allure offers exceptional value in the compact electric
  SUV segment. At €48,990, it undercuts VW ID.4 Pro (€52,000), Škoda Enyaq iV 60 (€49,990),
  and Ford Mustang Mach-E (€54,000) while offering cutting-edge technology.
  
  Key selling points for German market:
  - Segment-first 21" Panoramic i-Cockpit curved display
  - ChatGPT voice assistant integration (unique in class)
  - 525 km WLTP range with 73 kWh battery
  - 160kW DC fast charging (10-80% in 27 minutes)
  - 520L trunk (best-in-class space efficiency)
  - Qualifies for 0.25% company car taxation
  - French ride comfort and sophisticated design
  
  The e-3008 represents Peugeot's first ground-up electric SUV design with no ICE compromises.
  The revolutionary interior with its massive curved display and advanced AI voice assistant
  make it feel a generation ahead of German competitors.
  
  Recommended configuration: Add Heat Pump (€1,090) and Winter Package (€790) for optimal
  German climate performance. With these options, total price is €50,870 - still excellent
  value vs competition.
  
  Strong alternative to: VW ID.4, Škoda Enyaq iV, Tesla Model Y RWD, Hyundai Ioniq 5,
  Kia EV6, Ford Mustang Mach-E.
