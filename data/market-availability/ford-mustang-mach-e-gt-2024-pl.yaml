notes: |
  Ford Mustang Mach-E GT available in Poland through authorized Ford dealers.
  Prices include 23% VAT. High-performance 487 hp AWD variant with 88 kWh battery.
  0-100 km/h in 3.7 seconds, making it Ford's fastest production car ever sold in Europe.
  490 km WLTP range. GT features include MagneRide adaptive suspension, Brembo brakes,
  20-inch wheels, sport seats, and performance-tuned drive modes.
  150 kW DC fast charging (10-80% in ~38 minutes).
  Optional GT Technology Package (4,000 PLN) adds panoramic glass roof with IR filter.

