notes: 'The 2025 BMW i5 Touring eDrive40 is the electric estate version of the i5,
  launched in 2024.

  It''s the world''s first fully electric premium estate car, combining practical
  cargo space

  with electric drivetrain efficiency.


  Key highlights:

  - 570L boot volume (1,700L with seats folded) - class-leading for electric estate

  - 560 km WLTP range (real-world ~450 km)

  - Optional self-leveling rear air suspension (ideal for towing/loading)

  - 2,000 kg towing capacity (one of the highest among electric sedans/estates)

  - Roof rails standard for additional cargo options


  The Touring variant adds ~30 kg over the sedan but maintains similar performance.

  Slightly reduced range vs sedan (560 km vs 572 km) due to marginally higher weight

  and different aerodynamics.


  Competes with:

  - No direct BEV estate competitors (unique segment position)

  - Mercedes EQE (sedan only, no estate)

  - Volkswagen ID.7 Tourer (more affordable, less premium)

  - Polestar 5 (GT hatch, less practical)

  '
