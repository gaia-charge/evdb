# Notes
notes: >
  The Renault Twingo E-Tech Urban 40 is the base variant of the all-new 
  electric Twingo. Built on the AmpR Small platform shared with the Renault 5, 
  it's positioned as an ultra-affordable entry point to electric mobility. The 
  retro-inspired design pays homage to the beloved 1993 original Twingo. With a 
  40 kWh LFP battery delivering 300km WLTP range and a starting price of €21,590 
  in Germany, it undercuts most competitors. The 60 kW motor is adequate for city 
  driving. Compact 3.79m length and tight turning circle make it ideal for urban 
  environments. Produced in Slovenia at the Revoz plant in Novo Mesto.
