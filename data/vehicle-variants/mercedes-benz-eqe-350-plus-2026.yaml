notes: 2026 model year brings incremental but meaningful improvements to Mercedes-Benz's
  executive electric sedan. Battery capacity increased from 90.6kWh to 94kWh usable,
  adding 26km WLTP range. DC fast charging improved to 180kW peak (from 170kW). Enhanced
  MBUX Hyperscreen with improved AI voice assistant and natural language understanding.
  Rear-axle steering now standard (was optional), reducing turning circle from 12.5m
  to 10.7m - excellent for urban maneuverability. Improved aerodynamics and efficiency
  (16.3 kWh/100km vs 17.1) thanks to optimized heat pump and thermal management. Real-world
  range of 575km makes it excellent for executive use and long-distance travel. EQE
  350+ is RWD only; AWD available in EQE 4MATIC variants. Competes with BMW i5 eDrive40,
  Audi A6 e-tron, Tesla Model S. Popular choice for executives wanting Mercedes luxury,
  technology, and efficiency in electric sedan format. MBUX Hyperscreen is a stunning
  56-inch curved display stretching across entire dashboard. Excellent highway efficiency
  at 130 km/h (485km real-world) thanks to 0.22 drag coefficient.
