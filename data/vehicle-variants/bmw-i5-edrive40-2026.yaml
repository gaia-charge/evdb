notes: 'The 2026 i5 eDrive40 receives BMW''s new Operating System 9.0 with enhanced
  AI voice assistant and improved user interface. Software optimizations deliver 590km
  WLTP range (+8km), while the charging curve sees improvements in the 30-70% SoC
  range. Optional 22kW AC charging becomes available, addressing a common customer
  request. The Augmented View navigation feature, previously optional, is now standard.
  The 2026 model competes directly with Mercedes EQE 350+ and maintains its position
  as a premium company car choice with 0.25% tax benefit in Germany. Real-world range
  now approaches 500km in mixed conditions, making it suitable for long-distance business
  travel.

  '
