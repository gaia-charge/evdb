notes: 'The Rolls-Royce Spectre is the world''s most expensive production BEV and
  the marque''s  first electric vehicle. At nearly 3 tonnes, it prioritizes ride comfort
  and luxury over  efficiency, delivering the signature Rolls-Royce "magic carpet
  ride" in electric form.  The 102 kWh battery provides 517 km WLTP range with 195kW
  DC charging. Built on the  Architecture of Luxury platform shared with Phantom and
  Cullinan. The Spectre occupies  a unique market position with no direct BEV competitors
  at its price point. Coach doors,  Starlight Headliner, and bespoke luxury throughout.
  European deliveries began Q4 2023.

  '
