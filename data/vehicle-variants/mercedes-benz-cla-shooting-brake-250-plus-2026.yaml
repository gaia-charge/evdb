  notes: |
    The Shooting Brake 250+ is the estate variant of the CLA Electric.
    Slightly heavier (+20 kg) and less aerodynamic than the sedan, resulting in
    565 km real-world range vs 585 km for the sedan (-3.4%).
    455L trunk is 50L larger than the sedan (405L).
    
    One of very few electric estates on the European market alongside:
    - Audi A6 Avant e-tron (from €75,600)
    - BMW i5 Touring (from €70,200)
    - Peugeot e-308 SW (from €39,350)
    
    At a significantly lower price point than the Audi and BMW, the CLA Shooting Brake
    could be very attractive for families wanting an electric estate.

