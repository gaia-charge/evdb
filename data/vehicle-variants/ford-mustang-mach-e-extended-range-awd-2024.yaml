notes: |
  The Extended Range AWD is the most popular Mach-E configuration, offering 
  excellent range, all-weather capability, and strong performance. Dual permanent 
  magnet motors provide AWD traction and spirited acceleration. 88 kWh battery 
  enables 540 km WLTP range. DC fast charging peaks at 150 kW with 400V 
  architecture. Ford's Intelligent Backup Power enables V2H/V2G for home backup 
  during outages. Features include BlueCruise hands-free highway driving 
  (subscription required).

