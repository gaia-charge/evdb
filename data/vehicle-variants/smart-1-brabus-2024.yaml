  notes: >
    Performance flagship Smart #1 tuned by Brabus. Increased power to 315kW (428hp) 
    with 543 Nm torque delivers supercar-like 3.9s 0-100 km/h acceleration. 
    Sport suspension lowers car 10mm, unique Brabus exterior styling with aggressive 
    body kit and 19" wheels. Nappa leather interior with Alcantara accents. 
    Range reduced to 400km WLTP due to higher performance. Competes with Mini 
    Cooper SE JCW, Abarth 500e, and entry-level hot hatches. Most powerful 
    compact electric crossover in its price segment.
