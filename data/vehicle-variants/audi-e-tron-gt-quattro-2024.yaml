notes: |
  Base variant of e-tron GT lineup. Shares J1 platform with Porsche Taycan.
  350 kW (476 hp) quattro AWD with 4.1s 0-100 km/h performance.
  488 km WLTP range. 800V architecture: 270 kW DC fast charging, 22.5 min 10-80%.
  Built at Audi Sport facility in Neckarsulm (shared with R8).
  89% of e-tron GT sales in 2023 were quattro base variant (volume seller).

