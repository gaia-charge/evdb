notes: 'The NIO ET5 100 kWh provides 590 km WLTP range, competitive with Tesla Model
  3 Long  Range and BMW i4 eDrive40. The larger battery adds approximately 60 kg over
  the 75 kWh  variant. Via BaaS, customers can purchase at €47,500 + €289/month battery
  rental, or buy  outright at €68,500. The 100 kWh battery is swappable at NIO Power
  Swap stations. DC  charging peaks at 140kW which is below some competitors, but
  battery swap capability  (3-5 minutes) provides an alternative fast refueling option.

