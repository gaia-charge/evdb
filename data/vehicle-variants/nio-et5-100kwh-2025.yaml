overview: 'The NIO ET5 100 kWh is the long-range variant equipped with a 100 kWh battery
  pack  providing 590 km WLTP range. It shares the same dual-motor AWD powertrain
  — 360kW  (490 PS) combined output with 700 Nm torque and 4.0s 0-100 km/h. Available
  for purchase  with battery (€68,500) or via Battery-as-a-Service at €47,500 plus
  €289/month battery  rental. DC fast charging supports up to 140kW.

  '
