description: '2025 Genesis Electrified G80 receives a comprehensive facelift with
  significant battery

  and charging upgrades. Battery capacity jumps from 87.2 kWh to 94.5 kWh usable,
  boosting

  WLTP range from 520 km to an impressive 570 km — closing the gap with rivals like
  the

  Mercedes EQE. DC charging improves from 175 kW to 187 kW peak. The dual-motor AWD

  powertrain retains 272 kW (370 PS) combined output with 700 Nm torque, delivering
  a

  refined 5.1-second 0-100 km/h sprint. Exterior updates include refreshed Two Lines

  lighting signature, updated grille design, and new wheel options. Interior receives

  updated infotainment with faster processor and refined materials. Flagship luxury

  standard equipment remains comprehensive: Lexicon 21-speaker audio, Nappa leather

  quilted seats with massage, multi-chamber air suspension, Highway Driving Assist
  2,

  Face Connect biometric authentication, and dual 12.3-inch panoramic displays.

  '
