  notes: |
    2025 model year Porsche Macan Electric RWD. Minor updates over 2024: improved 
    software (PCM 6.2), refined charging curve in cold weather, marginal range 
    improvement (616 vs 613km WLTP), 0.1s faster 0-100. Core hardware unchanged.
    Remains the best-value entry into electric Porsche SUV ownership with longest 
    range, best efficiency, and same 800V charging as higher trims.
