    connector_type: Type2
    phases: 3
    time_0_100_hours: 9.5
    notes: |
      Standard 11kW AC (3-phase). Optional 22kW upgrade (€1,680) halves charge time.

  dc:
    max_power_kw: 270
    connector_type: CCS2
    architecture_voltage: 800
    time_10_80_minutes: 21
    time_5_80_minutes: 21
    notes: |
      800V architecture delivers 270kW peak charging (15-30% SoC). 10-80% in 
      ~21 minutes with preconditioned battery. 100km range added in ~5 minutes. 
      2025 software update improves charging curve consistency in cold weather.

