id: porsche-macan-electric-rwd-2025
name: Porsche Macan Electric (Base RWD) (2025)
model_id: porsche-macan-electric
model_year: 2025
variant_name: "(Base RWD)"
trim_level: Base

description: |
  The 2025 Porsche Macan Electric RWD continues as the entry-level variant of 
  Porsche's electric compact SUV. Built on the PPE platform with 800V architecture, 
  it offers the longest range and best efficiency of the Macan Electric lineup. 
  2025 updates include refined software, improved charging curve management, and 
  updated Porsche Communication Management (PCM) with enhanced route planning.

battery:
  usable_kwh: 95.0
  total_kwh: 100.0
  chemistry: NMC
  cells: prismatic
  manufacturer: Samsung SDI
  supplier: Samsung SDI
  modules: 12
  cells_total: 180
  nominal_voltage: 662
  pack_voltage_range: "560-830V (800V architecture)"
  warranty_years: 8
  warranty_km: 160000
  warranty_capacity_percent: 70
  thermal_management: liquid-cooled
  heating: integrated battery heating
  preconditioning: true
  notes: |
    PPE platform 100kWh battery with 800V architecture. 12 modules with 15 
    prismatic cells each. Advanced thermal management with heat pump integration. 
    Preconditioning via navigation or Porsche Connect app.

range:
  wltp_km: 616
  wltp_city_km: 775
  wltp_highway_km: 503
  epa_km: 493
  epa_miles: 306
  real_world_km: 525
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    WLTP 616km (marginal improvement over 2024's 613km through software tuning). 
    Longest range of all Macan Electric variants. Real-world approximately 525km 
    in mixed conditions. Winter range approximately 455km.

efficiency:
  wltp_kwh_per_100km: 18.0
  epa_kwh_per_100km: 20.8
  real_world_kwh_per_100km: 22.2
  real_world_conditions: "Mixed driving, 20°C ambient"
  notes: |
    Most efficient Macan Electric variant at 18.0 kWh/100km WLTP. Single rear 
    motor eliminates front motor drag losses.

