notes: 'The Alfa Romeo Junior Veloce is the performance variant of Alfa Romeo''s first
  electric vehicle. Featuring a dual-motor AWD setup producing 280 hp combined, it
  accelerates from 0-100 km/h in 5.9 seconds and reaches 200 km/h. Built on the Stellantis
  eCMP2 platform with enhanced suspension tuning and torque vectoring, the Veloce
  delivers the sportiest driving experience in the B-SUV electric segment. Standard
  Alcantara sport seats, 19" dark wheels, sport body kit, and 360-degree camera differentiate
  it from the Speciale. Competes with MINI Cooper SE, Cupra Born VZ, and Abarth 500e
  in the sporty electric compact segment.

  '
