overview: 'The XPENG G6 Long Range is the mid-range variant offering the best balance
  of range and value. With a larger 80.8kWh LFP battery, it achieves 525km WLTP range
  while maintaining a single rear-mounted PSM motor producing 218kW (296 PS). The
  800V SiC architecture supports ultra-fast DC charging up to 451kW, enabling 10-80%
  in just 12 minutes. This makes it one of the fastest-charging vehicles in its segment.
  Standard equipment matches the Standard Range with the addition of 20-inch wheels.

  '
