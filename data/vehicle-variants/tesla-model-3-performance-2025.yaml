description: |
  The 2025 Tesla Model 3 Performance (Highland) is the high-performance variant of the refreshed
  Model 3. With 461 kW (627 PS) from dual motors, it delivers a blistering 3.4s 0-100 km/h and
  a top speed of 262 km/h - making it one of the fastest sedans under €60k. The NMC battery
  (LG 5M cylindrical cells) provides 79 kWh usable capacity with 571 km WLTP range.
  
  Distinguishing features include a carbon fiber rear spoiler, lowered suspension, performance
  brakes, 20" Warp wheels, and Track Mode. Despite the performance focus, it maintains excellent
  efficiency at 15.3 kWh/100km real-world and supports 250 kW DC fast charging.

