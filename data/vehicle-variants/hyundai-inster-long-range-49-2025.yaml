notes: "The Hyundai INSTER Long Range with 49 kWh battery delivers a segment-leading 370 km WLTP range for a city car. The 85 kW (115 PS) motor provides adequate performance (10.6s 0-100 km/h) while maintaining excellent efficiency at 14.9 kWh/100km. This is the recommended variant for most buyers - the extra 43 km range and 14 kW power over the Standard version justify the price premium. V2L capability makes it practical for outdoor activities and emergencies. The Trend trim adds heated seats, sliding rear seats, and V2L preparation as standard. Available in Cross variant with rugged styling, 17-inch wheels, and exclusive Amazonas Green Matte color. World Electric Vehicle of the Year 2025 and TopGear.com Supermini of the Year 2026."

