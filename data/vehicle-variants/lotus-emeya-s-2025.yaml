notes: >
  The Lotus Emeya S is the mid-range performance variant with 630 kW (857 hp) combined power,
  achieving an incredible 0-100 km/h in just 2.78 seconds - making it one of the fastest
  4-door production cars ever made. Despite the increased power, it maintains 595 km WLTP range
  thanks to the exceptional 0.21 drag coefficient. Standard equipment includes rear-wheel steering,
  Meridian Signature audio, carbon fiber trim, Track Mode with telemetry, and premium 4-seat
  interior with massaging seats. Competes directly with Porsche Taycan Turbo S.
