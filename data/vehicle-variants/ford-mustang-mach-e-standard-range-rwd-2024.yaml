notes: |
  The Standard Range RWD is the most affordable Mach-E variant, offering a 
  balanced combination of range, performance, and price. Rear-wheel drive with 
  a single permanent magnet motor provides efficient operation and spirited 
  performance. 68 kWh battery enables 440 km WLTP range, sufficient for most 
  daily driving needs. DC fast charging peaks at 150 kW. Includes Ford's 
  Intelligent Backup Power for V2H/V2G capability. Standard features include 
  SYNC 4A with 15.5-inch vertical touchscreen, Ford Co-Pilot360 driver assist.

