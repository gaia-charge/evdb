  notes: >
    Larger battery "E" variant with 54.2kWh usable capacity. The base model with 40.7kWh
    offers 305km WLTP range. This E variant is the most popular choice for customers
    wanting more range. Real-world consumption is excellent for a fun-to-drive urban EV.
    
    DC charging speed of 95kW is adequate for the battery size - 10-80% in 30 minutes
    is competitive with other 50kWh+ vehicles on 400V architecture.
    
    Front-wheel drive with 160kW (218hp) provides the classic Mini go-kart handling
    experience with instant electric torque. Weight of 1,590kg is kept relatively low
    for an EV thanks to compact dimensions.
