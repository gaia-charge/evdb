motors:
  count: 1
  type: Permanent Magnet Synchronous Motor (PMSM)
  configuration: RWD (rear-wheel drive)
  rear_motor:
    power_kw: 240
    power_hp: 326
    type: PMSM
  combined_power_kw: 240
  combined_power_hp: 326
  overboost_power_kw: 280
  overboost_power_hp: 380
  overboost_duration_seconds: 10
  torque_nm: 345
  notes: |
    Taycan RWD features single rear motor:
    - Rear: 240kW (326hp) continuous, 280kW (380hp) overboost
    - Torque: 345 Nm (lower than AWD variants but sufficient for spirited driving)
    
    Overboost (Launch Control): 280kW for ~10 seconds during hard acceleration.
    Pure rear-wheel drive provides classic sports car feel with excellent 
    handling balance and driver engagement.

drive_type: RWD
driven_wheels: rear

performance:
  acceleration_0_100_kmh_seconds: 5.4
  acceleration_0_60_mph_seconds: 5.1
  acceleration_0_200_kmh_seconds: 19.8
  top_speed_kmh: 230
  top_speed_electronically_limited: true
  notes: |
    Taycan RWD Performance Battery Plus with overboost (Launch Control):
    - 0-100 km/h: 5.4 seconds
    - 0-60 mph: 5.1 seconds
    - 0-200 km/h: 19.8 seconds
    - Top speed: 230 km/h (electronically limited)
    - Quarter mile: ~13.6 seconds
    
    Still very quick despite being "entry-level". Faster than most hot hatches 
    and many sports cars. Porsche's two-speed transmission on rear axle maintains 
    strong mid-range acceleration.

