# Porsche Taycan RWD Performance Battery Plus 2024
# Entry-level Taycan with single rear motor
# Most efficient Taycan variant with longest range
# 800V ultra-fast charging architecture

id: porsche-taycan-rwd-performance-battery-plus-2024
name: RWD Performance Battery Plus
model_id: porsche-taycan
manufacturer_id: porsche
variant_name: RWD Performance Battery Plus
model_year: 2024
trim_level: Base
version: Performance Battery Plus

description: |
  The Porsche Taycan RWD (Rear-Wheel Drive) is the entry-level variant of the 
  Taycan lineup, featuring a single rear motor and rear-wheel drive configuration. 
  Despite being the "base" model, it delivers impressive performance (0-100 km/h 
  in 5.4s) while offering the best efficiency and longest range of all Taycan 
  variants - up to 678km WLTP with Performance Battery Plus.
  
  The RWD variant maintains Porsche's core DNA: precise handling, excellent build 
  quality, and sports car dynamics. The rear-wheel drive configuration provides 
  a more traditional Porsche driving feel, similar to classic rear-engine Porsche 
  sports cars. Lower weight (no front motor) improves efficiency and handling 
  balance.
  
  With 800V architecture, the RWD still achieves 270kW peak DC charging, enabling 
  rapid 10-80% charges in ~23 minutes. For many buyers, the RWD offers the best 
  value proposition: excellent range, strong performance, and pure Porsche driving 
  dynamics at a more accessible price point.

