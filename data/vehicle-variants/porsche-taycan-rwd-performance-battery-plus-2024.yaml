  sources:
    - https://www.porsche.com/germany/models/taycan/taycan-models/taycan/
    - https://newsroom.porsche.com
    - https://press.porsche.com
  notes: |
    The Taycan RWD is the most underrated variant in the lineup. It offers:
    - BEST range: 678km WLTP (120km more than 4S, 135km more than Turbo)
    - BEST efficiency: 17.9 kWh/100km (3kWh/100km better than 4S)
    - LIGHTEST weight: 2,170kg (125kg lighter than 4S)
    - SAME 800V charging: 270kW peak (no compromise)
    - LOWEST price: ~€25k cheaper than 4S
    - PURE rear-drive feel: Classic Porsche sports car character
    
    For many buyers, the RWD is the smartest choice. You get genuine Porsche 
    driving dynamics, excellent range, world-class charging, and significant 
    cost savings. Unless you need AWD traction or sub-5-second 0-100, the RWD 
    delivers the complete Taycan experience.
    
    Competitors: Tesla Model 3 Long Range RWD, BMW i4 eDrive40, Mercedes EQE 300
    
    Recommended options:
    - 22kW AC onboard charger (€1,470)
    - Porsche InnoDrive (€2,890) - adaptive cruise + range optimization
    - PTV Plus (€1,890) - electronic rear diff for better cornering
    - PSCB brakes (€6,210) - no brake dust, easier maintenance
