  notes: "The Taycan RWD is the most underrated variant in the lineup. It offers:\n\
    - BEST range: 678km WLTP (120km more than 4S, 135km more than Turbo)\n- BEST efficiency:\
    \ 17.9 kWh/100km (3kWh/100km better than 4S)\n- LIGHTEST weight: 2,170kg (125kg\
    \ lighter than 4S)\n- SAME 800V charging: 270kW peak (no compromise)\n- LOWEST\
    \ price: ~€25k cheaper than 4S\n- PURE rear-drive feel: Classic Porsche sports\
    \ car character\n\nFor many buyers, the RWD is the smartest choice. You get genuine\
    \ Porsche \ndriving dynamics, excellent range, world-class charging, and significant\
    \ \ncost savings. Unless you need AWD traction or sub-5-second 0-100, the RWD\
    \ \ndelivers the complete Taycan experience.\n\nCompetitors: Tesla Model 3 Long\
    \ Range RWD, BMW i4 eDrive40, Mercedes EQE 300\n\nRecommended options:\n- 22kW\
    \ AC onboard charger (€1,470)\n- Porsche InnoDrive (€2,890) - adaptive cruise\
    \ + range optimization\n- PTV Plus (€1,890) - electronic rear diff for better\
    \ cornering\n- PSCB brakes (€6,210) - no brake dust, easier maintenance\n"
