  epa_km: 547
  epa_miles: 340
  real_world_km: 570
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    WLTP: 678km (Performance Battery Plus, 19" Taycan Aero wheels)
    EPA: 340 miles / 547km (US rating)
    Real-world: ~570km mixed driving in good conditions
    
    LONGEST range of all Taycan variants thanks to single motor efficiency and 
    lower weight. Excellent for long-distance touring. Winter range penalty: 
    ~20-25% in cold weather (better than AWD variants due to lower power consumption).

efficiency:
  wltp_kwh_per_100km: 17.9
  epa_kwh_per_100km: 20.5
  real_world_kwh_per_100km: 21.5
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    Most efficient Taycan variant at 17.9 kWh/100km WLTP. Single rear motor 
    eliminates front motor drag and reduces overall system losses. Still higher 
    consumption than smaller EVs (Tesla Model 3 ~14 kWh/100km) due to Taycan's 
    sports car nature (wider tires, heavier weight, performance-oriented tuning).

