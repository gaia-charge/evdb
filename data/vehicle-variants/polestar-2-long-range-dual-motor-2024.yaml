  end: null
trim_level: long-range
market_position: flagship

description: |
  The Long Range Dual Motor is the flagship variant of the Polestar 2, featuring 
  all-wheel drive with dual electric motors and the largest 82kWh battery pack.
  
  This 2024 model year includes significant improvements over earlier versions:
  - Increased range (+70km WLTP vs 2023)
  - Improved heat pump efficiency
  - Faster DC charging (205kW peak)
  - Updated Google Automotive Services
  - Enhanced Pilot Assist features
  
  The dual-motor AWD system provides excellent traction and performance while 
  maintaining impressive efficiency. The vehicle features progressive steering 
  and performance-oriented chassis tuning.

