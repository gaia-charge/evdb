  notes: |
    The Opel Astra Electric GS is the sporty flagship trim of Europe's 2023 Car of the Year
    in electric form. It adds Opel's signature IntelliLux LED Pixel Matrix headlights with
    84 LED elements as standard - the most advanced lighting technology in the segment.
    
    GS trim includes sport body kit, 18\" wheels, two-tone black roof, AGR-certified sport
    seats, premium 8-speaker audio, 10\" head-up display, and 360-degree camera system.
    
    Key advantages over Edition:
    - IntelliLux LED Pixel Matrix headlights STANDARD (€1,200 option on Edition)
    - Sport body kit and two-tone black roof
    - 18\" bi-color alloy wheels (vs 17\" on Edition)
    - AGR-certified sport seats with enhanced bolsters
    - Premium 8-speaker audio (vs 6 speakers)
    - 10\" head-up display
    - 360-degree camera system
    - Heated seats and steering wheel standard
    - Wireless phone charging
    
    Platform sibling to Peugeot e-308 GT with identical powertrain but Opel's characteristic
    German engineering and comprehensive technology package.
    
    GS trim qualifies for German company car tax reduction (0.25% under €70,000).
