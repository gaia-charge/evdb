description: |
  The Long Range Single Motor is the entry-level and most efficient variant of the
  Polestar 4, featuring rear-wheel drive with a single 200kW permanent magnet motor
  and a 100kWh battery providing 620km WLTP range.
  
  Retains all the innovative design features of the Polestar 4 including the
  no-rear-window design with HD camera system, electrochromic panoramic glass roof,
  and 15.4-inch portrait touchscreen. The most affordable Polestar SUV at €61,900.

