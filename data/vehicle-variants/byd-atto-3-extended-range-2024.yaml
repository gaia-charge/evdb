# Market & Pricing Notes
notes: >
  The BYD Atto 3 Extended Range represents BYD's value proposition: competitive
  pricing, solid range, comprehensive features, and proven battery technology.
  The Blade Battery (LFP) offers excellent safety and longevity, with BYD claiming
  3000+ charge cycles with minimal degradation. DC charging is conservative at
  88kW to protect battery longevity. Real-world efficiency is excellent due to
  LFP characteristics and e-Platform 3.0 integration. The unique interior design
  with guitar-string door pulls and rotating touchscreen differentiates it from
  competitors. V2L capability (3.3kW) enables outdoor activities and emergency power.

