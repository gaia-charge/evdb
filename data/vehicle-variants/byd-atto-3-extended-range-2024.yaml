  battery longevity. Real-world efficiency is excellent due to LFP characteristics
  and e-Platform 3.0 integration. The unique interior design with guitar-string door
  pulls and rotating touchscreen differentiates it from competitors. V2L capability
  (3.3kW) enables outdoor activities and emergency power.

