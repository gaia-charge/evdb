  notes: >
    BYD Blade Battery uses LFP chemistry arranged in long blade-shaped cells
    integrated directly into the chassis structure. This design improves safety
    (passes nail penetration test without fire), increases space efficiency,
    and provides excellent thermal stability. LFP chemistry offers longer cycle
    life (3000+ cycles) but lower energy density than NMC.

