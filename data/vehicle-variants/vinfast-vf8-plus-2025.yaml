notes: >
  The VinFast VF8 Plus is the premium trim with additional luxury features
  including Nappa leather, Harman Kardon audio, head-up display, and 360-degree
  camera. It shares the same powertrain as the Eco but has higher curb weight
  due to additional equipment, resulting in slightly lower range. The Plus trim
  targets the premium mid-size SUV segment.

