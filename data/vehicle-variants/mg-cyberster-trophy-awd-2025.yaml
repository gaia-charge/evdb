  notes: >
    MG Cyberster Trophy AWD is the flagship variant with dual motors producing
    375kW (510hp) and 725Nm. 3.2s 0-100 km/h makes it one of the fastest
    affordable electric sports cars. 77 kWh NMC battery provides 507 km WLTP range.
    800V architecture supports 150kW DC fast charging.
    Scissor doors and electric soft top make it a unique proposition in the market.
    One of very few electric roadsters available in Europe alongside the
    BMW i8 successor (when available).
