notes: 'The i5 M60 xDrive is the performance flagship of the i5 lineup, featuring
  dual motors producing 601hp and blistering 3.8s 0-100 km/h acceleration. Despite
  the performance focus, real-world range remains respectable at 420km in mixed conditions.
  The 400V architecture limits DC charging to 205kW peak. Standard equipment is comprehensive
  with M Sport features throughout. This is BMW''s answer to the Tesla Model S and
  Mercedes EQE AMG.

