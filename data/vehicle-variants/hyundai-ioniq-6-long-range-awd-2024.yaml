notes: 'The Ioniq 6 Long Range AWD adds dual-motor all-wheel drive for enhanced traction
  and exhilarating performance. With 320 hp and 605 Nm torque, it accelerates from
  0-100 km/h in just 5.1 seconds - sports car territory! The electronic AWD system
  intelligently distributes torque between front and rear axles for optimal grip in
  all weather conditions. Trade-off: 95 km less range than RWD variant (519 vs 614
  km) and slightly higher consumption (16.3 vs 13.9 kWh/100km). The 800V E-GMP architecture
  still enables 18-minute 10-80% charging. Perfect for buyers who want AWD security,
  winter capability, and thrilling acceleration while maintaining excellent efficiency.
  More practical and better value than many traditional performance sedans.

  '
