motors:
  count: 2
  type: Permanent Magnet Synchronous Motor (PMSM)
  configuration: AWD (all-wheel drive)
  front_motor:
    power_kw: 140
    power_hp: 190
    type: PMSM
  rear_motor:
    power_kw: 270
    power_hp: 367
    type: PMSM
  combined_power_kw: 410
  combined_power_hp: 557
  torque_nm: 820
  notes: |
    Maserati Grecale Folgore features powerful dual-motor AWD:
    - Front: 140kW (190hp) permanent magnet synchronous
    - Rear: 270kW (367hp) permanent magnet synchronous
    - Combined: 410kW (557hp)
    - Torque: 820 Nm (impressive for sports-oriented SUV)
    
    Integrated Vehicle Control system manages torque distribution between axles
    for optimal traction, stability, and driving dynamics. Rear-biased power
    distribution maintains Maserati's sporting character.

drive_type: AWD
driven_wheels: all

