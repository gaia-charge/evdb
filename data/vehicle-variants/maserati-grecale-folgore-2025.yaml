    notes: |
      Standard: 22kW AC (3-phase Type2) - 0-100% in ~5 hours
      Premium specification includes 22kW onboard charger as standard
  
  dc:
    max_power_kw: 150
    connector_type: CCS2
    architecture_voltage: 800
    time_10_80_minutes: 30
    time_5_80_minutes: 32
    peak_charge_time_minutes: "10-40% state of charge"
    notes: |
      800V fast charging with 150kW peak:
      - Peak: 150kW (achieved between 10-40% SoC at 350kW chargers)
      - 10-80%: ~30 minutes (ideal conditions, preconditioned battery)
      - Average 10-80%: ~32-35 minutes real-world
      - 100km range in ~8 minutes
      
      While 150kW is lower than some competitors, it's still rapid charging and
      practical for real-world use.
    
