# Maserati Grecale Folgore 2025
# Maserati's first all-electric luxury SUV
# Built on STLA Large platform with 800V architecture
# Dual-motor AWD with over 550 hp and Italian luxury craftsmanship

id: maserati-grecale-folgore-2025
name: "Base"
model_id: maserati-grecale-folgore
manufacturer_id: stellantis
model_year: 2025
trim_level: Folgore
version: Folgore

description: |
  The Maserati Grecale Folgore ("Folgore" means "lightning" in Italian) represents
  Maserati's bold entry into the electric luxury SUV market. Combining Italian
  design excellence with cutting-edge electric performance, the Grecale Folgore
  delivers 410kW (557hp) from its dual-motor AWD system.
  
  Built on Stellantis' premium STLA Large platform with 800V architecture, the
  Grecale Folgore offers rapid charging capability and impressive performance.
  With 0-100 km/h in just 4.1 seconds, it matches sports cars while offering
  practical SUV versatility and luxury.
  
  The interior showcases Maserati's signature premium materials including Nappa
  leather, Alcantara, and carbon fiber accents. The Sonus faber audio system
  (21 speakers, 1195W) delivers concert-hall sound quality. Advanced technology
  includes the Maserati Intelligent Assistant (MIA) multimedia system across
  three high-resolution displays.
  
  For buyers seeking Italian luxury and character in an electric SUV, the Grecale
  Folgore offers a compelling alternative to German rivals, with distinctive
  styling and an engaging driving experience enhanced by Maserati's performance
  heritage.

