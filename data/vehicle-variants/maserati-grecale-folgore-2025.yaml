  acceleration_0_100_kmh_seconds: 4.1
  acceleration_0_60_mph_seconds: 3.9
  top_speed_kmh: 220
  top_speed_electronically_limited: true
  notes: |
    Maserati Grecale Folgore performance:
    - 0-100 km/h: 4.1 seconds (sports car acceleration!)
    - 0-60 mph: 3.9 seconds
    - Top speed: 220 km/h (electronically limited)
    - Quarter mile: ~12.4 seconds
    
    Exceptional performance for a luxury SUV. Matches Porsche Macan 4S while
    offering distinctive Italian character. Electronic limited-slip differential
    enhances cornering dynamics.

