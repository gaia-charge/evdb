  notes: |
    The Maserati Grecale Folgore offers:
    - DISTINCTIVE Italian design and luxury craftsmanship
    - STRONG performance: 4.1s 0-100 km/h (410kW / 557hp)
    - PREMIUM interior: Sonus faber audio, Nappa leather, carbon fiber
    - 800V architecture: 150kW fast charging
    - GOOD range: 501km WLTP (105kWh battery)
    - ALL-WEATHER capability: AWD with intelligent torque distribution
    
    Competitors: Porsche Macan 4S/Turbo, Audi SQ6 e-tron, BMW iX M60, Mercedes-AMG
    EQE SUV. The Grecale Folgore differentiates through Italian design language,
    premium audio system, and distinctive character that appeals to buyers seeking
    something beyond German efficiency.
    
    Pricing premium reflects Italian luxury positioning and exclusive brand appeal.
    For enthusiasts who value design, craftsmanship, and driving emotion alongside
    electric performance, the Grecale Folgore delivers a unique proposition in
    the luxury electric SUV segment.
    
    First deliveries began in late 2023 in Europe, with production ramping up
    through 2024-2025 at the Cassino plant in Italy.
