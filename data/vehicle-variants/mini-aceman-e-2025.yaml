  notes: >
    The Aceman E is the larger battery variant with 54.2kWh usable capacity, sharing
    the same powertrain as the Cooper Electric E. 406km WLTP range in the slightly
    larger crossover body. Same 95kW DC charging as Cooper Electric. The Aceman adds
    practicality with 5 doors and 300L boot space (vs 211L in Cooper Electric).
    No towing capacity due to lighter FWD-only platform.
