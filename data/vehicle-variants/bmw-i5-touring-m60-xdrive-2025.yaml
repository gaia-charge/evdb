notes: >
  The 2025 BMW i5 Touring M60 xDrive combines the M60's 601 hp performance with
  the Touring estate body. At 2,435 kg it's 85 kg heavier than the sedan, with
  slightly reduced range (506 vs 519 km WLTP). The Touring adds 570L of cargo
  (1,700L seats down), roof rails, and hands-free electric tailgate. Same 205 kW
  DC charging as the sedan. One of the few high-performance electric estates on the
  market, competing with the Mercedes-AMG EQE SUV and Porsche Taycan Sport Turismo.

