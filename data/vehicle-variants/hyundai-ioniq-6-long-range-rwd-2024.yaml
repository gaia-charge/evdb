# Market & Pricing Notes
notes: >
  The Ioniq 6 Long Range RWD is the most efficient variant, achieving exceptional
  614km WLTP range thanks to its class-leading aerodynamics (Cd 0.21) and efficient
  RWD powertrain. The 800V E-GMP architecture enables 18-minute 10-80% charging,
  making it ideal for long-distance driving. Compared to the AWD variant, the RWD
  offers 84km more range (614 vs 530km), better efficiency (13.9 vs 16.3 kWh/100km),
  and weighs 96kg less. The unique retro-futuristic 'Electrified Streamliner' design
  with Parametric Pixel lighting creates a distinctive appearance. World Car of the
  Year 2023 winner.

