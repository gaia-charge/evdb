notes: 'The 2025 BYD Atto 3 Extended Range receives a key upgrade: 11 kW 3-phase AC
  charging (previously 7 kW single-phase), cutting home charging time from 9.5h to
  ~6h. Same 60.5 kWh Blade Battery (LFP) with 420 km WLTP range. DC charging remains
  conservative at 88 kW to maximize battery longevity. Comprehensive standard equipment
  including V2L, panoramic sunroof, and 360-degree camera make it excellent value
  in the compact SUV segment. Software refinements improve infotainment responsiveness.

