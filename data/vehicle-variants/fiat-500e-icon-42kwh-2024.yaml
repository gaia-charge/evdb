# Charging Curve (DC Fast Charging, CCS2, 85kW peak)
charging_curve:
  - soc_percent: 10
    power_kw: 85
    
  - soc_percent: 20
    power_kw: 85
    
  - soc_percent: 30
    power_kw: 85
    
  - soc_percent: 40
    power_kw: 85
    
  - soc_percent: 50
    power_kw: 78
    notes: "Slight taper begins"
    
  - soc_percent: 60
    power_kw: 68
    
  - soc_percent: 70
    power_kw: 52
    notes: "Significant taper for battery protection"
    
  - soc_percent: 80
    power_kw: 35
    
  - soc_percent: 90
    power_kw: 20
    notes: "Slow trickle charge to 100%"
    
  - soc_percent: 100
