overview: >
  The GWM ORA 07 Performance AWD is the dual-motor high-performance variant with a combined output
  of 295 kW (401 PS) and 680 Nm torque, sprinting from 0-100 km/h in 4.3 seconds. It uses the same
  63 kWh battery as the Pure RWD variant, resulting in a slightly reduced WLTP range of 295 km due to
  the additional motor weight and AWD losses. Standard equipment matches the Pure with additions
  including sport-tuned suspension, performance brakes, and 19-inch alloy wheels. DC charging remains
  at 90 kW. Starting from approximately €49,990 in Germany.

