notes: |
  The ID.7 Pro is VW's flagship electric sedan, positioned as the electric
  successor to the Passat. With 77 kWh battery and exceptional aerodynamics
  (Cd 0.23), it achieves 621 km WLTP range - among the best of any electric
  sedan. The Pro variant features 286 hp RWD powertrain, DCC adaptive dampers,
  and premium interior with 15" touchscreen and optional AR head-up display.
  Built on MEB platform at VW's Emden factory. Targets business users and
  long-distance drivers with its blend of efficiency, space, and technology.

