  end: null
trim_level: standard
market_position: entry

description: |
  The Single Motor is the entry-level variant of the Polestar 2 for 2025, featuring 
  rear-wheel drive with a single electric motor and a 69kWh battery pack.
  
  2025 model year updates include:
  - Revised exterior styling with new front and rear design
  - Updated interior with physical climate controls
  - Improved Google Automotive Services integration
  - Enhanced DC charging up to 205kW peak
  - New Pilot Assist features with lane change assistance
  - Improved real-world efficiency
  
  The single-motor RWD configuration provides excellent efficiency and engaging 
  driving dynamics. Perfect for daily driving with lower running costs than AWD variants.

