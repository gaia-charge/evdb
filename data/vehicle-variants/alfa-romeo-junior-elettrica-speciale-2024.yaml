notes: 'The Junior Elettrica Speciale is the launch variant of Alfa Romeo''s first
  electric vehicle. Built on the Stellantis eCMP2 platform (shared with Peugeot e-2008,
  Opel Mokka-e, DS 3 E-Tense), it features a 54kWh battery and 156hp front motor delivering
  410km WLTP range. The "Speciale" trim is the entry model but comes well-equipped
  with heat pump, LED Matrix headlights, dual 10.25" screens, and comprehensive safety
  systems. A more powerful Veloce variant with approximately 240hp is planned for
  2025.

