  notes: |
    Extended Range is the most popular MG4 variant (64kWh battery).
    Heat pump standard from 2024 model year improves cold weather efficiency.
    LFP battery chemistry (CATL) provides excellent safety and longevity.
    Very competitive pricing - typically €8,000-10,000 cheaper than ID.3.
    Fast charging limited to ~144kW but adequate for this class.
    Rear-wheel drive provides good handling dynamics.
    7-year/175,000km battery warranty among best in class.
