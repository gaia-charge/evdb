  notes: |
    Most popular MG4 variant with sweet-spot 450km range at €33,990.
    Rear-wheel drive provides engaging, sporty driving dynamics.
    135kW DC fast charging significantly faster than Standard Range (87kW).
    450km WLTP range adequate for long-distance travel with occasional charging stops.
    204hp motor provides brisk performance (7.7s 0-100 km/h).
    Standard heat pump maximizes efficiency in all weather conditions.
    Near-perfect 50:50 weight distribution enhances handling and stability.
    Directly challenges VW ID.3 Pro at €10,000 lower price point.
    Best-selling MG4 variant across Europe.
    Excellent value proposition - premium features at affordable price.
    7-year/175,000km battery warranty among best in class.
