notes: >
  e-Boost variant features 170kW motor (vs 150kW base Born) with faster 
  acceleration (6.6s 0-100 km/h vs 7.4s for ID.3 Pro S). Sportier suspension
  is 17mm lower than VW ID.3 for better handling, with progressive steering
  for more direct feel. 2024 model improved DC charging from 135kW to 170kW
  (+26%). Range slightly lower than ID.3 (548km vs 558km) due to sportier setup.
  Efficiency 16.1 kWh/100km (vs 15.9 for ID.3) reflects sporty tuning trade-off.
  36kg heavier than ID.3 Pro S (1950kg vs 1914kg) due to sport equipment. No
  towing capability (performance-focused vs practical ID.3). Built at SEAT
  Martorell plant in Spain on MEB platform. Shares ~85% of components with
  VW ID.3 but with sportier tuning. Signature copper accents throughout. Target:
  buyers who want ID.3 practicality with sportier handling.

