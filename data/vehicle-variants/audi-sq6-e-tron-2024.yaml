  notes: "Performance flagship of Q6 e-tron family with 360 kW (489 hp) combined power. Accelerates from 0-100 km/h in just 4.3 seconds while maintaining 598 km WLTP range. Features S-specific sport suspension (20mm lower), progressive steering, sport differential, and unique S styling. 800V PPE platform enables 270 kW peak DC charging. Positioned against BMW iX M60 (€120,000) and Mercedes-AMG EQE 53 SUV (€107,000) with competitive €74,900 starting price."
