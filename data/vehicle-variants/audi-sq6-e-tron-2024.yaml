  notes: "Performance flagship of the Q6 e-tron lineup with 380 kW (517 hp) and 4.3s 0-100 km/h. Features sport-tuned adaptive air suspension, larger brakes, and exclusive S styling. 800V PPE platform enables 270 kW peak DC charging. Slightly reduced range (598 km WLTP) compared to standard quattro due to performance focus and larger wheels. Competes with BMW iX M60, Mercedes-AMG EQE 53 SUV. Ideal for performance enthusiasts wanting electric SUV dynamics."
