  notes: |
    2025 model year EV60 Iconic is the premium flagship of the Megane E-Tech range,
    offering maximum equipment and refined efficiency with 470km WLTP range.
    
    The Iconic trim adds premium equipment over Techno:
    - 20-inch diamond-cut alloy wheels (standard)
    - Harman Kardon premium audio system (10 speakers)
    - Alcantara upholstery with recycled materials
    - Panoramic glass roof (fixed)
    - Matrix LED Pure Vision headlights
    - Enhanced leather-free premium interior
    - Exclusive Iconic badging and styling
    - Premium paint options (metallic/pearl)
    - Extended ambient lighting (8 colors)
    - Memory driver's seat
    
    Optimized efficiency calibration provides 20km more WLTP range than Techno
    despite same battery and motor. Real-world range of 385km (20-inch wheels)
    makes it extremely practical for daily use and weekend trips.
    
    Popular with private buyers seeking premium compact EV without luxury brand
    pricing. Positioned as stylish alternative to VW ID.3/ID.4, Cupra Born,
    and more affordable than BMW i4/Mercedes EQA.
    
    Harman Kardon sound system provides exceptional audio quality. Alcantara interior
    with recycled materials demonstrates Renault's sustainability commitment while
    maintaining premium feel.
    
    Base price around €46,000 (Germany) makes it attractive for buyers wanting
    fully-equipped compact EV. Still qualifies for 0.25% company car taxation.
    
    2025 model year improvements:
    - Enhanced Google Assistant with offline capability
    - Improved OTA update system (quarterly updates)
    - Refined driving mode calibrations
    - Updated charging curve optimization
    - New premium paint options
    
    Winter range (0-10°C) typically 290-330km with heat pump working efficiently.
    Highway cruising at 120 km/h provides 340-360km range in mild weather.
    
    Excellent build quality and refinement rivaling premium brands. French design
    flair with practical functionality. European Car of the Year 2023 winner
    for good reason - the Iconic trim showcases the Megane at its best.
