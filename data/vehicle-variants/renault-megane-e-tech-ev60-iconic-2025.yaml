notes: >
  The EV60 Iconic is the flagship Megane E-Tech variant offering the best range (470 km WLTP) 
  thanks to optimized aerodynamics with 20\" aero wheels. It shares the 60 kWh battery and 
  218 hp motor with the Techno but adds premium features including leather/alcantara seats, 
  heated seats and steering wheel, Harman Kardon audio, head-up display, and Highway/Traffic 
  Jam Assist (Level 2). The Iconic represents the full vision of the Megane E-Tech with 
  comprehensive equipment, premium materials, and advanced technology. Perfect for buyers 
  seeking a premium electric compact with maximum range and luxury features.
