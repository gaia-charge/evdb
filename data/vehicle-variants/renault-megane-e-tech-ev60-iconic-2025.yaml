  notes: |
    The EV60 Iconic is the flagship Megane E-Tech variant with the best range (470 km WLTP,
    400 km real-world) and all premium features. The slightly better efficiency compared to
    Techno trim comes from optimized aerodynamics with 18-inch wheels and eco driving mode.
    
    Iconic trim includes everything from Techno plus:
    - Solarbay panoramic glass roof with electrochromic dimming
    - Harman Kardon premium audio system (10 speakers, 440W)
    - 20-inch alloy wheels (optional, reduces range by 20 km)
    - Full LED lighting package with animated indicators
    - Premium Alcantara interior with heated front seats
    - Electric adjustable driver's seat with memory
    - Hands-free parking with 360° camera
    - Highway & Traffic Jam Companion (Level 2 autonomy)
    - Ambient lighting with 8 color options
    - Premium paint options
    
    The Iconic represents the full vision of Renault's EV design philosophy - combining
    French elegance with cutting-edge technology. The Solarbay roof is a standout feature,
    allowing instant adjustment of transparency without a physical blind.
    
    With 400 km real-world range, it's suitable for longer trips including occasional
    road trips with strategic charging stops. Winter range is approximately 320-340 km
    in cold conditions (-5°C) thanks to the efficient heat pump.
    
    Positioned as a premium alternative to VW ID.3 Pro S and Cupra Born VZ, offering
    more distinctive design and better interior quality at a similar price point.
    
    Popular with company car drivers in France and Germany who value style and technology.
