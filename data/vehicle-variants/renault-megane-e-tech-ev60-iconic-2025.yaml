description: |
  The Megane E-Tech EV60 Iconic 2025 is Renault's flagship compact electric crossover,
  featuring the 60 kWh battery with full premium equipment and exclusive styling.
  
  The Iconic trim adds luxury features over Techno including:
  - 20-inch alloy wheels (standard)
  - Harman Kardon premium sound system
  - Alcantara upholstery with sustainable materials
  - Panoramic glass roof (fixed)
  - Matrix LED Pure Vision headlights
  - Enhanced driver assistance features
  - Exclusive exterior styling elements
  - Premium paint colors
  
  With 470 km WLTP range (385 km real-world) thanks to optimized aerodynamics
  and calibration, the Iconic represents the pinnacle of the Megane E-Tech lineup.
  
  Perfect for buyers seeking premium compact EV with cutting-edge tech, European
  style, and comprehensive equipment without stepping up to luxury brand pricing.
  
  2025 model year brings refined software, improved Google Assistant integration,
  and enhanced over-the-air update capability.

