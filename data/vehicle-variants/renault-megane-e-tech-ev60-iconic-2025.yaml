notes: >
  The Megane E-Tech EV60 Iconic is the flagship variant with the same 60 kWh battery
  and 220 hp motor as the Techno, but with premium equipment and slightly better
  efficiency (15.2 kWh/100km WLTP vs 15.8) thanks to optimized aerodynamics and rolling
  resistance. It offers 470 km WLTP range (20 km more than Techno) and real-world
  range of approximately 390 km. The Iconic trim includes luxury features like full
  Nappa leather, heated/ventilated seats with massage, panoramic sunroof, Matrix LED
  headlights, 20" wheels, and Harman Kardon audio system as standard. Real-world
  consumption is approximately 16.9 kWh/100km mixed, making it one of the most efficient
  compact crossovers. This variant competes directly with premium German EVs but at
  a significantly lower price point.
