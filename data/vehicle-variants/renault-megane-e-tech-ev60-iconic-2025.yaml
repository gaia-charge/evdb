notes: 'The EV60 Iconic is the flagship Megane E-Tech variant, offering all available

  features and premium materials as standard.


  Key additions over Techno:

  - Solarbay panoramic electrochromic glass roof (standard)

  - 9" color head-up display

  - Harman Kardon premium sound system (440W, 10 speakers)

  - Heated front seats and steering wheel

  - Premium Alcantara and leather interior

  - 20" aero-optimized alloy wheels

  - Hands-free parking

  - Ambient lighting with 8 colors

  - Extended driving assistance features


  Real-world range typically 395-410 km in mixed driving, 330-350 km on highways,

  and up to 510 km in pure city driving.


  The Iconic represents the full vision of the Megane E-Tech with all available

  technology and comfort features. Popular among buyers who want the complete

  package without aftermarket options.


  The electrochromic Solarbay roof is a standout feature - it can be adjusted from

  clear to opaque via the touchscreen, eliminating the need for a sunshade.

