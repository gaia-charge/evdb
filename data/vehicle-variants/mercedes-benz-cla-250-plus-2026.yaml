  notes: |
    The CLA 250+ is the entry-level variant of the all-new Mercedes-Benz CLA Electric.
    Built on the new MMA platform with 800V architecture, it offers a massive leap in
    charging speed and efficiency over the outgoing EQA (which used the older MFA2 platform).
    
    Key highlights vs EQA 250+:
    - Range: 585 km real-world vs 365 km (+60%)
    - DC charging: 353 kW vs 100 kW (+253%)
    - 10-80% charge time: 16 min vs 32 min (-50%)
    - Efficiency: 14.5 kWh/100km vs 19.2 kWh/100km (-24%)
    - Frunk: 101L vs 0L
    - Trunk: 405L vs 340L (+19%)
    
    Competes with:
    - Tesla Model 3 RWD (€42,990, 580 km WLTP)
    - BMW i4 eDrive40 (€57,900, 590 km WLTP)
    - Polestar 2 Single Motor (€48,350, 551 km WLTP)
    - Audi A6 Sportback e-tron performance (€75,600, 756 km WLTP)

