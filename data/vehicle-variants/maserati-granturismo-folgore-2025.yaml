  notes: 'The GranTurismo Folgore is Maserati''s electric flagship:

    - SUPERCAR performance: 2.7s 0-100 km/h (560 kW / 761 hp triple motor)

    - ULTRA-FAST charging: 270 kW DC (800V), 10-80% in ~20 min

    - ICONIC design: Classic GT proportions with modern electric packaging

    - PREMIUM luxury: Sonus faber audio, Nappa leather, carbon fiber

    - 325 km/h top speed - one of the fastest electric cars


    Competes with Porsche Taycan Turbo GT, Audi RS e-tron GT, BMW i7 M70.

    The GranTurismo Folgore differentiates through Italian design heritage,

    triple-motor torque vectoring, and the emotional appeal of owning a Maserati GT.

    '
