description: 'The Maserati GranTurismo Folgore is a groundbreaking luxury electric
  grand tourer that

  marries Maserati''s storied GT tradition with cutting-edge EV technology. Its triple-motor

  powertrain delivers 560 kW (761 hp) and 1,350 Nm of torque, launching to 100 km/h
  in

  just 2.7 seconds — supercar territory wrapped in elegant Italian coachwork.


  The 92.5 kWh battery sits low in the chassis, creating a center of gravity lower
  than

  many supercars. The 800V architecture supports 270 kW DC fast charging, with 10-80%

  achievable in approximately 20 minutes at compatible chargers.


  Inside, the GranTurismo Folgore continues Maserati''s tradition of luxurious 2+2
  grand

  touring, with premium Nappa leather, Alcantara, and carbon fiber throughout. The
  Sonus

  faber audio system delivers audiophile-quality sound. Three high-resolution displays

  provide comprehensive vehicle information and infotainment.


  For buyers seeking the ultimate electric grand tourer that combines Italian artistry

  with world-class performance, the GranTurismo Folgore stands alone in its segment.

  '
