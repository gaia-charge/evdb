overview: >
  The Zeekr X Privilege AWD is the performance-oriented dual-motor variant of Zeekr's compact electric crossover. With 315kW (422hp) and 543Nm from two permanent magnet motors, it rockets to 100 km/h in just 3.8 seconds — making it one of the quickest compact crossovers on sale. Despite the performance focus, it still offers 400km WLTP range from the same 69kWh NMC battery. The Privilege trim adds premium interior appointments and all-wheel drive traction for all-weather confidence.

