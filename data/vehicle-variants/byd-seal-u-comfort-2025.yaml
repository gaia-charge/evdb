notes: 'BYD Seal U Comfort is the entry-level trim bringing BYD''s proven e-Platform
  3.0  technology to the competitive C-segment SUV market. With 500km WLTP range from  71.8kWh
  LFP Blade Battery, it offers strong value versus VW ID.4 and similar SUVs.

  FWD configuration provides good efficiency (16.8 kWh/100km WLTP) and practical  packaging
  with 552L trunk space. Elevated SUV driving position and 1000kg towing  capacity
  make it ideal for families.

  Unique rotating 15.6" touchscreen inherited from Seal sedan is a standout feature  in
  this segment. Standard equipment includes comprehensive driver assistance  (Level
  2 highway assist, automatic parking, 360° camera) and comfort features  (panoramic
  roof, heat pump, wireless charging).

  LFP Blade Battery chemistry allows regular 100% charging without degradation  concerns.
  Heat pump ensures efficient winter performance. V2L capability enables  3.3kW external
  power supply for camping or emergency use.

  140kW DC fast charging reaches 10-80% in 28 minutes, competitive for 400V  architecture.
  Real-world range of 420km mixed driving is excellent for daily use.

  Direct competitor to VW ID.4, Skoda Enyaq iV, and Hyundai Ioniq 5, but typically  priced
  €3,000-5,000 lower with comparable equipment. Strong 8-year/200,000km  battery warranty
  provides peace of mind.

  Euro NCAP 5-star rating confirms excellent safety credentials. Particularly strong  child
  occupant score (86%) reflects family-friendly design.

  '
