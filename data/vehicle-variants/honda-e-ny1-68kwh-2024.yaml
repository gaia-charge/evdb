notes: 'The Honda e:Ny1 68.8 kWh is Honda''s entry into the European compact

  electric SUV market. With 204 hp and 412 km WLTP range, it offers

  practical performance and range for daily use. Built on Honda''s e:N

  Architecture F platform, it features a spacious interior thanks to

  the Magic Seats system and flat floor. The e:Ny1 competes with the

  Kia Niro EV, Hyundai Kona Electric, and VW ID.3. Standard heat pump

  and Honda Sensing make it well-equipped for European markets. Available

  in three trims: Elegance, Advance, and Advance+.

