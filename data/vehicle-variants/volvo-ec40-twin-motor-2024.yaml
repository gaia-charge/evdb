  notes: All-wheel drive performance variant with dual motors producing 408hp combined.
    The EC40's coupe roofline improves aerodynamics (Cd 0.30 vs 0.33 for EX40), giving
    it 35km more WLTP range than the equivalent EX40 Twin Motor with the same battery.
    Faster acceleration than the Single Motor (4.7s vs 7.3s 0-100). Competes with
    Tesla Model Y Long Range AWD, Polestar 2 Long Range Dual Motor, and BMW iX3. Shares
    platform with EX40 and Polestar 2. First Volvo with leather-free interior as standard.
