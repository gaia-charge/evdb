version_name: "2025 Refresh AWD"

description: |
  The 2025 Škoda Enyaq Coupé 85x combines the sportier coupé-SUV design with all-wheel drive capability.
  Dual motors (front asynchronous + rear permanent magnet) deliver 286ps total system output with the 82kWh
  battery, offering 564km WLTP range. The Coupé's improved aerodynamics (Cd 0.26) help offset the AWD
  efficiency penalty, giving it slightly more range than the standard SUV 85x (556km).

  Features the 2025 Modern Solid design refresh with Tech-Deck-Face front and sloping roofline.
  Ideal for customers wanting sportier looks plus all-weather AWD traction.

