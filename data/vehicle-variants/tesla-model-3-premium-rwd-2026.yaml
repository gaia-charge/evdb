notes: |
  2026 Tesla Model 3 Premium RWD. In Europe this is the long-range rear-drive
  car: 79 kWh usable, 750 km WLTP, 235 kW. Malaysia lists the same specification
  as Premium Long Range RWD. The cheaper Malaysian Premium RWD is a different
  car (about 62.5 kWh and 520 km) and is not this record.
  Charging is 11 kW AC on three phases and 250 kW DC, Type 2 and CCS2.
  No measured DC curve is stored for this trim.
