  value_proposition: |
    GV60 Advanced delivers exceptional value as entry-level Genesis crossover with comprehensive
    standard equipment and 800V ultra-fast charging at €8,000 less than Sport Plus. 490 km WLTP
    range adequate for most users, 5.5s 0-100 acceleration still spirited, dual-motor AWD provides
    all-weather capability. Face Connect biometric authentication and Crystal Sphere shift dial
    showcase Genesis innovation. Positioned €2,000 below BMW iX1 xDrive30 while offering superior
    charging (18 min vs 29 min) and more distinctive design. Strong value versus Audi Q4 50 quattro
    (similar price, 32 km less range) and Mercedes EQA 350 (€3,000 more, 18 km less range). Only
    sacrifices Bang & Olufsen audio and massage seats versus Sport Plus - reasonable trade-off for
    most buyers. 8-year/160,000km battery warranty provides peace of mind.

