description: |
  Genesis GV60 Advanced AWD is the entry-level variant offering exceptional value in
  Genesis' first dedicated electric crossover. Features dual-motor AWD with 314 hp
  (232 kW) combined output delivering spirited 5.5-second 0-100 km/h acceleration
  and respectable 490 km WLTP range - 24 km more than Sport Plus thanks to smaller
  19" wheels and more efficient tuning. Advanced includes comprehensive standard
  equipment: 12.3" dual panoramic displays, crystal sphere electronic shift dial,
  Face Connect facial recognition, Highway Driving Assist 2, Remote Smart Parking
  Assist 2, premium leather interior with heated/ventilated front seats, panoramic
  sunroof, and Vehicle-to-Load capability. E-GMP platform with 800V architecture
  enables 10-80% charging in just 18 minutes at 350 kW DC stations. While lacking
  Sport Plus' Bang & Olufsen audio and massage seats, Advanced delivers 95% of
  the experience at €8,000 savings - making it the smart choice for value-conscious
  luxury EV buyers. Electronic parking brake with Auto Hold, Smart Cruise Control
  with Stop & Go, Blind-Spot View Monitor, and 360-degree camera system all standard.

