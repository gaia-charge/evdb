  notes: |
    The Peugeot e-308 Allure is the mid-range trim level, offering excellent value with
    comprehensive equipment including wireless connectivity, adaptive cruise control, and
    the signature i-Cockpit HD dual-screen setup.
    
    Allure trim represents the sweet spot - better equipped than base Active trim with
    features like wireless CarPlay, keyless entry, and heated seats, without the premium
    pricing of GT trim (typically €4,000-5,000 less than GT).
    
    The e-308 benefits from Peugeot's excellent ride quality tuning and refined interior,
    making it a compelling alternative to German competitors like VW ID.3 or Cupra Born.
    
    With 416 km WLTP range and 100kW DC charging, it offers practical everyday usability
    for families. The 361L trunk is smaller than ICE 308 (412L) but still competitive in
    the electric C-segment.
