overview: >
  The Alpine A290 GT is the standard variant of Alpine's electric hot hatch, featuring a 52kWh NMC
  battery and a 130kW (180hp) front-mounted electric motor. It delivers a 0-100 km/h time of 7.4
  seconds and up to 380km WLTP range. The GT trim includes sport seats, Alpine Blue accents, 19-inch
  alloy wheels, and the full infotainment suite with Alpine Telemetrics performance data logging.

