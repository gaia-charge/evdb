  notes: |
    The CLA Shooting Brake 350 4MATIC is the performance AWD estate variant.
    Same 800V MMA platform and 90 kWh battery as all CLA variants.
    
    Key differences vs Shooting Brake 250+:
    - Dual motor AWD (vs single rear motor)
    - 260 kW / 354 PS (vs 200 kW / 272 PS)
    - 0-100 km/h: 5.0s (vs 6.8s)
    - 555 km real range (vs 565 km, slightly less due to AWD weight)
    - 2,155 kg (vs 2,075 kg, +80 kg)
    
    Key differences vs CLA 350 4MATIC sedan:
    - 455L trunk (vs 405L, +50L)
    - 2,155 kg (vs 2,135 kg, +20 kg)
    - 555 km real range (vs 575 km, -3.5% due to less aero)
    - 743 km WLTP (vs 723 km)
    
    Competes with:
    - Audi A6 Avant e-tron quattro (€75,600+)
    - BMW i5 Touring M60 xDrive (€99,900)
    - Polestar 5 (not an estate but similar segment)

