  notes: |
    Second-generation MG ZS EV with significantly larger battery (72.6 kWh vs 51 kWh gen 1).
    Excellent value proposition - 440km range at €37k is very competitive.
    Heat pump standard improves cold weather efficiency.
    DC fast charging limited to 92kW, slower than competitors but adequate for daily use.
    Front-wheel drive provides good traction and efficiency.
    Practical compact SUV with higher ground clearance than MG4.
    7-year/175,000km battery warranty among best in class.
    Popular family car in European markets.
