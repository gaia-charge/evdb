description: "The Porsche Taycan Turbo represents the high-performance tier of the\
  \ Taycan \nlineup, delivering supercar acceleration (0-100 km/h in 3.2s) with 500kW\
  \ \n(680hp) in overboost mode. The Turbo bridges the gap between the 4S and \nflagship\
  \ Turbo S, offering extreme performance while maintaining grand touring \ncomfort\
  \ and practicality.\n\nWith the Performance Battery Plus (93.4kWh usable), the Turbo\
  \ achieves up to \n543km WLTP range despite its blistering performance. Porsche's\
  \ 800V architecture \nenables 270kW peak DC charging, allowing 10-80% charges in\
  \ approximately 23 \nminutes at IONITY 350kW chargers.\n\nThe Turbo includes performance\
  \ upgrades over the 4S: more powerful motors, \nPorsche Torque Vectoring Plus (PTV\
  \ Plus) as standard, larger brakes, and more \naggressive aerodynamics. It's the\
  \ choice for enthusiasts who want near-Turbo S \nperformance without the flagship\
  \ price tag.\n"
