  notes: "The Taycan Turbo sits between the 4S and Turbo S, offering near-flagship\
    \ \nperformance at a more accessible price point. It includes many Turbo S features\
    \ \nas standard (PCCB brakes, PTV Plus, larger wheels) making it excellent value\
    \ \nfor performance enthusiasts.\n\nCompared to 4S: ~€30k more expensive but significantly\
    \ faster (3.2s vs 4.0s \n0-100), more powerful (500kW vs 360kW overboost), better\
    \ brakes, and standard \nPTV Plus.\n\nCompared to Turbo S: ~€30k cheaper but slightly\
    \ slower (3.2s vs 2.8s 0-100), \nless powerful (500kW vs 560kW overboost), but\
    \ offers 95% of the performance \nfor many use cases.\n"
