features:
notes: 'RWD base variant - entry-level Tesla, volume seller (~45% of Model 3 sales).

  2025 model year with Highland refresh and improved efficiency ratings.

  554 km WLTP range (up from 513 km in 2024) thanks to software optimization.

  LFP battery (CATL): 100% charging recommended (no degradation), longer lifespan (3,000+ cycles).

  Real-world range improved to 465 km mixed driving (84% of WLTP).

  Single rear motor RWD - simpler drivetrain, balanced weight distribution (47/53).

  170 kW DC fast charging - adequate for road trips (27 min 10-80%).

  6.1s 0-100 km/h - quick for entry-level sedan.

  €42,990 in Germany - most affordable Tesla, excellent value vs competitors.

  Supercharger network access (50,000+ chargers globally, 1,600+ in Germany).

  Highland improvements: ventilated seats, rear 8" display, ambient lighting, Li-ion 12V battery.

  Strong company car value: under €70k = 0.25% tax rate (saves €1,476/year vs ICE).

  '
