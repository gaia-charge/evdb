notes: 'The Audi Q8 e-tron 50 quattro is the entry-level variant of Audi''s flagship
  electric SUV.

  It offers the same quattro AWD system and luxury features as the 55 quattro, but
  with a smaller 89kWh battery

  resulting in 491km WLTP range (vs 582km for 55 quattro).


  Key strengths:

  - Quattro electric AWD with dual motors (standard)

  - High build quality and premium materials (typical Audi)

  - Virtual exterior mirrors available (cameras instead of mirrors)

  - 1,800kg towing capacity (good for luxury EV SUV)

  - Comprehensive standard equipment

  - €8,000 cheaper than 55 quattro


  Key weaknesses:

  - 400V architecture limits DC charging to 150kW (vs 800V competitors: 235kW)

  - 491km range modest for segment (vs Mercedes EQE SUV 350+: 590km)

  - Heavy at 2,550kg due to adapted MLB evo platform

  - No V2G/V2L bidirectional charging

  - Expensive vs non-luxury competitors (Hyundai Ioniq 5 77kWh: €54,000, 507km range)


  Most buyers opt for the 55 quattro (€90,000) for the extra 91km range and improved
  performance.

  The 50 quattro is best for buyers who prioritize lower entry price and don''t need
  maximum range.


  Real-world efficiency: 23.5 kWh/100km (vs WLTP 20.9).

  Real-world range: 430km mixed driving (vs 491km WLTP).

