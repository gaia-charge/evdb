overview: 'The BYD Han EV is the European variant of BYD''s flagship sedan, featuring
  an 85.4 kWh  Blade Battery (LFP) with 521 km WLTP range. The front-mounted permanent
  magnet  synchronous motor produces 163 kW (222 PS) and 330 Nm. While not a performance
  car,  the Han EV focuses on luxury, comfort, and range with comprehensive standard
  equipment  including Nappa leather, rotating 15.6-inch display, and air purification.

  '
