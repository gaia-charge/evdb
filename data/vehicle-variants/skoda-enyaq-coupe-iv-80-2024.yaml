description: |
  The Škoda Enyaq Coupé iV 80 combines the practicality of the popular Enyaq with sportier styling and 
  improved aerodynamics. The coupé's sloping roofline and streamlined design deliver a Cd of 0.26 
  (vs 0.27 for standard SUV), resulting in 15km additional WLTP range (585km vs 570km).
  
  Despite the sportier profile, the Coupé maintains impressive practicality with 570L boot capacity 
  (only 15L less than SUV) and identical interior space. The 2024 facelift brought updated styling, 
  improved Infotainment ME3 software with ChatGPT-powered Laura assistant, and enhanced efficiency.
  
  This RWD variant offers excellent range and efficiency, making it ideal for families who want 
  sporty styling without compromising practicality. Typically priced €2,000-3,000 above the 
  standard Enyaq iV 80 but €5,000-7,000 below equivalent Audi Q4 Sportback e-tron 50.

