  notes: |
    Coupé launched January 2022, 1 year after standard SUV. 2024 facelift brings significant software 
    improvements (ME3 vs ME2). Better aerodynamics (Cd 0.26) results in 15km additional range vs SUV 
    (585km vs 570km WLTP). Despite sportier styling, boot only 15L smaller (570L vs 585L). Fixed glass 
    roof standard on Coupé (panoramic roof not available). Black roof standard. Typically priced 
    €2,000-3,000 above SUV but €5,000-7,000 below Audi Q4 Sportback e-tron 50. 20-inch wheels 
    standard (vs 19" on SUV). Shares APP310 motor and 82kWh battery with VW ID.5 and ID.4 Pro.
