notes: >
  The Lotus Eletre S is the high-performance variant with 675 kW (918 hp) combined power,
  achieving 0-100 km/h in just 2.95 seconds - making it one of the fastest SUVs in the world.
  Features rear-wheel steering, carbon ceramic brakes, torque vectoring, and track-focused
  dynamics. Despite the performance, WLTP range is 490 km. Includes premium Meridian 3D audio,
  carbon fiber accents throughout, and track recorder. Competes with Porsche Cayenne Turbo S E-Hybrid
  and represents Lotus's commitment to performance even in SUV form.
