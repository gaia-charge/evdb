notes: 'The i5 eDrive40 is BMW''s new executive electric sedan, replacing the previous
  generation 5-series. Built on the latest G60 platform, it offers improved efficiency
  (15.9 kWh/100km), better range (582km WLTP), and more interior space compared to
  the i4. The 400V architecture limits DC charging to ~205kW peak, but real-world
  range in mixed conditions approaches 500km. The i5 competes directly with Mercedes
  EQE and is positioned as a premium company car choice with 0.25% tax benefit in
  Germany. Standard equipment is more comprehensive than i4, with heat pump, LED matrix
  headlights, and Harman Kardon audio included.

