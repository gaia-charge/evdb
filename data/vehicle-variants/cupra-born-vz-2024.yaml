notes: 'Top-spec Cupra Born VZ (Veloz = Fast) with 240kW motor for 5.7s 0-100 km/h.
  Fastest Born variant with raised top speed to 200 km/h (vs 160 km/h standard). Features
  sport suspension 20mm lower than standard, progressive steering, and performance
  brakes. 77 kWh battery provides 511 km WLTP range (430 km real-world). VZ-specific
  copper accents, 20" alloys, Brembo brakes, and sports seats. Built on MEB platform
  at SEAT Martorell. Competes with VW ID.3 GTX but with more power (240kW vs 210kW).
  Higher consumption (16.6 kWh/100km) reflects performance focus. Target: enthusiasts
  wanting hot hatch performance in electric form.

