  678 km WLTP range (up from 629 km in 2024) thanks to improved efficiency.

  Dual motor AWD with 366 kW (498 hp) and 4.4s 0-100 km/h.

  250 kW peak DC fast charging - excellent road trip capability.

  Superior real-world efficiency: 15.2 kWh/100km mixed, 580 km range.

  Highland improvements: 0.219 Cd aerodynamics, ventilated seats, rear 8" display.

  NCA battery chemistry with 8-year/192,000 km warranty.

  €52,990 in Germany - premium mid-size EV sedan with AWD and long range.

