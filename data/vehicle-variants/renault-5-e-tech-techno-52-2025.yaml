# Notes
notes: >
  Top Techno 52 trim of the iconic Renault 5 E-Tech with extended 400km WLTP range. 
  Features larger 52 kWh NMC battery (vs 40 kWh LFP in base model) and more powerful 
  150 hp motor. Standard heat pump improves winter efficiency significantly. V2G/V2L 
  bidirectional charging allows home backup power and powering external devices. 
  100kW DC fast charging (vs 80kW on base model). Premium equipment includes dual-zone 
  climate, heated seats/steering wheel, head-up display, and 18" wheels. Google 
  Built-In with unique Reno avatar assistant adds personality. Advanced ADAS with 
  lane centering and stop-and-go cruise control. Excellent value at €30,000 with 
  strong competition for VW ID.3 and MINI Cooper Electric. Retro design combined 
  with modern tech makes it stand out in crowded B-segment EV market.
