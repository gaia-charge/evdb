notes: 'The 2025 Enyaq Coupé 85 is the sportier alternative to the standard Enyaq
  SUV.

  Key advantages of the Coupé over SUV:

  - Better aerodynamics (Cd 0.26 vs 0.27) = ~10 km more range

  - Sportier design with sloping roofline

  - Only 15L less boot space (570L vs 585L)

  - Identical interior space and comfort


  The Enyaq Coupé 85 competes directly with:

  - VW ID.5 Pro S (€53,895, 560 km, similar MEB platform sibling)

  - Audi Q4 Sportback e-tron 45 (€55,300, 543 km, premium brand)

  - BMW iX1 xDrive30 (€54,200, 439 km, premium but less range)

  - Tesla Model Y Long Range (€49,990, 533 km, more tech)


  The Enyaq Coupé offers arguably the best value in its segment:

  - More range than most competitors (581 km WLTP)

  - More practical than other coupé-SUVs (570L boot)

  - Significantly cheaper than Audi equivalent (~€6,000 less)

  - Škoda "Simply Clever" practical touches

  - 13-inch infotainment with ChatGPT-powered Laura assistant

  '
