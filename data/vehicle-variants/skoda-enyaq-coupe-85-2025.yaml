description: 'The 2025 Škoda Enyaq Coupé 85 is the refreshed sporty variant of Škoda''s
  electric SUV range.

  Now dropping the "iV" suffix, it features the sloping roofline and improved aerodynamics
  (Cd 0.26)

  that give it slightly more range than the standard SUV. The 85 variant has the 82
  kWh battery

  with 286 ps rear motor.


  The 2025 refresh brings the Modern Solid design language, updated LED light signature
  with

  Tech-Deck-Face front, and refined interior materials. The Coupé maintains excellent

  practicality with 570L boot space (vs 585L SUV) while offering sportier styling.

  '
