notes: 'The BYD Seal Design RWD represents the mid-range offering in BYD''s premium
  sedan lineup.  It features BYD''s proprietary Blade Battery (LFP chemistry) which
  offers exceptional safety  (no thermal runaway risk), longevity (3000+ charge cycles),
  and stable performance across  temperature ranges.

  The 400V architecture on RWD variants delivers respectable 150kW DC fast charging  (26
  minutes 10-80%), adequate for most users. The LFP chemistry allows regular 100%  charging
  without degradation concerns, maximizing usable range.

  Air suspension is standard (unusual at this price point), providing excellent ride  comfort
  and dynamic handling. The rotating 15.6" touchscreen is unique in the segment,  allowing
  landscape mode for navigation and portrait mode for other functions.

  570km WLTP range with 485km real-world mixed driving makes the Seal competitive
  with  Tesla Model 3 Long Range (629km WLTP) at significantly lower price point.
  LFP chemistry  provides peace of mind for long-term ownership with minimal capacity
  degradation.

  '
