  notes: "The Opel Astra Electric Edition is the base trim of Europe's 2023 Car of\
    \ the Year in \nelectric form. Despite being the \"base\" model, it comes remarkably\
    \ well-equipped with \nthe Pure Panel dual displays, adaptive cruise control,\
    \ and heat pump as standard.\n\nPlatform sibling to Peugeot e-308 with identical\
    \ powertrain but Opel's characteristic\nGerman-engineered practicality and comprehensive\
    \ standard equipment.\n\nKey advantages over competitors:\n- Heat pump STANDARD\
    \ (reduces winter range loss by ~15%)\n- 100kW DC fast charging (10-80% in 30\
    \ minutes)\n- Dual 10\\\" Pure Panel displays standard\n- Adaptive cruise control\
    \ standard\n- 1000kg towing capacity (rare in this segment)\n\nEdition trim qualifies\
    \ for German company car tax reduction (0.25% under €70,000).\n"
