description: |
  2025 Genesis Electrified GV70 receives a significant facelift with major powertrain upgrades.
  Battery capacity increases from 77.4 kWh to 84 kWh usable, while dual-motor output jumps
  dramatically from 280 kW to 360 kW (490 PS), with each axle now producing 180 kW. This
  delivers a blistering 4.4-second 0-100 km/h sprint, 0.1 seconds quicker than before.
  WLTP range improves to 479 km (up from 455 km) despite the power increase. DC charging
  peaks at 240 kW via the retained 800V architecture, achieving 10-80% in just 19 minutes.
  Exterior receives refreshed front fascia with updated Two Lines lighting signature, new
  bumper designs, and revised wheel options. Interior upgrades include updated infotainment
  with faster processor and refined materials. Retains all the luxury equipment that made
  the original a compelling alternative to German rivals: Nappa leather, Lexicon audio,
  adaptive air suspension, Highway Driving Assist 2, and V2L capability all standard.

