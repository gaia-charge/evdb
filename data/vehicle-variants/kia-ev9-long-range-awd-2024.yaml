# Notes
notes: |
  The Kia EV9 Long Range AWD is the most popular variant, offering the best 
  balance of range, performance, and practicality. Key highlights:
  
  **Strengths:**
  - Fastest-charging 3-row SUV: 800V enables 10-80% in 24 minutes
  - Spacious 3-row seating with adult-usable 3rd row
  - Premium features: triple screens, swiveling seats, V2L
  - Class-leading towing: 2,500kg (best for electric SUVs)
  - Strong real-world range: ~450km mixed driving
  - Excellent value vs German luxury competitors
  
  **Considerations:**
  - Heavy at 2,740kg (impacts efficiency and tire wear)
  - Higher consumption than EV6/Ioniq 5 (23.0 vs 18.0 kWh/100km)
  - 3rd row best for children/shorter adults on long journeys
  - Large size may be challenging in European city centers
  
  **Target Buyers:**
  - Families needing 6-7 seats
  - Road trippers prioritizing fast charging
  - Towing needs (trailers, boats, caravans)
  - Premium features without luxury brand premium

