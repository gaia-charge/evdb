notes: BMW's first mass-production electric SUV. RWD only (no AWD variant available).
  Built on CLAR platform (shared with X3). 400V architecture with 150kW DC fast charging.
  Adaptive air suspension standard (unique in segment). Heavier than iX1 (2,260kg
  vs 2,085kg) due to larger battery. Real-world 395km range adequate for most journeys.
  0-100 in 6.8s slower than iX1 xDrive30 (single motor vs dual). Popular in Europe
  and China, not sold in US. Competes with Audi e-tron 50, Mercedes EQC 400, Volvo
  XC40 Recharge. Heat pump became standard on 2023+ models (was optional on 2020-2022).
  Fifth-generation BMW eDrive technology. Towing capacity only 750kg (lower than iX1's
  1,200kg). Good highway range for road trips. Premium SUV buyers seeking familiar
  X3 space with electric drivetrain.
