notes: |
  The Mercedes-Benz EQS SUV 450 4MATIC adds all-wheel drive to the base EQS SUV platform.
  It provides improved traction and winter capability while maintaining strong efficiency.
  
  Key strengths:
  - All-wheel drive with intelligent 4MATIC system and 4ETS traction control
  - Faster acceleration: 6.0s vs 6.7s (RWD)
  - Better winter/adverse weather capability
  - Same 118kWh battery as RWD
  - 600km WLTP range (500km real-world) - still excellent for luxury AWD SUV
  - Rear-axle steering with 10° angle reduces turning circle
  - 10-year/250,000km battery warranty
  - Optional 7-seat configuration
  - Enhanced regenerative braking (215kW vs 186kW RWD)
  
  Key differences from 450+ RWD:
  - AWD adds €5,000 to base price
  - 120kg heavier (2,855kg vs 2,735kg)
  - Range reduced 60km WLTP (600 vs 660km)
  - Slightly higher consumption (20.6 vs 19.4 kWh/100km)
  - Faster acceleration (6.0s vs 6.7s 0-100)
  - Better traction in winter/off-road conditions
  
  Competes with:
  - BMW iX xDrive50 (€105,000): 630km range, faster (4.6s), better tech
  - Audi Q8 e-tron 55 quattro (€90,000): 582km range, less expensive
  - Tesla Model X Long Range (€105,000): 560km range, much faster (3.9s), 7-seat standard
  
  The EQS SUV 450 4MATIC is ideal for buyers who want AWD traction and Mercedes luxury
  without stepping up to the performance-focused 580 4MATIC.
  
  Real-world efficiency: 23.6 kWh/100km (vs WLTP 20.6) confirmed by testing.
  Real-world range: 500km mixed driving (vs 600km WLTP, 465km EPA).

