description: |
  The 2026 Porsche Taycan Turbo GT Sport Turismo is the ultimate performance
  estate, combining the Turbo GT's 760 hp overboost powertrain with the Sport
  Turismo's practical body style. With 0-100 km/h in 2.2 seconds via Launch
  Control, it's one of the fastest production wagons ever made. The 105 kWh
  Performance Battery Plus, 320 kW DC charging, and rear-axle steering come
  standard. Unique Turbo GT touches include stiffened suspension, larger brakes,
  and exclusive exterior elements.

