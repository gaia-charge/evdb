notes: 'The Techno 40 is the higher-trim Twingo E-Tech with notable upgrades including  a
  heat pump for better winter range, 11kW AC charging (vs 7.4kW on Urban),  heated
  front seats, wireless phone charger, and blind spot warning. Same 60 kW  motor and
  40 kWh LFP battery as the Urban trim. Slightly heavier due to  additional equipment,
  resulting in marginally lower range. The heat pump is  especially valuable in northern
  European climates, improving winter range by  up to 15%. Priced around €24,590 in
  Germany, offering strong value versus  competitors like the Fiat 500e which costs
  significantly more.

  '
