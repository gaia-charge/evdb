notes: 'The Lucid Air Touring AWD represents the mid-range variant offering exceptional
  balance  of performance, range, and luxury. With 730 km WLTP range (732 km EPA /
  455 miles),  518kW/696hp dual-motor AWD performance (3.4s 0-100 km/h), and comprehensive
  luxury  equipment, the Touring delivers outstanding value in the ultra-luxury sedan
  segment.

  Key advantages over the Pure RWD include: larger 92kWh battery (+70km range), dual-motor  AWD
  system (vs RWD), enhanced performance (3.4s vs 4.5s 0-100), standard Dream Drive
  Pro  ADAS, standard Surreal Sound Pro 21-speaker audio, standard massaging front
  seats, and  premium Nappa leather throughout.

  The Touring maintains Lucid''s industry-leading efficiency (12.5 kWh/100km WLTP)
  and  ultra-fast 300kW charging capability. The 900V+ architecture enables 24-minute
  10-80%  charging, adding over 500km range in a typical charging stop.

  Standard equipment is comprehensive, including features that are optional on competitors:  Dream
  Drive Pro (€4,500 option on Mercedes EQS), Surreal Sound Pro (€5,000+ option on  luxury
  sedans), massaging seats, and premium Nappa leather interior. This makes the  Touring
  excellent value despite its premium positioning.

  The Touring competes directly with Mercedes-Benz EQS 450+ (€130k+), BMW i7 xDrive60  (€140k+),
  and Tesla Model S Long Range (€105k). Lucid offers superior range (+80-100km),  faster
  charging (300kW vs 200-250kW), better efficiency, and more standard luxury  features
  at competitive pricing.

