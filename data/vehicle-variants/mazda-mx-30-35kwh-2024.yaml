notes: |
  The Mazda MX-30 is a polarizing vehicle. Its 200 km WLTP range is the lowest
  of any current EV, making it suitable only for urban use and short trips.
  However, Mazda's philosophy is thoughtful: smaller battery = lower production
  emissions, and most daily driving is under 50 km. The freestyle doors, cork
  interior, and premium feel create a unique ownership experience. Best suited
  as a second car, for city dwellers with home charging, or environmentally
  conscious buyers who prioritize sustainability over range. Available trims:
  Prime-Line, Exclusive-Line, and R-EV (range extender with rotary engine).
  Competes with Mini Cooper Electric, Honda e, and Smart #1.

