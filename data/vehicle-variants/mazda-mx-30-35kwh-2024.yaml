  notes: |
    WLTP range of only 200 km is the MX-30's biggest limitation. Real-world
    range around 165 km in mixed conditions, dropping to 140 km in winter.
    Suitable for urban commuting and short trips, but requires frequent
    charging for daily use beyond city limits. Not recommended as primary
    vehicle for high-mileage users.

