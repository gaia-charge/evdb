  notes: |
    The Opel Corsa-e GS Line is mechanically identical to the Peugeot e-208 GT - both 
    built on Stellantis CMP platform with same battery, motor, and performance specs.
    
    Key advantages: IntelliLux LED Matrix headlights (Opel exclusive technology), more 
    conservative practical design, simpler interior, €2,500-3,000 lower price.
    
    GS Line is the sportiest trim level with body kit, sport seats, 17\" alloys.
