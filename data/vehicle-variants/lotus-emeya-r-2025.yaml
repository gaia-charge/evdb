notes: >
  The Lotus Emeya R is the flagship performance variant with a staggering 675 kW (905 hp), matching
  the 2.78-second 0-100 km/h time of the S variant but with enhanced track capabilities. Standard
  equipment includes carbon ceramic brakes, carbon fiber body panels, track-tuned suspension, rear-wheel
  steering, launch control, and drift mode. With carbon-backed sport seats, extensive Alcantara trim,
  and R-specific styling, it's a genuine hyper-GT that competes with Porsche Taycan Turbo S and
  Lucid Air Sapphire. Despite the immense power, it maintains 580 km WLTP range thanks to its
  exceptional aerodynamics (0.21 Cd).
