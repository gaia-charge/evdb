overview: 'The Volvo EX30 Extended Range Single Motor is the long-range variant of
  Volvo''s compact electric SUV, offering an excellent balance of range, efficiency,
  and value. With a 69kWh battery providing up to 476km WLTP range, it''s the most
  popular EX30 variant. The single rear motor provides 200kW (272hp) and rear-wheel
  drive dynamics, making it both efficient and engaging to drive. Built on Geely''s
  SEA platform with a 400V architecture, it features fast DC charging up to 153kW
  and 11kW AC charging. This variant represents Volvo''s most affordable long-range
  EV with the brand''s full safety and technology suite.

  '
