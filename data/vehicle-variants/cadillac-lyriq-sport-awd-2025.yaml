  preconditioning: true
  notes: |
    GM Ultium NCMA battery (Nickel Cobalt Manganese Aluminum).
    102 kWh total / ~95 kWh usable capacity.
    400V architecture with 190 kW peak DC charging.
    LG Energy Solution pouch cells.
    Advanced wireless battery management system (wBMS) - industry first.

range:
  wltp_km: 530
  wltp_city_km: 640
  wltp_highway_km: 440
  real_world_km: 430
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    WLTP: 530 km (102 kWh battery, 21" wheels, AWD)
    Real-world: ~430 km mixed driving in good conditions
    Winter range: ~370 km in cold conditions (heat pump helps)
    Highway range at 130 km/h: ~380 km
    
    Competitive range for segment. Slightly below BMW iX xDrive50 (611 km WLTP)
    but larger battery and more standard equipment at lower price.

efficiency:
  wltp_kwh_per_100km: 22.5
  real_world_kwh_per_100km: 24.5
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    22.5 kWh/100km WLTP - reasonable for a 2,774 kg luxury SUV.
    Not class-leading in efficiency but compensated by large battery.
    No aerodynamic wheel covers - Cadillac prioritizes style.

