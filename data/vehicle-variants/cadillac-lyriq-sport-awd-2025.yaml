# Cadillac Lyriq Sport AWD 2025
# Mid-size luxury electric SUV - Sport trim
# German Car of the Year 2025 (Luxury category)

id: cadillac-lyriq-sport-awd-2025
name: Lyriq Sport AWD
model_id: cadillac-lyriq
manufacturer_id: general-motors
variant_name: Sport AWD
model_year: 2025
trim_level: Sport
version: "600 E4"

description: |
  The Cadillac Lyriq Sport AWD is one of two standard trims available in Germany,
  featuring sportier styling elements including unique 21-inch wheels, sport-tuned
  suspension, and distinctive exterior accents. It shares the same powerful dual-motor
  AWD drivetrain with 528 PS and 102 kWh NCMA battery delivering up to 530 km WLTP range.
  
  The Sport trim differentiates through its triangular laser-graved front grille pattern,
  sport-specific wheel designs, and slightly firmer suspension tuning. Inside, the
  spectacular 33-inch diagonal LED display with 9K resolution dominates the dashboard,
  while the 19-speaker AKG Studio audio system with Dolby Atmos delivers immersive sound.
  
  Active Noise Cancellation creates a remarkably quiet cabin, complemented by premium
  materials and Cadillac's signature American luxury approach. The Google Built-In
  infotainment system provides seamless integration with Google Maps, Assistant, and
  Play Store.
  
  At €83,000, the Lyriq Sport undercuts comparable German competitors significantly while
  offering a larger battery, more standard equipment, and distinctive American character.

