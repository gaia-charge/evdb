charging:
  ac:
    max_power_kw: 22
    standard: true
    connector_type: Type2
    phases: 3
    time_0_100_hours: 5.5
    notes: |
      Standard 22 kW AC onboard charger (3-phase Type2).
      0-100% in ~5.5 hours at 22 kW.
      11 kW wallbox: ~10 hours 0-100%.

  dc:
    max_power_kw: 190
    connector_type: CCS2
    architecture_voltage: 400
    time_10_80_minutes: 27
    time_5_80_minutes: 30
    notes: |
      190 kW peak DC fast charging (CCS2):
      - 10-80%: ~27 minutes (ideal conditions)
      - 200 km range in ~15 minutes
      - Real-world 10-80%: 30-35 minutes typical
      
      Decent but not class-leading. Porsche Macan charges at 270 kW,
      BMW iX at 195 kW. The 400V architecture limits peak rate vs 800V vehicles.

