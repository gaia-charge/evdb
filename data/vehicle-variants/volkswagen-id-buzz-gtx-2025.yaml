notes: |
  The 2025 ID.Buzz GTX receives the 86 kWh battery upgrade, improving range from 440 km
  to 462 km WLTP (+22 km, +5%). It remains the performance flagship of the ID.Buzz range
  with dual-motor AWD delivering 250 kW / 340 hp.

  Key 2025 GTX updates:
  - 86 kWh battery (vs 77 kWh in 2024, +11.7%)
  - Range: 462 km WLTP (vs 440 km, +5%)
  - ID. Software 4.0 with improved UI
  - IDA voice assistant with ChatGPT integration
  - Travel Assist 2.0 improved highway autonomy
  - Slightly improved real-world range (~385 km vs ~370 km)

  GTX-specific features (same as 2024):
  - Dual-motor AWD (80 kW front + 210 kW rear = 250 kW total)
  - DCC adaptive damping suspension (standard)
  - XDS electronic differential (torque vectoring)
  - GTX-specific exterior styling (red accents, GTX badges)
  - GTX sport seats with red stitching
  - Panoramic glass roof (standard)
  - 21-inch alloy wheels available
  - Harman Kardon audio (standard)
  - Head-Up Display (standard)

  Competes with:
  - VW ID.Buzz Pro S 2025 (RWD, more range 487 km, lower price, less power)
  - Mercedes EQV 300 (more premium, less power, less range)
  - No direct electric van performance competitor

