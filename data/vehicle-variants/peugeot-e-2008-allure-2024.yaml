  notes: "The Peugeot e-2008 Allure is the mid-range trim level, offering excellent\
    \ value with \ngood equipment including 10\\\" touchscreen, 3D i-Cockpit, LED\
    \ headlights, and 17\\\" alloys.\n\nAllure trim is the sweet spot - better equipped\
    \ than base Active trim without the \npremium pricing of GT trim (typically €4,000\
    \ less than GT).\n\n2024 model benefits from upgraded 54 kWh battery (from 50\
    \ kWh pre-2023), adding ~40km \nreal-world range vs earlier models while maintaining\
    \ the same 100kW motor and pricing.\n\nBest-in-class trunk space (405L) makes\
    \ it significantly more practical than competitors \nlike Opel Mokka-e (310L)\
    \ despite sharing the same CMP platform.\n"
