  notes: |
    Mercedes-Benz EQB 350 4MATIC is the top-performance AWD variant.
    Offers 215kW (292hp) and impressive 6.2s 0-100km/h acceleration.
    
    Key features:
    - Most powerful EQB variant (292hp)
    - 4MATIC all-wheel drive (dual motors)
    - Sport+ mode for maximum performance
    - AMG Line styling standard
    - Optional third row seats (7-seater)
    - Lowered sport suspension
    
    Compared to 300 4MATIC:
    - +€4,000 price premium
    - +47kW power (215 vs 168kW)
    - Better 0-100: 6.2s vs 8.0s
    - Same range (423km WLTP)
    - +0.5 kWh/100km consumption (18.9 vs 18.4)
    
    Compared to 250+ FWD:
    - +€8,000 price premium
    - +75kW power (215 vs 140kW)
    - Better 0-100: 6.2s vs 9.0s
    - -51km range (423 vs 474km WLTP)
    - AWD traction
    
    Competes with:
    - Tesla Model Y Long Range AWD (faster, longer range)
    - BMW iX1 xDrive30 (similar performance, 5-seat only)
    - Audi Q4 e-tron 50 quattro (similar specs)
    
    Strengths:
    - Impressive 6.2s 0-100km/h
    - Strong 4MATIC all-wheel drive
    - Only premium 7-seat compact performance EV
    - Mercedes brand prestige
    - AMG Line styling
    
    Weaknesses:
    - Higher consumption (18.9 kWh/100km)
    - 100kW DC charging still modest
    - Premium price (€64,000+)
    - Range penalty vs FWD

