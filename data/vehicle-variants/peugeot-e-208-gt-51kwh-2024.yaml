notes: 'The e-208 GT is the sportiest variant of Peugeot''s electric supermini, featuring:


  **2023 Facelift Improvements:**

  - Battery capacity: 50kWh → 51kWh (+2%)

  - Usable capacity: 45kWh → 46.3kWh (+2.9%)

  - Range: 385km → 400km WLTP (+3.9%)

  - Efficiency: 16.5 → 15.9 kWh/100km (-3.6%)

  - Improved heat pump for better cold weather performance


  **GT Trim Highlights:**

  - Sporty body kit with GT badging

  - 17" diamond-cut alloy wheels (18" optional)

  - Full LED "fang" headlights

  - Lime Yellow contrast stitching throughout interior

  - Alcantara/TEP sport seats

  - Heat pump standard (optional on lower trims)

  - Drive Assist 2.0 with ACC and LKA


  **Platform Sharing:**

  - Identical to Opel Corsa-e mechanically (same battery, motor, platform)

  - Peugeot charges ~€2,000-3,000 premium for more distinctive design

  - 3D i-Cockpit is unique to Peugeot (Opel has conventional layout)


  **Competition:**

  - More expensive than MG4 (€35,990) but more premium

  - Similar price to Mini Cooper Electric (€39,990) but more practical

  - Cheaper than BMW i3 was (discontinued 2022)


  **Charging Note:**

  100kW DC fast charging is adequate for B-segment, but slower than competition:

  - MG4: 135kW

  - Mini Electric: 95kW (similar)

  - Fiat 500e: 85kW (slower)

