notes: 'The Mazda 6e Long Range is Mazda''s flagship electric sedan, reviving the
  beloved 6 nameplate as a fully electric liftback. Built on Changan''s EPA1 platform,
  it combines Mazda''s design and craftsmanship with proven EV technology.

  The 80 kWh NMC battery provides 552 km WLTP range (estimated 460 km real-world),
  competitive in the D-segment. The rear-mounted 180 kW motor delivers Mazda''s signature
  driving engagement with 7.8s 0-100 km/h acceleration.

  DC fast charging is limited to 93 kW peak, which is below segment leaders but adequate
  for most use cases. The 49-minute 10-80% time means longer stops on road trips.
  AC charging at 11 kW three-phase is standard.

  Excellent Euro NCAP results (93% adult, 93% child) confirm strong safety credentials.
  Standard V2L capability and 70L frunk add practical value.

  The liftback design provides 456L trunk expanding to 1,074L with rear seats folded,
  offering SUV-rivalling practicality in a sedan form factor.

  Competes directly with Tesla Model 3, BMW i4, and Hyundai Ioniq 6. Main differentiators
  are Mazda''s build quality, Kodo design, and rear-wheel drive dynamics. Main weakness
  is slower DC charging versus 800V competitors.

