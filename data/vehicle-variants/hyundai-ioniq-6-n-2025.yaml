notes: >
  The IONIQ 6 N is Hyundai's high-performance electric sedan, following the
  IONIQ 5 N formula. It features 478 kW (650 PS) from dual motors, N e-shift
  simulated gear shifts with virtual vibration feedback, N Active Sound+
  interior/exterior sound, and N Grin Boost overboost. The vehicle includes
  track-focused features like N Drift Optimizer and N Track Sense Recorder.
  Despite its performance focus, it retains the 800V architecture for ultra-fast
  charging. The streamliner design gives it better aero efficiency than the
  IONIQ 5 N despite similar powertrain.

