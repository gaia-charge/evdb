notes: |
  The 2025 Ford Mustang Mach-E Extended Range RWD features an updated
  91 kWh battery (up from 88 kWh usable) for improved range of 610 km WLTP.
  BlueCruise updated to 1.3 with improved hands-free highway driving.
  Heat pump now standard across all trims. SYNC 4A infotainment with
  Google Built-In services. Remains one of the best value long-range
  electric SUVs in Europe, competing with Tesla Model Y Long Range and
  Hyundai Ioniq 5 Long Range.

