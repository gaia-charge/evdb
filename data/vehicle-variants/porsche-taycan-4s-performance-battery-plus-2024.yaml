  gross_vehicle_weight_kg: 2730
  payload_kg: 435
  towing_capacity_braked_kg: 0
  towing_capacity_unbraked_kg: 0
  distribution_front_percent: 48
  distribution_rear_percent: 52
  gross_vehicle_weight_kg: 2730
  payload_kg: 435
  notes: |
    Performance Battery Plus adds ~14kWh capacity and increases weight by ~85kg 
    vs standard battery. Near-ideal 48/52 front/rear weight distribution provides 
    balanced handling. Low center of gravity (battery in floor) enhances stability 
    and cornering. Lightweight aluminum chassis and carbon fiber roof (optional).

suspension:
  front: Double-wishbone with adaptive air suspension
  rear: Multi-link with adaptive air suspension
  adaptive_damping: Porsche Active Suspension Management (PASM)
  adjustable_ride_height: true
  notes: |
    Standard three-chamber air suspension with PASM (Porsche Active Suspension 
    Management) provides continuously variable damping. Height adjustable:
    - Normal: Standard height
    - High: +20mm (for speed bumps, driveways)
    - Low: -22mm (for improved aerodynamics at high speeds, automatic >90 km/h)
    
    Adaptive dampers adjust in real-time based on driving mode and road conditions. 
    Optional Porsche Torque Vectoring Plus (PTV Plus) with electronic rear 
    differential lock enhances handling.

brakes:
  front: 360mm ventilated discs
  rear: 358mm ventilated discs
  caliper_type: Fixed aluminum monobloc calipers
  regenerative: true
  regenerative_max_power_kw: 290
  notes: |
    Standard: Fixed aluminum monobloc calipers with 360mm front / 358mm rear discs
    Optional: Porsche Ceramic Composite Brake (PCCB) - 420mm front / 410mm rear
    Optional: Porsche Surface Coated Brake (PSCB) - tungsten carbide coating (no brake dust)
    
    Regenerative braking: Up to 290kW recuperation during deceleration
    Brake blending: Seamless transition between regenerative and friction braking
    Auto Hold: Holds vehicle on inclines when stopped

