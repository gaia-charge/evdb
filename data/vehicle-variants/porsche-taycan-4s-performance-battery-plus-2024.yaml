  notes: |
    The Taycan 4S Performance Battery Plus is the most popular Taycan variant, 
    accounting for ~35-40% of Taycan sales. It offers the best balance of:
    - Performance: 360kW overboost, 0-100 in 4.0s (fast enough for most)
    - Range: 568km WLTP with large battery (practical for daily + long-distance)
    - Value: ~€20k cheaper than Turbo while maintaining core Taycan experience
    
    Key advantages over competitors (Tesla Model S, BMW i4 M50, Mercedes EQE):
    - 800V ultra-fast charging (270kW peak, 10-80% in ~23 min)
    - Sports car handling dynamics (Porsche DNA)
    - Build quality and attention to detail
    - Three-chamber air suspension for comfort + performance
    - Rear-biased AWD for driving engagement
    
    Recommended options:
    - 22kW AC onboard charger (€1,470) - faster home/workplace charging
    - PCCB brakes or PSCB (no brake dust) for track use or cleaner wheels
    - Burmester 3D sound (€5,710) - audiophile-grade
    - 21" Turbo S wheels for sharper handling (if not concerned about ride comfort)
    - PTV Plus (€1,890) - electronic rear diff for better cornering
