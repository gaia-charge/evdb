description: "The Porsche Taycan 4S Performance Battery Plus is the most popular Taycan\
  \ \nvariant, offering the sweet spot of performance, range, and value within the\
  \ \nlineup. With 360kW (490hp) in overboost mode, the 4S delivers exhilarating \n\
  acceleration (0-100 km/h in 4.0s) while maintaining up to 568km WLTP range \nthanks\
  \ to the larger 93.4kWh battery pack.\n\nThe Performance Battery Plus option adds\
  \ ~14kWh of capacity compared to the \nstandard battery, extending range from ~450km\
  \ to ~570km WLTP. Combined with \nPorsche's 800V architecture enabling 270kW peak\
  \ DC charging, the 4S offers \nlong-distance grand touring capability with minimal\
  \ charging stops.\n\nAs a Porsche sports car, the Taycan 4S prioritizes driving\
  \ dynamics: rear-biased \nAWD, precise steering, sports car handling, and three-chamber\
  \ air suspension \nprovide the trademark Porsche driving experience in electric\
  \ form.\n"
