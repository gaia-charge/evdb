    peak_charge_time_minutes: 18-35% state of charge
    notes: "Porsche Taycan's 800V architecture enables world-class DC fast charging:\n\
      - Peak: 270kW (achieved between 18-35% SoC at IONITY 350kW chargers)\n- 10-80%:\
      \ ~22.5 minutes (ideal conditions, 270kW charger)\n- 5-80%: ~22.5 minutes\n\
      - Average 10-80%: ~23-25 minutes real-world\n\n800V architecture advantages:\n\
      - Higher power with lower current (less heat, thinner cables)\n- Faster charging\
      \ speeds than 400V competitors\n- Minimal thermal throttling even on repeated\
      \ fast charges\n\nRequires 350kW CCS2 chargers (IONITY, Fastned, etc.) to achieve\
      \ peak speeds. \nStandard 150kW chargers still charge faster than 400V EVs due\
      \ to voltage advantage.\n"
