  notes: "The Taycan 4S Performance Battery Plus is the most popular Taycan variant,\
    \ \naccounting for ~35-40% of Taycan sales. It offers the best balance of:\n-\
    \ Performance: 360kW overboost, 0-100 in 4.0s (fast enough for most)\n- Range:\
    \ 568km WLTP with large battery (practical for daily + long-distance)\n- Value:\
    \ ~€20k cheaper than Turbo while maintaining core Taycan experience\n\nKey advantages\
    \ over competitors (Tesla Model S, BMW i4 M50, Mercedes EQE):\n- 800V ultra-fast\
    \ charging (270kW peak, 10-80% in ~23 min)\n- Sports car handling dynamics (Porsche\
    \ DNA)\n- Build quality and attention to detail\n- Three-chamber air suspension\
    \ for comfort + performance\n- Rear-biased AWD for driving engagement\n\nRecommended\
    \ options:\n- 22kW AC onboard charger (€1,470) - faster home/workplace charging\n\
    - PCCB brakes or PSCB (no brake dust) for track use or cleaner wheels\n- Burmester\
    \ 3D sound (€5,710) - audiophile-grade\n- 21\" Turbo S wheels for sharper handling\
    \ (if not concerned about ride comfort)\n- PTV Plus (€1,890) - electronic rear\
    \ diff for better cornering\n"
