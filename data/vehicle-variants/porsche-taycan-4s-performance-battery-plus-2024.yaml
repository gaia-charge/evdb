  real_world_conditions: Mixed driving, 20°C ambient, normal driving style
  notes: "Porsche Taycan prioritizes performance over maximum efficiency. At 20.8\
    \ kWh/100km \nWLTP, the 4S is less efficient than sedans like Tesla Model 3 (~14\
    \ kWh/100km) \nbut typical for sports cars with AWD, wider tires, and heavier\
