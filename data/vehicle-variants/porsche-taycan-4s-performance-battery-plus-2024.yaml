  notes: "Taycan 4S features dual permanent magnet motors in AWD configuration:\n\
    - Front: 140kW (190hp) PMSM\n- Rear: 210kW (286hp) PMSM\n- Combined: 320kW (435hp)\
    \ continuous, 360kW (490hp) overboost (with Launch Control)\n\nOverboost (Launch\
