notes: 'The 2025 BYD Dolphin Design is the top-spec variant with the 60.4 kWh battery
  and all premium features included as standard. The 2025 model year brings several
  improvements: enhanced DC charging speed (95 kW vs 88 kW), improved efficiency (13.9
  kWh/100km vs 14.1), better heat pump performance, and updated DiLink 4.0 system
  with wireless Apple CarPlay/Android Auto. It offers ventilated seats, panoramic
  glass roof with UV protection, 360-degree camera, enhanced audio system, and comprehensive
  driver assistance package. This variant competes directly with premium compact EVs
  like the MINI Electric and VW ID.3 Pro S, offering more features and better value.

  '
