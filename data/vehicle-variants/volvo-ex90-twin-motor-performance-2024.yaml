notes: |
  The Volvo EX90 Twin Motor Performance is Volvo's flagship electric SUV,
  offering seating for seven, 408 hp AWD performance, and 600 km WLTP range
  with a 111 kWh battery. Built on Volvo's SPA2 platform, it features
  groundbreaking LiDAR technology from Luminar for enhanced autonomous driving
  capabilities (Level 3 pending regulatory approval via OTA updates). The EX90
  is one of the first premium EVs with full bidirectional charging, capable of
  powering a home. Interior features extensive sustainable materials including
  Nordico textile, FSC-certified wood, and recycled plastics. Air suspension
  standard. Competes with Mercedes EQS SUV (€115,900), BMW iX xDrive50 (€104,000),
  and Audi Q8 e-tron 55 (€90,000). Manufactured in Charleston, SC (USA) and
  Torslanda, Sweden. The EX90 replaces the XC90 as Volvo's flagship SUV and
  represents the pinnacle of Volvo's electric vehicle technology.

