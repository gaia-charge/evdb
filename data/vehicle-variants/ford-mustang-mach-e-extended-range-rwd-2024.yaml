notes: "The Extended Range RWD is the longest-range Mach-E variant, achieving up to\
  \ \n600 km WLTP range with the 88 kWh battery pack. Single rear motor configuration\
  \ \nmaximizes efficiency while still providing excellent performance with 216 kW\
  \ \n(294 hp). Ideal for customers prioritizing range over all-weather capability.\
  \ \nDC fast charging peaks at 150 kW with 400V architecture. Ford's Intelligent\
  \ \nBackup Power enables V2H/V2G for home backup during outages. Premium trim \n\
  includes heated steering wheel, premium audio, panoramic glass roof, and \nBlueCruise\
  \ hands-free highway driving capability (subscription required).\n"
