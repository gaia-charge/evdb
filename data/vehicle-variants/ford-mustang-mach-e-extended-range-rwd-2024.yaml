notes: |
  The Extended Range RWD is the longest-range Mach-E variant, achieving up to 
  600 km WLTP range with the 88 kWh battery pack. Single rear motor configuration 
  maximizes efficiency while still providing excellent performance with 216 kW 
  (294 hp). Ideal for customers prioritizing range over all-weather capability. 
  DC fast charging peaks at 150 kW with 400V architecture. Ford's Intelligent 
  Backup Power enables V2H/V2G for home backup during outages. Premium trim 
  includes heated steering wheel, premium audio, panoramic glass roof, and 
  BlueCruise hands-free highway driving capability (subscription required).

