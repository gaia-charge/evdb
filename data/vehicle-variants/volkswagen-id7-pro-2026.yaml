notes: |
  The 2026 ID.7 Pro receives mid-cycle updates including ID. Software 5.0
  with ChatGPT voice integration, Vehicle-to-Load capability (V2L), improved
  charging curve management, and enhanced Travel Assist 2.0. With 77 kWh battery
  and exceptional aerodynamics (Cd 0.23), it achieves 628 km WLTP range - among
  the best of any electric sedan. The Pro variant features 286 hp RWD powertrain,
  DCC adaptive dampers, and premium interior with 15" touchscreen and optional
  AR head-up display. Built on MEB platform at VW's Emden factory. Targets
  business users and long-distance drivers with blend of efficiency, technology.

