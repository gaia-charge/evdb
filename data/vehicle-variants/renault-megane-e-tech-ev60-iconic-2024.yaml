# Market & Pricing Notes
notes: >
  The Megane E-Tech EV60 Iconic is the flagship variant featuring premium
  equipment and advanced technology. With 470 km WLTP (390 km real-world),
  it offers excellent range for all driving scenarios. Same powertrain as
  Techno (218 hp, 7.4s 0-100 km/h) but slightly better efficiency due to
  optimized aerodynamics. Premium features include Alcantara/leather seats
  with heating, ventilation, and massage function; head-up display; 
  LED Matrix headlights; 20-inch wheels; Harman Kardon premium audio;
  and the revolutionary Solarbay electrochromic panoramic roof that can
  be dimmed electronically. Highway & Traffic Jam Assist (ProPilot) provides
  semi-autonomous driving capability. 360-degree camera and comprehensive
  safety suite. Ideal for buyers seeking the ultimate Megane E-Tech experience
  with luxury features, advanced driver assistance, and premium materials.

