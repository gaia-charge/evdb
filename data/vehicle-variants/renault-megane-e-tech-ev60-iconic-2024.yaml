# Market & Pricing Notes
notes: >
  The Megane E-Tech EV60 Iconic is the top-of-the-line variant with comprehensive
  luxury and technology features as standard. It includes the augmented reality
  head-up display (OpenR Link), Harman Kardon sound system, heated seats, and
  premium materials. With the same 60 kWh battery and 218hp motor as the Techno,
  it offers slightly better WLTP range (470 km vs 450 km) thanks to optimized
  aerodynamics with 20-inch wheels and efficiency-focused settings. This is the
  ideal variant for buyers seeking maximum comfort and technology.

