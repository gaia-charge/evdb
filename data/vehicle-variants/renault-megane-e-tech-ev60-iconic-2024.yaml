notes: |
  The Megane E-Tech EV60 Iconic is the flagship variant, offering the best equipment and
  slightly improved efficiency over the Techno trim.
  
  **Iconic Trim Exclusive Features:**
  - **Matrix LED Headlights**: Automatic high beam with selective dimming (9-segment matrix)
  - **Harman Kardon Audio**: Premium 10-speaker system with amplifier (standard)
  - **Electric Seats**: Power-adjustable front seats with memory and massage function
  - **Heated Rear Seats**: Rear passenger comfort (not available on Techno)
  - **Panoramic Glass Roof**: Full-length electrochromic glass roof (standard)
  - **Premium Interior**: Alcantara inserts with premium TEP recycled microfiber
  - **Optimized Wheels**: 18" aero wheels tuned for maximum efficiency (+20km range)
  - **Head-Up Display**: Full-color HUD with navigation and speed (standard)
  - **Wireless Charging**: 15W Qi charging pad (standard)
  
  **Efficiency Improvements vs Techno:**
  - WLTP: 470km vs 450km (+20km, +4.4%)
  - Consumption: 15.2 vs 15.8 kWh/100km (-3.8%)
  - Real-world: 390km vs 375km (+15km, +4%)
  
  The efficiency gains come from:
  - Optimized 18" aerodynamic wheels (vs standard 18" on Techno)
  - Slightly more aggressive regenerative braking tuning
  - Reduced rolling resistance tires
  - Software optimization for efficiency (less aggressive acceleration mapping)
  
  **vs Competition:**
  - **VW ID.3 Pro S** (€47,330): €1,400 more, similar range (557km with 77kWh battery)
  - **Cupra Born e-Boost 77kWh** (€47,000): Similar price, more range (548km), sportier
  - **MG4 X Power** (€42,990): €3k cheaper, AWD, faster (3.8s 0-100), less premium
  - **Hyundai Ioniq 5 58kWh** (€46,900): Similar price, 800V architecture, retro design
  - **Nissan Ariya 87kWh** (€57,000): €11k more, larger battery (520km), bigger SUV
  
  **Real-World Performance:**
  InsideEVs 70 mph highway test: 390km range (83% of WLTP 470km)
  - Highway consumption: 18.5 kWh/100km (including charging losses)
  - City consumption: 14.5 kWh/100km (excellent efficiency)
  - Mixed consumption: 17.2 kWh/100km (vs 15.2 WLTP, +13%)
  
  **Premium Features Standard on Iconic:**
  1. **Matrix LED Headlights** (€1,490 option on Techno)
  2. **Harman Kardon Audio** (€1,200 option on Techno)
  3. **Electric Seats with Massage** (€990 option on Techno)
  4. **Panoramic Glass Roof** (€1,400 option on Techno)
  5. **Head-Up Display** (€650 option on Techno)
  6. **Wireless Charging** (€250 option on Techno)
  7. **Heated Rear Seats** (€350 option on Techno)
  
  Total value of standard equipment: ~€6,330
  Iconic premium over Techno: ~€3,000
  Effective savings: ~€3,330
  
  **Target Buyer:**
  - Buyers seeking the fully-loaded, no-compromises Megane E-Tech
  - Premium buyers wanting best equipment without options
  - Efficiency-focused buyers maximizing range (470km WLTP)
  - Company car drivers (still under €70k threshold for 0.25% tax)
  - Tech enthusiasts wanting all premium features standard
  
  **vs Techno Trim Decision:**
  - **Choose Iconic** if you want Matrix LED, Harman Kardon, electric seats, and panoramic roof
  - **Choose Techno** if you're budget-conscious and can live without premium features
  - Iconic saves money vs adding all options to Techno (€6,330 value for €3,000 premium)
  
  **Sustainability:**
  - Same recycled materials as Techno (70% interior plastics from recycled sources)
  - Alcantara inserts are vegan-friendly synthetic suede
  - Production at carbon-neutral Renault ElectriCity facility
  - Battery recyclability: 95% material recovery
