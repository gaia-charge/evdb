# Market & Pricing Notes
notes: >
  The EV60 Iconic is the flagship Megane E-Tech variant with maximum features
  and slightly better efficiency than the Techno thanks to aerodynamic wheels
  and optimized heat pump. The 470 km WLTP range (400+ km real-world) makes it
  suitable for longer journeys without compromising on comfort or technology.
  Standard features include premium Harman Kardon audio, panoramic glass roof,
  19-inch aero wheels, and advanced driver assistance (Highway Companion Level 2).
  Bidirectional charging capability (V2G/V2H) allows energy arbitrage and home
  backup power. The Iconic trim emphasizes sustainable materials with vegan
  leather throughout. Real-world range can exceed 400 km in optimal conditions
  with eco-driving.

