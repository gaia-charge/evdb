# Market & Pricing Notes
notes: >
  The Megane E-Tech EV60 Iconic is the flagship variant with comprehensive premium equipment
  as standard. The 20-inch wheels slightly reduce efficiency compared to the Techno trim
  (470 vs 450 km WLTP), but real-world range remains excellent at 395km. Notable features
  include matrix LED headlights, head-up display, 360° camera, and Alcantara/leather interior.
  The optional Solarbay electrochromic panoramic roof is a unique feature allowing electronic
  tint adjustment. This trim represents the pinnacle of Renault's EV technology and design.

