notes: |
  The EV60 Iconic is the flagship Megane E-Tech with all premium features:
  
  **Battery & Range:**
  - 60kWh battery provides 470km WLTP (400km real-world)
  - 20km more WLTP range than Techno thanks to aerodynamic 20" wheels
  - Best efficiency: 15.8 kWh/100km WLTP vs 16.1 on Techno
  - Excellent for long-distance travel
  
  **Premium Features (Iconic vs Techno):**
  - **Pure Vision LED Matrix headlights** (adaptive, auto high-beam)
  - **360° Around View Monitor** (vs rear camera only)
  - **Harman Kardon premium audio** (10 speakers, 440W)
  - **Panoramic glass roof** (standard vs optional)
  - **Premium Alcantara upholstery** (recycled materials)
  - **Electric passenger seat** with lumbar support
  - **Massage function** for driver and passenger seats
  - **20" aero-optimized wheels** (vs 18" standard)
  - **Customizable ambient lighting** (enhanced Multi-Sense)
  - **Highway & Traffic Jam Companion** (lane centering on highways)
  
  **Technology Showcase:**
  - OpenR Link with Google built-in (Android Automotive OS)
  - 12.3" digital driver display + 12" portrait touchscreen
  - Head-up display with navigation
  - Wireless Apple CarPlay & Android Auto
  - OTA software updates
  - Google Assistant voice control
  - Google Maps with real-time traffic and charging station availability
  
  **Target Buyer:**
  - Premium compact EV buyers seeking technology and comfort
  - Drivers who want "all the features" without stepping up to premium brands
  - Company car users (0.25% German tax benefit makes it very affordable)
  - Tech enthusiasts who value Google integration
  
  **Value Proposition:**
  - €46,000 for comprehensive feature set
  - Competes with VW ID.3 Pro S (€47,500), Tesla Model 3 RWD (€42,000)
  - More features than ID.3, better design than Model 3 (subjective)
  - 2023 European Car of the Year pedigree
  
  **vs Techno:**
  - €3,000 premium for:
    - Matrix LED headlights (€1,500 value)
    - 360° camera (€800 value)
    - Harman Kardon audio (€900 value)
    - Panoramic roof (€1,200 value)
    - Massage seats (€600 value)
    - 20" wheels (€1,000 value)
  - Total option value: ~€6,000 for €3,000 extra - excellent value
  
  **Why Choose Iconic:**
  - Want the complete Megane E-Tech experience
  - Appreciate premium audio and massage seats
  - Value Matrix LED headlights for night driving safety
  - Need 360° camera for tight parking
  - Want the prestige of the top trim
  
  **Sales Mix:**
  - Iconic accounts for ~25% of Megane E-Tech sales
  - Techno (60%), EV40 (15%), Iconic (25%)
  
  **Recognition:**
  - 2023 European Car of the Year
  - First pure-electric Renault to win ECOTY
  - Praised for design, technology, and value
