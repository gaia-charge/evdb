# Notes
notes: >
  NIO ET5 Touring 75 kWh is the standard-range wagon variant offering 456 km
  WLTP range with AWD performance (360 kW, 0-100 in 4.0s). The swappable battery
  system is unique in the market — owners can swap to a 100 kWh battery at NIO
  Power Swap stations in approximately 5 minutes.

  Battery-as-a-Service (BaaS) allows purchasing the car without the battery
  (saving approximately €12,000-15,000 upfront) and subscribing to battery use
  monthly. This reduces the entry price significantly.

  Premium standard equipment includes air suspension, 23-speaker Dolby Atmos
  system, NOMI AI companion, ventilated seats, and matrix LED headlights.
  Strong Euro NCAP safety rating (91% adult occupant, 95% safety assist).

  1400 kg towing capacity and 1300L cargo space (seats folded) make it a
  practical family wagon. Cd of 0.24 is excellent for a wagon body style.

