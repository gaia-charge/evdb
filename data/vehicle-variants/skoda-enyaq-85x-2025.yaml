version_name: "2025 Refresh AWD"

description: |
  The 2025 Škoda Enyaq 85x is the all-wheel-drive variant, featuring dual motors (front asynchronous + rear 
  permanent magnet) for improved traction and all-weather capability. With 286ps total system output and 
  the 82kWh battery, it offers 556km WLTP range (slightly less than RWD due to added weight and drivetrain 
  losses). The AWD system provides superior grip in winter conditions and better launch traction.
  
  Features the same 2025 Modern Solid design refresh as the RWD 85 variant, with Tech-Deck-Face front 
  and vertical light grille. Ideal for customers in regions with harsh winters or those who prefer 
  the added confidence of all-wheel drive.

