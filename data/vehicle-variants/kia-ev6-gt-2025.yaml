  notes: '2025 Kia EV6 GT - high-performance flagship. Updates over 2024 GT:

    - Increased total battery capacity (84.0 vs 77.4 kWh)

    - Slightly improved range (440 vs 424 km WLTP)

    - Marginally improved 0-100 (3.4s vs 3.5s) via software tuning

    - 585 hp (430 kW) combined power

    - Launch Control and Drift Mode retained

    - Germany added to V2G certified markets

    - Digital Key 2.0 now standard

    - Enhanced e-LSD calibration

    - Updated Kia Connect with improved OTA

    '
