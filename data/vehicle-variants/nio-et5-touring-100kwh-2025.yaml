notes: 'NIO ET5 Touring 100 kWh is the long-range wagon variant offering an impressive
  580 km WLTP range while maintaining the same AWD performance as the 75 kWh version
  (360 kW, 0-100 in 4.0s). The larger battery adds approximately 100 kg but delivers
  27% more range.

  Swappable battery system means owners can choose the 75 kWh or 100 kWh pack based
  on their needs, or swap at NIO Power Swap stations. With BaaS, the battery subscription
  covers both pack sizes with different monthly rates.

  580 km WLTP range (490 km real-world mixed) makes this one of the longest-range
  wagons available, competing directly with VW ID.7 Tourer and Tesla Model 3. Excellent
  Cd of 0.24 contributes to highway efficiency.

  Premium standard equipment includes air suspension, 23-speaker Dolby Atmos, NOMI
  AI companion, ventilated seats, and matrix LED headlights. 1300L cargo (seats folded)
  and 1400 kg towing make it a capable family wagon.

