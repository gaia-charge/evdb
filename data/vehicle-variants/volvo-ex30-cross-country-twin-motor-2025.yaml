name: Twin Motor Performance
variant_name: Twin Motor Performance
model_year: 2025
trim_level: Ultra
production_years: "2025-present"

overview: >
  The Volvo EX30 Cross Country Twin Motor Performance is the rugged adventure variant of Volvo's compact electric SUV. Exclusively available with the 315kW (422hp) dual-motor AWD powertrain, it features raised ground clearance, black protective body cladding, and unique Cross Country bumpers. The 69kWh NMC battery provides up to 450km WLTP range, while the dual motors deliver all-wheel drive traction and a 3.6s 0-100 km/h sprint. Now also built in Ghent, Belgium alongside the standard EX30.

