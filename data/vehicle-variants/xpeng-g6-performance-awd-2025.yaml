# Vehicle Variant: XPENG G6 Performance AWD (2025)
id: xpeng-g6-performance-awd-2025
model_id: xpeng-g6
name: Performance AWD
variant_name: Performance AWD
model_year: 2025
trim_level: Performance
production_years: "2025-present"

overview: >
  The XPENG G6 Performance AWD is the flagship variant with dual motors delivering 358kW (487 PS) and 660 Nm total torque. It combines a 218kW rear PSM motor with a 140kW front asynchronous motor for all-wheel drive, achieving 0-100 km/h in just 4.1 seconds. Despite the performance focus, it maintains 510km WLTP range from the same 80.8kWh LFP battery. Unique to the Performance is air suspension on all four corners, replacing the coil springs of the other variants. Ultra-fast 451kW DC charging capability remains.

