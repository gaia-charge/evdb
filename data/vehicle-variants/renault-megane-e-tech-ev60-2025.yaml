# Market & Pricing Notes
notes: >
  The Megane E-Tech EV60 Techno is the most popular variant, offering an excellent 
  balance of range (450 km WLTP, 380 km real-world), performance (7.4s 0-100 km/h), 
  and features. The 22 kW AC onboard charger enables full overnight charging, while 
  130 kW DC fast charging provides 15-80% in 30 minutes - ideal for road trips. 
  The 160 kW motor delivers spirited performance with strong mid-range acceleration. 
  Standard equipment is comprehensive, including the impressive OpenR infotainment, 
  360-degree camera, adaptive cruise control, and hands-free parking. V2G capability 
  is available in select European markets. Winner of 2023 European Car of the Year.

