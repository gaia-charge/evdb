notes: 'The 2025 BYD Seal Excellence AWD continues to deliver supercar-level acceleration
  (3.8s 0-100 km/h) at a mid-range price point. The 2025 model year brings incremental
  improvements including better battery thermal management for improved cold-weather
  performance, an enhanced charging curve with slightly faster charging times, and
  improved efficiency (17.1 kWh/100km vs 17.3 in 2024). The dual-motor all-wheel-drive
  system provides exceptional traction and handling in all weather conditions while
  maintaining impressive efficiency. With 530 hp and 670 Nm of torque, it rivals or
  exceeds the Tesla Model 3 Performance and BMW i4 M50 in straight-line performance.
  The 0.219 drag coefficient helps maintain competitive range. Standard equipment
  is comprehensive, including premium features like Nappa leather, Dynaudio sound
  system, and advanced DiPilot driver assistance. The Blade Battery''s LFP chemistry
  ensures long-term reliability with minimal degradation over 3000+ charge cycles,
  making it an excellent choice for high-mileage drivers.

