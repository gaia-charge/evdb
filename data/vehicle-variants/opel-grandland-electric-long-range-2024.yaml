  notes: |
    The Opel Grandland Electric Long Range is the popular mid-range variant with 
    excellent 580km WLTP range, 160kW rear motor, and 82 kWh NMC battery.
    
    Key advantages:
    - Excellent range (580km WLTP) for family road trips
    - Fast 160kW DC charging (10-80% in 26 minutes)
    - Spacious interior with 550L trunk
    - RWD configuration for balanced handling
    - Google Automotive Services built-in
    - OTA updates for continuous improvement
    - V2L capability (3.7kW) for external power
    
    Positioned as Opel's flagship electric SUV, competing with VW ID.4 Pro, 
    Hyundai Ioniq 5, and Peugeot e-3008 Long Range.
