  notes: |
    The Peugeot e-308 GT is the top trim level, adding premium features and sporty styling
    to the already well-equipped Allure trim.
    
    Key GT upgrades over Allure:
    - 18" alloy wheels (vs 17" on Allure)
    - LED Matrix headlights (vs standard LED)
    - Focal Hi-Fi audio system with 10 speakers (vs 6)
    - Head-up display (GT exclusive)
    - Alcantara/leather interior (vs cloth/TEP)
    - Heated and massaging front seats
    - 360-degree camera (vs rear-only)
    - Hands-free powered tailgate
    - Sport-tuned suspension
    
    The GT trim adds approximately €4,000-5,000 over Allure pricing but delivers
    significantly enhanced comfort, technology, and premium feel.
    
    Despite identical powertrain, the GT's larger 18" wheels and sportier styling
    reduce WLTP range by 6 km compared to Allure (410 km vs 416 km).
    
    The e-308 GT offers excellent value in the premium C-segment, competing with
    VW ID.3 Pro S and Cupra Born VZ but with more sophisticated interior design.
