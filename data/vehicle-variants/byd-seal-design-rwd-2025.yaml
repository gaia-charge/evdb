# Notes
notes: >
  2025 model year brings improved efficiency (580km WLTP), enhanced driver assistance
  with automatic parking and Level 2 highway assist, and software improvements via OTA.
  
  BYD Seal Design RWD is the value-focused trim with impressive 580km range from 82.5kWh 
  LFP Blade Battery. RWD configuration offers excellent efficiency (15.2 kWh/100km WLTP).
  
  Direct competitor to Tesla Model 3 RWD but significantly more affordable. Class-leading
  0.219 drag coefficient contributes to excellent range and efficiency. Unique rotating
  15.6" touchscreen is standout feature.
  
  LFP chemistry allows regular 100% charging without degradation concerns, and maintains
  consistent performance in hot climates. Heat pump standard for winter efficiency.
  
  V2L capability enables use as mobile power source (3.3kW output). Perfect for camping,
  outdoor events, or emergency home backup.
  
  5.9s 0-100km/h is quick for RWD sedan. 150kW DC fast charging reaches 10-80% in 26 
  minutes, competitive for 400V architecture. Real-world range of 495km mixed driving
  is excellent for daily use.
  
  Popular in Europe as Tesla Model 3 alternative with better value proposition. Strong
  warranty (8 years/200,000km battery) provides peace of mind. 2025 updates make it
  even more competitive with enhanced safety and convenience features.

