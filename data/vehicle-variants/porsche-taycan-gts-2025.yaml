notes: 'The 2025 Porsche Taycan GTS sedan offers the same thrilling GTS driving experience
  as the Sport Turismo in the more aerodynamic sedan body. With 535 km WLTP range
  (vs 504 km for Sport Turismo), the sedan benefits from its sleeker silhouette. The
  GTS is widely considered the sweet spot of the Taycan range, offering sport-tuned
  suspension, 515 kW overboost, 0-100 in 3.7 seconds, and the comprehensive 2025 facelift
  improvements including the larger 105 kWh battery, 320 kW DC charging, and new PCM
  6.0 infotainment.

