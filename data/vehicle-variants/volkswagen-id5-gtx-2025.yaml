notes: |
  The ID.5 GTX is the performance AWD variant of VW's coupe SUV. With 340 hp,
  77 kWh battery, and 480 km WLTP range, it offers sportier performance
  compared to the RWD Pro while maintaining good range. The GTX branding
  signifies VW's performance electric models with dual motors, sport styling,
  and enhanced equipment. The coupe roofline provides improved aerodynamics
  compared to the ID.4 GTX while reducing rear headroom slightly. Built on
  MEB platform at VW's Zwickau factory. Targets buyers seeking performance
  and style in an electric coupe SUV. Competes with Audi Q4 Sportback e-tron
  50 quattro, BMW iX1 xDrive30, and Tesla Model Y Long Range AWD.

