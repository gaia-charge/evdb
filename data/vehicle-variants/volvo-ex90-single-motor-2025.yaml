notes: |
  The Volvo EX90 Single Motor is the more affordable entry to the EX90 range,
  introduced for MY2025. With RWD and 279 hp it offers relaxed but adequate
  performance for a luxury family SUV. More efficient than Twin Motor with
  580 km WLTP range. Same LiDAR technology and safety features as Twin Motor.
  Ideal for buyers who don't need AWD and prefer the lower price point.
  Competes with BMW iX xDrive40, Mercedes EQE SUV 350+.

