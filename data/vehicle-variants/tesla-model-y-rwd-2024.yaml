features:
notes: 'RWD base variant - most affordable Model Y, volume seller (50%+ of sales).

  LFP battery (CATL) in Europe: safer chemistry, better longevity, 100% charging recommended.

  60 kWh usable (vs 75 kWh Long Range) - sufficient for daily use, road trips.

  455 km WLTP range adequate for 95% of driving needs.

  Single rear motor RWD - simpler drivetrain, lower maintenance.

  170 kW peak DC charging (vs 250 kW Long Range) - still fast enough.

  LFP charging curve advantage: maintains power longer (80%+ SoC).

  6.9s 0-100 km/h - adequate performance for family SUV.

  €8,000+ cheaper than Long Range AWD - excellent value proposition.

  Made in Germany at Gigafactory Berlin (Europe deliveries).

  Access to Tesla Supercharger network (50,000+ chargers globally).

  Over-the-air updates add new features regularly.

  Full Self-Driving Capability available as €7,500 option or €99/month subscription.

  Optional tow hitch: €1,000 (1,600kg capacity).

  Optional 7-seater: €3,000 (third row).

  LFP battery advantages: no degradation concern with 100% charging, longer lifespan.

  LFP battery trade-offs: slightly lower energy density, reduced cold weather performance.

  '
