# Market & Pricing Notes
notes: >
  The Megane E-Tech EV40 is the entry-level variant with a 40 kWh battery, ideal for 
  urban and suburban driving. With a real-world range of around 260 km, it's perfect 
  for daily commuting and city use. The 130 kW DC fast charging enables 15-80% in 
  about 30 minutes. Despite being the base model, it includes the impressive OpenR 
  infotainment system and heat pump as standard. The efficient design and aerodynamics 
  (Cd 0.30) contribute to excellent energy consumption in its class.

