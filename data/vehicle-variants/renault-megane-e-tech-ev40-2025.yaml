  notes: |
    2025 model year continues with the proven 40 kWh battery option for budget-conscious
    buyers. Perfect for urban use with 250km real-world range covering typical daily needs.
    
    The EV40 offers same design, tech, and safety features as higher trims but with
    smaller battery for lower entry price. Still includes Google built-in, heat pump,
    digital cockpit, and comprehensive ADAS features.
    
    Popular in urban markets and for buyers who charge frequently. Lighter weight than
    EV60 variants provides nimble handling and efficient city driving.
    
    85kW DC charging allows 10-80% in 30 minutes, sufficient for occasional longer trips
    with charging stops.
