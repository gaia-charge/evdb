  notes: "Entry-level Megane E-Tech variant with 40kWh battery. Perfect for urban driving and commuters with shorter daily distances. 300km WLTP range is sufficient for most daily needs, and 85kW DC charging allows for reasonable road trip capability. Lighter weight (1,470kg) makes it nimble and efficient. More affordable entry point to European Car of the Year 2023 winner. Best suited for city/suburban use or as a second car."
