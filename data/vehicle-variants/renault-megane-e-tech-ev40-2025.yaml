# Notes
notes: >
  The Megane E-Tech EV40 is the entry-level variant designed primarily for urban 
  and suburban driving. With 300km WLTP range (real-world ~255km), it's ideal for 
  daily commuting and city use where its 40 kWh battery provides sufficient range 
  while keeping the price competitive.
  
  Despite being the entry model, the EV40 Equilibre comes well-equipped with Google 
  built-in infotainment, heat pump for winter efficiency, and comprehensive safety 
  features that earned the Megane E-Tech its 5-star Euro NCAP rating and European 
  Car of the Year 2023 award.
  
  The 96kW (130hp) motor provides adequate performance for most drivers, with 10-second 
  0-100km/h sprint and 150km/h top speed. One Pedal driving mode with adjustable 
  regenerative braking makes city driving particularly smooth and efficient.
  
  85kW DC fast charging means 10-80% in about 35 minutes, adding approximately 190km 
  of range - sufficient for a quick lunch stop on longer journeys. 7.4kW AC charging 
  at home fills the battery overnight (5.5 hours).
  
  The EV40 targets budget-conscious buyers who primarily drive shorter distances 
  and want access to Renault's award-winning electric crossover with excellent 
  design, technology, and safety at an attractive price point.

