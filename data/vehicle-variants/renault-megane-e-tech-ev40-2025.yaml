notes: >
  The Megane E-Tech EV40 is the entry-level variant with a 40 kWh usable battery (42 kWh gross).
  It offers 300 km WLTP range and 130 hp (96 kW), making it ideal for urban and suburban use.
  Despite being the base model, it comes well-equipped with the OpenR infotainment system,
  Google built-in, heat pump, and bidirectional charging capability. Real-world range is
  approximately 250 km in mixed conditions. DC fast charging reaches 85 kW peak, allowing
  10-80% charge in about 36 minutes. The single-phase AC charger (7.4 kW) is the main
  limitation compared to the three-phase 22 kW charger on EV60 variants.
