notes: >
  The EV40 is the entry-level Megane E-Tech variant with a 40 kWh battery delivering 300 km 
  WLTP range. Despite being the base model, it comes well-equipped with the full OpenR display 
  system, Google built-in, heat pump, and comprehensive safety features. The 130 hp motor 
  provides adequate performance for urban and suburban driving. DC fast charging at 85 kW 
  allows 36 minutes for 10-80% charging. The EV40 offers excellent value as an efficient 
  daily driver for those with shorter commutes or access to regular charging.
