  notes: |
    The EV40 is the entry-level Megane E-Tech variant, designed for urban and suburban use.
    With 300 km WLTP range, it's ideal for daily commuting and city driving. The smaller
    battery keeps weight down and makes the car more affordable.
    
    Real-world range is approximately 260 km in mixed conditions, which is sufficient for
    most daily use cases. Winter range drops to around 200-220 km in cold weather (-5°C).
    
    85 kW DC fast charging means you can charge from 10-80% in about 30 minutes, making
    it practical for occasional longer trips with charging stops.
    
    Popular choice for first-time EV buyers and urban drivers who don't need long range.
    Excellent efficiency and low running costs make it very economical.
