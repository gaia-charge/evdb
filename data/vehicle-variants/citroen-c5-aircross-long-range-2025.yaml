# Notes
notes: >
  The Citroën C5 Aircross Long Range offers the largest battery in the STLA Medium
  platform family at 97 kWh (96.9 kWh usable), providing an impressive 681 km WLTP
  range. Real-world range estimated at 485 km mixed driving.
  
  Citroën's comfort-focused approach sets it apart from sportier Stellantis siblings.
  The Advanced Comfort seats and progressive hydraulic cushion suspension deliver
  outstanding ride quality, making it ideal for families prioritizing passenger comfort.
  
  160kW DC fast charging reaches 10-80% in 32 minutes, competitive for the 400V
  architecture. Battery preconditioning via navigation helps optimize charging speed.
  
  Spacious interior with 565L trunk (1,668L max) provides excellent family practicality.
  The 519 kg payload and 1,200 kg towing capacity handle family duties well.
  
  Euro NCAP 5-star rating (2025) confirms safety, though the 62% safety assist score
  is lower than some competitors. Standard highway assist (Level 2) provides
  semi-autonomous driving on motorways.
  
  At approximately 2,246 kg, it's heavier than some competitors, reflecting the large
  battery. FWD-only configuration keeps the drivetrain simple and efficient.
  
  Direct platform-sharing with Peugeot e-3008 and Opel Grandland Electric, but
  differentiated by Citroën's comfort focus and typically lower pricing.

