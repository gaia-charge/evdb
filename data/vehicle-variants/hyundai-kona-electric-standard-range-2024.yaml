notes: 'Entry-level Kona Electric variant with 48.6 kWh battery delivering 377km WLTP
  range.

  Same powertrain as Long Range (115kW/156hp FWD) but smaller battery makes it €4,000
  cheaper.

  Built on E-GMP platform (400V architecture, not 800V).

  Standard heat pump improves winter efficiency.

  102kW DC fast charging (10-80% in 31 minutes) adequate for daily use.

  Dual 12.3" curved displays and Highway Driving Assist 2 standard.

  V2L capability (3.6kW) allows powering external devices.

  Real-world range 310km mixed driving, 260km highway, 245km winter conditions.

  Competes with VW ID.3 Pure (€39,995), MG4 Standard Range (€29,990), Nissan Leaf
  40kWh (€34,990).

  Popular with urban families and first-time EV buyers seeking practical electric
  SUV under €40,000.

  8-year/160,000km battery warranty standard across all Hyundai electric vehicles.

