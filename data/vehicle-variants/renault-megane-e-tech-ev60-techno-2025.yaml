notes: >
  The Megane E-Tech EV60 Techno is the mid-range variant with a 60 kWh usable battery
  (65 kWh gross) and 220 hp (160 kW) motor. It offers 450 km WLTP range and significantly
  better performance (7.4s 0-100 km/h) compared to the EV40. The Techno trim includes
  premium features like 19" wheels, 360° camera, heated seats, and semi-autonomous
  Highway Companion. Real-world range is approximately 370 km in mixed conditions.
  DC fast charging reaches 130 kW peak, allowing 10-80% charge in about 30 minutes.
  The three-phase 22 kW AC charger is a major advantage for home and destination charging
  in Europe. This variant offers the best value proposition in the lineup with strong
  range, performance, and equipment.
