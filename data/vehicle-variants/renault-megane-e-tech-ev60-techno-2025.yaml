  voltage: 400
  manufacturer: lg_energy_solution
  warranty:
    duration_years: 8
    duration_km: 160000
    capacity_retention_percent: 70
  cooling_system: liquid
  heat_pump: true
  preconditioning: true
  cell_to_pack: false

# Motor and drivetrain
motors:
  layout: fwd
  total_count: 1
  front:
    type: permanent_magnet
    power_kw: 160
    power_hp: 218
    torque_nm: 300
    manufacturer: renault

  combined:
    total_power_kw: 160
    total_power_hp: 218
    total_torque_nm: 300

drivetrain:
  drive_type: fwd
  transmission: single_speed_reduction

# Performance
performance:
  acceleration_0_100_kmh_s: 7.4
  top_speed_kmh: 160
  top_speed_limited: true

# Range and efficiency
range:
  wltp_km: 450
  wltp_city_km: 550
  wltp_highway_km: 380
  epa_km: null
  real_world_mixed_km: 380
