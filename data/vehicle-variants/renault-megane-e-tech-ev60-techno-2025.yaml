  notes: |
    2025 model year EV60 Techno is the most popular Megane variant - ideal balance
    of range, performance, and features at competitive pricing.
    
    The Techno trim adds significant equipment over base EV40:
    - Larger 60 kWh battery (450km WLTP, 370km real-world)
    - More powerful motor (218 HP vs 130 HP)
    - 22kW AC charging (vs 7.4kW)
    - 130kW DC charging (vs 85kW)
    - 360-degree camera
    - Hands-free parking
    - Wireless charging
    - Enhanced ambient lighting
    - Rear privacy glass
    - 18-inch alloy wheels (20-inch optional)
    
    Popular with company car drivers in Germany thanks to 0.25% taxation benefit.
    Base price under €45,000 makes it attractive for private buyers too.
    
    Real-world range of 370km covers most daily needs with comfortable margin.
    Winter range (0-10°C) typically 280-320km depending on heating usage.
    
    130kW DC charging allows 10-80% in 32 minutes, making long trips practical
    with occasional charging stops. 22kW AC charging means full charge overnight
    even from home wallbox (3 hours 0-100%).
    
    Excellent highway comfort with refined suspension and low wind noise thanks
    to 0.30 drag coefficient. Sport mode provides engaging performance with
    7.4s 0-100 km/h acceleration.
