  co2_emissions_wltp_g_per_km: 0

# Notes
notes: >
  The Renault Megane E-Tech EV60 Techno represents the sweet spot in the 
  Megane E-Tech lineup, offering 60 kWh battery with 450 km WLTP range 
  (380 km real-world) at accessible pricing.
  
  Techno trim includes comprehensive technology package with OpenR Screen 
  (12" touchscreen running Android Automotive OS) and Google services built-in, 
  eliminating need for smartphone connectivity for navigation and apps. This 
  integration is among the best in the segment.
  
  Heat pump standard ensures improved winter efficiency (300 km winter range 
  respectable for compact crossover). 130 kW DC fast charging enables 30-minute 
  10-80% charging, adequate for most users.
  
  450 km WLTP range competitive with VW ID.3 Pro S (557 km) and Cupra Born 
  77 kWh (548 km) but at lower price point. Compact 4.21m length makes it 
  ideal for European city driving while offering practical 440L trunk.
  
  Named European Car of the Year 2023, recognizing its blend of design, 
  technology, and practicality. Strong choice for buyers prioritizing 
  infotainment integration and French design flair.
