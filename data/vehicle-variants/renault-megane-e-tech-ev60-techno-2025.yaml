notes: >
  The EV60 Techno is the mid-range Megane E-Tech variant and represents the sweet spot in the 
  lineup. With a 60 kWh battery delivering 450 km WLTP range and a more powerful 218 hp motor, 
  it offers significantly better performance (7.4s 0-100 km/h) and long-distance capability. 
  Standard equipment is comprehensive, including the full OpenR display, 360° camera, adaptive 
  cruise control, and 22 kW AC charging. DC fast charging peaks at 130 kW, enabling 30 minutes 
  for 10-80%. The Techno trim adds premium features like ambient lighting, blind spot warning, 
  and two-tone paint. Excellent choice for those needing longer range and better performance.
