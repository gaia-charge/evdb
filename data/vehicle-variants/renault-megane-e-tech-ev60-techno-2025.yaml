notes: >
  The EV60 Techno represents the sweet spot in the Megane E-Tech lineup,
  offering 450 km WLTP range (385 km real-world) with the larger 60 kWh
  battery and more powerful 160 kW (218 hp) motor for spirited performance
  (7.4s 0-100 km/h). The Techno trim adds premium features like 20-inch
  wheels, Harman Kardon audio, heated seats and steering wheel, and advanced
  driver assistance including Highway Companion. The 130 kW Optimax Charge
  system enables rapid charging, making this variant ideal for both daily
  commuting and longer journeys. The 22 kW AC onboard charger is a significant
  advantage for home and public AC charging.

