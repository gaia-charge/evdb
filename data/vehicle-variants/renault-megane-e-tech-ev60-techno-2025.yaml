# Charging
charging:
  ac:
    max_power_kw: 7.4
    phases: 1
    time_0_100_hours: 8.1
    onboard_charger_kw: 7.4
  dc:
    max_power_kw: 130
    time_10_80_minutes: 30
    time_10_80_km_added: 315
    curve_description: >
      Peak 130kW charging maintained from 10-40% SoC, tapering to 80kW 
      at 50%, 60kW at 60%, 40kW at 70%, and 25kW at 80%. NMC chemistry 
      provides good charging performance in moderate temperatures.

