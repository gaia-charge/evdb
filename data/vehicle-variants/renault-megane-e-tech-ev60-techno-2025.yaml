  notes: |
    The EV60 Techno is the most popular Megane E-Tech variant, offering excellent balance
    of range, performance, and value. With 450 km WLTP range (380 km real-world), it's
    suitable for both daily use and longer trips.
    
    Techno trim includes:
    - 12" vertical OpenR Link touchscreen with Google built-in
    - 12.3" digital instrument cluster
    - Adaptive cruise control with stop & go
    - Lane centering assist
    - 360-degree camera
    - Automatic dual-zone climate control
    - Heat pump (standard on all variants)
    - LED headlights with automatic high beam
    - 18-inch alloy wheels
    - Wireless smartphone charging
    
    The more powerful 160 kW motor provides brisk acceleration (7.4s 0-100 km/h) while
    maintaining excellent efficiency. 22 kW AC charging means full charge in 3 hours at
    compatible three-phase chargers (common in Germany).
    
    130 kW DC fast charging allows 10-80% in 30 minutes, making road trips practical.
    Winter range is approximately 300-320 km in cold conditions (-5°C) thanks to the
    efficient heat pump.
    
    Strong competitor to VW ID.3 Pro Performance and Cupra Born 58 kWh. More stylish
    interior with better infotainment (Google built-in) but slightly less rear seat space.
