id: renault-megane-e-tech-ev60-techno-2025
model_id: renault-megane-e-tech
name: EV60 Techno
model_year: 2025
trim_level: techno
market_availability:
  - europe
  - germany
  - france
  - uk
  - spain
  - italy
  - netherlands
  - belgium

# Battery specifications
battery:
  total_kwh: 60
  usable_kwh: 60
