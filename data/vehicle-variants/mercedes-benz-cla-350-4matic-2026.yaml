  notes: |
    The CLA 350 4MATIC is the performance AWD variant of the Mercedes-Benz CLA Electric.
    Same 800V MMA platform and 90 kWh battery as the 250+, with added front motor for AWD.
    
    Key differences vs CLA 250+:
    - Dual motor AWD (vs single rear motor)
    - 260 kW / 354 PS (vs 200 kW / 272 PS)
    - 0-100 km/h: 4.9s (vs 6.7s)
    - 575 km real range (vs 585 km, -2% due to heavier AWD)
    - 2,135 kg (vs 2,055 kg, +80 kg)
    - 1,800 kg towing (vs 1,500 kg)
    
    Competes with:
    - Tesla Model 3 Long Range AWD (€50,990, 629 km WLTP)
    - BMW i4 M50 (€73,900, 521 km WLTP)
    - Polestar 2 Long Range Dual Motor (€54,950, 487 km WLTP)

