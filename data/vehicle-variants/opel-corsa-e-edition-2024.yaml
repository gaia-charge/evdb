  notes: "The Opel Corsa-e Edition is the base electric trim, offering excellent value\
    \ for \nmoney. Mechanically identical to the Peugeot e-208 - both built on Stellantis\
    \ CMP \nplatform with same battery, motor, and performance specs.\n\nEdition trim\
    \ has smaller 16\" wheels (better efficiency), halogen headlights, \nmanual climate\
    \ control, and simpler infotainment compared to GS Line.\n\nPopular as a city\
    \ runabout and entry-level EV in Germany with strong incentives.\n"
