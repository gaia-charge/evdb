  notes: |
    The Opel Corsa-e Edition is the base electric trim, offering excellent value for 
    money. Mechanically identical to the Peugeot e-208 - both built on Stellantis CMP 
    platform with same battery, motor, and performance specs.
    
    Edition trim has smaller 16" wheels (better efficiency), halogen headlights, 
    manual climate control, and simpler infotainment compared to GS Line.
    
    Popular as a city runabout and entry-level EV in Germany with strong incentives.
