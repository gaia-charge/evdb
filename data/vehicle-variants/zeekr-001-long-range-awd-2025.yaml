overview: >
  The Zeekr 001 Long Range AWD is the dual-motor performance variant of Zeekr's flagship shooting brake,
  delivering 400kW (544hp) and 686Nm from front and rear permanent magnet synchronous motors. It accelerates
  from 0-100 km/h in just 3.8 seconds while still offering an impressive 675km WLTP range from its 100kWh
  battery. The 800V architecture supports ultra-fast DC charging. The 2025 model features Haohan Smart
  Driving 2.0 with advanced autonomous driving capabilities.

