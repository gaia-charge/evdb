production_years: "2024-present"

overview: >
  The Zeekr X Long Range RWD is the single-motor variant of Zeekr's compact electric crossover, offering the best range in the lineup at 440km WLTP. With 200kW (272hp) from a single rear motor, it provides brisk performance with a 5.6s 0-100 km/h time while maintaining excellent efficiency. The 69kWh NMC battery supports 150kW DC fast charging for 10-80% in approximately 29 minutes. Built on Geely's SEA2 platform, it shares its architecture with the Volvo EX30 and Smart #1 but offers more interior space thanks to its larger dimensions.

