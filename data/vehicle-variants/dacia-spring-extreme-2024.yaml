notes: "Extreme trim adds comfort and convenience features over Essential:\n\n**Additional\
  \ Features:**\n- More powerful motor: 65hp vs 45hp (48kW vs 33kW)\n- Faster acceleration:\
  \ 13.7s vs 19.1s 0-100km/h\n- Automatic climate control (vs manual)\n- Cruise control\n\
  - Rear-view camera\n- Automatic headlights\n- Electric windows (front + rear)\n\
  - Fog lights\n- Leather steering wheel\n- Height-adjustable driver's seat\n- Roof\
  \ bars\n- Metallic paint options\n\n**Price Premium:**\n~€2,500 more than Essential\
  \ (€21,400 in Germany)\n\n**Worth It?**\nThe 65hp motor makes a significant difference\
  \ in city traffic and merging - the 45hp \nEssential feels underpowered. If budget\
  \ allows, Extreme is recommended for:\n- Better acceleration (less stressful in\
  \ traffic)\n- Cruise control (highway comfort)\n- Rear camera (tight parking)\n\
  - Automatic climate control\n\nHowever, both variants share the same limitations:\n\
  - 220km WLTP range (170km real-world)\n- 30kW DC charging only\n- Basic interior\
  \ quality\n- No heat pump (winter range loss)\n- 125km/h top speed\n\nLFP battery\
  \ chemistry provides excellent longevity - can charge to 100% daily without \nconcerns\
  \ about degradation. Battery warranty is conservative (70% after 8 years/120,000km)\
  \ \nbut LFP typically retains 90%+ capacity over this period.\n"
