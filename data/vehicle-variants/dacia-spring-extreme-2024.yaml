notes: |
  Extreme trim adds comfort and convenience features over Essential:
  
  **Additional Features:**
  - More powerful motor: 65hp vs 45hp (48kW vs 33kW)
  - Faster acceleration: 13.7s vs 19.1s 0-100km/h
  - Automatic climate control (vs manual)
  - Cruise control
  - Rear-view camera
  - Automatic headlights
  - Electric windows (front + rear)
  - Fog lights
  - Leather steering wheel
  - Height-adjustable driver's seat
  - Roof bars
  - Metallic paint options
  
  **Price Premium:**
  ~€2,500 more than Essential (€21,400 in Germany)
  
  **Worth It?**
  The 65hp motor makes a significant difference in city traffic and merging - the 45hp 
  Essential feels underpowered. If budget allows, Extreme is recommended for:
  - Better acceleration (less stressful in traffic)
  - Cruise control (highway comfort)
  - Rear camera (tight parking)
  - Automatic climate control
  
  However, both variants share the same limitations:
  - 220km WLTP range (170km real-world)
  - 30kW DC charging only
  - Basic interior quality
  - No heat pump (winter range loss)
  - 125km/h top speed
  
  LFP battery chemistry provides excellent longevity - can charge to 100% daily without 
  concerns about degradation. Battery warranty is conservative (70% after 8 years/120,000km) 
  but LFP typically retains 90%+ capacity over this period.

