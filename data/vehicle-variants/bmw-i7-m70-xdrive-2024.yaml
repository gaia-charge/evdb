notes: |
  The BMW i7 M70 xDrive is the performance flagship of BMW's electric 7 Series.
  With 660 hp, 1,100 Nm torque, and 0-100 km/h in 3.7 seconds, it delivers
  supercar acceleration while maintaining luxury sedan comfort. The M70 features
  M-tuned suspension, xDrive AWD with torque vectoring, and rear-biased power
  delivery for engaging dynamics. Despite 85 kg weight gain over eDrive50, the
  dual-motor setup provides dramatically improved performance. Standard equipment
  includes Bowers & Wilkins Diamond audio, Executive Drive Pro air suspension,
  and all the flagship technology features. Competes with Mercedes-AMG EQS 53
  4MATIC+ (658 hp) and Porsche Taycan Turbo S (761 hp) while offering more
  traditional luxury sedan space and comfort.

