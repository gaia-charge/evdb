description: 'Genesis GV60 Sport AWD 2025 is the mid-range variant of the facelifted
  GV60, replacing the

  former Advanced trim. The 2025 facelift brings refreshed exterior styling with updated
  Two

  Lines lighting signature, revised front and rear bumpers, new 12.3" OLED instrument
  cluster,

  updated 12.3" center touchscreen with latest ccOS infotainment platform, and enhanced
  Connected

  Car services including over-the-air updates. Dual-motor AWD with 234 kW (318 PS)
  combined output

  delivers brisk 5.5-second 0-100 km/h acceleration. The 77.4 kWh battery provides
  up to 466 km

  WLTP range. 800V architecture enables ultra-fast DC charging at up to 350 kW, reaching
  10-80%

  in just 18 minutes. Standard equipment includes Face Connect facial recognition,
  Crystal Sphere

  electronic shift dial, Highway Driving Assist 2, Remote Smart Parking Assist 2,
  premium leather

  interior, heated/ventilated front seats, panoramic sunroof, and Vehicle-to-Load
  (V2L) capability.

  The 2025 model adds improved acoustic insulation, redesigned steering wheel with
  haptic controls,

  and updated Multi-Collision Braking system.

  '
