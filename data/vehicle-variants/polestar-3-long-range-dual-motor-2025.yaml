description: |
  The 2025 Long Range Dual Motor is the AWD variant of the Polestar 3, featuring
  dual 180kW permanent magnet motors with a rear-motor disconnect clutch for efficiency.
  The 111kWh battery provides 636km WLTP range with AWD capability.
  
  Standard active dual-chamber air suspension with Standard, Agile, and Firm modes.
  Combined 489hp and 840Nm torque, 0-100 km/h in 5.0 seconds. Towing up to 2,200kg.

