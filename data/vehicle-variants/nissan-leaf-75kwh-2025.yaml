notes: >
  The Extended Range 75 kWh version of the all-new 2025 Nissan LEAF delivers an
  impressive 622 km WLTP range — nearly double the previous generation's best.
  With the more powerful 160 kW motor, it offers stronger acceleration while
  maintaining the same excellent 13.8 kWh/100km WLTP consumption. The heat pump
  is included as standard on this variant, helping maintain range in cold weather.
  This variant directly competes with the Renault Scenic E-Tech EV87 and
  Volkswagen ID.3 Pro S.

