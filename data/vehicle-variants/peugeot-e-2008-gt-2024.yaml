  notes: |
    The Peugeot e-2008 GT is the flagship trim level, adding premium equipment and 
    sporty styling to the practical B-SUV package.
    
    GT adds over Allure: FOCAL 10-speaker audio, Park Assist with 360° camera, adaptive 
    cruise, keyless entry, heated seats/wheel, 18\" wheels, GT body kit, Alcantara interior.
    
    Typical pricing: €4,000 premium over Allure (€43,000 vs €39,000 in Germany).
    
    Mechanically identical to Allure - same 54 kWh battery, 100kW motor, 406km WLTP range.
    The GT is about equipment, comfort, and style, not performance (no power upgrade).
    
    Best-in-class trunk space (405L) and real-world range (~340km) make it a practical 
    choice vs sportier but less roomy competitors like Opel Mokka-e or Jeep Avenger.
