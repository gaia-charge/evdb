overview: >
  The NIO EL7 75 kWh is the standard battery variant of NIO's premium mid-size SUV. 
  With dual-motor AWD producing 480 kW (653 PS) and 850 Nm, it accelerates 0-100 km/h 
  in 3.9 seconds. The 75 kWh battery provides 392 km WLTP range. The battery is 
  swappable at NIO Power Swap stations. Standard equipment is comprehensive including 
  active air suspension, Nappa leather, 23-speaker Dolby Atmos audio, and LiDAR ADAS.

