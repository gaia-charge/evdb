description: 'The 2026 Porsche Taycan 4S Sport Turismo combines the 4S powertrain
  with the

  more practical Sport Turismo body style, featuring an extended roofline for

  improved rear headroom and a larger hatchback trunk. With 400 kW (544 hp)

  and up to 440 kW overboost, it matches the sedan''s performance while offering

  405 liters of trunk space (vs 366L sedan) and up to 1,212L with rear seats folded.

  The 2026 model features updated PCM 6.0, 320 kW DC charging, and the 105 kWh

  Performance Battery Plus as standard.

  '
