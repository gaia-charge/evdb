notes: 'The Opel Frontera Electric Long Range is the extended-range version with a

  51 kWh NMC battery providing approximately 400 km WLTP range. It also features

  a more powerful 113 kW (154 PS) motor (vs 83 kW on the standard variant),

  11 kW 3-phase AC charging (vs 7.4 kW), and a heat pump as standard.


  Built on Stellantis'' Smart Car platform, it shares the boxy, practical design

  with excellent interior space (460L trunk, up to 1,600L with seats folded).

  Priced from approximately €33,000 in Germany, it offers a compelling package

  for families needing more range while keeping the affordable SUV character.


  Key improvements over the 44 kWh variant:

  - 31% more range (400 km vs 305 km WLTP)

  - 36% more power (113 kW vs 83 kW)

  - 117% more torque (260 Nm vs 120 Nm)

  - 11 kW 3-phase AC charging (vs 7.4 kW single-phase)

  - Heat pump standard for winter efficiency

  '
