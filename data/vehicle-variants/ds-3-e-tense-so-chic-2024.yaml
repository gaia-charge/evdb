  notes: |
    The DS 3 E-Tense So Chic is the premium mid-range trim, offering French luxury and 
    design excellence. Built on the same CMP platform as Peugeot e-2008 and Opel Mokka-e,
    but with significantly more premium materials, distinctive styling, and advanced features.
    
    So Chic trim is the sweet spot for DS 3 E-Tense buyers - better equipped than base 
    Bastille with Nappa leather, retractable door handles, 18" wheels, and premium audio,
    without the cost premium of top Rivoli trim.
    
    Key differentiators from platform siblings:
    - Nappa leather with DS watch strap quilting (vs cloth in e-2008/Mokka-e)
    - Retractable flush door handles for aerodynamics and style
    - DS IRIS voice assistant with natural language
    - Extended head-up display available
    - DS Active LED Vision adaptive headlights
    - Premium build quality and French luxury philosophy
    
    Slightly more powerful 115kW motor (vs 100kW in e-2008) provides better acceleration
    (8.7s vs 9.1s 0-100 km/h) at the cost of slightly lower range (402 vs 406 km).
    
    Competes with MINI Cooper Electric, Volvo EX40 (though larger), premium B-segment crossovers.
