overview: 'The NIO ET7 75 kWh is the standard-range variant of NIO''s flagship sedan,
  equipped with a  75 kWh battery providing 445 km WLTP range. It shares the same
  powerful dual-motor AWD  powertrain as the 100 kWh variant — 480kW (653 PS) combined
  output with 850 Nm torque and  3.8s 0-100 km/h. Available with battery (€69,900)
  or via BaaS at €57,900 plus €169/month.

  '
