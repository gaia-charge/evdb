notes: 'The NIO ET7 75 kWh is a compelling luxury sedan offering flagship-level equipment
  at a  price well below traditional German luxury competitors. Standard air suspension,
  massage  seats, lidar, HUD, and 23-speaker Dolby Atmos are remarkable at this price
  point. The  BaaS option at €57,900 + €169/month makes it accessible as a company
  car. Towing capacity  of 2,000 kg is class-leading among electric sedans.

  '
