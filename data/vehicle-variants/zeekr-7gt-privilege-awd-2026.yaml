overview: 'The Zeekr 7GT Privilege AWD is the performance-oriented dual-motor variant
  producing 475kW (646 PS) and 710Nm of torque. Sharing the same 100kWh CATL QILIN
  battery with 800V architecture as the RWD variant, AWD reduces range slightly to
  ~558km WLTP but delivers a blistering 3.3-second 0-100 km/h. Ultra-fast 480kW peak
  DC charging remains, with 10-80% in just 16 minutes.

  '
