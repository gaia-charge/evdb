  created_at: "2024-02-08"
  last_updated: "2024-02-08"
  notes: |
    Entry-level MG4 variant with 51kWh LFP battery.
    Still offers respectable 350km WLTP range.
    More affordable than Extended Range, ideal for daily commuting.
    Single-phase AC charging (6.6kW) vs three-phase on Extended Range.
    DC charging limited to 87kW but adequate for battery size.
    Rear-wheel drive provides good handling for the class.
    7-year/175,000km battery warranty same as Extended Range.
    Heat pump optional, Extended Range has it standard from 2024.
