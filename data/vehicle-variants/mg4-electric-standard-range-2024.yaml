  notes: |
    Entry-level MG4 variant with excellent value at €29,990 in Germany.
    Rear-wheel drive layout provides engaging driving dynamics uncommon at this price.
    350km WLTP range adequate for daily commuting and urban use.
    Standard heat pump improves cold weather efficiency vs competitors.
    87kW DC fast charging is class-competitive.
    4-star Euro NCAP rating (85% adult occupant protection).
    Near-perfect 50:50 weight distribution enhances handling.
    Challenges VW ID.3 Pure at significantly lower price point.
    Popular first-time EV choice across Europe.
