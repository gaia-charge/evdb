  notes: >
    The Countryman E is the single-motor FWD variant with 64.7kWh usable battery.
    150kW (204hp) front motor provides adequate performance for a family SUV.
    462km WLTP range is competitive in the compact SUV segment. DC charging at
    up to 130kW enables 10-80% in about 29 minutes. Shares platform with BMW iX1 eDrive20.
    Towing capacity of 1,200kg braked is useful for family duties.
