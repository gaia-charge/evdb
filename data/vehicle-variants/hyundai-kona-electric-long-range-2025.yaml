  notes: >
    2025 Hyundai Kona Electric Long Range carries over core specs from 2024
    with mid-cycle updates: new Junk Blue color, improved Bluelink connected
    services, updated infotainment software, and refined battery preconditioning.
    65.4 kWh battery provides 514 km WLTP range. FWD with 160 kW motor.
    V2L included. Heat pump standard. Excellent efficiency at 14.7 kWh/100km.
    Competes with Kia EV3 (more range, RWD) and VW ID.3 (similar price).
    Built in Czech Republic (Nošovice plant) and South Korea.

