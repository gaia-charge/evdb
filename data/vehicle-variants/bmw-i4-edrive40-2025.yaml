# Market & Pricing Notes
notes: >
  The 2025 i4 eDrive40 is the base RWD model with excellent efficiency and range.
  The 400V architecture limits DC charging to ~200kW peak. Real-world range
  in mixed conditions is around 480km. Minor updates for 2025 include OS 8.5
  and enhanced driver assistance features. The vehicle shares the same platform
  as the gasoline 4-series, resulting in some compromises (smaller frunk,
  higher weight) compared to dedicated EV platforms.

