notes: 'The ID.4 GTX is VW''s performance AWD compact SUV, combining 340 hp with

  practical family car credentials. The dual-motor AWD system provides

  excellent traction in all conditions. With 510 km WLTP range and 175 kW

  DC charging, it handles long trips well. The 2025 model benefits from

  updated ID. Software 4.0, improved infotainment responsiveness, and

  refined DCC adaptive dampers. GTX styling with sport bumpers, red accents,

  and 20-inch wheels distinguishes it from standard variants. Built on the

  MEB platform at Emden, Germany. Competes with Tesla Model Y Long Range AWD,

  BMW iX1 xDrive30, Skoda Enyaq 85x, and Hyundai Ioniq 5 AWD.

