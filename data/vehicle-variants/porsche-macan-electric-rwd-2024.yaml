    - https://newsroom.porsche.com
  notes: |
    The Macan Electric RWD is the ideal entry point into electric Porsche SUV 
    ownership. It offers:
    - LONGEST range: 613km WLTP (40-50km more than 4S)
    - BEST efficiency: 18.1 kWh/100km
    - LIGHTEST weight: 2,260kg
    - SAME 800V charging: 270kW peak (no compromise)
    - LOWER price: ~€20k cheaper than 4S
    - RWD engagement: Classic sports car driving feel
    - SUV practicality: 5 seats, 540L cargo, 2,000kg towing
    
    For most buyers, the RWD offers the complete package: excellent range for 
    daily use and road trips, flagship charging technology, strong performance, 
    and authentic Porsche driving dynamics at the most accessible price.
    
    Competitors: Audi Q6 e-tron RWD (platform sibling), BMW iX xDrive40, 
    Mercedes EQE SUV 350+, Tesla Model Y Long Range
    
    Recommended options:
    - 22kW AC onboard charger (€1,680) - faster home/destination charging
    - Porsche InnoDrive (€2,990) - adaptive cruise + predictive efficiency
    - Surround View with Park Assist Plus (€1,890)
    - Comfort seats with memory (€1,290)
