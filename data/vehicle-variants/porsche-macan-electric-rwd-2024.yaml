motors:
  count: 1
  type: Permanent Magnet Synchronous Motor (PMSM)
  configuration: RWD (rear-wheel drive)
  rear_motor:
    power_kw: 240
    power_hp: 326
    type: PMSM
  combined_power_kw: 240
  combined_power_hp: 326
  overboost_power_kw: 265
  overboost_power_hp: 360
  overboost_duration_seconds: 10
  torque_nm: 563
  notes: |
    Macan Electric RWD features single rear motor:
    - Rear: 240kW (326hp) continuous, 265kW (360hp) overboost
    - Torque: 563 Nm (impressive for single motor setup)
    
    Overboost (Launch Control): 265kW for ~10 seconds during hard acceleration.
    Pure rear-wheel drive provides engaging driving dynamics with excellent 
    traction control from Porsche Traction Management (PTM).

drive_type: RWD
driven_wheels: rear

performance:
  acceleration_0_100_kmh_seconds: 6.5
  acceleration_0_60_mph_seconds: 6.2
  acceleration_0_200_kmh_seconds: 26.8
  top_speed_kmh: 200
  top_speed_electronically_limited: true
  notes: |
    Macan Electric RWD with overboost (Launch Control):
    - 0-100 km/h: 6.5 seconds
    - 0-60 mph: 6.2 seconds
    - 0-200 km/h: 26.8 seconds
    - Top speed: 200 km/h (electronically limited)
    
    Quick for an SUV, maintaining Porsche sports car spirit. Faster than most 
    hot hatches and competitive luxury SUVs. Instant torque delivery typical of 
    electric motors provides engaging acceleration.

weight:
  curb_weight_kg: 2260
  distribution_front_percent: 47
  distribution_rear_percent: 53
  gross_weight_kg: 2865
  payload_kg: 605
  towing_capacity_kg: 2000
  towing_capacity_braked_kg: 2000
  notes: |
    RWD is lightest Macan Electric variant at 2,260kg (~80kg lighter than 4S).
    Rear-biased weight distribution (47/53) aids handling and traction. 
    2,000kg towing capacity standard (with optional tow hitch).

suspension:
  front: Multi-link with adaptive air suspension
  rear: Multi-link with adaptive air suspension
  adaptive_damping: Porsche Active Suspension Management (PASM)
  adjustable_ride_height: true
  notes: |
    Standard two-chamber air suspension with PASM (Porsche Active Suspension 
    Management). Three ride height settings: Normal, High (ground clearance +10mm), 
    High Level 2 (ground clearance +20mm for off-road). Automatic lowering at 
    speed for improved aerodynamics and efficiency.

brakes:
  front: 360mm ventilated discs
  rear: 350mm ventilated discs
  caliper_type: Fixed aluminum monobloc calipers
  regenerative: true
  regenerative_max_power_kw: 240
  notes: |
    Standard: Fixed aluminum monobloc calipers with 360mm front / 350mm rear discs
    Optional: Porsche Ceramic Composite Brake (PCCB) - €9,240
    Optional: Porsche Surface Coated Brake (PSCB) - €3,150
    
    Regenerative braking: Up to 240kW recuperation, one-pedal driving optional

