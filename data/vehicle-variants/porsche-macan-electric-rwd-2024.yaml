description: "The Porsche Macan Electric represents a new chapter for Porsche's best-selling\
  \ SUV.\nBuilt on the advanced PPE (Premium Platform Electric) platform co-developed\
  \ with \nAudi, the base Macan Electric features a single rear motor delivering 240kW\
  \ (326hp) \nand rear-wheel drive configuration that honors Porsche's sports car\
  \ heritage.\n\nDespite being the \"entry-level\" variant, the Macan Electric delivers\
  \ impressive \nperformance (0-100 km/h in 6.5s) while offering excellent range (up\
  \ to 613km WLTP) \nand ultra-fast 800V charging capability (270kW peak, 10-80% in\
  \ 21 minutes).\n\nThe PPE platform brings cutting-edge technology: 100kWh battery,\
  \ flat floor for \noptimal packaging, sophisticated thermal management, and advanced\
  \ regenerative \nbraking. Air suspension is standard, as is the new Porsche Driver\
  \ Experience \nwith curved display cockpit.\n\nFor those seeking pure Porsche driving\
  \ dynamics in an electric SUV package without \nAWD complexity, the RWD Macan Electric\
  \ offers the best efficiency, longest range, \nand most accessible price point while\
  \ maintaining the sports car character that \ndefines every Porsche.\n"
