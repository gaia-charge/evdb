    - BEST efficiency: 18.1 kWh/100km\n- LIGHTEST weight: 2,260kg\n- SAME 800V charging:\
    \ 270kW peak (no compromise)\n- LOWER price: ~€20k cheaper than 4S\n- RWD engagement:\
    \ Classic sports car driving feel\n- SUV practicality: 5 seats, 540L cargo, 2,000kg\
    \ towing\n\nFor most buyers, the RWD offers the complete package: excellent range\
    \ for \ndaily use and road trips, flagship charging technology, strong performance,\
    \ \nand authentic Porsche driving dynamics at the most accessible price.\n\nCompetitors:\
    \ Audi Q6 e-tron RWD (platform sibling), BMW iX xDrive40, \nMercedes EQE SUV 350+,\
    \ Tesla Model Y Long Range\n\nRecommended options:\n- 22kW AC onboard charger\
    \ (€1,680) - faster home/destination charging\n- Porsche InnoDrive (€2,990) -\
    \ adaptive cruise + predictive efficiency\n- Surround View with Park Assist Plus\
    \ (€1,890)\n- Comfort seats with memory (€1,290)\n"
