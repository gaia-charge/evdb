# CHARGING
# ============================================================================

charging:
  ac:
    max_power_kw: 11
    standard: true
    optional_upgrade_kw: 22
    optional_upgrade_cost: "€1,680 (22kW onboard charger)"
    connector_type: Type2
    phases: 3
    time_0_100_hours: 9.5
    notes: |
      Standard: 11kW AC (3-phase Type2) - 0-100% in ~9.5 hours
      Optional: 22kW AC onboard charger upgrade (€1,680) - 0-100% in ~4.8 hours
  
  dc:
    max_power_kw: 270
    connector_type: CCS2
    architecture_voltage: 800
    time_10_80_minutes: 21
    time_5_80_minutes: 21
    peak_charge_time_minutes: "15-30% state of charge"
    notes: |
      PPE platform delivers industry-leading 800V fast charging:
      - Peak: 270kW (achieved between 15-30% SoC at 350kW chargers)
      - 10-80%: ~21 minutes (ideal conditions, preconditioned battery)
      - Average 10-80%: ~23-25 minutes real-world
      - 100km range in ~5 minutes
      
      Base RWD offers same flagship charging as Turbo variant - no compromise on 
      charging technology regardless of trim level. This is a key advantage of 
      PPE platform.
    
    charge_curve:
      - soc_percent: 0
        power_kw: 60
      - soc_percent: 10
        power_kw: 260
      - soc_percent: 15
        power_kw: 270
        note: "Peak power"
      - soc_percent: 30
        power_kw: 268
      - soc_percent: 50
        power_kw: 190
      - soc_percent: 70
        power_kw: 95
      - soc_percent: 80
        power_kw: 55

bidirectional_charging:
  v2l: true
  v2l_power_kw: 11
  v2h: true
  v2g: true
  notes: |
    PPE platform supports bidirectional charging:
    - V2L: 11kW external power supply (camping, tools, etc.)
    - V2H: Home backup power (requires compatible home charger)
    - V2G: Grid services (market/region dependent)

