# Porsche Macan Electric RWD 2024
# Entry-level Macan Electric with single rear motor
# Built on PPE platform with 800V architecture
# Porsche's electric compact SUV combining sports car DNA with practicality

id: porsche-macan-electric-rwd-2024
name: Macan Electric
model_id: porsche-macan-electric
manufacturer_id: porsche
variant_name: "(Base RWD)"
model_year: 2024
trim_level: Base
version: Base

description: |
  The Porsche Macan Electric represents a new chapter for Porsche's best-selling SUV.
  Built on the advanced PPE (Premium Platform Electric) platform co-developed with 
  Audi, the base Macan Electric features a single rear motor delivering 240kW (326hp) 
  and rear-wheel drive configuration that honors Porsche's sports car heritage.
  
  Despite being the "entry-level" variant, the Macan Electric delivers impressive 
  performance (0-100 km/h in 6.5s) while offering excellent range (up to 613km WLTP) 
  and ultra-fast 800V charging capability (270kW peak, 10-80% in 21 minutes).
  
  The PPE platform brings cutting-edge technology: 100kWh battery, flat floor for 
  optimal packaging, sophisticated thermal management, and advanced regenerative 
  braking. Air suspension is standard, as is the new Porsche Driver Experience 
  with curved display cockpit.
  
  For those seeking pure Porsche driving dynamics in an electric SUV package without 
  AWD complexity, the RWD Macan Electric offers the best efficiency, longest range, 
  and most accessible price point while maintaining the sports car character that 
  defines every Porsche.

