# BATTERY & RANGE
# ============================================================================

battery:
  usable_kwh: 95.0
  total_kwh: 100.0
  chemistry: NMC
  cells: prismatic
  manufacturer: Samsung SDI
  supplier: Samsung SDI (South Korea)
  modules: 12
  cells_total: 180
  nominal_voltage: 662
  pack_voltage_range: "560-830V (800V architecture)"
  warranty_years: 8
  warranty_km: 160000
  warranty_capacity_percent: 70
  thermal_management: liquid-cooled
  heating: integrated battery heating
  preconditioning: true
  notes: |
    PPE platform 100kWh battery with 800V architecture for ultra-fast charging.
    12 modules with 15 prismatic cells each. Advanced thermal management with 
    heat pump integration for optimal efficiency in all weather conditions.
    Preconditioning via navigation or Porsche Connect app optimizes charging speed.

range:
  wltp_km: 613
  wltp_city_km: 770
  wltp_highway_km: 500
  epa_km: 490
  epa_miles: 305
  real_world_km: 520
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    WLTP: 613km (95kWh battery, 19" Macan wheels, RWD)
    EPA: ~305 miles / 490km estimated (US rating)
    Real-world: ~520km mixed driving in good conditions
    
    Longest range of Macan variants thanks to single motor efficiency. Excellent 
    for daily driving and longer trips. Winter range: ~450km in cold conditions 
    (-5°C to 5°C) with heat pump helping maintain efficiency.

efficiency:
  wltp_kwh_per_100km: 18.1
  epa_kwh_per_100km: 21.0
  real_world_kwh_per_100km: 22.5
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    Most efficient Macan Electric variant at 18.1 kWh/100km WLTP. Single rear 
    motor eliminates front motor drag. Slightly higher consumption than smaller 
    EVs due to SUV form factor, wider tires, and Porsche performance tuning, but 
    excellent for a compact luxury SUV.

