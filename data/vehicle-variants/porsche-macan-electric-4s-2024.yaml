metadata:
  data_quality: verified
  data_source: manufacturer
  created_at: "2026-02-08"
  last_updated: "2026-02-08"
  verified_by: Porsche official specifications
  sources:
    - https://www.porsche.com/germany/models/macan/macan-models/
    - https://newsroom.porsche.com
  notes: |
    The Macan 4S is the sweet spot variant, offering:
    - STRONG performance: 4.1s 0-100 km/h (sports car acceleration)
    - AWD security: Porsche Traction Management for all-weather capability
    - EXCELLENT range: 578km WLTP (only 35km less than RWD)
    - SAME charging: 270kW peak, 21 minutes 10-80%
    - MORE standard equipment: LED Matrix lights, sport seats, GT steering wheel
    - MODEST premium: ~€15k more than RWD, ~€20k less than Turbo
    
    For most enthusiast buyers, the 4S represents the ideal balance: genuine sports 
    car performance (sub-5-second acceleration), all-weather capability, excellent 
    efficiency, and comprehensive equipment without Turbo pricing.
    
    The intelligent PTM system provides rear-biased power distribution for engaging 
    driving dynamics while seamlessly adding front motor torque when needed for 
    traction or maximum acceleration.
    
    Competitors: Audi SQ6 e-tron (360kW, 4.3s, platform sibling), BMW iX M60 
    (455kW, 3.8s, €120k - much more expensive), Mercedes-AMG EQE 53 SUV (460kW, 
    3.5s, €107k), Tesla Model X Plaid (760kW, 2.5s, €119k)
    
    Recommended options:
    - 22kW AC charger (€1,680)
    - Porsche InnoDrive (€2,990)
    - PTV Plus rear differential (€1,890) - transforms cornering
    - Comfort seats with memory and ventilation (€2,490)
    - Burmester audio (€5,490) - exceptional sound quality
