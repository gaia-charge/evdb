description: "The Porsche Macan 4S represents the sweet spot in the Macan Electric\
  \ lineup,\ncombining dual-motor all-wheel drive performance with impressive efficiency\
  \ and \nrange. With 330kW (448hp) and sophisticated Porsche Traction Management\
  \ (PTM), \nthe 4S delivers exhilarating 4.1-second 0-100 km/h acceleration while\
  \ maintaining \n578km WLTP range.\n\nThe dual-motor setup provides intelligent torque\
  \ vectoring and all-weather \ncapability, making the 4S ideal for drivers who need\
  \ AWD traction without \ncompromising efficiency. The PPE platform's 800V architecture\
  \ delivers the same \nflagship 270kW charging speed as the base model (10-80% in\
  \ 21 minutes).\n\nStandard equipment is comprehensive: air suspension with PASM,\
  \ sport seats, LED \nMatrix headlights, and the new Porsche Driver Experience cockpit.\
  \ The 4S strikes \nthe perfect balance between everyday usability (excellent range,\
  \ charging speed) \nand sports car performance (sub-5-second acceleration, precise\
  \ handling).\n\nFor buyers seeking the complete Macan Electric experience with all-weather\
  \ \nsecurity and strong performance, the 4S offers exceptional value without the\
  \ \nprice premium of the Turbo variant.\n"
