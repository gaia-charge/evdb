# BATTERY & RANGE
# ============================================================================

battery:
  usable_kwh: 95.0
  total_kwh: 100.0
  chemistry: NMC
  cells: prismatic
  manufacturer: Samsung SDI
  supplier: Samsung SDI (South Korea)
  modules: 12
  cells_total: 180
  nominal_voltage: 662
  pack_voltage_range: "560-830V (800V architecture)"
  warranty_years: 8
  warranty_km: 160000
  warranty_capacity_percent: 70
  thermal_management: liquid-cooled
  heating: integrated battery heating
  preconditioning: true
  notes: |
    Same PPE platform 100kWh battery as RWD variant with 800V architecture.
    Dual-motor AWD system adds weight and drag, reducing range by ~35km vs RWD.
    Advanced thermal management optimized for high-performance driving and fast 
    charging.

range:
  wltp_km: 578
  wltp_city_km: 720
  wltp_highway_km: 475
  epa_km: 465
  epa_miles: 289
  real_world_km: 490
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    WLTP: 578km (95kWh battery, 19" Macan wheels, AWD)
    EPA: ~289 miles / 465km estimated (US rating)
    Real-world: ~490km mixed driving in good conditions
    
    Approximately 35km less range than RWD due to dual motors and AWD system drag.
    Still excellent range for daily driving and road trips. Winter range: ~420km 
    in cold conditions with heat pump.

efficiency:
  wltp_kwh_per_100km: 19.3
  epa_kwh_per_100km: 22.5
  real_world_kwh_per_100km: 24.0
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    Macan 4S consumes 19.3 kWh/100km WLTP (~1.2 kWh/100km more than RWD).
    AWD efficiency penalty is typical for dual-motor systems but kept minimal 
    through intelligent power distribution and motor disconnect capability.

