  notes: "The Macan 4S is the sweet spot variant, offering:\n- STRONG performance:\
    \ 4.1s 0-100 km/h (sports car acceleration)\n- AWD security: Porsche Traction\
    \ Management for all-weather capability\n- EXCELLENT range: 578km WLTP (only 35km\
    \ less than RWD)\n- SAME charging: 270kW peak, 21 minutes 10-80%\n- MORE standard\
    \ equipment: LED Matrix lights, sport seats, GT steering wheel\n- MODEST premium:\
    \ ~€15k more than RWD, ~€20k less than Turbo\n\nFor most enthusiast buyers, the\
    \ 4S represents the ideal balance: genuine sports \ncar performance (sub-5-second\
    \ acceleration), all-weather capability, excellent \nefficiency, and comprehensive\
    \ equipment without Turbo pricing.\n\nThe intelligent PTM system provides rear-biased\
    \ power distribution for engaging \ndriving dynamics while seamlessly adding front\
    \ motor torque when needed for \ntraction or maximum acceleration.\n\nCompetitors:\
    \ Audi SQ6 e-tron (360kW, 4.3s, platform sibling), BMW iX M60 \n(455kW, 3.8s,\
    \ €120k - much more expensive), Mercedes-AMG EQE 53 SUV (460kW, \n3.5s, €107k),\
    \ Tesla Model X Plaid (760kW, 2.5s, €119k)\n\nRecommended options:\n- 22kW AC\
    \ charger (€1,680)\n- Porsche InnoDrive (€2,990)\n- PTV Plus rear differential\
    \ (€1,890) - transforms cornering\n- Comfort seats with memory and ventilation\
    \ (€2,490)\n- Burmester audio (€5,490) - exceptional sound quality\n"
