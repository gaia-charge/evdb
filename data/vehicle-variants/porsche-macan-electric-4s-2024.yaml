# Porsche Macan Electric 4S 2024
# Mid-range Macan Electric with dual motors and all-wheel drive
# Built on PPE platform with 800V architecture
# Performance AWD variant with impressive 4.1s 0-100 km/h

id: porsche-macan-electric-4s-2024
name: "4S"
model_id: porsche-macan-electric
manufacturer_id: porsche
variant_name: Macan 4S
model_year: 2024
trim_level: 4S
version: 4S

description: |
  The Porsche Macan 4S represents the sweet spot in the Macan Electric lineup,
  combining dual-motor all-wheel drive performance with impressive efficiency and 
  range. With 330kW (448hp) and sophisticated Porsche Traction Management (PTM), 
  the 4S delivers exhilarating 4.1-second 0-100 km/h acceleration while maintaining 
  578km WLTP range.
  
  The dual-motor setup provides intelligent torque vectoring and all-weather 
  capability, making the 4S ideal for drivers who need AWD traction without 
  compromising efficiency. The PPE platform's 800V architecture delivers the same 
  flagship 270kW charging speed as the base model (10-80% in 21 minutes).
  
  Standard equipment is comprehensive: air suspension with PASM, sport seats, LED 
  Matrix headlights, and the new Porsche Driver Experience cockpit. The 4S strikes 
  the perfect balance between everyday usability (excellent range, charging speed) 
  and sports car performance (sub-5-second acceleration, precise handling).
  
  For buyers seeking the complete Macan Electric experience with all-weather 
  security and strong performance, the 4S offers exceptional value without the 
  price premium of the Turbo variant.

