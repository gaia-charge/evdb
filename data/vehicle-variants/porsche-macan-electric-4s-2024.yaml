    \ magnet synchronous\n- Rear: 200kW (272hp) permanent magnet synchronous\n- Combined:\
    \ 330kW (448hp) continuous, 360kW (489hp) overboost\n- Torque: 650 Nm (impressive\
    \ for mid-range variant)\n\nOverboost (Launch Control): 360kW for ~10 seconds\
    \ during maximum acceleration.\nPorsche Traction Management (PTM) intelligently\
    \ distributes torque between \naxles for optimal traction and efficiency. Front\
    \ motor can disconnect during \ncruising to maximize efficiency.\n"
