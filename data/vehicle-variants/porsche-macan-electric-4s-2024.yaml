# ============================================================================
# MOTORS & PERFORMANCE
# ============================================================================

motors:
  count: 2
  type: Permanent Magnet Synchronous Motor (PMSM)
  configuration: AWD (all-wheel drive)
  front_motor:
    power_kw: 130
    power_hp: 177
    type: PMSM
  rear_motor:
    power_kw: 200
    power_hp: 272
    type: PMSM
  combined_power_kw: 330
  combined_power_hp: 448
  overboost_power_kw: 360
  overboost_power_hp: 489
  overboost_duration_seconds: 10
  torque_nm: 650
  notes: |
    Macan 4S features intelligent dual-motor AWD:
    - Front: 130kW (177hp) permanent magnet synchronous
    - Rear: 200kW (272hp) permanent magnet synchronous
    - Combined: 330kW (448hp) continuous, 360kW (489hp) overboost
    - Torque: 650 Nm (impressive for mid-range variant)
    
    Overboost (Launch Control): 360kW for ~10 seconds during maximum acceleration.
    Porsche Traction Management (PTM) intelligently distributes torque between 
    axles for optimal traction and efficiency. Front motor can disconnect during 
    cruising to maximize efficiency.

drive_type: AWD
driven_wheels: all

performance:
  acceleration_0_100_kmh_seconds: 4.1
  acceleration_0_60_mph_seconds: 3.9
  acceleration_0_200_kmh_seconds: 17.1
  top_speed_kmh: 220
  top_speed_electronically_limited: true
  notes: |
    Macan 4S with overboost (Launch Control):
    - 0-100 km/h: 4.1 seconds (sports car territory!)
    - 0-60 mph: 3.9 seconds
    - 0-200 km/h: 17.1 seconds
    - Top speed: 220 km/h (electronically limited)
    - Quarter mile: ~12.5 seconds
    
    Extremely quick for an SUV. Faster than original Porsche 911 Carrera models.
    Dual-motor AWD provides relentless traction and predictable handling in all 
    weather conditions.

weight:
  curb_weight_kg: 2340
  distribution_front_percent: 48
  distribution_rear_percent: 52
  gross_weight_kg: 2945
  payload_kg: 605
  towing_capacity_kg: 2000
  towing_capacity_braked_kg: 2000
  notes: |
    Macan 4S weighs 2,340kg (80kg heavier than RWD due to front motor and AWD 
    components). Near-perfect weight distribution (48/52) provides balanced 
    handling. 2,000kg towing capacity standard.

suspension:
  front: Multi-link with adaptive air suspension
  rear: Multi-link with adaptive air suspension
  adaptive_damping: Porsche Active Suspension Management (PASM)
  adjustable_ride_height: true
  notes: |
    Standard two-chamber air suspension with PASM. 4S benefits from sportier 
    damper tuning vs RWD. Three ride height settings plus automatic lowering at 
    speed. Optional Porsche Torque Vectoring Plus (PTV Plus, €1,890) adds 
    electronic rear differential for even sharper cornering.

brakes:
  front: 375mm ventilated discs
  rear: 365mm ventilated discs
  caliper_type: Fixed aluminum monobloc calipers (white painted)
  regenerative: true
  regenerative_max_power_kw: 275
  notes: |
    Standard: Upgraded brakes vs RWD - 375mm front / 365mm rear with white calipers
    Optional: Porsche Ceramic Composite Brake (PCCB) - €9,240
    Optional: Porsche Surface Coated Brake (PSCB) - €3,150
    
    Regenerative braking: Up to 275kW recuperation (higher than RWD thanks to 
    dual motors), one-pedal driving optional

