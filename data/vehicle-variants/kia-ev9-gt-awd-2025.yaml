notes: |
  The Kia EV9 GT AWD 2025 is the performance flagship of the EV9 lineup.
  At €89,990 in Germany, it offers supercar-rivaling acceleration (4.3s 0-100)
  in a practical 7-seat SUV package. The GT adds 515 hp dual motors,
  GT-tuned suspension, e-LSD, and exclusive styling. Despite the performance
  focus, it retains full family practicality with 7 seats and 800V fast charging.
  Competes with Tesla Model X Performance but at a significantly lower price.

