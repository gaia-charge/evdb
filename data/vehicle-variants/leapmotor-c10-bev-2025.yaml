overview: 'The Leapmotor C10 BEV is the pure electric variant of the C10 compact SUV.
  With a 69.9 kWh LFP battery and single rear motor producing 170 kW (231 PS), it
  offers 420 km WLTP range at a highly competitive price point starting from €36,400
  in Germany. The interior quality punches well above its price class with minimalist
  design, premium materials, and comprehensive standard equipment including panoramic
  roof, 14.6-inch touchscreen, and full ADAS suite. Main limitation is the DC charging
  speed capped at 84.4 kW.

  '
