notes: |
  Second-generation Zoe (ZE50) launched in 2019 with significant upgrades over original:
  - Battery: 41kWh → 52kWh (50kWh usable)
  - Range: 300km → 395km WLTP
  - DC fast charging: Optional from 2020, standard from 2024
  
  R135 motor variant (100kW/135hp) replaced R110 (80kW/110hp) in most markets.
  R135 has 11kW AC charging vs R110's 22kW Chameleon Charger but adds DC capability.
  
  Europe's best-selling EV from 2012-2019 with 500,000+ units sold globally.
  
  Battery leasing was pioneered by Zoe but discontinued for new purchases (common on used market).
  
  50kW DC fast charging now standard in 2024 (was €1,000 option 2019-2023).

