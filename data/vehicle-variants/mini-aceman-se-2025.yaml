  notes: >
    The Aceman SE is the smaller battery entry-level variant with 42.5kWh usable
    capacity and 135kW motor. 310km WLTP range suits urban commuters. Lower DC
    charging peak of 75kW but still achieves 10-80% in ~28 minutes due to smaller
    battery. More affordable entry point into the Aceman range. Despite the "SE"
    name, this is actually the base/smaller variant (Mini naming convention).
