notes: "Nissan Leaf e+ 62kWh is the longer-range version of the world's best-selling\
  \ electric vehicle.\nFeatures larger 62 kWh battery (vs 40 kWh base) delivering\
  \ 385km WLTP range (115km more than base).\nMore powerful 160kW (217hp) motor vs\
  \ 110kW base variant provides sporty 6.9s 0-100 km/h acceleration.\n\nMain limitations\
  \ remain: CHAdeMO charging only (not CCS2 standard), limiting fast charging availability\n\
  in Europe (only ~10% of DC fast chargers vs 90%+ CCS2). Passive air cooling can\
  \ lead to faster battery\ndegradation in hot climates compared to actively-cooled\
  \ rivals.\n\ne+ only available in top Tekna trim with comprehensive standard equipment\
  \ including ProPILOT Assist,\n360° camera, Bose audio, leather seats, LED headlights.\n\
  \nStrengths: Proven reliability (650,000+ LEAFs sold globally since 2010), extensive\
  \ dealer network\n(650+ in Germany), V2G/V2H bidirectional charging, comfortable\
  \ e-Pedal one-pedal driving,\n8-year/160,000km battery warranty, 385km WLTP range\
  \ adequate for most use cases.\n\nTarget buyers: Families needing more range than\
  \ 40kWh variant, long-time Leaf enthusiasts upgrading,\ncompany car drivers (0.25%\
  \ tax benefit), those prioritizing proven EV technology over cutting-edge specs,\n\
  home charging users where CHAdeMO limitation less critical.\n\nBuilt in Sunderland,\
  \ UK (Europe) and Oppama, Japan. Second-generation facelift (2019+) features\nimproved\
  \ aerodynamics, updated front design, enhanced ProPILOT system.\n\nReal-world range:\
  \ 320km mixed driving adequate for daily use and weekend trips, 270km highway at\
  \ 130 km/h,\n390km city driving, 240km winter conditions (no heat pump, 25% range\
  \ loss typical).\n\nCompetes with VW ID.3 Pro (€39,995, 172km more range, CCS2),\
  \ Hyundai Kona Electric Long Range\n(€42,990, 129km more range, CCS2), Kia Niro\
  \ EV (€43,990, 75km more range, CCS2, 800V), \nRenault Megane E-Tech EV60 (€43,000,\
  \ 65km more range, CCS2), MG4 Extended Range (€35,990, \n65km more range, CCS2,\
  \ €8k cheaper).\n"

