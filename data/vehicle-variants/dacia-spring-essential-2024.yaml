notes: "Essential trim is the base model - Europe's most affordable EV at €18,900\
  \ (Germany).\n\nDespite basic specification, includes:\n- 10\" touchscreen with\
  \ wireless Apple CarPlay/Android Auto (2024+)\n- 6 airbags (upgraded from 2 in 2021)\n\
  - Automatic emergency braking (2024+)\n- Lane keeping assist (2024+)\n- LED daytime\
  \ running lights\n- Electric windows (front)\n- Central locking\n- MY Dacia app\
  \ connectivity\n\nOmits:\n- Alloy wheels (steel with covers)\n- Rear camera\n- Cruise\
  \ control\n- Air conditioning (optional €500)\n- Metallic paint\n\nLFP battery chemistry\
  \ (CATL) provides excellent longevity and cold-weather stability \ncompared to NMC,\
  \ though energy density is lower. LFP batteries can be charged to 100% \nregularly\
  \ without degradation concerns.\n\nReal-world range highly dependent on weather:\n\
  - Summer/city: 200-220km\n- Winter/mixed: 140-170km\n- Highway: 150-180km\n\n7kW\
  \ AC charging means overnight charging at home is practical (empty to full in ~4\
  \ hours).\n"
