description: 'The Long Range Single Motor is the most efficient variant of the Polestar
  3, featuring

  rear-wheel drive with a single 220kW permanent magnet motor and the same large 111kWh

  battery pack as the Dual Motor, providing an impressive 706km WLTP range.


  This variant prioritises range and efficiency over outright performance, making
  it ideal

  for long-distance commuters. Despite being single-motor, it still offers 299hp and

  reaches 100 km/h in 7.8 seconds. Available with passive or optional dynamic suspension.

  '
