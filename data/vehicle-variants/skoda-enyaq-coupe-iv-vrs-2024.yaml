  notes: |
    Enyaq Coupé iV vRS launched alongside standard Coupé in January 2022. First performance vRS model 
    in Škoda's electric lineup. 2024 facelift brings significant software improvements (ME3 vs ME2). 
    Dual-motor AWD with rear-biased torque distribution (140kW rear, 80kW front). Sport suspension 
    lowers ride height by 15mm for improved handling. 0-100 km/h in 6.5 seconds makes it fastest Škoda EV. 
    Exceptional value: €17,000 cheaper than Audi SQ4 Sportback e-tron (€58,990 vs €76,990) while 
    offering comparable performance (6.5s vs 6.3s 0-100 km/h). Significantly more equipment standard 
    than non-vRS variants. Red ambient lighting and vRS-specific UI themes. Fixed glass roof standard 
    (panoramic not available). Shares dual-motor AWD setup with VW ID.5 GTX and Enyaq iV 80x.
