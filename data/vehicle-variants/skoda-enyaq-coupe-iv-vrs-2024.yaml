description: |
  The Škoda Enyaq Coupé iV vRS is the performance flagship of the Enyaq lineup, combining 220kW (299hp) 
  dual-motor AWD with the coupé's sporty styling and improved aerodynamics (Cd 0.26). The vRS delivers 
  thrilling performance with 0-100 km/h in just 6.5 seconds while maintaining impressive range of 528km WLTP.
  
  The vRS features distinctive styling elements including 20" or 21" wheels, sport suspension (-15mm lower), 
  gloss black exterior accents, LED Matrix headlights standard, and unique vRS interior trim with sport seats. 
  Despite its performance focus, it remains practical with 570L boot capacity and identical interior space 
  to standard Coupé.
  
  The 2024 facelift brought updated styling, improved Infotainment ME3 software with ChatGPT-powered Laura 
  assistant, and enhanced efficiency. Positioned as exceptional value vs German competitors: significantly 
  cheaper than Audi SQ4 Sportback e-tron (€17,000 less) while offering comparable performance.

