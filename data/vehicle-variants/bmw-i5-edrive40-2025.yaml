notes: >
  The 2025 BMW i5 eDrive40 continues with the G60 platform and receives
  incremental software updates. WLTP range improves slightly to 585 km
  through battery management optimization. The 400V architecture with
  205 kW DC charging remains unchanged. The i5 eDrive40 continues to be
  a strong company car choice in Germany with the 0.25% BEV tax benefit,
  competing with Mercedes EQE 350+ and Tesla Model S. Real-world range
  in mixed conditions approaches 500 km.

