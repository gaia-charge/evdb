notes: >
  The Ioniq 5 Long Range AWD is the most popular variant, offering excellent balance
  of performance, range, and features. The 800V architecture enables industry-leading
  charging speeds (10-80% in 18 minutes at 350kW stations). The E-GMP platform's
  3-meter wheelbase provides exceptional interior space and flat floor. V2L capability
  allows powering external devices (camping equipment, tools, etc.) up to 3.6kW.
  Real-world efficiency is excellent for an AWD crossover. The 2024 facelift improved
  battery capacity and software features.

