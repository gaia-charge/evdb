  notes: "Most popular Megane E-Tech variant with 60 kWh battery and 160kW motor. Offers excellent balance of range (468km WLTP), performance (7.4s 0-100), and efficiency (15.4 kWh/100km). Winner of European Car of the Year 2023. Advanced OpenR system with Google integration. Lightweight CMF-EV platform delivers agile handling. Available in Techno, Iconic, and Esprit Alpine trims. Perfect for daily driving with 400km real-world range."
