  notes: |
    The BMW iX xDrive40 is the base variant and volume seller of the iX lineup,
    offering excellent value with 425 km WLTP range and 240 kW dual-motor AWD.
    
    Compared to xDrive50:
    - €20,000+ cheaper (€87,300 vs ~€110,000)
    - Smaller 71 kWh battery vs 105.2 kWh (-33%)
    - Lower range: 425 km vs 630 km (-205 km, -33%)
    - Less power: 240 kW vs 385 kW (-145 kW, -38%)
    - Slightly slower: 6.1s vs 4.6s 0-100 (+1.5s)
    - Lower DC charging: 150 kW vs 200 kW (-50 kW)
    - Lighter: 2,365 kg vs 2,565 kg (-200 kg)
    
    The xDrive40 represents approximately 70% of iX sales in Germany due to
    better value proposition and still-excellent 425 km range for daily use.
    
    Base price positions it competitively against:
    - Mercedes-Benz EQE 350+ (€72,900) - EQE is sedan, iX is SUV
    - Audi Q8 e-tron 55 quattro (€82,800) - Similar price, iX has better tech
    - Tesla Model X (€98,990) - iX is €11,690 cheaper, better build quality
