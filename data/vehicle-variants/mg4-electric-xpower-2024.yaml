  notes: |
    Hot hatch with supercar-rivaling 435hp and 3.8s 0-100 km/h at €42,490.
    Dual-motor AWD provides exceptional traction and handling in all conditions.
    Perfect 50:50 weight distribution enhances cornering balance.
    Sport-tuned suspension lowered 40mm with stiffer springs/dampers.
    Larger brakes (345mm front, 325mm rear ventilated discs) for better stopping power.
    Alcantara sport seats with orange stitching distinguish from standard models.
    144kW DC fast charging slightly faster than Extended Range (135kW).
    Range reduced to 385km WLTP due to higher power consumption.
    Exceptional value - similar performance to cars costing 2-3x more.
    Challenges Cupra Born VZ at similar price but with more power (435hp vs 326hp).
    Real-world track testing shows impressive cornering and stability.
    Limited slip differential improves power delivery in corners.
    Target buyers: enthusiasts seeking affordable performance EV.
