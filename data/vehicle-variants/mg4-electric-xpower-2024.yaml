  notes: |
    MG4 XPower is the performance flagship with dual-motor AWD.
    435hp / 600Nm makes it one of the fastest hot hatches under €50k.
    0-100 km/h in 3.8s rivals cars costing twice as much.
    Enhanced cooling system for sustained performance driving.
    Sport-tuned suspension lowered 10mm, stiffer than standard.
    Orange brake calipers, sport seats with orange stitching.
    Track Mode optimizes power delivery and regen for circuit use.
    Real competitor to Cupra Born VZ and entry-level BMW i4.
    Range reduced vs Extended Range due to power consumption.
    Still excellent value - similar performance to €70k+ EVs.
