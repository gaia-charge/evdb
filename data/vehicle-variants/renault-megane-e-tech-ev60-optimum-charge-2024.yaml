notes: |
  The EV60 Optimum Charge variant features the larger 60kWh battery with
  enhanced 130kW DC fast charging capability. This is the most popular
  variant offering excellent range for daily use and road trips.
  
  The "Optimum Charge" package enables the full 130kW DC charging speed
  (base EV60 is limited to 85kW). It also includes improved thermal
  management for better charging performance in all weather conditions.
  
  Notable for having bidirectional charging (V2L/V2H/V2G) capability,
  allowing the vehicle to power external devices or even feed energy
  back to your home or the grid.
  
  Efficient aerodynamics (Cd 0.30) and relatively light weight (1636kg)
  contribute to excellent real-world efficiency of 17.3 kWh/100km.

