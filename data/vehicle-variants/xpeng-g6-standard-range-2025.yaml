overview: 'The XPENG G6 Standard Range is the entry-level variant of the 2025 facelift
  G6 lineup. Powered by a single rear-mounted permanent magnet synchronous motor producing
  185kW (252 PS) and 440 Nm of torque, it offers a good balance of performance and
  efficiency. The 68.5kWh LFP battery provides 455km WLTP range with a consumption
  of just 17.3 kWh/100km. Despite being the base model, it features 800V architecture
  supporting DC fast charging up to 382kW for rapid top-ups. Standard equipment includes
  leather seats, heat pump, LED matrix headlights, and a comprehensive ADAS suite.

  '
