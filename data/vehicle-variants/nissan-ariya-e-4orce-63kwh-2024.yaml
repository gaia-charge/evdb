notes: 'The Nissan Ariya e-4ORCE 63 kWh combines Nissan''s all-wheel drive system

  with the more affordable 63 kWh battery option. With 292 hp and electronic

  torque vectoring, it offers significantly better performance and traction

  than the FWD variant while maintaining reasonable efficiency. The e-4ORCE

  name references Nissan''s legendary GT-R ATTESA E-TS AWD system. Perfect

  for buyers who want AWD capability without the premium cost of the 87 kWh

  battery. Competes with VW ID.4 GTX, Ioniq 5 AWD, and Kia EV6 AWD.

