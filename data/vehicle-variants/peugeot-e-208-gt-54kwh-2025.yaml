notes: |
  The 2025 Peugeot e-208 GT is the top-specification variant with all premium features:
  
  **Key 2025 GT Updates:**
  - Battery: 51kWh → 54kWh (+5.9%)
  - Motor: 100kW/136hp → 115kW/156hp (+15%)
  - Range: 400km → 410km WLTP (slightly less than Allure due to 17" wheels)
  - Heat pump now STANDARD on GT (was optional on 2024 GT)
  - Heated steering wheel standard
  
  **GT-Exclusive Features:**
  - Matrix LED headlights
  - Alcantara sport seats with electric adjustment
  - Focal premium audio system
  - Drive Assist Plus with Highway Assist
  - 17" diamond-cut alloy wheels
  - GT body kit with specific bumpers
  - Ambient interior lighting
  - Panoramic glass roof (option)
  - Two-tone black roof option
  
  **vs Allure Trim:**
  - ~€3,500-4,000 premium over Allure
  - Heat pump standard (saves €750 option cost)
  - Sportier look with 17" wheels and body kit
  - Better equipped cabin (Alcantara, electric seats, Focal audio)
  - 10km less WLTP range due to larger wheels
