notes: "BMW's entry-level electric SUV (most affordable BMW EV). Dual-motor AWD standard (no RWD variant available). Built on FAAR platform (shared with gasoline/diesel X1). 400V architecture limits DC charging to 130kW. Heat pump standard on 2024+ models (was option in 2023). Competitive charging speed for compact SUV segment. Excellent city range (545km WLTP) for urban use. Popular in Germany as premium compact electric SUV. Competes with Audi Q4 40 e-tron, Mercedes EQA 350, Volvo XC40 Recharge. Real-world 370km range adequate for daily commuting. 0-100 in 5.7s competitive for segment (faster than Q4 40, EQA 250+). 1,200kg towing capacity adequate for small trailers. Digital Key Plus with UWB enables hands-free unlocking. BMW IconicSounds Electric by Hans Zimmer creates immersive driving experience."

