# Notes
notes: >
  BYD Seal U Design is the premium trim of BYD's compact electric SUV for Europe.
  With an 87 kWh LFP Blade Battery, it offers class-leading 620 km WLTP range,
  making it one of the longest-range electric SUVs in this price segment. The
  Design trim adds ventilated front seats, head-up display, Harman Kardon premium
  audio, and 19" wheels over the Comfort trim.

  Despite the larger battery, the Seal U Design maintains FWD configuration for
  optimal efficiency (16.3 kWh/100km WLTP). Weight increases by ~120 kg over the
  Comfort trim due to the larger battery pack. DC charging remains at 140 kW peak,
  with 10-80% taking approximately 35 minutes (vs 28 min for the smaller battery).

  The 620 km WLTP range makes it directly competitive with the VW ID.7 Pro S
  (700 km) and Tesla Model Y Long Range (600 km), but at a significantly lower
  price point. Real-world range of ~520 km mixed driving is exceptional for
  family use and longer trips.

  LFP Blade Battery chemistry allows worry-free daily 100% charging with minimal
  degradation. Combined with the heat pump and 11 kW 3-phase AC charging, the
  Seal U Design is well-suited for both daily commuting and weekend adventures.

