id: mercedes-benz-eqe-suv-350-plus-2024
name: Mercedes-Benz EQE SUV 350+ (2024)
model_id: mercedes-benz-eqe-suv
model_year: 2024
variant_name: "350+"
trim_level: base

battery:
  usable_kwh: 90.6
  total_kwh: 96.0
  chemistry: NCM
  cells_config: "288s2p (576 cells)"
  supplier: CATL
  form_factor: pouch
  warranty_years: 10
  warranty_km: 250000
  warranty_capacity_percent: 70
  notes: >
    Large 90.6kWh usable capacity provides excellent range. NCM (Nickel Cobalt 
    Manganese) chemistry from CATL. Liquid thermal management with heat pump. 
    Battery preconditioning available for optimal DC fast charging performance.

range:
  wltp_km: 590
  wltp_city_km: 760
  wltp_highway_km: 485
  epa_km: null
  epa_miles: null
  real_world_km: 510
  notes: >
    WLTP range of 590km is excellent for a mid-size luxury SUV. Real-world 
    range around 510km in mixed driving. Highway range reduced compared to 
    sedan due to higher profile and weight. Winter range approximately 390-420km.

charging:
  ac:
    max_power_kw: 11
    plug_type: Type2
    phases: 3
    charge_time_0_100_hours: 9.0
    notes: >
      Standard 11kW AC charging (3-phase, 16A). Optional 22kW onboard charger 
      available but rarely utilized due to limited 22kW charging infrastructure. 
      Mercedes me Charge provides access to 600,000+ charging points globally.
      
  dc:
    max_power_kw: 170
    plug_type: CCS2
    charge_time_10_80_percent_minutes: 32
    charge_curve:
      - soc_percent: 10
        power_kw: 170
      - soc_percent: 20
        power_kw: 170
      - soc_percent: 30
        power_kw: 165
      - soc_percent: 40
        power_kw: 150
      - soc_percent: 50
        power_kw: 135
      - soc_percent: 60
        power_kw: 115
      - soc_percent: 70
        power_kw: 90
      - soc_percent: 80
        power_kw: 65
    notes: >
      Peak DC fast charging at 170kW. 400V architecture with battery 
      preconditioning. Typical 10-80% charge takes 32 minutes. Mercedes me 
      Charge app integrates with IONITY and other high-power charging networks.

bidirectional:
  v2l: false
  v2h: false
  v2g: false
  notes: >
    Bidirectional charging not currently available but Mercedes-Benz has 
    announced it will come to future models/updates.

motors:
  count: 1
  type: permanent_magnet
  layout: rear
  total_power_kw: 215
  total_power_hp: 292
  total_torque_nm: 565
  drive_type: RWD
  notes: >
    Single permanent magnet synchronous motor (PSM) on rear axle. Excellent 
    efficiency and smooth power delivery. Most efficient variant in the EQE SUV 
    lineup.

performance:
  acceleration_0_100_kmh_seconds: 6.6
  top_speed_kmh: 210
  notes: >
    Rear-wheel drive provides balanced handling. Optional rear-axle steering 
    (up to 10 degrees) dramatically improves maneuverability and reduces turning 
    circle to 10.5m. Standard AIRMATIC air suspension with adaptive damping.

efficiency:
  wltp_kwh_per_100km: 19.4
  real_world_kwh_per_100km: 21.8
  energy_label_eu: B
  notes: >
    Good efficiency for a luxury SUV thanks to Cd 0.26 aerodynamics and 
    efficient single-motor powertrain. Real-world consumption around 21.8 
    kWh/100km in mixed driving.

weight:
  curb_weight_kg: 2505
  gross_vehicle_weight_kg: 3055
  payload_kg: 550
  towing_capacity_braked_kg: 1800
  towing_capacity_unbraked_kg: 750

adas:
  level: 2_plus
  features:
    - Adaptive Cruise Control (DISTRONIC)
    - Active Lane Keeping Assist
    - Active Blind Spot Assist
    - Active Brake Assist
    - Traffic Sign Assist
    - Active Distance Assist DISTRONIC
    - Active Steering Assist
    - Active Emergency Stop Assist
  notes: >
    Level 2+ driver assistance standard. Optional DRIVE PILOT (Level 3) 
    available in Germany for hands-free highway driving up to 60 km/h in traffic. 
    360-degree camera and parking assist standard.

features:
  standard:
    - AIRMATIC air suspension
    - Rear-axle steering (optional, up to 10°)
    - Burmester 3D Surround Sound (optional)
    - Ambient lighting with 64 colors
    - Keyless entry and start
    - Dual-zone automatic climate control
    - Heat pump
    - LED Intelligent Light System
    - 12.8" OLED touchscreen
    - Wireless smartphone charging
    - 360-degree camera
    - Power tailgate
  optional:
    - MBUX Hyperscreen (56" curved glass display)
    - Burmester High-End 4D Surround Sound
    - AMG Line exterior/interior
    - Panoramic sliding sunroof
    - Executive rear seat package
    - DRIVE PILOT (Level 3 autonomy, Germany only)
    - 22kW AC onboard charger
    - Trailer hitch (1800kg towing)

environmental:
  lifecycle_co2_kg: null
  production_location: "Tuscaloosa, Alabama, USA"
  battery_production: "Kamenz, Germany (Mercedes-Benz subsidiary Accumotive)"
  notes: >
    Built at Mercedes-Benz Tuscaloosa plant in Alabama, USA. Batteries produced 
    at Mercedes-Benz subsidiary Accumotive in Kamenz, Germany. Mercedes-Benz 
    aims for carbon-neutral production.

