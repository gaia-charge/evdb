id: genesis-electrified-g80-awd-2024
name: "Electrified G80 AWD"
model_id: genesis-electrified-g80
model_year: 2024
trim_level: Luxury

description: |
  Genesis Electrified G80 AWD is the brand's flagship electric luxury sedan, offering
  traditional executive sedan proportions and presence with dual-motor electric powertrain.
  87.2 kWh battery delivers practical 520 km WLTP range suitable for long-distance business
  travel. Dual-motor AWD system produces 272 kW (370 hp) for refined yet spirited 4.9-second
  0-100 km/h acceleration. Comprehensive standard equipment includes Lexicon 21-speaker
  premium audio, Nappa leather quilted seats with heating/ventilation/massage, multi-chamber
  air suspension, Highway Driving Assist 2, Face Connect biometric authentication, and
  dual 12.3-inch panoramic displays. Positioned as premium electric alternative to Mercedes
  EQE and BMW i5 with excellent value proposition at €84,000 base price.

