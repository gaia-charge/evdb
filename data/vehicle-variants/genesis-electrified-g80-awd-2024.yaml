notes: |
  Genesis' flagship electric sedan with traditional executive proportions.
  Based on adapted combustion G80 platform (400V, not 800V E-GMP).
  Slower DC charging (175kW vs 235kW GV60) but adequate for executive sedan use.
  Spacious rear legroom (1010mm) ideal for chauffeur-driven buyers.
  Comprehensive standard equipment at €84,000 base price.
  5-year/100,000 km warranty plus 8-year/160,000 km battery warranty.
  Real-world range: 440 km mixed, 350 km winter.
  Excellent company car choice with 0.5% tax rate (over €70k).
  Face Connect biometric authentication personalizes settings.
  Multi-chamber air suspension delivers executive sedan ride quality.

