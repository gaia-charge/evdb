description: |
  The 2026 Porsche Taycan Turbo GT is the ultimate expression of electric
  performance from Porsche. With 760 kW (1,034 hp) overboost power via Launch
  Control, it accelerates from 0-100 km/h in just 2.3 seconds and reaches a
  top speed of 290 km/h — making it one of the fastest production cars ever
  built. The Turbo GT holds multiple Nürburgring lap records for electric
  production vehicles.

  For 2026, the Turbo GT features the upgraded 105 kWh Performance Battery Plus,
  320 kW peak DC charging, PCM 6.0 with curved 16.8-inch display, and refined
  aerodynamics. Standard equipment includes PDCC Sport active anti-roll bars,
  rear-axle steering, carbon fiber exterior elements, and track-focused
  suspension tuning. Available in sedan form only (no Sport Turismo variant).

