notes: 'The Fiat 600e La Prima is the premium launch edition, fully equipped

  with matrix LED headlights, Level 2 ADAS, and distinctive Italian styling.


  Key highlights:

  - 54 kWh battery, 409 km WLTP range

  - 156 hp/260 Nm, 0-100 in 9.0s

  - 100 kW DC fast charging (10-80% in 28 min)

  - Matrix LED headlights (unique in segment at this price)

  - Premium equipment level


  Real-world performance:

  - City range: ~470 km (excellent efficiency in urban use)

  - Highway range: ~310 km (at 120 km/h)

  - Mixed range: ~350 km

  - Consumption: 15.3 kWh/100km real-world average


  Value proposition:

  - Competitive pricing around €42,000

  - Distinctive Italian design

  - Matrix LED headlights rare at this price point

  - Well-equipped with Level 2 ADAS

  - 5-star Euro NCAP safety (86% adult protection)


  La Prima exclusive features vs (RED):

  - Matrix LED headlights (vs standard LED)

  - 360-degree camera (vs rear camera only)

  - Wireless smartphone charging

  - Heated front seats

  - Ambient lighting

  - 18" wheels standard


  Target audience: Style-conscious buyers looking for a distinctive,

  well-equipped compact electric crossover with Italian flair. Perfect

  for urban and suburban use with occasional longer trips.


  Competition: Jeep Avenger, Alfa Romeo Junior, Peugeot e-2008, Opel Mokka-e,

  Hyundai Kona Electric, MG ZS EV.

