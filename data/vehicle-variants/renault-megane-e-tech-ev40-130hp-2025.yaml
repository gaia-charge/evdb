  notes: "Entry-level Megane E-Tech variant with 40 kWh battery and 96kW motor. More affordable option for urban drivers who don't need long range. Still offers the same advanced OpenR system, European Car of the Year-winning design, and modern features. 300km WLTP range is sufficient for daily commuting and city use. Lighter weight (131kg less than EV60) provides nimble handling. Good choice for cost-conscious buyers with shorter daily routes."
