notes: >
  The Mercedes-Benz GLC 450 4MATIC Electric is the performance variant of the all-electric GLC,
  featuring 300kW (408hp) dual motors with 800Nm torque for a 4.5s 0-100 km/h sprint.
  Built on the EA-M platform with 800V architecture, it achieves 330kW peak DC charging
  (10-80% in just 22 minutes). With 615km WLTP range from the 100kWh battery, it competes
  directly with the BMW iX xDrive50 and Audi Q6 e-tron performance. The 450 variant adds
  adaptive AIRMATIC suspension, Burmester audio, DIGITAL LIGHT headlights, massage seats,
  and enhanced ADAS features including DRIVE PILOT readiness. V2L and V2H bidirectional
  charging capabilities are included.

