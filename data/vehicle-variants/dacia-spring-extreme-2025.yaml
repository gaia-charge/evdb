  notes: |
    2025 facelift Dacia Spring Extreme - top trim. Updated design language,
    improved interior, LED headlights standard. Same 26.8 kWh LFP battery.
    Extreme adds: 65hp motor (vs 45hp on base), automatic climate control,
    cruise control, rear camera, 15-inch alloys, leather steering wheel.
    Remains Europe's most affordable electric car in the sub-€25k segment.
    LFP chemistry allows daily 100% charging without degradation concerns.
