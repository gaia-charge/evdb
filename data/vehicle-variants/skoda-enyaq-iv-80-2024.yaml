description: "The Škoda Enyaq iV 80 is the most popular variant in the lineup, offering\
  \ the largest 82kWh battery \nfor excellent range (up to 570km WLTP) combined with\
  \ competitive pricing. The 2024 facelift brought \nupdated exterior styling, improved\
  \ Infotainment ME3 software with ChatGPT-powered Laura assistant, \nand slightly\
  \ enhanced efficiency.\n\nThis RWD variant prioritizes efficiency and range over\
  \ performance, making it ideal for families \nand long-distance travel. It offers\
  \ class-leading interior space (best-in-class rear legroom), \na huge 585L boot,\
  \ and Škoda's signature \"Simply Clever\" practical features.\n\nThe iV 80 competes\
  \ directly with VW ID.4 Pro and Audi Q4 e-tron 50, but typically costs €3,000-5,000\
  \ \nless while offering similar or better equipment levels and more space.\n"
