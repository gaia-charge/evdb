version_name: "2024 Facelift"

description: |
  The Škoda Enyaq iV 80 is the most popular variant in the lineup, offering the largest 82kWh battery 
  for excellent range (up to 570km WLTP) combined with competitive pricing. The 2024 facelift brought 
  updated exterior styling, improved Infotainment ME3 software with ChatGPT-powered Laura assistant, 
  and slightly enhanced efficiency.
  
  This RWD variant prioritizes efficiency and range over performance, making it ideal for families 
  and long-distance travel. It offers class-leading interior space (best-in-class rear legroom), 
  a huge 585L boot, and Škoda's signature "Simply Clever" practical features.
  
  The iV 80 competes directly with VW ID.4 Pro and Audi Q4 e-tron 50, but typically costs €3,000-5,000 
  less while offering similar or better equipment levels and more space.

