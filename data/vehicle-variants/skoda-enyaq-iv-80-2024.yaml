  notes: |
    2024 facelift brings significant software improvements (ME3 vs ME2). 135kW DC charging is upgrade from 125kW in 2023 models.
    Range improved from 558km to 570km WLTP (2% efficiency gain). More physical buttons vs full-touch (response to customer feedback).
    Laura AI assistant powered by ChatGPT (industry-first integration). Shares APP310 motor and 82kWh battery with VW ID.4 Pro.
    Typically €3,000-5,000 cheaper than equivalent VW ID.4 Pro. Class-leading rear legroom (more than VW ID.4).
    Best-in-class boot: 585L (ID.4: 543L, Model Y: 854L but less rear legroom).
