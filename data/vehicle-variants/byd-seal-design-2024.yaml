# Market & Pricing Notes
notes: >
  The BYD Seal Design represents the entry point into BYD's premium sedan lineup,
  offering impressive performance (5.9s 0-100 km/h) and long range (570 km WLTP)
  at a competitive price point. The rear-wheel-drive layout provides sporty handling
  characteristics while maintaining excellent efficiency. The 0.219 drag coefficient
  is one of the best in its class, contributing to the impressive real-world range.
  Standard equipment is comprehensive, including features often optional on competitors.
  The Blade Battery's LFP chemistry means long-term reliability with minimal
  degradation over 3000+ charge cycles. V2L capability enables outdoor activities
  and emergency power supply.

