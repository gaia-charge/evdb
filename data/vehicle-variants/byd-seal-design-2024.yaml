  notes: >
    BYD Blade Battery uses LFP chemistry in long blade-shaped cells integrated
    directly into the chassis. This design provides exceptional safety (passes
    nail penetration test), excellent thermal stability, and long cycle life
    (3000+ cycles). The Seal's larger 82.5 kWh pack enables impressive range
    while maintaining the safety and longevity benefits of LFP chemistry.

