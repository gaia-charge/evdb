notes: 'The Hyundai IONIQ 6 84 kWh RWD 2026 is the updated Long Range rear-wheel-drive
  variant with a larger 84 kWh battery (80 kWh usable), up from 77.4 kWh in the 2025
  model. This increases WLTP range to 680 km (from 614 km), making it one of the most
  efficient EVs on the market at just 13.5 kWh/100km WLTP. The streamliner design
  with its ultra-low 0.21 Cd drag coefficient continues to deliver exceptional aerodynamic
  efficiency. Fast charging via the 800V architecture reaches 263 kW peak, with 10-80%
  in 17 minutes.

