version_name: "2025 Refresh"

description: |
  The 2025 Škoda Enyaq 85 is the refreshed version of Škoda's best-selling electric SUV, now dropping the "iV" 
  suffix. The 85 variant features the larger 82kWh battery with 286ps rear motor, offering up to 571km WLTP range. 
  The 2025 model brings the new Modern Solid design language with Tech-Deck-Face front, updated LED light signature 
  with vertical light grille connecting the upper headlight units, and refined interior with improved materials.
  
  Key updates include optimized aerodynamics, refined suspension tuning for improved comfort, and continued 
  ME3 infotainment system improvements. The Enyaq remains one of the best-value electric SUVs in Europe, 
  consistently undercutting the VW ID.4 while offering more interior space and equipment.

