overview: 'The Hongqi EH7 111 kWh Long Range is the flagship variant of Hongqi''s
  first European model. With a massive 111 kWh battery (95.3 kWh usable) and an ultra-low
  drag coefficient of 0.205, it achieves an impressive 655 km WLTP range. The single
  rear motor produces 253 kW (344 PS) and 450 Nm of torque. The car features a premium
  interior with a large center display, heads-up display, and comprehensive standard
  equipment.

  '
