notes: >
  The Lotus Emeya base variant offers 450 kW (612 hp) combined from dual permanent magnet motors,
  achieving 0-100 km/h in 4.15 seconds. With a remarkable 0.21 drag coefficient and 102 kWh usable
  battery, it delivers 610 km WLTP range. Features include 800V architecture supporting 350 kW DC
  charging (10-80% in 18 minutes), air suspension, torque vectoring, and a luxurious 4-seat interior
  with individual sport seats. The Emeya represents Lotus's first electric grand tourer, combining
  performance, efficiency, and luxury.
