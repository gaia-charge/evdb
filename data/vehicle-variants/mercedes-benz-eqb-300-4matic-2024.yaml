  notes: 'Mercedes-Benz EQB 300 4MATIC is the AWD mid-range variant.

    Offers 4MATIC all-wheel drive for better traction and handling.


    Key features:

    - 4MATIC all-wheel drive (dual motors)

    - 168kW (228hp) combined power

    - Optional third row seats (7-seater)

    - Good for winter/slippery conditions


    Compared to 250+ FWD:

    - +€4,000 price premium

    - -51km range (423 vs 474km WLTP)

    - +28kW power (168 vs 140kW)

    - +85kg weight (2260 vs 2175kg)

    - Better 0-100: 8.0s vs 9.0s


    Competes with:

    - Tesla Model Y Long Range AWD (better performance/range)

    - BMW iX1 xDrive30 (similar specs, 5-seat only)

    - Audi Q4 e-tron quattro (better value, 5-seat)


    Strengths:

    - 4MATIC all-wheel drive

    - Good winter traction

    - Only premium 7-seat compact AWD EV

    - Mercedes brand prestige


    Weaknesses:

    - Higher consumption than FWD (18.4 vs 16.8 kWh/100km)

    - Shorter range than FWD

    - 100kW DC charging still modest

    - Premium price

    '
