notes: 'Long Range AWD - Most popular Model Y variant (balanced range, performance,
  price).

  2025 model year with improved efficiency and range (565 km WLTP).

  79 kWh usable battery (NCA chemistry) - excellent range for road trips.

  Dual motor AWD: 370 kW combined (496 hp) - 5.0s 0-100 km/h.

  250 kW DC fast charging (V3 Supercharger) - 27 min 10-80%, best in class.

  565 km WLTP range adequate for long-distance travel without range anxiety.

  490 km real-world range (87% of WLTP) - excellent efficiency.

  AWD provides better traction in winter and spirited driving.

  Made at Gigafactory Berlin (Europe), Austin (Americas), Shanghai (Asia).

  Access to 50,000+ Tesla Superchargers globally (1,600+ in Germany).

  Optional 7-seater: €3,000 (third row for kids).

  Optional tow hitch: €1,000 (1,600kg capacity).

  Premium audio system, heated seats front/rear, HEPA air filtration.

  Over-the-air updates continuously improve vehicle features.

