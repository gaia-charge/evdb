name: Single Motor
variant_name: Single Motor
model_year: 2025
trim_level: Core
production_years: "2025-present"

overview: >
  The 2025 Volvo EX30 Single Motor is the entry-level variant with a smaller 51kWh LFP battery,
  offering up to 344km WLTP range at a lower price point. Using lithium iron phosphate (LFP) chemistry
  instead of NMC, this variant trades some range for better long-term battery durability and lower cost.
  The same 200kW rear motor delivers identical performance to the Extended Range variant (5.3s 0-100),
  making it an excellent value proposition for urban and suburban commuters who don't need maximum range.
  Now also built in Ghent, Belgium for the European market.

