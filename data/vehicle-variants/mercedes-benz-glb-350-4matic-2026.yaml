    5.5s 0-100 km/h and Offroad drive mode for light off-road capability.
    Slightly lower range (614 km vs 631 km WLTP) due to AWD drivetrain losses.
    Competes with BMW iX1 xDrive30, Volvo EX40 AWD, and Tesla Model Y AWD.

