description: 'The 2025 Škoda Enyaq Coupé vRS is the performance flagship of the Coupé
  range, combining the sportier

  sloping roofline with dual-motor AWD performance. 220kW (299ps) system output, 0-100
  in 6.4 seconds

  (slightly quicker than SUV vRS thanks to lower drag), and 544km WLTP range.


  Features all vRS-specific design elements plus the Coupé''s improved aerodynamics
  (Cd 0.26).

  The most dynamic Enyaq variant, positioned as Škoda''s answer to the VW ID.5 GTX.

  '
