notes: 'The OMODA E5 is Chery''s first BEV for the European market, offering strong
  value in the compact SUV segment. With 430 km WLTP range from a 61 kWh LFP battery,
  it provides adequate range for most daily use cases.

  Pricing is aggressive, targeting a lower entry point than VW ID.4 and Hyundai Kona
  Electric while offering generous standard equipment (panoramic sunroof, 360° camera,
  wireless CarPlay/Android Auto, heat pump).

  LFP battery chemistry allows worry-free charging to 100% without degradation concerns.
  120kW DC fast charging is adequate for occasional long trips. V2L capability adds
  practical value for outdoor activities.

  The E5 competes directly with MG ZS EV, BYD Atto 3, and Kia Niro EV on value proposition.
  Chery''s 25+ years of automotive manufacturing experience and global export record
  provide some reassurance on build quality.

  '
