notes: |
  The 2026 ID.7 Pro S receives mid-cycle updates including ID. Software 5.0
  with ChatGPT voice integration, Vehicle-to-Load capability (V2L), improved
  charging curve management (now 200 kW peak), and enhanced Travel Assist 2.0.
  With 86 kWh usable battery and exceptional aerodynamics (Cd 0.23), it achieves
  an impressive 709 km WLTP range - the longest of any Volkswagen electric vehicle
  and among the best of any electric sedan. The Pro S is the flagship ID.7 variant,
  featuring 286 hp RWD powertrain, DCC adaptive dampers, premium interior with
  15" touchscreen, and optional AR head-up display. Built on MEB platform at VW's
  Emden factory. Perfect for business users and long-distance drivers who need
  maximum range without compromising on efficiency or technology.

