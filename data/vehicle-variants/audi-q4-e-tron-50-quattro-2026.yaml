  notes: |
    2026 model year brings improved battery capacity (85kWh total, 82kWh usable) and 
    enhanced DC charging performance up to 170kW. The Q4 50 e-tron quattro fills the gap
    between the Q4 40 (RWD) and Q4 45 quattro variants with optimized balance of 
    performance, range, and efficiency.
    
    Matrix LED headlights now standard on 50 quattro trim. Improved heat pump system
    provides better winter range retention. Enhanced MMI system with AI-powered 
    voice assistant and improved route planning.
    
    Popular choice for families and company car drivers seeking premium AWD electric SUV
    with excellent space, quality, and Audi brand prestige.
