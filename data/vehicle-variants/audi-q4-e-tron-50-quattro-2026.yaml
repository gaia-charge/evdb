  notes: "2026 model year brings improved battery capacity (85kWh total, 82kWh usable)\
    \ and \nenhanced DC charging performance up to 170kW. The Q4 50 e-tron quattro\
    \ fills the gap\nbetween the Q4 40 (RWD) and Q4 45 quattro variants with optimized\
    \ balance of \nperformance, range, and efficiency.\n\nMatrix LED headlights now\
    \ standard on 50 quattro trim. Improved heat pump system\nprovides better winter\
    \ range retention. Enhanced MMI system with AI-powered \nvoice assistant and improved\
    \ route planning.\n\nPopular choice for families and company car drivers seeking\
    \ premium AWD electric SUV\nwith excellent space, quality, and Audi brand prestige.\n"
