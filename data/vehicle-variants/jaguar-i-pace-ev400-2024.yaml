notes: |
  Jaguar's pioneering premium electric SUV with 2019 World Car of the Year award.
  Dual-motor AWD delivers sports car performance (4.8s 0-100 km/h) with intelligent
  torque vectoring. Real-world range ~390 km adequate for daily use. DC charging
  limited to 104 kW (slower than newer 800V rivals) but adequate for road trips.
  Available in S/SE/HSE trims with mechanical specs identical. Competes with Audi
  e-tron, BMW iX, Mercedes EQC (discontinued), and Tesla Model Y.
