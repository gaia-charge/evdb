notes: 'The Opel Frontera Electric 44 kWh is the standard-range version of Opel''s

  affordable electric SUV. Built on Stellantis'' Smart Car platform (shared with

  Citroën ë-C3 Aircross and Fiat Grande Panda), it offers a spacious, practical

  interior with up to 1,600 litres of cargo space. The boxy design maximizes

  usable interior volume. Available in two trims: Frontera (base) and Frontera GS.

  Priced from around €29,000 in Germany, it''s one of the most affordable

  electric SUVs in Europe. A long-range version with larger battery and ~400 km

  WLTP range is also available.

  '
