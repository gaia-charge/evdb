notes: 'The Ioniq 5 Long Range AWD 2026 represents the most popular and well-rounded
  variant in the lineup. The 2026 model year brings significant improvements including
  increased battery capacity (77.0 kWh usable vs 72.6 kWh in 2024), slightly improved
  charging speeds, and enhanced thermal management for better year-round performance.
  The 800V architecture continues to deliver industry-leading charging times (10-80%
  in 17 minutes at 350kW stations). Real-world efficiency remains excellent for an
  AWD crossover, and the expanded range of nearly 500 km WLTP makes long-distance
  travel stress-free. The E-GMP platform''s 3-meter wheelbase provides exceptional
  interior space with a flat floor. V2L capability (3.6kW) enables powering external
  devices for camping or emergency backup. The 2026 model also features refined software
  with improved user experience and additional connected car features.

