  notes: '2024 Kia EV6 GT is the high-performance flagship variant with: - 576 hp
    (430 kW) combined power - 77% more power than Long Range AWD - 3.5-second 0-100
    km/h acceleration - one of the quickest EVs available - GT-specific suspension
    tuning with adaptive dampers - Larger GT brakes with neon green calipers (380mm
    front, 360mm rear) - 21-inch GT alloy wheels with performance tires - Launch Control
    and Drift Mode for track performance - Electronic Limited Slip Differential (e-LSD)
    for improved cornering - GT-specific styling with aggressive bumpers, diffuser,
    and spoiler - Carbon fiber interior trim and GT sport seats - Slightly reduced
    range (424 km WLTP) due to higher power and 21" wheels - Same revolutionary 800V
    architecture and 18-minute 10-80% charging - Positioned as a performance bargain
    vs Porsche Taycan, Tesla Model 3 Performance - 2024 updates: improved battery
    cooling, enhanced e-LSD tuning, updated Kia Connect

    '
