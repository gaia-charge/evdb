overview: 'The Leapmotor T03 is one of the most affordable BEVs in Europe at €18,900.
  Despite the low price, it comes comprehensively equipped with panoramic roof, 10.1-inch
  touchscreen, reversing camera, climate control, and full suite of driver assistance
  systems. Powered by a 37.3 kWh LFP battery providing 265 km WLTP range with a front-mounted
  70 kW (95 PS) motor. Produced at Stellantis'' plant in Tychy, Poland. Ideal as an
  affordable city car.

  '
