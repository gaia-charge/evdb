overview: >
  The XPENG G9 Long Range offers the best balance of range and value with a 93.1kWh LFP battery providing 585km WLTP range. The single rear PSM motor produces 258kW (351 PS) with 465 Nm torque. The 800V SiC architecture supports class-leading DC charging up to 525kW, enabling 10-80% in just 12 minutes. Compared to the Standard Range, it adds the larger battery for significantly more range while maintaining the same powertrain and features.

