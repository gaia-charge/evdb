notes: >
  The ID.7 Tourer Pro S is the long-range estate variant with 690 km WLTP range.
  Estate body adds practical 605L boot (1,714L with seats folded) while maintaining
  excellent range. Built alongside ID.7 sedan at VW Emden. 2026 model features
  refined software and improved charging curve. V2H capability announced but
  not yet available. Key competitor to BMW i5 Touring at significantly lower price.

