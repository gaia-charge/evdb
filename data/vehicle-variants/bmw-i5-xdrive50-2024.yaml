notes: 'The i5 xDrive50 is BMW''s premium AWD electric sedan variant, positioned between
  the efficient eDrive40 and the performance-focused M60. With 503 hp from dual synchronous
  motors, it delivers supercar-like 4.5s 0-100 km/h acceleration while maintaining
  respectable 516km WLTP range. BMW''s intelligent xDrive system dynamically distributes
  torque between front and rear axles for optimal traction and handling. The 400V
  architecture limits DC charging to ~205kW peak, but this is compensated by excellent
  highway range stability. Standard equipment is more comprehensive than eDrive40,
  including Driving Assistant Professional, M Sport steering wheel, adaptive M suspension,
  and 19\" M wheels. Popular in winter regions (Alps, Scandinavia) where AWD is essential
  but M60''s extreme performance isn''t needed. Qualifies for 0.5% company car tax
  rate in Germany (price over €70k threshold), still saves €4,812/year vs ICE equivalent
  540i xDrive. Competes with Mercedes-AMG EQE 43 4MATIC and Audi S6 e-tron (future).

  '
