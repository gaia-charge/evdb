  notes: "Subaru's first BEV, AWD-only (no FWD variant). Mechanical twin to Toyota bZ4X but with Subaru-specific tuning, unique StarDrive panoramic roof, enhanced X-MODE, and EyeSight safety. Only 6.6kW AC charging is limitation. 8-year/160,000km battery warranty (less generous than Toyota's 10yr unlimited). Excellent build quality, safety (5-star Euro NCAP), and all-weather capability. Competes with Toyota bZ4X, VW ID.4 AWD, Hyundai Ioniq 5 AWD."
