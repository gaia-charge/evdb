notes: |
  The Tesla Model S Plaid is one of the fastest production sedans in the world,
  featuring tri-motor AWD with torque vectoring. The tri-motor setup includes
  one front AC induction motor and two independent rear permanent magnet motors
  for precise power delivery. Carbon ceramic brakes are standard.
  
  Track Mode with drift mode is included. The Plaid features advanced thermal
  management with three radiators to sustain high-performance driving. 0-60 mph
  in 1.99 seconds (US EPA claim) makes it quicker than most supercars.
  
  Standard equipment includes upgraded seats with carbon fiber trim, premium
  audio, and all features from the dual-motor variant.

