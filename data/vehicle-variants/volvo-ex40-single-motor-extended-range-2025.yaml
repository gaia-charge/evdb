description: 'The 2025 Volvo EX40 Single Motor Extended Range features the larger
  78kWh battery pack,

  offering up to 515km WLTP range - the longest-range EX40 variant. The extended range

  battery adds approximately 40km over the standard 69kWh model while maintaining
  rear-wheel

  drive efficiency. The 2025 model year brings refined software, improved Google built-in

  integration, and continued availability of Volvo''s comprehensive safety suite.

