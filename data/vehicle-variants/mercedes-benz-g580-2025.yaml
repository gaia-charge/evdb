notes: "The 2025 Mercedes-Benz G 580 with EQ Technology is the electric version of\
  \ the iconic G-Class.\nLaunched in late 2024, the 2025 model year represents the\
  \ first full year of availability.\n\nKey specifications:\n- 116 kWh usable battery\
  \ capacity\n- 473 km WLTP range (real-world ~380 km)\n- 432 kW (587 hp) from 4 motors\
  \ (one per wheel)\n- 0-100 km/h in 4.7 seconds\n- 200 kW DC fast charging (10-80%\
  \ in 32 minutes)\n- 3,085 kg curb weight\n\nUnique features:\n- G-TURN: The vehicle\
  \ can rotate 360° on the spot by spinning wheels on opposite sides\n  in different\
  \ directions. This is possible because each wheel has its own motor.\n- 2-speed\
  \ transmission: Each axle has a 2-speed gearbox with Low Range for serious off-roading\n\
  - 850mm fording depth (150mm more than ICE G-Class)\n- Individual wheel torque vectoring\
  \ for superior off-road traction\n\nThe high energy consumption (~28 kWh/100km WLTP,\
  \ ~30.5 kWh real-world) is expected\ngiven the boxy shape (Cd 0.44) and 3+ tonne\
  \ weight. This is not an efficiency vehicle\nbut rather a luxury off-road icon that\
  \ happens to be electric.\n\nCompetes with:\n- No direct BEV competitor in the luxury\
  \ off-road segment\n- GMC Hummer EV (US only, even heavier)\n- Rivian R1S (different\
  \ character, lighter, more efficient)\n"
