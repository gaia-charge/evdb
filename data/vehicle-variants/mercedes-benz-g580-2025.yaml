notes: |
  The 2025 Mercedes-Benz G 580 with EQ Technology is the electric version of the iconic G-Class.
  Launched in late 2024, the 2025 model year represents the first full year of availability.
  
  Key specifications:
  - 116 kWh usable battery capacity
  - 473 km WLTP range (real-world ~380 km)
  - 432 kW (587 hp) from 4 motors (one per wheel)
  - 0-100 km/h in 4.7 seconds
  - 200 kW DC fast charging (10-80% in 32 minutes)
  - 3,085 kg curb weight
  
  Unique features:
  - G-TURN: The vehicle can rotate 360° on the spot by spinning wheels on opposite sides
    in different directions. This is possible because each wheel has its own motor.
  - 2-speed transmission: Each axle has a 2-speed gearbox with Low Range for serious off-roading
  - 850mm fording depth (150mm more than ICE G-Class)
  - Individual wheel torque vectoring for superior off-road traction
  
  The high energy consumption (~28 kWh/100km WLTP, ~30.5 kWh real-world) is expected
  given the boxy shape (Cd 0.44) and 3+ tonne weight. This is not an efficiency vehicle
  but rather a luxury off-road icon that happens to be electric.
  
  Competes with:
  - No direct BEV competitor in the luxury off-road segment
  - GMC Hummer EV (US only, even heavier)
  - Rivian R1S (different character, lighter, more efficient)

