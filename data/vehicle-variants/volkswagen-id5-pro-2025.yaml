notes: |
  The 2025 VW ID.5 Pro continues as the coupe SUV alternative to the ID.4.
  Key 2025 updates include ID. Software 4.0 with improved infotainment
  responsiveness, refined charging curve management, Plug & Charge support,
  and continued availability of the APP550 motor (286 hp). The coupe roofline
  delivers slightly better range than ID.4 through improved aerodynamics.
  Built on MEB platform at VW's carbon-neutral Zwickau factory.
  Competes with Tesla Model Y, BMW iX1, and Audi Q4 Sportback e-tron.

