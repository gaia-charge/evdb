notes: >
  The Mercedes-Benz GLC 300 4MATIC Electric is the entry-level variant of the all-electric GLC,
  built on Mercedes' new EA-M (Electric Architecture Medium) platform with 800V architecture.
  It replaces the EQC and adopts Mercedes' new naming convention, dropping the "EQ" prefix.
  With 190kW (258hp) dual motor AWD, 100kWh battery, and 680km WLTP range, it offers
  competitive specs in the D-segment electric SUV market. The 800V architecture enables
  250kW DC fast charging (10-80% in 26 minutes). DRIVE PILOT Level 3 autonomous driving
  may be available as option where regulations permit.

