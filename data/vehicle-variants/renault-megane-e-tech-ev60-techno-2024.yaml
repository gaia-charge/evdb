# Market & Pricing Notes
notes: >
  The EV60 Techno is the most popular Megane E-Tech variant, offering an excellent
  balance of range, performance, and features. With 450 km WLTP range and 130 kW
  fast charging, it's suitable for both daily use and longer trips. The 22 kW
  AC charging capability makes it practical for European markets with 3-phase
  infrastructure. Bidirectional charging (V2G/V2H) is a standout feature,
  allowing the car to feed energy back to the grid or home. The Techno trim
  includes heat pump as standard, improving winter efficiency. Real-world range
  is typically 350-400 km depending on driving conditions.

