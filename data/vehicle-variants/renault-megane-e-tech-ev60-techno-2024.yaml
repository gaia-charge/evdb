notes: |
  The EV60 Techno is the sweet spot in the Megane E-Tech lineup:
  
  **Battery & Range:**
  - 60kWh battery provides 450km WLTP (380km real-world)
  - Suitable for daily commuting AND weekend trips
  - City range of 570km makes charging very infrequent for urban drivers
  - Highway range of 360km allows 200+ mile road trips with one charging stop
  
  **Charging:**
  - 22kW AC three-phase (0-100% in 3.5 hours) - excellent for home/work charging
  - 130kW DC fast charging (10-80% in 30 minutes)
  - Competitive charging speeds vs ID.3 (140kW) and Cupra Born (135kW)
  
  **Performance:**
  - 218 HP / 300 Nm provides brisk acceleration (7.4s 0-100)
  - More power than EV40 (130 HP) without sacrificing efficiency
  - Sport mode provides eager throttle response
  
  **Equipment (Techno vs EV40):**
  - Adaptive cruise control with Stop & Go
  - Blind spot monitoring
  - Front parking sensors (rear standard)
  - Heated steering wheel
  - Electric driver seat
  - Recycled microfiber upholstery (sustainable)
  - Black roof (two-tone look)
  - 22kW AC charging (vs 7.4kW on EV40)
  - 130kW DC charging (vs 85kW on EV40)
  
  **Target Buyer:**
  - Primary car for families
  - Drivers covering 100-200km daily
  - Weekend travelers
  - Company car users (0.25% German tax benefit)
  
  **vs Iconic:**
  - €3,000 cheaper
  - Same battery and range
  - Similar performance
  - Less premium interior materials
  - Fewer luxury features
  
  **vs Competition:**
  - VW ID.3 Pro Performance: Similar range/price, less distinctive design
  - Cupra Born 77kWh: More range (548km), sportier image, similar price
  - Hyundai Ioniq 5: Larger, faster charging (800V), €5k more expensive
  - MG4 Extended Range: €8k cheaper, less premium, similar range
  
  **Best-Seller:** The EV60 Techno is the most popular Megane E-Tech variant (60% of sales)
