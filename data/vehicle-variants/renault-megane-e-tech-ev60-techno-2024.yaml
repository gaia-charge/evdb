# Notes
notes: >
  2023 European Car of the Year winner. Built on dedicated CMF-EV electric platform 
  (shared with Nissan Ariya). EV60 Techno is most popular trim level with comprehensive 
  equipment. Standard heat pump improves winter efficiency significantly. 22kW three-phase 
  AC charging standard (faster than most rivals). V2G capability allows bidirectional 
  charging (home backup power). 12" vertical OpenR Link display with Google Built-In. 
  Multi-Sense drive modes customize performance and efficiency. 440L trunk adequate for 
  compact crossover. Available with optional 20" wheels (reduces range slightly). 
  Excellent build quality and interior materials for price point. Strong competitor to 
  Volkswagen ID.3 with more crossover styling.
