# Market & Pricing Notes
notes: >
  The Megane E-Tech EV60 Techno is the mid-range variant with a 60 kWh battery,
  offering excellent range for daily use and longer trips. With 130kW DC charging
  and 22kW AC charging (three-phase), it provides flexible charging options.
  The 218hp motor provides spirited performance with 0-100 km/h in 7.4 seconds.
  This variant offers the best balance of range, performance, and value.

