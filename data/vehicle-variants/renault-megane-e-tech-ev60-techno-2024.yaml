id: renault-megane-e-tech-ev60-techno-2024
model_id: renault-megane-e-tech
name: Megane E-Tech Electric EV60 Techno
variant_name: EV60 Techno
model_year: 2024

# Vehicle Classification
vehicle_type: crossover
segment: C  # Compact crossover
body_style: 5-door hatchback crossover
seats: 5
doors: 5

# Drivetrain
drivetrain:
  type: fwd  # Front-wheel drive
  motors:
    front:
      type: permanent_magnet
      power_kw: 160
      power_hp: 218
      torque_nm: 300
      position: front

# Battery System
battery:
  total_kwh: 65
  usable_kwh: 60
  chemistry: NMC  # Nickel Manganese Cobalt
  voltage_nominal: 400
  cells: 216
  modules: 12
  manufacturer: LG Energy Solution
  warranty_years: 8
  warranty_km: 160000
  warranty_capacity_percent: 70  # 70% capacity retention
  thermal_management: liquid_cooling

# Charging
charging:
  ac:
    max_power_kw: 22  # Three-phase 22kW standard
    connector: type2
    charge_time_0_100_hours: 3.0  # 0-100% at 22kW
  dc:
    max_power_kw: 130  # DC fast charging
    connector: ccs2
    charge_time_10_80_percent_minutes: 30  # 10-80% at peak power
    charge_curve:
      - soc_percent: 10
        power_kw: 130
      - soc_percent: 40
        power_kw: 130
      - soc_percent: 60
        power_kw: 110
      - soc_percent: 80
        power_kw: 70
  bidirectional:
    v2g_capable: true
    v2h_capable: true
    v2l_capable: true
    max_discharge_power_kw: 3.0
    notes: >
      Megane E-Tech supports bidirectional charging with V2G (Vehicle-to-Grid), 
      V2H (Vehicle-to-Home), and V2L (Vehicle-to-Load) capabilities up to 3kW discharge power.

# Performance
performance:
  acceleration_0_100_kmh_seconds: 7.4
  top_speed_kmh: 160
  power_to_weight_ratio_kwkg: 90.4  # 160kW / ~1770kg

# Range & Efficiency
range:
  wltp_km: 450
  wltp_city_km: 570  # WLTP City cycle
  wltp_highway_km: 350  # WLTP Highway
  real_world:
    mixed_km: 380  # Real-world mixed driving
    highway_km: 310  # Highway at 120-130 km/h
    city_km: 480  # City driving
    winter_km: 300  # Winter conditions (-10°C)

efficiency:
