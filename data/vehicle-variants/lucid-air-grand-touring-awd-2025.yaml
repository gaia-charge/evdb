notes: 'The Lucid Air Grand Touring AWD represents the pinnacle of long-range luxury
  electric  sedans, offering an unmatched combination of 830 km WLTP range (837 km
  EPA / 520 miles -  highest in the segment), 663kW/891hp dual-motor performance (3.0s
  0-100 km/h), and  comprehensive ultra-luxury equipment. This is the ultimate choice
  for buyers prioritizing  maximum range and performance without compromising on luxury.

  The 112kWh battery pack is the largest in Lucid''s lineup, yet the Air Grand Touring  maintains
  exceptional efficiency (12.9 kWh/100km WLTP) thanks to the industry-leading  0.197
  Cd aerodynamics and advanced powertrain engineering. This enables 830km WLTP range
  -  approximately 150km more than Mercedes-Benz EQS 450+ and 200km+ more than BMW
  i7 xDrive60.

  Enhanced 350kW DC fast charging capability (vs 300kW on Touring/Pure) enables adding  nearly
  600km range in a 27-minute charging session (10-80%), making the Grand Touring  viable
  for truly long-distance European road trips without range anxiety.

  Standard adaptive air suspension provides exceptional ride comfort and handling
  dynamics,  automatically adjusting ride height for optimal aerodynamics at highway
  speeds and ease  of entry at low speeds. The quad-zone climate control, massaging
  seats in all positions,  and premium Nappa leather throughout create a first-class
  experience for all occupants.

  The Grand Touring competes with Mercedes-Benz EQS 580 4MATIC (€150k+), BMW i7 M70
  xDrive  (€180k+), and Porsche Taycan Turbo S (€200k+). Despite its €160,000+ positioning,
  the  Lucid offers superior range (+150-250km), better efficiency, faster charging,
  and more  standard luxury features than any competitor.

  This is the definitive choice for ultra-luxury buyers who want the longest-range
  electric  sedan available, combining S-Class levels of comfort with supercar performance
  and  cutting-edge EV technology. The Grand Touring proves that range, performance,
  and luxury  need not be compromised in electric vehicles.

  '
