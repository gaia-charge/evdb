  notes: |
    Mercedes-Benz EQA 250+ is the 2023+ updated variant with larger 66.5kWh battery
    (vs original 250 with 60.0kWh from 2021-2022). The "+" designation indicates
    the battery upgrade which added +86km range (426 vs 340km WLTP).
    
    Key improvements over original EQA 250:
    - Battery: 66.5kWh vs 60.0kWh (+10.8% capacity)
    - Range: 426km vs 340km WLTP (+86km, +25.3%)
    - Efficiency: 17.7 vs 18.0 kWh/100km (improved)
    
    Positioned as Mercedes' entry-level electric SUV:
    - Below EQB (7-seater, €60,845)
    - Below EQE SUV (executive, €81,229)
    - Above Smart #1 (compact crossover, €41,490)
    
    Competes with:
    - BMW iX1 xDrive30 (€54,200, 439km range, 150kW charging)
    - Audi Q4 e-tron 40 (€49,500, 488km range, 125kW charging)
    - Volvo XC40 Recharge Single Motor (€48,050, 460km range, 150kW charging)
    - Tesla Model Y RWD (€44,990, 455km range, 170kW charging)
    
    Strengths:
    - Premium Mercedes brand prestige and build quality
    - Proven MFA2 platform (shared with GLA - over 500,000 sold)
    - Excellent dealer network (650+ in Germany)
    - Good warranty: 2 years + 8 years battery (160,000km)
    - Standard heat pump (essential for winter efficiency)
    - MBUX infotainment system (user-friendly, 'Hey Mercedes' voice)
    - Plug & Charge automatic payment (ISO 15118)
    
    Weaknesses:
    - Modest 100kW DC charging (vs 135-150kW competitors)
    - 426km range adequate but not class-leading
    - Small 340L trunk (vs 405L Q4, 452L iX1, 854L Model Y)
    - No frunk (missed storage opportunity)
    - Higher price than non-premium competitors (MG4, Enyaq)
    - Charging curve drops quickly after 50% SoC
    
    Real-world performance:
    - Range: ~365km mixed driving (426km WLTP, 86% efficiency)
    - Consumption: 19.2 kWh/100km real-world (vs 17.7 WLTP)
    - Cold weather: ~290km at -10°C (32% loss, heat pump helps)
    - Highway: ~300km at 120km/h (high drag Cd 0.28)
    
    Popular configurations:
    - Base "Electric Art": €54,399 (well-equipped)
    - AMG Line: +€3,570 (sport styling, 19" wheels, -15km range)
    - Premium Plus: +€6,190 (Burmester audio, 360° camera, 10.25" displays)
    - Fully loaded: ~€68,000 (AMG Line + Premium Plus + options)
    
    Built at Rastatt plant alongside GLA (carbon-neutral production goal by 2039).
    Over 50,000 units sold in 2023 (strong sales in Germany, Norway, UK).

