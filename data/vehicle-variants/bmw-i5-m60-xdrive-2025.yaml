notes: >
  The 2025 BMW i5 M60 xDrive is the performance flagship of the i5 lineup,
  featuring dual motors producing 601 hp and 3.8s 0-100 km/h acceleration.
  The 2025 model year receives minor software updates including improved
  M-specific traction control and updated OS 8.5. Despite the performance
  focus, real-world range remains respectable at 425 km in mixed conditions.
  The 400V architecture limits DC charging to 205 kW peak. Standard equipment
  is comprehensive with M Sport features throughout. Competes with Tesla
  Model S and Mercedes-AMG EQE.

