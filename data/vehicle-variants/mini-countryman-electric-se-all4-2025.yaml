  notes: >
    The Countryman SE ALL4 is the dual-motor AWD performance variant with 230kW (313hp)
    combined output. Same 64.7kWh usable battery but slightly lower range due to higher
    weight and AWD losses. 22kW AC charging is a significant upgrade over the E variant's
    11kW. 5.6s 0-100km/h makes it one of the sportier compact SUVs. ALL4 branding
    denotes Mini's traditional all-wheel drive system. Shares platform with BMW iX1 xDrive30.
