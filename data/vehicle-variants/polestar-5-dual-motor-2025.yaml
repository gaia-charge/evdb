  notes: |
    Polestar 5 Dual Motor is the standard variant of the flagship GT.
    550 kW (748 PS), 800V architecture, 350 kW DC fast charging.
    670 km WLTP range makes it one of the longest-range GTs available.
    First model on Polestar's proprietary PPA platform with bonded aluminium body.
    Competes with Porsche Taycan (590 km WLTP) and Audi e-tron GT (540 km WLTP).

