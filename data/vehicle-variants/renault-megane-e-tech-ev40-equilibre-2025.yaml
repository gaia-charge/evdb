notes: |
  The Megane E-Tech EV40 Equilibre is the entry point to Renault's award-winning electric crossover:
  
  **Target Buyer:**
  - Urban drivers with short commutes (&lt;50 km daily)
  - Budget-conscious buyers wanting European Car of the Year tech
  - Second car for city use
  - Apartment dwellers with workplace/public charging access
  
  **Why Choose EV40 over EV60:**
  - €5,000 cheaper (€37,900 vs €42,900 Techno)
  - Sufficient range for urban use (255 km real-world)
  - Lighter weight = better city efficiency
  - Same OpenR infotainment and design
  - Lower insurance and depreciation
  
  **Limitations:**
  - 300 km WLTP / 255 km real-world (vs 470/390 km EV60)
  - 130 hp motor (vs 218 hp EV60) - adequate but not sporty
  - Heat pump NOT standard (€1,000 option, recommended)
  - Limited equipment (many features optional)
  - No towing capability
  - 85 kW DC charging (vs 130 kW EV60)
  
  **Equilibre Trim:**
  - OpenR Link with dual 12" screens (same as higher trims!)
  - Google built-in (Maps, Assistant, Play Store)
  - LED headlights (not Full LED or Matrix)
  - Manual cloth seats
  - Rear parking camera
  - ACC + Lane Keep Assist
  - 18" alloy wheels
  
  **Value Proposition:**
  - Same award-winning design and infotainment as EV60
  - €5,000 savings vs Techno trim
  - Perfect for city driving (better efficiency than EV60 in urban)
  - Lower total cost of ownership
  
  **Recommended Options:**
  - Heat Pump (€1,000) - essential for German winters
  - Comfort Pack (€1,200) - adds heated seats, better climate
  - 22kW AC Charger (€500) - reduces charging time to 2.5h
  
  **Competition:**
  - Opel Corsa-e (€34,990, smaller B-segment, 350km range)
  - Peugeot e-208 (€36,985, smaller, 400km range, older platform)
  - MG4 Standard (€29,990, similar range, less premium)
  - Nissan Leaf (€39,990, dated design, 270km range)
  
  **Best Use Case:**
  Perfect for urban commuters doing &lt;100 km daily who want premium tech/design
  without paying for long-range capability they don't need. Add heat pump for
  winter use, and you have a capable city EV at an attractive price.
  
  **Platform:** CMF-EV shared with Nissan Ariya
  **Production:** Renault ElectriCity (Douai, France)
  **Sales:** ~20% of Megane E-Tech sales (EV60 more popular for €5k premium)
