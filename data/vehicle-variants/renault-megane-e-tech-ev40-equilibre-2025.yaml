notes: >
  The EV40 Equilibre is the entry-level Megane E-Tech Electric, offering
  excellent value with 300 km WLTP range (255 km real-world). The 40 kWh
  battery is perfectly sized for daily commuting and urban driving, with
  85 kW DC fast charging allowing 15-80% in just 30 minutes. Standard
  equipment is generous, including the large 12-inch touchscreen with
  Google built-in, heat pump, and panoramic glass roof. The Equilibre trim
  provides a premium feel at an accessible price point.

