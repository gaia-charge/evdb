overview: 'The GWM ORA 03 300 is the entry-level variant with a 48 kWh battery (45.4
  kWh usable) providing 310 km WLTP range. Powered by a single front motor producing
  126 kW (171 PS), it offers sprightly performance with 0-100 km/h in 8.3 seconds.
  Despite being the base model, it comes generously equipped with 360-degree camera,
  adaptive cruise control, panoramic roof, and heated front seats as standard. List
  price starts at €38,990 in Germany.

  '
