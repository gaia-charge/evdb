  notes: 'The 2025 Opel Corsa Electric GS receives the same powertrain update as the

    Peugeot e-208: new 51kWh battery (48kWh usable) and 115kW (156hp) motor.


    Key changes vs 2024:

    - Battery: 50kWh → 51kWh gross, 45kWh → 48kWh usable

    - Motor: 100kW (136hp) → 115kW (156hp)

    - Range: 359km → 402km WLTP

    - Efficiency: 16.2 → 15.5 kWh/100km

    - Updated infotainment with wireless Apple CarPlay/Android Auto

    - Heat pump now standard on GS trim

    - Wireless smartphone charging standard


    GS replaces "GS Line" as the sporty trim name for 2025.

    '
