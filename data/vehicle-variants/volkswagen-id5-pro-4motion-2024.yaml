notes: |
  The ID.5 Pro 4MOTION adds a front motor to the RWD Pro variant, providing
  all-wheel drive for improved traction, acceleration, and driving dynamics.
  With 340 hp combined output, it's significantly quicker (6.3s 0-100 km/h
  vs 7.4s) while sacrificing about 30 km of WLTP range. Ideal for customers
  in regions with harsh winters or those prioritizing performance and traction
  over maximum range. Competes with Tesla Model Y Long Range AWD, Audi Q4
  Sportback e-tron 50 quattro, and BMW iX1 xDrive30.

