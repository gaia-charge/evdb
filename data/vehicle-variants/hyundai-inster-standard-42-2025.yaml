notes: "The Hyundai INSTER Standard Range with 42 kWh LFP battery offers 327 km WLTP range at an accessible price point. With 71 kW (97 PS) it's designed primarily for city and suburban driving. The 14.3 kWh/100km consumption is class-leading. Despite the small battery, DC fast charging at up to 120 kW means 10-80% in just 30 minutes. Winner of Goldenes Lenkrad 2025 in the 'Best Car Under €25,000' category. Excellent value proposition against Dacia Spring (less range/tech) and Fiat 500e (less space). LFP battery chemistry provides excellent longevity and thermal stability."


