notes: 'The Nissan Ariya 87 kWh FWD is the long-range variant with front-wheel drive,

  offering 218 hp and 520 km WLTP range. With FWD layout and 87 kWh battery,

  it provides the best range in the Ariya lineup while maintaining good efficiency.

  Built on Nissan''s CMF-EV platform shared with Renault. Features ProPILOT

  Assist 2.0 for hands-free highway driving and V2H capability. Targets buyers

  seeking maximum range without AWD performance. Competes with VW ID.4 Pro,

  Hyundai Ioniq 5 Long Range RWD, and Kia EV6 Long Range RWD.

