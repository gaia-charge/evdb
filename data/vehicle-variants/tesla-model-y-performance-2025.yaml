notes: |
  2025 Model Year Performance variant with latest software updates.
  
  Performance model includes Track Mode for circuit driving optimization.
  21" Überturbine wheels standard (reduce range vs 19" wheels on LR).
  Performance Brakes with red calipers for better stopping power.
  Lowered suspension (-10mm) for improved handling and aerodynamics.
  Aluminum pedals with rubber inserts (Performance exclusive).
  Carbon fiber spoiler (Performance exclusive).
  Dual motor AWD with more powerful motors than Long Range.
  0-100 km/h in 3.5 seconds = faster than Porsche 911 Carrera!
  Track Mode allows torque vectoring and customizable handling.
  250kW peak charging on Tesla Supercharger V3.
  Access to Tesla Supercharger network (50,000+ chargers globally).
  Over-the-air updates add new features regularly.
  Full Self-Driving Capability available as €7,500 option or €99/month subscription.
  Made in Germany at Gigafactory Berlin (Europe deliveries).
  Optional tow hitch: €1,000 (1,600kg capacity).
  Optional 7-seater: €3,000 (third row).
  
  2025 updates:
  - Enhanced Autopilot software (v12+)
  - Improved battery management system
  - Minor interior trim refinements
  - Latest OTA features

