notes: >
  The Lotus Eletre is Lotus's first-ever SUV and first series production electric vehicle.
  Built on Geely's EPA platform, it offers 450 kW (612 hp) combined power from dual motors,
  0-100 km/h in 4.5 seconds, and 600 km WLTP range. Features include LIDAR sensors for
  autonomous driving, active aerodynamics, 800V architecture supporting 350 kW DC charging,
  and air suspension. Despite being an SUV, it maintains Lotus performance DNA with
  exceptional handling and track-ready dynamics.
