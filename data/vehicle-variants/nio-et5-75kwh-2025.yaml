overview: 'The NIO ET5 75 kWh is the standard-range variant equipped with a 75 kWh
  battery pack  providing 456 km WLTP range. It features the same dual-motor AWD powertrain
  as the  100 kWh variant — 360kW (490 PS) combined output with 700 Nm torque and
  4.0s 0-100 km/h.  Available for purchase with battery (€59,500) or via Battery-as-a-Service
  at €47,500  plus €169/month battery rental. DC fast charging supports up to 140kW.

  '
