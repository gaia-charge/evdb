notes: 'The NIO ET5 75 kWh offers strong performance and comprehensive standard equipment
  at  a competitive price point. The 140kW DC charging speed is lower than some competitors,  but
  NIO''s unique battery swap capability (3-5 minutes for a full battery) compensates  for
  this limitation. Available via BaaS (Battery-as-a-Service) at €47,500 + €169/month  battery
  rental, which significantly reduces the upfront cost and enables flexible battery  upgrades.
  The 75 kWh battery can be swapped for a 100 kWh battery at swap stations for  longer
  trips (subject to availability and subscription terms).

  '
