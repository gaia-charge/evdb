notes: |
  The ID.7 Pro S is the long-range flagship of VW's electric sedan lineup.
  With 86 kWh battery (largest in MEB platform) and exceptional aerodynamics
  (Cd 0.23), it achieves 700 km WLTP range - the longest of any VW electric
  vehicle and competitive with Tesla Model S. The Pro S features 286 hp RWD
  powertrain, 200 kW DC fast charging, premium interior with 15" touchscreen,
  optional AR head-up display, and climate comfort seats. Built on MEB platform
  at VW's Emden factory. Perfect for business users and long-distance drivers
  who prioritize maximum range without compromising efficiency.

