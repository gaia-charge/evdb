notes: 'The 2025 Porsche Taycan GTS Sport Turismo combines the thrilling GTS driving
  experience with the practical Sport Turismo body style. The GTS sits between the
  4S and Turbo in the lineup, offering a sportier setup than the 4S with sport-tuned
  PASM suspension, Sport Chrono Package, and GTS-specific black exterior accents as
  standard. The 2025 facelift brought significant improvements: larger 105 kWh battery
  (93.4 kWh usable), 320 kW DC charging, revised front and rear design, and new PCM
  6.0 infotainment. With 515 kW overboost, 0-100 in 3.7 seconds, and 504 km WLTP range,
  the GTS Sport Turismo is considered by many to be the sweet spot of the Taycan range
  - enough performance for any situation, practical enough for daily family use with
  its 405L trunk (1,212L with seats folded), and striking enough to turn heads everywhere.

