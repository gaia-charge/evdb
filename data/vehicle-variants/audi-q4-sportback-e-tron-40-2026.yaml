  notes: |
    2026 model year brings improved battery capacity (85kWh total, 80kWh usable) and 
    enhanced DC charging performance up to 150kW. The Q4 Sportback 40 e-tron combines
    style with exceptional efficiency.
    
    Superior aerodynamics (Cd 0.26) provide up to 20km additional range compared to
    standard Q4 40 e-tron (610km vs 590km WLTP), making it the most efficient Q4
    variant available. The sloping roofline actually increases trunk space by 15L.
    
    Rear motor upgraded to more powerful unit (210kW vs 150kW in 2024) with improved
    torque (545Nm vs 310Nm) for better acceleration (7.0s vs 8.5s 0-100km/h).
    
    Heat pump now standard for better winter efficiency. Updated MMI system with 
    AI-powered voice assistant and improved route planning.
    
    Popular with buyers who want the style of a coupe-SUV without sacrificing
    practicality or range. Premium of €1,500-2,000 over standard Q4 is offset by
    20km additional range and sportier design.
    
    With 610km WLTP range (520km real-world), the Q4 Sportback 40 2026 is the 
    range champion in Audi's compact SUV lineup.
