  notes: "2026 model year brings improved battery capacity (85kWh total, 80kWh usable)\
    \ and \nenhanced DC charging performance up to 150kW. The Q4 Sportback 40 e-tron\
    \ combines\nstyle with exceptional efficiency.\n\nSuperior aerodynamics (Cd 0.26)\
    \ provide up to 20km additional range compared to\nstandard Q4 40 e-tron (610km\
    \ vs 590km WLTP), making it the most efficient Q4\nvariant available. The sloping\
    \ roofline actually increases trunk space by 15L.\n\nRear motor upgraded to more\
    \ powerful unit (210kW vs 150kW in 2024) with improved\ntorque (545Nm vs 310Nm)\
    \ for better acceleration (7.0s vs 8.5s 0-100km/h).\n\nHeat pump now standard\
    \ for better winter efficiency. Updated MMI system with \nAI-powered voice assistant\
    \ and improved route planning.\n\nPopular with buyers who want the style of a\
    \ coupe-SUV without sacrificing\npracticality or range. Premium of €1,500-2,000\
    \ over standard Q4 is offset by\n20km additional range and sportier design.\n\n\
    With 610km WLTP range (520km real-world), the Q4 Sportback 40 2026 is the \nrange\
    \ champion in Audi's compact SUV lineup.\n"
