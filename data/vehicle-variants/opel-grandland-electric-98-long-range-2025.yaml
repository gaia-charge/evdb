  notes: |
    The Grandland Electric 98 kWh Long Range is the flagship variant offering
    700 km WLTP range - one of the longest-range EVs in Europe.
    
    Key differences vs 73 kWh GS:
    - 98 kWh NMC battery (vs 73 kWh LFP)
    - 700 km WLTP range (vs 523 km)
    - 231 hp / 345 Nm (vs 213 hp / 260 Nm)
    - 22kW AC charging standard (vs 11kW)
    - Tri-zone climate (vs dual-zone)
    - 10-speaker audio (vs 8-speaker)
    - Heated rear seats standard
    - 20" wheels (vs 19")
    - Panoramic glass roof standard
    - Semi-automated lane change
    
    Platform sibling to Peugeot e-5008 Long Range 98 kWh.
    Built at Eisenach, Germany.
