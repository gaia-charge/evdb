  notes: |
    Most popular MG4 variant with 64kWh NMC battery.
    450km WLTP range is excellent for the price point.
    Upgraded to 3-phase 11kW AC charging (vs 6.6kW on Standard).
    V2L capability allows powering external devices.
    Heat pump standard improves winter efficiency.
    150kW motor provides more power than Standard variant.
    Best balance of range, features, and price in the lineup.
