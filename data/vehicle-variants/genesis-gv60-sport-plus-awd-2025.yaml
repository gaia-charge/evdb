description: 'Genesis GV60 Sport Plus AWD 2025 is the flagship variant of the facelifted
  GV60, delivering

  exhilarating performance with 360 kW (490 PS) combined output and 4.0-second 0-100
  km/h

  acceleration via Boost mode. The 2025 facelift brings refreshed exterior with updated
  Two Lines

  lighting signature, revised bumpers, new 12.3" OLED instrument cluster paired with
  updated 12.3"

  center touchscreen running latest ccOS infotainment. Sport Plus adds exclusive features
  over

  Sport: Bang & Olufsen 17-speaker premium audio system, Nappa leather seats with
  driver massage

  function, electronically controlled suspension with Sport mode, 20" alloy wheels,
  and Boost mode

  delivering additional 70 kW for 10-second bursts. The 77.4 kWh battery with 800V
  architecture

  enables 10-80% DC fast charging in just 18 minutes. Despite higher performance,
  WLTP range

  reaches 450 km thanks to optimized power management. Standard heads-up display with
  AR

  navigation, suede headliner, and exclusive Sport Plus design elements complete the
  package.

  '
