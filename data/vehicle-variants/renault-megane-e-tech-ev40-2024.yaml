# Market & Pricing Notes
notes: >
  The Megane E-Tech EV40 is the entry-level variant with a 40 kWh battery suitable for urban
  and short-distance driving. While the smaller battery limits highway range to around 220km,
  the vehicle offers excellent efficiency and competitive pricing. The 7.4kW AC charging is
  limited to single-phase, which may be slower than competitors. Real-world consumption is
  impressive at around 15 kWh/100km in mixed conditions.

