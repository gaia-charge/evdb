notes: |
  The EV40 is the entry-level Megane E-Tech, designed for daily commuting and urban driving:
  
  **Battery & Range:**
  - 40kWh battery provides 300km WLTP (260km real-world)
  - Ideal for drivers with regular access to home/work charging
  - City range of 390km makes it excellent for urban use
  - Highway range limited to ~240km (plan charging on long trips)
  
  **Charging:**
  - 7.4kW AC (0-100% in 6 hours)
  - 85kW DC fast charging (10-80% in 32 minutes)
  - Smaller battery charges proportionally faster than EV60
  
  **Target Buyer:**
  - Urban/suburban commuters with <50km daily driving
  - Second car for households
  - Budget-conscious buyers seeking lower entry price
  - Fleet customers for city delivery
  
  **vs EV60:**
  - €5,000 cheaper
  - 150km less range
  - Slightly lighter (100kg)
  - Same interior space and features
