# Market & Pricing Notes
notes: >
  The Megane E-Tech EV40 is the entry-level variant designed for budget-conscious 
  buyers and urban drivers. With 300 km WLTP range, it covers typical daily 
  commutes comfortably. The 130 hp motor provides adequate performance while 
  maintaining excellent efficiency. Standard heat pump improves winter range. 
  DC fast charging at 85 kW enables rapid top-ups on longer journeys (10-80% 
  in 37 minutes). OpenR cockpit with Google built-in provides modern connectivity. 
  Multi-Sense driving modes optimize efficiency and driving feel. Excellent value 
  proposition in the compact EV segment.

