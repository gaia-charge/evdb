# Market & Pricing Notes
notes: >
  The Megane E-Tech EV40 is the entry-level variant with a 40 kWh battery,
  suitable for urban and suburban use. The smaller battery makes it lighter
  and more affordable, while still offering decent efficiency. DC charging
  is limited to 85kW, which is adequate for the battery size. Heat pump
  is standard on all variants, improving winter range.

