# Market & Pricing Notes
notes: >
  The EV40 is the entry-level Megane E-Tech with a smaller 40 kWh battery,
  designed for urban and suburban use. While WLTP range is 300 km, real-world
  range is typically around 250-280 km depending on conditions. The smaller
  battery means lighter weight and lower price, making it an affordable option
  for those who don't need long-range capability. DC fast charging at 85 kW
  is adequate for occasional longer trips.

