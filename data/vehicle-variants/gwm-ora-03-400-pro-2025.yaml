overview: 'The GWM ORA 03 400 Pro is the long-range variant with a 63 kWh battery
  (59.3 kWh usable) providing 420 km WLTP range. Same 126 kW (171 PS) front motor
  as the 300 variant but with substantially more range thanks to the larger battery.
  The 400 Pro adds enhanced equipment including front seat massage function, upgraded
  interior trim, and additional comfort features. List price from €44,990 in Germany.
  DC charging remains at 67 kW maximum, which is the main drawback compared to competitors.

  '
