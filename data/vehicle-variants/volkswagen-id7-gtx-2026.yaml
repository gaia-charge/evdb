overview: 'The 2026 Volkswagen ID.7 GTX continues as the performance flagship of VW''s
  electric sedan lineup. For 2026, the GTX receives updated software (ID. Software
  4.2), improved charging curve optimization, and refined adaptive chassis tuning.
  The dual-motor AWD system with 250 kW (340 PS) and 86 kWh usable battery delivers
  up to 595 km WLTP range. The GTX trim includes sport-tuned DCC adaptive dampers,
  torque vectoring, AR head-up display, and comprehensive premium equipment as standard.

  '
