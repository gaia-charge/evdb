notes: 'The ID.3 GTX is Volkswagen''s sporty electric hot hatch, positioned as the

  spiritual successor to the Golf GTI for the electric era. With 286 hp from

  a single rear motor, 0-100 km/h in 5.9 seconds, and a top speed of 200

  km/h, it offers genuine performance credentials. The 77 kWh battery provides

  an impressive 601 km WLTP range. GTX-specific styling includes sport bumpers,

  red accents, 20-inch wheels, and sport seats. DCC adaptive dampers provide

  a balance between comfort and sportiness. Built at VW''s Zwickau factory.

  Competes with Cupra Born VZ, BMW iX1 eDrive20, and Tesla Model 3 Standard

  Range Plus.

