notes: BMW iX1 eDrive20 is the entry-level variant with a single front motor producing
  150 kW (204 hp). Front-wheel drive only. Same 64.7 kWh usable battery as xDrive30
  but better efficiency and range (475 km WLTP vs 439 km). Lighter and more affordable
  than the AWD variant. Ideal for buyers who don't need all-wheel drive. Built on
  FAAR platform at BMW Plant Regensburg. Heat pump standard. Competes with Mercedes
  EQA 250, Volvo EX30 Extended Range, Audi Q4 e-tron 35.
