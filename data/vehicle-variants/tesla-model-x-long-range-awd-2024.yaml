# Tesla Model X Long Range AWD (2024)
# Standard Variant - Dual Motor All-Wheel Drive

id: tesla-model-x-long-range-awd-2024
model_id: tesla-model-x
name: Long Range AWD
model_year: 2024
variant_code: "LR-AWD"  # Long Range All-Wheel Drive

# Battery
battery:
  usable_kwh: 95.0  # Usable capacity (estimated)
  total_kwh: 100.0  # Total capacity (estimated)
  chemistry: NCA    # Nickel-Cobalt-Aluminum (Panasonic cells)
  cells: cylindrical  # 18650 cells
  pack_voltage_v: 400  # Nominal voltage
  supplier: 
    - "Panasonic"
  warranty_years: 8
  warranty_km: 240000
  warranty_capacity_percent: 70

# Range
range:
  wltp_km: 543  # WLTP combined (2024 spec)
  wltp_city_km: 640  # Estimated city range
  wltp_highway_km: 465  # Estimated highway range
  epa_miles: 335  # EPA combined
  epa_km: 539
  real_world_km: 460  # Typical real-world range (mixed driving, mild weather)
  real_world_highway_km: 400  # Highway at 120 km/h
  real_world_winter_km: 360  # Cold weather (-5°C to 5°C)

# Charging - AC
charging_ac:
  max_power_kw: 11  # 3-phase Type 2
  connector_type: Type2
  onboard_charger_kw: 11
  charge_time_0_100_hours: 9.5  # 11kW charging (95 kWh / 11 kW)
  
# Charging - DC
charging_dc:
  max_power_kw: 250  # Tesla Supercharger V3 peak
  connector_type: CCS2  # Europe
  charge_time_10_80_percent_min: 32  # Estimated (larger battery)
  charge_time_0_100_percent_min: 52
  km_per_10min: 255  # At peak charging speed

# Charging Curve (DC Fast Charging)
charging_curve:
  - soc_percent: 0
    power_kw: 180
  - soc_percent: 10
    power_kw: 250  # Peak power
  - soc_percent: 20
    power_kw: 250
  - soc_percent: 30
    power_kw: 230
  - soc_percent: 40
    power_kw: 190
  - soc_percent: 50
    power_kw: 160
  - soc_percent: 60
    power_kw: 125
  - soc_percent: 70
    power_kw: 95
  - soc_percent: 80
    power_kw: 70
  - soc_percent: 90
    power_kw: 40
  - soc_percent: 100
    power_kw: 20

