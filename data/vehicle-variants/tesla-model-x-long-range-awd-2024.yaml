v2l: false
v2h: false
v2g: false

# Motors & Drivetrain
motors:
  count: 2  # Dual motor AWD
  type: "Permanent Magnet Synchronous"  # Both front and rear
  combined:
    total_power_kw: 493  # Combined power (670 hp)
    total_power_hp: 670  # Combined power
    total_torque_nm: 700  # Estimated combined torque
  front:
    motor_type: "Permanent Magnet"
    power_kw: 193  # Front motor (estimated)
    torque_nm: 280
  rear:
    motor_type: "Permanent Magnet"  
    power_kw: 300   # Rear motor (estimated)
    torque_nm: 420
  
drivetrain:
  type: AWD  # All-Wheel Drive
  drive_config: "Dual Motor AWD"
  differential: electronic

# Performance
performance:
  acceleration_0_100_kmh_s: 3.9  # 2024 spec
  acceleration_0_60_mph_s: 3.8
  top_speed_kmh: 250
  quarter_mile_s: 12.1  # Estimated
  
# Weight
