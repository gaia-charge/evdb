dimensions:
  length_mm: 4720  # Highland refresh - slightly shorter
  width_mm: 1850
  width_with_mirrors_mm: 2089
  height_mm: 1441  # Lower than Long Range AWD (same chassis)
  wheelbase_mm: 2875
  ground_clearance_mm: 138
  drag_coefficient: 0.219  # Best-in-class aerodynamics (Highland refresh improvement!)
  frontal_area_m2: 2.22

weight:
  curb_weight_kg: 1765  # Lighter than Long Range AWD (single motor, smaller battery)
  gross_weight_kg: 2215
  payload_kg: 450
  towing_capacity_braked_kg: 1000  # Optional tow hitch available
  towing_capacity_unbraked_kg: 750
  weight_distribution_front_percent: 47
  weight_distribution_rear_percent: 53  # RWD balanced weight

# Cargo & Seating
cargo:
  trunk_capacity_liters: 594  # Frunk + rear trunk combined (improved in Highland)
  frunk_capacity_liters: 88  # Front trunk
  rear_seats_folded_liters: 1148  # Seats down

seating:
  seats: 5
  seating_configuration: "2+3"

# Technology & Features
technology:
  autopilot: true  # Standard
  adaptive_cruise: true
  lane_keeping: true
  autonomous_level: 2  # SAE Level 2 (Autopilot standard)
  full_self_driving: false  # Optional €7,500 upgrade
  ota_updates: true
  
infotainment:
  screen_size_inch: 15.4
  screen_orientation: landscape
  navigation: true
  streaming: true
  connectivity: "4G LTE"

# Standard Features (Highland refresh improvements)
features: null  # Use market-specific standard_equipment in market files

notes: |
  RWD base variant - entry-level Tesla, volume seller (~45% of Model 3 sales).
  Highland refresh (September 2023): improved aerodynamics (Cd 0.219), efficiency, interior upgrades.
  LFP battery (CATL): 100% charging recommended (no degradation), longer lifespan (3,000+ cycles).
  513 km WLTP range with excellent real-world efficiency (450 km mixed, 90% of WLTP).
  Single rear motor RWD - simpler drivetrain, balanced weight distribution (47/53).
  170 kW DC fast charging - adequate for road trips (27 min 10-80%).
  6.1s 0-100 km/h - quick for entry-level sedan.
  €40,990 in Germany - most affordable Tesla, excellent value vs competitors.
  Supercharger network access (50,000+ chargers globally, 1,600+ in Germany).
  Made at Gigafactory Shanghai (EU) and Fremont (US), 2-4 week delivery.
  Highland improvements: ventilated seats, rear 8" display, ambient lighting, Li-ion 12V battery.
  Strong company car value: under €70k = 0.25% tax rate (saves €1,476/year vs ICE).

