description: |
  The Cadillac Lyriq Luxury AWD prioritizes comfort and refinement over the Sport trim's
  dynamic focus. It features pinstripe laser-graved front grille pattern, luxury-specific
  wheel designs, and comfort-tuned suspension. Same powerful 528 PS dual-motor AWD and
  102 kWh battery with 530 km WLTP range.
  
  The Luxury trim emphasizes Cadillac's traditional strengths: exceptional comfort, 
  premium materials, and a serene driving experience enhanced by Active Noise Cancellation.
  Standard massage seats and softer suspension tuning make it ideal for long-distance
  touring and daily luxury commuting.

# Same powertrain as Sport - reference Sport variant for detailed specs
# Key differences: comfort-tuned suspension, luxury wheel design, pinstripe grille

