notes: 'The 2025 Volvo EX90 Twin Motor replaces the 2024 Twin Motor Performance as

  the standard AWD variant. Same 408 hp dual motor setup with 770 Nm, but

  tuned slightly for comfort (5.7s vs 4.9s 0-100). Software improvements

  deliver marginally better range (610 km vs 600 km WLTP). Full LiDAR suite

  and bidirectional charging standard. Competes with BMW iX xDrive50,

  Mercedes EQS SUV 450+, Audi Q8 e-tron 55.

