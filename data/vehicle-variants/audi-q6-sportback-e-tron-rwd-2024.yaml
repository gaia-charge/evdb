  notes: "Sportback coupe variant of Q6 e-tron with improved aerodynamics (Cd 0.26) delivering same 641km WLTP range as SUV variant despite coupe styling. Built on PPE platform with 800V architecture enabling 270kW peak DC charging (10-80% in 21 minutes). Entry-level RWD powertrain offers excellent efficiency and rear-biased driving dynamics. At €68,900 base price, it undercuts BMW iX xDrive40 by €19,100 while offering superior range and charging performance. Standard air suspension, heat pump, matrix LED, Sonos sound, and bi-directional charging provide comprehensive equipment. Target buyers: efficiency-focused premium buyers, company car drivers (0.25% tax rate), long-distance travelers."
