notes: |
  2025 Model S Plaid receives minor updates over 2024 model.
  
  Updates from 2024:
  - Slightly improved WLTP range: 606km (up from 600km)
  - Improved efficiency: 17.5 kWh/100km (from 17.7 kWh/100km)
  - Updated Autopilot software (2025.x firmware)
  - Enhanced cabin noise insulation
  - Price reduction to €109,990 (from €119,990 in 2024)
  
  Tri-motor AWD with torque vectoring. One front AC induction motor and two
  independent rear permanent magnet motors. Carbon ceramic brakes standard.
  Track Mode with drift mode included. 0-100 km/h in 2.1 seconds makes it
  one of the fastest production sedans in the world.
  
  Competes with:
  - Porsche Taycan Turbo S (€190,381, better handling, less range)
  - Mercedes-AMG EQS 53 4MATIC+ (€159,808, more luxury, slower)
  - BMW i7 M70 xDrive (€174,600, more luxury, less performance)
  - Lucid Air Grand Touring (€145,000, more range, less acceleration)


