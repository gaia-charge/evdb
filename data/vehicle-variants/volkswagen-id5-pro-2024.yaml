notes: 'The ID.5 Pro is the RWD base variant of VW''s coupe SUV. With 286 hp,

  77 kWh battery, and 520 km WLTP range, it offers a sportier alternative

  to the ID.4 with improved aerodynamics. The coupe roofline reduces rear

  headroom slightly but improves efficiency. Built on MEB platform at VW''s

  Zwickau factory. Targets buyers seeking sportier styling than the ID.4

  while maintaining strong range and practicality. Competes with Audi Q4

  Sportback e-tron, BMW iX1, and Tesla Model Y.

