notes: >
  The 100 kWh variant offers 580 km WLTP range making it suitable for long-distance travel. 
  With BaaS, the car price is identical to the 75 kWh variant (€57,900) with a higher monthly 
  battery rental of €289/month. At €81,900 with battery, it exceeds the €70,000 company car 
  tax threshold, making the BaaS option particularly attractive for company car users.

