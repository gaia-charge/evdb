  notes: 'Long Range is the most popular MG5 variant (61.1kWh battery).

    Heat pump standard improves cold weather efficiency.

    LFP battery chemistry (CATL) provides excellent safety and longevity.

    Only affordable electric estate car in Europe with 400km+ range.

    479L boot capacity - unmatched in electric estate segment at this price.

    Popular with fleet buyers, taxi operators, and families.

    Slightly slower DC charging (87kW) acceptable for estate car use case.

    7-year/175,000km battery warranty among best in class.

    Front-wheel drive provides good traction and efficiency.

    '
