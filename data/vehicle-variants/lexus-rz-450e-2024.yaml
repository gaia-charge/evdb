  notes: Lexus' first pure electric SUV. More powerful than Toyota bZ4X (313hp vs
    218hp) with asymmetric motor setup (150kW front, 80kW rear). DIRECT4 AWD provides
    precise torque distribution for handling. Optional yoke steering with steer-by-wire
    (One Motion Grip, 150° lock-to-lock). Premium Lexus interior with Takumi craftsmanship.
    11kW AC charging (better than bZ4X's 6.6kW). Competes with Audi Q4 e-tron 50 quattro,
    BMW iX1 xDrive30, Mercedes EQA 350.
