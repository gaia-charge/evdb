trim_level: Long Range
production_years: "2024-present"

overview: >
  The Zeekr 001 Long Range RWD is the efficiency-focused variant of Zeekr's flagship shooting brake,
  offering up to 750km WLTP range from its 100kWh battery. With a single rear motor producing 200kW
  (272hp), it provides strong performance with a 7.2s 0-100 km/h time while prioritizing range and
  efficiency. The 800V architecture enables ultra-fast DC charging up to 400kW. The 2025 model includes
  Haohan Smart Driving 2.0 with dual Nvidia OrinX chips for advanced autonomous driving.

