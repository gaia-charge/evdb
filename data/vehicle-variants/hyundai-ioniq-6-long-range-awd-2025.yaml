notes: >
  The 2025 Ioniq 6 Long Range AWD offers dual-motor all-wheel drive with 320 hp
  and 5.1s 0-100 km/h. The 2025 model year brings refined software, improved OTA
  updates, new Biophilic Blue Pearl color, and updated connected services. The
  electronic AWD distributes torque between front and rear for optimal grip.
  Trade-off vs RWD: 95km less range (519 vs 614km) and higher consumption
  (16.3 vs 13.9 kWh/100km). Powertrain unchanged from 2024.

