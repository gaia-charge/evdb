# Market & Competitors
positioning:
  segment: large_suv
  competitors:
    - Mercedes-Benz EQS SUV 450+ (€115,900, more luxurious, 122 km less range)
    - BMW iX xDrive40 (€99,900, €28k more expensive, 80 km less range)
    - Tesla Model X Long Range (€97,990, 107 km more range, less practical)
    - Volkswagen ID.Buzz Pro LWB (€65,000, 26 km less range, less premium)
    - Peugeot e-5008 Long Range (€54,000, less premium, less space)
  unique_selling_points:
    - Most affordable 7-seat electric SUV with premium features
    - Class-leading third-row space for adults
    - Standard heat pump and V2L capability
    - 7-year/150,000 km comprehensive warranty
    - Competitive 505 km WLTP range
    - €16,010 cheaper than Long Range AWD
  target_buyers:
    - Large families needing 7 seats
    - Cost-conscious buyers wanting EV9 capability at lower price
    - Urban families prioritizing efficiency over performance
    - Company car drivers (0.25% tax rate)
    - Those who don't need AWD or extreme acceleration
    - Buyers prioritizing practicality over speed

strengths:
  - Most affordable EV9 variant (€16k savings vs AWD)
  - Excellent 505 km WLTP range (420 km real-world)
  - Class-leading third-row space and practicality
  - 7-year/150,000 km comprehensive warranty
  - Standard heat pump and V2L capability
  - Efficient single-motor RWD drivetrain
  - Adequate performance for SUV (9.4s 0-100 km/h)
  - 0.25% company car tax rate (under €70k)

weaknesses:
  - 1.6 seconds slower acceleration than AWD (9.4s vs 7.8s)
  - 400V architecture limits DC charging to 210 kW (vs 240 kW AWD)
  - 58 km less WLTP range than Long Range AWD
  - Lower towing capacity (1,600 kg vs 1,900 kg AWD)
  - No ventilated seats on Earth trim
  - Basic 6-speaker audio (vs 14-speaker Meridian on higher trims)
  - RWD only (no AWD winter/off-road capability)

