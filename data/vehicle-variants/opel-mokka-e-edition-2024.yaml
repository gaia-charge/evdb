  notes: |
    The Opel Mokka-e Edition is the base electric trim, offering excellent value for a 
    compact electric SUV. Mechanically identical to the Peugeot e-2008 Allure - both 
    built on Stellantis CMP platform with same battery, motor, and performance specs.
    
    Edition trim has smaller 16" wheels (better efficiency), halogen headlights, 
    manual climate control, and simpler infotainment compared to Ultimate.
    
    Popular as an affordable electric crossover with SUV styling and practicality.
