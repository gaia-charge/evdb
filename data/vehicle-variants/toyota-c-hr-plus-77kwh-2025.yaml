notes: >
  The Toyota C-HR+ is the fully electric version of the third-generation C-HR,
  positioned as a compact crossover BEV for the European market. It shares the
  e-TNGA platform with the bZ4X but in a more compact, stylish package. The
  77 kWh battery provides competitive range while the compact dimensions make
  it practical for urban use. This is Toyota's answer to the VW ID.3 and
  Kia EV3 in the European compact BEV segment.

