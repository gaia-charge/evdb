description: |
  The 2026 Porsche Taycan 4S is the sweet spot of the Taycan range, combining
  all-wheel drive performance with everyday usability. With 400 kW (544 hp)
  continuous power and up to 440 kW (598 hp) with overboost via Launch Control,
  the 4S delivers supercar-level acceleration (0-100 km/h in 3.7 seconds) while
  maintaining a practical WLTP range of up to 536 km.

  The 2026 model year brings the updated Performance Battery Plus (105 kWh total,
  93.4 kWh usable) with improved cell chemistry, 320 kW peak DC charging, and
  the new PCM 6.0 infotainment system with a curved 16.8-inch display. The 4S
  also features Porsche's signature 2-speed rear transmission, 800V architecture,
  and standard adaptive air suspension with PASM.

