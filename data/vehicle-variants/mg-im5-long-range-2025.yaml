overview: 'The MG IM5 Long Range is the primary European variant of MG''s new executive
  electric sedan. Featuring a 100 kWh battery (96.5 kWh usable) on an 800V architecture,
  it delivers 710 km WLTP range and ultra-fast charging at up to 369 kW DC. The single
  rear motor produces 300 kW (408 PS) and 500 Nm, enabling 0-100 km/h in 4.9 seconds.
  Earned a 5-star Euro NCAP rating in 2025.

  '
