overview: >
  The Mercedes-Benz GLC 400 4MATIC is the launch variant of the all-electric GLC, featuring dual motors
  with 360kW (489 PS) and 800Nm torque on the EA-M platform with 800V architecture. With a 100kWh battery
  delivering up to 715km WLTP range and 330kW DC fast charging, it's a compelling premium electric SUV.
  The 4MATIC AWD system provides confident all-weather traction, while 0-100 km/h in 4.3 seconds ensures
  strong performance.

