  notes: 'The GLC 400 4MATIC is the all-electric successor to Mercedes'' best-selling
    SUV.

    Built on the EA-M (Electric Architecture Medium) platform with 800V architecture.


    Key specs:

    - 100 kWh battery (94 kWh usable), 800V architecture

    - 360 kW / 489 PS dual motor AWD

    - 715 km WLTP range (~500 km real-world)

    - 330 kW DC fast charging, 10-80% in ~22 min

    - 2,400 kg towing capacity

    - 570L / 1,740L cargo, 128L frunk

    - AIRMATIC air suspension standard


    Competes with:

    - BMW iX3 50 xDrive (115 kWh, 610 km real, ~€75,000)

    - Audi Q6 e-tron quattro (100 kWh, 510 km WLTP)

    - Tesla Model X (from €99,990)

    - Volvo EX90 (from €83,700)


    This is one of Mercedes'' most important EV launches given ICE GLC sales volume.

    '
