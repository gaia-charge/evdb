description: 'The Porsche Macan 4 is the entry-level AWD variant, bridging the gap
  between

  the rear-wheel-drive base Macan and the high-performance 4S. With 300kW (408hp)

  from dual motors, it delivers confident all-weather traction and sporty

  acceleration (0-100 km/h in 5.2s) while maintaining excellent range (up to

  610km WLTP). Same 800V PPE platform with 270kW peak DC charging.

  '
