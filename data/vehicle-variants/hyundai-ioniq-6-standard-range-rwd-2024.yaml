# Market & Pricing Notes
market_notes: >
  The Ioniq 6 Standard Range RWD is the entry-level variant, competing directly
  with Tesla Model 3 RWD, Polestar 2 Standard, and BMW i4 eDrive35. Despite the
  smaller 53kWh battery, it achieves exceptional 446km WLTP range (86% real-world)
  thanks to the class-leading Cd 0.21 aerodynamics. The 800V architecture maintains
  18-minute 10-80% charging speed (same as Long Range!), making it practical for
  long-distance travel. The 125kg weight savings (1730 vs 1855kg) delivers the same
  13.9 kWh/100km WLTP efficiency as the Long Range RWD.
  
  Key advantages:
  - World's most aerodynamic EV (Cd 0.21)
  - 18-minute 10-80% charging (800V architecture)
  - Excellent 446km WLTP range from 53kWh battery
  - 125kg lighter than Long Range (better handling)
  - €8,000-10,000 cheaper than Long Range
  - Same premium features and technology
  - V2L standard (3.6kW external power)
  - Heat pump standard (cold weather efficiency)
  - World Car of the Year 2023 winner
  
  Trade-offs vs Long Range RWD:
  - 168km less WLTP range (446 vs 614km, 73% capacity = 72% range)
  - 17kW less power (151 vs 168kW, adequate for daily driving)
  - 1.1s slower 0-100 km/h (8.5 vs 7.4s, still quick)
  - Lower DC peak power (180 vs 233kW, but same 18-min charge time)

competitive_notes: >
  Competes favorably with:
  - Tesla Model 3 RWD (€40,990): Similar price, Ioniq 6 has better range (446 vs 420km),
    faster DC charging (18 vs 27 min 10-80%), V2L, more premium interior
  - Polestar 2 Standard (€45,900): Ioniq 6 is cheaper, better range (446 vs 442km),
    faster charging (18 vs 35 min), better aerodynamics
  - BMW i4 eDrive35 (€52,900): Ioniq 6 is €10,000+ cheaper, similar range (446 vs 483km),
    faster charging, more tech features
  - Mercedes EQE 250 (€69,000): Ioniq 6 is €25,000+ cheaper, similar efficiency,
    faster charging, better value

