  notes: >
    The Ioniq 6 Standard Range demonstrates that smaller batteries can deliver
    excellent range when paired with outstanding aerodynamics. The Cd 0.21 drag
    coefficient (best in production) enables 446km WLTP from just 53kWh - that's
    8.4 km/kWh efficiency! The 800V E-GMP architecture maintains fast charging
