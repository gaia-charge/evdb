notes: 'The 2025 Volvo EC40 Single Motor Extended Range brings significant upgrades
  over the 2024 model: larger 82 kWh battery (up from 72 kWh), 200 kW DC charging
  (up from 150 kW), increased motor power to 272 hp (up from 238 hp), and 5G connectivity.
  WLTP range jumps to 590 km (from 530 km). The EC40''s coupe roofline gives it a
  0.30 Cd advantage over the EX40 (0.33), translating to meaningful range benefits.
  Remains leather-free with Nordico sustainable interior. Built at Volvo''s Ghent
  plant in Belgium. Competes with Tesla Model Y RWD, BMW iX3, and Polestar 2.

