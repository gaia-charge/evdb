  notes: |
    2025 model year update for the Mercedes-Benz EQA 250+.
    Key changes from 2024:
    - 10.25-inch instrument cluster now standard (was optional)
    - KEYLESS-GO now standard
    - Wireless smartphone charging now standard
    - Heated front seats now standard
    - Updated MBUX software with improved voice control
    - MBUX Superscreen option (dual 12.3-inch displays)
    - Wireless Apple CarPlay / Android Auto standard
    - New trim structure: Progressive replaces Electric Art
    - Revised color palette with new options
    
    Powertrain and battery unchanged from 2024 (66.5 kWh, 140 kW, FWD).
    Continues on MFA2 platform. Expected to be replaced by next-gen MMA platform EQA in 2026.

