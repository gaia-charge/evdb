  notes: "2026 model year brings improved battery capacity (85kWh total, 80kWh usable)\
    \ and \nenhanced DC charging performance up to 150kW. The Q4 40 e-tron remains\
    \ the most\nefficient variant with excellent range and lowest cost.\n\nRear motor\
    \ upgraded to more powerful unit (210kW vs 150kW in 2024) with improved\ntorque\
    \ (545Nm vs 310Nm) for better acceleration (7.0s vs 8.5s 0-100km/h).\n\nHeat pump\
    \ now standard across all Q4 variants for better winter efficiency.\nUpdated MMI\
    \ system with AI-powered voice assistant and improved route planning.\n\nMost\
    \ popular Q4 variant in Germany and other European markets, particularly among\n\
    company car drivers seeking maximum range and efficiency without AWD premium.\n\
    \nWith 590km WLTP range (505km real-world), the Q4 40 2026 offers class-leading\n\
    efficiency in the compact premium SUV segment.\n"
