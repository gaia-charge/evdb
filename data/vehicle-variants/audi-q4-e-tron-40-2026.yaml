description: |
  The Q4 40 e-tron 2026 is Audi's base rear-wheel drive compact electric SUV,
  featuring an upgraded 85kWh battery pack and improved charging performance.
  
  2026 model year updates include:
  - Larger 85kWh battery (up from 82kWh) with 80kWh usable
  - Improved DC charging to 150kW peak (400V architecture)
  - Updated MMI infotainment with enhanced AI features
  - New exterior styling with revised LED lighting
  - Improved heat pump efficiency for winter range
  - Enhanced matrix LED headlights (optional)
  
  The RWD configuration provides excellent efficiency and range while maintaining
  good performance. Ideal for buyers who don't need AWD and want maximum range.

