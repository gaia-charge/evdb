id: genesis-gv60-sport-plus-awd-2024
name: "Sport Plus AWD"
model_id: genesis-gv60
model_year: 2024
trim_level: Sport Plus

description: |
  Genesis GV60 Sport Plus AWD is the most popular mid-range variant, offering excellent
  balance of performance, luxury, and technology. Features dual-motor AWD with 365 hp
  (270 kW) combined output delivering exhilarating 5.0-second 0-100 km/h acceleration
  while maintaining respectable 466 km WLTP range. Sport Plus includes comprehensive
  standard equipment: Bang & Olufsen 17-speaker premium audio, Nappa leather quilted
  seats with heating/ventilation/massage, panoramic sunroof, AR head-up display, Face
  Connect biometric authentication, Crystal Sphere electronic shift dial, Highway Driving
  Assist 2, Remote Smart Parking Assist 2, and Vehicle-to-Load capability. E-GMP platform
  with 800V architecture enables 10-80% charging in just 18 minutes at 350 kW DC stations.
  Electronic Limited Slip Differential enhances cornering dynamics and all-weather traction.

