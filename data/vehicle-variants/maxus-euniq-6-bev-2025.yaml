overview: 'The MAXUS Euniq 6 BEV is the pure electric variant of SAIC''s mid-size
  SUV. With a 70 kWh battery and single front motor producing 130 kW (177 PS), it
  offers 354 km WLTP range. The interior is spacious with 754 liters of trunk space
  and comprehensive standard equipment. Main limitation is the DC charging speed capped
  at 75 kW, well below class average. Priced at €53,491 in Germany.

