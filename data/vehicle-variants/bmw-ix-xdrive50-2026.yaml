notes: "2026 model year brings significant improvements to BMW's flagship electric SUV. Battery capacity increased from 105.2kWh to 109kWh usable, providing 25km additional WLTP range. DC fast charging improved to 210kW peak (from 200kW). New BMW Operating System 9.5 includes enhanced AI assistant with natural language processing and context awareness. V2G and V2H capabilities now standard in Europe. Improved aerodynamics and efficiency (19.2 kWh/100km vs 19.8) thanks to new heat pump generation and optimized thermal management. Highway Assistant now allows hands-free driving on selected German Autobahn sections with driver monitoring. Real-world range of 570km makes it excellent for long-distance travel. Class-leading 2,500kg towing capacity unchanged. Competes with Mercedes-Benz EQS SUV, Audi Q8 e-tron, Tesla Model X. Popular choice for executives and families wanting premium electric SUV with excellent range and technology."

