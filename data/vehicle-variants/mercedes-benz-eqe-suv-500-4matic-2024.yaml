id: mercedes-benz-eqe-suv-500-4matic-2024
name: Mercedes-Benz EQE SUV 500 4MATIC (2024)
model_id: mercedes-benz-eqe-suv
model_year: 2024
variant_name: "500 4MATIC"
trim_level: performance

battery:
  usable_kwh: 90.6
  total_kwh: 96.0
  chemistry: NCM
  cells_config: "288s2p (576 cells)"
  supplier: CATL
  form_factor: pouch
  warranty_years: 10
  warranty_km: 250000
  warranty_capacity_percent: 70
  notes: >
    Large 90.6kWh usable capacity. NCM (Nickel Cobalt Manganese) chemistry from 
    CATL. Liquid thermal management with heat pump. Battery preconditioning 
    available for optimal DC fast charging performance. Same battery as other 
    variants, performance comes from more powerful motors.

range:
  wltp_km: 479
  wltp_city_km: 625
  wltp_highway_km: 395
  epa_km: null
  epa_miles: null
  real_world_km: 415
  notes: >
    WLTP range of 479km is reduced due to higher power output and performance 
    focus. Real-world range around 415km in mixed driving. The more powerful 
    motors consume more energy, especially under spirited driving. Winter range 
    approximately 320-350km.

charging:
  ac:
    max_power_kw: 11
    plug_type: Type2
    phases: 3
    charge_time_0_100_hours: 9.0
    notes: >
      Standard 11kW AC charging (3-phase, 16A). Optional 22kW onboard charger 
      available but rarely utilized due to limited 22kW charging infrastructure. 
      Mercedes me Charge provides access to 600,000+ charging points globally.
      
  dc:
    max_power_kw: 170
    plug_type: CCS2
    charge_time_10_80_percent_minutes: 32
    charge_curve:
      - soc_percent: 10
        power_kw: 170
      - soc_percent: 20
        power_kw: 170
      - soc_percent: 30
        power_kw: 165
      - soc_percent: 40
        power_kw: 150
      - soc_percent: 50
        power_kw: 135
      - soc_percent: 60
        power_kw: 115
      - soc_percent: 70
        power_kw: 90
      - soc_percent: 80
        power_kw: 65
    notes: >
      Peak DC fast charging at 170kW. 400V architecture with battery 
      preconditioning. Typical 10-80% charge takes 32 minutes. Mercedes me 
      Charge app integrates with IONITY and other high-power charging networks.

bidirectional:
  v2l: false
  v2h: false
  v2g: false
  notes: >
    Bidirectional charging not currently available but Mercedes-Benz has 
    announced it will come to future models/updates.

motors:
  count: 2
  type: permanent_magnet
  layout: front_and_rear
  total_power_kw: 300
  total_power_hp: 408
  total_torque_nm: 858
  drive_type: AWD
  notes: >
    Dual high-performance permanent magnet synchronous motors (PSM) - one on 
    each axle. Significantly more powerful than 350 variants. All-wheel drive 
    with variable torque distribution. Performance-oriented tuning prioritizes 
    acceleration and dynamics.

performance:
  acceleration_0_100_kmh_seconds: 4.9
  top_speed_kmh: 210
  notes: >
    Impressive acceleration for a luxury SUV - sub-5 second 0-100 km/h. 
    All-wheel drive provides excellent traction for launching. Optional rear-axle 
    steering (up to 10 degrees) dramatically improves maneuverability. Standard 
    AIRMATIC air suspension with sport-tuned adaptive damping.

efficiency:
  wltp_kwh_per_100km: 23.4
  real_world_kwh_per_100km: 26.1
  energy_label_eu: C
  notes: >
    Higher consumption due to powerful motors and performance focus. Real-world 
    consumption around 26.1 kWh/100km in mixed driving, increasing significantly 
    under spirited driving. Trade-off for impressive performance in SUV package.

weight:
  curb_weight_kg: 2685
  gross_vehicle_weight_kg: 3235
  payload_kg: 550

adas:
  level: 2_plus
  features:
    - Adaptive Cruise Control (DISTRONIC)
    - Active Lane Keeping Assist
    - Active Blind Spot Assist
    - Active Brake Assist
    - Traffic Sign Assist
    - Active Distance Assist DISTRONIC
    - Active Steering Assist
    - Active Emergency Stop Assist
  notes: >
    Level 2+ driver assistance standard. Optional DRIVE PILOT (Level 3) 
    available in Germany for hands-free highway driving up to 60 km/h in traffic. 
    360-degree camera and parking assist standard.

features:
  standard:
    - AIRMATIC air suspension (sport-tuned)
    - 4MATIC all-wheel drive
    - Rear-axle steering (optional, up to 10°)
    - AMG Line exterior (often standard)
    - Burmester 3D Surround Sound (optional)
    - Ambient lighting with 64 colors
    - Keyless entry and start
    - Dual-zone automatic climate control
    - Heat pump
    - LED Intelligent Light System
    - 12.8" OLED touchscreen
    - Wireless smartphone charging
    - 360-degree camera
    - Power tailgate
    - 21" AMG alloy wheels
  optional:
    - MBUX Hyperscreen (56" curved glass display)
    - Burmester High-End 4D Surround Sound
    - AMG Night Package
    - Panoramic sliding sunroof
    - Executive rear seat package
    - DRIVE PILOT (Level 3 autonomy, Germany only)
    - 22kW AC onboard charger
    - Trailer hitch (1800kg towing)
    - AMG Performance steering wheel

environmental:
  lifecycle_co2_kg: null
  production_location: "Tuscaloosa, Alabama, USA"
  battery_production: "Kamenz, Germany (Mercedes-Benz subsidiary Accumotive)"
  notes: >
    Built at Mercedes-Benz Tuscaloosa plant in Alabama, USA. Batteries produced 
    at Mercedes-Benz subsidiary Accumotive in Kamenz, Germany. Mercedes-Benz 
    aims for carbon-neutral production.

