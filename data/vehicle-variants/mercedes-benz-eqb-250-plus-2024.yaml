  notes: 'Mercedes-Benz EQB 250+ is the FWD variant with the largest battery (70.5kWh).

    Offers best range of all EQB variants (474km WLTP).


    Key features:

    - Optional third row seats (7-seater configuration)

    - 495L trunk (5 seats) / 190L (7 seats)

    - Good family SUV with premium feel

    - Proven MFA2 platform


    Competes with:

    - Tesla Model Y (5-seat, better performance/range)

    - BMW iX1 (5-seat, similar specs)

    - Volkswagen ID.4 (5-seat, better value)


    Strengths:

    - Only premium 7-seat compact EV

    - Mercedes brand prestige

    - Good real-world range (~405km)

    - Standard heat pump


    Weaknesses:

    - Modest 100kW DC charging

    - Third row very tight

    - Higher price than competitors

    - No frunk

    '
