notes: 'Modern reinterpretation of the iconic Renault 5 from the 1970s. Built on dedicated  AmpR
  Small platform designed for affordable EVs. Base Evolution 40 model offers  300km
  WLTP range at competitive €25,000 price point. Uses LFP (Lithium Iron Phosphate)  battery
  chemistry for cost reduction and durability. Features unique Reno avatar  assistant
  with personality. Retro-inspired exterior design with modern interior.  Compact
  3.92m length perfect for city driving with tight 10.3m turning circle.  No heat
  pump on base model (optional on higher trims). Strong competitor to Citroën  ë-C3
  and Dacia Spring with better design and technology. 80kW DC fast charging  adequate
  for occasional long trips. Excellent value proposition in affordable EV segment.

  '
