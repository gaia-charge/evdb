description: |
  The Lynk & Co 02 More is the fully-equipped premium trim. Same 200 kW powertrain and 
  66 kWh battery, but with 445 km WLTP range (slightly higher due to more efficient 20" 
  wheels). Key upgrades include 22 kW 3-phase AC charging, 20" alloy wheels, panoramic 
  glass roof, Harman Kardon premium audio, heated steering wheel, and power-adjustable 
  driver's seat with memory. Offers strong competition to Volvo EX30 Plus and VW ID.3 Pro S.

