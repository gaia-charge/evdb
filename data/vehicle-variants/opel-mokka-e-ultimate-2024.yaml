  notes: "The Opel Mokka-e Ultimate is the top trim level with premium features including\
    \ IntelliLux \nLED Matrix headlights, 12\\\" digital cluster, leather seats, panoramic\
    \ sunroof, and adaptive \ncruise control.\n\nMechanically identical to Peugeot\
    \ e-2008 GT but with Opel's distinctive \"Vizor\" design \nlanguage and slightly\
    \ lower pricing (typically €1,000-2,000 less).\n\nUltimate trim adds significant\
    \ premium features over base Edition, making it competitive \nwith Peugeot e-2008\
    \ GT while maintaining Opel's value positioning.\n"
