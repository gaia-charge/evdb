  notes: 'Entry-level electric estate car in Europe.

    50.3kWh LFP battery provides decent 320km WLTP range.

    Front-wheel drive (unlike MG4''s RWD).

    Best-in-class cargo space (479L) for this price point.

    Slightly slower DC charging (87kW max) than MG4.

    Ideal for fleet buyers and families needing practicality over performance.

    7-year/175,000km battery warranty.

    '
