notes: |
  The 2025 Mercedes-Benz EQS 450+ receives minor software updates and efficiency improvements.
  Main updates for 2025 model year:
  - Slightly improved WLTP range: 785km (up from 782km in 2024) through software optimization
  - Refined MBUX infotainment system with enhanced voice recognition
  - Updated ADAS features with improved Active Distance Assist DISTRONIC
  - Battery management system optimization for better cold-weather performance
  
  Key strengths remain unchanged:
  - World's most aerodynamic production car (Cd 0.20)
  - 785km WLTP range (655km real-world)
  - 107.8kWh battery (largest in flagship sedan segment)
  - Rear-axle steering (10.9m turning circle despite 5.2m length)
  - 10-year/250,000km battery warranty
  
  Competes with:
  - BMW i7 xDrive60 2025
  - Porsche Taycan 4S 2025
  - Tesla Model S Long Range 2025
  - Lucid Air Touring 2025

