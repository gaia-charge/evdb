  WLTP range from a 53kWh battery, enabled by class-leading Cd 0.21 aerodynamics.
  The 800V architecture maintains 18-minute 10-80% charging. At 125kg lighter than
  Long Range, it achieves the same 13.9 kWh/100km WLTP efficiency. The 2025 model
  year adds refined software, new Biophilic Blue Pearl color, and updated connected
  services. Powertrain unchanged from 2024.

