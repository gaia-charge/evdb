notes: 2025 model year brings software updates including BMW Operating System 9.0
  with enhanced voice assistant and improved navigation. BMW's entry-level electric
  SUV (most affordable BMW EV). Dual-motor AWD standard (no RWD variant available).
  Built on FAAR platform (shared with gasoline/diesel X1). 400V architecture limits
  DC charging to 130kW. Heat pump standard. Excellent city range (545km WLTP) for
  urban use. Popular in Germany as premium compact electric SUV. Competes with Audi
  Q4 40 e-tron, Mercedes EQA 350, Volvo XC40 Recharge. Real-world 370km range adequate
  for daily commuting.
