overview: >
  The XPENG G9 Performance AWD is the flagship variant with dual motors producing 423kW (575 PS) and 695 Nm torque, enabling 0-100 km/h in 4.2 seconds. It shares the 93.1kWh LFP battery with the Long Range but adds a front asynchronous motor for AWD capability. Unique to this variant: air suspension front and rear, 21-inch wheels, and a slightly lower ride height (1670mm vs 1680mm). DC charging matches the Long Range at up to 525kW. Despite the extra power, WLTP range remains a strong 540km.

