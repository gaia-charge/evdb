notes: 'The BMW i7 eDrive50 is the RWD base variant of BMW''s electric flagship sedan.

  With 544 hp, 101.7 kWh battery, and 625 km WLTP range, it offers impressive

  performance and autonomy. The i7 is positioned as a technology showcase

  with features like the 31" Theatre Screen, Bowers & Wilkins Diamond audio,

  and Executive Lounge seating. Built on the CLAR WE platform shared with

  the combustion 7 Series. Targets Mercedes EQS 450+ and Tesla Model S buyers

  seeking traditional luxury sedan format with cutting-edge technology.

