  combined 230 kW (313 hp). Based on the same platform as the iX1 but with a sportier
  coupe-SUV body. 64.8 kWh usable battery provides 449 km WLTP range. 130 kW DC fast
  charging. Assembled in Regensburg, Germany. Premium interior with BMW Curved Display
