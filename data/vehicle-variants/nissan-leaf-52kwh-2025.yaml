notes: 'The all-new 2025 Nissan LEAF is a complete reinvention on the CMF-EV platform,
  shared with Renault Megane E-Tech and Scenic E-Tech. The 52 kWh Standard Range offers
  436 km WLTP range with excellent 13.8 kWh/100km efficiency. Key upgrades over the
  previous generation include CCS2 fast charging (up to 150kW), active liquid battery
  cooling, Google built-in infotainment, and V2G/V2H bidirectional charging via CCS.
  The new LEAF is larger, more refined, and far more competitive than its predecessor.

