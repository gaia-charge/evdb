description: 'The Škoda Enyaq iV 80x adds all-wheel drive to the popular 82kWh battery
  platform,

  offering enhanced traction, stability, and performance. With dual motors producing

  265 hp combined, it accelerates significantly faster than the RWD 80 variant while

  maintaining impressive range (509 km WLTP).


  The "x" designation indicates all-wheel drive across Škoda''s electric lineup. The
  80x

  combines practicality with performance, making it ideal for families who want the

  security of AWD in winter conditions or those seeking sportier driving dynamics

  without stepping up to the vRS performance flagship.


  Like all Enyaq variants, the 80x benefits from the 2024 facelift with improved ME3

  infotainment software, ChatGPT-powered Laura assistant, and more physical controls.

  '
