  notes: |
    2024 facelift brings significant software improvements (ME3 vs ME2). 135kW DC charging upgrade from 125kW.
    Dual-motor AWD system provides excellent traction and stability. Front asynchronous motor + rear permanent
    magnet motor configuration balances efficiency with performance. 265 hp combined output vs 286 hp RWD.
    0-100 km/h in 6.9s vs 8.5s RWD (1.6s faster). Range penalty of 61 km WLTP vs RWD (509 vs 570 km).
    Standard 20-inch wheels vs 19-inch on RWD. Weighs 130 kg more than RWD variant.
    Popular choice in Nordic markets and mountainous regions. Competes with VW ID.4 GTX, Ioniq 5 AWD, EV6 AWD.
