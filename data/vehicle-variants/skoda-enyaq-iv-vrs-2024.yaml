notes: 'Škoda Enyaq iV vRS - The performance flagship of the Enyaq range. Features
  dual motors producing 220kW (299hp) combined, achieving 0-100 km/h in 6.5 seconds.
  Built on VW MEB platform with 82 kWh battery offering 513 km WLTP range (430 km
  real-world). Sport suspension sits 15mm lower than standard for improved handling.
  Distinctive vRS styling with black exterior accents, red brake calipers, and sports
  interior. 135kW DC fast charging (10-80% in 36 minutes). Can tow 1200kg. Premium
  Canton sound system standard. Target buyers: enthusiasts wanting performance in
  practical electric SUV package without stepping up to Audi SQ4 e-tron pricing. Fastest
  Škoda EV available. Also available in Coupé body style (Enyaq Coupé vRS with Cd
  0.26 and slightly better range).

