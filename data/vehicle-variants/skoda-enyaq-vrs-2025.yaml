description: |
  The 2025 Škoda Enyaq vRS is the performance flagship of the Enyaq range, now with the 2025 Modern Solid
  design refresh. Dual motors deliver 220kW (299ps) with 460Nm torque, sprinting 0-100 km/h in 6.5 seconds.
  The 82kWh battery provides 536km WLTP range, balancing performance with real-world usability.

  The vRS gets unique design elements: gloss black grille surround, 20-inch wheels standard, sport suspension
  (15mm lower), progressive steering, vRS-specific bumpers and diffuser, and red brake calipers. Interior
  features vRS sport seats, carbon-effect trim, and vRS-branded steering wheel.

