  end: null
trim_level: long-range
market_position: mainstream

description: |
  The Long Range Dual Motor is the mainstream variant of the Polestar 3, featuring 
  all-wheel drive with dual electric motors and a large 111kWh battery pack providing 
  up to 610km WLTP range.
  
  This variant combines luxury SUV comfort with strong performance (0-100 km/h in 5.0s) 
  and practical range for long-distance travel. Standard features include air suspension, 
  LiDAR sensors for advanced driver assistance, Bowers & Wilkins audio, and Google 
  Automotive Services.
  
  The dual-motor AWD system provides excellent traction in all conditions, while the 
  air suspension ensures a comfortable ride. Fast charging at up to 250kW allows 
  10-80% charging in approximately 30 minutes.

