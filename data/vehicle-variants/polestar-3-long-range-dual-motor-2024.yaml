description: "The Long Range Dual Motor is the mainstream variant of the Polestar\
  \ 3, featuring \nall-wheel drive with dual electric motors and a large 111kWh battery\
  \ pack providing \nup to 610km WLTP range.\n\nThis variant combines luxury SUV comfort\
  \ with strong performance (0-100 km/h in 5.0s) \nand practical range for long-distance\
  \ travel. Standard features include air suspension, \nLiDAR sensors for advanced\
  \ driver assistance, Bowers & Wilkins audio, and Google \nAutomotive Services.\n\
  \nThe dual-motor AWD system provides excellent traction in all conditions, while\
  \ the \nair suspension ensures a comfortable ride. Fast charging at up to 250kW\
  \ allows \n10-80% charging in approximately 30 minutes.\n"
