overview: >
  The Alpine A290 GTS is the top-performance variant of Alpine's electric hot hatch, featuring a more
  powerful 160kW (220hp) front motor that delivers a 6.4s 0-100 km/h time. The GTS adds Brembo front
  brakes, Sabelt bucket seats, a Torsen limited-slip differential, and launch control. It shares the
  52kWh battery with the GT but trades some range for enhanced performance. The GTS is designed for
  driving enthusiasts who want the most dynamic Alpine A290 experience.

