overview: 'The GWM ORA 07 Pure RWD is the base variant with a single rear motor producing
  150 kW (204 PS) and a 63 kWh battery providing 340 km WLTP range. The sleek fastback
  design with a 0.236 Cd coefficient helps efficiency. Standard equipment includes
  12.3-inch touchscreen, Harman Kardon audio, panoramic roof, heated/ventilated front
  seats, and comprehensive ADAS. DC charging at up to 90 kW is acceptable but not
  class-leading. Starting from approximately €43,990 in Germany.

  '
