  notes: 'Entry-level MG4 with 51kWh LFP battery.

    Excellent value - one of the cheapest EVs in Europe with decent range.

    RWD layout gives surprisingly good driving dynamics.

    LFP battery allows charging to 100% without degradation concerns.

    Single-phase AC charging (6.6kW) is a limitation for European markets.

    DC charging up to 117kW is competitive for the price point.

    '
