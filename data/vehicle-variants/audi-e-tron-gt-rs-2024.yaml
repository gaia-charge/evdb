notes: |
  2024 model year brings minor updates to the RS e-tron GT:
  - Slightly improved battery thermal management
  - Updated Audi MMI software (latest version)
  - New color options
  - Standard equipment enhancements
  
  RS e-tron GT is the top-performance variant, offering 475kW (646hp) in boost mode with launch control.
  Standard mode provides 440kW (598hp) for everyday driving.
  
  The 800V architecture enables exceptional DC fast charging:
  - 270kW peak power (5-30% SoC)
  - 5-80% charge in just 22.5 minutes
  - 100km range in approximately 5 minutes
  
  Performance highlights:
  - 0-100 km/h in 3.3 seconds
  - 0-200 km/h in 11.4 seconds
  - 250 km/h top speed (electronically limited)
  - 830 Nm torque (instantly available)
  
  Built alongside Porsche Taycan at Stuttgart-Zuffenhausen factory.
  
  Key differences vs Porsche Taycan Turbo S:
  - €15-20k less expensive
  - More comfortable suspension tuning (less track-focused)
  - More interior space and cargo volume
  - Audi Virtual Cockpit vs Porsche's curved display
  - More traditional luxury sedan feel vs sports car character
  
  Ceramic brakes (PCCB) available as option for maximum performance.
  Rear-axle steering (dynamic all-wheel steering) available for improved agility.
  
  Target customer: Those wanting Taycan performance with Audi refinement and value.

