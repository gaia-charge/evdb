  thermal_management: passive_air
  notes: '40kWh battery pack is the base/entry variant of second-generation LEAF.
    WARNING: Passive air cooling (no liquid thermal management) can lead to battery
    degradation in hot climates or during frequent DC fast charging. This is a known
    limitation vs competitors with active cooling. Real-world reports show ~4-5% capacity
    loss per year in hot climates, ~2-3% in moderate climates. However, 40kWh variant
    degrades slightly slower than 62kWh due to less battery stress.

    '
