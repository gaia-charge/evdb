  notes: 'The base 40kWh LEAF is the most affordable variant of the world''s first
    mass-market EV. It offers adequate 270km WLTP range for daily commuting and urban
    driving at entry-level pricing. Proven reliability with 650,000+ LEAFs sold worldwide
    since 2010. V2G/V2H capability pioneered by Nissan is unique selling point. Main
    weaknesses are CHAdeMO charging (vs CCS2), passive battery cooling leading to
    faster degradation, only 50kW DC charging, and no heat pump causing significant
    winter range loss. Best suited for buyers prioritizing proven reliability, low
    price, and urban/commute driving over maximum range and fast charging speed.

    '
