  notes: "The Polestar 4 Long Range Dual Motor is the performance AWD variant offering\
    \ \nexhilarating 544 hp and supercar-like 3.8s 0-100 km/h acceleration while \n\
    maintaining excellent 590 km WLTP range and sophisticated Scandinavian luxury.\n\
    \nKey highlights:\n- 400 kW (544 hp) / 686 Nm torque from dual permanent magnet\
    \ motors\n- 3.8s 0-100 km/h acceleration (sports car territory!)\n- 590 km WLTP\
    \ range despite AWD performance\n- Revolutionary no-rear-window design with HD\
    \ camera system\n- 15.4\" portrait touchscreen - largest in premium SUV segment\n\
    - Dual-chamber air suspension standard for exceptional ride quality\n- Harman\
    \ Kardon 16-speaker premium audio standard\n- Near-perfect 50/50 weight distribution\n\
    \nThe no-rear-window design is not a gimmick - it improves aerodynamics (Cd 0.26),\n\
    increases rear headroom, and the HD camera system provides better visibility in\n\
    rain/night conditions than traditional mirrors. The camera feed is displayed on\n\
    the interior mirror position.\n\nTarget buyers: Performance enthusiasts seeking\
    \ practical SUV coupe, tech-savvy\nbuyers wanting Android Automotive OS integration,\
    \ design-conscious customers\nappreciating Scandinavian minimalism, company car\
    \ drivers benefiting from 0.25%\nGerman tax rate (price under €70k).\n\nCompetes\
    \ with BMW iX2 xDrive30, Mercedes EQE SUV, Audi Q6 e-tron quattro, Tesla\nModel\
    \ Y Performance, Genesis Electrified GV70 AWD. Polestar 4 offers best\ncombination\
    \ of design innovation, technology integration, and driving dynamics.\n\nReal-world\
    \ performance: 490km mixed driving range, excellent highway efficiency\nthanks\
    \ to low drag coefficient, 200kW DC charging enables 10-80% in 30 minutes,\none-pedal\
    \ driving with strong regenerative braking.\n"
