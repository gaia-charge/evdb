notes: |
  The ID.3 Pro S is the long-range variant of VW's compact electric hatchback.
  With 77 kWh battery, it offers 558 km WLTP range and fast DC charging up
  to 170 kW. The 2024 model year brought facelift improvements: faster charging
  (170 kW vs 145 kW), updated software (ID. Software 3.2), more physical
  buttons, and slightly improved range. Built on MEB platform at VW's
  carbon-neutral Zwickau factory in Germany. Positioned as the electric
  successor to the iconic Golf.

