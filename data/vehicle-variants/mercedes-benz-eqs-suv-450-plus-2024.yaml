notes: 'The Mercedes-Benz EQS SUV 450+ is the entry-level variant of Mercedes'' electric
  luxury SUV flagship.

  Despite being the "base" model, it offers 660km WLTP range (550km real-world) from
  a massive 118kWh battery

  and includes most luxury features as standard (AIRMATIC air suspension, rear-axle
  steering, Burmester audio).


  Key strengths:

  - Excellent aerodynamics for luxury SUV (Cd 0.26) enables strong efficiency and
  range

  - 660km WLTP range (550km real-world) - excellent for luxury SUV segment

  - 118kWh battery (largest in SUV segment, bigger than BMW iX xDrive50, Audi Q8 e-tron)

  - Rear-axle steering reduces turning circle to 11.9m (despite 5.1m length)

  - MBUX Hyperscreen optional (56-inch curved display, standard on 580 4MATIC)

  - 10-year/250,000km battery warranty (best-in-class)

  - Optional 7-seat configuration (unique in luxury EV SUV segment)

  - Better towing capacity than sedan: 1,800kg vs 750kg

  - Off-road mode with transparent hood camera (virtual view through hood)

  - Built in USA (Tuscaloosa, Alabama) - first Mercedes EQ model made in America


  Key weaknesses:

  - 400V architecture limits DC charging to 200kW (vs 800V competitors: BMW iX 195kW)

  - 31-minute 10-80% charging slower than some rivals (BMW iX: 35 min, similar)

  - No V2G/V2L bidirectional charging (unlike Korean competitors)

  - Only 6.7s 0-100 acceleration (vs BMW iX: 4.6s, Tesla Model X: 3.9s)

  - Heavy at 2,735kg (vs BMW iX: 2,585kg, Tesla Model X: 2,445kg)

  - No 22kW AC charging standard (optional)

  - Expensive: €115,000 base (vs BMW iX xDrive50: €105,000, Audi Q8 e-tron 55: €90,000)


  Competes with:

  - BMW iX xDrive50 (€105,000): 630km range, faster (4.6s), more tech-forward design

  - Audi Q8 e-tron 55 quattro (€90,000): 582km range, less expensive, less luxurious

  - Tesla Model X Long Range (€105,000): 560km range, faster (3.9s), 7-seat standard,
  better software

  - Porsche Cayenne Turbo S E-Hybrid (€181,000): PHEV not pure EV, sportier


  The EQS SUV 450+ targets buyers prioritizing ultimate luxury, space, and versatility
  over performance and charging speed.

  Most popular configuration: 450+ with MBUX Hyperscreen and 7-seat package (~€125,000).


  Real-world efficiency: 21.5 kWh/100km (vs WLTP 19.4) confirmed by independent testing.

  Real-world range: 550km mixed driving (vs 660km WLTP, 483km EPA).

