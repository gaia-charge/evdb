description: 'The Long Range Dual Motor is the performance-oriented variant of the
  2025 Polestar 2,

  featuring all-wheel drive with dual electric motors and a 78kWh battery pack.


  2025 model year updates include:

  - Revised exterior styling with new front and rear design

  - Updated interior with physical climate controls

  - Improved Google Automotive Services integration

  - Enhanced DC charging up to 205kW peak

  - New Pilot Assist features with lane change assistance

  - Optimized AWD torque vectoring for improved handling


  The dual-motor AWD configuration delivers 310kW (421hp) with excellent traction

  and dynamic handling. The Performance Pack option adds Öhlins dampers, Brembo brakes,

  and 20-inch forged wheels.

  '
