notes: |
  The Mercedes-Benz EQS 450+ is the entry-level variant of Mercedes' electric flagship sedan.
  Despite being the "base" model, it offers 782km WLTP range (650km real-world) from a massive 107.8kWh battery
  and includes most luxury features as standard (AIRMATIC air suspension, rear-axle steering, Burmester audio).
  
  Key strengths:
  - World's most aerodynamic production car (Cd 0.20) enables exceptional efficiency and range
  - Massive 782km WLTP range (650km real-world) - best in flagship sedan segment
  - 107.8kWh battery (largest in database, larger than Tesla Model S, BMW i7)
  - Rear-axle steering reduces turning circle to 10.9m (despite 5.2m length)
  - MBUX Hyperscreen optional (56-inch curved display, standard on 580 4MATIC)
  - 10-year/250,000km battery warranty (best-in-class)
  - Factory 56 carbon-neutral production
  
  Key weaknesses:
  - 400V architecture limits DC charging to 200kW (vs 800V competitors: Taycan 270kW, Ioniq 5/6 235kW)
  - 31-minute 10-80% charging slower than 800V rivals (Ioniq 6: 18 min, Taycan: 22 min)
  - No V2G/V2L bidirectional charging (unlike Korean competitors)
  - Only 6.2s 0-100 acceleration (vs Taycan 4S: 4.0s, i7: 4.7s)
  - Heavy at 2,480kg (vs Model S: 2,190kg)
  - Limited towing capacity: 750kg (vs Model S: 1,600kg, i7: 2,000kg)
  - No 22kW AC charging standard (optional €1,190)
  
  Competes with:
  - BMW i7 xDrive60 (€135,700): More traditional luxury, faster charging (195kW), better towing (2,000kg)
  - Porsche Taycan 4S (€118,737): Sportier (4.0s 0-100), 800V fast charging (270kW), less practical
  - Tesla Model S Long Range (€94,990): Faster (3.2s 0-100), better software, less luxurious interior
  - Lucid Air Touring (€95,000): More range (883km EPA), faster charging (300kW), less brand prestige
  
  The EQS 450+ targets buyers prioritizing ultimate luxury, comfort, and range over performance and charging speed.
  Most popular configuration: 450+ with MBUX Hyperscreen (~€118,000) or AMG Line (~€122,000).
  
  Real-world efficiency: 16.8 kWh/100km (vs WLTP 15.6) confirmed by independent testing.
  Real-world range: 650km mixed driving (vs 782km WLTP, 547km EPA).

