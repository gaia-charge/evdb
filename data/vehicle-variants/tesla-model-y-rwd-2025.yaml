notes: 'RWD base variant - most affordable Model Y, volume seller (50%+ of sales).

  2025 model year with improved efficiency and range (475 km WLTP, up from 455 km).

  LFP battery (CATL): 100% charging recommended (no degradation), longer lifespan.

  62 kWh usable - sufficient for daily use and weekend trips.

  175 kW DC fast charging (26 min 10-80%) - practical for road trips.

  Made at Gigafactory Berlin (Europe) and Shanghai (Asia-Pacific).

  Access to Tesla Supercharger network (50,000+ chargers globally).

  Over-the-air updates add new features regularly.

  Optional 7-seater configuration available (+€3,000).

  Optional tow hitch: €1,000 (1,600kg capacity).

  Strong company car value in Germany: under €70k = 0.25% tax rate.

