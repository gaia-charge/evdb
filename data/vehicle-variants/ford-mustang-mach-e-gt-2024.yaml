notes: "The Mustang Mach-E GT is the high-performance variant, channeling Mustang's\
  \ \nsporting heritage into electric form. Dual permanent magnet motors deliver \n\
  360 kW (487 hp) and 860 Nm of instant torque, propelling the GT from 0-100 \nkm/h\
  \ in just 3.7 seconds. Despite the performance focus, range remains usable \nat\
  \ 490 km WLTP. GT-specific features include MagneRide dampers for adaptive \nsuspension,\
  \ Brembo brakes, 20-inch wheels, sport seats, unique styling \nelements, and GT-specific\
  \ drive modes. Ford's Intelligent Backup Power \nenables V2H/V2G capability. Includes\
  \ BlueCruise hands-free highway driving \n(subscription required).\n"
