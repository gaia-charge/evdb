notes: |
  The Mustang Mach-E GT is the high-performance variant, channeling Mustang's 
  sporting heritage into electric form. Dual permanent magnet motors deliver 
  360 kW (487 hp) and 860 Nm of instant torque, propelling the GT from 0-100 
  km/h in just 3.7 seconds. Despite the performance focus, range remains usable 
  at 490 km WLTP. GT-specific features include MagneRide dampers for adaptive 
  suspension, Brembo brakes, 20-inch wheels, sport seats, unique styling 
  elements, and GT-specific drive modes. Ford's Intelligent Backup Power 
  enables V2H/V2G capability. Includes BlueCruise hands-free highway driving 
  (subscription required).

version_changes:
  - version: "2024"
    changes: |
      Model year 2024 updates: Refined MagneRide tuning for better ride quality, 
      enhanced Track mode with optimized power delivery, SYNC 4A updates with 
      performance data logging, improved thermal management for sustained track 
      use, BlueCruise 1.2 with automatic lane change.

