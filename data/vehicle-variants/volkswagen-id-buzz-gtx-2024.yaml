notes: |
  VW ID.Buzz GTX is the performance flagship variant with dual-motor all-wheel drive delivering
  sports car acceleration (6.5s 0-100 km/h) in a practical electric van/MPV form factor.
  
  GTX variant features:
  - Dual-motor AWD system (80kW front AC induction + 170kW rear permanent magnet = 250kW/340hp total)
  - Sport-tuned suspension with adaptive damping (DCC)
  - GTX-specific exterior styling (red accents, GTX badges, 20"/21" wheels)
  - GTX interior with sport seats, red stitching, aluminum pedals
  - Enhanced stability control optimized for performance driving
  - Standard panoramic glass roof
  - Matrix LED headlights with IQ.Light
  
  Performance highlights:
  - 6.5s 0-100 km/h acceleration (fastest ID.Buzz variant)
  - 550Nm combined torque provides strong mid-range acceleration
  - AWD traction excellent for all-weather capability and family safety
  - 1,800kg towing capacity (same as RWD Pro Long)
  
  Efficiency trade-offs:
  - 21km less WLTP range vs RWD Pro Long (440km vs 461km) due to AWD efficiency penalty
  - 21.0 kWh/100km WLTP consumption vs 19.5 kWh/100km RWD (+7.7% penalty)
  - Real-world 370km mixed range still adequate for daily family use
  - 200kW DC fast charging same as RWD (28 minutes 10-80%)
  
  Target buyers:
  - Performance-oriented families wanting sports car acceleration in practical MPV
  - Winter region residents (Alps, Bavaria, Scandinavia) needing AWD safety
  - Enthusiasts who want GTX badge on electric van
  - Families prioritizing safety and all-weather capability over maximum range
  - Company car drivers who can justify GTX premium with 0.25% tax benefit
  
  Competes with:
  - Mercedes EQV 300 Long (€71,388, 351km range, less power 150kW/204hp)
  - VW ID.Buzz Pro Long RWD (€54,122, 21km more range, €11k cheaper, less power)
  - Opel/Vauxhall Vivaro-e Life (€51,000, shorter range but cheaper)
  - Ford E-Transit Custom (€55,000, commercial focus)
  
  GTX premium justified by:
  - Sports car acceleration (6.5s vs 10.2s RWD)
  - AWD all-weather capability vs FWD
  - Enhanced standard equipment (DCC suspension, sport seats, premium audio)
  - GTX brand cachet and exclusivity
  - Superior towing stability with AWD
  
  Ideal for: Performance-oriented families, winter region residents, enthusiasts wanting fastest
  electric van, company car drivers, those prioritizing acceleration and AWD over maximum range.
  
  Not ideal for: Budget-conscious buyers (€11k premium over RWD Pro Long), maximum range seekers
  (440km WLTP vs 461km RWD), efficiency-focused drivers (higher consumption).
  
  Built on MEB platform at VW Hannover factory, Germany. Standard wheelbase only (no long
  wheelbase GTX variant currently available). Available in 5-seat, 6-seat, and 7-seat
  configurations.

