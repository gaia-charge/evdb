motors:
  - position: rear
    type: PSM  # Permanent Magnet Synchronous Motor
    power_kw: 300
    power_hp: 408
    torque_nm: 345
    max_rpm: 16000
    cooling: liquid

suspension:
  front: Double wishbone, adaptive air suspension
  rear: Multi-link, adaptive air suspension
  dampers: PASM (Porsche Active Suspension Management) with adaptive dampers
  adjustable: true
  notes: |
    Adaptive air suspension standard (three-chamber system)
    PASM adaptive dampers with Normal, Sport, Sport Plus modes
    Ride height adjustable: Normal, Low (-22mm), High (+20mm for obstacles)
    
    Porsche sports car DNA: double wishbone front suspension (like 911) provides 
    precise steering and excellent handling dynamics.

brakes:
  front_mm: 360
  rear_mm: 358
  front_type: Ventilated disc
  rear_type: Ventilated disc
  caliper_pistons_front: 6
  caliper_pistons_rear: 4
