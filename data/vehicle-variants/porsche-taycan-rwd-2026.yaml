    connector_type: CCS
    time_10_80_percent_min: 22
    time_5_80_percent_min: 23
    peak_power_duration: Sustained from ~5% to 55% SoC
    notes: "Peak: 270kW DC (800V architecture, Porsche/Ionity chargers)\n10-80%: 22\
      \ minutes (ideal conditions, 350kW charger)\n\nThe 800V architecture is Taycan's\
      \ key advantage: minimal thermal losses during \ncharging enable sustained high\
      \ charging power. Most EVs with 400V systems can't \nmaintain high power due\
      \ to heat buildup - Taycan sustains 200+kW from 10-55% SoC.\n\nPorsche's Battery\
      \ Temperature Management actively preconditions the battery when \nnavigating\
      \ to a DC charger, ensuring optimal temperature for maximum charging speed.\n"
