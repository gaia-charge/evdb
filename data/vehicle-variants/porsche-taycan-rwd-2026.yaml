# Porsche Taycan RWD 2026
# Base Taycan with rear-wheel drive and updated 2026 specs
# Improved range and efficiency for model year 2026
# 800V ultra-fast charging architecture

id: porsche-taycan-rwd-2026
name: "RWD"
model_id: porsche-taycan
manufacturer_id: porsche
model_year: 2026
trim_level: Base
version: RWD

description: |
  The 2026 Porsche Taycan RWD (rear-wheel drive) is the entry-level Taycan 
  model, offering exceptional value while maintaining the core Taycan experience. 
  With 300kW (408hp) continuous power and improved efficiency for 2026, the base 
  Taycan delivers sports car performance with a WLTP range of up to 566km.
  
  For model year 2026, Porsche improved the Taycan's efficiency and range through 
  optimized motor control, improved aerodynamics, and updated battery management. 
  The base RWD model now achieves 17.6 kWh/100km in optimal conditions - excellent 
  efficiency for a performance sports sedan.
  
  Despite being the "base" model, the Taycan RWD includes Porsche's 800V architecture 
  enabling 270kW peak DC charging, rear-wheel drive for engaging driving dynamics, 
  adaptive air suspension, and the complete Porsche sports car experience. It's the 
  most efficient and longest-range Taycan variant for 2026.

# ============================================================================
# BATTERY & RANGE
# ============================================================================

battery:
  usable_kwh: 89.0
  total_kwh: 97.0
  chemistry: NMC  # Nickel Manganese Cobalt
  cells: pouch
  manufacturer: LG Energy Solution
  supplier: LG Energy Solution (South Korea)
  modules: 33
  cells_total: 396
  nominal_voltage: 725
  pack_voltage_range: "610-835V (800V architecture)"
  warranty_years: 8
  warranty_km: 160000
  warranty_capacity_percent: 70
  thermal_management: liquid-cooled
  heating: integrated battery heating
  preconditioning: true
  notes: |
    The 2026 Taycan uses Porsche's Performance Battery Plus as standard equipment 
    across the range. The 800V architecture enables ultra-fast DC charging with 
    minimal thermal losses. Battery preconditioning via navigation ensures optimal 
    charging temperature at arrival to DC fast charger.

range:
  wltp_km: 566
  wltp_city_km: 730
  wltp_highway_km: 475
  real_world_km: 485
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    WLTP: 495-566km (depending on wheel/tire configuration)
    Real-world: ~485km mixed driving in good conditions
    Winter range penalty: ~25-30% in cold weather (battery heating, cabin heating)
    Highway at 130 km/h: ~410km range (high speeds reduce efficiency)
    
    The 2026 model year brings improved efficiency through optimized motor control 
    and better aerodynamics, resulting in best-in-class Taycan range.

efficiency:
  wltp_kwh_per_100km: 17.6
  real_world_kwh_per_100km: 21.0
  real_world_conditions: "Mixed driving, 20°C ambient, normal driving style"
  notes: |
    The 2026 Taycan RWD achieves 17.6 kWh/100km WLTP in optimal configuration - 
    a significant improvement over the 2024 model (19.6 kWh/100km). Porsche achieved 
    this through improved motor efficiency, optimized thermal management, and better 
    aerodynamics.
    
    Efficiency varies with driving style:
    - Eco mode, gentle: ~16.5 kWh/100km
    - Normal mode: ~19-21 kWh/100km
    - Sport/Sport Plus: ~25+ kWh/100km

# ============================================================================
# CHARGING
# ============================================================================

charging:
  ac:
    max_power_kw: 11
    standard: true
    optional_upgrade_kw: 22
    optional_upgrade_cost: "€1,530 (22kW onboard charger)"
    connector_type: Type2
    phases: 3
    time_0_100_hours: 8.5
    time_10_80_hours: 7.0
    notes: |
      Standard: 11kW 3-phase AC (0-100% in ~8.5 hours)
      Optional: 22kW 3-phase AC (0-100% in ~4.5 hours)
      
      22kW charging recommended for home charging convenience, though most public 
      AC chargers in Europe are limited to 11kW.

  dc:
    max_power_kw: 270
    curve: "Flat curve from 10-80% thanks to 800V architecture"
    connector_type: CCS
    time_10_80_percent_min: 22
    time_5_80_percent_min: 23
    peak_power_duration: "Sustained from ~5% to 55% SoC"
    notes: |
      Peak: 270kW DC (800V architecture, Porsche/Ionity chargers)
      10-80%: 22 minutes (ideal conditions, 350kW charger)
      
      The 800V architecture is Taycan's key advantage: minimal thermal losses during 
      charging enable sustained high charging power. Most EVs with 400V systems can't 
      maintain high power due to heat buildup - Taycan sustains 200+kW from 10-55% SoC.
      
      Porsche's Battery Temperature Management actively preconditions the battery when 
      navigating to a DC charger, ensuring optimal temperature for maximum charging speed.

# ============================================================================
# PERFORMANCE
# ============================================================================

performance:
  power_kw: 300
  power_hp: 408
  power_ps: 408
  overboost_power_kw: 300
  overboost_power_hp: 408
  overboost_power_ps: 408
  torque_nm: 345
  drivetrain: RWD
  transmission: "2-speed automatic (1st: acceleration, 2nd: efficiency/top speed)"
  
  acceleration:
    zero_to_100_kmh_sec: 4.8
    zero_to_100_kmh_launch_control_sec: 4.8
    zero_to_200_kmh_sec: null
    launch_control: true
    notes: |
      0-100 km/h: 4.8 seconds (with Launch Control)
      Launch Control standard on all Taycan models
      
      Despite being the "base" Taycan, 4.8s 0-100 km/h is supercar territory and 
      faster than most sports cars on the road.

  top_speed_kmh: 230
  top_speed_limited: true
  notes: |
    Top speed electronically limited to 230 km/h.
    The 2-speed transmission enables strong acceleration (1st gear) while maintaining 
    efficiency and top speed capability (2nd gear) - unique among EVs.

