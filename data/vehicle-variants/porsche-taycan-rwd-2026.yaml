description: "The 2026 Porsche Taycan RWD (rear-wheel drive) is the entry-level Taycan\
  \ \nmodel, offering exceptional value while maintaining the core Taycan experience.\
  \ \nWith 300kW (408hp) continuous power and improved efficiency for 2026, the base\
  \ \nTaycan delivers sports car performance with a WLTP range of up to 566km.\n\n\
  For model year 2026, Porsche improved the Taycan's efficiency and range through\
  \ \noptimized motor control, improved aerodynamics, and updated battery management.\
  \ \nThe base RWD model now achieves 17.6 kWh/100km in optimal conditions - excellent\
  \ \nefficiency for a performance sports sedan.\n\nDespite being the \"base\" model,\
  \ the Taycan RWD includes Porsche's 800V architecture \nenabling 270kW peak DC charging,\
  \ rear-wheel drive for engaging driving dynamics, \nadaptive air suspension, and\
  \ the complete Porsche sports car experience. It's the \nmost efficient and longest-range\
  \ Taycan variant for 2026.\n"
