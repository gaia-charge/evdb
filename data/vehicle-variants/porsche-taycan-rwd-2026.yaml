  real_world_conditions: Mixed driving, 20°C ambient, normal driving style
  notes: "The 2026 Taycan RWD achieves 17.6 kWh/100km WLTP in optimal configuration\
    \ - \na significant improvement over the 2024 model (19.6 kWh/100km). Porsche\
    \ achieved \nthis through improved motor efficiency, optimized thermal management,\
    \ and better \naerodynamics.\n\nEfficiency varies with driving style:\n- Eco mode,\
    \ gentle: ~16.5 kWh/100km\n- Normal mode: ~19-21 kWh/100km\n- Sport/Sport Plus:\
    \ ~25+ kWh/100km\n"
