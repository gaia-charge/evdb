  notes: "WLTP: 495-566km (depending on wheel/tire configuration)\nReal-world: ~485km\
    \ mixed driving in good conditions\nWinter range penalty: ~25-30% in cold weather\
    \ (battery heating, cabin heating)\nHighway at 130 km/h: ~410km range (high speeds\
    \ reduce efficiency)\n\nThe 2026 model year brings improved efficiency through\
    \ optimized motor control \nand better aerodynamics, resulting in best-in-class\
    \ Taycan range.\n"
