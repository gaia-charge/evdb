    Porsche Ceramic Composite Brake (PCCB): €9,180
    - Front: 420mm, 10-piston calipers
    - Rear: 410mm, 4-piston calipers
    - Carbon ceramic rotors (extreme performance, minimal fade)

regenerative_braking:
  max_power_kw: 275
  modes: "Auto, Off, Max"
  one_pedal_driving: true
  notes: |
    Regenerative braking: up to 275kW (exceptional for an EV)
    Porsche Recuperation Management blends regen + friction braking seamlessly
    Auto mode: coasting when lifting, regen when braking (natural feel)
    Max mode: aggressive one-pedal driving with strong lift-off regen

