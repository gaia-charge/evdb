description: |
  The Performance Pack variant of the Polestar 3 adds significantly more power and 
  performance-oriented features to the already capable Long Range Dual Motor.
  
  With 380kW (517hp) and 910Nm torque, this variant achieves 0-100 km/h in just 4.7 
  seconds, making it one of the fastest luxury electric SUVs available. The Performance 
  Pack includes:
  - Upgraded electric motors (+20kW each)
  - Performance-tuned air suspension with adjustable dampers
  - Performance brakes with gold calipers
  - 22-inch forged wheels
  - Sport seats with extended adjustment
  - Performance software calibration
  
  Despite the increased power, range remains competitive at 560km WLTP thanks to 
  efficient motor and battery management. Fast charging at up to 250kW enables 
  10-80% charging in approximately 30 minutes.

