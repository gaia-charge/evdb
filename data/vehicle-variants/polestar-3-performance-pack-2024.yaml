description: "The Performance Pack variant of the Polestar 3 adds significantly more\
  \ power and \nperformance-oriented features to the already capable Long Range Dual\
  \ Motor.\n\nWith 380kW (517hp) and 910Nm torque, this variant achieves 0-100 km/h\
  \ in just 4.7 \nseconds, making it one of the fastest luxury electric SUVs available.\
  \ The Performance \nPack includes:\n- Upgraded electric motors (+20kW each)\n- Performance-tuned\
  \ air suspension with adjustable dampers\n- Performance brakes with gold calipers\n\
  - 22-inch forged wheels\n- Sport seats with extended adjustment\n- Performance software\
  \ calibration\n\nDespite the increased power, range remains competitive at 560km\
  \ WLTP thanks to \nefficient motor and battery management. Fast charging at up to\
  \ 250kW enables \n10-80% charging in approximately 30 minutes.\n"
