  notes: "Rear-wheel drive variant with superior aerodynamics compared to EX40. The EC40's coupe roofline reduces drag coefficient to 0.30 (vs 0.33 for EX40), resulting in 55km more WLTP range with the same battery. Most efficient Volvo EV variant. Competes with Tesla Model Y RWD, Polestar 2 Long Range Single Motor, and BMW iX3. Shares platform with EX40 and Polestar 2. First Volvo with leather-free interior as standard."
