  notes: '2026 model year BMW iX3 50 xDrive - completely new vehicle on the Neue Klasse
    platform. This is NOT a facelift of the previous CLAR-based iX3. Features 800V
    architecture, 400kW DC fast charging, cylindrical NMC cells, and the revolutionary
    BMW Panoramic Vision head-up display. The Neue Klasse platform represents BMW''s
    largest EV investment, with 6th generation eDrive technology. Massive 115 kWh
    battery delivers 805 km WLTP range (TEL). Built in Debrecen, Hungary (new Neue
    Klasse factory). Competes with Mercedes EQC successor, Audi Q6 e-tron, and Tesla
    Model Y.

    '
