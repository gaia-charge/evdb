notes: |
  The Nissan Ariya 63 kWh FWD is the base variant of Nissan's electric
  crossover, offering 218 hp and 450 km WLTP range. With FWD layout and
  lighter 63 kWh battery, it provides good efficiency and lower price point
  than AWD variants. Built on Nissan's CMF-EV platform shared with Renault.
  Features ProPILOT Assist 2.0 for hands-free highway driving and V2H
  capability. Targets buyers seeking practical mid-size EV crossover with
  strong technology features. Competes with VW ID.4, Hyundai Ioniq 5, and
  Kia EV6.

