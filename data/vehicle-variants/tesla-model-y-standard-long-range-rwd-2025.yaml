# Tesla Model Y Standard Long Range RWD 2025 (Juniper)
# New mid-range variant with NMC battery, 77 kWh usable
# Part of the 2025 Juniper refresh

id: tesla-model-y-standard-long-range-rwd-2025
model_id: tesla-model-y
name: Standard Long Range RWD
model_year: 2025
variant_code: "SLR-RWD"
trim_level: Standard Long Range

overview: >
  The Tesla Model Y Standard Long Range RWD is a new addition to the 2025 Juniper refresh
  lineup, slotting between the base RWD (LFP) and the Long Range AWD. It features an NMC
  battery pack with 77 kWh usable capacity, delivering 490 km real-world range — a significant
  improvement over the LFP-based RWD. With a single rear motor producing 220 kW (299 PS),
  it offers strong performance while maintaining excellent efficiency at 15.7 kWh/100km.
  The Juniper refresh brings a completely redesigned front end, new LED light bar, refreshed
  interior with a new steering wheel, ventilated front seats, and an 8-inch rear screen.

