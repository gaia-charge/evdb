notes: 'The BYD Atto 2 is BYD''s entry-level electric crossover for Europe, positioned
  below the Atto 3. With a 45.1 kWh Blade Battery (LFP), it offers 312 km WLTP range
  at a competitive price point around €31,990. DC charging tops out at 65 kW, which
  is modest but sufficient for the target audience of urban/suburban drivers. V2L
  capability (3.3 kW) is included. The 11 kW AC onboard charger (3-phase) is a step
  up from the Atto 3''s single-phase 7 kW charger.

  '
