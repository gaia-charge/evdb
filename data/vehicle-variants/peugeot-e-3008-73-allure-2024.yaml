  notes: |
    The Peugeot e-3008 73 kWh Allure represents the entry point into the e-3008 range
    with the smaller 73 kWh battery. It still offers impressive 525 km WLTP range and
    excellent equipment including the revolutionary 21" Panoramic i-Cockpit display and
    ChatGPT voice assistant.
    
    With 160kW DC fast charging, the 73 kWh battery can charge from 10-80% in just 27
    minutes, making it highly practical for road trips despite being the "smaller" battery.
    
    The e-3008 is a ground-up electric design with no ICE compromises, offering best-in-
    class interior space (520L trunk) and cutting-edge technology. The Panoramic i-Cockpit
    with its massive curved 21" display is a segment first and provides an incredibly
    modern, premium experience.
    
    Allure trim includes comprehensive equipment that would be optional or higher-trim-only
    on German competitors, making it excellent value. The combination of French ride comfort,
    practical space, long range, and advanced tech makes this a compelling alternative to
    VW ID.4, Škoda Enyaq, and even Tesla Model Y.
