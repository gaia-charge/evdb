overview: >
  The Zeekr 7GT Long Range RWD is the base variant with a single rear motor producing 310kW (421 PS).
  Featuring a 100kWh CATL QILIN battery with 800V architecture, it offers an estimated 655km WLTP range
  and ultra-fast 480kW peak DC charging. The 10-80% charge takes just 16 minutes, making it one of the
  fastest-charging EVs available. The shooting brake body style offers unique practicality in the segment.

