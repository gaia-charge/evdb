  notes: 'Kia EV3 Long Range offers exceptional 600km WLTP range in a compact SUV
    package at competitive pricing. The 81.4 kWh battery is the same size as Ioniq
    5/EV6, but in a smaller, lighter vehicle, resulting in impressive efficiency.
    Standard equipment is generous including heat pump, HUD, and premium sound system.
    Despite 400V architecture (not 800V), DC charging is respectable at 128kW peak,
    allowing 10-80% in 31 minutes. Excellent choice for families wanting maximum range
    without stepping up to larger, more expensive EV6.

    '
