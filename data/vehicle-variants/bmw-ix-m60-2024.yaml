notes: |
  The BMW iX M60 xDrive is the high-performance variant of BMW's electric flagship SUV.
  It offers 455kW (619hp) from dual motors, enabling 3.8s 0-100 km/h acceleration - making it one of the fastest
  luxury SUVs on the market. Despite the massive power, it still achieves 566km WLTP range (485km real-world).
  
  Key strengths:
  - Extremely fast: 3.8s 0-100 km/h (vs Mercedes EQS SUV 580: 4.5s, Audi Q8 e-tron SQ8: 4.5s)
  - 619 hp (455kW) - most powerful iX variant
  - 1,100 Nm torque (massive pulling power)
  - 566km WLTP range (485km real-world) - good for performance SUV
  - 250 km/h top speed (vs xDrive50: 200 km/h)
  - M Sport Package Professional standard (adaptive M suspension, M brakes)
  - BMW IconicSounds Electric by Hans Zimmer (custom EV soundtrack)
  - Sky Lounge panoramic glass roof with LED light carpet
  - 2,500kg towing capacity (best in luxury EV SUV segment)
  - Exceptional build quality and interior materials
  - 195kW DC fast charging (35-min 10-80%)
  
  Key weaknesses:
  - Very expensive: €120,000 (vs xDrive50: €105,000, EQS SUV 580: €141,000)
  - 400V architecture limits DC charging vs 800V competitors
  - No rear-wheel steering (unlike Mercedes EQS SUV)
  - Higher consumption: 21.9 kWh/100km WLTP (vs xDrive50: 19.5)
  - Shorter range than xDrive50: 566km vs 630km WLTP
  - Heavier at 2,710kg (vs xDrive50: 2,585kg)
  - No V2G/V2L bidirectional charging
  - 22kW AC charging optional, not standard (unlike Mercedes)
  
  Competes with:
  - Mercedes-Benz EQS SUV 580 4MATIC (€141,000): Less powerful (385kW), more luxurious, more expensive
  - Audi Q8 e-tron SQ8 (not yet released): Direct competitor, similar performance expected
  - Tesla Model X Plaid (€135,000): Faster (2.5s), more range (528km), less luxurious
  - Porsche Cayenne Turbo S E-Hybrid (€181,000): PHEV not pure EV, sportier driving dynamics
  
  The iX M60 targets buyers who want BMW's ultimate electric SUV with maximum performance while maintaining
  practicality and luxury. It's the fastest-accelerating BMW SUV ever made (3.8s 0-100, beating X5 M Competition).
  
  Most popular configuration: M60 with Executive Lounge Package (~€135,000) adds rear Executive seats with
  massage, heating, ventilation, and extended leather trim.
  
  Real-world efficiency: 24.3 kWh/100km (vs WLTP 21.9) - high consumption due to performance.
  Real-world range: 485km mixed driving (vs 566km WLTP).

