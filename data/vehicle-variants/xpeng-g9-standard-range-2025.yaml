overview: >
  The XPENG G9 Standard Range is the entry-level variant with a 79.0kWh LFP battery offering 502km WLTP range. Powered by a single rear PSM motor producing 258kW (351 PS), it delivers strong performance with 0-100 km/h in 6.6 seconds. The 800V architecture supports DC charging up to 445kW. Standard equipment includes 20-inch wheels, coil spring suspension, leather interior, and the full XPILOT ASSIST suite.

