  notes: 'The GLC 400 4MATIC is the first variant of the all-electric Mercedes-Benz
    GLC, built

    on the EA-M (Electric Architecture Medium) platform with 800V architecture. It
    replaces

    the EQC and is positioned as Mercedes'' core electric SUV offering.


    Key highlights:

    - 100 kWh battery (94 kWh usable) with 800V architecture

    - 330 kW DC fast charging

    - 500 km real-world range (641 km WLTP average)

    - AWD with 360 kW / 489 PS combined output

    - 570L cargo + 128L frunk

    - AIRMATIC air suspension standard

    - V2L / V2H announced


    Competes with:

    - BMW iX xDrive50 (€77,300, 630 km WLTP)

    - Audi Q8 e-tron 55 quattro (€74,400, 582 km WLTP)

    - Tesla Model X Long Range (€99,990, 576 km WLTP)

    - Volvo EX90 Twin Motor (€83,700, 580 km WLTP)

    '
