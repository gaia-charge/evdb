notes: 'The Fiat 600e (RED) is the standard trim, positioned as the accessible entry
  point

  to the 600e range. Key differences vs La Prima:

  - Standard LED headlights (not matrix)

  - 17" wheels (vs 18")

  - Manual climate control (vs dual-zone auto)

  - No heated seats, wireless charging, or 360-degree camera

  - Cloth seats (vs premium cloth/leatherette)

  - No blind spot monitoring or rear cross-traffic alert


  Same powertrain: 156 hp, 260 Nm, 54 kWh battery, 409 km WLTP range.

  Approximately €4,000 less than La Prima, making it competitive with

  Opel Mokka Electric and Peugeot e-2008 base trims.

