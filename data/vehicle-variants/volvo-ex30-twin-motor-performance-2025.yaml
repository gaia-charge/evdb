# Vehicle Variant: Volvo EX30 Twin Motor Performance (2025)
id: volvo-ex30-twin-motor-performance-2025
model_id: volvo-ex30
name: Twin Motor Performance
variant_name: Twin Motor Performance
model_year: 2025
trim_level: Twin Motor Performance
production_years: "2025-present"

overview: >
  The 2025 Volvo EX30 Twin Motor Performance is the range-topping performance variant of the compact
  EX30, delivering 315kW (422hp) through a dual-motor AWD powertrain for a blistering 3.6-second
  0-100 km/h sprint. Now also produced at Volvo's Ghent plant in Belgium for the European market,
  the 2025 model benefits from refined software and improved all-wheel drive torque distribution.
  Despite the added performance, the 69kWh battery still delivers up to 450km WLTP range. The Twin
  Motor Performance comes standard with sport-tuned suspension, upgraded brakes, and unique 20-inch
  wheels, making it one of the fastest compact SUVs regardless of powertrain.

