notes: 'The 2025 Audi Q6 Sportback e-tron Performance is the most efficient variant
  in the Q6 lineup, combining the large 100 kWh battery with a single rear motor and
  the Sportback''s superior aerodynamics (Cd 0.26). At 656 km WLTP, it offers best-in-class
  range for a premium mid-size coupe SUV. 800V architecture enables 270 kW DC charging
  with 10-80% in 21 minutes. Features Audi''s latest triple-screen MMI system, standard
  air suspension, and bi-directional charging (V2L/V2H/V2G). Built on the PPE platform
  co-developed with Porsche at Audi''s Ingolstadt plant. Competes with BMW iX xDrive50,
  Mercedes EQE SUV, and Tesla Model Y Long Range.

