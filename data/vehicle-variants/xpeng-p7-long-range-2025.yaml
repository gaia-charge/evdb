overview: 'The XPENG P7 Long Range is the primary European variant, offering the P7i''s
  full  capability with an 86.2 kWh NMC battery providing approximately 505 km WLTP
  range.  The single rear-mounted permanent magnet synchronous motor produces 203
  kW (276 PS)  and 440 Nm, delivering 0-100 km/h in 6.4 seconds. Standard equipment
  includes Dynaudio  Dolby Atmos audio, heat pump, panoramic roof, and comprehensive
  ADAS.

  '
