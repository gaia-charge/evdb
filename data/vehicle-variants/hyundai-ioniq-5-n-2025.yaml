notes: 'The Hyundai Ioniq 5 N is the first high-performance N variant of the Ioniq
  5 and represents a new era for Hyundai N brand in the electric age. With 448 kW
  continuous power (478 kW with N Grin Boost), it accelerates 0-100 km/h in 3.4 seconds
  with a top speed of 260 km/h. Unique features include N e-shift (simulated 8-speed
  transmission feel with jerking motion and sound), N Active Sound+ (internal and
  external sound generation), N Drift Optimizer, and comprehensive track-focused driving
  modes. The larger 84 kWh battery provides 448 km WLTP range while supporting sustained
  performance driving with N-optimized thermal management. The 800V architecture enables
  10-80% DC fast charging in 18 minutes. Despite weighing 2,231 kg, the Ioniq 5 N
  has been praised by automotive journalists as one of the most entertaining performance
  EVs ever made, successfully translating the fun-to-drive character of ICE N models
  into electric form.

