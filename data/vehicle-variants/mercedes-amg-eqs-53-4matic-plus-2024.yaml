notes: |
  The Mercedes-AMG EQS 53 4MATIC+ is the performance flagship of the EQS lineup, representing
  AMG's first fully electric sedan. It combines Mercedes' luxury flagship with AMG's performance DNA,
  delivering 484 kW (658 hp) and 880 Nm torque from dual permanent magnet motors.
  
  Key strengths:
  - 3.4s 0-100 km/h acceleration (with Race Start function) - fastest luxury sedan
  - 484 kW (658 hp) power, 680 hp with AMG Dynamic Plus Package
  - 880 Nm torque (950 Nm with Dynamic Plus) - exceptional for any production car
  - AMG RIDE CONTROL+ air suspension with adaptive damping
  - AMG Track Pace with lap timing, telemetry, and drift mode
  - MBUX Hyperscreen standard (€8,925 option on 450+)
  - 22kW AC charging standard (€1,190 option on 450+)
  - AMG Sound Experience (authentic AMG engine sound simulation)
  - Burmester High-End 3D Surround (21 speakers, 1750W) standard
  - 10-year/250,000km battery warranty
  
  Key weaknesses:
  - Only 586km WLTP range (490km real-world) vs 450+ 782km (650km real-world)
  - Higher consumption: 20.4 kWh/100km WLTP vs 450+ 15.6 kWh/100km
  - Very heavy at 2,655kg (175kg more than 450+)
  - 400V architecture limits DC charging to 207kW (vs 800V Taycan Turbo S: 270kW)
  - No V2G/V2L bidirectional charging
  - Limited towing: 750kg (vs BMW iX M60: 2,500kg)
  - Expensive: ~€148,000 base price (~€30,000 more than 450+)
  
  Competes with:
  - Porsche Taycan Turbo S (€199,637): Faster (2.8s 0-100), 800V charging, lighter, sportier, less luxurious
  - BMW i7 M70 xDrive (€169,000): More power (485kW), faster (3.7s 0-100), more traditional luxury
  - Tesla Model S Plaid (€118,990): Much faster (2.1s 0-100), better software, less luxurious
  - Lucid Air Sapphire (€249,000): Much faster (1.89s 0-100), more range, more expensive
  - Audi e-tron GT RS (€142,400): Sportier, lighter, 800V charging, less luxurious
  
  AMG EQS 53 4MATIC+ targets buyers wanting ultimate luxury + AMG performance in electric form.
  It's the fastest-accelerating Mercedes luxury sedan ever (faster than S63 AMG V8).
  
  AMG Dynamic Plus Package (€11,900) adds:
  - Race Start function: 680 hp / 950 Nm for 10 seconds
  - Drift Mode (rear-biased torque distribution)
  - AMG Track Pace with drift analysis
  - AMG Performance seats with more aggressive bolstering
  
  Real-world efficiency: 22.0 kWh/100km (vs WLTP 20.4) - expect higher consumption with spirited driving.
  Real-world range: 490km mixed driving (vs 586km WLTP, 451km EPA).
  
  The AMG EQS 53 is built at Factory 56 (carbon-neutral) alongside the 450+.
  It's the third electric AMG after EQS 53 SUV and EQE 53.

