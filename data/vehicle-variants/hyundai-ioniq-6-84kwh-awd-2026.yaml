notes: >
  The Hyundai IONIQ 6 84 kWh AWD 2026 is the updated all-wheel-drive variant with dual
  motors producing 239 kW (325 PS) combined. The larger 84 kWh battery (80 kWh usable)
  increases WLTP range to 650 km (from ~583 km in the 2025 77.4 kWh AWD). The AWD system
  adds a 74 kW front motor for improved traction and 5.1s 0-100 km/h acceleration.
  Fast charging remains excellent at 263 kW peak via 800V architecture, with 10-80% in
  17 minutes.

