description: |
  The Cadillac Lyriq-V is the high-performance V-Series variant, joining Cadillac's
  legendary lineup of performance models. With 615 PS (459 kW) and 882 Nm torque from
  enhanced dual motors, it accelerates from 0-100 km/h in just 3.3 seconds - supercar
  territory in a luxury SUV.
  
  The Lyriq-V features unique performance-focused styling, enhanced brakes, sport-tuned 
  Magnetic Ride Control suspension, and aggressive exterior design cues. It shares the
  102 kWh NCMA battery but with slightly reduced range (460 km WLTP) due to larger wheels 
  and performance-focused calibration.
  
  At approximately €94,000 in Germany, the Lyriq-V offers extraordinary performance value
  compared to BMW iX M60 (€120,000+) and Mercedes-AMG EQE SUV (€107,000+).

