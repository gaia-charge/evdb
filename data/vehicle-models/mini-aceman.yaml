description: >
  The Mini Aceman (2024+) fills the gap between the Mini Cooper Electric and the Countryman.
  It's an all-electric compact crossover that blends SUV styling cues with hatchback proportions.
  Built on the same FAAR2 EV platform as the new Cooper Electric, the Aceman is positioned as
  a more versatile alternative with five doors, more cargo space, and raised ground clearance.
  Available in two battery sizes (42.5kWh and 54.2kWh), it offers up to 406km WLTP range.
  The Aceman is the first Mini to be produced exclusively in China (by Spotlight Automotive,
  the BMW-Great Wall joint venture) for global markets.

