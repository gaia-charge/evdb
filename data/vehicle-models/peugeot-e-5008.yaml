notes: |
  The Peugeot e-5008 is the 7-seat electric SUV sibling of the e-3008, built on the
  STLA Medium platform. It's one of very few fully electric 7-seaters available in Europe.

  Available with 73 kWh and 97 kWh battery options. The larger battery delivers up to
  668 km WLTP range. Both variants are FWD with a single front motor.

  Key differentiator: genuine 7-seat electric SUV at a competitive price point.
  Competes with: Tesla Model Y (5-seat only), Kia EV9, Mercedes EQB.
