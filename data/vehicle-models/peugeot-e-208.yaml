notes: |
  The Peugeot e-208 is the electric version of the award-winning 208 supermini.
  It shares the CMP platform with the Opel Corsa-e (essentially badge-engineered siblings).
  
  Key differentiators vs Corsa-e:
  - Distinctive Peugeot 3D i-Cockpit design
  - Sporty GT styling with signature LED "fangs"
  - Slightly more expensive but more premium interior
  
  Originally launched with 50kWh battery (45kWh usable), updated to 51kWh (46kWh usable) in 2023 facelift.
  
  Competes with: Mini Cooper Electric, Fiat 500e, Honda e, MG4 (though MG4 is larger/cheaper).
