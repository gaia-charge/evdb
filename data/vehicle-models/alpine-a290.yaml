overview: >
  The Alpine A290 is a sporty electric hot hatch based on the Renault 5 E-Tech platform. It represents
  Alpine's first series-production electric car and marks the brand's expansion from sports cars into
  the performance hatchback segment. Built at the Renault ElectriCity factory in Douai, France, the A290
  features a wider track, sportier suspension tuning, and more powerful motor options compared to the
  Renault 5. Available with either a 52kWh battery producing 130kW (180hp) in standard form or 160kW
  (220hp) in GTS trim, it offers a engaging driving experience in a compact package. The A290 features
  Alpine's signature blue accents, sport seats, and a distinctive design identity that differentiates
  it from its Renault sibling.

