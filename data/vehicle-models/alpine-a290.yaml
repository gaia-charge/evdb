notes: >
  The Alpine A290 is the brand's first mass-market electric car, transforming Alpine from a niche sports
  car maker into a broader performance brand. Based on the Renault 5 E-Tech, it shares the AmpR Small
  platform but features unique suspension tuning, wider track, more powerful motors, and distinctive
  Alpine styling. Built in Douai, France alongside the Renault 5. The name A290 follows Alpine's
  tradition of numeric naming. Competes with the Abarth 500e, Mini Cooper Electric, and Cupra Born.

