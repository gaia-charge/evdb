    MG4 Electric launched in 2022 as one of the most affordable EVs in Europe.
    Won multiple awards including 2023 What Car? Car of the Year.
    Unique rear-wheel drive layout in the compact segment.
    Built on MSP platform with cell-to-pack battery technology.
    Available in Standard Range (51kWh), Extended Range (64kWh), and XPower (64kWh AWD).
    One of the best-selling EVs in Europe by volume.
    Excellent driving dynamics praised by reviewers.
