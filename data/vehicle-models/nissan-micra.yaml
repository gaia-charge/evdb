description: >
  The sixth-generation Nissan Micra is a fully electric supermini built on the
  Renault-Nissan AmpR Small platform, shared with the Renault 5 E-Tech. It marks
  Nissan's return to the European B-segment with a distinctive design featuring
  signature V-motion grille and wraparound LED headlights. Available with two
  battery options (40 kWh and 52 kWh), the Micra offers up to 416 km WLTP range
  and practical urban credentials with 5 doors, V2L capability, and modern
  connectivity including wireless Apple CarPlay and Android Auto. Manufactured
  at Renault's ElectriCity hub in Douai, France, alongside its Renault 5 sibling.

key_features:
  - Two battery options (40 kWh / 52 kWh)
  - Up to 416 km WLTP range (52 kWh)
  - V2L (vehicle-to-load) via Type 2 adapter
  - 10.1-inch infotainment with wireless Apple CarPlay and Android Auto
  - Integrated Google services (Maps, Assistant, Play)
  - Battery preconditioning via navigation
  - MULTI-SENSE with 4 driving modes
  - Welcome light animation (headlight wink)
  - 5 doors, 326L boot space

notable_competitors:
  - Renault 5 E-Tech
  - Peugeot e-208
  - Opel Corsa Electric
  - Mini Cooper Electric
  - Volkswagen ID.3

market_position: >
  Positioned as a stylish and practical electric supermini for the European market.
  Shares its platform with the Renault 5 E-Tech but offers a distinct Nissan
  design identity. Targets urban and suburban drivers seeking an affordable,
  well-equipped electric car from an established brand. Competitive pricing
  aims to undercut premium options like Mini Cooper Electric while matching
  the Renault 5 on features and range.
