description: >
  Kia EV3 is a compact electric SUV positioned as a more affordable alternative to the EV6.
  Built on a modified E-GMP platform optimized for smaller vehicles, the EV3 offers impressive
  range, fast charging capabilities, and Kia's latest interior technology at a competitive price.
  Features a bold, modern design with sharp styling and excellent interior space efficiency.

notes: >
  - Built on modified E-GMP platform for compact segment
  - 400V electrical architecture (not 800V like EV6)
  - V2L capability (3.6kW) - Vehicle-to-Load for powering devices
  - Heat pump standard on all variants (important for winter efficiency)
  - 10.25" dual panoramic displays (instrument cluster + infotainment)
  - Available with single motor RWD only (no AWD variant)
  - DC fast charging up to 102kW (10-80% in ~31 minutes)
  - Positioned between Niro Electric and EV6 in Kia's EV lineup
  - Targets young families and urban buyers seeking affordable electric mobility
  - Built in South Korea (Hwaseong plant)

