platform: lvsa  # Lucid Vehicle Standard Architecture
description: >
  The Lucid Air is an ultra-luxury electric sedan that redefines the boundaries of electric 
  vehicle performance, range, and efficiency. Built on Lucid's proprietary LVSA platform 
  (Lucid Vehicle Standard Architecture), the Air represents the pinnacle of American EV 
  engineering with up to 837 km EPA range (Air Grand Touring), industry-leading efficiency 
  (4.5 miles/kWh), and blistering performance (1,234 hp in Sapphire variant).
  
  The Air features a revolutionary 900V+ architecture enabling ultra-fast 300kW+ DC charging 
  (20% to 80% in 22 minutes with capable chargers), exceptional packaging efficiency creating 
  limousine-like interior space in a mid-size sedan footprint, and advanced aerodynamics 
  (0.197 Cd - lowest of any production vehicle).
  
  Available in multiple configurations from the efficient Pure (base model) to the 
  performance-focused Sapphire (tri-motor, 1,234 hp), the Air targets ultra-luxury buyers 
  seeking the ultimate electric sedan experience beyond what Mercedes EQS, BMW i7, or even 
  Tesla Model S can offer.
  
  European availability launched in 2023 with right-hand drive UK models, expanding to 
  Germany, Netherlands, and Switzerland. Lucid's Dream Drive Pro advanced driver assistance 
  system includes highway assist, automatic lane changing, and over-the-air update capability.

key_features:
  - Up to 837 km EPA range (Air Grand Touring - highest among luxury EVs)
  - 900V+ electrical architecture for ultra-fast charging (300kW+)
  - Industry-leading efficiency (4.5-5.0 miles/kWh EPA)
  - 0.197 Cd drag coefficient (lowest of any production car)
  - Exceptional interior space via packaging efficiency (miniaturized drive units)
  - Dual-motor AWD standard on most trims (516-819 hp depending on variant)
  - Glass Canopy roof extending full length of cabin
  - 34" curved 5K Glass Cockpit display
  - Dream Drive Pro ADAS (lidar-based, highway assist, OTA updates)
  - Nappa leather interior with sustainable materials
  - 21-speaker Surreal Sound Pro audio system (Dolby Atmos)
  - Bi-directional charging capability (V2L, V2H ready)
  - Electrochromic roof dimming
  - Massaging front and rear seats
  - Frunk storage (283 liters) plus rear trunk (456 liters)

notable_competitors:
  - Mercedes-Benz EQS
  - BMW i7
  - Tesla Model S
  - Porsche Taycan
  - Audi e-tron GT

awards:
  - "MotorTrend Car of the Year 2022"
  - "World Luxury Car 2023"
  - "Best Luxury EV 2023 - Edmunds"
  - "Top Safety Pick+ - IIHS 2023"

market_position: >
  Positioned as ultra-luxury electric sedan competing with Mercedes EQS and BMW i7, 
  but delivering significantly superior range (837 km vs 680 km EQS), efficiency 
  (4.5 mi/kWh vs 3.1 mi/kWh), and performance. Lucid targets affluent early adopters 
  willing to embrace new American luxury brand with technical pedigree (CEO Peter 
  Rawlinson previously Tesla Model S chief engineer).
  
  European expansion focuses on tech-savvy luxury buyers in Germany, UK, Netherlands, 
  and Switzerland who value cutting-edge EV technology over traditional brand prestige. 
  Lucid's challenge remains building brand awareness and service infrastructure versus 
  established German luxury marques.
