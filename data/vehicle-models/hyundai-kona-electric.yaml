description: >
  The second-generation Hyundai Kona Electric (2024) is built on Hyundai's E-GMP platform,
  offering improved range, faster charging, and more interior space than the first generation.
  It features a bold new design with Hyundai's Parametric Pixel LED lights, dual 12.3-inch
  displays, and advanced safety features. The Kona Electric is positioned as an affordable
  entry into Hyundai's electric SUV lineup, sitting below the Ioniq 5.

