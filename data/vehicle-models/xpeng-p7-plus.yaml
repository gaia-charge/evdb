overview: >
  The XPENG P7+ is the successor to the P7, built on the new SEPA 2.0 platform
  with 800V SiC architecture. It features an ultra-low drag coefficient of 0.206,
  dual LiDAR XNGP autonomous driving system, and significantly larger interior
  and cargo space than the P7. Available in RWD and AWD configurations with
  LFP or NMC batteries. European market launch expected in 2025.

