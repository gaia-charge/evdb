market_notes: |
  The Zoe was Europe's best-selling electric vehicle from 2012-2019, helping establish 
  EV acceptance across the continent. While newer competitors offer better value (MG4) 
  or faster charging (e-208/Corsa-e), the Zoe remains popular due to competitive pricing, 
  strong Renault dealer network, and proven reliability with over 500,000 units sold.
  
  Battery leasing was a pioneering sales model (lease battery separately from car) but 
  has been discontinued in most markets as buyers prefer ownership. Used Zoes with 
  leased batteries remain common on the secondhand market.

# Notes
notes: |
  **Generation History:**
  - Q210 (2012-2019): 22kWh and 41kWh (ZE40) batteries, up to 300km WLTP
  - ZE50 (2019-present): 52kWh battery, 395km WLTP, updated styling
  
  **Motor Variants:**
  - R110 (80kW/110hp): Standard motor, supports 22kW AC charging (Chameleon Charger)
  - R135 (100kW/135hp): More powerful motor introduced in 2019, 11kW AC charging only
  - No DC fast charging until 2020 (optional 50kW CCS2 became available)
  
  **Battery Leasing:**
  Zoe pioneered battery leasing in Europe where customers owned the car but leased 
  the battery separately (€59-119/month). This reduced purchase price but added 
  ongoing costs. Most markets have discontinued new leases but existing contracts 
  continue. Used Zoes commonly have leased batteries.
  
  **Charging Limitations:**
  - R110 motor: 22kW AC (Chameleon Charger) but NO DC fast charging until 2020
  - R135 motor: 11kW AC only, 50kW DC (optional from 2020)
  - Early Zoes (2012-2019) with Type 2 AC only, no CCS2
  - 50kW DC is slower than e-208/Corsa-e (100kW) and MG4 (135kW)
  
  **Production Future:**
  Renault's Flins plant is transitioning to "Re-Factory" circular economy hub. 
  Zoe production may relocate or end as Renault focuses on newer models (Megane E-Tech, 
  R5 E-Tech arriving 2024). The Zoe has been Europe's EV pioneer but faces strong 
  competition from better-equipped, faster-charging rivals.

