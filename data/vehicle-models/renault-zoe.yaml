# Overview
description: |
  The Renault Zoe is Europe's best-selling affordable electric vehicle, with over 500,000 units 
  sold since its launch in 2012. As one of the pioneers of mass-market EVs, the Zoe helped make 
  electric mobility accessible to mainstream buyers with competitive pricing and practical range.
  
  The second-generation Zoe (2019-present, ZE50 battery) brought significant improvements: 52kWh 
  battery (up from 41kWh), 395km WLTP range, 50kW DC fast charging (optional), and updated styling. 
  The Zoe remains one of Europe's most affordable EVs with excellent urban efficiency.
  
  Built at Renault's Flins plant in France, the Zoe shares its CMF-B platform with the Clio and 
  Captur. It pioneered battery leasing in Europe (now discontinued) and helped establish EV 
  acceptance across the continent. Despite newer competitors, the Zoe continues to be a popular 
  choice for city driving and first-time EV buyers.

