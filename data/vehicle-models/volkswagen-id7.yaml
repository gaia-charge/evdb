notes: |
  The Volkswagen ID.7 is VW's flagship electric sedan on the MEB platform,
  positioned as the electric successor to the Passat. Launched in 2023, it
  offers exceptional aerodynamics (Cd 0.23), long range (up to 700 km WLTP),
  and premium features like AR head-up display and climate comfort seats with
  massage function. The ID.7 targets business users and long-distance drivers
  with its spacious interior, efficient powertrain, and advanced driver
  assistance systems. The Pro S variant with 86 kWh battery achieves the
  longest range of any VW electric vehicle.

