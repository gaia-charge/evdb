description: >
  Genesis GV60 is the brand's first dedicated electric vehicle built on Hyundai Motor Group's
  E-GMP platform (shared with Ioniq 5 and EV6). Positioned as a compact luxury crossover, the
  GV60 combines Genesis's "Athletic Elegance" design philosophy with cutting-edge EV technology
  including 800V ultra-fast charging, Vehicle-to-Load capability, and advanced biometric
  authentication (Face Connect, Fingerprint Authentication). The GV60 features unique Crystal
  Sphere electronic shift dial that rotates when the vehicle starts, Crystal LED headlights,
  and luxurious interior with Nappa leather and sustainable materials.

