  Genesis GV60 is the brand's technology flagship, representing pure EV vision with Crystal 
  Sphere shift dial, Face Connect biometric authentication, and distinctive design. Built on 
  E-GMP platform with 800V ultra-fast charging (18 minutes 10-80%). Priced competitively vs 
