description: >
  The OMODA E5 is a compact electric SUV from OMODA (a brand of Chery Automobile),
  marking the Chinese automaker's entry into the European BEV market. Built on
  Chery's dedicated electric platform, it offers competitive specifications at
  an attractive price point.

  With a 61 kWh LFP battery delivering approximately 430 km WLTP range, the E5
  targets mainstream European compact SUV buyers. Standard equipment is generous,
  including a large touchscreen, digital cockpit, and comprehensive driver
  assistance systems.

  OMODA is establishing its European dealer network through partnerships with
  existing dealer groups, providing service infrastructure from launch. The E5
  is positioned to compete with established models like the MG ZS EV, BYD Atto 3,
  and Volkswagen ID.4 on value.

key_features:
  - LFP battery (61 kWh) for longevity and safety
  - Competitive pricing in C-segment SUV market
  - 15.6" central touchscreen with Chery's Lion infotainment
  - Level 2 driver assistance suite
  - Heat pump standard for winter efficiency
  - V2L capability (3.3 kW)
  - OTA software updates
  - 5-star C-NCAP safety rating

notable_competitors:
  - MG ZS EV
  - BYD Atto 3
  - Volkswagen ID.4
  - Hyundai Kona Electric
  - Kia Niro EV

market_position: >
  OMODA E5 is positioned as an affordable, well-equipped compact electric SUV
  targeting first-time EV buyers and value-conscious families. Chery's scale
  advantages enable competitive pricing with generous standard equipment. The
  brand aims to build European presence through strong dealer partnerships and
  competitive warranty offerings.

