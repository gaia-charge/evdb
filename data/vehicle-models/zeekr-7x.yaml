description: |
  The Zeekr 7X is a mid-size electric SUV built on Geely's SEA platform with 800V architecture
  and CATL QILIN battery technology. It features 480 kW peak DC fast charging capability,
  making it one of the fastest-charging vehicles in its segment. Available in Europe from 2025,
  it offers compelling value with a 100 kWh battery, 615 km WLTP range, and competitive pricing
  against established European rivals like the BMW iX and Mercedes EQE SUV.
