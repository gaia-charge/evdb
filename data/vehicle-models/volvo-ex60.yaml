notes: |
  The Volvo EX60 is the successor to Volvo's bestselling XC60 and is expected to be
  the brand's highest-volume model. It shares the SPA3 platform with the larger EX90
  and the ES90 sedan, but in a more practical mid-size SUV form factor.

  Key highlights:
  - 800V architecture with up to 370 kW DC charging
  - Two battery options: 95 kWh (P10) and 117 kWh (P12)
  - V2L, V2H, and V2G bidirectional charging
  - Lidar safety system as standard
  - Built in Torslanda, Sweden
