overview: >
  The Volvo EX60 is Volvo's most important electric SUV, replacing the bestselling XC60
  as the brand's core model. Built on the new SPA3 platform with 800V architecture,
  it offers class-leading range of up to 810 km WLTP and ultra-fast 370 kW DC charging.
  Available in two battery sizes (95 kWh and 117 kWh), both with AWD. The EX60 features
  Volvo's latest safety technology including lidar as standard, Google Built-in infotainment,
  and V2L/V2H/V2G bidirectional charging capability. Manufactured at Volvo's Torslanda plant
  in Sweden on the same line as the EX90 and ES90.

