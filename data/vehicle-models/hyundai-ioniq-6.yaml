  notes: |
    The Ioniq 6 shares the E-GMP platform with Ioniq 5, Kia EV6, and Genesis GV60,
    but focuses on aerodynamic efficiency over practicality. Its fastback sedan
    design achieves exceptional highway range and efficiency, making it ideal for
    long-distance driving. The unique retro-futuristic design and premium features
    position it as a style-focused alternative to traditional premium sedans.
