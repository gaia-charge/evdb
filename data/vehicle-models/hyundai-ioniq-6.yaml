# Design Philosophy
design_notes: |
  The Ioniq 6 embodies Hyundai's "Electrified Streamliner" design philosophy,
  drawing inspiration from the 1920s-30s streamliner era. Its fastback silhouette
  and attention to aerodynamics result in a class-leading drag coefficient of 0.21,
  making it the most aerodynamic EV in production. The distinctive Parametric Pixel
  LED lighting and boat-tail rear design create a unique, instantly recognizable
  appearance. The focus on efficiency extends to the interior with sustainable
  materials and thoughtful ergonomics.

