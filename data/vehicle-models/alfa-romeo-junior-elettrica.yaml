description: >
  Alfa Romeo's first pure-electric vehicle, the Junior Elettrica is a compact premium SUV 
  built on the Stellantis eCMP2 platform. Positioned as a sportier, more premium alternative 
  to the Peugeot e-2008 and Opel Mokka-e, it brings Alfa Romeo's legendary driving dynamics 
  and Italian design flair to the electric B-SUV segment. Features distinctive Alfa Romeo 
  styling with the iconic Scudetto grille reinterpreted for electric mobility, LED matrix 
  headlights, and a driver-focused cockpit. The Junior Elettrica targets younger buyers 
  seeking an engaging, stylish electric SUV with premium Italian character.

