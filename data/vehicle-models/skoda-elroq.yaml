notes: |
  Built at Škoda's Mladá Boleslav plant, Czech Republic. Name is a portmanteau of "Electric" and "Karoq."
  Shares many parts with the larger Enyaq (doors, front wings, interior design) but in a more compact package
  with shorter rear overhang. First customer deliveries began early 2025. A vRS variant (250 kW, dual-motor AWD) 
  was added in late 2025. Available in three main configurations: Elroq 60, Elroq 85, and Elroq 85x.

