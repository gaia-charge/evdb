description: |
  The Škoda Elroq is Škoda's compact electric SUV, launched in January 2025 as the electric successor to the 
  popular Škoda Karoq. Built on the Volkswagen Group's MEB platform, the Elroq is the first production vehicle 
  to fully incorporate Škoda's "Modern Solid" design language.
  
  With a length of 4,488 mm, the Elroq sits below the Enyaq in Škoda's lineup but offers generous interior 
  space thanks to its dedicated EV platform with a flat floor. It features a 570+ litre boot, Škoda's 
  signature Simply Clever solutions, and a choice of three powertrains from 150 kW to 220 kW.
  
  Winner of the Carwow Car of the Year 2026 award, praised for its practicality, ride quality, and 
  outstanding value for money. Competes with the Hyundai Kona Electric, Kia Niro EV, and Peugeot E-3008.

