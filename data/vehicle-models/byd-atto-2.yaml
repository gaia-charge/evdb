description: >
  The BYD Atto 2 is a compact electric crossover positioned below the Atto 3 in BYD's
  European lineup. Built on the e-Platform 3.0, it features BYD's Blade Battery (LFP)
  for safety and longevity. The Atto 2 targets the affordable urban EV segment with
  a 45.1 kWh battery providing around 312 km WLTP range. It offers V2L capability
  and a comprehensive feature set at a competitive price point around €31,990.

