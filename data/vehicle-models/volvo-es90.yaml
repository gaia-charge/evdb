description: |
  The Volvo ES90 is Volvo's flagship all-electric luxury sedan, succeeding the S90 in the brand's
  transition to a fully electric lineup. Built on the new SPA3 platform with 800V architecture,
  it features a 106 kWh battery with up to 700 km WLTP range and 350 kW DC fast charging.
  The ES90 represents Volvo's vision of Scandinavian luxury with class-leading safety technology,
  including next-generation sensor suite and centralized computing architecture.
  Positioned to compete with the Mercedes-Benz EQS, BMW i7, and Tesla Model S.
