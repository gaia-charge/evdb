description: >
  The BYD Dolphin is a compact electric hatchback that brings BYD's advanced
  e-Platform 3.0 technology to the B-segment. Named after the intelligent and
  agile marine mammal, the Dolphin combines playful design with practical
  functionality. Available with two battery sizes (44.9 kWh and 60.4 kWh),
  it offers flexibility for city driving and longer journeys. The Dolphin
  features BYD's Blade Battery, an efficient heat pump system, and a modern
  interior with a rotating touchscreen. It competes directly with the
  Volkswagen ID.3, Renault Megane E-Tech, and MG4 in the competitive
  European compact EV market.

