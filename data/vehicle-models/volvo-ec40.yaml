notes: >
  The Volvo EC40 (formerly C40 Recharge) was Volvo's second electric vehicle and first electric coupe SUV, launched in 2021. It shares its CMA platform with the EX40 (formerly XC40 Recharge) and Polestar 2, but features a distinctive sloping roofline that reduces drag coefficient to 0.30 (vs 0.33 for EX40), resulting in up to 10% longer range. The EC40 was the first Volvo model to be sold exclusively online in many markets, pioneering Volvo's direct-to-consumer sales approach. It was also the first Volvo with a leather-free interior as standard, using sustainable materials like Nordico microfiber. The vehicle was renamed from C40 Recharge to EC40 in 2024 as part of Volvo's shift to a new naming convention where all electric coupes start with "EC". The EC40 features a dual-motor AWD system or single-motor RWD derived from Polestar engineering. It is manufactured in Ghent, Belgium.

