overview: >
  The Volvo EC40 (formerly known as the C40 Recharge) is a compact electric coupe SUV built on Volvo's CMA (Compact Modular Architecture) platform. Originally launched in 2021 as the C40 Recharge, it was rebranded to EC40 in 2024 as part of Volvo's new electric vehicle naming convention where "EC" denotes electric coupe. The EC40 is essentially a sportier, more aerodynamic version of the EX40 (formerly XC40 Recharge) with a sloping roofline that improves efficiency. It was Volvo's first car to be sold exclusively online and features twin-motor all-wheel drive or single-motor rear-wheel drive configurations. The EC40 shares its platform with the Polestar 2 and EX40, offering Volvo's signature Scandinavian design, premium interior materials, advanced safety systems, and Google-built infotainment. Thanks to its superior aerodynamics (Cd 0.30 vs 0.33), the EC40 achieves longer range than the EX40 despite identical powertrains. The EC40 competes with vehicles like the Tesla Model Y, BMW iX3, Mercedes EQA, and Polestar 2.

