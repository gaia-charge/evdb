safety_notes: |
  Controversial 1-star Euro NCAP rating in 2021 due to basic safety structure and lack of 
  advanced driver assistance systems. However, 2024 facelift adds significant safety improvements:
  - 6 airbags (up from 2)
  - Automatic emergency braking with pedestrian/cyclist detection
  - Lane keeping assist
  - Traffic sign recognition
  - Speed limiter
  
  Dacia argues the rating doesn't reflect real-world city driving safety, where the Spring 
  excels at low speeds. The vehicle meets all mandatory European safety standards.

