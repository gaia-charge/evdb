target_market: |
  Budget-conscious first-time EV buyers, urban drivers, students, retirees, second-car 
  households, delivery fleets, car-sharing services, and buyers prioritizing low running 
  costs over performance or features. Strong appeal in Western Europe where EV incentives 
  make Spring extremely affordable (often under €10,000 after subsidies).

market_notes: |
  The Spring has been remarkably successful despite criticism of basic specifications and 
  1-star safety rating. It proves there's huge demand for genuinely affordable EVs - 
  something premium manufacturers haven't addressed.
  
  Best-selling electric vehicle in France in some months during 2022-2023, often outselling 
  Teslas and premium EVs. Particularly popular as company cars and for commercial/delivery 
  use (Spring Cargo variant).
  
  The 2024 facelift addresses criticism with improved safety, better interior quality, 
  and modern infotainment while maintaining aggressive pricing. Dacia's strategy: make 
  electric mobility accessible rather than aspirational.

# Notes
notes: |
  **Value Proposition:**
  - Purchase price: €18,900-22,400 (Germany, before incentives)
  - After incentives: Often under €12,000 in France/Germany
  - Running costs: ~€2-3 per 100km electricity (vs €8-12 petrol)
  - Maintenance: Minimal (no oil changes, simple drivetrain)
  - Insurance: Low (affordable replacement value)
  
  **Limitations to Consider:**
  - Basic safety: 1-star Euro NCAP (2021), improved in 2024 but not re-tested
  - Limited range: 220km WLTP means ~170km real-world
  - Slow charging: 30kW DC max (10-80% in 45 minutes)
  - Basic interior: Hard plastics, simple materials
  - Performance: 19.1s 0-100km/h, 125km/h top speed
  - No heat pump (range drops significantly in cold weather)
  
  **Perfect For:**
  - City driving only (parking, traffic, short distances)
  - Daily commutes under 50km
  - Second household vehicle
  - Budget-conscious buyers
  - Commercial urban delivery
  
  **Not Suitable For:**
  - Motorway driving (range anxiety, slow acceleration)
  - Long-distance travel
  - Family as sole vehicle
  - Cold climates (no heat pump, range loss)
  
  **2024 Facelift Improvements:**
  - New front/rear design (more modern, SUV-inspired)
  - 10" touchscreen (up from 7")
  - Wireless Apple CarPlay/Android Auto
  - 6 airbags (up from 2)
  - Enhanced ADAS (AEB, lane keep, sign recognition)
  - Improved interior materials and quality
  - New color options
  - LED headlights standard
  
  **Commercial Variant:**
  Dacia Spring Cargo offers 2-seat commercial van version with 800L cargo space, 
  popular with delivery services and tradespeople for urban logistics.

