# Overview
description: |
  The Dacia Spring is Europe's most affordable electric vehicle, with prices starting below €20,000. 
  Launched in 2021 as Dacia's first pure electric model, the Spring targets budget-conscious buyers 
  and urban drivers seeking basic, reliable electric mobility without premium features or long-range 
  anxiety.
  
  Based on the Renault K-ZE (China-market model derived from Renault Kwid), the Spring features a 
  modest 26.8kWh battery providing 220-230km WLTP range - adequate for city driving and short commutes. 
  The 33kW (45hp) motor delivers sprightly city performance despite leisurely 0-100km/h acceleration.
  
  Updated in 2024 with improved styling, upgraded interior, better infotainment, and enhanced safety 
  features, the Spring maintains its position as Europe's value EV champion. Despite basic specifications, 
  it offers practicality, low running costs, and genuine four-seater capability - making electric 
  mobility accessible to mainstream buyers who previously couldn't afford EVs.

