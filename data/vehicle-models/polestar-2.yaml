description: |
  The Polestar 2 is a battery electric 5-door liftback produced by Polestar since 2019. 
  It is the first fully electric vehicle from Polestar and the brand's first mass-production model.

  Built on Volvo's CMA platform (shared with Volvo XC40 Recharge), the Polestar 2 features 
  distinctive Scandinavian design, advanced technology including Google Automotive Services 
  integrated natively, and performance-oriented dynamics.

  The vehicle features a unique fastback design with a large glass roof, frameless mirrors, 
  and minimalist interior with vegan-friendly materials. It's positioned as a direct competitor 
  to the Tesla Model 3.

