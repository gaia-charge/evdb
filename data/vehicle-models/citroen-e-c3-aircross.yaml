notes: |
  The Citroën ë-C3 Aircross is a compact electric SUV offering up to 7 seats at
  an affordable price point. Available in two battery options (44 kWh and 54 kWh),
  it provides 307-400 km WLTP range. Starting at €26,490 in Germany, it's one of
  the most affordable electric family SUVs in Europe.
  
  Competes with: Dacia Spring, Opel Mokka-e, Peugeot e-2008, Jeep Avenger.
