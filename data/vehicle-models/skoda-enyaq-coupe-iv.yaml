description: |
  The Škoda Enyaq Coupé iV is the sportier, more aerodynamic variant of the popular Enyaq iV SUV. Launched in 2022, 
  the Coupé features a sloping roofline, redesigned rear end, and improved aerodynamics (Cd 0.26 vs 0.27 for standard SUV).
  
  Despite the sportier styling, the Coupé maintains impressive practicality with 570L boot capacity (only 15L less than SUV) 
  and identical interior space. The lower roofline and streamlined design result in up to 15km additional WLTP range 
  compared to equivalent SUV variants.
  
  Built on Volkswagen Group's MEB platform (shared with VW ID.5, Audi Q4 Sportback e-tron), the Enyaq Coupé offers 
  exceptional value - typically priced €2,000-3,000 above the regular Enyaq but €4,000-6,000 below equivalent 
  Audi Q4 Sportback e-tron.
  
  The 2024 model year facelift brought updated styling with new front and rear design, improved Infotainment ME3 
  software with ChatGPT-powered Laura assistant, and enhanced efficiency.

