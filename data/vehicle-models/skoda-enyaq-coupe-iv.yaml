notes: |
  Built at Škoda's Mladá Boleslav plant, Czech Republic. The Coupé version launched in January 2022, 
  approximately 1 year after the standard SUV. Improved aerodynamics (Cd 0.26) result in 10-15km additional 
  range vs equivalent SUV variants. Despite sportier styling, boot capacity only 15L smaller than SUV 
  (570L vs 585L) - exceptional practicality for a coupé. 2024 facelift: new front/rear design, improved 
  software (ME3), Laura AI assistant. Battery preconditioning for optimal DC fast charging. 
  Shares platform with VW ID.5 and Audi Q4 Sportback e-tron. Exceptional value: typically €5,000-7,000 
  cheaper than equivalent Audi Q4 Sportback e-tron while offering similar equipment and more space.

