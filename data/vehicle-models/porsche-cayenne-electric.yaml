description: |
  The first all-electric Porsche Cayenne marks a major milestone for Porsche's best-selling model line.
  Built on the PPE (Premium Platform Electric) platform shared with the Macan Electric and Audi Q6/A6 e-tron,
  the Cayenne Electric features a massive 113 kWh battery, 800V architecture, and up to 390 kW DC fast charging.
  The Turbo variant delivers an extraordinary 850 kW (1,156 PS) with 0-100 km/h in 2.5 seconds.
  Retains the Cayenne's signature blend of luxury SUV comfort and sports car performance.
