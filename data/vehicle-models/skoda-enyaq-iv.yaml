description: |
  The Škoda Enyaq iV is Škoda's first purpose-built electric vehicle, launched in 2020 as a compact electric SUV. 
  Built on Volkswagen Group's MEB platform (shared with VW ID.4, Audi Q4 e-tron), the Enyaq offers exceptional 
  interior space, practical "Simply Clever" features, and competitive pricing.
  
  The Enyaq is particularly praised for its spacious cabin (class-leading rear legroom), large boot (585L), and 
  generous equipment levels. It's consistently one of Europe's best-selling electric SUVs.
  
  Available in both SUV and Coupé body styles with battery options from 58kWh to 82kWh. The 2024 model year 
  facelift brought updated styling, improved software (ME3), and slightly longer range.

