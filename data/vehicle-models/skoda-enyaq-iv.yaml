notes: |
  Built at Škoda's Mladá Boleslav plant, Czech Republic. Also available in sportier vRS variant (220kW, 0-100 in 6.5s).
  Coupé variant has sportier styling and slightly better aerodynamics (Cd 0.25). 2024 facelift: new front/rear design, 
  improved software (ME3), Laura AI assistant. Battery preconditioning for optimal DC fast charging. One of Europe's 
  best-selling electric SUVs (consistently top 10). Shares ~70% of parts with VW ID.4 and Audi Q4 e-tron. 
  Exceptional value: typically €3,000-5,000 cheaper than equivalent VW ID.4.

