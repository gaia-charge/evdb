notes: |
  The Citroën ë-C3 is Stellantis' answer to affordable electric mobility for families.
  Positioned below the ë-C4 and priced to compete with Dacia Spring and MG4, it offers
  practical space and modern technology at an accessible price point.

  Key advantages:
  - Affordable entry into electric crossover segment
  - Practical family space with 310L trunk
  - Citroën's signature comfort focus
  - Modern connectivity and smartphone integration
  - Good ground clearance for crossover versatility

  Built on Stellantis' new Smart Car platform designed specifically for affordable EVs,
  the ë-C3 aims to democratize electric mobility in Europe with pricing under €25,000
  in some markets with incentives.

  Competes with: Dacia Spring, MG4, Renault Zoe, Fiat 500e.
