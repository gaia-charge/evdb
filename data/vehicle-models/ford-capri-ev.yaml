notes: |
  The Ford Capri EV revives the iconic Capri nameplate as an electric coupe-SUV 
  built on the VW MEB platform. Shares many body panels with the Ford Explorer EV 
  including bonnet, front fenders and doors, but features a coupe-like silhouette 
  with the distinctive 'Capri Swoosh' side window design. Suspension is lowered 
  10mm vs Explorer with stiffer setup. Features 15-inch adjustable SYNC Move 
  touchscreen and Bang & Olufsen sound bar. Interior uses sustainable 'Sensical' 
  leather-free material. Produced at Cologne Body & Assembly plant in Germany.

