description: >
  Kia EV6 is a compact electric crossover built on the E-GMP platform. Winner of 2022 World Car of the Year,
  European Car of the Year 2022, and numerous other awards. Features distinctive design, 800V fast charging
  capability, V2L (Vehicle-to-Load), and available AWD with impressive performance. The EV6 GT variant offers
  supercar-level acceleration.

notes: >
  - Built on Hyundai Motor Group's E-GMP (Electric-Global Modular Platform)
  - Shares technical foundation with Hyundai Ioniq 5 and Genesis GV60
  - 800V electrical architecture enables ultra-fast charging (10-80% in 18 minutes)
  - V2L capability (3.6kW) - Vehicle-to-Load for powering devices
  - Available with RWD or AWD
  - GT variant offers 430kW (585hp) and 0-100 km/h in 3.5 seconds
  - Winner of multiple Car of the Year awards (2022)
  - Built in South Korea (Hwaseong plant)

