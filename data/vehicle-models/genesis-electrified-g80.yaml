  - "Polestar 2 Long Range Dual Motor"

notes: |
  Genesis' first electric sedan based on adapted combustion G80 platform rather than
  dedicated EV architecture. 400V electrical system (not 800V) results in slower DC
  charging vs GV60/EV6 siblings. Emphasizes traditional executive sedan luxury with
  spacious rear legroom, refined ride quality, and comprehensive standard equipment.
  Strong value proposition at €84,000 base price versus €90k+ German competitors.

