id: genesis-electrified-g80
manufacturer_id: genesis
brand: "Genesis"
name: "Electrified G80"
body_style: sedan
model_year: 2024
segment: E

description: |
  Genesis Electrified G80 is Genesis' flagship electric luxury sedan, adapting the
  combustion G80 with dual-motor electric powertrain. Premium E-segment executive sedan
  combines Genesis' signature design language with 87.2 kWh battery delivering practical
  520 km WLTP range. Dual-motor AWD system produces 272 kW (370 hp) for refined yet
  spirited performance with 4.9-second 0-100 km/h acceleration. Represents Genesis'
  commitment to electrification of their core lineup while maintaining the craftsmanship
  and luxury positioning that defines the brand.

launch_year: 2022
platform: E-GMP-derived
platform_notes: |
  Based on modified E-GMP platform adapted for G80's executive sedan proportions.
  400V architecture (not 800V like dedicated E-GMP vehicles).

market_positioning: |
  Premium electric alternative to Mercedes EQE and BMW i5, positioned as Genesis'
  electric flagship sedan. Targets established luxury sedan buyers making transition
  to electric mobility who value traditional executive sedan dimensions and presence
  over sportier EV6/GV60 crossover styling.

target_buyers:
  - "Executive sedan buyers seeking electric alternative"
  - "Mercedes E-Class/BMW 5 Series owners considering EV"
  - "Company car drivers prioritizing luxury and presence"
  - "Genesis brand loyalists"
  - "Buyers wanting full-size sedan with EV powertrain"

key_features:
  - "87.2 kWh battery for 520 km WLTP range"
  - "Dual-motor AWD 272 kW (370 hp)"
  - "Lexicon 21-speaker premium audio system"
  - "Nappa leather quilted seats with massage"
