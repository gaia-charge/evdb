notes: |
  The BYD Sealion 7 is a performance-oriented electric SUV competing directly with
  the Tesla Model Y. Available in RWD and AWD configurations with BYD's Blade Battery
  technology. Launched in Europe in late 2024 with competitive pricing.
  
  Key features: ultra-low 0.258 Cd drag coefficient, 502-542 km WLTP range,
  up to 390 kW in AWD Excellence variant.
  
  Competes with: Tesla Model Y, Hyundai Ioniq 5, Volkswagen ID.4, BMW iX1.
