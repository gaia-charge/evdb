description: >
  The Nissan Ariya is a compact electric crossover SUV and Nissan's second pure-electric vehicle
  after the LEAF. Built on the CMF-EV platform shared with the Renault Megane E-Tech, the Ariya
  represents Nissan's modern design language with a sleek, coupe-like roofline and minimalist
  interior. Available with front-wheel or all-wheel drive (e-4ORCE) and two battery sizes (63kWh
  and 87kWh). The Ariya features Nissan's ProPILOT Assist 2.0 semi-autonomous driving system and
  a spacious, tech-forward cabin with dual 12.3" displays and a flat floor thanks to the dedicated
  EV platform.

