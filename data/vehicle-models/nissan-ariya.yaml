notes: >
  The Ariya is Nissan's flagship electric SUV, positioned above the LEAF. It marks a significant
  departure from the LEAF's design, featuring a sleek, modern aesthetic and advanced technology.
  The e-4ORCE all-wheel drive system provides excellent traction and handling. Available with two
  battery sizes: Venture (63kWh usable, FWD only) and Evolve/Engage (87kWh usable, FWD or AWD).
  The CMF-EV platform provides excellent interior space with a completely flat floor.

