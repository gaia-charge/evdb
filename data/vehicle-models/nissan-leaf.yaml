description: >
  The Nissan Leaf is the world's first mass-market electric vehicle, launched in December 2010.
  It revolutionized the EV market by proving that practical, affordable electric cars were
  commercially viable. The Leaf was the world's best-selling EV from 2010 to 2019, with over
  650,000 units sold globally. The second-generation Leaf (ZE1, 2017-present) brought significant
  improvements including larger batteries (40kWh/62kWh), ProPILOT Assist, and modern design.
  The Leaf pioneered many EV technologies including CHAdeMO fast charging (co-founded by Nissan),
  V2G/V2H bidirectional charging for home energy storage, and one-pedal e-Pedal driving.
  Despite newer competition, the Leaf remains popular for its reliability, proven track record,
  and value proposition.

