description: >
  The Nissan Leaf is the world's first mass-market electric vehicle, launched in December 2010.
  The third generation (2025) is a complete reinvention built on the Renault-Nissan CMF-EV platform,
  sharing its architecture with the Renault Megane E-Tech and Scenic E-Tech. The new LEAF is larger,
  more aerodynamic, and features CCS2 fast charging up to 150kW, replacing the CHAdeMO standard
  Nissan pioneered. Available with 52kWh (436km WLTP) and 75kWh (622km WLTP) batteries, it offers
  class-leading efficiency at 13.8 kWh/100km. The new LEAF includes Google built-in infotainment,
  ProPILOT Assist with Navi-Link, and V2L/V2H bidirectional charging. Over 650,000 units of
  previous generations were sold globally, making it one of the most successful EVs in history.

