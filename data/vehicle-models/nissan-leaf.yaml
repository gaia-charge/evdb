notes: >
  The Nissan Leaf is the most significant electric vehicle in history after the Tesla Roadster.
  It proved that mass-market EVs were commercially viable and kickstarted the global EV revolution.
  Over 650,000 units sold globally make it one of the most successful EVs ever. The second-generation
  ZE1 (2017+) addressed most criticisms of the original with larger batteries, ProPILOT, better
  range, and modern styling. The 62kWh e+ variant offers 385km real-world range, competitive
  with newer EVs. However, the LEAF's reliance on CHAdeMO (vs CCS2 in Europe) and passive
  air-cooled battery (no active thermal management) are weaknesses. Despite newer competition,
  the LEAF remains popular for its proven reliability, extensive service network, and value
  pricing. Nissan sold the 500,000th LEAF in 2020.

