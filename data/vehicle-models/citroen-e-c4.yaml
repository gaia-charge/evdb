notes: |
  The Citroën ë-C4 is a compact electric crossover/SUV built on the Stellantis eCMP platform.
  It shares the same 50kWh battery as the Peugeot e-208 and Opel Corsa-e but in a larger,
  more spacious C-segment crossover body.
  
  Key differentiators:
  - Advanced Comfort Seats with 15mm extra foam (segment-leading comfort)
  - Progressive Hydraulic Cushions suspension for superior ride quality
  - Unique coupe-like roofline design
  - Higher ride height (156mm ground clearance) vs e-208 (140mm)
  - More cargo space (380L vs 309L for e-208)
  - C-segment size vs B-segment e-208/Corsa-e
  
  Competes with: VW ID.3, Kia Niro EV, MG4, Renault Megane E-Tech
  
  2024 facelift brought minor updates to infotainment and connectivity.
