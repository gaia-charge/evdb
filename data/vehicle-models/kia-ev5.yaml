description: >
  The Kia EV5 is a compact electric SUV positioned between the EV3 and EV6 in Kia's lineup.
  Built on the E-GMP platform, it offers a spacious family-friendly interior with generous
  rear legroom, a flat-folding rear bench, and impressive range from an 84 kWh battery.
  Originally launched in China in 2024, the European version arrived in 2025 with adapted
  specifications including 400V architecture and competitive pricing starting under €46,000.

notes: >
  - Built on E-GMP platform (400V architecture for European version)
  - Single motor RWD only for European market
  - V2L capability (3.6kW) standard
  - Rear seats fold completely flat (0°) creating 2-meter load floor
  - Heat pump standard on all variants
  - 12.3-inch dual curved displays
  - Available with Premium Relaxation seats (GT-Line)
  - 566L boot + 44L frunk = excellent practicality
  - First shown in China (2024), European sales from Q2 2025
  - Manufactured in South Korea for European market

