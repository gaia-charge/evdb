description: >
  Audi Q6 Sportback e-tron is the coupe variant of the Q6 e-tron SUV, featuring a sloping roofline
  for improved aerodynamics (Cd 0.26) and sportier styling. Built on Volkswagen Group's PPE platform
  co-developed with Porsche, it offers 800V architecture enabling ultra-fast charging up to 270kW.

  The Sportback delivers slightly better range than the SUV variant thanks to improved aerodynamics,
  while maintaining impressive practicality with 511L trunk capacity. Available in RWD and quattro AWD
  configurations, it features Audi's latest MMI touch display system with three screens (14.9" center,
  11.9" digital cluster, 10.9" passenger display) and comprehensive ADAS suite.

  Key features include standard air suspension, heat pump, matrix LED headlights, and bi-directional
  charging (V2L/V2H/V2G). The Q6 Sportback competes with BMW iX, Mercedes EQE SUV, and Genesis GV70
  Electrified in the premium electric coupe SUV segment.
