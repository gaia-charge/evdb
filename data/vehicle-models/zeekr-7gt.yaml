overview: >
  The Zeekr 7GT is a large electric shooting brake / estate car built on Geely's SEA3 platform.
  Positioned as a stylish, spacious fastback wagon, it competes with the Porsche Taycan Sport Turismo
  and BMW i5 Touring. The 7GT features 800V architecture with ultra-fast 480kW DC charging (CATL QILIN
  battery), making it one of the fastest-charging EVs in Europe. Available in RWD Long Range and AWD
  Privilege configurations, it combines striking design with practical estate car versatility.

