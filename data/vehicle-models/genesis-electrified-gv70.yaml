notes: |
  Genesis Electrified GV70 is the luxury brand's first electric SUV.
  Built on Hyundai Motor Group's E-GMP platform with 800V ultra-fast charging.
  Offers 350kW DC charging: 10-80% in ~18 minutes (ideal conditions).
  Vehicle-to-Load (V2L) capability: power external devices up to 3.6kW.
  Premium luxury interior with quilted Nappa leather and metal accents.
  "Athletic Elegance" design philosophy with distinctive Genesis styling.
  Competes with Mercedes-Benz EQE SUV, BMW iX3, Audi Q4 e-tron.
  Standard AWD with dual motors for superior traction and performance.
  Exceptional warranty: 5yr/100,000km vehicle, 10yr/160,000km battery.

