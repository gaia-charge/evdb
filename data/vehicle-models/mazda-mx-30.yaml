description: >
  The Mazda MX-30 is Mazda's first pure-electric vehicle, launched in 2020 for European
  and Japanese markets. The MX-30 features a distinctive design with "freestyle doors"
  (rear-hinged rear doors with no B-pillar when open), creating a unique entry experience.
  The vehicle has a relatively small 35.5 kWh battery providing 200 km WLTP range,
  which Mazda justifies with a focus on minimizing environmental impact from battery
  production and targeting urban/suburban use cases. The interior features sustainable
  materials including cork (a nod to Mazda's origins as a cork manufacturer) and
  recycled fabrics. The MX-30 emphasizes driving enjoyment and sustainability over
  maximum range, appealing to buyers prioritizing design and environmental consciousness.

