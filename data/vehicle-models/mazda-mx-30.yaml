notes: >
  The MX-30 is Mazda's unique take on electric mobility, prioritizing sustainability
  and design over maximum range. The 35.5 kWh battery (200 km WLTP) is intentionally
  small to reduce production emissions - Mazda's life-cycle assessment approach.
  Unique freestyle doors create a premium feel but limit practicality. Available
  with R-EV range extender (rotary engine generator) from 2023 in some markets.
  Target audience: urban/suburban drivers, second cars, environmentally conscious
  buyers who prioritize design. Not suitable for long-distance travel without
  frequent charging. Competes with Mini Cooper Electric, Honda e, Smart #1.

