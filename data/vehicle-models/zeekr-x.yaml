overview: >
  The Zeekr X is a compact electric crossover SUV built on Geely's SEA2 platform, shared with the Volvo EX30 and Smart #1. Slightly larger than those siblings at 4,450mm long, the X slots between compact and mid-size crossover segments. Available in rear-wheel-drive and all-wheel-drive configurations with a 69kWh NMC battery, it offers up to 440km WLTP range. The dual-motor AWD version produces 315kW (422hp) for a 3.8s 0-100 km/h sprint. Zeekr entered Europe in late 2024 with direct-to-consumer sales across six countries. The X features a 14.6-inch floating center screen, panoramic roof as standard, and Euro NCAP 5-star safety rating.

