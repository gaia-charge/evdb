notes: >
  The Zeekr X is built in Chengdu, China and shares its SEA2 platform with the Volvo EX30 and Smart #1, though it's noticeably larger than both. European specification vehicles were tuned at Zeekr's R&D center in Gothenburg, Sweden. The X received Euro NCAP 5 stars in 2024. In Europe, it competes with the Volvo EX30, Smart #1, VW ID.3, and Cupra Born. Direct-to-consumer sales model without traditional dealerships.

