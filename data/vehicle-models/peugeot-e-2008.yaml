notes: |
  The Peugeot e-2008 is the electric version of Peugeot's popular B-segment SUV.
  It shares the CMP platform with the Opel Mokka-e and DS 3 Crossback E-Tense.

  Key advantages vs competitors:
  - Best-in-class trunk space (405L vs 310L Mokka-e, vs ~350L typical)
  - Distinctive Peugeot 3D i-Cockpit design (love it or hate it)
  - Strong value proposition with good equipment levels
  - Grip Control system for enhanced traction (optional)
  - Higher seating position than e-208 hatchback

  Key differentiators vs Opel Mokka-e:
  - Traditional SUV proportions (vs Mokka's coupe-like sportiness)
  - 405L trunk vs 310L in Mokka-e (30% more cargo space!)
  - Slightly higher price but more practical
  - Peugeot's signature 3D i-Cockpit vs Opel's conventional layout

  2023 facelift brought updated 54 kWh battery (from 50 kWh), improving range to 406 km WLTP.

  Competes with: Opel Mokka-e, Jeep Avenger, MG ZS EV, Nissan Ariya (though Ariya is larger/pricier).
