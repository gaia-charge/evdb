notes: |
  The Dongfeng Nammi Box is one of the most affordable electric cars available in Europe,
  targeting the city car segment with competitive pricing under €20,000 in some markets.
  Launched in Europe in late 2024, initially in Italy and Spain, with expansion to other
  markets in 2025. Competes directly with Dacia Spring and Citroën ë-C3.

  Key advantages:
  - Ultra-competitive pricing
  - Decent range for city use (320km WLTP)
  - Modern interior with large touchscreen
  - LFP battery for longevity

  Competes with: Dacia Spring, Citroën ë-C3, Leapmotor T03, Fiat 500e
