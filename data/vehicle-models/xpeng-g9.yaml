overview: >
  The XPENG G9 is a mid-size electric SUV positioned above the G6 in XPENG's lineup, competing with the BMW iX, Mercedes EQE SUV, and Tesla Model X. Built on XPENG's SEPA 2.0 platform with 800V SiC architecture, it offers exceptional DC charging speeds up to 525kW on Long Range and Performance variants. The 2025 facelift (G9A) brings LFP battery chemistry, refreshed design, and improved efficiency. Available in three variants: Standard Range (79.0kWh, 502km), Long Range (93.1kWh, 585km), and Performance AWD (93.1kWh, 540km). The Performance variant features dual motors with 423kW total output, air suspension, and 21-inch wheels.

