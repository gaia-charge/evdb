notes: >
  The XPENG G9 2025 facelift (G9A) is the version sold in Europe from July 2025. All variants use LFP (lithium iron phosphate) battery chemistry from CATL. The 800V SiC architecture enables very fast DC charging — the Long Range and Performance models support up to 525kW, achieving 10-80% in approximately 12 minutes. The Standard Range supports up to 445kW. The Performance variant uniquely features air suspension front and rear, 21-inch wheels, and a lower ride height (1670mm). 7-year/160,000km vehicle warranty and 8-year/160,000km battery warranty. Manufactured in Zhaoqing, China.

