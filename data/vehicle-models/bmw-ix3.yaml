notes: "First mass-production BMW electric SUV (launched 2020). Gen 1 built on CLAR platform (shared with X3, RWD only, produced in Shenyang, China). Gen 2 (2026+) completely redesigned on Neue Klasse platform with 800V architecture, 400kW DC charging, cylindrical cells, and BMW Panoramic Vision HUD. Gen 2 produced in Debrecen, Hungary. Gen 2 available in AWD (50 xDrive) with 115 kWh battery, 805 km WLTP range. Competes with Mercedes GLC Electric, Audi Q6 e-tron, Tesla Model Y."

