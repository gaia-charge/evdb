description: >
  The BMW iX3 is BMW's first mass-production electric SUV, based on the popular X3 platform.
  Launched in 2020 for the European and Chinese markets (not sold in North America), it features
  a single rear motor with 80kWh battery delivering up to 461km WLTP range. The iX3 was BMW's
  first model to use the fifth-generation eDrive technology and showcases BMW's commitment
  to electrifying their existing lineup.
  
  Built on the flexible CLAR platform alongside gasoline and diesel X3 variants, the iX3
  offers familiar X3 practicality with zero emissions. Key features include 150kW DC fast
  charging, adaptive air suspension, and BMW's latest iDrive 7 infotainment. The iX3 targets
  premium SUV buyers seeking electric mobility without compromising on space or luxury.

