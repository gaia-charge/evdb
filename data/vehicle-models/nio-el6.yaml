notes: >
  The EL6 is NIO's volume model for Europe, offering the most accessible entry point to the  NIO ecosystem while retaining the brand's signature features. Known as ES6 in China, it  was renamed EL6 for European markets. The SUV form factor combined with NIO's BaaS model  and comprehensive standard equipment makes it a strong competitor in the premium mid-size  electric SUV segment.

