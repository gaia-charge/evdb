overview: >
  The NIO EL6 is a premium mid-size electric SUV built on NIO's NT 2.0 platform. Positioned  as a versatile all-rounder competing with the BMW iX3, Mercedes EQC successor, and Tesla  Model Y Performance, the EL6 offers dual-motor AWD with 360kW (490 PS) and 700 Nm,  achieving 4.5s 0-100 km/h.

  At 4,854 mm long with a 2,915 mm wheelbase, the EL6 provides generous interior space with  5 seats. It features NIO's signature comprehensive equipment including Nappa leather,  12.8-inch AMOLED display, NOMI AI companion, Dolby Atmos surround sound, and the Aquila  Super Sensing system with lidar. Available with 75 kWh (410 km WLTP) or 100 kWh (505 km  WLTP) battery packs, both swappable at NIO Power Swap stations.

