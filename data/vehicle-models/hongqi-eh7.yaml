description: >
  The Hongqi EH7 is the first model from Chinese luxury brand Hongqi to launch in Europe.
  A sleek electric executive sedan with a low drag coefficient of 0.205 Cd, it offers
  impressive range from a 111 kWh battery (up to 655 km WLTP). Built on FAW's FMEs
  platform, it features a luxurious interior with premium materials and advanced technology.
  European sales began in the Netherlands in early 2025, with further market expansion
  planned.

notes: >
  - Ultra-low drag coefficient of 0.205 Cd
  - Available in Standard Range (62 kWh) and Long Range (111 kWh) configurations
  - AWD performance variant also available
  - Heat pump standard on all variants
  - 400V architecture
  - First Hongqi model sold in Europe
  - Manufactured in China
  - European sales launched in Netherlands Q1 2025

