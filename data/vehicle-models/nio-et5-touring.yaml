description: >
  The NIO ET5 Touring is the estate/wagon variant of the ET5 sedan, offering
  the same advanced electric powertrain in a more practical body style. Built on
  NIO's NT 2.0 platform, it features the company's innovative battery swap
  technology, allowing owners to swap between 75 kWh and 100 kWh battery packs
  at NIO Power Swap stations.

  The ET5 Touring combines elegant wagon design with strong performance (360 kW
  AWD) and competitive range (up to 580 km WLTP with 100 kWh battery). It
  targets premium wagon buyers seeking electric alternatives to BMW 3 Series
  Touring and Audi A4 Avant.

  Available in Europe with NIO's Battery-as-a-Service (BaaS) subscription model,
  which reduces purchase price by separating battery cost. NIO's growing network
  of Power Swap stations enables 5-minute battery swaps as an alternative to
  traditional charging.

key_features:
  - NIO Battery Swap technology (5-minute battery swap at Power Swap stations)
  - Battery-as-a-Service (BaaS) subscription model option
  - NT 2.0 platform with dual-motor AWD (360 kW)
  - NOMI AI companion (dashboard-mounted AI assistant)
  - 75 kWh Standard Range or 100 kWh Long Range battery options
  - Air suspension with adaptive damping
  - 12.8" AMOLED centre display
  - 256-color ambient lighting with 7.1.4 Dolby Atmos sound
  - NIO Autonomous Driving (NAD) hardware suite
  - Over-the-air (OTA) software updates

notable_competitors:
