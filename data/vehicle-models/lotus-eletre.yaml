description: >
  The Lotus Eletre is the British marque's first-ever SUV and first series production electric vehicle.
  Built on Geely's dedicated EPA platform and manufactured in China, it represents Lotus's bold entry
  into the premium electric SUV market. Despite being an SUV, the Eletre maintains Lotus's performance DNA
  with powerful dual-motor powertrains, active aerodynamics, air suspension, and exceptional handling dynamics.
  The design features a distinctive light bar across the front, deployable LIDAR for autonomous driving capabilities,
  and a driver-focused cockpit. Available in multiple power levels from 450 kW to 675 kW, it competes with
  Porsche Cayenne Turbo E-Hybrid and offers genuine sports car performance in SUV form.

