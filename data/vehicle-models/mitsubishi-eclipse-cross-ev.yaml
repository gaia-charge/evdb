description: |
  The Mitsubishi Eclipse Cross EV is Mitsubishi's first pure battery-electric vehicle for the
  European market, built on the Renault-Nissan-Mitsubishi Alliance's AmpR Medium (CMF-EV) platform
  shared with the Renault Scenic E-Tech and Nissan Ariya. This compact SUV replaces the previous
  Eclipse Cross PHEV with a fully electric powertrain.
  
  Featuring an 87 kWh usable battery (92 kWh nominal) with up to 633 km WLTP range, the Eclipse
  Cross EV offers competitive specs in the growing C-segment electric SUV market. The 160 kW
  front motor delivers adequate performance (7.9s 0-100 km/h), while 150 kW DC fast charging
  enables practical long-distance travel.
  
  The vehicle supports V2L (Vehicle-to-Load) with 3 kW output, and features a heat pump for
  improved winter efficiency. Based on the proven AmpR Medium platform, it benefits from the
  Alliance's shared development and proven EV technology.
