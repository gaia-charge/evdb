notes: |
  First pure BEV from Mitsubishi for Europe. MY2026.
  Built on Alliance AmpR Medium platform (same as Renault Scenic E-Tech, Nissan Ariya).
  192 pouch cells in 96s2p configuration (NMC chemistry).
  Compact dimensions (4,470 mm length) but spacious 545L boot.
  Expected to launch in European markets during 2026.
