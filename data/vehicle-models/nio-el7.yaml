notes: >
  The NIO EL7 is NIO's sportiest SUV, positioned as a more dynamic alternative to the  EL8 7-seater. Full aluminum body construction keeps weight manageable despite its size.  Compatible with NIO Power Swap stations for quick battery exchanges (~5 min). The Aquila  Super Sensing system includes 1 LiDAR, 7 800-megapixel cameras, 4 surround cameras,  5 millimeter-wave radars, 12 ultrasonic sensors, 2 high-precision positioning units, and  a V2X module. 5-star Euro NCAP (2023) with 93% adult occupant score.

