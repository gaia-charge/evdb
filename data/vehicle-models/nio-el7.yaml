overview: >
  The NIO EL7 is a premium mid-size electric SUV built on NIO's NT 2.0 platform, known as  the ES7 in China. It sits between the smaller EL6 and the larger EL8 in NIO's lineup.  With dual-motor AWD producing 480 kW (653 PS) combined — 180 kW front induction motor  and 300 kW rear permanent magnet motor — it delivers 3.9s 0-100 km/h acceleration.

  At 4,912 mm long with a 2,960 mm wheelbase, the EL7 offers generous space with premium  materials throughout. It features NIO's full-aluminum body, active air suspension, NOMI  AI companion, Aquila Super Sensing with LiDAR, and compatibility with NIO's battery swap  stations. Available with 75 kWh or 100 kWh swappable battery packs, achieving up to  509 km WLTP range with the larger battery.

