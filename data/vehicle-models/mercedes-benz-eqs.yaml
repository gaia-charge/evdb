notes: |
  The Mercedes-Benz EQS is the electric flagship sedan, representing the pinnacle of Mercedes luxury and technology.
  It's the first model on the dedicated EVA2 platform (Electric Vehicle Architecture 2), designed exclusively for electric vehicles.
  
  The EQS holds the world record for the most aerodynamic production car with a drag coefficient of Cd 0.20,
  enabling exceptional efficiency and range. The MBUX Hyperscreen (optional on 450+, standard on 580) is a
  56-inch curved glass panel spanning the entire dashboard, housing three displays under a single surface.
  
  Key innovations:
  - Rear-axle steering (up to 10°) reduces turning circle to just 10.9m despite 5.2m length
  - E-Active Body Control with active suspension (optional) adjusts each wheel independently
  - Digital Light headlights with over 1.3 million micro-mirrors per headlight
  - MBUX Augmented Reality navigation projects virtual arrows onto road via HUD
  
  The EQS competes with:
  - BMW i7 (larger, more traditional luxury)
  - Porsche Taycan (sportier, less practical)
  - Tesla Model S (faster, less luxurious)
  - Lucid Air (more range, less brand prestige)
  
  Built at Mercedes-Benz Factory 56 in Sindelfingen (carbon-neutral production).
  World Car of the Year 2022 (World Luxury Car), German Car of the Year 2022.

