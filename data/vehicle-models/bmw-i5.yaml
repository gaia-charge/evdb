description: >
  The BMW i5 is a fully electric executive sedan based on the eighth generation 5-series (G60).
  Launched in late 2023, it represents BMW's latest electric technology with improved efficiency,
  range, and charging speeds compared to the i4. Built on the flexible CLAR platform alongside
  gasoline, diesel, and plug-in hybrid variants, the i5 offers a spacious luxury sedan experience
  with advanced driver assistance systems and a refined interior. The i5 M60 xDrive performance
  variant delivers supercar acceleration in a practical executive sedan package.

