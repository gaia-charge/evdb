features:
  charging:
    - 190 kW DC fast charging
    - 22 kW AC charging (3-phase, standard)
    - 10-80% in approximately 27 minutes (DC)
    - 200 km range in 15 minutes
    - CCS2 connector (Europe)
  technology:
    - 33" diagonal LED display (9K resolution, 1 billion colors)
    - Google Built-In infotainment (Google Maps, Assistant, Play Store)
    - 19-speaker AKG Studio audio system with Dolby Atmos
    - Active Noise Cancellation
    - Super Cruise semi-autonomous driving (Level 2+)
    - Over-the-air updates
    - Head-up display
  performance:
    - Dual permanent magnet synchronous motors (AWD)
    - 528 PS (394 kW) system output
    - 610 Nm torque
    - Regen on Demand paddle (steering wheel recuperation control)
    - One-pedal driving
    - Multiple driving modes (Tour, Sport, Snow/Ice, My Mode)
  comfort:
    - Heat pump standard
    - Massage seats
    - Active Noise Cancellation
    - Panoramic glass roof with electric sunshade
    - Tri-zone automatic climate control
    - Heated and ventilated front seats
    - Wireless phone charging
  safety:
    - Super Cruise highway assist
    - Adaptive cruise control with Stop & Go
    - Lane Keep Assist
    - 360° camera system (HD Surround Vision)
    - Automatic emergency braking
    - Rear pedestrian alert
    - 5-star Euro NCAP expected
