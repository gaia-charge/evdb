notes: |
  First Cadillac sold in Germany through direct-to-consumer model.
  Won German Car of the Year 2025 (luxury category) - first US brand to win.
  European market gets AWD only (no RWD variant available).
  Three trims in Germany: Sport, Luxury, and V Series (Lyriq-V).
  Lyriq-V is the high-performance variant with 615 PS and 3.3s 0-100 km/h.
  Competitive pricing vs German luxury EVs (BMW iX, Mercedes EQE SUV, Audi Q8 e-tron).

