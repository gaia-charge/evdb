description: |
  The Cadillac Lyriq is Cadillac's first all-electric vehicle and the first GM production 
  vehicle built on the BEV3/Ultium platform. This mid-size luxury SUV combines American 
  design boldness with cutting-edge electric technology, featuring a massive 33-inch 
  diagonal LED display, 102 kWh NCMA battery, and dual-motor AWD with 528 PS.
  
  Winner of the German Car of the Year 2025 award in the luxury category - the first 
  American brand to receive this honor. Available in Europe exclusively with AWD 
  powertrain through Cadillac's direct-to-consumer sales model.
  
  The Lyriq offers exceptional value in the luxury electric SUV segment, undercutting 
  German competitors like BMW iX xDrive50, Mercedes EQE SUV, and Audi Q8 e-tron while 
  delivering comparable or superior specifications, a larger battery, and distinctive 
  American luxury character.
