  notes: |
    Mercedes-Benz EQA is the brand's entry-level electric SUV, based on the GLA platform.
    Launched in 2021 as Mercedes' first compact electric crossover, targeting urban families.

    Built on MFA2 platform (shared with GLA, GLB, A-Class, B-Class) - flexible architecture.
    Available in FWD (250/250+) and AWD (300 4MATIC, 350 4MATIC) variants.

    The 250+ variant (66.5kWh battery) replaced the original 250 (60.0kWh) in 2023.
    Major improvements: +6.5kWh battery, +86km range (423 vs 426km WLTP 250+).

    Positioned below EQB (7-seater) and above Smart #1 in Mercedes' electric lineup.
    Competes with BMW iX1, Audi Q4 e-tron 40, Volvo XC40 Recharge, Tesla Model Y.

    Key selling points:
    - Mercedes luxury brand prestige at accessible price (€54,399)
    - Proven MFA2 platform (shared with popular GLA)
    - Good warranty: 2 years + 8 years battery (160,000km)
    - Extensive dealer network (650+ in Germany)
    - Premium interior materials and build quality
    - Advanced MBUX infotainment system

    Weaknesses vs competitors:
    - Modest 100kW DC charging (vs 135-150kW competitors)
    - 426km range adequate but not class-leading (vs 488km Audi Q4 40)
    - Small 340L trunk (vs 405L Audi Q4, 452L BMW iX1)
    - No frunk (missed opportunity for extra storage)
    - Higher price than MG4/Enyaq for similar specs

    Built at Rastatt plant, Germany (alongside GLA).
    Over 50,000 units sold in 2023 (strong European sales).

