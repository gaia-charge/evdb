notes: |
  First all-electric Maserati SUV, part of the brand's Folgore (Italian for "lightning") electrification strategy.
  Built on Stellantis STLA Large platform with 800V architecture for fast charging capabilities.
  Combines Italian luxury craftsmanship with cutting-edge electric performance.
  Competes with Porsche Macan Electric, BMW iX3, and Mercedes EQC in the premium electric SUV segment.
  Production launched in 2023 at Cassino plant in Italy alongside combustion Grecale variants.

