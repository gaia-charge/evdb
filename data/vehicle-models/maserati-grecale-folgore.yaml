description: |
  Maserati's first all-electric SUV, the Grecale Folgore combines Italian luxury and design with advanced electric performance.
  Built on Stellantis' STLA Large platform with 800V architecture, it offers dual-motor AWD performance with over 550 hp.
  Features premium materials, advanced technology, and Maserati's signature driving dynamics in an electric package.
