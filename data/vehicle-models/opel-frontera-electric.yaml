description: >
  The Opel Frontera Electric is a compact electric SUV built on Stellantis' Smart Car
  platform. Reviving the Frontera nameplate last used in 2004, it offers a boxy, spacious
  design with up to 1,600 litres of cargo space. Available with 44 kWh standard range
  (300+ km WLTP) or long range battery (400+ km WLTP). Features Opel's Pure Panel
  cockpit with dual 10-inch displays, innovative Intelli-Seat front seats with tailbone
  pressure relief, and a standard smartphone station. Priced from around €29,000 in
  Germany, it targets families and outdoor enthusiasts seeking affordable electric mobility.
  Sister model to the Citroën ë-C3 Aircross and related to the Fiat Grande Panda.

notes: >
  Assembled in Trnava, Slovakia. Also available as Vauxhall Frontera in the UK.
  Hybrid version also available from €24,000. Optional roof rails and roof tent
  with ladder available. Roof load capacity up to 240 kg.

