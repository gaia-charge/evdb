description: >
  The Hyundai Ioniq 5 is the first model based on Hyundai's E-GMP dedicated electric platform.
  It features retro-futuristic design inspired by the 1974 Hyundai Pony, a spacious interior
  with flat floor, ultra-fast 800V charging (10-80% in 18 minutes), and innovative features
  like Vehicle-to-Load (V2L) that can power external devices. The long wheelbase provides
  exceptional interior space despite compact exterior dimensions.

