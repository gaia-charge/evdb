notes: >
  The EX30 Cross Country follows Volvo's tradition of creating rugged variants with the Cross Country badge, previously applied to V60, V90, and other models. Available exclusively with the Twin Motor Performance AWD drivetrain, it's positioned as the adventure-oriented EX30 for customers who want extra ground clearance and a more robust appearance. Revealed at IAA 2025.

