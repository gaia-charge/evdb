overview: >
  The Volvo EX30 Cross Country is a rugged-styled variant of the EX30 compact electric SUV, featuring raised ground clearance, black plastic body cladding, and a more adventure-oriented design. Available exclusively as the Twin Motor Performance AWD variant with 315kW (422hp), it combines the EX30's efficient compact footprint with genuine all-weather capability. The Cross Country treatment follows Volvo's long tradition of creating outdoor-focused versions of their vehicles. Built on Geely's SEA2 platform alongside the standard EX30, it uses the same 69kWh NMC battery for up to 450km WLTP range.

