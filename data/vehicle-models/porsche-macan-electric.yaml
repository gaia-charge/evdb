  - China
features:
  charging:
    - 800V architecture
    - 270 kW DC fast charging (PPE platform)
    - 10-80% in approximately 21 minutes
    - 11 kW AC standard, 22 kW AC optional
    - Plug & Charge support
  technology:
    - Porsche Driver Experience with curved display
    - 12.6" instrument cluster + 10.9" central touchscreen
    - Optional passenger display
    - Augmented reality head-up display
    - Porsche Connect services
    - Over-the-air updates
  performance:
    - Air suspension with adaptive dampers standard
    - Porsche Active Suspension Management (PASM)
    - Porsche Traction Management (PTM) on 4S
    - Rear-axle steering optional
    - Sport Chrono Package available
  comfort:
    - Heat pump standard
    - 14-way adjustable sport seats
    - Panoramic fixed glass roof
    - Tri-zone automatic climate control
    - Burmester 3D High-End Surround Sound optional (21 speakers)
  safety:
    - Porsche InnoDrive with adaptive cruise control
    - Lane Keep Assist with Lane Change Assist
    - Surround View with parking assist
    - 5-star Euro NCAP expected
