description: |
  Porsche's all-electric compact luxury SUV built on the advanced PPE platform shared with Audi Q6 e-tron.
  Features 800V architecture for ultra-fast charging, air suspension, and signature Porsche performance.
  Available in RWD and AWD configurations with impressive range and classic Porsche driving dynamics.
markets:
  - Germany
  - Europe
