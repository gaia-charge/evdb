notes: |
  First Porsche electric SUV, replacing the combustion Macan in most markets.
  Built on new PPE platform co-developed with Audi, featuring 800V electrical architecture.
  Offers best-in-class charging speed in segment (270 kW peak).
  Combines Porsche sports car DNA with SUV practicality and electric efficiency.
  Production started Q1 2024 in Leipzig alongside Panamera.
