notes: |
  The Volkswagen ID.5 is the coupe SUV variant of the ID.4, featuring a
  more athletic roofline and improved aerodynamics. Built on the MEB platform,
  it shares most components with ID.4 but offers sportier styling at the
  expense of some rear headroom and cargo space. Available in RWD (Pro) and
  AWD (Pro 4MOTION, GTX) configurations. Targets buyers seeking sportier
  alternative to the practical ID.4, competing with Tesla Model Y, Audi Q4
  Sportback e-tron, and BMW iX1.

