# Notes
notes: |
  Hyundai's smallest and most affordable electric vehicle, designed as a true city car
  with surprisingly spacious interior thanks to its flat EV floor and tall SUV-like silhouette.
  
  Despite its compact A-segment dimensions (3,825mm length), it offers practical space
  with sliding rear seats, fold-flat front seats, and 238-351L of cargo.
  
  Available with 42 kWh or 49 kWh battery. The Long Range version delivers up to
  370 km WLTP - segment-leading for a city car. DC fast charging from 10-80% in 30 minutes.
  
  Also available as INSTER Cross variant with rugged styling, 17" wheels, roof rails,
  and exclusive Amazonas Green Matte color.
  
  Multi-award winner including World Electric Vehicle of the Year 2025 and Goldenes
  Lenkrad 2025. Praised for value, technology, and practicality.
  
  Built in South Korea. Key competitor to Dacia Spring, Fiat 500e, and Citroën ë-C3.

