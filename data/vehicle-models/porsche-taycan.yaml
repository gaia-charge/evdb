infotainment:
  system: Porsche Communication Management (PCM) 6.0
  display_size_inches: 16.8
  display_type: Curved touchscreen
  description: |
    PCM 6.0 features a large 16.8" curved touchscreen in the center, plus optional 
    10.9" passenger display and 12.6" digital instrument cluster. Apple CarPlay 
    (wireless), Android Auto. Voice control with "Hey Porsche". OTA software 
    updates supported. Navigation with real-time traffic and intelligent range 
    assistant. Optional Burmester 3D High-End Surround Sound (21 speakers, 1,455W).

adas:
  level: 2
  system_name: Porsche InnoDrive
  features:
    - Adaptive Cruise Control with Stop & Go
    - Lane Keeping Assist
    - Lane Change Assist
    - Traffic Sign Recognition
    - Night Vision Assist (optional)
    - Surround View (360° cameras, optional)
    - Park Assist (optional)
  description: |
    Porsche InnoDrive with adaptive cruise control provides Level 2 semi-autonomous 
    driving. The system combines adaptive cruise, lane keeping, and predictive 
    driving strategies that optimize range by analyzing upcoming road topology 
    (hills, curves) and traffic. Optional Night Vision Assist uses thermal imaging 
    camera to detect pedestrians and animals beyond headlight range.

