    - https://www.euroncap.com/en/results/porsche/taycan/38489
    - https://www.caranddriver.com/porsche/taycan
  notes: |
    The Taycan is Porsche's electric flagship. Key differentiators vs competitors:
    - 800V architecture (fastest charging among production EVs)
    - Sports car handling dynamics (rear-biased AWD, low center of gravity)
    - Porsche build quality and attention to detail
    - Multiple variants: 4S, Turbo, Turbo S, GTS (sedan); Cross Turismo, Sport Turismo
    - Nürburgring EV lap record holder
    
    The Taycan 4S is the most popular variant, offering strong performance 
    (360kW/490hp with overboost), good range (up to 568km WLTP with Performance 
    Battery Plus), and more accessible pricing than Turbo models while maintaining 
    the core Taycan experience.
    
    Competitors: Tesla Model S, BMW i4 M50, Mercedes EQE, Audi e-tron GT
