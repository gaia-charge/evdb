description: |
  The Porsche Taycan is Porsche's first fully electric sports car, launched in 
  2019. It represents Porsche's commitment to electric performance with no 
  compromise on driving dynamics, build quality, or charging speed. The Taycan 
  showcases groundbreaking 800V architecture enabling ultra-fast charging (10-80% 
  in ~23 minutes), sports car handling, and trademark Porsche engineering excellence.
  
  Available in multiple variants (4S, Turbo, Turbo S, GTS, plus Cross Turismo 
  and Sport Turismo body styles), the Taycan delivers exhilarating performance 
  with instant electric torque, precise handling, and luxurious comfort. The 
  Taycan 4S offers the sweet spot: strong performance (360kW/490hp in overboost), 
  long range (up to 568km WLTP), and relative affordability within the lineup.

