  configuration: "2+2"  # Sports sedan layout
  description: |
    Standard 4-seat layout with sculpted sports seats in front and two individual 
    rear seats. Optional 5-seat rear bench available (no-cost option). Rear seats 
    are suitable for adults on shorter journeys, children on longer trips. Low 
    roofline limits rear headroom compared to SUVs.

cargo:
  trunk_liters: 366
  frunk_liters: 81
  max_liters: 447
  notes: |
    Taycan offers 366L rear trunk plus 81L front trunk (frunk). Total 447L cargo 
    capacity is modest for sedan size but typical of sports cars. Rear seats do 
    NOT fold (sports car design priority). For more cargo space, consider Taycan 
    Cross Turismo (446L + folding seats) or Sport Turismo variants.

