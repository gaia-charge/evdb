description: >
  The MG IM5 is MG's first dedicated electric executive sedan for Europe, positioned above
  the MG4 Electric. Built on an 800V architecture, it features ultra-fast charging at up
  to 369 kW DC and impressive range of up to 710 km WLTP from a 100 kWh battery. With
  300 kW (408 PS) rear motor, the IM5 offers strong performance. Euro NCAP awarded it
  5 stars in 2025 safety testing. Available in the UK from July 2025.

notes: >
  - 800V architecture for ultra-fast charging (369 kW peak DC)
  - Euro NCAP 5-star safety rating (2025)
  - Single motor RWD configuration
  - 100 kWh battery with 96.5 kWh usable capacity
  - 710 km WLTP range (Long Range variant)
  - Low drag coefficient
  - Positions MG in the premium segment alongside Tesla Model 3, BMW i4
  - First IM-branded model sold under MG badge in Europe
  - Manufactured in China

