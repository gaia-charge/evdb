  notes: |
    The CLA Shooting Brake is the estate/wagon variant of the new Mercedes-Benz CLA Electric.
    Same MMA platform and 800V architecture as the sedan, with a larger 455L trunk (+50L).
    Slightly heavier and marginally less efficient than the sedan due to higher body.
    
    Available as CLA Shooting Brake 250+ (RWD) and 350 4MATIC (AWD).
    
    Unique selling point: one of the very few electric estates available in Europe,
    competing with Audi A6 Avant e-tron and potentially the BMW i5 Touring.

