notes: |
  The TOGG T10F is a fastback sedan from Turkey's first domestic electric car
  manufacturer. Based on the same platform as the T10X SUV, the T10F offers
  a more aerodynamic and sportier body style. Available since September 2025
  in Germany, it competes with the Tesla Model 3, BYD Seal, and VW ID.7
  in the mid-size electric sedan segment. The T10F achieved an impressive
  5-star Euro NCAP safety rating. It's manufactured at TOGG's factory in
  Gemlik, Bursa, Turkey.

