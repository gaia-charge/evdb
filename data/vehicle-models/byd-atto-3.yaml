description: >
  The BYD Atto 3 (known as Yuan Plus in China) is a compact electric crossover
  built on BYD's e-Platform 3.0. It features BYD's proprietary Blade Battery
  (LFP chemistry) which prioritizes safety, longevity, and thermal stability.
  The Atto 3 offers practical range, competitive pricing, and unique interior
  design with guitar-string door pulls. It's one of BYD's global expansion models,
  sold in Europe, Australia, Southeast Asia, and South America.

