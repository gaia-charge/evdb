overview: >
  The BYD Han is a flagship full-size electric sedan from BYD's Dynasty Series, named after 
  the Han Dynasty. It competes with the BMW i4, Mercedes EQE, and Tesla Model S in the 
  premium electric sedan segment. The European version features BYD's signature Blade Battery 
  (LFP chemistry) with 85.4 kWh capacity, providing excellent safety and longevity.
  
  Available in Europe as a single FWD variant with 163 kW motor and approximately 521 km 
  WLTP range, the Han offers a luxurious interior with Nappa leather, 15.6-inch rotating 
  touchscreen, and comprehensive standard equipment. Its elegant design by Wolfgang Egger 
  and competitive pricing make it a compelling proposition in the E-segment.

