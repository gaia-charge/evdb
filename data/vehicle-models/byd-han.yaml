notes: >
  The BYD Han EV is the pure electric version; PHEV variants (Han DM-i, DM-p) exist in 
  China but are not sold in Europe. The European Han features the 85.4 kWh Blade Battery 
  (LFP) and FWD configuration. Designed under the lead of Wolfgang Egger (formerly Audi). 
  The Blade Battery's cell-to-pack design provides excellent thermal safety — BYD famously 
  demonstrated nail penetration tests without thermal runaway.

