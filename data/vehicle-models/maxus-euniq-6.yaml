notes: >
  The MAXUS Euniq 6 is part of SAIC Motor's push into European markets. While it offers excellent
  standard equipment and a spacious interior, the relatively low DC charging speed (75 kW max) and
  moderate range (354 km WLTP) are drawbacks compared to newer competitors. The platform is shared
  with ICE versions, which limits packaging efficiency. No Android Auto support is a notable omission.
  No OTA update capability. The Euniq 6 comes with a 5-year/100,000 km warranty.

