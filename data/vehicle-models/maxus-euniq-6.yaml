overview: >
  The MAXUS Euniq 6 is a mid-size electric SUV from SAIC Motor's MAXUS brand. It is one of the first
  Chinese electric SUVs to be sold in Germany, offering a spacious interior with 754 liters of trunk
  space and comprehensive standard equipment including panoramic roof, 360-degree camera, and heat pump.
  Built on a platform shared with ICE and PHEV versions, it features a 70 kWh battery providing 354 km
  WLTP range and a single front motor producing 130 kW (177 PS). The main drawbacks are relatively slow
  DC charging (max 75 kW) and average range for its class. Priced at €53,491 in Germany, it competes
  with the VW ID.4, Skoda Enyaq, and Tesla Model Y, though at a higher price point with less range.
  Comes with a 5-year warranty.

