description: >
  The Mercedes-Benz CLA is the brand's first model on the new MMA (Mercedes 
  Modular Architecture) platform, representing a new era of electric vehicles 
  from Stuttgart. Positioned as an entry point to the Mercedes-Benz EV lineup, 
  the CLA replaces the previous ICE CLA and serves as a direct competitor to 
  the BMW i4 eDrive35, Tesla Model 3, and Polestar 2.
  
  Built on an 800V architecture, the CLA features class-leading efficiency with 
  consumption as low as 12.2 kWh/100km (WLTP), ultra-fast DC charging up to 
  353 kW, and MB.OS — Mercedes' new in-house operating system. Available as a 
  sedan and Shooting Brake (estate), with three powertrain options: CLA 200 
  (LFP, RWD), CLA 250+ (NMC, RWD), and CLA 350 4MATIC (NMC, AWD).

