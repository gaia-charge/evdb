  notes: |
    The Mercedes-Benz CLA is an all-new electric sedan built on the MMA (Mercedes Modular
    Architecture) platform - Mercedes' first purpose-designed EV platform for compact/mid-size
    vehicles. Revealed in late 2024/early 2025, it represents a massive leap from the EQA/EQB
    generation built on the older MFA2 (ICE-derived) platform.
    
    Key innovations:
    - 800V architecture (vs 400V on EQA/EQB) enabling 353 kW DC charging
    - MB.OS (new in-house operating system replacing old MBUX software stack)
    - Cd 0.22 aerodynamics (one of the most aerodynamic production cars)
    - 90 kWh battery (85 kWh useable) delivering up to 792 km WLTP range
    - 101L frunk (first for a Mercedes EV in this segment)
    
    Available body styles:
    - CLA Sedan (this entry)
    - CLA Shooting Brake (estate/wagon variant)
    
    Variants:
    - CLA 250+ (RWD, 200 kW / 272 PS, 585 km real range)
    - CLA 350 4MATIC (AWD, 260 kW / 354 PS, 575 km real range)
    
    Competes with: BMW i4, Tesla Model 3, Polestar 2, Audi A6 e-tron
    
    Production: Rastatt, Germany (scheduled from 2025)

