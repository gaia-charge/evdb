    First Mercedes model with MB.OS (Mercedes-Benz Operating System), the new 
    in-house developed platform replacing MBUX. 11.9" OLED center touchscreen 
    standard. Optional Superscreen adds a 12.3" passenger display. "Hey Mercedes" 
    voice assistant with enhanced AI capabilities.

notes: >
  The CLA marks Mercedes-Benz's entry into the affordable EV segment with the 
  all-new MMA platform. Key highlights include 800V architecture across all 
  variants, class-leading efficiency, and the new MB.OS infotainment system.
  
  Three powertrain options: CLA 200 with 60 kWh LFP battery (541 km WLTP), 
  CLA 250+ with 85 kWh NMC battery (792 km WLTP), and CLA 350 4MATIC with 
  85 kWh NMC battery and dual motors (773 km WLTP). All feature 800V charging.
  
  European orders open from Q2 2025, deliveries starting late 2025. Expected 
  starting price around €45,000 for the CLA 200 in Germany.

