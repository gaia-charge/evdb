notes: |
  The Mustang Mach-E is Ford's first purpose-built electric SUV, launched in 2020. 
  Despite controversy over using the Mustang name, it has been well-received for 
  its performance, range, and technology. Available in multiple configurations 
  including the high-performance GT variant. Features Ford's SYNC 4A infotainment 
  system with a large 15.5-inch vertical touchscreen. Available with Standard 
  Range (68 kWh) or Extended Range (88 kWh) batteries.

