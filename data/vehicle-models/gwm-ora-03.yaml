overview: >
  The GWM ORA 03 is a compact electric hatchback from Chinese manufacturer Great Wall Motor's ORA sub-brand.
  Originally launched as the "Funky Cat" before being renamed, the ORA 03 features distinctive retro-inspired
  styling reminiscent of classic European designs. It shares its Lemon-E platform with the BMW Mini Cooper
  Electric. Available with two battery options (48 kWh and 63 kWh), the ORA 03 offers 310-420 km WLTP range
  at competitive pricing. The interior is well-equipped with standard features including panoramic roof,
  360-degree camera, adaptive cruise control, and massage function. Main weaknesses include limited trunk
  space (228 liters), slow DC charging (max 67 kW), and an infotainment system that needs refinement.
  Received 5 stars in Euro NCAP crash testing. Comes with a 5-year warranty.

