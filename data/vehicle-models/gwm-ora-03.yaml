notes: >
  The ORA 03 shares its Lemon-E platform with the BMW Mini Cooper Electric, developed through
  a technology partnership. Initially branded as "Funky Cat" for European launch, renamed to ORA 03
  in 2023 for brand consistency. The 5-year warranty is a competitive advantage over many rivals.
  Despite good build quality and generous equipment, the small 228-liter trunk and slow DC charging
  (67 kW max) are notable drawbacks. Insurance classification in Germany is favorable (Haftpflicht 17,
  Teilkasko 21, Vollkasko 19).

