notes: >
  The Renault Twingo E-Tech is a retro-inspired all-electric city car that
  pays homage to the original 1993 Twingo. Built on the AmpR Small platform
  shared with the Renault 5 E-Tech, it offers affordable urban mobility with
  a sub-€22,000 starting price in Germany. Produced in Novo Mesto, Slovenia.
  Unveiled November 2025, deliveries started early 2026. Compact 3.79m length 
  ideal for city driving. Positioned below the Renault 5 in the lineup.

