notes: |
  The Jeep Avenger is Jeep's first small electric SUV and the brand's first
  vehicle to win European Car of the Year (2023).
  
  Key features:
  - Built on Stellantis eCMP2 platform (shared with e-208, e-2008, Mokka-e)
  - 54 kWh battery with 400 km WLTP range
  - 115 kW/156 hp electric motor (FWD)
  - Selec-Terrain system for enhanced traction
  - Jeep design language with seven-slot grille (blanked off)
  - Practical compact SUV for European cities
  
  Key advantages vs competitors:
  - Iconic Jeep brand entering electric market
  - Rugged styling with urban practicality
  - Excellent safety (5-star Euro NCAP)
  - Competitive pricing
  - Good equipment levels standard
  
  Competes with: Peugeot e-2008, Opel Mokka-e, Hyundai Kona Electric,
  Kia Niro EV, MG ZS EV, Nissan Ariya (entry).
  
  The Avenger represents Jeep's commitment to electrification and European markets,
  winning ECOTY shows strong reception from automotive journalists.
