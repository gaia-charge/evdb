  notes: |
    MG S5 EV launched in 2025 as a compact electric SUV replacing the MG ZS EV.
    Built on the MSP platform shared with the MG4 Electric.
    170kW (231hp) rear motor with 6.3s 0-100 km/h.
    Available with 60.7 kWh LFP battery offering up to 402 km WLTP combined range.
    Ultra-fast DC charging with 150kW capability (28 min 10-80%).
    Competitive pricing starting from around €28,990 in Germany.
    One of the most affordable electric SUVs in Europe.
