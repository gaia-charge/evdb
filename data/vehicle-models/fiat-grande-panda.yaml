notes: |
  The Fiat Grande Panda is an affordable electric crossover sharing the Smart Car platform
  with the Citroën ë-C3. It brings the iconic Panda nameplate into the electric era with
  retro-modern styling and an accessible price point under €25,000.
  
  Available with 44 kWh battery offering ~320 km WLTP range. Positioned as an affordable
  urban EV to compete with Dacia Spring, Citroën ë-C3, and Renault 5 E-Tech.
