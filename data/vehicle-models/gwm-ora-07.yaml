notes: >
  The ORA 07 is GWM's answer to the Tesla Model 3, offering a more affordable alternative with
  distinctive design. The fastback liftback body provides good practicality with a 400-liter boot
  that opens to 1,280 liters with rear seats folded. The low 0.236 drag coefficient is class-leading.
  In China, the model is available with larger battery options and higher charging speeds; European
  specification uses a 63 kWh battery. The Performance AWD variant adds a rear motor for 295 kW total
  output and sub-5-second 0-100 km/h acceleration. 5-year/100,000km warranty.

