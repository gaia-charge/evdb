overview: >
  The GWM ORA 07 is a mid-size electric liftback sedan from Great Wall Motor's ORA sub-brand.
  Positioned above the ORA 03, the 07 features a sleek fastback design with a large liftback boot.
  Built on the Lemon-E platform, it offers two powertrain options: a single-motor RWD version with
  340 km WLTP range and a dual-motor AWD Performance version with 295 kW combined output.
  The ORA 07 targets the Tesla Model 3 and BYD Seal segments with competitive pricing starting
  around €44,000 in Germany. Key features include a large 12.3-inch touchscreen, Harman Kardon
  sound system, and comprehensive driver assistance systems. DC fast charging up to 90 kW
  is an improvement over the ORA 03 but still trails competition.

