notes: >
  First fully electric Cupra model (launched 2021), based on VW ID.3 but with
  sportier tuning and premium design. 17mm lower suspension than ID.3 for better
  handling, progressive steering for more direct feel. Signature copper accents
  throughout, sporty bucket seats with integrated headrests. More aggressive
  exterior styling vs ID.3. Available in e-Boost performance variant (170kW motor).
  Built at SEAT Martorell plant in Spain. Competes with VW ID.3, MG4, Peugeot
  e-208. Target: younger buyers who want sportier handling than ID.3.

