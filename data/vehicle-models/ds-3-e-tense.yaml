notes: |
  The DS 3 E-Tense is the premium electric crossover from DS Automobiles, Stellantis' 
  French luxury brand. Built on the same CMP platform as Peugeot e-2008 and Opel Mokka-e,
  but positioned as a premium alternative with distinctive French design and higher
  quality materials.
  
  Key advantages:
  - Premium interior materials (Nappa leather, Alcantara, watch strap quilting)
  - Distinctive French luxury design language
  - Advanced technology (HUD, retractable door handles, DS IRIS voice assistant)
  - More sophisticated than platform siblings
  - Optional Focal Electra audio system (premium French audio brand)
  
  Key differentiators vs platform siblings (e-2008, Mokka-e):
  - Premium positioning with higher price
  - More sophisticated interior design and materials
  - Retractable door handles and flush design elements
  - DS IRIS voice assistant system
  - Available head-up display
  - Focal premium audio option
  
  2023 facelift brought updated 54 kWh battery (from 50 kWh), improving range to 402 km WLTP.
  
  DS brand philosophy: "Only the best is good enough" - French interpretation of premium
  design with emphasis on comfort, craftsmanship, and distinctive style.
  
  Competes with: MINI Cooper Electric, Volvo EX40, Audi Q4 e-tron (though larger/pricier),
  BMW iX1 (though larger/pricier). Main competitor is MINI for premium B-segment electric crossover.
