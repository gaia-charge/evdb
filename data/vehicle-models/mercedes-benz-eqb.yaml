  notes: |
    Mercedes-Benz EQB is a 7-seat compact electric SUV, based on the GLB platform.
    Launched in 2021 as Mercedes' first 7-seat electric vehicle, targeting families.
    
    Built on MFA2 platform (shared with GLB, GLA, A-Class, B-Class) - flexible architecture.
    Available in FWD (250+) and AWD (300 4MATIC, 350 4MATIC) variants.
    
    The 250+ variant (70.5kWh battery) is FWD only and offers the best range.
    The AWD variants (300/350) use 66.5kWh battery with dual motors.
    
    Key differentiator: Optional third row seats make it Mercedes' only 7-seat EV.
    However, third row is suitable only for children or short trips (tight space).
    
    Positioned between EQA (5-seater) and EQE SUV (executive) in Mercedes' lineup.
    Competes with Tesla Model Y, BMW iX1 (5-seat), Volkswagen ID.4/ID.5.
    
    Key selling points:
    - Only premium 7-seat compact EV (unique in segment)
    - Mercedes luxury brand prestige
    - Proven MFA2 platform (shared with popular GLB)
    - Good warranty: 2 years + 8 years battery (160,000km)
    - Extensive dealer network (650+ in Germany)
    - Premium interior materials and build quality
    - Advanced MBUX infotainment system
    
    Weaknesses vs competitors:
    - Modest 100kW DC charging (vs 135-170kW competitors)
    - Third row very tight (children only)
    - Higher price than non-premium 7-seaters
    - No frunk (missed opportunity for extra storage)
    - Smaller trunk with third row up (190L)
    
    Built at Kecskemét plant, Hungary (alongside GLB).
    Over 40,000 units sold in 2023 (popular with families).

