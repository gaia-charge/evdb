description: |
  The Maserati GranTurismo Folgore is the world's first luxury electric grand tourer,
  combining Maserati's legendary GT heritage with cutting-edge electric performance.
  Powered by three electric motors producing 560 kW (761 hp) with 800V architecture,
  it delivers supercar acceleration (2.7s 0-100 km/h) wrapped in stunning Italian design.
  The 92.5 kWh battery provides a WLTP range of approximately 450 km.
