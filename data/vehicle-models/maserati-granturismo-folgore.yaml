notes: |
  The GranTurismo Folgore is the flagship of Maserati's Folgore electrification strategy.
  It uses a unique triple-motor setup (one front, two rear) for exceptional performance
  and torque vectoring. Built on the Giorgio Sport platform at the historic Mirafiori plant
  in Turin. Competes with Porsche Taycan Turbo GT, BMW i7 M70, and Audi e-tron GT RS.
  Production began late 2023 with deliveries ramping through 2024-2025.

