description: |
  The DS N°8 is DS Automobiles' flagship electric SUV, replacing the DS 7 in the lineup.
  Built on the STLA Medium platform, it features a large 101 kWh battery offering up to
  758 km WLTP range in FWD configuration. The luxury-focused interior showcases French
  craftsmanship with premium materials and advanced technology. Available in FWD Long Range
  and AWD Long Range variants, with up to 276 kW (375 PS) in AWD form. Positions DS
  as a serious contender in the premium electric SUV segment.
