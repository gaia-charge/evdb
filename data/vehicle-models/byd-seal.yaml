production_years:
  start: 2023
  end: null  # Still in production
platform: e-platform_3_0
description: >
  The BYD Seal is a premium electric sedan competing directly with Tesla Model 3 
  and Polestar 2. Built on BYD's advanced e-Platform 3.0, it features the company's 
  Blade Battery technology (LFP chemistry) for enhanced safety and longevity. 
  
  The Seal combines striking coupe-like design with impressive performance and range, 
  offering exceptional value in the D-segment. Standard features include air suspension, 
  panoramic glass roof, rotating 15.6" touchscreen, and comprehensive ADAS suite.
  
  Available in RWD (570km range) and AWD configurations (520km range), the Seal 
  targets European buyers seeking premium electric sedan experience at competitive pricing.

key_features:
  - BYD Blade Battery (LFP chemistry, enhanced safety and longevity)
  - e-Platform 3.0 with 800V architecture (AWD only)
  - Rotating 15.6" touchscreen (landscape/portrait modes)
  - Air suspension standard across all variants
  - Cell-to-body battery integration for structural rigidity
  - Comprehensive ADAS suite (ACC, LKA, AEB, BSM)
  - Heat pump standard for improved winter efficiency
  - V2L capability (3.3kW external power)
  - 5-star Euro NCAP safety rating (2023)
  - Panoramic glass roof with electrochromic dimming

notable_competitors:
  - Tesla Model 3
  - Polestar 2
  - BMW i4
  - Hyundai Ioniq 6
  - Volkswagen ID.7
  - Mercedes EQE

awards:
  - "German Car of the Year 2023 (Import Category)"
  - "5-star Euro NCAP Safety Rating (2023)"

market_position: >
  Positioned as premium electric sedan offering Tesla Model 3 performance and features 
  at more competitive pricing. Strong focus on build quality, safety (LFP Blade Battery), 
  and comprehensive standard equipment. Targets European buyers seeking proven Chinese EV 
  technology with established dealer network (rapidly expanding across Europe).
