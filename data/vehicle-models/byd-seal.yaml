description: >
  The BYD Seal is a mid-size electric sedan positioned as BYD's direct competitor
  to the Tesla Model 3. Built on the e-Platform 3.0 with BYD's proprietary Blade
  Battery, it combines sporty performance with excellent efficiency. The Seal
  features BYD's Ocean aesthetic design language, with a sleek, aerodynamic profile
  achieving a remarkable 0.219 drag coefficient. Available in rear-wheel-drive
  and all-wheel-drive configurations, it targets the premium electric sedan market
  in Europe with competitive pricing and comprehensive standard equipment.

