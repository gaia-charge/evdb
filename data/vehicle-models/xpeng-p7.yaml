overview: >
  The XPENG P7 is an executive electric sedan competing with the Tesla Model 3, BMW i4, 
  and Polestar 2. The European version is the P7i facelift, featuring upgraded 203 kW rear 
  motor, Dynaudio Dolby Atmos sound system, heat pump, and XPILOT advanced driver assistance. 
  Built on XPENG's SEPA platform, the P7 offers a sleek fastback design with a low drag 
  coefficient of 0.236 Cd. Available in RWD Long Range configuration for Europe with an 
  86.2 kWh NMC battery providing approximately 505 km WLTP range. The P7 combines 
  striking design with long-range capability and comprehensive standard equipment.

