notes: |
  Polestar 4 is the brand's SUV coupe positioned between the Polestar 2 sedan and 
  Polestar 3 SUV. It features a revolutionary design with no rear window, instead 
  using a high-definition rear camera system that feeds to the interior mirror.

  Key innovations:
  - No rear window design (world's first production car) improves aerodynamics
  - Rear camera system provides better visibility than traditional mirror
  - Low roofline and coupe styling with excellent headroom due to no rear window
  - Built on Geely's SEA platform (shared with Zeekr 001)
  - 15.4" portrait touchscreen - largest in segment
  - Available in China, Europe, and North America

  Platform advantages:
  - 800V electrical architecture for ultra-fast charging
  - Efficient packaging with flat floor
  - Dual-motor AWD or single-motor RWD options
  - Advanced thermal management system

  Target market: Premium buyers seeking distinctive design, performance enthusiasts,
  tech-savvy customers, those wanting Polestar Scandinavian minimalism in SUV coupe form.

  Competes with: BMW iX2, Mercedes EQE SUV, Audi Q6 Sportback e-tron, Tesla Model Y,
  Genesis Electrified GV70. Main differentiator is unique no-rear-window design and
  Scandinavian minimalist interior philosophy.

  Polestar 4 represents Polestar's expansion beyond Polestar 2, targeting higher
  volume segment with crossover SUV body style while maintaining brand's distinctive
  design language and premium positioning.
