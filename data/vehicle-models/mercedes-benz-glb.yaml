overview: |
  The Mercedes-Benz GLB Electric is a 7-seat compact SUV built on the new MMA platform
  with 800V architecture. Replacing the EQB, it offers dramatically improved charging speeds
  (up to 353 kW DC) and efficiency. Available in 250+ (RWD, 200 kW) and 350 4MATIC (AWD, 260 kW)
  variants, both with a 90 kWh battery (85 kWh usable). The GLB retains the practical 7-seat
  layout that made the EQB popular while gaining the new MBUX Superscreen, MB.OS, and a 127L frunk.

