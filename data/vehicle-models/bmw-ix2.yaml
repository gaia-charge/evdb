notes: >
  The BMW iX2 is the fully electric variant of the second-generation BMW X2 (U10),
  launched in late 2023. It's a subcompact coupe-SUV with sportier, more sloping
  roofline compared to the iX1. Based on the UKL2 platform (front-wheel drive
  architecture adapted for EVs). Available as eDrive20 (RWD) and xDrive30 (AWD).
  Assembled in Regensburg, Germany. Competes with Volvo EX30, Mercedes EQA,
  Audi Q4 e-tron. First compact BMW to offer 21-inch wheels.

