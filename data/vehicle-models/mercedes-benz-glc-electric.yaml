notes: >
  The GLC Electric marks Mercedes' transition away from the EQ branding to integrating electric
  variants directly into their existing model lines. Built on the EA-M platform (not MMA like the
  smaller CLA), it features 800V architecture. This is one of Mercedes' most important EV launches
  given the ICE GLC's massive sales volume. V2L and V2H capabilities announced but not yet confirmed.

