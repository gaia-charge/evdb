overview: >
  The Mercedes-Benz GLC Electric is the all-electric successor to Mercedes' best-selling SUV, the GLC.
  Built on the new EA-M (Electric Architecture Medium) platform with 800V architecture, it replaces the
  EQC and sits alongside the CLA Electric in Mercedes' new naming strategy (dropping "EQ" prefix).
  The GLC Electric features a 100kWh battery, up to 715km WLTP range, and 330kW DC fast charging.
  It's a crucial model for Mercedes, as the ICE GLC has been one of their top sellers globally.

