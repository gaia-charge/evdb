description: |
  The Opel Mokka-e is a fully electric B-segment SUV built on Stellantis' Common Modular 
  Platform (CMP), sharing its mechanical basis with the Peugeot e-2008 and DS 3 Crossback E-Tense.
  
  The second-generation Mokka (launched 2020) represents a complete design revolution from 
  the first generation, featuring Opel's new "Vizor" front design language, a bold and 
  modern SUV coupe-like profile, and significantly improved interior quality.
  
  Mechanically identical to the Peugeot e-2008, the Mokka-e offers the same 50kWh battery 
  and 100kW motor, but with Opel's distinctive new design language, making it one of the 
  most stylish affordable electric SUVs on the European market.
  
  Key differentiators vs e-2008:
  - Distinctive "Vizor" front design (bold, modern, controversial)
  - More coupe-like SUV profile (sportier vs e-2008's traditional SUV look)
  - Slightly lower price point (typically €1,000-2,000 less than e-2008)
  - IntelliLux LED Matrix headlights available (Opel exclusive technology)
  - Focus on modern design and technology accessibility
  
  The Mokka-e is positioned as the entry point to Opel's electric SUV lineup, targeting 
  young urban professionals who want distinctive styling without premium pricing.
  
  Built at Stellantis' Zaragoza plant in Spain alongside the Peugeot e-2008.
notes: |
  - Badge-engineered cousin of Peugeot e-2008 (mechanically identical, ~80% parts sharing)
  - Typically €1,000-2,000 cheaper than Peugeot e-2008 with similar specs
  - Second generation Mokka is completely new design (2020+), not related to first gen
  - "Vizor" front design is polarizing but distinctive in the B-SUV segment
  - 2023 facelift: battery unchanged, minor efficiency improvements
  - Available in three trim levels: Edition, Elegance, Ultimate (top trim)
  - Ultimate adds leather seats, IntelliLux Matrix LED, panoramic sunroof, navigation
  - Also available as Vauxhall Mokka-e in UK (identical, different badge)
  - Built at Zaragoza, Spain (Stellantis plant, same line as e-2008)
  - Shares 50kWh battery, 100kW motor, CCS2 fast charging with e-2008
  - 310L trunk is smallest in B-SUV segment (Peugeot e-2008: 405L!)
  - No towing capability (city SUV focus)
  - 6-8 week delivery time (high demand)
