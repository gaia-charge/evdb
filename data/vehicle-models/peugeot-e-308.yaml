notes: |
  The Peugeot e-308 is the electric version of Peugeot's popular C-segment family car.
  It shares the eVMP platform with the Opel Astra Electric and DS 4 E-Tense.
  
  Key advantages vs competitors:
  - Refined Peugeot i-Cockpit HD design with dual 10" displays
  - Excellent ride quality and comfort (French suspension tuning)
  - Strong value proposition in C-segment
  - Wireless connectivity and i-Toggles customization
  - OTA updates and modern connected services
  
  Key differentiators vs Opel Astra Electric:
  - More stylish and premium interior design
  - Peugeot's signature i-Cockpit (smaller GT steering wheel)
  - Better standard equipment on comparable trims
  - French focus on ride comfort over German sporty dynamics
  
  Available as both 5-door hatchback and SW (station wagon). Electric version launched
  in 2023, one year after the ICE/hybrid variants.
  
  54 kWh battery provides competitive range of ~410-420 km WLTP.
  
  Competes with: VW ID.3, Cupra Born, Opel Astra Electric, Renault Megane E-Tech, MG4.
