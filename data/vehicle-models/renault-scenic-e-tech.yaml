notes: |
  The Renault Scenic E-Tech Electric is Renault's family-focused electric SUV on
  the CMF-EV platform (shared with Megane E-Tech and Nissan Ariya). It represents
  the rebirth of the iconic Scenic nameplate as a pure EV. The Scenic E-Tech offers
  excellent interior space, a class-leading 545L trunk, and innovative features
  like the Solarbay panoramic glass roof with adjustable opacity. Available in
  Comfort Range (60 kWh) and Long Range (87 kWh) battery options, with the latter
  offering up to 625 km WLTP range. Ideal for families seeking an efficient,
  spacious EV with modern technology.

