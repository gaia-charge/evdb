description: |
  The Polestar 3 is Polestar's first SUV, combining Scandinavian luxury with advanced 
  electric performance. Launched in 2024, it represents Polestar's move into the 
  premium SUV segment.
  
  Built on Volvo's SPA2 platform (Scalable Product Architecture), shared with the 
  Volvo EX90, the Polestar 3 features distinctive aerodynamic design, a spacious 
  interior with sustainable materials, and cutting-edge technology including LiDAR 
  sensors for advanced driver assistance.
  
  The vehicle offers dual-motor all-wheel drive with exceptional performance, 
  air suspension for comfort, and a premium audio system from Bowers & Wilkins. 
  It targets buyers seeking a sustainable alternative to luxury SUVs from 
  Porsche, BMW, and Mercedes-Benz.

