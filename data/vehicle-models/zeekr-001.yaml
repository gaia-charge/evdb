notes: >
  The Zeekr 001 is built in Ningbo, China on the SEA1 platform shared with the Lotus Eletre, Polestar 4,
  and Lynk & Co Z10. The 2024 facelift was a major update introducing 800V architecture and redesigned
  exterior. The 2025 model added advanced autonomous driving capabilities. European specification vehicles
  are tuned at Zeekr's Gothenburg R&D center. The 001 FR limited edition with quad motors producing 930kW
  (1,265 PS) was also announced. Competes in the executive segment against Porsche Taycan, BMW i5, and
  Mercedes EQE.

