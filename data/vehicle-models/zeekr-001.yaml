overview: >
  The Zeekr 001 is a premium electric shooting brake built on Geely's SEA1 platform. Originally previewed
  as the Lynk & Co Zero Concept, it became Zeekr's debut model in 2021. The 001 features a distinctive
  five-door shooting brake body style, drawing comparisons to the Porsche Panamera Sport Turismo. Available
  in rear-wheel-drive and all-wheel-drive configurations, with battery options of 95kWh and 100kWh (post-2024
  facelift). The 2024 facelift introduced 800V architecture supporting ultra-fast charging up to 546kW at
  Zeekr V3 Superchargers, along with a redesigned exterior inspired by the 001 FR performance variant. The
  2025 model adds Geely's Haohan Smart Driving 2.0 system with dual Nvidia OrinX chips (508 TOPS). European
  sales began in 2023, competing with the Porsche Taycan, Tesla Model S, and BMW i5.

