platform: e-platform_3_0
description: >
  The BYD Seal U is a compact electric SUV that expands BYD's European lineup into 
  the highly competitive C-segment crossover market. Built on the proven e-Platform 3.0, 
  it combines SUV practicality with the efficiency and technology of BYD's Blade Battery.
  
  Positioned between the smaller Atto 3 and the sedan Seal, the Seal U targets families 
  seeking spacious, practical electric transport. It offers generous interior space, 
  elevated driving position, and comprehensive safety features at competitive pricing.
  
  The Seal U brings BYD's LFP Blade Battery technology to the family SUV segment, 
  offering excellent range (up to 500km WLTP), fast charging, and enhanced battery 
  longevity and safety.

key_features:
  - BYD Blade Battery (LFP chemistry, enhanced safety and longevity)
  - e-Platform 3.0 architecture for efficiency
  - 15.6" rotating touchscreen (landscape/portrait modes)
  - Spacious 5-seat interior with elevated SUV seating position
  - Cell-to-body battery integration for structural rigidity
  - Comprehensive ADAS suite (ACC, LKA, AEB, BSM, 360° camera)
  - Heat pump standard for improved winter efficiency
  - V2L capability (3.3kW external power)
  - Euro NCAP 5-star safety rating (expected)
  - Panoramic glass roof standard

notable_competitors:
  - Volkswagen ID.4
  - Skoda Enyaq iV
  - Tesla Model Y
  - Hyundai Ioniq 5
  - Kia EV6
  - Nissan Ariya
  - Ford Mustang Mach-E

market_position: >
  Positioned as family-friendly electric SUV offering exceptional value in the C-segment. 
  Competes on price, range, and standard equipment against established European brands. 
  Strong focus on practicality, safety (LFP Blade Battery), and comprehensive features. 
  Targets European families seeking proven Chinese EV technology with growing dealer 
  network and competitive pricing versus VW ID.4 and similar offerings.

awards:
