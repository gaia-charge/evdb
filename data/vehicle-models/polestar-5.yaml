description: |
  The Polestar 5 is a 4-door electric grand tourer and Polestar's flagship performance 
  vehicle. Based on the Polestar Precept concept from 2020, it launched in 2025 as the 
  brand's most powerful and technologically advanced model.
  
  Built on Polestar's own PPA (Polestar Performance Architecture), it features a bonded 
  and hardened aluminium body structure, 800V battery technology, and dual permanent 
  magnet synchronous motors including the in-house developed PX2 rear motor.
  
  Positioned as a performance GT competing with the Porsche Taycan and Audi e-tron GT, 
  the Polestar 5 combines extraordinary power (up to 650 kW / 884 PS) with 
  Scandinavian design ethos and sustainable materials.

