# Notes
notes: |
  The Kia EV9 is Kia's flagship electric SUV, offering 6 or 7 passenger seating 
  on the 800V E-GMP platform. With a 3,100mm wheelbase (200mm longer than EV6), 
  it provides genuine 3-row practicality with adult-usable rear seats.
  
  Available in multiple trims: Light, Air, Earth, GT-Line. The GT-Line adds 
  performance upgrades including dual motors (283kW/385hp) and enhanced suspension.
  
  Key strengths:
  - Fastest-charging 3-row SUV: 800V architecture enables 10-80% in 24 minutes
  - Spacious interior with flexible 6 or 7-seat configurations
  - Premium features: triple screens, swiveling seats, V2L capability
  - Class-leading towing: 2,500kg capacity (best-in-class for electric SUVs)
  - Real-world range ~450km for Long Range AWD variant
  
  Main competitors: Tesla Model X (€98,990), Mercedes EQS SUV (€114,641), 
  BMW iX xDrive50 (€109,900), Volvo EX90 (coming 2024).
  
  The EV9 is positioned as a premium family hauler at €73,990-€87,990, 
  undercutting German luxury competitors by €20,000-40,000 while offering 
  similar or better technology and faster charging.

