notes: |
  The all-new Peugeot e-3008 is a ground-up redesign for the third generation,
  now exclusively electric on the eVMP platform (no ICE versions).
  
  Key innovations for 2024:
  - Panoramic i-Cockuit with massive 21" curved display
  - ChatGPT voice assistant integration (first in segment)
  - Two battery sizes: 73 kWh (525 km) and 98 kWh (700 km)
  - Both FWD and AWD powertrains available
  - Pixel LED headlights with 18 segments per lamp
  - Plug & Charge for seamless public charging
  
  Key advantages vs competitors:
  - Best-in-class interior technology and design
  - Longest range in segment with 98 kWh battery (700 km WLTP)
  - Spacious and practical with 520L trunk
  - French ride comfort and refinement
  - Competitive pricing vs German alternatives
  
  Competes with: VW ID.4, Škoda Enyaq iV, Hyundai Ioniq 5, Kia EV6,
  Ford Mustang Mach-E, Tesla Model Y.
  
  The e-3008 represents Peugeot's leap into the competitive compact electric SUV
  segment with cutting-edge technology and French design flair.
