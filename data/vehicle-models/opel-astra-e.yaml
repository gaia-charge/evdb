description: |
  The Opel Astra Electric is the fully electric version of Europe's 2023 Car of the Year,
  built on Stellantis' evolved EMP2 platform designed to accommodate both combustion and
  electric powertrains.
  
  Sharing its platform and powertrain with the Peugeot e-308 and Jeep Avenger, the Astra
  Electric combines Opel's characteristic German-engineered practicality with cutting-edge
  electrification. It features a 54kWh battery and 115kW (156hp) motor, offering up to
  418km WLTP range.
  
  The Astra Electric targets the heart of the European compact car market - competing
  directly with the Volkswagen ID.3, Cupra Born, and Renault Megane E-Tech. It positions
  itself as the practical, no-nonsense alternative with Opel's signature IntelliLux LED
  technology and comprehensive standard equipment.
  
  Key differentiators:
  - IntelliLux LED Pixel Matrix headlights with 84 LED elements (segment-leading)
  - Pure Panel digital cockpit (dual 10\" displays)
  - Heat pump standard (improves efficiency in cold weather)
  - 100kW DC fast charging (10-80% in 30 minutes)
  - One-pedal driving with B-mode regeneration
  - German engineering heritage (Opel's 125-year legacy)
  
  Available in two trim levels:
  - **Edition**: Base model with comprehensive equipment
  - **GS**: Sporty variant with body kit, 18\" alloys, sport seats, premium tech
  
  The Astra nameplate has been a cornerstone of Opel's lineup since 1991, with over
  25 million units sold across five generations. The Astra Electric represents the
  model's transition to zero-emission mobility while maintaining the practicality and
  value that made it Europe's favorite compact car.
  
  Built at Stellantis' Rüsselsheim plant in Germany alongside combustion Astra variants.
notes: |
  - Platform sibling: Peugeot e-308 (similar specs, different styling)
  - 2023 European Car of the Year (first Opel to win since 2016 Astra-K)
  - Heat pump is STANDARD (reduces winter range loss by ~15%)
  - IntelliLux LED Pixel Matrix is a €1,200 option on Edition, standard on GS
  - 100kW DC fast charging: 10-80% in ~30 minutes (optimal conditions)
  - 11kW AC onboard charger standard (7.4kW optional for lower cost)
  - Battery: 54kWh usable (capacity slightly lower than some competitors)
  - Real-world range: ~320km mixed, ~250km highway (winter)
  - Also available as Vauxhall Astra Electric in UK (identical, different badge)
  - Built at Rüsselsheim, Germany (Opel's historic home plant since 1899)
  - No Sports Tourer (wagon) variant announced yet for Electric
  - Typical delivery time: 12-16 weeks
  - Qualifies for German company car tax reduction (0.25% under €70,000)
