overview: >
  The Volvo EX90 is Volvo's flagship electric SUV, offering seating for up to seven passengers. Launched in 2024, it's built on Volvo's SPA2 (Scalable Product Architecture 2) platform and represents the pinnacle of Volvo's electric vehicle technology. The EX90 features advanced safety systems including LiDAR sensors, bi-directional charging capability, and Volvo's latest driver assistance technology. With its spacious three-row interior, premium Scandinavian design, and long-range capability, the EX90 competes with the Mercedes EQS SUV, BMW iX, and Audi Q8 e-tron. It's positioned as Volvo's technology flagship and family-oriented luxury electric SUV.

