notes: >
  The Volvo EX90 is Volvo's most advanced and luxurious electric vehicle to date. It's the first production car to feature Luminar LiDAR sensors, enabling Level 3 autonomous driving capability in the future (pending regulatory approval). The EX90's bi-directional charging capability allows it to power a home for up to a week in an emergency. The interior features extensive use of sustainable materials including Nordico textile (made from recycled materials), FSC-certified wood, and recycled plastics. Built on the SPA2 platform (shared with Polestar 3), the EX90 is manufactured in Charleston, South Carolina (USA) and Torslanda, Sweden. It replaces the XC90 as Volvo's flagship SUV. The battery is supplied by CATL and LG Energy Solution. Software updates will enable additional autonomous driving features over time.

