description: |
  The Suzuki e Vitara is Suzuki's first mass-produced battery electric vehicle, launched in 2025.
  Built on the Heartect-e skateboard platform, the e Vitara is a subcompact crossover SUV that
  competes with the Hyundai Kona Electric, Kia Niro EV, and Volvo EX30.
  
  Available with two LFP battery options (49 kWh and 61 kWh) and three powertrains including
  an AllGrip-e AWD variant with dual motors. The e Vitara is manufactured in India at Suzuki
  Motor Gujarat and shares its platform with the Toyota Urban Cruiser.
  
  Key selling points include its competitive pricing starting around €30,000, standard heat pump,
  available AWD, and sliding rear bench seat. The LFP battery chemistry offers improved longevity
  and safety characteristics.

