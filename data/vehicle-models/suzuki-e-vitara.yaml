notes: |
  First mass-produced BEV from Suzuki. Manufactured at Suzuki Motor Gujarat in Ahmedabad, India.
  Also sold as Toyota Urban Cruiser with modified styling. Uses LFP (lithium iron phosphate)
  blade cells from BYD FinDreams. AllGrip-e AWD variant adds a 48 kW rear motor for enhanced
  traction. Heat pump standard on all variants for efficient cabin heating. European deliveries
  began mid-2025. Positioned as a practical, affordable entry into the electric SUV market.

