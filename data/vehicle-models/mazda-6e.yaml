description: >
  The Mazda 6e is Mazda's first dedicated electric sedan, reviving the iconic 6
  nameplate as a fully electric liftback. Built on Changan's EPA1 platform through
  a joint venture partnership, it represents Mazda's bold entry into the D-segment
  EV market alongside established competitors like Tesla Model 3 and BMW i4.
  
  Featuring Mazda's signature Kodo design language adapted for the electric era,
  the 6e offers a sleek liftback silhouette with impressive aerodynamics. The 80 kWh
  NMC battery provides up to 552 km WLTP range, while the rear-mounted 180 kW
  motor delivers engaging driving dynamics true to Mazda's driver-focused philosophy.
  
  Standard equipment includes a heat pump, V2L capability, and comprehensive ADAS
  suite. The premium interior features Mazda's renowned build quality with a focus
  on driver engagement and material refinement.

key_features:
  - Mazda Kodo design language (electric evolution)
  - 80 kWh NMC battery with 552 km WLTP range
  - Rear-wheel drive for engaging dynamics
  - Heat pump standard for winter efficiency
  - V2L capability (3.3 kW)
  - 70L frunk storage
  - Liftback body style for practicality
  - 5-star Euro NCAP safety rating (2025)
  - Mazda Connected Services with OTA updates
  - Battery preconditioning

