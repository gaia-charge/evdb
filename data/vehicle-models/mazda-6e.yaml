market_position: >
  The Mazda 6e targets premium-minded buyers who value design, build quality,
  and driving dynamics. Positioned as a sophisticated alternative to Tesla Model 3
  and BMW i4, it leverages Mazda's reputation for craftsmanship while offering
  competitive range and practical liftback packaging. The partnership with Changan
  provides proven EV platform technology while Mazda focuses on design, driving
  feel, and interior quality.

