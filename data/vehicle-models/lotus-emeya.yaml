description: >
  The Lotus Emeya is a high-performance electric grand tourer that combines Lotus's legendary
  driving dynamics with four-door practicality. Built on the same EPA platform as the Eletre SUV,
  the Emeya features a sleek fastback design with an exceptional 0.21 drag coefficient, making it
  one of the most aerodynamic production cars ever made. Available with up to 675 kW (905 hp) in
  the top R variant, it achieves 0-100 km/h in just 2.78 seconds while offering over 600 km of range.
  The Emeya represents Lotus's vision of a sustainable super-GT, featuring 800V architecture,
  350 kW DC fast charging, active aerodynamics, rear-wheel steering, and a driver-focused interior
  with premium materials. It competes with Porsche Taycan Turbo S and offers more performance
  for less money while maintaining Lotus's racing heritage.

