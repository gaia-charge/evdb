notes: |
  The Mercedes-Benz EQS SUV is the electric luxury SUV flagship based on the EQS sedan platform.
  It's built on the dedicated EVA2 platform (Electric Vehicle Architecture 2), designed exclusively for electric vehicles.

  The EQS SUV combines the luxury and technology of the EQS sedan with SUV versatility, offering optional 7-seat configuration,
  higher ground clearance (181mm vs 114mm), and better towing capacity (1,800kg vs 750kg). With a drag coefficient of Cd 0.26,
  it's one of the most aerodynamic luxury SUVs, enabling excellent efficiency and range.

  Key innovations:
  - MBUX Hyperscreen (standard on 580 4MATIC, optional on 450+) spans entire dashboard with 56-inch curved display
  - Rear-axle steering (up to 10°) reduces turning circle to 11.9m despite 5.1m length
  - E-Active Body Control with active suspension (optional) adjusts each wheel independently
  - Digital Light headlights with over 1.3 million micro-mirrors per headlight
  - MBUX Augmented Reality navigation projects virtual arrows onto road via HUD
  - Off-road mode with transparent hood camera (virtual view through hood)
  - Optional 7-seat configuration with electric-folding third row

  The EQS SUV competes with:
  - BMW iX xDrive50 (€105,000): More futuristic design, similar tech
  - Audi Q8 e-tron 55 quattro (€90,000): Less range, more affordable
  - Tesla Model X Long Range (€105,000): Faster, less luxurious, 7-seat standard
  - Porsche Cayenne Turbo S E-Hybrid (€181,000): Plug-in hybrid, not pure EV

  Built at Mercedes-Benz U.S. International in Tuscaloosa, Alabama (same factory as GLE, GLS).
  First Mercedes EQ model built in USA.

