description: |
  The Kia EV4 is Kia's compact electric sedan/fastback, positioned below the EV6.
  Built on the E-GMP platform, it offers exceptional efficiency with 633 km WLTP range
  from the 81.4 kWh battery. Features V2L capability, 135 kW DC fast charging, and
  a spacious interior with Kia's latest connected car technology. Available in Fastback
  body style, targeting the mainstream C-segment sedan market in Europe.
