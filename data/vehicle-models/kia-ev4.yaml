description: |
  The Kia EV4 is Kia's compact electric sedan/fastback, positioned below the EV6.
  Built on the E-GMP platform, available in both sedan and fastback body styles.
  Offers 58.3 kWh standard range (458 km) and 81.4 kWh long range (up to 633 km).
  Features V2L capability, 135 kW DC fast charging, and Kia's latest connected car
  technology. From €37,590 (sedan) / €41,490 (fastback) in Germany.
