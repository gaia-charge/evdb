description: >
  The Honda e:Ny1 is Honda's first pure-electric SUV for Europe, based on the
  HR-V platform but with a dedicated EV architecture. Built on Honda's e:N
  Architecture F (front-wheel drive platform), the e:Ny1 features a 68.8 kWh
  battery providing up to 412 km of WLTP range. The crossover offers a spacious
  interior with Honda's Magic Seats system, a 15.1" touchscreen infotainment
  system, and Honda Sensing advanced driver assistance features. The e:Ny1
  combines Honda's reputation for reliability and practicality with electric
  mobility, targeting buyers seeking a compact electric SUV alternative to the
  VW ID.3, Kia Niro EV, and Hyundai Kona Electric.

