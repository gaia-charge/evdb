notes: >
  The e:Ny1 is Honda's first pure-electric SUV for Europe, representing the
  brand's commitment to electrification. The name combines "e:" (Honda's EV
  branding), "N" (new), "y" (your), and "1" (first model). Built in China
  and imported to Europe. Features Honda's practical Magic Seats system and
  spacious interior despite compact dimensions. Competes directly with the
  Kia Niro EV, Hyundai Kona Electric, and VW ID.3. Available in three trim
  levels: Elegance, Advance, and Advance+.

