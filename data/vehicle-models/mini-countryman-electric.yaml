description: >
  The third-generation Mini Countryman (2024+) marks a significant step up in size and capability.
  Built on BMW's FAAR platform shared with the BMW iX1 and X1, it's now produced in Leipzig,
  Germany rather than the Netherlands. The electric variants (Countryman E and Countryman SE ALL4)
  offer 64.7kWh and 66.5kWh batteries respectively, with the SE ALL4 adding dual motors and
  all-wheel drive. The Countryman Electric combines Mini's distinctive character with genuine
  family practicality, offering 460 liters of boot space and a spacious cabin. It competes
  directly with the BMW iX1, Volvo EX30, and Volkswagen ID.4.

