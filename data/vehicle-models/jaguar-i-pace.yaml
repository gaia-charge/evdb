notes: |
  The Jaguar I-PACE is Jaguar's first all-electric vehicle and one of the
  first premium electric SUVs to market (launched 2018). It won multiple
  prestigious awards including 2019 World Car of the Year, European Car of
  the Year, and German Car of the Year. Built on a dedicated electric platform
  (eDM), the I-PACE features a distinctive coupe-SUV design with excellent
  aerodynamics (Cd 0.29), dual-motor AWD delivering 400 hp, and a 90 kWh
  battery providing ~470 km WLTP range.

  The I-PACE pioneered many features that became standard in premium EVs:
  flush door handles, regenerative braking with multiple modes, heat pump for
  winter efficiency, and comprehensive driver assistance systems. It remains
  competitive despite being a 2018 design, thanks to its strong fundamentals:
  excellent handling dynamics, premium interior, practical packaging, and
  proven reliability.

  Production takes place at Magna Steyr in Graz, Austria. The I-PACE has not
  received a major facelift since launch, though Jaguar has updated software
  and added features through MY updates. It remains Jaguar's only electric
  model until the brand's full electrification in 2025.

