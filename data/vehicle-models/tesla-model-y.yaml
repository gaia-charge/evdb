description: >
  Tesla Model Y is a compact electric crossover SUV and the best-selling electric vehicle  in the world (Q1 2023). Built on Tesla's proprietary platform derived from Model 3,  it shares approximately 75% of parts with its sedan sibling for manufacturing efficiency. 

  Model Y combines SUV practicality with Tesla's signature performance, technology, and  charging infrastructure. The 2024 "Juniper" refresh brought improved interior quality,  enhanced suspension, and increased efficiency.

  Key features include dual-motor AWD, up to 565km WLTP range, 250kW Supercharger V3  fast charging, Autopilot standard with optional Full Self-Driving, and over-the-air  software updates.

