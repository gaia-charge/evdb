description: |
  Tesla Model Y is a compact electric SUV built on the Model 3 platform.
  It became the world's best-selling car (any powertrain) in Q1 2023.
  
  The Model Y offers impressive range, performance, and cargo space in a
  practical SUV package. Standard features include Autopilot, glass roof,
  and heat pump. The 2024 refresh ("Juniper") brings improved interior,
  suspension, and efficiency.

notes: |
