notes: >
  The Volvo EX40 (formerly XC40 Recharge) was Volvo's first purpose-built electric vehicle, launched in 2021. It shares its CMA platform with the Polestar 2 and the combustion-engine XC40. The vehicle was renamed from XC40 Recharge to EX40 in 2024 as part of Volvo's shift to a new naming convention where all electric vehicles start with "EX" or "EC". The EX40 features a dual-motor AWD system derived from Polestar engineering, with one motor on each axle. It pioneered Volvo's use of Google-built Android Automotive OS infotainment system. The vehicle is manufactured in Ghent, Belgium.

