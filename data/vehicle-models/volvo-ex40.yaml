overview: >
  The Volvo EX40 (formerly known as the XC40 Recharge) is a compact electric SUV built on Volvo's CMA (Compact Modular Architecture) platform. Originally launched in 2021 as the XC40 Recharge, it was rebranded to EX40 in 2024 as part of Volvo's new electric vehicle naming convention. The EX40 was Volvo's first fully electric SUV and features twin-motor all-wheel drive or single-motor rear-wheel drive configurations. It shares its platform with the Polestar 2 and offers Volvo's signature Scandinavian design, premium interior materials, advanced safety systems, and Google-built infotainment. The EX40 competes with vehicles like the Tesla Model Y, BMW iX3, and Mercedes EQA.

