notes: >
  The Volvo EX30 is notable as Volvo's smallest and most affordable EV, with the lowest carbon footprint of any Volvo car to date (including production and lifecycle emissions). It's built on Geely's SEA platform (shared with Smart #1, Zeekr X) rather than Volvo's own SPA2 platform. The interior uses extensive recycled materials including flax composite, recycled polyester, and recycled plastics. Production is in Luqiao, China with European delivery starting in 2024. Despite its compact size, it offers Volvo's full suite of safety features and won 2nd place in European Car of the Year 2024.

