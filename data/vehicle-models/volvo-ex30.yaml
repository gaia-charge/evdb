overview: >
  The Volvo EX30 is a compact electric SUV and the smallest vehicle in Volvo's lineup. Launched in 2023 for the 2024 model year, it's built on Geely's SEA (Sustainable Experience Architecture) platform and manufactured in China. The EX30 represents Volvo's entry into the affordable premium compact EV segment, competing with vehicles like the Tesla Model Y and Volvo's own larger models. It features Volvo's signature Scandinavian minimalist design, advanced safety features, and sustainable materials. The EX30 is Volvo's most affordable EV and has the lowest carbon footprint of any Volvo car ever made.

