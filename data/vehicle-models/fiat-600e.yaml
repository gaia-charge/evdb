notes: |
  The Fiat 600e revives the iconic 600 nameplate for the electric era,
  positioned as a compact crossover between the city-focused 500e and
  potential future larger electric Fiat models.

  Key features:
  - Built on Stellantis eCMP2 platform (shared with Jeep Avenger, Alfa Romeo Junior, e-2008)
  - 54 kWh battery with 409 km WLTP range
  - 115 kW/156 hp electric motor (FWD)
  - Italian design with distinctive LED lighting signature
  - Practical compact crossover for urban and suburban use

  Key advantages vs competitors:
  - Distinctive Fiat design and Italian flair
  - Excellent value proposition
  - Well-equipped as standard
  - Platform proven in multiple Stellantis vehicles
  - 5-star Euro NCAP safety rating

  Available in two main trims:
  - (RED): Entry level with good standard equipment
  - La Prima: Premium launch edition with matrix LED headlights, advanced ADAS

  Competes with: Jeep Avenger, Peugeot e-2008, Opel Mokka-e, Hyundai Kona Electric,
  Kia Niro EV, MG ZS EV, Nissan Ariya (entry).

  The 600e represents Fiat's expansion into the compact electric crossover segment,
  leveraging the successful eCMP2 platform while bringing distinctive Italian style.
