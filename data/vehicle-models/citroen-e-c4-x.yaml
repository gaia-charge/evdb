overview: >
  The Citroën ë-C4 X is the fastback/sedan variant of the ë-C4 crossover, featuring a longer
  rear overhang that creates an elegant coupe-like silhouette while significantly increasing trunk
  capacity to 510 liters (vs 380L in the ë-C4 hatch). Launched in 2023, it shares the same eCMP
  platform, 54 kWh battery (2024+), and 156 hp electric motor as the ë-C4 but offers more
  practicality for families who need more luggage space. It sits uniquely in the market as a
  compact electric fastback crossover, competing with the VW ID.3 and MG4 on space while
  maintaining Citroën's signature comfort-focused ride quality with Progressive Hydraulic
  Cushions suspension.

