notes: >
  The ë-C4 X fills a unique niche as a compact electric fastback crossover. Its 510L trunk makes
  it one of the most practical compact EVs on the market. The longer rear overhang (4,600mm total
  vs 4,360mm for ë-C4) gives it a more premium, sedan-like appearance while maintaining the raised
  crossover ride height. It uses the same Stellantis eCMP platform and powertrain as the ë-C4,
  Peugeot e-208, and Opel Corsa-e. For 2025, it continues with the 54 kWh battery and 156 hp motor
  introduced in the 2024 model year refresh.

