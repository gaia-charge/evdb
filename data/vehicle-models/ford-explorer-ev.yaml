notes: |
  The Ford Explorer EV is Ford's first MEB-based electric vehicle, produced in 
  Cologne, Germany. Shorter than the VW ID.4 it shares a platform with, Ford 
  designed it with different suspension tuning, dampers, and tyres to create a 
  distinct driving character. Features a 14.6-inch adjustable portrait SYNC Move 
  touchscreen. Euro NCAP 5-star rated (2024). Available in Standard Range (52 kWh 
  usable) and Extended Range (77 kWh usable) configurations with RWD or AWD.

