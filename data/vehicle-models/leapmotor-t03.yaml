overview: >
  The Leapmotor T03 is an ultra-affordable city electric car, one of only two BEVs under €20,000
  in Germany (alongside the Dacia Spring). Distributed through Leapmotor International (Stellantis JV)
  and produced in Poland for the European market. Despite its low price, the T03 comes fully equipped
  with a panoramic sunroof, 10.1-inch touchscreen, two displays, reversing camera, climate control,
  and 10 driver assistance systems as standard. Powered by a 37.3 kWh LFP battery providing 265 km
  WLTP range, with a single front motor producing 70 kW (95 PS). Seats 4 occupants.
  Main drawbacks include limited rear space and low DC charging speed (max 48 kW).

