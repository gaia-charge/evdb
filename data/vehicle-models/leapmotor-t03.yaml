notes: >
  The Leapmotor T03 is produced in Poland at Stellantis' Tychy plant, making it one of the few
  Chinese-designed EVs manufactured in Europe. This avoids EU import tariffs on Chinese EVs.
  Available through 40+ Stellantis dealer locations in Germany. Single trim level with comprehensive
  standard equipment. The 37.3 kWh LFP battery provides 265 km WLTP range — sufficient for city use.
  DC charging is limited to 48 kW maximum, so not suited for long-distance travel.
  Competes primarily with the Dacia Spring, which is cheaper but far less well-equipped.

