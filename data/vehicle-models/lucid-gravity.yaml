  - "MKBHD 2025 EV of the Year"
  - "Euro NCAP 5-star 2025"

market_position: >
  Positioned as ultra-luxury electric SUV competing with BMW iX, Mercedes EQS SUV, and 
  Tesla Model X. The Gravity offers class-leading range (up to 724 km EPA), exceptional 
  interior space for 7 adults, and Lucid's industry-leading efficiency. European deliveries 
  began in 2025, targeting affluent families and tech-savvy luxury buyers seeking the most 
  advanced electric SUV available.

