description: >
  The Lucid Gravity is a battery electric mid-size luxury crossover SUV and Lucid's second 
  model after the Air sedan. Built on the same LVSA platform (Lucid Vehicle Standard 
  Architecture), the Gravity offers seating for up to 7 adults across three rows with up to 
  3,398 liters (120 cu ft) of cargo space with seats folded. Available in multiple 
  configurations from the efficient Touring to the performance-focused Grand Touring, the 
  Gravity delivers up to 724 km (450 miles) EPA range, up to 828 hp, and 300kW DC fast 
  charging capability. The Gravity features Lucid's signature 900V+ architecture, 34-inch 
  curved Glass Cockpit display, adjustable air suspension, and advanced Dream Drive ADAS. 
  Named Car and Driver's 10Best SUVs and Esquire's Car of the Year. Euro NCAP 5-star rated 
  with 83% adult, 93% child, 80% pedestrian, and 85% safety assist scores.

key_features:
  - Up to 724 km EPA range (450 miles - longest in class)
  - Up to 828 hp tri-motor performance (Grand Touring)
  - Seating for up to 7 adults with fold-flat 2nd and 3rd rows
  - Up to 3,398 liters cargo space (120 cu ft) with seats folded
  - 900V+ electrical architecture for ultra-fast 300kW charging
  - 34" curved 5K Glass Cockpit display
  - Adjustable air suspension standard
  - 0.24 Cd drag coefficient (exceptional for SUV)
  - Dream Drive Pro ADAS available
  - 22-speaker Surreal Sound Pro audio (Dolby Atmos)
  - 4-zone automatic climate control
  - Glass Canopy panoramic roof standard
  - Frunk storage with integrated bench
  - Euro NCAP 5-star safety rating (2025)
  - V2L and V2H bidirectional charging capability

notable_competitors:
  - BMW iX
  - Mercedes-Benz EQS SUV
  - Tesla Model X
  - Rivian R1S
  - Cadillac Lyriq

awards:
