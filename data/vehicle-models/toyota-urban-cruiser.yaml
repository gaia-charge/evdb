description: |
  The Toyota Urban Cruiser is Toyota's compact electric SUV for Europe, based on the same
  Heartect-e skateboard platform as the Suzuki e Vitara. Manufactured at Suzuki Motor Gujarat
  in India, the Urban Cruiser features Toyota-specific styling with a distinctive front end
  and interior details while sharing the mechanical underpinnings with its Suzuki sibling.
  
  Available with two LFP battery options (49 kWh and 61 kWh) and front-wheel or all-wheel
  drive configurations. The Urban Cruiser targets the competitive B-SUV segment alongside
  the Hyundai Kona Electric, Kia Niro EV, and Volvo EX30. It complements Toyota's existing
  bZ4X in the electric lineup, offering a more affordable and compact option.
  
  Key selling points include competitive pricing, LFP battery longevity, standard heat pump,
  and Toyota's reputation for reliability.

