notes: |
  First pure BEV from Lynk & Co. European sales started October 2024.
  Based on Geely SEA platform (same as Volvo EX30, Zeekr X, Smart #1/#3).
  Two trims: Core and More. Same powertrain, different equipment levels.
  More trim adds 22kW AC, 20" wheels, panoramic roof, Harman Kardon audio.
  Competitive pricing undercuts comparable Volvo EX30 and VW ID.3.
  1,600 kg towing capacity (braked) - unusually high for the segment.
