description: |
  The Lynk & Co 02 is the brand's first pure battery-electric vehicle for the European 
  market. Built on Geely's SEA platform (shared with Volvo EX30, Zeekr X, Smart #1/#3), 
  it's a compact crossover-coupé positioned in the lower-middle class segment.
  
  With a single rear-mounted 200 kW permanent magnet synchronous motor, 66 kWh NCM 
  battery, and up to 445 km WLTP range, the 02 offers a compelling package at competitive 
  pricing. Standard features include V2L bidirectional charging, 15-liter frunk, 
  and comprehensive ADAS including Euro NCAP 5-star safety rating.
  
  Available in two trims: Core (€35,995) with 11 kW AC charging and 19" wheels, 
  and More (€39,995) with 22 kW AC charging, 20" wheels, and additional premium features.
  Sold direct-to-consumer through Lynk & Co's online platform and Club stores.
