description: >
  The all-new Mini Cooper Electric (2024) represents Mini's third generation of electric vehicles
  and first on a dedicated EV platform. Built on BMW Group's FAAR2 EV architecture, it offers
  improved packaging, range, and charging compared to the previous Mini Electric (2020-2023).

  The Cooper Electric blends iconic Mini design with modern EV technology, featuring a minimalist
  interior with circular OLED display, ambient lighting, and sustainable materials. It's positioned
  as a premium urban EV with spirited go-kart handling that Mini is famous for.

  Available in two battery sizes (40.7kWh and 54.2kWh), the Cooper Electric offers up to 402km
  WLTP range in the larger battery variant. Standard features include heat pump, rapid DC charging
  up to 95kW, and Mini's characteristic customization options.

