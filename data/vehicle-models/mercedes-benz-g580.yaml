notes: |
  The Mercedes-Benz G 580 with EQ Technology is the fully electric version of the iconic G-Class.
  It retains the classic boxy design and body-on-frame construction while adding four electric motors
  (one per wheel) for unprecedented off-road capability.
  
  The G-TURN feature allows the vehicle to rotate 360° on the spot like a tank, made possible by
  independent motor control at each wheel. This is unique in the automotive world.
  
  Key innovations:
  - 4 individually controlled electric motors (one per wheel)
  - G-TURN: 360° rotation on the spot
  - G-STEERING: rear-axle steering for improved maneuverability
  - 2-speed transmission on each axle (Low Range for off-road)
  - Silicon carbide inverters for efficiency
  - 116 kWh battery integrated into the ladder frame
  
  Despite weighing over 3 tonnes, the electric G-Class maintains the legendary off-road capability
  of its ICE predecessor, with advantages like instant torque and precise wheel-by-wheel control.
  
  Competes with:
  - Land Rover Defender P400e (PHEV, no BEV version yet)
  - No direct BEV competitor exists in this segment

