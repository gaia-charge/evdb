overview: >
  The NIO EL8 is a premium full-size electric 6-seat SUV built on NIO's NT 2.0 platform. 
  As NIO's flagship SUV, the EL8 competes with the BMW iX xDrive50 and Mercedes EQS SUV.
  At 5,099 mm long with a 3,070 mm wheelbase, it offers exceptional space in a luxurious 
  6-seat configuration (2+2+2). Dual-motor AWD delivers 480kW (653 PS) and 850 Nm with 
  a 4.1s 0-100 km/h sprint. Available with 75 kWh (370 km WLTP) or 100 kWh (465 km WLTP) 
  battery packs. Features include 6-piston Brembo brakes, 22-inch forged wheels, air 
  suspension, and NIO's full suite of premium technology.

