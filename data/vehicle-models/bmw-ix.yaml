# Notes
notes: |
  BMW's flagship electric vehicle and technological showcase. The iX represents BMW's
  vision for luxury electric mobility with cutting-edge technology, premium materials,
  and exceptional build quality.

  Notable for its controversial design with large kidney grille (which is actually closed,
  for aerodynamics), class-leading towing capacity (2,500kg), and Bowers & Wilkins
  Diamond audio system.

  Built on adapted CLAR platform (not dedicated EV platform like Mercedes EVA2 or VW MEB),
  which explains some compromises but allows BMW to leverage existing manufacturing.

  xDrive models use dual motors for all-wheel drive with electric torque vectoring.
  Rear-wheel steering (up to 2.5 degrees) improves maneuverability in tight spaces.

  Available in xDrive40, xDrive50, and M60 variants. The xDrive50 is the most popular,
  balancing range (630km WLTP) with performance.

