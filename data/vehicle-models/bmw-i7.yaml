notes: |
  The BMW i7 is the all-electric version of the 7 Series flagship sedan.
  Built on the CLAR WE platform with 400V architecture, it offers executive
  luxury with impressive range and technology. Features include 31" Theatre
  Screen for rear passengers, Bowers & Wilkins Diamond Surround Sound,
  Executive Lounge seating, and adaptive air suspension. Targets Mercedes
  EQS and Tesla Model S buyers seeking traditional luxury sedan format.

