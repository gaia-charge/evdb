overview: >
  The Leapmotor C10 is a compact electric SUV distributed in Europe through Leapmotor International,
  a joint venture between Leapmotor and Stellantis (51% Stellantis ownership). It competes directly with
  the VW ID.4 and Tesla Model Y at a significantly lower price point. The C10 features a minimalist,
  high-quality interior with premium materials, a 14.6-inch central touchscreen, and comprehensive
  standard equipment. Built on Leapmotor's LEAP 3.0 platform with a 69.9 kWh LFP battery providing
  up to 420 km WLTP range. Available as a pure BEV with a single rear motor producing 170 kW (231 PS).
  Main drawback is the relatively low DC charging speed of 84.4 kW maximum. Sold through Stellantis
  dealer network across Europe.

