notes: >
  The Leapmotor C10 is distributed in Europe through Leapmotor International, a 51/49 JV between
  Stellantis and Leapmotor. This gives it access to Stellantis' extensive European dealer network
  (40+ locations in Germany alone at launch). The T03 city car is sold alongside it. The C10 uses
  LFP battery chemistry for cost efficiency and safety. Main weakness is the low DC charging speed
  (max 84.4 kW), which is well below competitors. A version with faster charging architecture is
  expected in the future. The C10 received 5 stars in Euro NCAP 2024 crash tests.

