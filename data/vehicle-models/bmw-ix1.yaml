description: >
  The BMW iX1 is BMW's entry-level electric SUV, built on the flexible FAAR platform 
  alongside the gasoline and diesel X1. Launched in late 2022 as part of the third-generation 
  X1 family, it offers premium BMW quality in a compact package with excellent efficiency 
  and practicality. The iX1 xDrive30 features dual-motor AWD and a 64.7kWh battery delivering 
  up to 439km WLTP range.
  
  Key features include BMW's latest Curved Display (10.25" + 10.7"), standard heat pump, 
  and practical 490L cargo space (expandable to 1,495L). The iX1 targets young families 
  and urban professionals wanting BMW premium quality in a compact electric SUV format.

