description: |
  The Porsche Taycan Sport Turismo is the shooting brake variant of the Taycan,
  combining sports car performance with a more practical roofline and increased
  cargo space. Launched in 2022, it features a sportier, more aggressive look
  than the Cross Turismo while offering significantly more headroom and cargo
  capacity than the sedan. The elongated roofline and integrated rear spoiler
  create one of the most striking silhouettes in the electric vehicle market.

  Mechanically identical to the Taycan sedan, the Sport Turismo shares the 800V
  J1 platform, all powertrain options, and performance characteristics. The key
  difference is the extended roofline with a larger glass rear, rear seats with
  more headroom, and a hatchback-style trunk opening for easier loading.

