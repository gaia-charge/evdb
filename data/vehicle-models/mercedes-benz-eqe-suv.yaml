description: >
  The Mercedes-Benz EQE SUV is a mid-size luxury electric SUV built on the 
  dedicated EVA2 platform, sharing its underpinnings with the EQE sedan. 
  It offers a spacious, elevated alternative to the sedan with improved 
  cargo capacity and versatility while maintaining the elegant design and 
  advanced technology of the EQE family.
  
  The EQE SUV features Mercedes-Benz's signature one-bow design adapted for 
  an SUV silhouette, offering standard all-wheel drive on most variants, 
  advanced aerodynamics for an SUV (Cd 0.26), and the full suite of Mercedes 
  luxury features including the optional MBUX Hyperscreen. It competes with 
  the BMW iX, Audi Q8 e-tron, and Tesla Model X.

