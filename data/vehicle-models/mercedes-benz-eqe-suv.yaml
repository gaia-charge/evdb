notes: >
  The EQE SUV bridges the gap between the smaller EQA/EQB compact SUVs and the 
  flagship EQS SUV. It offers 470-590km of range depending on variant, with 
  standard AIRMATIC air suspension, optional rear-axle steering (up to 10 degrees), 
  and available Level 3 autonomous driving capability in Germany (DRIVE PILOT).
  
  The SUV format provides additional cargo space, higher seating position, and 
  increased towing capacity (1800kg) compared to the sedan. Optional third-row 
  seating is not available - the EQE SUV is a strict 5-seater focused on 
  luxury and space.
  
  2024 model year includes improved battery chemistry, optimized thermal 
  management, and enhanced MBUX software with better EV routing.

