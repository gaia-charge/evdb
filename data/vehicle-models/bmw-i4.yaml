description: >
  The BMW i4 is a fully electric gran coupé based on the 4-series platform.
  It shares the CLAR architecture with gasoline and hybrid models but is adapted
  for electric powertrains. Available in eDrive40 (RWD) and M50 (AWD) variants,
  the i4 combines BMW's driving dynamics with electric efficiency. The i4 M50
  is BMW's first electric M Performance model.

