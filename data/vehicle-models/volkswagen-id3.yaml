notes: |
  The Volkswagen ID.3 is VW's first purpose-built electric vehicle on the
  MEB platform. Launched as the spiritual successor to the Golf, it's
  positioned as the foundation of VW's electric future. The ID.3 offers
  practical space, good range, and competitive pricing. It's built at the
  carbon-neutral Zwickau factory in Germany. The 2024 facelift (Pro S)
  improved software, added more physical buttons, and enhanced range.

