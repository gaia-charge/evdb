description: |
  The Opel Corsa-e is a fully electric version of Opel's popular B-segment hatchback, 
  built on Stellantis' Common Modular Platform (CMP) shared with the Peugeot e-208.
  
  Mechanically identical to the Peugeot e-208, the Corsa-e offers the same 50kWh battery, 
  100kW motor, and performance, but with Opel's signature design language, IntelliLux LED 
  matrix headlights, and a more conservative, practical interior layout.
  
  The Corsa-e is positioned as the value alternative within the Stellantis family, 
  typically priced €3,000 lower than the Peugeot e-208 GT while offering similar 
  technology and performance. It targets practical-minded buyers who prioritize 
  functionality and value over premium design.
  
  Key differentiators vs e-208:
  - More conservative, traditional design (vs e-208's sporty styling)
  - IntelliLux LED Matrix headlights (Opel exclusive in affordable segment)
  - Simpler interior with more physical buttons (easier to use while driving)
  - Lower price point (typically €2,500-3,000 less than e-208 GT)
  - Focus on practicality and technology accessibility
  
  The Corsa nameplate has been one of Europe's best-selling cars since 1982, with over 
  14 million units sold across five previous generations. The Corsa-e represents the 
  electric future of this iconic model.
  
  Built at Stellantis' Zaragoza plant in Spain alongside the Peugeot e-208.
notes: |
  - Badge-engineered twin of Peugeot e-208 (mechanically identical, 85%+ parts sharing)
  - Typically €2,500-3,000 cheaper than Peugeot e-208 GT with same specs
  - IntelliLux LED Matrix headlights are Opel's signature technology advantage
  - 2023 facelift: battery 50→50kWh (unchanged), minor efficiency improvements
  - Available in three trim levels: Edition, Elegance, GS Line (sportiest)
  - GS Line adds sporty body kit, black roof, 17\" alloys, sport seats
  - Also available as Vauxhall Corsa-e in UK (identical, different badge)
  - Built at Zaragoza, Spain (Stellantis plant, same production line as e-208)
  - Shares 50kWh battery, 100kW motor, CCS2 fast charging with e-208
  - 309L trunk is smallest in B-segment due to battery placement
  - No towing capability (city car focus)
  - 8-week delivery time (same production line as e-208)
