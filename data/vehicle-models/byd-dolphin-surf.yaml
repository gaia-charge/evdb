notes: |
  The BYD Dolphin Surf is a compact electric crossover positioned between the
  Dolphin hatchback and the Atto 3/Seal U. Unveiled at the Paris Motor Show 2024,
  it targets the European C-segment crossover market, competing with the VW ID.3,
  Peugeot e-2008, and Opel Mokka Electric.

  Based on the Chinese-market BYD Yuan Up, the Dolphin Surf features BYD's Blade
  Battery (LFP) technology and is available in two battery sizes.

  Competes with: Volkswagen ID.3, Peugeot e-2008, Opel Mokka Electric, Cupra Born.
