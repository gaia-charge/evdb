description: |
  The Opel Grandland Electric is a fully electric C-segment SUV built on Stellantis' new 
  STLA Medium platform, representing a complete redesign and technological leap from the 
  previous generation Grandland X Hybrid.
  
  Launched in 2024, the Grandland Electric is Opel's flagship electric SUV, positioned 
  above the Mokka-e and competing directly with the Volkswagen ID.4, Hyundai Ioniq 5, 
  and Peugeot e-3008 (with which it shares its platform).
  
  Key technological highlights:
  - STLA Medium platform (first Opel on this architecture)
  - 73 kWh or 82 kWh battery options (LFP or NMC chemistry)
  - 160kW single motor or 230kW dual motor configurations
  - 160kW DC fast charging (10-80% in ~30 minutes)
  - 520-580 km WLTP range depending on variant
  - STLA Brain operating system with OTA updates
  - Google Automotive Services built-in
  - Intelli-Drive 2.0 advanced driver assistance
  
  The Grandland Electric features Opel's latest "Opel Vizor 3D" front design with 
  integrated IntelliLux LED Pixel Light technology (available with 84 elements), 
  a spacious interior with excellent rear legroom and cargo capacity, and a focus 
  on German engineering quality and practicality.
  
  Differentiators vs Peugeot e-3008:
  - More conservative, practical design (German vs French styling)
  - Slightly lower pricing (typically €2,000-3,000 less)
  - Larger cargo capacity (550L vs 520L trunk)
  - IntelliLux LED Pixel technology (Opel exclusive)
  - Focus on functionality over design flair
  
  Built at Stellantis' Eisenach plant in Germany (Opel's traditional manufacturing base).
notes: |
  - Platform sibling of Peugeot e-3008 (STLA Medium platform sharing)
  - First Opel on STLA Medium platform (future: Grandland, Frontera Electric)
  - Third generation Grandland overall, first pure electric generation
  - Replaces Grandland X Hybrid (PHEV, discontinued 2024)
  - Available in three trim levels: Edition, GS, Ultimate
  - Ultimate adds IntelliLux Pixel LED, Denon audio, massage seats, head-up display
  - Built at Eisenach, Germany (Opel's traditional manufacturing home)
  - Delivery time: 4-6 months (new model, high demand)
  - Battery warranty: 8 years/160,000km with 70% capacity guarantee
  - No towing capacity officially published yet (expected ~1,500kg)
  - OTA updates supported (STLA Brain operating system)
  - Google Automotive Services: Assistant, Maps, Play Store built-in
  - Supports V2L (vehicle-to-load) for bidirectional charging
