production_years:
  start: 2024
  end: null
platform: meb
description: >
  The Volkswagen ID.7 Tourer is the estate (wagon) variant of the ID.7 sedan,
  offering the same impressive range and efficiency with significantly more cargo
  space. Built on VW's MEB platform, it targets families and business users who
  need the practicality of an estate with zero emissions.
  
  With up to 690 km WLTP range (Pro S), it's one of the longest-range electric
  estates available. The 605-liter boot (1,714 liters with rear seats folded)
  makes it a genuine Passat Variant replacement for the electric era.
  
  Available in Pro S (RWD, 210 kW) and GTX (AWD, 250 kW) configurations,
  both sharing the 86 kWh (usable) battery pack.

key_features:
  - Estate body with 605L boot (1,714L seats folded)
  - Up to 690 km WLTP range (Pro S)
  - 200 kW DC fast charging with Plug & Charge
  - ID. Software 5.0 with enhanced voice control
  - Augmented reality head-up display
  - DCC adaptive chassis control
  - Matrix LED headlights (IQ.LIGHT)
  - Heat pump standard
  - Battery preconditioning via navigation
  - Built in Emden, Germany

notable_competitors:
  - BMW i5 Touring
  - Mercedes EQE SUV
  - Polestar 5
  - Audi A6 Avant e-tron

market_position: >
  The ID.7 Tourer fills a crucial gap in VW's electric lineup as the first
  electric estate from the brand. It directly replaces the Passat Variant for
  electric-minded buyers and targets the large German company car market where
  estates are extremely popular. Competitive pricing under €70,000 ensures
  favorable 0.25% company car taxation.
