description: |
  The Abarth 600e is the performance-oriented electric version of the Fiat 600e, bringing
  Abarth's sporting heritage to the compact electric SUV segment. Built on Stellantis' eCMP2
  platform, it features a more powerful 207 kW (280 PS) electric motor, aggressive styling
  with Abarth-specific design elements, sport-tuned suspension, and the signature Abarth
  exhaust sound simulator.
  
  Available in Turismo and Scorpionissima trims, the 600e represents Abarth's transition
  to fully electric performance vehicles. It shares the 54 kWh battery with the Fiat 600e
  but delivers significantly more power and sportier driving dynamics.

