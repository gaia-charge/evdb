notes: |
  The BYD Tang EV is BYD's flagship 7-seat electric SUV for Europe. The 2024
  facelift brought a larger 108.8 kWh Blade Battery, improved range of ~530 km
  WLTP, and updated exterior/interior styling. Positioned as a spacious family
  SUV competing with Mercedes EQB and Tesla Model X (at a lower price).

  Key features: 7-seat layout, AWD as standard, Blade Battery (LFP) technology.

  Competes with: Mercedes-Benz EQB, Tesla Model X, Kia EV9, Hyundai Ioniq 9.
