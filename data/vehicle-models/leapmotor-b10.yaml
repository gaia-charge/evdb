notes: >
  The Leapmotor B10 is the brand's second European model (after C10 and T03), positioned as an
  affordable compact crossover. Built on the newer LEAP 3.5 platform, it addresses the C10's main
  weakness with significantly improved DC charging speeds (up to 150 kW vs 84.4 kW on the C10).
  Price expected to start around €28,000-30,000, making it one of the most affordable compact
  electric SUVs in Europe. Distributed through Stellantis dealer network.

