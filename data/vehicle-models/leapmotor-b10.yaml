overview: >
  The Leapmotor B10 is a compact electric SUV positioned below the C10, targeting the high-volume
  European compact crossover segment. Built on the newer LEAP 3.5 platform with improved architecture,
  it features faster DC charging than the C10. Distributed in Europe through Leapmotor International
  (Stellantis 51% JV), the B10 competes with models like the Peugeot e-2008, Opel Mokka Electric,
  and VW ID.3. It offers a 69.9 kWh LFP battery with approximately 400 km WLTP range, and a single
  rear motor producing 170 kW (231 PS). Key improvement over the C10 is the upgraded DC fast charging
  capability up to 150 kW, addressing the main criticism of the C10.

