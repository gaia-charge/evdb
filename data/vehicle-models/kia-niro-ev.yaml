# Notes
notes: |
  The Kia Niro EV is Kia's compact electric crossover, positioned as a more traditional and affordable
  alternative to the sportier EV6. The second generation (2022+) features modern design, improved range,
  and comprehensive technology.

  Key features:
  - 64.8 kWh battery (second generation)
  - Up to 460 km WLTP range
  - 10.8" dual panoramic displays
  - Heat pump standard
  - V2L capability (3.6kW) - Vehicle-to-Load
  - 400V architecture (not 800V like EV6)
  - 85kW DC fast charging (10-80% in 45 minutes)

  Improvements over first generation:
  - 25% more efficient drivetrain
  - 13% larger battery capacity
  - 15% more range
  - Modern interior with dual displays
  - Improved aerodynamics (Cd 0.29)

  Safety:
  - 5-star Euro NCAP rating (2022)
  - 91% adult occupant protection
  - 87% child occupant protection
  - Highway Driving Assist 2
  - Blind-Spot View Monitor

  Target market: Families and practical buyers seeking proven EV technology in traditional SUV package,
  those prioritizing value over cutting-edge performance of EV6.

  Competes with: Hyundai Kona Electric, VW ID.4, Nissan Ariya, Toyota bZ4X

