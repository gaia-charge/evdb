  notes: |
    MG Cyberster is an all-electric sports roadster celebrating MG's 100th anniversary.
    Features scissor doors, electric soft top, and 800V architecture.
    Dual-motor AWD with 375kW (510hp) delivering 3.2s 0-100 km/h.
    77 kWh battery provides 507 km WLTP range.
    One of the few electric convertibles/roadsters available in Europe.
    Competes with Porsche Boxster EV (when available) and Tesla Roadster (when available).
    Positioned as an affordable electric sports car.
