overview: >
  The NIO ET5 is a premium electric mid-size sedan built on NIO's second-generation NT 2.0 
  platform. Competing directly with the Tesla Model 3 and BMW i4, the ET5 features dual-motor 
  AWD with 360kW (490 PS) and 700 Nm, delivering 4.0s 0-100 km/h. Available with 75 kWh 
  or 100 kWh battery packs providing 456 km and 590 km WLTP range respectively.
  
  NIO's unique Battery-as-a-Service (BaaS) model allows customers to purchase the car without 
  the battery and subscribe to a monthly battery rental (€169/month for 75 kWh, €289/month 
  for 100 kWh), significantly reducing the upfront purchase price. NIO's battery swap stations 
  enable 3-5 minute battery exchanges as an alternative to conventional charging.
  
  Standard equipment is comprehensive: Nappa leather interior, 12.8-inch AMOLED center display, 
  10.2-inch digital instrument cluster, NOMI AI companion, 7.1.4 surround sound system, 
  panoramic glass roof, and NIO Aquila Super Sensing ADAS system with 33 sensors including 
  lidar. The ET5 targets tech-savvy premium buyers seeking an alternative to German luxury 
  sedans with innovative ownership models.

