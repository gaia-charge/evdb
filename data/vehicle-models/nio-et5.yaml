notes: >
  NIO differentiates through its Battery-as-a-Service (BaaS) ownership model and battery 
  swap network. In Germany, NIO operates NIO Houses (brand experience centers) in Berlin, 
  Munich, Frankfurt, Hamburg, and Düsseldorf. Battery swap stations are being expanded across 
  Germany and Europe, enabling 3-5 minute battery exchanges. The ET5 shares its platform 
  with the ET5 Touring (estate/wagon variant). All ET5 models are dual-motor AWD with 
  identical 360kW powertrain regardless of battery size.

