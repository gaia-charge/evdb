description: >
  The Rolls-Royce Spectre is the marque's first fully electric vehicle, a full-size 
  ultra-luxury grand tourer coupe built on the Architecture of Luxury platform shared 
  with the Phantom VIII and Cullinan. Handcrafted at Goodwood, England, the Spectre 
  delivers 430 kW (577 hp) and 900 Nm from dual BMW eDrive separately excited synchronous 
  motors with all-wheel drive. With a 102 kWh battery providing 517 km WLTP range and a 
  drag coefficient of 0.25 (most aerodynamic Rolls-Royce ever), the Spectre represents 
  Rolls-Royce's electric future while maintaining the brand's hallmark of effortless luxury 
  and near-silent operation. The Black Badge variant offers 485 kW (650 hp) and 1,075 Nm.

key_features:
  - Rolls-Royce's first fully electric vehicle
  - 430 kW (577 hp) / 900 Nm dual-motor AWD (standard)
  - 485 kW (650 hp) / 1,075 Nm (Black Badge)
  - 102 kWh battery with 517 km WLTP range
  - 0.25 Cd drag coefficient (most aerodynamic RR ever)
  - Architecture of Luxury platform (shared with Phantom/Cullinan)
  - Redesigned Spirit of Ecstasy (83mm, more aerodynamic)
  - Coach doors (rear-hinged)
  - Starlight Headliner with 4,796 fiber optic lights
  - Bespoke Audio system
  - Planar suspension system
  - Nearly 3 tonnes curb weight for ultimate ride comfort
  - Handcrafted at Goodwood, England

notable_competitors:
  - Bentley Continental GT (combustion, no BEV equivalent yet)
  - Mercedes-Benz EQS Coupe (concept)
  - Lucid Air Sapphire

awards:
  - "Robb Report Car of the Year 2024"

market_position: >
  The Spectre occupies a unique position as the world's most expensive production BEV and 
  the only ultra-luxury electric grand tourer. With no direct BEV competitors at this price 
  point (€340,000+), the Spectre primarily competes with its combustion siblings and the 
  Bentley Continental GT for ultra-high-net-worth buyers who want the ultimate expression 
  of electric luxury motoring.
