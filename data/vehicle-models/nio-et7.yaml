overview: >
  The NIO ET7 is a premium full-size electric sedan built on NIO's second-generation NT 2.0 
  platform. Positioned as NIO's flagship sedan competing with the BMW i7, Mercedes EQS, and 
  Porsche Taycan, the ET7 features dual-motor AWD with 480kW (653 PS) and 850 Nm, delivering 
  a 3.8s 0-100 km/h sprint. Available with 75 kWh or 100 kWh battery packs providing 445 km 
  and 580 km WLTP range respectively.
  
  At 5,101 mm in length with a 3,060 mm wheelbase, the ET7 offers exceptional interior space 
  and a luxurious cabin featuring Nappa leather, karuun® sustainable rattan trim elements, 
  12.8-inch AMOLED center display, NOMI AI companion, and a 7.1.4 Dolby Atmos surround sound 
  system with 23 speakers. The NIO Aquila Super Sensing system includes 33 sensors with lidar 
  for advanced driver assistance.
  
  NIO's Battery-as-a-Service (BaaS) model allows purchasing without the battery at a reduced 
  price, with monthly battery rental (€169/month for 75 kWh, €289/month for 100 kWh). Battery 
  swap stations enable 3-5 minute full battery exchanges. The ET7 is also rated for towing up 
  to 2,000 kg with its standard electric towbar.

