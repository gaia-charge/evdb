overview: |
  The Alpine A390 is Alpine's first electric fastback, positioned as a sporty family GT in the
  D-segment. Built on Renault's AmpR Medium platform with a 94 kWh battery (89 kWh usable),
  it offers up to 555 km WLTP range. Available in GT (295 kW AWD) and GTS (345 kW AWD) variants,
  it combines Alpine's sporting DNA with practical everyday usability. Features include V2L, V2H,
  and V2G bidirectional charging capabilities, a 532-liter trunk, and seating for five.

