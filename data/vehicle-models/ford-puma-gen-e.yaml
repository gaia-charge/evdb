notes: |
  The Ford Puma Gen-E is Ford's first small electric crossover for Europe, built on
  a multi-energy platform shared with Stellantis brands. Positioned as a practical
  urban-friendly EV with 376 km WLTP range and 523L boot space.

  Key features: 100 kW DC fast charging, Plug & Charge support, MegaBox storage.

  Competes with: Peugeot e-2008, Opel Mokka Electric, Renault 4 E-Tech, Citroën ë-C3 Aircross.
