notes: |
  The new Lancia Ypsilon marks the rebirth of the Lancia brand as a premium
  electric-focused marque under Stellantis. Italian design by Centro Stile Lancia
  with Cassina-designed interior. Built on the STLA Small platform.

  Available as BEV (54 kWh) and mild hybrid. Only BEV variant tracked here.
  Initially available in Italy, France, and Benelux, expanding to other European markets.

  Competes with: Mini Cooper Electric, Peugeot e-208, Opel Corsa Electric, Renault 5 E-Tech.
