  notes: "The Audi A6 Sportback e-tron is a premium executive liftback sedan on the 800V PPE platform. Available in three powertrains: performance (RWD, 280kW), quattro (AWD, 340kW), and S6 (AWD, 405kW). All share a 100kWh battery (94.9kWh usable) with NMC811 chemistry. DC charging up to 269kW peak with 10-80% in ~23 minutes. The Sportback body style with Cd 0.21 delivers class-leading efficiency and range. Competes with BMW i5, Mercedes EQE, and Tesla Model S."
