notes: |
  The Tesla Model S is a full-size luxury sedan (F-segment) that was Tesla's
  first mass-production vehicle. The current generation (Refresh) introduced in
  2021 features a revised exterior, yoke steering wheel option, tri-motor Plaid
  powertrain, and updated interior with horizontal touchscreen display.
  
  The Model S Plaid is one of the fastest production sedans in the world with
  0-60 mph in 1.99 seconds (US EPA claim).

