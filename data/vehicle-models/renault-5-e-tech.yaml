  The Renault 5 E-Tech is a modern reinterpretation of the iconic Renault 5,
  launched as an affordable electric vehicle for urban and suburban use. Built
  on the new AmpR Small platform developed specifically for affordable EVs,
  it combines retro-inspired design with modern electric technology. The R5
  E-Tech represents Renault's commitment to accessible electric mobility with
  competitive pricing starting under €25,000 in Europe. Features innovative
  "Reno" avatar assistant and unique French design flair.

