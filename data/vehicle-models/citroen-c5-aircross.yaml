description: >
  The Citroën C5 Aircross is Citroën's fully electric mid-size SUV, built on the
  Stellantis STLA Medium platform. It replaces the previous PHEV-only C5 Aircross
  with a dedicated BEV offering up to 681 km WLTP range from its 97 kWh battery.
  
  Featuring Citroën's distinctive new design language with a bold front end and
  signature light signature, the C5 Aircross combines comfort-focused engineering
  with practical family SUV packaging. The Advanced Comfort seats and progressive
  hydraulic cushion suspension deliver Citroën's trademark ride comfort.
  
  Available with 73 kWh and 97 kWh battery options, the C5 Aircross targets
  families seeking a comfortable, spacious electric SUV with competitive range
  and Citroën's value-oriented pricing.

key_features:
  - STLA Medium platform (Stellantis)
  - Up to 97 kWh battery with 681 km WLTP range
  - Citroën Advanced Comfort seats
  - Progressive hydraulic cushion suspension
  - Heat pump standard
  - 160 kW DC fast charging
  - 565L trunk (1,668L max)
  - Battery preconditioning with navigation
  - 5-star Euro NCAP safety rating (2025)

notable_competitors:
  - Peugeot e-3008
  - Volkswagen ID.4
  - Skoda Enyaq iV
  - Hyundai Ioniq 5
  - BYD Seal U
  - Opel Grandland Electric

market_position: >
  Positioned as a comfort-focused family electric SUV within the Stellantis group,
  the C5 Aircross offers a softer, more comfort-oriented alternative to the sportier
  Peugeot e-3008 on the same platform. Citroën's value pricing and emphasis on
  ride comfort target families prioritising passenger wellbeing over driving dynamics.
