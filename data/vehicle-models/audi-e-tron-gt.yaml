notes: |
  The Audi e-tron GT is Audi's flagship electric performance sedan, sharing its J1 platform
  and 800V architecture with the Porsche Taycan. While mechanically very similar to the Taycan,
  the e-tron GT offers a more refined, luxury-focused experience vs the Taycan's sports car character.
  
  Available in two variants:
  - e-tron GT quattro: 390kW (530hp)
  - RS e-tron GT: 475kW (646hp) - top performance variant
  
  The 800V architecture enables exceptionally fast charging (270kW peak), with 5% to 80% charge
  in just 22.5 minutes under ideal conditions.
  
  Built alongside the Porsche Taycan at the Porsche factory in Stuttgart-Zuffenhausen, Germany,
  sharing approximately 60% of components.
  
  Key advantages over Taycan:
  - Slightly more rear legroom and cargo space
  - More compliant, comfortable suspension tuning
  - Audi's refined interior design and Virtual Cockpit
  - Generally €5-10k less expensive than equivalent Taycan

