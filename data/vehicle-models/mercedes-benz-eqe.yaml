description: >
  The Mercedes-Benz EQE is a luxury electric sedan built on the dedicated EVA2 
  platform. Positioned between the smaller EQC and the flagship EQS, the EQE 
  offers a blend of performance, range, and luxury in a more compact package. 
  It shares much of its technology and design language with the larger EQS but 
  in a more accessible mid-size sedan format.
  
  The EQE features Mercedes-Benz's signature one-bow design, a spacious interior 
  with the MBUX Hyperscreen option, and advanced aerodynamics. It's aimed at 
  competing with the BMW i4, Tesla Model S, and Porsche Taycan.

