notes: >
  The EQE is Mercedes-Benz's mid-size luxury electric sedan, offering 400-700km 
  of range depending on variant. It features an optional AIRMATIC air suspension, 
  rear-axle steering (up to 10 degrees), and Level 3 autonomous driving capability 
  in Germany (DRIVE PILOT).
  
  2024 model year updates include improved battery chemistry, faster DC charging 
  (up to 170kW for some variants), and updated MBUX software with better EV 
  route planning.

