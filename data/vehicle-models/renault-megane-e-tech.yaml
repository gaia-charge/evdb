notes: |
  The Renault Megane E-Tech Electric is Renault's first purpose-built electric vehicle on the
  CMF-EV platform (shared with Nissan Ariya). It won European Car of the Year 2023, marking
  Renault's sixth win in this prestigious award.
  
  **Key Differentiators:**
  - **CMF-EV Platform**: First Renault on dedicated EV platform (vs adapted ICE platforms)
  - **Revolutionary Design**: Slim L-shaped OLED display, fastback coupe-crossover styling
  - **Google Built-In**: Full Google Automotive Services integration (Maps, Assistant, Play Store)
  - **Award Winner**: European Car of the Year 2023 + World Car Design 2023
  
  **Platform Sharing:**
  - Built on same CMF-EV platform as Nissan Ariya
  - Shares battery technology and motors with Nissan
  - Production at Renault ElectriCity hub (Douai, France)
  
  **Trim Levels:**
  - **EV40 (Equilibre)**: 40kWh battery, 300km range, entry trim (~€38,000)
  - **EV60 (Techno)**: 60kWh battery, 450km range, mid trim (~€43,000)
  - **EV60 (Iconic)**: 60kWh battery, 470km range, top trim with optimized efficiency (~€46,000)
  
  **Technology Highlights:**
  - World's first L-shaped OLED instrument cluster (12.3" slim design)
  - OpenR Link infotainment with 12" portrait touchscreen
  - Over-the-air software updates
  - Heat pump standard on all variants
  - Multi-Sense driving modes (Eco, Comfort, Sport, Perso)
  
  **Competition:**
  - **Volkswagen ID.3** (€41,155): Similar size, German build, slower design
  - **Cupra Born** (€41,000): Sportier, same MEB platform as ID.3
  - **MG4** (€35,990): Cheaper, Chinese build, less premium
  - **Peugeot e-2008** (€39,000): Smaller B-SUV, less range
  - **Nissan Ariya** (€50,000): Larger, same platform, more expensive
  
  **Awards Recognition:**
  The 2023 European Car of the Year win was significant - defeating strong competitors like
  VW ID. Buzz and Jeep Avenger. Judges praised its design, technology, efficiency, and value.
