notes: |
  The Renault Megane E-Tech Electric is Renault's first dedicated electric vehicle on the CMF-EV platform
  (shared with Nissan Ariya). It won the prestigious 2023 European Car of the Year award.
  
  Key highlights:
  - Revolutionary design - slim LED headlights, coupé-SUV styling
  - OpenR Link infotainment with Google built-in (best in class)
  - Exceptional rear legroom (2700mm wheelbase)
  - Available in two battery sizes (40 kWh EV40, 60 kWh EV60)
  - Competitive pricing for the segment
  
  The Megane E-Tech competes with VW ID.3, Cupra Born, Nissan Ariya, and Hyundai Kona Electric.
  It's positioned as Renault's mainstream electric offering, replacing the role of the combustion Megane.
  
  2025 model year continues with minor updates and refined software.
