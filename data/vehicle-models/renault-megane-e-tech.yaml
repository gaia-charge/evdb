description: >
  The Renault Megane E-Tech Electric is a compact electric crossover that
  represents Renault's modern design language and commitment to electric
  mobility. Built on the dedicated CMF-EV platform shared with the Nissan
  Ariya, it offers two battery sizes (40 kWh and 60 kWh) to suit different
  needs and budgets. Winner of the 2023 European Car of the Year award,
  the Megane E-Tech combines sleek coupe-like styling with practical
  interior space and advanced technology. The large 12-inch portrait
  touchscreen powered by OpenR Link with Google built-in provides a modern
  user experience. Available in multiple trim levels from Equilibre to
  Iconic, it competes with the Volkswagen ID.3, Cupra Born, and BYD Dolphin
  in the increasingly competitive European compact EV segment.

