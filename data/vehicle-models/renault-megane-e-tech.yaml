notes: |
  The Renault Megane E-Tech Electric is the first fully electric generation of the iconic Megane.
  Built on the new CMF-EV platform shared with the Nissan Ariya, it represents Renault's new
  electric vehicle design philosophy.
  
  Key highlights:
  - 2023 European Car of the Year winner
  - Excellent aerodynamics (Cd 0.30)
  - Google Automotive Services built-in (Android Automotive OS)
  - Innovative Solarbay panoramic roof with electrochromic dimming
  - Two battery options: EV40 (40 kWh) and EV60 (60 kWh)
  - Fast charging up to 130 kW (EV60 supports up to 130 kW DC)
  - Excellent real-world efficiency
  - Spacious interior despite compact exterior dimensions
  
  The Megane E-Tech competes directly with VW ID.3, Cupra Born, and Hyundai Kona Electric.
  It stands out with its sophisticated design, tech integration, and driving dynamics.
  
  2025 model year continues with refinements and updated software.
