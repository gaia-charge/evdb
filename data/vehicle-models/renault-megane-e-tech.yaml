description: >
  The Renault Megane E-Tech Electric is a compact crossover built on Renault-Nissan-Mitsubishi's CMF-EV 
  dedicated electric platform. Winner of the 2023 European Car of the Year award, it combines sleek 
  coupe-SUV styling with practical interior space. Features OpenR infotainment powered by Android 
  Automotive OS with Google built-in, a unique wood-free interior made from recycled materials, 
  and efficient aerodynamics. Available with two battery options (40 kWh and 60 kWh) offering 
  flexible range and pricing.

