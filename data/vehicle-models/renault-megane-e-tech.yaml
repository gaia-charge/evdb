platform: cmf-ev
description: >
  The Renault Megane E-Tech is a compact electric crossover that reinvents the iconic 
  Megane nameplate for the electric era. Built on the CMF-EV platform (shared with 
  Nissan Ariya), it was named European Car of the Year 2023, recognizing its blend 
  of design, technology, and practicality.
  
  The Megane E-Tech features distinctive coupe-like styling with slim LED headlights, 
  flush door handles, and aerodynamic 20" wheels. Inside, it showcases OpenR Screen 
  infotainment powered by Android Automotive OS with Google services built-in.
  
  Available in two battery sizes (40 kWh EV40 and 60 kWh EV60), the Megane E-Tech 
  targets urban and suburban drivers seeking stylish, practical electric mobility. 
  The 60 kWh variants offer up to 470 km WLTP range, making them suitable for 
  longer journeys while maintaining compact dimensions ideal for European cities.

key_features:
  - CMF-EV platform (alliance platform with Nissan)
  - OpenR Screen with 12" portrait touchscreen and Android Automotive OS
  - Google services built-in (Maps, Assistant, Play Store)
  - Slim LED headlights with distinctive light signature
  - Heat pump standard for improved winter efficiency
  - One Pedal driving mode with strong regenerative braking
  - Multi-Sense drive modes (Eco, Comfort, Sport, Perso)
  - Up to 130 kW DC fast charging (EV60 variants)
  - 5-star Euro NCAP safety rating (2022)
  - Compact dimensions (4.21m length) with spacious interior

