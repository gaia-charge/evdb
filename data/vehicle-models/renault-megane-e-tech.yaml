notes: |
  The Renault Megane E-Tech Electric represents Renault's latest generation
  of compact electric vehicles built on the new CMF-EV platform shared with
  Nissan. Despite the Megane nameplate, this is an all-new design not directly
  related to previous Megane generations.
  
  The vehicle features OpenR multimedia system with dual screens (12" instrument
  cluster and 12" or 9" central touchscreen), Google Automotive Services
  integration, and OTA updates.
  
  Design highlights include a coupe-like silhouette, slim LED headlights, and
  a focus on aerodynamics (Cd 0.30).

