notes: |
  The Renault Megane E-Tech is Renault's first dedicated electric vehicle on
  the CMF-EV platform shared with Nissan Ariya. Winner of the 2023 European
  Car of the Year award, it combines coupe-like styling with practical space
  and competitive range. Built at the ElectriCity production hub in Douai,
  France. The Megane E-Tech represents Renault's electric future with advanced
  Google-powered infotainment and excellent efficiency.

