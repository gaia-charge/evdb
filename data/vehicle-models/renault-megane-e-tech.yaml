notes: |
  The Renault Megane E-Tech is the first Renault built on the CMF-EV dedicated electric platform
  (shared with Nissan Ariya). It represents a complete reinvention of the Megane nameplate as an
  electric-only compact crossover.
  
  Key highlights:
  - 2023 European Car of the Year (first Renault since 1991)
  - Built at Renault ElectriCity production hub in Douai, France
  - OpenR Link infotainment with Google built-in (Android Automotive OS)
  - Impressive 440L trunk (best in class)
  - Available with 40kWh (EV40) or 60kWh (EV60) battery options
  - Slimline battery design allows for lower seating position and better handling
  
  Competes with: Volkswagen ID.3, Cupra Born, Hyundai Ioniq 5, Kia EV6, MG4
