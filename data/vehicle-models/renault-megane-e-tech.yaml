notes: |
  The Renault Megane E-Tech Electric is Renault's first vehicle on the CMF-EV
  platform, shared with the Nissan Ariya. Winner of the 2023 European Car of
  the Year, it combines compact crossover styling with efficient electric
  performance. The Megane E-Tech offers a choice of two battery sizes (40 kWh
  and 60 kWh) with modern design, excellent interior space, and advanced
  technology including Google built-in infotainment. Built at the ElectriCity
  production hub in Douai, France.

