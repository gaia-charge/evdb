notes: |
  The Renault Megane E-Tech Electric is Renault's compact electric crossover-hatchback
  on the CMF-EV platform (shared with Nissan Ariya and Scenic E-Tech). Winner of the
  2023 European Car of the Year award, the Megane E-Tech combines striking design,
  excellent aerodynamics (0.30 Cd), and advanced technology. Available in EV40 (40 kWh)
  and EV60 (60 kWh) battery options. Features include the innovative OpenR Link
  infotainment system with Google Built-in, Multi-Sense ambient lighting, and
  comprehensive ADAS features. Ideal for urban and suburban driving with efficient
  consumption and competitive range.

