notes: |
  The Renault Megane E-Tech is Renault's first ground-up electric vehicle on the CMF-EV platform,
  shared with Nissan Ariya. It won European Car of the Year 2023.
  
  Key highlights:
  - Purpose-built EV platform (CMF-EV)
  - Google built-in infotainment
  - Class-leading interior space (440L boot)
  - Excellent efficiency and range
  - Built at Renault ElectriCity hub in Douai, France
  
  Available in two battery sizes:
  - EV40: 40kWh battery, ~300km range, 130hp
  - EV60: 60kWh battery, ~450km range, 220hp
  
  Competes with: Volkswagen ID.3, Cupra Born, Hyundai Ioniq 5, Kia EV6
