  - "5-star Euro NCAP Safety Rating (2022)"
  - "German Car of the Year 2023 (Compact Car Category)"

market_position: >
  Positioned as a stylish, tech-forward compact electric crossover offering 
  premium design and technology at accessible pricing. Strong focus on user 
  experience with Android Automotive OS integration and Google services. 
  Targets European buyers seeking practical electric mobility with distinctive 
  French design flair. Competes directly with VW ID.3 and Cupra Born with 
  advantage in design differentiation and infotainment integration.
