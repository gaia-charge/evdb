notes: |
  The Renault Megane E-Tech is Renault's first vehicle on the CMF-EV platform,
  shared with Nissan Ariya. Winner of the 2023 European Car of the Year award,
  it combines compact crossover practicality with excellent efficiency and
  modern design. The Megane E-Tech features a portrait touchscreen, Google
  built-in, and sustainable materials (recycled plastics). Available with
  40 kWh (EV40) or 60 kWh (EV60) batteries.

