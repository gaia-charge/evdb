notes: |
  The Renault Megane E-Tech Electric is Renault's first purpose-built EV on the
  CMF-EV platform (shared with Nissan Ariya). Winner of the 2023 European Car
  of the Year award, it combines crossover practicality with hatchback efficiency.
  The Megane E-Tech features innovative slim seats, excellent interior space,
  and strong real-world efficiency. Google Built-in integration provides seamless
  connectivity. Available in EV40 (40 kWh) and EV60 (60 kWh) battery options.
  Excellent value proposition in the compact EV segment.

