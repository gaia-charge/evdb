# Notes
notes: |
  The Volkswagen ID.Buzz is VW's electric van inspired by the legendary T1 Microbus (1950-1967).
  It combines retro-futuristic design with modern EV technology, built on the versatile MEB platform.
  
  Available in two wheelbase versions:
  - Standard (4,712mm) - Europe only, 5-seater, 77kWh battery
  - Pro Long (4,962mm) - Global, 5/6/7-seater, 77/86kWh batteries
  
  Key features:
  - Two-tone paint scheme (iconic VW van heritage)
  - Spacious interior with flat floor (no transmission tunnel)
  - ID. Software 3.2 (as of 2024 update)
  - AR Head-Up Display optional
  - 170kW DC fast charging (10-80% in ~30 minutes)
  - Commercial "ID.Buzz Cargo" variant also available
  
  Awards:
  - What Car? Best MPV 2023
  - German Design Award 2023
  - Auto Express Electric Car of the Year 2023 (Highly Commended)
  - Red Dot Design Award 2023
  
  Safety:
  - 5-star Euro NCAP rating (2022)
  - 92% adult occupant protection
  - 89% child occupant protection
  - Comprehensive IQ.DRIVE assist systems
  
  Target market: Families, lifestyle buyers, commercial fleets seeking nostalgic design with modern tech.

