overview: >
  The XPENG G6 is a compact electric SUV coupé competing with the Tesla Model Y and BMW iX1. Built on XPENG's SEPA 2.0 platform with 800V SiC architecture, it enables ultra-fast DC charging up to 451kW (Long Range/Performance) or 382kW (Standard Range). The 2025 facelift brings a refreshed exterior design, updated interior with Xmart OS, and LFP battery chemistry across the range. Available in three variants: Standard Range (68.5kWh, 455km), Long Range (80.8kWh, 525km), and Performance AWD (80.8kWh, 510km). The Performance variant adds a front asynchronous motor for 358kW total output and 4.1s 0-100 km/h, plus air suspension.

