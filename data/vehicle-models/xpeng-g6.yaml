notes: >
  The XPENG G6 2025 facelift (internal code F30) is the version sold in Europe from mid-2025. All variants use LFP (lithium iron phosphate) battery chemistry from CATL for improved thermal safety and longevity. The 800V SiC architecture enables exceptionally fast DC charging — the Long Range and Performance models support up to 451kW, achieving 10-80% in approximately 12 minutes under optimal conditions. The Standard Range supports up to 382kW. 7-year/160,000km vehicle warranty and 8-year/160,000km battery warranty. Manufactured in Zhaoqing, China.

